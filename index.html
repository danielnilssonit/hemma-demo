  selectWord(wi, opts = {}) {
    const w = this.p.words[wi];
    if (!w) return;
    this.atEnd = false;
    const empty = w.cells.find(c => !this.prog.get(c));
    this.select(empty != null ? empty : w.cells[0], w.dir, opts);
  }
  // Det ord som passar bäst när man trycker på en ruta
  bestDir(i) {
    const c = this.p.cells[i];
    if (c.words.A >= 0 && c.words.D < 0) return 'A';
    if (c.words.D >= 0 && c.words.A < 0) return 'D';
    if (this.word >= 0 && this.p.words[this.word].cells.includes(i)) return this.dir;       // i ordet man skriver i
    const starts = c.marks.map(m => this.p.words[m.word].dir);                            // ett ord börjar här
    if (starts.length === 1) return starts[0];
    const openA = !this.prog.wordFull(c.words.A), openD = !this.prog.wordFull(c.words.D);
    if (openA !== openD) return openA ? 'A' : 'D';                                         // det som inte är fyllt
    return 'A';
  }
  tap(i, wi) {
    Sound.unlock();
    this.lastAct = Date.now();
    this.atEnd = false;
    const c = this.p.cells[i];
    if (c.clue) {
      if (!c.parts.length) return;
      // en ruta med två ledtrådar: tryck på den halva man menar (eller tryck igen för den andra)
      let target = wi != null ? wi : c.parts[0];
      if (target === this.word && c.parts.length > 1 && wi == null) target = c.parts.find(x => x !== target);
      this.selectWord(target);
      return;
    }
    // samma ruta igen: byt håll, men inte om det bara var ett darrigt dubbeltryck
    const now = performance.now();
    if (i === this.cur) { if (!this._lastTap || this._lastTap.i !== i || now - this._lastTap.t > 500) this.toggleDir(); }
    else this.select(i, this.bestDir(i));
    this._lastTap = { i, t: now };
  }
  toggleDir() {
    const c = this.p.cells[this.cur];
    if (!c) return;
    const other = this.dir === 'A' ? 'D' : 'A';
    if (c.words[other] >= 0) this.select(this.cur, other);
  }
  nextWord(step) {
    const P = this.p;
    let wi = this.word;
    // hoppa till nästa ord som inte är fyllt (om alla är fyllda: bara nästa)
    for (let k = 0; k < P.words.length; k++) {
      wi = P.nextWord(wi, step);
      if (!this.prog.wordFull(wi)) break;
    }
    this.selectWord(wi);
  }
  input(ch) {
    if (this.readOnly || this.cur < 0) return;
    this.lastAct = Date.now();
    if (this.prog.done) { this.say('Krysset är redan löst. Vill du lösa det igen: välj Börja om i menyn.', 'check'); return; }
    const w = this.p.words[this.word];
    // markören kom inte längre (ordet är slut): skriv inte över det som står, tala om vad man kan göra i stället
    if (this.atEnd) {
      if (this.prog.wordFull(w.i)) this.say('Ordet är klart. Tryck på Nästa, eller på en ny ledtråd.', 'check');
      else this.say('Det finns tomma rutor tidigare i ordet. Tryck på den ruta du vill skriva i.', 'pencil');
      this.nextBtn.classList.add('pulse');
      clearTimeout(this._pt); this._pt = setTimeout(() => this.nextBtn.classList.remove('pulse'), 2400);
      return;
    }
    const i = this.cur;
    const ts = Date.now();
    if (this.prog.set(i, ch, { by: Settings.get('name') || '', ts })) {
      this.checked.delete(i);
      if (this.opts.onEvent) this.opts.onEvent({ type: 'put', cell: i, ch, ts });
    }
    this.hideMsg();
    Sound.play(Settings.get('autoCheck') && this.prog.wrong(i) ? 'wrong' : 'key');
    // nästa ruta i ordet, bara framåt (tomma rutor först om man vill hoppa förbi det som står). Finns ingen stannar
    // markören, och nästa bokstav skriver inte över något.
    const k = w.cells.indexOf(i);
    const nxt = Settings.get('skipFilled') ? w.cells.slice(k + 1).find(c => !this.prog.get(c)) : w.cells[k + 1];
    if (nxt != null) this.cur = nxt;
    else this.atEnd = true;
    this.afterChange(w.i);
  }
  erase() {
    if (this.readOnly || this.cur < 0) return;
    this.lastAct = Date.now();
    this.atEnd = false;
    this.hideMsg();
    if (this.prog.done) { this.say('Krysset är redan löst. Vill du lösa det igen: välj Börja om i menyn.', 'check'); return; }
    let i = this.cur;
    const w = this.p.words[this.word];
    if (!this.prog.get(i) || this.prog.shown.has(i)) {
      const k = w.cells.indexOf(i);
      if (k > 0) i = w.cells[k - 1];
      this.cur = i;
    }
    if (this.prog.get(i) && !this.prog.shown.has(i)) {
      const ts = Date.now();
      this.prog.set(i, '', { ts });
      this.checked.delete(i);
      if (this.opts.onEvent) this.opts.onEvent({ type: 'put', cell: i, ch: '', ts });
      Sound.play('erase');
    }
    this.refresh();
  }
  move(dx, dy) {
    const P = this.p;
    let { x, y } = P.cells[this.cur];
    for (let n = 0; n < Math.max(P.w, P.h); n++) {
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= P.w || y >= P.h) return;
      const c = P.cells[y * P.w + x];
      if (!c.clue) { this.select(c.i, dx ? 'A' : 'D'); return; }
    }
  }
  reveal(what) {
    if (this.cur < 0) return;
    this.lastAct = Date.now();
    this.atEnd = false;
    if (this.prog.done) { this.say('Krysset är redan löst.', 'check'); return; }
    const w = this.p.words[this.word];
    const need = c => this.prog.get(c) !== this.p.cells[c].answer && !this.prog.shown.has(c);
    let cells;
    if (what === 'word') cells = w.cells;
    else cells = need(this.cur) ? [this.cur] : [w.cells.find(need)].filter(c => c != null);
    let n = 0;
    for (const i of cells) {
      if (!need(i)) continue;
      const ts = Date.now();
      this.prog.set(i, this.p.cells[i].answer, { shown: true, ts });
      this.checked.delete(i);
      if (this.opts.onEvent) this.opts.onEvent({ type: 'put', cell: i, ch: this.p.cells[i].answer, ts, shown: true });
      n++;
    }
    if (n) { this.prog.hints += n; this.prog.save(); Sound.play('hint'); this.hideMsg(); }
    else this.say('Det här ordet är redan rätt. Tryck på ett annat ord som du vill ha hjälp med.', 'check');
    if (what === 'cell') {
      const nxt = w.cells.find(c => !this.prog.get(c));
      if (nxt != null) this.cur = nxt;
    }
    this.afterChange(this.word);
  }
  check() {
    const wrong = this.prog.wrongCells();
    this.prog.checks++; this.prog.save();
    wrong.forEach(i => this.checked.add(i));
    this.refresh();
    const n = wrong.length;
    this.say(n ? `${n} ${n === 1 ? 'bokstav är fel' : 'bokstäver är fel'}. De är röda.` : this.prog.filled ? 'Allt du har skrivit är rätt!' : 'Skriv några bokstäver först.', n ? 'pencil' : 'check');
    Sound.play(n ? 'wrong' : 'word');
  }
  afterChange(wi) {
    // ett ord blev klart och rätt: blinka till (bara när fel visas direkt, annars avslöjar det för mycket)
    if (wi != null && wi >= 0 && Settings.get('autoCheck') && this.prog.wordRight(wi)) {
      const cells = this.p.words[wi].cells;
      if (!this._lastRight || this._lastRight !== wi + ':' + cells.map(c => this.prog.get(c)).join('')) {
        this._lastRight = wi + ':' + cells.map(c => this.prog.get(c)).join('');
        this.flash = new Set(cells);
        Sound.play('word');
        clearTimeout(this._ft);
        this._ft = setTimeout(() => { this.flash = null; this.refresh(); }, 650);
      }
    }
    this.refresh();
    this.checkSolved();
  }
  checkSolved() {
    if (this.prog.done) return;
    if (this.prog.isSolved()) {
      this.prog.done = true; this.prog.doneAt = dayStr(); this.prog.save(true);
      Sound.play('solved');
      if (this.opts.onEvent) this.opts.onEvent({ type: 'solved' });
      setTimeout(() => this.opts.onSolved && this.opts.onSolved(), 600);
    } else if (this.prog.isFull() && !Settings.get('autoCheck') && !this._fullTold) {
      this._fullTold = true;
      this.say('Alla rutor är ifyllda, men något stämmer inte än. Tryck på Visa fel för att se vilka.', 'pencil', 9000);
    }
  }
  // Meddelanden: egna rutor, eller värdens (Träffpunkt Hemma har sina egna)
  say(text, ic = 'check', ms = 8000) {
    if (!this.cbMsg) { if (this.opts.toast) this.opts.toast(text, ic); else toast(text, { icon: ic, ms }); return; }
    const x = h('button.kx-cb-x', { type: 'button', 'aria-label': 'Stäng', onclick: () => this.hideMsg() }, icon('x', 20, 2.6));
    this.cbMsg.replaceChildren(icon(ic, 22, 2.4), h('span', text), x);
    this.cbMsg.hidden = false;
    clearTimeout(this._mt);
    this._mt = setTimeout(() => this.hideMsg(), ms);
  }
  hideMsg() { if (this.cbMsg) this.cbMsg.hidden = true; clearTimeout(this._mt); }
  // En bokstav från någon annan (när man löser tillsammans)
  remotePut(i, ch, { ts = Date.now(), by = '', shown = false } = {}) {
    if (ts < this.prog.ts[i]) return;
    this.prog.set(i, ch, { by, ts, shown });
    this.checked.delete(i);
    this.afterChange(-1);
  }
  setPeers(peers) { this.peers = peers; this.refresh(); }
  readClue(manual) {
    if (this.readOnly) return;
    if (!manual && !Settings.get('autoRead')) return;
    clearTimeout(this._rt);
    this._rt = setTimeout(() => Voice.clue(this.p.id, this.word), manual ? 0 : 350);
  }
  physicalKey(e) {
    if (!this.root.isConnected || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (document.querySelector('.sheet-bg')) return;
    const k = e.key;
    if (/^[a-zåäöA-ZÅÄÖ]$/.test(k)) { this.input(k.toUpperCase()); e.preventDefault(); }
    else if (k === 'Backspace' || k === 'Delete') { this.erase(); e.preventDefault(); }
    else if (k === 'ArrowLeft') { this.move(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowRight') { this.move(1, 0); e.preventDefault(); }
    else if (k === 'ArrowUp') { this.move(0, -1); e.preventDefault(); }
    else if (k === 'ArrowDown') { this.move(0, 1); e.preventDefault(); }
    else if (k === ' ') { this.toggleDir(); e.preventDefault(); }
    else if (k === 'Enter' || k === 'Tab') { this.nextWord(e.shiftKey ? -1 : 1); e.preventDefault(); }
  }
  refresh() {
    const wi = this.word;
    const showWrong = Settings.get('autoCheck');
    this.grid.update(this.prog, { cur: this.readOnly ? -1 : this.cur, word: this.readOnly ? (this.opts.focusWord != null ? this.opts.focusWord : -1) : wi, dir: this.dir, showWrong, peers: this.peers, flash: this.flash });
    if (this.checked.size) for (const i of this.checked) if (this.prog.wrong(i)) this.grid.cellEls[i].classList.add('wrong');
    if (this.readOnly || wi < 0) return;
    const w = this.p.words[wi];
    const across = w.dir === 'A';
    this.cbDir.replaceChildren(icon(across ? 'arrow' : 'arrowDown', 28, 2.8), h('span', across ? 'Åt höger' : 'Nedåt'));
    this.cbLen.textContent = `${w.len} bokstäver`;
    if (this.cbText.textContent !== w.text) this.cbText.textContent = w.text;
    this.cbPattern.replaceChildren(...w.cells.map(c => h('span', { class: cx(c === this.cur && 'on', this.prog.shown.has(c) && 'shown', this.prog.wrong(c) && (showWrong || this.checked.has(c)) && 'bad') }, this.prog.get(c) || '')));
    const c = this.p.cells[this.cur];
    this.swapBtn.disabled = !(c && c.words.A >= 0 && c.words.D >= 0);
    if (this.opts.onRefresh) this.opts.onRefresh(this);
  }
  destroy() {
    this.ro.disconnect();
    if (this.ro2) this.ro2.disconnect();
    this.offSettings();
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('pagehide', this.onHide);
    document.removeEventListener('visibilitychange', this.onHide);
    clearInterval(this.tick);
    Voice.stop();
    this.prog.save(true);
  }
}

/* ---- 09-daily.js ---- */
/* ================= Dagens kryss och alla kryss ================= */
// Varje dag har ett Lilla kryss och ett Stora kryss, samma för alla (så att man kan prata om dem med varandra).
// Kryssen går runt i en bestämd ordning från START; ett nytt kryss kommer vid midnatt.
const Daily = (() => {
  const D = {};
  D.START = '2026-09-01';
  const raw = (PUZZLE_DATA && PUZZLE_DATA.puzzles) || [];
  const bySize = { L: raw.filter(p => p.size === 'L' && !p.theme), S: raw.filter(p => p.size === 'S' && !p.theme) };
  // Temakryss (till exempel Trelleborgskrysset): utanför dagens kryss, i en egen lista
  D.themed = () => raw.filter(p => p.theme).map(p => D.get(p.id));
  const cache = new Map();
  D.get = id => {
    if (cache.has(id)) return cache.get(id);
    const d = raw.find(p => p.id === id);
    if (!d) return null;
    const p = new Puzzle(d);
    cache.set(id, p);
    return p;
  };
  D.count = size => bySize[size].length;
  D.forDay = (day = dayStr(), size = 'L') => {
    const list = bySize[size];
    if (!list.length) return null;
    const n = daysBetween(D.START, day);
    return D.get(list[((n % list.length) + list.length) % list.length].id);
  };
  // Vilken dag ett kryss är "dagens" (senaste gången, till och med i dag)
  D.dayOf = id => {
    const p = raw.find(x => x.id === id);
    if (!p || p.theme) return null;
    const list = bySize[p.size], k = list.findIndex(x => x.id === id), n = daysBetween(D.START, dayStr());
    if (n < 0) return null;
    const back = ((n - k) % list.length + list.length) % list.length;
    return addDays(dayStr(), -back);
  };
  // De senaste dagarna (för listan med tidigare kryss)
  D.recent = (days = 21) => Array.from({ length: days }, (_, k) => addDays(dayStr(), -k)).filter(d => daysBetween(D.START, d) >= 0);
  return D;
})();

/* ================= Rutor, meddelanden och små byggstenar ================= */
// Meddelande uppe till höger som försvinner av sig själv
function toast(text, { icon: ic = 'check', ms = 4200 } = {}) {
  let box = $('.toasts');
  if (!box) { box = h('div.toasts', { 'aria-live': 'polite' }); document.body.append(box); }
  const t = h('div.toast', h('span.toast-ic', icon(ic, 26)), h('p', text));
  box.append(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, ms);
  return t;
}

// Ruta mitt på skärmen. Ger {el, close}. Stängs med Esc eller tryck utanför (inte de första 350 ms, så att en
// dubbeltryckning inte stänger den direkt).
function sheet({ title, icon: ic = null, body = [], buttons = [], wide = false, dismiss = true, onClose = null, cls = '' } = {}) {
  const opened = performance.now();
  const bg = h('div.sheet-bg');
  const close = () => { if (!bg.isConnected) return; bg.classList.add('out'); document.removeEventListener('keydown', esc); setTimeout(() => bg.remove(), 200); onClose && onClose(); };
  const esc = e => { if (e.key === 'Escape' && dismiss) close(); };
  const box = h('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title || '', class: cx(wide && 'wide', cls) },
    title && h('header.sheet-h', ic && h('span.sheet-ic', icon(ic, 30)), h('h2', title), dismiss && (() => { const b = btn('', { icon: 'x', kind: 'ghost', cls: 'sheet-x', title: 'Stäng', onClick: close }); b.setAttribute('aria-label', 'Stäng'); return b; })()),
    h('div.sheet-body', body),
    buttons.length && h('footer.sheet-f', buttons.map(b => b instanceof Node ? b : btn(b.label, Object.assign({}, b, { onClick: () => { if (b.keep !== true) close(); b.onClick && b.onClick(); } })))));
  bg.append(box);
  bg.addEventListener('pointerdown', e => { if (e.target === bg && dismiss && performance.now() - opened > 350) close(); });
  document.addEventListener('keydown', esc);
  ($('#app') || document.body).append(bg);
  const f = box.querySelector('footer .btn-primary') || box.querySelector('button');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 50);
  return { el: box, close };
}
function confirmSheet(title, text, { yes = 'Ja', no = 'Nej', icon: ic = 'help', danger = false } = {}) {
  return new Promise(res => {
    let answered = false;
    sheet({ title, icon: ic, body: [h('p.lead', text)], onClose: () => { if (!answered) res(false); },
      buttons: [{ label: yes, kind: danger ? 'danger' : 'primary', big: true, onClick: () => { answered = true; res(true); } }, { label: no, big: true, onClick: () => { answered = true; res(false); } }] });
  });
}

// Stor av/på-knapp med text
function toggleRow(label, text, key, { onChange = null } = {}) {
  const id = 'tg-' + key;
  const input = h('input', { type: 'checkbox', id, checked: !!Settings.get(key) });
  const state = h('span.tgl-state', Settings.get(key) ? 'På' : 'Av');
  input.addEventListener('change', () => { Settings.set(key, input.checked); state.textContent = input.checked ? 'På' : 'Av'; onChange && onChange(input.checked); });
  return h('label.tgl', { for: id }, h('span.tgl-text', h('strong', label), text && h('small', text)), input, h('span.tgl-sw', { 'aria-hidden': 'true' }, h('span')), state);
}
// Val mellan några alternativ (stora knappar)
function choiceRow(label, key, options, { onChange = null } = {}) {
  const row = h('div.choice-row', { role: 'radiogroup', 'aria-label': label });
  const draw = () => row.replaceChildren(...options.map(([v, text]) => {
    const on = Settings.get(key) === v;
    return h('button.chip', { type: 'button', role: 'radio', 'aria-checked': on ? 'true' : 'false', class: on ? 'on' : '', onclick: () => { Settings.set(key, v); draw(); onChange && onChange(v); } }, on && icon('check', 20, 3), text);
  }));
  draw();
  return h('div.choice', h('strong', label), row);
}

// Litet rutnät som bild (på startsidan och i listorna): ledtrådsrutor grå, ifyllda rutor mörka
function miniGrid(p, prog = null, size = 120) {
  const cs = Math.floor(size / Math.max(p.w, p.h));
  const c = h('canvas.mini', { width: p.w * cs * 2, height: p.h * cs * 2, 'aria-hidden': 'true', style: { width: p.w * cs + 'px', height: p.h * cs + 'px' } });
  const g = c.getContext('2d');
  g.scale(2, 2);
  const css = getComputedStyle(document.querySelector('.kk, .senior') || document.body);
  const col = n => css.getPropertyValue(n).trim() || '#888';
  g.fillStyle = col('--g-line'); g.fillRect(0, 0, p.w * cs, p.h * cs);
  for (const cell of p.cells) {
    g.fillStyle = cell.clue ? col('--g-clue') : prog && prog.get(cell.i) ? col('--primary') : col('--g-cell');
    g.fillRect(cell.x * cs + .5, cell.y * cs + .5, cs - 1, cs - 1);
  }
  return c;
}

return {
  forDay: (day, size) => Daily.forDay(day || dayStr(), size),
  themed: () => Daily.themed(),
  get: id => Daily.get(id),
  today: () => dayStr(),

  progress: id => { const p = Daily.get(id); return p ? new Progress(p) : null; },

  mini: (id, size = 120) => { const p = Daily.get(id); return p ? miniGrid(p, new Progress(p), size) : null; },
  settings: Settings,
  say: id => Voice.say(id)
};

/* ================= Spelen i plattan ================= */
// Spelen öppnas i helskärm i plattan, med plattans rubrikrad: märket, spelets namn och Tillbaka. Vid ett bord på
// Spelstunden visar raden också de andra vid bordet, mikrofonen och textningen.
// Canasta, Yatzy, Fia med knuff och Patiens är Träffpunkt Hemmas egna kopior av klubbspelen, i games/<id>/. De körs i
// en egen ram och pratar med plattan med meddelanden (postMessage): plattan skickar namnet, bordet och
// inställningarna, och spelet berättar vad som händer (en canasta, någon gick ut, partiet är slut).
// Spel som är byggda direkt i plattan (till exempel korsordet) anmäler sig med Player.register och visas i samma ram.
//   Player.register('korsord', { view: KryssView, card: KryssCard })   view fyller ramen, card är rutan på Spela
//   Player.open('korsord')   öppnar spelet     Player.close()   tillbaka till plattan
// table: spelet används också vid Spelstundens bord (Yatzy vid bordet är plattans egen, 13-senior-play.js)
const FORKS = {
  canasta: { src: 'games/canasta/index.html', table: true },
  yatzy: { src: 'games/yatzy/index.html', table: false },
  fia: { src: 'games/fia/index.html', table: true },
  patiens: { src: 'games/patiens/index.html', table: true }
};
const PLAYERS = {};
const Player = {
  register(id, { view = null, card = null } = {}) { PLAYERS[id] = { view, card }; },
  has: id => !!(FORKS[id] || (PLAYERS[id] && PLAYERS[id].view)),
  card: id => (PLAYERS[id] && PLAYERS[id].card) || null,
  cards: () => Object.keys(PLAYERS).filter(id => PLAYERS[id].card).map(id => ({ id, Card: PLAYERS[id].card })),
  open(id, opts = {}) {
    if (!Player.has(id)) return;
    mut(s => { s.senior.game = Object.assign({ id }, opts); s.senior.idle = false; });
    Sound.play('soft');
  },
  close() { mut(s => { s.senior.game = null; }); },
  // Det som visas just nu: ett spel man har öppnat själv, eller spelet vid bordet på Spelstunden
  current(s) {
    if (s.room && s.room.kind === 'table' && s.senior.route === 'spela' && s.senior.sub === 'bord') {
      const tb = s.spel.tables.find(x => x.id === s.room.id);
      return tb && FORKS[tb.game] && FORKS[tb.game].table ? { id: tb.game, mode: 'table', tb } : null;
    }
    return s.senior.game ? { id: s.senior.game.id, mode: 'solo' } : null;
  }
};

// Ett spel som är byggt direkt i plattan (korsordet) får inte ta med sig hela sidan om något går fel i det: då
// syns bara reservinnehållet på dess plats (ingenting på Spela, ett meddelande i spelramen).
function Safe({ C, props = {}, fallback = null }) {
  const [err] = htmPreact.useErrorBoundary(e => console.error(e));
  return err ? fallback : html`<${C} ...${props} />`;
}

function GamePlayer({ gp }) {
  const s = useApp();
  const g = game(gp.id), tb = gp.tb;
  const P = PLAYERS[gp.id];
  const title = tb ? `${g.name} vid bordet ${tb.name}` : g.name;
  const race = tb && gp.id === 'patiens';
  useEffect(() => race ? raceWatch(tb) : undefined, [race, tb && tb.id]);
  return html`<div class=${cx('gplay', tb && 'gplay-table')} role="region" aria-label=${title}>
    <header class="gplay-bar">
      <span class="gplay-brand"><${Logo} size=${42} lit=${s.me.lamp} dark /><span>Träffpunkt<br />Hemma</span></span>
      <span class="gplay-game">${g.icon && html`<img src=${g.icon} alt="" width="44" height="44" />`}<strong>${title}</strong></span>
      ${tb && html`<span class="gplay-seats">${tb.seats.map(id => html`<span class="gplay-seat" key=${id}>
        <${Avatar} id=${id} size=${40} speaking=${s.room && s.room.speaking === id} muted=${id === 'ingrid' && s.me.muted} /><small>${id === 'ingrid' ? 'Du' : firstName(id)}</small>${race && html`<b class=${cx('gplay-pct', racePct(s, id) >= 100 && 'done')}>${racePct(s, id) >= 100 ? 'Klar!' : racePct(s, id) + ' %'}</b>`}</span>`)}</span>`}
      <span class="gplay-actions">
        ${tb ? html`<${Btn} kind=${s.me.muted ? 'danger' : 'ok'} icon=${s.me.muted ? 'micOff' : 'mic'} onClick=${Act.toggleMute} cls="gplay-mic">${s.me.muted ? 'Sätt på mikrofonen' : 'Stäng av mikrofonen'}</${Btn}>
            <${Btn} kind="danger" icon="door" onClick=${Act.leaveRoom}>Lämna bordet</${Btn}>`
          : html`<${Btn} kind="lamp" big icon="left" onClick=${Player.close}>Tillbaka</${Btn}>`}
      </span>
    </header>
    <div class="gplay-body">
      ${P && P.view ? html`<${Safe} C=${P.view} props=${{ id: gp.id, close: Player.close }} fallback=${html`<div class="gframe-note"><img src=${g.icon} alt="" width="96" height="96" /><p>${g.name} gick inte att öppna här.</p></div>`} />`
        : html`<${GameFrame} key=${gp.id + ':' + (tb ? tb.id : 'solo')} gp=${gp} />`}
    </div>
    ${tb && s.settings.captions && html`<${TableCaption} />`}
  </div>`;
}

// Det senaste som sades vid bordet, som text under spelet
function TableCaption() {
  const s = useApp();
  const c = s.room && s.room.captions[s.room.captions.length - 1];

// Spelet i en egen ram. Lokalt och på GitHub Pages laddas sidan direkt (src). I artefakten får ramen inte ladda en
// sida själv: där hämtas sidan och läggs in som srcdoc, med <base> så att musiken hittas. Svarar spelet inte provas
// det andra sättet, och till sist visas ett meddelande.
function GameFrame({ gp }) {
  const ref = useRef(null);
  const [state, setState] = useState('load');
  const g = game(gp.id);
  useEffect(() => {
    const fr = ref.current;
    if (!fr) return;
    const src = FORKS[gp.id].src;
    let alive = true, ready = false, inlined = false;
    const post = msg => { try { fr.contentWindow.postMessage(Object.assign({ thHemma: 1 }, msg), '*'); } catch (e) { /* ramen är stängd */ } };
    const onMsg = e => {
      const d = e.data;
      if (!fr.contentWindow || e.source !== fr.contentWindow || !d || typeof d !== 'object' || d.thGame !== gp.id) return;
      if (d.t === 'ready') { ready = true; setState('ok'); post(gameConfig(gp)); }
      else if (d.t === 'leave') Act.leaveRoom();
      else if (d.t === 'spelstund') { Player.close(); Act.go('spela'); }
      else if (d.t === 'event') gameEvent(gp, d);
      else if (d.t === 'key') Tour.key(d.key);   // presentationsklickern medan spelet har fokus
    };
    window.addEventListener('message', onMsg);
    const offSound = Bus.on('sound', on => post({ t: 'sound', on }));
    const inline = async () => {
      if (inlined || !alive) return;
      inlined = true;
      try {
        const r = await fetch(src);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const text = await r.text();
        if (!alive) return;
        const base = new URL(src.replace(/[^/]*$/, ''), document.baseURI).href;
        fr.removeAttribute('src');
        fr.srcdoc = text.replace(/<head>/i, `<head><base href="${base}">`);
      } catch (e) { /* det andra sättet provas efter en stund */ }
    };
    const direct = () => { if (!alive || ready) return; fr.removeAttribute('srcdoc'); fr.src = src; };
    if (INLINE_GAMES) inline(); else direct();
    const t1 = setTimeout(() => { if (!ready) (INLINE_GAMES ? direct : inline)(); }, 7000);
    const t2 = setTimeout(() => { if (alive && !ready) setState('fail'); }, 16000);
    return () => { alive = false; clearTimeout(t1); clearTimeout(t2); offSound(); window.removeEventListener('message', onMsg); };
  }, []);
  return html`<div class="gframe">
    <iframe ref=${ref} class="gframe-if" title=${g.name} allow="autoplay; fullscreen; screen-wake-lock"></iframe>
    ${state === 'load' && html`<div class="gframe-note"><img src=${g.icon} alt="" width="96" height="96" /><p>Öppnar ${g.name} …</p></div>`}
    ${state === 'fail' && html`<div class="gframe-note"><img src=${g.icon} alt="" width="96" height="96" /><p>${g.name} gick inte att öppna här.</p>
      <${Btn} kind="lamp" icon="left" onClick=${() => (gp.mode === 'table' ? Act.leaveRoom() : Player.close())}>Tillbaka</${Btn}></div>`}
  </div>`;
}

// Inställningarna som spelet får från plattan
function gameConfig(gp) {
  const s = App.s;
  // (rösterna i spelen finns bara på webben: artefakten får högst 255 filer)
  const cfg = { t: 'init', mode: gp.mode, me: { name: firstName('ingrid'), av: initials('ingrid') }, size: s.settings.size, calm: true, sound: PREFS.sound, music: gp.mode !== 'table', voice: !INLINE_GAMES };
  if (gp.mode === 'table') {
    const tb = gp.tb;
    const others = tb.seats.filter(id => id !== 'ingrid');
    // med fyra spelar plats 1 och 3 ihop: vännen man ville sitta med blir partner
    const friend = s.spel.signups.ingrid && s.spel.signups.ingrid.friend;
    if (others.length === 3 && others.includes(friend)) { others.splice(others.indexOf(friend), 1); others.splice(1, 0, friend); }
    cfg.table = { name: tb.name, seats: ['ingrid', ...others].map(id => ({ name: firstName(id), av: initials(id) })), level: 'medel', target: 1500 };
  } else {
    const sp = s.spel;
    cfg.next = sp.phase === 'closed' ? { title: 'Spela med andra', text: 'Spelstunden är i dag kl. 14.00. Du väljer spel kl. 13.30.', label: 'Till Spelstunden' }
      : sp.phase === 'signup' ? { title: 'Anmälan är öppen', text: 'Spelstunden börjar kl. 14.00. Välj spel nu, så får du ett bord.', label: 'Välj spel' }
      : sp.phase === 'playing' ? { title: 'Spelstunden pågår', text: 'I morgon kl. 13.30 kan du anmäla dig igen.', label: null }
      : { title: 'Spela med andra', text: 'Nästa Spelstund är i morgon kl. 14.00.', label: null };
  }
  return { thHemma: 1, ...cfg };
}

// Bordet pratar om det som händer i spelet (i demon som text; i tjänsten är det de riktiga rösterna)
function gameEvent(gp, d) {
  const s = App.s;
  if (gp.mode !== 'table' || !s.room || s.room.kind !== 'table') return;
  // Patiens: hur långt Ingrid har kommit (visas vid hennes namn i rubrikraden)
  if (d.kind === 'progress') { mut(x => { if (x.room) x.room.race = Object.assign({ me: 0, done: {} }, x.room.race, { me: clamp(+d.done || 0, 0, 100) }); }); return; }
  if (d.kind === 'over' && gp.id === 'patiens') mut(x => { if (x.room) x.room.race = Object.assign({ me: 0, done: {} }, x.room.race, { me: 100 }); });
  if (s.room.speaking) return;
  const tb = gp.tb, others = tb.seats.filter(id => id !== 'ingrid');
  const byName = n => others.find(id => firstName(id) === n);
  const any = () => pick(others);
  let who = null, text = '';
  if (d.kind === 'canasta') {
    if (d.mine) { who = any(); text = pick(['Snyggt, Ingrid! Där kom en canasta.', 'Vilken fin canasta, Ingrid!', 'Oj, en canasta. Bra där, Ingrid!']); }
    else if (byName(d.who)) { who = byName(d.who); text = pick(d.natural ? ['En ren canasta! Det var länge sedan.', 'Titta, en ren canasta!'] : ['Där satt den, en canasta!', 'Äntligen en canasta.']); }
  } else if (d.kind === 'hand') {
    if (d.outMine) { who = any(); text = pick(['Du gick ut, Ingrid! Bra spelat.', 'Där gick Ingrid ut. Snyggt!']); }
    else if (byName(d.out)) { who = byName(d.out); text = pick(['Så, nu gick jag ut!', 'Förlåt allihop, jag gick ut.']); }
  } else if (d.kind === 'knuff') {
    if (d.mine && byName(d.victim)) { who = byName(d.victim); text = pick(['Nämen Ingrid! Där åkte jag hem.', 'Aj då, knuffad hem igen.', 'Oj, du tog mig! Jag ska hämnas.']); }
    else if (d.meHit && byName(d.who)) { who = byName(d.who); text = pick(['Förlåt, Ingrid! Knuff!', 'Knuff! Det var inte meningen, Ingrid.']); }
    else if (byName(d.victim)) { who = byName(d.victim); text = pick(['Aj, knuffad igen!', 'Nej men, hem igen.']); }
  } else if (d.kind === 'goal') {
    if (d.mine) { who = any(); text = pick(['Snyggt, Ingrid, en till i mål!', 'Där gick den i mål. Bra, Ingrid!']); }
    else if (byName(d.who)) { who = byName(d.who); text = pick(['Så, en pjäs i mål.', 'Hem i mål, äntligen!']); }
  } else if (d.kind === 'over' && gp.id === 'patiens') {
    const first = !others.some(id => racePct(s, id) >= 100);
    who = any(); text = first ? pick(['Grattis, Ingrid! Du blev klar först.', 'Oj, Ingrid var först! Snyggt.']) : pick(['Snyggt, Ingrid! Din gick också ut.', 'Bra, Ingrid! Nu är du också klar.']);
  } else if (d.kind === 'over') {
    who = any();
    const team = (d.winners || []).length > 1;
    text = d.won ? pick([team ? 'Grattis, Ingrid! Ni vann.' : 'Grattis, Ingrid! Du vann.', 'Bra spelat, Ingrid. Tack för partiet!']) : pick(['Tack för spelet allihop!', 'Det var ett fint parti. Samma tid i morgon?']);
  }
  if (who && text) Act.tableLine(who, text);
}

// Patiens vid bordet: alla spelar samma giv och tävlar om att bli klar först. Hur långt Ingrid har kommit berättar
// spelet. De andras framsteg räknas fram i demon: var och en har sin egen takt (tre till åtta minuter), och ungefär
// var tredje kör fast på vägen, precis som i verkligheten.
function racePace(id) {
  let h = 7;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return { secs: 180 + h % 300, cap: h % 3 === 0 ? 70 + h % 22 : 100 };
}
function racePct(s, id) {
  if (!s.room) return 0;
  if (id === 'ingrid') return s.room.race ? s.room.race.me || 0 : 0;
  const { secs, cap } = racePace(id);
  return Math.min(cap, Math.round(Math.max(0, s.t - s.room.since) / secs * 100));
}
// Den som blir klar säger det vid bordet (en gång)
function raceWatch(tb) {
  const others = tb.seats.filter(id => id !== 'ingrid');
  const iv = setInterval(() => {
    const s = App.s;
    if (!s.room || s.room.kind !== 'table' || s.room.speaking) return;
    const id = others.find(x => racePct(s, x) >= 100 && !(s.room.race && s.room.race.done && s.room.race.done[x]));
    if (!id) return;
    const first = !others.some(x => x !== id && s.room.race && s.room.race.done && s.room.race.done[x]) && racePct(s, 'ingrid') < 100;
    mut(x => { if (x.room) { x.room.race = Object.assign({ me: 0, done: {} }, x.room.race); x.room.race.done = Object.assign({}, x.room.race.done, { [id]: true }); } });
    Act.tableLine(id, first ? pick(['Klar! Min gick ut.', 'Titta, nu gick min ut!']) : pick(['Så, nu är jag också klar.', 'Min gick ut till slut!']));
  }, 2000);
  return () => clearInterval(iv);
}

// Grattis! Förslag på nästa kryss (bara "i morgon" när båda dagens kryss är lösta)
function KryssSolved({ p, onClose, onGo }) {
  const day = Korsord.today();
  const other = p.theme ? Korsord.forDay(day, 'L') : Korsord.forDay(day, p.size === 'L' ? 'S' : 'L');
  const otherDone = other && Korsord.status(other.id).key === 'done';
  const prog = Korsord.progress(p.id);
  const mins = Math.max(1, Math.round(prog.secs / 60));
  const help = prog.hints ? `med ${prog.hints} ${prog.hints === 1 ? 'hjälpbokstav' : 'hjälpbokstäver'}` : 'helt utan hjälp';
  return html`<div class="modal kryss-modal kryss-solved" role="dialog" aria-modal="true" aria-label="Krysset är löst">
    <span class="kryss-star"><${Icon} n="star" size=${88} sw=${1.6} /></span>
    <h2>Snyggt! Krysset är löst.</h2>
    <p class="lead">Du löste ${p.title.toLowerCase()} på ${mins === 1 ? '1 minut' : mins + ' minuter'}, ${help}.</p>
    <p>${other && !otherDone ? `${other.title} väntar också, om du vill.` : 'I morgon kommer två nya kryss.'}</p>
    <footer class="row center">
      ${other && !otherDone && html`<${Btn} kind="primary" big icon="pencil" onClick=${() => onGo(other.size)}>Till ${other.title.toLowerCase()}</${Btn}>`}

      <${Btn} big icon="eye" onClick=${onClose}>Titta på krysset</${Btn}>
    </footer>
  </div>`;
}

    return html`<div class="room call-room">
      <header class="room-h"><div><h1>${connected ? 'Samtal med ' + fullName(r.with) : 'Ringer ' + fullName(r.with) + '…'}</h1><p>${r.with === 'anna' ? 'ditt barnbarn' : person(r.with).ort || person(r.with).role} · ${connected ? dur : 'väntar på svar'}</p></div><${MicPill} /><span class="room-clock">kl. ${clockStr(s.t)}</span></header>
      <div class="call-tiles">
        <div class=${cx('tile', 'tile-big', r.speaking === r.with && 'talking')}><${Avatar} id=${r.with} size=${170} speaking=${r.speaking === r.with} /><strong>${fullName(r.with)}</strong></div>
        <div class="tile tile-me"><${Avatar} id="ingrid" size=${110} muted=${s.me.muted} /><strong>Du</strong></div>
      </div>
      ${r.silent && connected && html`<p class="note center">I demon är det här samtalet tyst. Karin, Lena och barnbarnet Anna ringer upp med röst, och supporten svarar med röst.</p>`}
      <${Captions} />
      <${RoomControls} kind="call" />
    </div>`;
  }
  const f = fikaItem(s.t);
  const inside = [...new Set([f && f.host, ...inFika()].filter(Boolean))].filter(id => !r.gone.includes(id));
  return html`<div class="room fika-room">
    <header class="room-h"><div><h1>Fikarummet</h1><p>${f ? `Värd: ${fullName(f.host)}` : ''} · ${inside.length + 1} personer · ${stay}</p></div><${MicPill} /><span class="room-clock">kl. ${clockStr(s.t)}</span></header>
    <div class="tiles">
      ${inside.map(id => html`<div class=${cx('tile', r.speaking === id && 'talking')} key=${id}>
        <${Avatar} id=${id} size=${104} speaking=${r.speaking === id} lamp=${P(id).lamp} />
        <strong>${fullName(id)}</strong><small>${STAFF[id] ? 'Värd' : person(id).ort}</small>
      </div>`)}
      <div class="tile tile-me"><${Avatar} id="ingrid" size=${104} muted=${s.me.muted} /><strong>Du</strong><small>${s.me.muted ? 'Mikrofonen är av' : 'De andra hör dig'}</small>
        ${r.wave && performance.now() - r.wave < 4000 && html`<span class="tile-wave"><${Icon} n="hand" size=${44} /></span>`}</div>
    </div>
    <${Captions} />
    <${RoomControls} kind="fika" />
  </div>`;
}

}
// Sortering: den tråd där det senast hände något först (dagar sedan, sedan klockslag)
const lastActivity = th => { const p = th.posts[th.posts.length - 1]; return p.days * 86400 - p.t; };

function ThreadView({ id }) {
  const s = useApp();
  const th = s.forum.find(x => x.id === id);
  const [reading, setReading] = useState(null);
  const read = async (i) => {
    const key = `post_${th.id}_${i}`;
    Voice.stop('read');
    setReading(i);
    await Voice.say('read', key);
    setReading(r => r === i ? null : r);
  };
  useEffect(() => { if (App.s.settings.readAloud && Voice.has(`post_${id}_0`)) read(0); return () => Voice.stop('read'); }, [id]);
  return html`<div class="pg thread">
    <div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => { Voice.stop('read'); mut(x => { x.senior.thread = null; }); }}>Tillbaka till Anslagstavlan</${Btn}></div>
    <header class="pg-head"><p class="eyebrow">${FORUM_CATS.find(c => c.id === th.cat).name}</p><h1>${th.title}</h1></header>
    <ol class="posts">
      ${th.posts.map((p, i) => html`<li class=${cx('post', p.staff && 'staff', p.mine && 'mine', reading === i && 'reading')} key=${i}>
        <${Avatar} id=${p.by} size=${58} />
        <div class="post-b">
          <p class="post-who"><strong>${p.mine ? 'Du' : fullName(p.by)}</strong>${p.staff ? html`<em class="pill">Personal</em>` : ''}<small>${person(p.by).ort || person(p.by).role || ''} · ${daysAgoStr(p.days, p.t)}</small></p>
          <p class="post-t">${p.text}</p>
          <div class="row">
            ${Voice.has(`post_${th.id}_${i}`) && html`<${Btn} small icon=${reading === i ? 'pause' : 'speaker'} onClick=${() => reading === i ? (Voice.stop('read'), setReading(null)) : read(i)}>${reading === i ? 'Sluta läsa' : 'Läs upp'}</${Btn}>`}
            <button type="button" class=${cx('react', p.liked && 'on')} onClick=${() => Act.like(th.id, i)} aria-pressed=${!!p.liked}><${Icon} n="heart" size=${20} />Gilla<b>${p.likes || ''}</b></button>
          </div>
        </div>
      </li>`)}
    </ol>
    <section class="card reply">
      <h2 class="card-h"><${Icon} n="pencil" size=${24} />Skriv ett svar</h2>
      <${Composer} id="svar-tavla" placeholder="Skriv här, eller tryck på Tala in" example=${th.id === 'gummi' ? FORUM_SPOKEN : 'Vad roligt att läsa! Jag minns också hur det var.'} sendLabel="Skicka" onSend=${t => Act.forumReply(th.id, t)} />
    </section>
  </div>`;
}

// Veckoprogrammet där dagens dag är samma som demodagens program
function weekView() {

}

function LivePage() {
  const s = useApp();
  const sub = s.senior.sub;
  if (sub === 'watch') return html`<${LiveWatch} />`;

  if (sub && sub.startsWith('rec:')) return html`<${RecView} id=${sub.slice(4)} />`;
  const gympa = s.t >= T(10, 30) && s.t < T(10, 50);
  return html`<div class="pg live">

        <${Btn} kind="primary" big icon="tv" onClick=${() => Act.liveWatch(true)}>Var med på bingon</${Btn}></div></section>`}

      <strong>${b.title}</strong><small>${b.who}${b.min ? ' · ' + b.min + ' min' : ''}</small></button>`)}</div>
  </div>`;

function LiveWatch() {
  const s = useApp();
  const L = s.live;
  const note = L.note && performance.now() - (L.noteAt || 0) < 5000 ? L.note : null;
  useEffect(() => { if (!note) return; const t = setTimeout(() => App.emit(), 5100); return () => clearTimeout(t); }, [L.noteAt]);
  if (!L.on) return html`<div class="pg"><div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => Act.liveWatch(false)}>Tillbaka</${Btn}></div>
    <section class="card"><h2>Sändningen är slut</h2><p>Tack för att du var med! Nästa bingo är på söndag kl. 15.00.</p></section></div>`;
  const card = L.cards.ingrid || [];
  const won = L.status === 'won' && L.winners.length ? L.winners[L.winners.length - 1] : null;
  const wonLine = won === 'ingrid' && L.claim ? L.claim.line : null;
  const hasLine = !!Bingo.line(card, n => L.marked.includes(n) && L.called.includes(n));
  const last = L.called.slice(-5).reverse();
  return html`<div class="live-watch">
    <header class="room-h"><div><h1>Bingo från träffpunkten</h1><p>${VENUES.centrum.name} · runda ${L.round} · ${L.home.length} hemma, 23 i salen</p></div>
      <${Btn} kind="danger" icon="door" onClick=${() => Act.liveWatch(false)}>Lämna sändningen</${Btn}></header>
    <div class="lw">
      <div class="lw-left">
        <div class="video"><${LiveScene} kind="bingo" number=${L.current} home=${L.home.length} /><span class="live-badge">Live</span>
          ${L.status === 'intro' && html`<span class="video-sub">Mats hälsar välkommen</span>`}</div>
        <div class="lw-greet">
          <p><strong>Hälsa till salen.</strong> Mats läser upp din hälsning, och den syns på tv:n.</p>
          <div class="greet-btns">${QUICK_LIVE.map((g, i) => html`<button type="button" class=${cx('chip', s.me.sentLive.includes(i) && 'on')} onClick=${() => Act.liveGreet(i)} disabled=${s.me.sentLive.includes(i)}>${g}</button>`)}
            <${Btn} kind="lamp" icon="hand" onClick=${Act.wave}>Vinka</${Btn}></div>
        </div>
        <${Toggle} id="automark" on=${s.settings.autoMark} onChange=${Act.setAuto} label="Hjälp mig markera" text="Plattan markerar numren åt dig." />
      </div>
      <aside class="lw-right">
        <div class="bingo-now">
          <span class="ball big">${L.current ? html`<small>${Bingo.letter(L.current)}</small>${L.current}` : '–'}</span>
          <div><p class="muted">Senaste numren</p><div class="balls">${last.slice(1).map(n => html`<span class="ball">${Bingo.letter(n)}${n}</span>`)}</div></div>
        </div>
        <div class="bcard" role="grid" aria-label="Din bingobricka">
          ${['B', 'I', 'N', 'G', 'O'].map(l => html`<span class="bc-h">${l}</span>`)}
          ${card.map((n, i) => {
            const marked = n === 0 || L.marked.includes(n);
            const called = n && L.called.includes(n);
            return html`<button type="button" key=${i} class=${cx('bc', n === 0 && 'free', marked && 'marked', called && !marked && 'called', wonLine && wonLine.includes(i) && 'line')}
              onClick=${() => n && Act.mark(n)} disabled=${n === 0} aria-label=${n === 0 ? 'Fri ruta' : `${Bingo.letter(n)} ${n}${marked ? ', markerad' : ''}`}>
              ${n === 0 ? html`<${Icon} n="star" size=${26} />` : n}</button>`;
          })}
        </div>
        <p class="bc-status" aria-live="polite">${L.status === 'check' ? (L.claim && L.claim.by === 'ingrid' ? 'Mats kontrollerar din bricka…' : `${firstName(L.claim.by)} ropade bingo! Mats kontrollerar…`)
          : note || (hasLine || L.hint >= 2 ? 'Du har fem i rad! Tryck på BINGO.' : L.called.length ? 'Tryck på ett nummer när det ropas.' : 'Snart börjar det.')}</p>
        <${Btn} kind="lamp" big icon="star" cls=${cx('bingo-btn', (hasLine || L.hint >= 2) && 'pulse')} onClick=${Act.claim} disabled=${L.status !== 'calling'}>BINGO!</${Btn}>
      </aside>
    </div>
    ${won && html`<div class=${cx('bingo-win', won === 'ingrid' && 'me')}><${Icon} n="star" size=${80} sw=${1.6} />
      <h2>${won === 'ingrid' ? 'BINGO! Grattis, Ingrid!' : `${fullName(won)} fick bingo!`}</h2>
      <p>${won === 'ingrid' ? 'Hela salen på träffpunkten applåderar.' : `${person(won).ort}, med hemifrån. Snart börjar en ny runda.`}</p></div>`}
  </div>`;
}

function LiveModal() {

  return html`<div class="modal live-m" role="dialog" aria-modal="true" aria-label="Bingon börjar">

  </div>`;
}

function GympaView() {
  const [i, setI] = useState(0);
  // Eva leder rörelserna en i taget, med en paus att göra dem på
  useEffect(() => {
    let alive = true;
    (async () => {
      for (let k = 0; alive; k = (k + 1) % GYMPA.length) {
        setI(k);
        await Voice.say('gympa', 'gympa_' + k);
        if (alive) await sleep(3500);
      }
    })();
    return () => { alive = false; Voice.stop('gympa'); };
  }, []);
  return html`<div class="pg gympa">
    <div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => Act.go('live')}>Tillbaka till Sändningar</${Btn}></div>
    <div class="video wide"><${LiveScene} kind="gympa" /><span class="live-badge">Live</span></div>
    <p class="gympa-cap"><${Avatar} id="eva" size=${44} /><strong>Eva:</strong> ${GYMPA[i]}</p>
    <p class="note">Sittgympan leds av en fysioterapeut på Träffpunkt Trelleborg. Den som är där sitter i salen, den som är hemma gör samma rörelser vid köksbordet.</p>
  </div>`;
}

function RecView({ id }) {
  const b = BROADCASTS.find(x => x.id === id) || BROADCASTS[0];
  const [p, setP] = useState(0);
  const [play, setPlay] = useState(true);
  useEffect(() => { if (!play) return; const iv = setInterval(() => setP(x => Math.min(100, x + .4)), 200); return () => clearInterval(iv); }, [play]);
  return html`<div class="pg rec-view">
    <div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => Act.go('live')}>Tillbaka till Sändningar</${Btn}></div>
    <h1>${b.title}</h1><p class="lead">${b.who}${b.min ? ' · ' + b.min + ' minuter' : ''}</p>

    <div class="player"><${Btn} kind="primary" icon=${play ? 'pause' : 'play'} onClick=${() => setPlay(!play)}>${play ? 'Pausa' : 'Spela'}</${Btn}><span class="rec-prog"><i style=${{ width: p + '%' }}></i></span></div>
    <p class="note">${b.art === 'arkiv' ? 'Här kan filmerna från kommunens digitala träffpunkt samlas, så att de är lätta att hitta för den som har en platta.' : 'I tjänsten spelas inspelningen här. I demon visas en bild.'}</p>
  </div>`;
}

// Vilka som bor nära, för att det ska bli lättare att ses på riktigt. Bara ort och ungefärligt avstånd visas,
// aldrig adressen, och bara för dem som själva valt att synas här. Plattan står hemma, så ingen GPS behövs.

const HIDDEN_ORT = ['stig', 'ulla', 'svenerik'];   // har valt att inte visa sin ort
const SEED_FLOWERS = [{ from: 'sonja', text: 'Tack för i tisdags!', days: 2 }, { from: 'karin', text: 'Kram, vi ses snart!', days: 4 }];

function PeoplePage() {
  const s = useApp();
  const tab = s.senior.people || 'nara';
  return html`<div class="pg people">
    <header class="pg-head"><h1>Grannar och vänner</h1><p class="lead">Se vilka som bor nära dig, och föreslå att ni ses på riktigt.</p></header>
    <${Tabs} value=${tab} onChange=${v => mut(x => { x.senior.people = v; })} tabs=${[{ id: 'nara', label: 'Nära mig', icon: 'pin' }, { id: 'vanner', label: 'Mina vänner', icon: 'heart' }]} />
    ${tab === 'nara' ? html`<${NearTab} />` : html`<${FriendsTab} />`}
  </div>`;
}

function NearTab() {
  const s = useApp();
  const [ort, setOrt] = useState(null);
  const shown = PEOPLE.filter(p => !p.me && !HIDDEN_ORT.includes(p.id));
  const list = shown.map(p => ({ id: p.id, km: distanceKm('ingrid', p.id) })).filter(x => !ort || person(x.id).ort === ort).sort((a, b) => a.km - b.km);
  const byOrt = {};
  shown.forEach(p => { byOrt[p.ort] = (byOrt[p.ort] || 0) + 1; });
  const newbie = PEOPLE.find(p => p.isNew);
  return html`<div class="near">
    <div class="near-map card">
      <${KommunMap} counts=${byOrt} active=${ort} onPick=${o => setOrt(ort === o ? null : o)} />
      <p class="map-note"><${Icon} n="shield" size=${22} />Kartan visar bara orter, inga adresser.</p>
    </div>
    <div class="near-list">
      ${newbie && !ort && html`<section class="card newbie"><${Avatar} id=${newbie.id} size=${64} /><div><p class="eyebrow">Ny i ${newbie.ort}</p><h3>${fullName(newbie.id)} är ny här</h3><p class="muted">Hon bor ${kmStr(distanceKm('ingrid', newbie.id))} från dig. Säg hej, så känner hon någon när hon kommer till träffpunkten.</p></div>
        ${(s.me.welcomed) ? html`<span class="done"><${Icon} n="check" size=${22} />Välkommen sagt</span>` : html`<${Btn} kind="primary" icon="wave" onClick=${() => mut(x => { x.me.welcomed = true; Sound.play('flower'); Sim.toast(x, { who: newbie.id, text: 'Solveig blev glad för din hälsning. Hon vill gärna följa med till träffpunkten.' }); })}>Säg välkommen</${Btn}>`}</section>`}
      <h2 class="sec-h">${ort ? `Deltagare i ${ort}` : 'Närmast dig'}</h2>
      <ul class="plist near-ul">${list.slice(0, ort ? 12 : 7).map(x => {
        const inv = (s.me.invites || []).find(i => i.to === x.id);
        return html`<li key=${x.id}>
          <${Avatar} id=${x.id} size=${56} online=${!!P(x.id).online} lamp=${P(x.id).lamp && P(x.id).online} />
          <${Who} id=${x.id} sub=${`${person(x.id).ort} · ${kmStr(x.km)}`} />
          ${inv ? html`<span class=${cx('done', inv.status === 'sent' && 'wait')}><${Icon} n=${inv.status === 'yes' ? 'check' : 'clock'} size=${22} />${inv.status === 'yes' ? 'Tackade ja' : 'Förslag skickat'}</span>`
            : html`<${Btn} kind="primary" icon="wave" onClick=${() => mut(z => { z.senior.sheet = { kind: 'invite', to: x.id }; })}>Föreslå att ses</${Btn}>`}
        </li>`;
      })}</ul>
      <p class="muted small">${HIDDEN_ORT.length} deltagare har valt att inte visa sin ort. Du ändrar själv under Mitt konto.</p>
    </div>
  </div>`;
}

function InviteSheet({ sh }) {
  const to = sh.to;
  const venue = person(to).ort === 'Anderslöv' ? VENUES.anderslov.name : VENUES.centrum.name;
  const OPTS = [['traff', 'cup', `Ses på ${venue.charAt(0).toLowerCase() + venue.slice(1)}`, 'Ni går dit tillsammans, eller ses där.'],

// Den schematiska kartan: kusten, havet och orterna (storleken på pricken = antal deltagare där)
// Var ortens namn står i förhållande till pricken (så att namnen inte krockar)
const LABEL_AT = { 'Trelleborg': 'left', 'Gislöv': 'right', 'Smygehamn': 'left', 'Beddingestrand': 'above', 'Klagstorp': 'above', 'Skåre': 'below', 'Skegrie': 'above', 'Västra Alstad': 'above', 'Anderslöv': 'above' };
const COAST = 'M0,222 C25,248 45,272 66,281 C120,290 175,293 229,294 C265,296 290,300 318,306 C370,320 420,345 454,363 C480,356 505,336 536,321 C570,305 605,285 632,268 L632,400 L0,400 Z';
function KommunMap({ counts, active, onPick }) {
  const me = PLACES['Anderslöv'];
  const [mx, my] = mapXY(me.lat, me.lon);
  return html`<svg class="kmap" viewBox="0 0 632 400" role="img" aria-label="Schematisk karta över Trelleborgs kommun med orterna där deltagarna bor">
    <rect width="632" height="400" class="km-land" />
    <path d=${COAST} class="km-sea" />
    <text x="470" y="392" class="km-sea-t">Östersjön</text>
    <circle cx=${mx} cy=${my} r="60" class="km-glow" />
    ${Object.entries(PLACES).map(([name, p]) => {
      const [x, y] = mapXY(p.lat, p.lon), n = counts[name] || 0, r = 9 + Math.sqrt(n) * 6;
      const home = name === 'Anderslöv';
      return html`<g class=${cx('km-place', home && 'home', active === name && 'on')} key=${name} onClick=${() => onPick(name)} role="button" tabindex="0" aria-label=${`${name}: ${n} deltagare`}
        onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(name); } }}>
        <circle cx=${x} cy=${y} r=${r} class="km-dot" /><text x=${x} y=${y + 5} class="km-n">${n}</text>
        ${(() => { const at = LABEL_AT[name] || 'above', lx = at === 'left' ? x - r - 6 : at === 'right' ? x + r + 6 : x, ly = at === 'below' ? y + r + 22 : at === 'above' ? y - r - 8 : y + 7;
          return html`<text x=${lx} y=${ly} class="km-name" text-anchor=${at === 'left' ? 'end' : at === 'right' ? 'start' : 'middle'}>${home ? name + ' (du)' : name}</text>`; })()}
      </g>`;
    })}
  </svg>`;
}

function WelcomeSheet({ sh }) {

  const go = k => mut(s => { s.senior.sheet = { kind: 'welcome', step: k }; });
  useEffect(() => { Voice.stop('app'); Voice.say('app', 'welcome_' + st.id); }, [i]);

  return html`<div class="modal welcome" role="dialog" aria-modal="true" aria-label=${st.title}>
    <span class="welcome-ic"><${Icon} n=${st.icon} size=${64} sw=${1.8} /></span>

    <div class="row center">
      ${i > 0 && html`<${Btn} big icon="left" onClick=${() => go(i - 1)}>Tillbaka</${Btn}>`}
      <${Btn} kind="primary" big icon=${last ? 'check' : 'arrow'} onClick=${() => last ? closeSheet() : go(i + 1)}>${last ? 'Börja använda plattan' : 'Nästa'}</${Btn}>

}

// Månadens frågor om hur man har det (tre frågor, en i taget)
function SurveySheet({ sh }) {
  const s = useApp();
  const i = sh.step || 0, q = SURVEY.questions;
  const go = k => { if (k > q.length) Act.surveyDone(); mut(x => { x.senior.sheet = { kind: 'survey', step: k }; }); };
  useEffect(() => { Voice.stop('app'); Voice.say('app', i === 0 ? 'survey_intro' : i > q.length ? 'survey_tack' : 'survey_q' + (i - 1)); }, [i]);
  useEffect(() => () => Voice.stop('app'), []);
  if (i === 0) return html`<${Sheet} title="Tre korta frågor" icon="chat">
    <p class="lead">${SURVEY.intro}</p>
    <p class="muted">Det tar ungefär en minut. Du kan hoppa över frågorna.</p>
    <div class="row"><${Btn} kind="primary" big icon="arrow" onClick=${() => go(1)}>Börja</${Btn}><${Btn} big onClick=${closeSheet}>Inte nu</${Btn}></div>
  </${Sheet}>`;
  if (i > q.length) return html`<${Sheet} title="Tack!" icon="heart">
    <p class="lead">${SURVEY.thanks}</p>
    <div class="row"><${Btn} kind="primary" big icon="check" onClick=${closeSheet}>Stäng</${Btn}></div>
  </${Sheet}>`;
  const k = i - 1, chosen = (s.me.survey || [])[k];
  return html`<${Sheet} title=${`Fråga ${i} av ${q.length}`} icon="chat">
    <p class="survey-q">${q[k]}</p>
    <div class="survey-opts">${SURVEY.answers.map((a, n) => html`<button type="button" class=${cx('choice', 'survey-opt', chosen === n && 'on')} onClick=${() => { Act.surveyAnswer(k, n); go(i + 1); }}>${a}</button>`)}</div>
    <div class="row">${i > 1 && html`<${Btn} icon="left" onClick=${() => go(i - 1)}>Förra frågan</${Btn}>`}<${Btn} kind="ghost" onClick=${() => go(i + 1)}>Hoppa över</${Btn}></div>
  </${Sheet}>`;
}

const Tour = {
  go(i) {
    const st = TOUR[i];
    if (!st) return;
    if (st.ensure) st.ensure();
    if (st.t != null && Math.abs(App.s.t - st.t) > 1) Act.jump(st.t);
    mut(s => {
      s.tour = { on: true, step: i };
      s.senior.idle = false;   // plattan vaknar (steget kan somna den igen)
      s.senior.game = null;    // ett spel som öppnats själv stängs, annars ligger det kvar över steget
      // på en riktig platta syns en skärm i taget: plattan i stället för delade vyer (bilden från Anna kommer av sig själv)
      s.view = s.device ? ({ 'platta-tv': 'platta', 'platta-anhorig': 'platta', 'personal-platta': 'platta' }[st.view] || st.view) : st.view;
      if (s.device && st.id === 'meddelande') { const s0 = App.s; setTimeout(() => { if (App.s === s0 && !App.s.notices.length) Act.sendNotice('storm'); }, 4000); }
      if (s.device && st.view === 'platta-anhorig') { const s0 = App.s; setTimeout(() => { if (App.s === s0 && !App.s.photos.length) mut(x => Sim.receivePhoto(x, 'fotboll', true, true)); }, 5000); }
      if (st.setup) st.setup(s);
    });
  },
  next() { Tour.go(Math.min(TOUR.length - 1, App.s.tour.step + 1)); },
  prev() { Tour.go(Math.max(0, App.s.tour.step - 1)); },
  // Presentationsklickern och piltangenterna. Mitt i ett spel styr bara klickern (PageDown/PageUp) visningen, så att
  // pilarna fungerar i spelet. Spelen i en ram skickar klickerns tryck hit (13d-player.js).
  key(key) {
    if (!App.s.started) return false;
    const inGame = !!Player.current(App.s);
    if (key === 'PageDown' || (key === 'ArrowRight' && !inGame)) { if (App.s.tour.on) Tour.next(); else Tour.go(0); return true; }
    if (key === 'PageUp' || (key === 'ArrowLeft' && !inGame)) { if (App.s.tour.on) Tour.prev(); return true; }
    return false;
  },
  stop() { mut(s => { s.tour.on = false; }); }
};

// Räknaren: vad kostar det med olika antal deltagare och avtalstid?
function Calc() {
  const [n, setN] = useState(25);
  const [own, setOwn] = useState(0);
  const [kits, setKits] = useState(2);
  const [months, setMonths] = useState(6);
  const month = n * OFFER.all + own * OFFER.own;
  const total = month * months + kits * OFFER.kit;
  const perDay = (n + own) ? month / (n + own) / 30.4 : 0;
  const under = total <= OFFER.limit;
  return html`<div class="calc">
    <h3>Räkna själv</h3>
    <div class="calc-grid">
      <div class="calc-in">
        <label for="calc-n"><span>Deltagare med platta från oss</span><b>${n}</b></label>
        <input id="calc-n" type="range" min="0" max="300" step="5" value=${n} onInput=${e => setN(+e.currentTarget.value)} />
        <label for="calc-own"><span>Deltagare med egen platta</span><b>${own}</b></label>
        <input id="calc-own" type="range" min="0" max="300" step="5" value=${own} onInput=${e => setOwn(+e.currentTarget.value)} />
        <label for="calc-kits"><span>Träffpunkter med sändningsutrustning</span><b>${kits}</b></label>
        <input id="calc-kits" type="range" min="0" max="4" step="1" value=${kits} onInput=${e => setKits(+e.currentTarget.value)} />
        <div class="calc-months" role="radiogroup" aria-label="Avtalstid">${[6, 12, 24, 36].map(m => html`<button type="button" role="radio" aria-checked=${months === m} class=${months === m ? 'on' : ''} onClick=${() => setMonths(m)}>${m} mån</button>`)}</div>
      </div>
      <div class="calc-out">
        <div><small>Per månad</small><strong>${fmtKr(month)}</strong></div>
        <div><small>Hela avtalstiden, med startpaket</small><strong>${fmtKr(total)}</strong></div>
        <div><small>Per deltagare och dag</small><strong>${fmtKr(perDay)}</strong></div>
        <p class=${cx('calc-lou', under ? 'ok' : 'warn')}><${Icon} n=${under ? 'check' : 'report'} size=${20} />${under ? `Ryms under direktupphandlingsgränsen (${fmtKr(OFFER.limit)}).` : `Över direktupphandlingsgränsen (${fmtKr(OFFER.limit)}): kräver en vanlig upphandling.`}</p>
      </div>
    </div>
  </div>`;
}

const DEVICES = {
  platta: { w: 1280, h: 800, pad: 22, label: 'Ingrids platta i Anderslöv', C: SeniorApp, cls: 'dev-tablet' },

const JUMPS = [['09.00', T(9)], ['10.00', T(10, 2)], ['12.30', T(12, 30)], ['13.30', T(13, 30)], ['14.00', T(14)], ['15.00', T(15)]];

function Root() {
  const s = useApp();

  useEffect(() => {
    const onKey = e => {
      const tag = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.altKey || e.ctrlKey || e.metaKey || !App.s.started) return;
      if (Tour.key(e.key)) e.preventDefault();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return html`${s.device ? html`<${DeviceMode} />` : html`<${Shell} />`}<${UpdateBar} />`;
}

function Shell() {

// Scenen: enheterna i sina ramar, skalade så att de får plats
function Stage() {
  const s = useApp();
  const ref = useRef(null);
  const [box, setBox] = useState({ w: 1200, h: 700 });
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => setBox({ w: el.clientWidth, h: el.clientHeight });
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const view = VIEWS.find(v => v.id === s.view) || VIEWS[0];
  const devs = view.devices;
  const shares = SHARES[view.id] || devs.map(() => 1 / devs.length);
  const gap = 28, W = Math.max(200, box.w - 40 - gap * (devs.length - 1)), H = Math.max(200, box.h - 64);
  return html`<div class="stage" ref=${ref}>
    <div class="stage-row">
      ${devs.map((d, i) => {
        const D = DEVICES[d], ow = D.w + 2 * D.pad, oh = D.h + 2 * D.pad + (D.bar || 0);
        const sc = Math.min(W * shares[i] / ow, H / oh, 1);
        return html`<figure class=${cx('dev', D.cls)} key=${d} style=${{ width: ow * sc + 'px' }}>
          <div class="dev-hold" style=${{ width: ow * sc + 'px', height: oh * sc + 'px' }}>
            <div class="dev-body" style=${{ width: ow + 'px', height: oh + 'px', transform: `scale(${sc})`, padding: D.pad + 'px' }}>
              ${D.bar && html`<div class="dev-bar"><i></i><i></i><i></i><span>traffpunkthemma.se/personal</span></div>`}
              <div class="dev-screen" style=${{ width: D.w + 'px', height: D.h + 'px' }}><${D.C} /></div>
            </div>
          </div>
          <figcaption>${D.label}</figcaption>
        </figure>`;
      })}
    </div>
    <p class="stage-note">Demo med påhittade personer. Inte en tjänst från Trelleborgs kommun. © 2026 Daniel Nilsson.</p>
  </div>`;
}

/* ---------- På en riktig platta: helskärm och en demoknapp ---------- */
// Tv:n är ritad för 1920 × 1080. På en annan skärm (projektor, andra fönster) skalas hela bilden så att den får plats.
function FitBox({ w, h, children }) {
  const [box, setBox] = useState({ sc: 1, x: 0, y: 0 });
  useLayoutEffect(() => {
    const fit = () => { const sc = Math.min(innerWidth / w, innerHeight / h); setBox({ sc, x: (innerWidth - w * sc) / 2, y: (innerHeight - h * sc) / 2 }); };
    fit();
    addEventListener('resize', fit);
    return () => removeEventListener('resize', fit);
  }, []);
  return html`<div class="fitbox"><div class="fitbox-in" style=${{ width: w + 'px', height: h + 'px', transform: `translate(${box.x}px, ${box.y}px) scale(${box.sc})` }}>${children}</div></div>`;
}

/* ---- 24b-sync.js ---- */
/* ================= Andra skärmen: tv:n i salen i ett eget fönster ================= */
// På en dator med projektor eller tv som andra skärm: öppna demon en gång till med #skarm i adressen (knappen med
// tv:n i presentationens verktygsrad). Det fönstret visar tv:n i salen och följer demon i det första fönstret via
// BroadcastChannel (samma webbläsare på samma dator). Det andra fönstret spelar inget ljud och gör inga drag själv:
// allt räknas i det första fönstret, som skickar över hela läget några gånger i sekunden så länge någon lyssnar.
const FOLLOWER = (location.hash || '') === '#skarm';
const Sync = (() => {
  const X = {};
  let ch = null, lastSeen = -1e9, timer = null, got = false;
  const listening = () => performance.now() - lastSeen < 6000;
  const post = () => {
    timer = null;
    if (!ch || !listening()) return;
    try { ch.postMessage({ t: 'state', now: performance.now(), s: JSON.stringify(App.s, (k, v) => typeof v === 'function' ? undefined : v) }); }
    catch (e) { /* kanalen är stängd */ }
  };
  X.init = () => {
    if (typeof BroadcastChannel === 'undefined') return;
    try { ch = new BroadcastChannel('traffpunkt-hemma'); } catch (e) { return; }
    if (FOLLOWER) {
      PREFS.sound = false;   // ljudet kommer från det första fönstret (sparas inte)
      // tiderna i läget (vinkningar, bingovinster) räknas med det första fönstrets klocka
      const base = performance.now.bind(performance);
      let offset = 0;
      performance.now = () => base() + offset;
      ch.onmessage = e => {
        const m = e.data;
        if (!m || m.t !== 'state') return;
        offset = m.now - base();
        const s = JSON.parse(m.s);
        Object.assign(s, { device: true, view: 'tv', started: true, tour: { on: false, step: 0 } });
        App.s = s;
        got = true;
        App.emit();
      };
      const hello = () => { try { ch.postMessage({ t: 'hello' }); } catch (e) { /* stängt */ } };
      hello();
      setInterval(hello, 2000);
    } else {
      ch.onmessage = e => {
        if (!e.data || e.data.t !== 'hello') return;
        const fresh = !listening();
        lastSeen = performance.now();
        if (fresh) post();
      };
      App.on(() => { if (!timer && listening()) timer = setTimeout(post, 180); });
    }
  };
  X.connected = () => got;
  return X;
})();

/* ---- 24c-update.js ---- */
/* ================= Ny version av demon ================= */
// Webbplatsen (GitHub Pages) frågar efter version.json när sidan har varit i bakgrunden och var femte minut. Finns en
// nyare version visas en rad med en knapp som laddar om med ?v= i adressen, så att webbläsarens sparade sida inte
// används. Har visningen inte startat laddas den nya versionen direkt. I artefakten och på den lokala servern finns
// ingen version.json, och där händer ingenting (claude.ai uppdaterar artefakten själv).
const Update = (() => {
  let next = null;
  const apply = id => {
    try { const u = new URL(location.href); u.searchParams.set('v', id); location.replace(u.toString()); }
    catch (e) { location.reload(); }
  };
  const check = async () => {
    if (FOLLOWER || next) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (!v || !v.id || v.id === BUILD_ID) return;
      next = v.id;
      if (!App.s.started) apply(next); else App.emit();
    } catch (e) { /* ingen version.json eller inget nät */ }
  };
  return {
    start() {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      setInterval(check, 5 * 60 * 1000);
      setTimeout(check, 4000);
    },
    check,
    next: () => next,
    apply: () => { if (next) apply(next); }
  };
})();

function UpdateBar() {
  useApp();
  if (!Update.next()) return null;
  return html`<div class="upd-bar" role="status"><${Icon} n="restart" size=${20} /><span>Det finns en ny version av demon.</span>
    <button type="button" class="upd-go" onClick=${Update.apply}>Uppdatera nu</button></div>`;
}

/* ---- 25-main.js ---- */
/* ================= Start ================= */
// #platta, #tv, #anhorig, #personal och #om i adressen öppnar en vy direkt (i helskärm, för en riktig skärm).
// På en pekskärm (surfplatta eller mobil) visas Ingrids platta i helskärm, annars presentationen med ramar.
const Main = {
  boot() {
    const hash = (location.hash || '').replace('#', '');
    const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    Sync.init();
    mut(s => {
      if (FOLLOWER) { s.device = true; s.view = 'tv'; s.started = true; }
      else if (['platta', 'tv', 'anhorig', 'personal'].includes(hash)) { s.device = true; s.view = hash; }
      else if (hash === 'om') s.view = 'om';
      else if (hash === 'ensida') { s.view = 'ensida'; s.device = true; s.started = true; }
      else if (coarse) { s.device = true; s.view = 'platta'; }
      if (hash === 'visning') s.view = 'platta';
    });
    render(html`<${Root} />`, document.getElementById('app'));
    // Före start står klockan still (dagklockan visar 08.58)
    setInterval(() => {
      if (FOLLOWER) return;   // det andra fönstret räknar inget själv
      const s = App.s;
      if (!s.started) { s.clock.real = performance.now(); return; }
      Sim.tick();
    }, 250);
    document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stopAll(); });
    Update.start();
  }
};

if (/[?&]debug\b/.test(location.search)) window.TH = { App, Act, Sim, Tour, Player, mut };
Main.boot();
})();
