  .one { box-shadow: none; width: 210mm; min-height: 0; height: 296mm; }
  .demo-fab { display: none !important; }
}
@media screen and (max-width: 820px) { .one { padding: 20px 16px; min-height: 0; } .one-cols, .one-stats { grid-template-columns: 1fr; } .one-h { flex-direction: column; align-items: flex-start; } .one-by { text-align: left; } }

/* ================= Dagens kryss (från Korsordsklubben) ================= */
/* GENERERAD FIL: byggs av Korsordsklubben/tools/build-embed.mjs. Rutnätets färger för plattan, ljus och mörk. */
.senior { --f-grid: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif; --g-line: #8E9EAE; --g-frame: #15233A; --g-cell: #FFFFFF; --g-clue: #D0D2CD; --g-clue-ink: #15233A; --g-word: #A8D3F2; --g-word-edge: #1D5E86; --g-cur: #FFD27A; --g-cur-edge: #F2A516; --g-wrong: #B13A2E; --g-shown: #8A6100; --g-arrow: #3B4B60; }
.sn-dark { --g-line: #4A5B70; --g-frame: #0A111C; --g-cell: #1D2A3D; --g-clue: #3A4B64; --g-clue-ink: #EEF2F7; --g-word: #24557A; --g-word-edge: #8AC4E8; --g-cur: #8C6412; --g-cur-edge: #F2A516; --g-wrong: #FF8A7D; --g-shown: #FFC247; --g-arrow: #B9C6D6; }
/* ================= Spelplanen ================= */
.kx-root { position: relative; }
.kx-board { --kh: 60px; position: absolute; inset: 0; display: flex; gap: 16px; padding: 12px; box-sizing: border-box; color: var(--ink); }
.kx-board.wide { flex-direction: row; align-items: stretch; }
.kx-board.tall { flex-direction: column; gap: 8px; padding: 8px; }
.kx-gridbox { flex: 1; min-width: 0; min-height: 0; display: grid; place-items: center; }
.kx-board.tall .kx-gridbox { flex: 1 1 auto; }
.kx-side { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.kx-board.tall .kx-side { gap: 8px; }

/* Rutnätet */
.kx-grid { --cs: 60px; position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--cs)); grid-auto-rows: var(--cs); gap: 1px; background: var(--g-line);
  border: 3px solid var(--g-frame); border-radius: 4px; font-family: var(--f-grid); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.kx-c, .kx-q { position: relative; overflow: hidden; box-sizing: border-box; }
.kx-c { background: var(--g-cell); display: grid; place-items: center; cursor: pointer; transition: background .12s; }
.kx-l { font-size: calc(var(--cs) * .6); font-weight: 700; line-height: 1; color: var(--ink); transform: translateY(4%); }
.kx-c.word { background: var(--g-word); }
.kx-c.cur { background: var(--g-cur); box-shadow: inset 0 0 0 3px var(--g-cur-edge); }
.kx-c.wrong .kx-l { color: var(--g-wrong); }
.kx-c.wrong::after { content: ''; position: absolute; right: 8%; bottom: 8%; width: 14%; height: 14%; border-radius: 50%; background: var(--g-wrong); }
.kx-c.shown::before { content: ''; position: absolute; right: 0; top: 0; border-style: solid; border-width: 0 calc(var(--cs) * .22) calc(var(--cs) * .22) 0; border-color: transparent var(--g-shown) transparent transparent; opacity: .85; }
.kx-c.shown .kx-l { color: var(--g-shown); }
.kx-c.flash { animation: flash .6s ease-out; }
@keyframes flash { 30% { background: var(--ok-soft); } }
.kx-c.peer { box-shadow: inset 0 0 0 3px var(--peer); }
.kx-c.peer::after { content: attr(data-peer); position: absolute; left: 2px; bottom: 1px; right: auto; top: auto; width: auto; height: auto; border-radius: 4px; background: var(--peer); color: #fff;
  font-size: calc(var(--cs) * .16); font-weight: 800; padding: 0 3px; line-height: 1.25; max-width: 90%; overflow: hidden; white-space: nowrap; }
.kx-ar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.kx-ar-l { fill: none; stroke: var(--g-arrow); stroke-width: 5; stroke-linejoin: round; }
.kx-ar-t { fill: var(--g-arrow); }
.kx-arw.on .kx-ar-l { stroke: var(--g-word-edge); stroke-width: 6.5; }
.kx-arw.on .kx-ar-t { fill: var(--g-word-edge); }
.kx-q { background: var(--g-clue); color: var(--g-clue-ink); display: flex; flex-direction: column; cursor: pointer; }
.kx-q.empty { cursor: default; }
.kx-qp { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.08; font-weight: 600; padding: 0 2px; overflow: hidden; hyphens: manual; }
.kx-qp span { display: block; white-space: nowrap; }
.kx-q.two .kx-qp + .kx-qp { border-top: 1px solid var(--g-line); }
.kx-qp.on { background: var(--g-word); box-shadow: inset 0 0 0 3px var(--g-word-edge); }
/* ramen runt ordet man skriver i, och pilen i den gula rutan som visar åt vilket håll bokstäverna hamnar */
.kx-frame { grid-row: 1; grid-column: 1; pointer-events: none; z-index: 2; border: 4px solid var(--g-word-edge); border-radius: 5px; margin: -2px; box-shadow: 0 0 0 2px var(--g-cell); }
.kx-cd { display: none; position: absolute; width: 0; height: 0; border-style: solid; opacity: .8; }
.kx-c.cur[data-dir="A"] .kx-cd { display: block; right: 5%; top: calc(50% - var(--cs) * .1); border-width: calc(var(--cs) * .1) 0 calc(var(--cs) * .1) calc(var(--cs) * .13); border-color: transparent transparent transparent var(--ink); }
.kx-c.cur[data-dir="D"] .kx-cd { display: block; bottom: 5%; left: calc(50% - var(--cs) * .1); border-width: calc(var(--cs) * .13) calc(var(--cs) * .1) 0 calc(var(--cs) * .1); border-color: var(--ink) transparent transparent transparent; }

/* Den stora ledtråden */
.kx-cluebar { background: var(--card); border: 2px solid var(--primary); border-radius: 18px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 18px rgba(21, 35, 58, .08); }
.kx-cb-top { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: calc(18px * var(--fs)); font-weight: 700; min-height: 40px; }
.kx-cb-dir { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); font-size: calc(22px * var(--fs)); font-weight: 800; }
.kx-cb-len { margin-right: auto; }
.kx-read { min-height: 42px; }
.kx-cb-mid { display: flex; align-items: center; gap: 8px; }
.kx-cb-text { flex: 1; font-size: calc(30px * var(--fs)); font-weight: 800; line-height: 1.18; text-align: center; min-height: 1.2em; overflow-wrap: anywhere; }
.kx-nav { min-height: 64px; min-width: 64px; padding: 2px 6px; flex: none; flex-direction: column; gap: 0; font-size: calc(14px * var(--fs)); }
.kx-nav.pulse { animation: navpulse .8s ease-in-out 3; }
@keyframes navpulse { 50% { background: var(--primary); color: var(--primary-ink); } }
.kx-cb-msg { display: flex; align-items: center; gap: 8px; background: var(--lamp-soft); border-radius: 12px; padding: 6px 6px 6px 10px; font-size: calc(18px * var(--fs)); font-weight: 600; line-height: 1.25; }
.kx-cb-msg span { flex: 1; }
.kx-cb-x { flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; color: var(--ink2); }
.kx-cb-pat { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
.kx-cb-pat span { width: 30px; height: 34px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 20px; font-family: var(--f-grid); background: var(--g-cell); }
.kx-cb-pat span.on { border-color: var(--g-cur-edge); background: var(--g-cur); }
.kx-cb-pat span.shown { color: var(--g-shown); }
.kx-cb-pat span.bad { color: var(--g-wrong); border-color: var(--g-wrong); }

/* Tangentbordet */
.kx-keys { display: flex; flex-direction: column; gap: 6px; }
.kx-krow { display: flex; gap: 6px; justify-content: center; }
.kx-key { flex: 1 1 0; min-width: 0; height: var(--kh); border-radius: 12px; border: 0; background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line), inset 0 0 0 2px var(--line);
  font-family: var(--f-grid); font-weight: 700; font-size: calc(var(--kh) * .46); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0; touch-action: manipulation; }
.kx-key.down { background: var(--primary); color: var(--primary-ink); transform: translateY(1px); box-shadow: none; }
.kx-key-back { background: var(--line2); font-size: calc(var(--kh) * .28); flex-direction: column; gap: 0; }
.kx-key-back .ic { width: calc(var(--kh) * .42); height: calc(var(--kh) * .42); }
.kx-keys-abc6 .kx-key-back { flex: 1.6 1 0; }
.kx-keys-abc10 .kx-key-back, .kx-keys-qwerty .kx-key-back { flex: 1.8 1 0; }
.kx-keys-qwerty .kx-krow:nth-child(3) { padding: 0 4%; }

.kx-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kx-tools .btn { min-height: 52px; }
.kx-board.tall .kx-tools { grid-template-columns: repeat(4, 1fr); }
.kx-board.tall .kx-tools .btn { font-size: calc(15px * var(--fs)); padding: 0 6px; gap: 4px; min-height: 46px; }
.kx-board.tall .kx-cb-text { font-size: calc(24px * var(--fs)); }
.kx-board.tall .kx-cluebar { padding: 6px 8px 8px; gap: 4px; }
.kx-board.tall .kx-cb-top { min-height: 32px; }
.kx-board.tall .kx-cb-pat { display: none; }
.kx-board.tall .kx-nav { min-height: 48px; min-width: 48px; }
.kx-board.nopat .kx-cb-pat { display: none; }
.kx-board.short .kx-tools { grid-template-columns: repeat(4, 1fr); }
.kx-board.short .kx-tools .btn { font-size: calc(15px * var(--fs)); padding: 0 6px; gap: 4px; min-height: 46px; }
.kx-board.wide.short .kx-cb-text { font-size: calc(27px * var(--fs)); }

/* ================= Plattan: Dagens kryss (kortet på Spela och krysset i spelramen) ================= */
.kryss-card { grid-column: 1 / -1; }
.kryss-picks { gap: 14px; }
.kryss-pick { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); text-align: left; min-height: 104px; flex: 1; min-width: 250px; }
.kryss-pick:hover { border-color: var(--primary); background: var(--primary-soft); }
.kryss-pick.st-done { border-color: var(--ok); }
.kryss-pick-t { display: flex; flex-direction: column; gap: 2px; }
.kryss-pick-t strong { font-size: calc(22px * var(--fs)); }
.kryss-pick-t small { display: flex; align-items: center; gap: 6px; color: var(--ink2); font-size: calc(17px * var(--fs)); }
.kryss-pick.st-done small { color: var(--ok); font-weight: 700; }
.kryss-mini { display: block; line-height: 0; padding: 6px; border-radius: 10px; background: var(--paper); }
.kryss-mini canvas { border-radius: 3px; display: block; }
.kryss-play { color: var(--ink); position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 8px; box-sizing: border-box; background: var(--paper); }
.kryss-head { display: flex; align-items: center; gap: 12px; flex: none; }
.kryss-tabs { flex: 0 1 640px; }
.kryss-count { margin-left: auto; color: var(--ink2); font-size: calc(18px * var(--fs)); font-variant-numeric: tabular-nums; }
.kryss-board { flex: 1; min-height: 0; }
.kryss-board .kx-board { padding: 4px 0 0; }
.kryss-head .btn { min-height: 52px; }
.kryss-scrim { z-index: 20; }
.kryss-modal { gap: 12px; }
.kryss-steps { display: flex; flex-direction: column; gap: 10px; }
.kryss-steps li { display: flex; gap: 14px; align-items: flex-start; font-size: calc(20px * var(--fs)); line-height: 1.4; }
.kryss-steps b { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: 20px; }
.kryss-choice { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line2); }
.kryss-reset { padding: 12px 0 4px; border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 8px; }
.kryss-solved { text-align: center; align-items: center; }
.kryss-solved h2 { font-family: var(--f-display); font-size: calc(32px * var(--fs)); }
.kryss-star { color: var(--lamp); }
.kryss-choice .chip { padding: 0 18px; }

/* ================= Spelen i plattan: helskärm med plattans rubrikrad ================= */
/* Ligger över menyn och sidan men under meddelandena (toasts 15) och rutorna (scrim 20), så att ett samtal eller en
   varning från personalen syns även mitt i ett parti. */
.gplay { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; background: #0D1829; color: #E9EEF4; }
.gplay-bar { flex: none; display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 8px 14px 8px 12px; background: #15233A; border-bottom: 1px solid #253A58; }
.gplay-brand { display: flex; align-items: center; gap: 10px; flex: none; padding-right: 16px; border-right: 1px solid #2E4A6B;
  font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.05; color: #E9EEF4; }
.gplay-brand .logo { flex: none; }
.gplay-game { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; font-size: calc(22px * var(--fs)); font-weight: 800; line-height: 1.15; }
.gplay-game img { flex: none; border-radius: 11px; }
.gplay-game strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gplay-seats { display: flex; gap: 10px; flex: none; }
.gplay-seat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px; }
.gplay-seat small { font-size: 13px; font-weight: 700; color: #C9D5E2; }
/* Patiens vid bordet: hur långt var och en har kommit */
.gplay-pct { font-size: 12px; font-weight: 800; line-height: 1; color: #FFD27A; font-variant-numeric: tabular-nums; }
.gplay-pct.done { color: #8EE6B4; }
.gplay-actions { display: flex; gap: 10px; flex: none; }
.gplay-bar .btn { min-height: 54px; }
.gplay-bar .btn-danger { background: transparent; color: #FFB4AA; border-color: #FFB4AA; }
.gplay-bar .btn-danger:hover:not(:disabled) { background: rgba(255, 180, 170, .12); }
.gplay-table .gplay-game { font-size: calc(19px * var(--fs)); }
.gplay-body { flex: 1; position: relative; min-height: 0; }
.gplay-cap { flex: none; margin: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 6px 18px; background: #132238; border-top: 1px solid #253A58;
  font-size: calc(19px * var(--fs)); color: #E9EEF4; }
.gplay-cap strong { color: #FFD27A; }
.gplay-cap .icon { color: #A3B3C6; }

/* Ramen med spelet */
.gframe { position: absolute; inset: 0; background: #0B1626; }
.gframe-if { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0B1626; }
.gframe-note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
  background: radial-gradient(ellipse at 50% 40%, #1F4A73, #16304A 55%, #0B1626); color: #E9EEF4; font-size: calc(22px * var(--fs)); }
.gframe-note img { border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.gframe-note p { margin: 0; }
</style>

(() => {
'use strict';
const VOICE_INFO = {"lines":{"app_morgon":{"file":"voice/app_morgon.mp3","who":"app","text":"God morgon, Ingrid! Hur mår du i dag?","dur":2.52},"app_mood_bra":{"file":"voice/app_mood_bra.mp3","who":"app","text":"Vad skönt att höra! Ha en riktigt fin dag.","dur":3.42},"app_mood_okej":{"file":"voice/app_mood_okej.mp3","who":"app","text":"Tack för att du berättar. Titta gärna in i Fikarummet, där finns sällskap hela förmiddagen.","dur":6.76},"app_mood_ring":{"file":"voice/app_mood_ring.mp3","who":"app","text":"Tack för att du berättar. Vill du att någon från träffpunkten ringer dig en stund i dag?","dur":5.63},"app_ring_ja":{"file":"voice/app_ring_ja.mp3","who":"app","text":"Då ringer Lena dig före lunch. Ta hand om dig så länge.","dur":3.84},"app_lampa":{"file":"voice/app_lampa.mp3","who":"app","text":"Nu lyser din lampa. Dina vänner ser att du gärna vill prata.","dur":4.84},"app_anmalan":{"file":"voice/app_anmalan.mp3","who":"app","text":"Om en halvtimme börjar Spelstunden. Vill du vara med och spela? Välj ett spel, så hittar vi sällskap åt dig.","dur":7.94},"app_anmald":{"file":"voice/app_anmald.mp3","who":"app","text":"Nu är du anmäld. Vi säger till när det börjar.","dur":2.79},"app_start":{"file":"voice/app_start.mp3","who":"app","text":"Nu börjar Spelstunden! Dina bordsgrannar väntar på dig.","dur":4.25},"app_bingo":{"file":"voice/app_bingo.mp3","who":"app","text":"Nu börjar bingon från träffpunkten. Vill du vara med och spela?","dur":4.69},"app_halsning":{"file":"voice/app_halsning.mp3","who":"app","text":"Du har fått en bildhälsning från Anna.","dur":2.15},"app_karin_ringer":{"file":"voice/app_karin_ringer.mp3","who":"app","text":"Karin ringer dig.","dur":1.2},"app_anna_ringer":{"file":"voice/app_anna_ringer.mp3","who":"app","text":"Anna ringer dig.","dur":1.11},"app_lena_ringer":{"file":"voice/app_lena_ringer.mp3","who":"app","text":"Lena från träffpunkten ringer dig.","dur":2.36},"app_fodelsedag":{"file":"voice/app_fodelsedag.mp3","who":"app","text":"I dag fyller Margareta nittio år! Vill du skicka en hälsning?","dur":4.73},"lena_fika1":{"file":"voice/lena_fika1.mp3","who":"lena","text":"Hej och välkommen in i Fikarummet! Hej Ingrid, vad roligt att du tittade in.","dur":7.05},"lena_fika2":{"file":"voice/lena_fika2.mp3","who":"lena","text":"Klockan två är det Spelstund. Då blir det Yatzy, canasta och fia.","dur":8.76},"lena_fika3":{"file":"voice/lena_fika3.mp3","who":"lena","text":"Vad fint! Ingrid, vilken cykel hade du? Du kan svara på Dagens fråga på startsidan.","dur":6.51},"lena_fika4":{"file":"voice/lena_fika4.mp3","who":"lena","text":"Glöm inte att bingon börjar klockan tre. Då kan ni vara med hemifrån!","dur":4.71},"lena_ring1":{"file":"voice/lena_ring1.mp3","who":"lena","text":"Hej Ingrid, det är Lena från träffpunkten. Du ville att någon skulle ringa. Hur har du det i dag?","dur":8.24},"lena_ring2":{"file":"voice/lena_ring2.mp3","who":"lena","text":"Vad bra att du säger det. Vill du att jag anmäler dig till Spelstunden i eftermiddag? Karin ska också vara med.","dur":7.7},"lena_ring3":{"file":"voice/lena_ring3.mp3","who":"lena","text":"Då gör vi så. Ring mig när du vill. Ha det så gott så länge!","dur":6.96},"lena_vinka":{"file":"voice/lena_vinka.mp3","who":"lena","text":"Hej Ingrid, vad roligt att du vinkar! Säg till när du vill säga något.","dur":5},"karin_fika1":{"file":"voice/karin_fika1.mp3","who":"karin","text":"Hej Ingrid! Har du fått i dig ditt kaffe?","dur":3.24},"karin_fika2":{"file":"voice/karin_fika2.mp3","who":"karin","text":"Jag är med på Yatzy! Ingrid, du är väl också med?","dur":4.59},"karin_fika3":{"file":"voice/karin_fika3.mp3","who":"karin","text":"Nu måste jag ta in tvätten, men vi hörs i eftermiddag!","dur":3.59},"karin_ring1":{"file":"voice/karin_ring1.mp3","who":"karin","text":"Hej Ingrid! Jag såg att din lampa lyste, så jag tänkte ringa. Hur har du det i dag?","dur":7.65},"karin_ring2":{"file":"voice/karin_ring2.mp3","who":"karin","text":"Vad skönt. Du, ska vi åka till träffpunkten tillsammans på onsdag? Min son kan skjutsa oss båda.","dur":7.75},"karin_ring3":{"file":"voice/karin_ring3.mp3","who":"karin","text":"Härligt! Då säger vi så. Vi hörs på Spelstunden!","dur":4.48},"karin_y_hej":{"file":"voice/karin_y_hej.mp3","who":"karin","text":"Hej allihop! Lycka till nu!","dur":2.92},"karin_y_bra":{"file":"voice/karin_y_bra.mp3","who":"karin","text":"Kåk! Den tar jag.","dur":1.69},"karin_y_yatzy":{"file":"voice/karin_y_yatzy.mp3","who":"karin","text":"Yatzy! Nej men titta, fem lika!","dur":3.65},"karin_y_stryk":{"file":"voice/karin_y_stryk.mp3","who":"karin","text":"Äsch, det blev ingenting. Jag får stryka.","dur":3.04},"karin_y_berom":{"file":"voice/karin_y_berom.mp3","who":"karin","text":"Snyggt, Ingrid! Vilken tur du har.","dur":2.75},"karin_y_prat":{"file":"voice/karin_y_prat.mp3","who":"karin","text":"Ingrid, kommer du på bingon sen? Då kan vi heja på varandra.","dur":4.69},"karin_y_slut":{"file":"voice/karin_y_slut.mp3","who":"karin","text":"Tack för spelet allihop! Det var så roligt.","dur":4.05},"bengt_fika1":{"file":"voice/bengt_fika1.mp3","who":"bengt","text":"God morgon allihop. Här i Skegrie blåser det rejält i dag.","dur":4.9},"bengt_fika2":{"file":"voice/bengt_fika2.mp3","who":"bengt","text":"Dagens fråga var om första cykeln. Min var en blå Crescent, som jag fick när jag fyllde tolv.","dur":8.55},"bengt_y_hej":{"file":"voice/bengt_y_hej.mp3","who":"bengt","text":"Hej hej! Nu kör vi. Jag känner mig i form i dag.","dur":3.57},"bengt_y_bra":{"file":"voice/bengt_y_bra.mp3","who":"bengt","text":"Stor stege! Där satt den.","dur":3.3},"bengt_y_yatzy":{"file":"voice/bengt_y_yatzy.mp3","who":"bengt","text":"Yatzy! Det har inte hänt sedan jul.","dur":3.24},"bengt_y_stryk":{"file":"voice/bengt_y_stryk.mp3","who":"bengt","text":"Nej, nu blev det pannkaka. Jag stryker.","dur":3.84},"bengt_y_berom":{"file":"voice/bengt_y_berom.mp3","who":"bengt","text":"Bra kastat, Ingrid!","dur":1.97},"bengt_y_prat":{"file":"voice/bengt_y_prat.mp3","who":"bengt","text":"Det här påminner mig om när vi spelade på rasterna på Gummifabriken.","dur":4.54},"bengt_y_slut":{"file":"voice/bengt_y_slut.mp3","who":"bengt","text":"Tack för i dag. Samma tid i morgon?","dur":2.77},"sonja_fika1":{"file":"voice/sonja_fika1.mp3","who":"sonja","text":"Ja, det är riktigt höstväder. Jag tänkte gå till affären, men jag stannar nog inne i dag.","dur":8.24},"sonja_fika2":{"file":"voice/sonja_fika2.mp3","who":"sonja","text":"Åh, jag hade en röd Monark. Den fick jag ärva av min storebror.","dur":6.12},"sonja_y_hej":{"file":"voice/sonja_y_hej.mp3","who":"sonja","text":"Hej Ingrid! Vad roligt att vi hamnade vid samma bord.","dur":4.35},"sonja_y_bra":{"file":"voice/sonja_y_bra.mp3","who":"sonja","text":"Oj, vad fint det blev! Det skriver jag.","dur":2.82},"sonja_y_yatzy":{"file":"voice/sonja_y_yatzy.mp3","who":"sonja","text":"Yatzy! Jag kan inte tro det!","dur":3.51},"sonja_y_stryk":{"file":"voice/sonja_y_stryk.mp3","who":"sonja","text":"Aj då. Det får bli en nolla den här gången.","dur":4.37},"sonja_y_berom":{"file":"voice/sonja_y_berom.mp3","who":"sonja","text":"Åh, grattis Ingrid! Det var snyggt.","dur":3.81},"sonja_y_prat":{"file":"voice/sonja_y_prat.mp3","who":"sonja","text":"Har ni märkt att det har blivit så mörkt på kvällarna nu?","dur":4.37},"sonja_y_slut":{"file":"voice/sonja_y_slut.mp3","who":"sonja","text":"Tack för spelet! Vi ses på bingon.","dur":3.33},"mats_intro":{"file":"voice/mats_intro.mp3","who":"mats","text":"Hej och välkomna till bingo här på träffpunkten! Och extra välkomna, ni som är med hemifrån. Vi ser er på tv:n här i salen!","dur":9.07},"mats_forsta":{"file":"voice/mats_forsta.mp3","who":"mats","text":"Då drar vi första numret.","dur":1.08},"mats_kolla":{"file":"voice/mats_kolla.mp3","who":"mats","text":"Ett ögonblick, jag kontrollerar brickan.","dur":1.89},"mats_bingo_ingrid":{"file":"voice/mats_bingo_ingrid.mp3","who":"mats","text":"Vi har en bingo! Och det är Ingrid, som är med hemifrån i Anderslöv. Grattis, Ingrid!","dur":5. const MONTHS = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'];
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
// Demon utspelar sig i dag (datumet där den visas), men klockan styrs av demon. På en lördag eller söndag visas
// nästa måndag, eftersom demodagen har vardagens program (träffpunkterna har personal på vardagar).
const DEMO_DATE = (() => { const d = new Date(); const wd = d.getDay(); if (wd === 6) d.setDate(d.getDate() + 2); if (wd === 0) d.setDate(d.getDate() + 1); return d; })();
const dayName = (d = DEMO_DATE) => WEEKDAYS[d.getDay()];
const dateStr = (d = DEMO_DATE) => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
// Veckonummer enligt ISO 8601, som i svenska almanackor
function isoWeek(d = DEMO_DATE) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - y0) / 864e5 + 1) / 7);
}
const partOfDay = t => t < T(5) ? 'natt' : t < T(10) ? 'morgon' : t < T(12) ? 'förmiddag' : t < T(13) ? 'mitt på dagen' : t < T(18) ? 'eftermiddag' : t < T(22) ? 'kväll' : 'natt';
const greetingFor = t => t < T(10) ? 'God morgon' : t < T(18) ? 'Hej' : 'God kväll';
// Hur länge sedan, i ord som är lätta att läsa: "nyss", "för 5 minuter sedan", "kl. 09.12"
function agoStr(at, now) {
  const d = now - at;
  if (d < 60) return 'nyss';
  if (d < 3600) { const m = Math.floor(d / 60); return `för ${m} ${m === 1 ? 'minut' : 'minuter'} sedan`; }
  return 'kl. ' + clockStr(at);
}
// Inlägg på anslagstavlan: dagar sedan (0 = i dag)
function daysAgoStr(days, at) {
  if (!days) return 'i dag ' + clockStr(at);
  if (days === 1) return 'i går ' + clockStr(at);
  const d = new Date(DEMO_DATE); d.setDate(d.getDate() - days);
  return days < 7 ? `i ${WEEKDAYS[d.getDay()]}s` : `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
}
const minutesWord = m => m === 1 ? '1 minut' : `${m} minuter`;

// Ungefärligt läge i orten för avståndet "ca 2 km" (bara för dem som valt att visa det; aldrig adressen)
const HOME_OFFSET = (() => {
  const rnd = seeded(7), out = {};
  PEOPLE.forEach(p => { out[p.id] = { dlat: (rnd() - .5) * 0.012, dlon: (rnd() - .5) * 0.02 }; });
  return out;
})();
function distanceKm(a, b) {
  const pa = PLACES[person(a).ort], pb = PLACES[person(b).ort];
  if (!pa || !pb) return null;
  const oa = HOME_OFFSET[a] || { dlat: 0, dlon: 0 }, ob = HOME_OFFSET[b] || { dlat: 0, dlon: 0 };
  const lat1 = pa.lat + oa.dlat, lon1 = pa.lon + oa.dlon, lat2 = pb.lat + ob.dlat, lon2 = pb.lon + ob.dlon;
  const R = 6371, rad = Math.PI / 180;
  const x = (lon2 - lon1) * rad * Math.cos((lat1 + lat2) / 2 * rad), y = (lat2 - lat1) * rad;
  return Math.sqrt(x * x + y * y) * R;
}
// Avrundat så att det aldrig går att räkna ut var någon bor

/* ================= Tillståndet: allt som visas kommer härifrån ================= */
// Ett enda föränderligt objekt (App.s). Den som ändrar något anropar mut(fn) och alla vyer ritas om (högst en gång per
// mikrotask). Vyerna läser med useApp(). Presentationen, plattan, tv:n, mobilen och personalvyn delar samma tillstånd,
// så att det som Ingrid gör på plattan syns direkt på tv:n i salen och hos personalen.
const App = {
  s: null,
  subs: new Set(),
  pending: false,
  emit() {
    if (this.pending) return;
    this.pending = true;
    queueMicrotask(() => { this.pending = false; this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); });
  },
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
};
function mut(fn) { fn(App.s); App.emit(); }
function useApp() {
  const [, force] = useState(0);
  useEffect(() => App.on(() => force(n => n + 1)), []);
  return App.s;
}

/* ================= Ljud: signaler och röster ================= */
// Signalerna (pling, ringsignal, tärningar) byggs med Web Audio, så att inga ljudfiler behövs för dem.
// Rösterna är inspelade klipp (ElevenLabs, voice/*.mp3). VOICE_INFO kommer från bygget: {lines: {id: {file, text, dur, who}}, levels}.
// Utan klipp (eller med ljudet avstängt) går allt ändå: talaren lyser och texten visas lika länge som repliken skulle ta.
const Sound = (() => {
  const S = {};
  let ctx = null, master = null;
  S.unlock = () => {
    try {
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  };
  const tone = (f, at, dur, { type = 'sine', vol = .3, attack = .01, release = .25, glide = 0 } = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, at);
    if (glide) o.frequency.exponentialRampToValueAtTime(f * glide, at + dur);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + attack); g.gain.exponentialRampToValueAtTime(.0001, at + dur + release);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + dur + release + .05);
  };
  const noise = (at, dur, vol = .15, hp = 1800) => {
    const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    src.buffer = b; src.connect(f); f.connect(g); g.connect(master); src.start(at);
  };
  // Signalerna är mjuka och korta: inget ska skrämma någon
  const FX = {
    notify(t) { tone(659.3, t, .18, { vol: .22 }); tone(987.8, t + .16, .3, { vol: .2 }); },
    soft(t) { tone(880, t, .12, { vol: .12 }); },
    pop(t) { tone(523.3, t, .08, { vol: .14, glide: 1.5 }); },
    ring(t) { for (let k = 0; k < 2; k++) { tone(784, t + k * .5, .16, { vol: .16 }); tone(659.3, t + k * .5 + .18, .2, { vol: .16 }); } },
    lamp(t) { tone(392, t, .3, { vol: .14 }); tone(587.3, t + .12, .5, { vol: .12 }); },
    dice(t) { for (let k = 0; k < 7; k++) noise(t + k * .055 + Math.random() * .02, .04, .1 + Math.random() * .06, 2400); },
    bingo(t) { [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, t + i * .11, .22, { vol: .2, type: 'triangle' })); },
    ball(t) { tone(392, t, .1, { vol: .12, type: 'triangle' }); tone(523.3, t + .09, .16, { vol: .12, type: 'triangle' }); },
    flower(t) { [1318.5, 1568, 2093].forEach((f, i) => tone(f, t + i * .07, .12, { vol: .08 })); },
    leave(t) { tone(587.3, t, .16, { vol: .14 }); tone(392, t + .14, .26, { vol: .12 }); }
  };
  S.play = name => {
    if (!PREFS.sound || !ctx || !FX[name]) return;
    try { FX[name](ctx.currentTime + .02); } catch (e) { /* ljudet går inte just nu */ }
  };
  return S;
})();

const Voice = (() => {
  const V = {};
  const info = (typeof VOICE_INFO !== 'undefined' && VOICE_INFO) || { lines: {}, levels: {} };
  const spaces = {};              // space -> {queue, playing, token}
  const cache = {};
  V.has = id => !!info.lines[id];
  V.text = id => (info.lines[id] && info.lines[id].text) || '';
  V.who = id => (info.lines[id] && info.lines[id].who) || null;
  // Hur länge repliken tar (sekunder). Utan klipp räknas det ut från texten.
  V.dur = (id, text) => (info.lines[id] && info.lines[id].dur) || Math.max(1.2, (text || V.text(id)).length * .068 + .4);
  const audioFor = id => {
    const L = info.lines[id];
    if (!L || !PREFS.sound) return null;
    let a = cache[id];
    if (!a) { a = cache[id] = new Audio(L.file); a.preload = 'auto'; }
    const g = info.levels[L.file] || 0;
    a.volume = clamp(Math.pow(10, g / 20), 0, 1);
    return a;
  };
  V.preload = ids => ids.forEach(id => { try { audioFor(id); } catch (e) { /* går inte */ } });
  // Spelar en replik direkt i ett "rum" (space). Ger ett löfte som blir klart när repliken är slut (eller avbruten).
  // onStart/onEnd: för att tända talaren och visa texten.
  V.say = (space, id, { who = V.who(id), text = V.text(id), onStart, onEnd } = {}) => {
    const sp = spaces[space] || (spaces[space] = { token: 0, active: new Set() });
    const token = sp.token;
    return new Promise(done => {
      let finished = false, timer = null, a = null;
      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        sp.active.delete(cancel);
        if (a) a.onended = null;
        try { onEnd && onEnd(); } catch (e) { console.error(e); }
        done(sp.token === token);
      };
      const cancel = () => { if (a) { try { a.pause(); } catch (e) { /* redan stoppat */ } } finish(); };
      sp.active.add(cancel);
      try { onStart && onStart({ who, text }); } catch (e) { console.error(e); }
      const dur = V.dur(id, text);
      a = audioFor(id);
      if (a) {
        try { a.currentTime = 0; } catch (e) { /* inte laddat än */ }
        a.onended = finish;
        const p = a.play();
        if (p && p.catch) p.catch(() => { /* spärrat: tiden räcker */ });
      }
      // säkerhet: repliken slutar senast när den borde (plus lite), även om ljudet inte spelas
      timer = setTimeout(finish, (dur + (a ? 1.2 : 0)) * 1000);
    });
  };
  // Tystar ett rum (när Ingrid lämnar det)
  V.stop = space => {
    const sp = spaces[space];
    if (!sp) return;
    sp.token++;
    [...sp.active].forEach(c => c());
  };
  V.stopAll = () => Object.keys(spaces).forEach(V.stop);
  // Hela manuset i rummet, en replik i taget med en kort paus emellan. Avbryts av V.stop(space).
  V.script = async (space, ids, { gap = .7, onLine, onLineEnd } = {}) => {
    const sp = spaces[space] || (spaces[space] = { token: 0, active: new Set() });
    const token = sp.token;
    for (const item of ids) {
      if (sp.token !== token) return false;
      const id = typeof item === 'string' ? item : item.id;
      const pause = typeof item === 'object' && item.pause != null ? item.pause : gap;
      await V.say(space, id, { onStart: x => onLine && onLine(id, x), onEnd: () => onLineEnd && onLineEnd(id) });
      if (sp.token !== token) return false;
      await sleep(pause * 1000);
    }
    return sp.token === token;
  };
  return V;
})();

/* ---- 04-yatzy.js ---- */
/* ================= Yatzy vid bordet: reglerna och datorspelarna från Yatzyklubben ================= */
// Kopierade oförändrade från Documents/Yatzyklubben/game/src/js/01-rules.js och 02-ai.js, så att deltagarna vid
// demons bord spelar som i det riktiga spelet (medelnivå).

// Fem tärningar och tre slag per tur. Efter varje tur skriver spelaren in poängen på en ledig rad i sitt protokoll
// (eller stryker en rad med 0). När alla femton rader är ifyllda är partiet slut och högst summa vinner.
//   Övre delen: ettor–sexor (summan av de tärningarna). Minst 63 där ger 50 i bonus.
//   Undre delen: ett par, två par, tretal, fyrtal (summan av de lika tärningarna), liten stege 1–5 (15),
//   stor stege 2–6 (20), kåk (tre + två, summan av alla), chans (summan av alla) och yatzy (fem lika, 50).
// Husregler: tvångsyatzy (raderna fylls i ordning uppifrån) och att fem lika också räknas som kåk.
//
// Läget (S) är öppet för alla, inget är hemligt. Dragen: {t: 'roll', hold: [5 × bool]} slår om tärningarna som inte
// sparas, och {t: 'score', cat} skriver in poängen. apply ger ett nytt läge och händelser att visa.
const Rules = (() => {
  const R = {};
  class RuleError extends Error {}
  R.RuleError = RuleError;
  const fail = msg => { throw new RuleError(msg); };

  R.NDICE = 5;
  R.ROLLS = 3;
  R.BONUS_AT = 63;
  R.BONUS = 50;
  R.MAX_PLAYERS = 6;
  // rad: id, namn, kort namn (smala block), övre delens tal, förklaring
  R.CATS = [
    {id: 'c1', name: 'Ettor', up: 1, info: 'Summan av alla ettor'},
    {id: 'c2', name: 'Tvåor', up: 2, info: 'Summan av alla tvåor'},
    {id: 'c3', name: 'Treor', up: 3, info: 'Summan av alla treor'},
    {id: 'c4', name: 'Fyror', up: 4, info: 'Summan av alla fyror'},
    {id: 'c5', name: 'Femmor', up: 5, info: 'Summan av alla femmor'},
    {id: 'c6', name: 'Sexor', up: 6, info: 'Summan av alla sexor'},
    {id: 'par', name: 'Ett par', short: '1 par', info: 'Två lika: summan av det högsta paret'},
    {id: 'tpar', name: 'Två par', short: '2 par', info: 'Två olika par: summan av de fyra tärningarna'},
    {id: 'tre', name: 'Tretal', info: 'Tre lika: summan av de tre'},
    {id: 'fyr', name: 'Fyrtal', info: 'Fyra lika: summan av de fyra'},
    {id: 'ls', name: 'Liten stege', short: 'L. stege', info: '1-2-3-4-5 ger 15'},
    {id: 'ss', name: 'Stor stege', short: 'S. stege', info: '2-3-4-5-6 ger 20'},
    {id: 'kak', name: 'Kåk', info: 'Tre lika och två lika: summan av alla'},
    {id: 'ch', name: 'Chans', info: 'Summan av alla tärningar'},
    {id: 'y', name: 'Yatzy', info: 'Fem lika ger 50'}
  ];
  R.IDS = R.CATS.map(c => c.id);
  R.UPPER = R.IDS.slice(0, 6);
  R.LOWER = R.IDS.slice(6);
  R.cat = id => R.CATS.find(c => c.id === id);
  R.catName = id => (R.cat(id) || {name: id}).name;

  /* ---------- Poäng ---------- */
  // antal av varje tal: cnt[1..6]
  R.counts = dice => { const c = [0, 0, 0, 0, 0, 0, 0]; dice.forEach(d => { if (d >= 1 && d <= 6) c[d]++; }); return c; };
  const sum = dice => dice.reduce((a, b) => a + b, 0);
  // Poängen för en rad med tärningarna (opts: husreglerna)
  R.score = (id, dice, opts = {}) => {
    if (!dice || dice.length !== R.NDICE || dice.some(d => !(d >= 1 && d <= 6))) return 0;
    const c = R.counts(dice);
    switch (id) {
      case 'c1': case 'c2': case 'c3': case 'c4': case 'c5': case 'c6': { const n = +id[1]; return c[n] * n; }
      case 'par': for (let v = 6; v >= 1; v--) if (c[v] >= 2) return 2 * v; return 0;
      case 'tpar': {
        const pairs = [];
        for (let v = 6; v >= 1 && pairs.length < 2; v--) if (c[v] >= 2) pairs.push(v);
        return pairs.length === 2 ? 2 * pairs[0] + 2 * pairs[1] : 0;
      }
      case 'tre': for (let v = 6; v >= 1; v--) if (c[v] >= 3) return 3 * v; return 0;
      case 'fyr': for (let v = 6; v >= 1; v--) if (c[v] >= 4) return 4 * v; return 0;
      case 'ls': return c[1] === 1 && c[2] === 1 && c[3] === 1 && c[4] === 1 && c[5] === 1 ? 15 : 0;
      case 'ss': return c[2] === 1 && c[3] === 1 && c[4] === 1 && c[5] === 1 && c[6] === 1 ? 20 : 0;
      case 'kak': {
        const has3 = c.some(x => x === 3), has2 = c.some(x => x === 2);
        if (has3 && has2) return sum(dice);
        if (opts.yk && c.some(x => x === 5)) return sum(dice);
        return 0;
      }
      case 'ch': return sum(dice);
      case 'y': return c.some(x => x === 5) ? 50 : 0;
    }
    return 0;
  };
  R.upperSum = sheet => R.UPPER.reduce((a, id) => a + (sheet[id] || 0), 0);
  R.lowerSum = sheet => R.LOWER.reduce((a, id) => a + (sheet[id] || 0), 0);
  R.bonus = sheet => R.upperSum(sheet) >= R.BONUS_AT ? R.BONUS : 0;
  R.total = sheet => R.upperSum(sheet) + R.bonus(sheet) + R.lowerSum(sheet);
  R.filled = sheet => R.IDS.filter(id => sheet[id] != null).length;
  R.upperDone = sheet => R.UPPER.every(id => sheet[id] != null);
  // Går bonusen inte längre att nå? (även med fem av varje på de lediga raderna)
  R.bonusLost = sheet => R.upperSum(sheet) + R.UPPER.filter(id => sheet[id] == null).reduce((a, id) => a + 5 * +id[1], 0) < R.BONUS_AT;
  // Hur mycket som fattas till bonusen (0 när den är klar)
  R.bonusNeed = sheet => Math.max(0, R.BONUS_AT - R.upperSum(sheet));

  /* ---------- Läget ---------- */
  const blankSheet = () => Object.fromEntries(R.IDS.map(id => [id, null]));
  // seats: [{name, kind: 'human'|'cpu', level, av}], opts: {forced, yk}, first: vem som börjar
  R.create = ({seats, opts = {}, id = '', first = 0}) => {
    if (!Array.isArray(seats) || seats.length < 1 || seats.length > R.MAX_PLAYERS) fail('Fel antal spelare.');
    const n = seats.length;
    return {
      v: 1, id, k: 0,
      opts: {forced: !!opts.forced, yk: !!opts.yk},
      seats: seats.map(s => ({name: String(s.name || 'Spelare').slice(0, 16), kind: s.kind === 'cpu' ? 'cpu' : 'human', level: s.level || null, av: s.av || ''})),
      first: ((first % n) + n) % n,
      turn: ((first % n) + n) % n,
      round: 1,
      rolls: 0,
      dice: [0, 0, 0, 0, 0],
      held: [false, false, false, false, false],
      sheets: seats.map(() => blankSheet()),
      phase: 'play',
      winners: null,
      last: {t: 'start', seat: -1, ev: [{t: 'start'}]},
      ts: 0
    };
  };
  R.start = S => S;
  R.clone = S => JSON.parse(JSON.stringify(S));
  R.view = (S, seat) => Object.assign(R.clone(S), {me: seat});
  R.turns = () => R.IDS.length;
  R.isOver = S => S.phase === 'over';

  // Raderna som får fyllas i nu (tvångsyatzy: bara den översta lediga)
  R.allowed = (S, seat = S.turn) => {
    const sh = S.sheets[seat];
    const open = R.IDS.filter(id => sh[id] == null);
    return S.opts.forced ? open.slice(0, 1) : open;
  };
  // Vad varje ledig rad skulle ge med tärningarna som ligger (för den som har turen)
  R.potentials = S => {
    const out = {};
    if (S.phase !== 'play' || S.rolls < 1) return out;
    R.allowed(S).forEach(id => { out[id] = R.score(id, S.dice, S.opts); });
    return out;
  };
  const cleanHold = h => Array.from({length: R.NDICE}, (_, i) => !!(h && h[i]));

  // Kontrollerar ett drag. Ger '' om det går, annars en förklaring.
  R.check = (S, seat, a) => {
    if (!a || typeof a !== 'object') return 'Okänt drag.';
    if (S.phase !== 'play') return 'Partiet är slut.';
    if (seat !== S.turn) return 'Det är inte din tur.';
    if (a.t === 'roll') {
      if (S.rolls >= R.ROLLS) return 'Du har slagit tre gånger. Välj en rad i blocket.';
      const hold = cleanHold(a.hold);
      if (S.rolls > 0 && hold.every(Boolean)) return 'Du har sparat alla tärningar. Välj en rad i blocket, eller släpp någon tärning.';
      return '';
    }
    if (a.t === 'score') {
      if (S.rolls < 1) return 'Slå tärningarna först.';
      if (!R.IDS.includes(a.cat)) return 'Okänd rad.';
      if (S.sheets[seat][a.cat] != null) return 'Den raden är redan ifylld.';
      if (S.opts.forced && !R.allowed(S, seat).includes(a.cat)) return `Tvångsyatzy: raderna fylls i uppifrån. Nu gäller ${R.catName(R.allowed(S, seat)[0])}.`;
      return '';
    }
    return 'Okänt drag.';
  };

  // Gör ett drag. seat = den som gör det. Ger {S, ev}.
  R.apply = (S0, seat, a, rng = Math.random) => {
    const err = R.check(S0, seat, a);
    if (err) fail(err);
    const S = R.clone(S0);
    const ev = [];
    if (a.t === 'roll') {
      const hold = S.rolls === 0 ? [false, false, false, false, false] : cleanHold(a.hold);
      const idx = [];
      for (let i = 0; i < R.NDICE; i++) {
        if (hold[i]) continue;
        S.dice[i] = 1 + Math.floor(rng() * 6);
        if (S.dice[i] > 6) S.dice[i] = 6;
        idx.push(i);
      }
      S.held = hold;
      S.rolls++;
      ev.push({t: 'roll', seat, idx, dice: S.dice.slice(), held: hold.slice(), rolls: S.rolls});
      if (R.score('y', S.dice) === 50) ev.push({t: 'fivekind', seat});
    } else if (a.t === 'score') {
      const sh = S.sheets[seat];
      const before = R.upperSum(sh);
      const pts = R.score(a.cat, S.dice, S.opts);
      sh[a.cat] = pts;
      ev.push({t: 'score', seat, cat: a.cat, pts, dice: S.dice.slice()});
      if (before < R.BONUS_AT && R.upperSum(sh) >= R.BONUS_AT) ev.push({t: 'bonus', seat});
      // nästa spelare
      const n = S.seats.length;
      const next = (seat + 1) % n;
      if (next === S.first) S.round++;
      S.rolls = 0;
      S.held = [false, false, false, false, false];
      S.dice = [0, 0, 0, 0, 0];
      if (S.round > R.turns()) {
        S.phase = 'over';
        S.turn = -1;
        const totals = S.sheets.map(R.total);
        const best = Math.max(...totals);
        S.winners = totals.map((t, i) => t === best ? i : -1).filter(i => i >= 0);
        ev.push({t: 'over', winners: S.winners.slice(), totals});
      } else {
        S.turn = next;
        ev.push({t: 'turn', seat: next, round: S.round});
      }
    }
    S.k++;
    S.last = {t: a.t, seat, ev};
    return {S, ev};
  };

  // Ställning: [{seat, total}] sorterad, bäst först
  R.standings = S => S.sheets.map((sh, seat) => ({seat, total: R.total(sh)})).sort((a, b) => b.total - a.total || a.seat - b.seat);
  return R;
})();

// Svår: räknar ut det bästa draget för hela turen (vilka tärningar som ska sparas inför varje slag) genom att gå
// igenom alla möjliga utfall. Fem tärningar har bara 252 olika kombinationer, så det går på några millisekunder.
// Varje rad får ett värde: poängen nu, minus vad raden brukar ge om den sparas till senare, plus hur mycket
// chansen till bonus ändras. Medel ser bara ett slag framåt och tar ibland lite fel. Lätt spelar på känsla:
// sparar det den har flest av och skriver där det blir mest poäng.
const AI = (() => {
  const A = {};
  const N = 5;

  A.LEVELS = {
    latt: {name: 'latt', label: 'Lätt'},
    medel: {name: 'medel', label: 'Medel'},
    svar: {name: 'svar', label: 'Svår'}
  };
  A.NAMES = [
    {name: 'Doris', av: '👵'}, {name: 'Gunnar', av: '🎩'}, {name: 'Astrid', av: '🌷'}, {name: 'Sixten', av: '🦉'},
    {name: 'Maj', av: '🍒'}, {name: 'Lennart', av: '🧔'}, {name: 'Solveig', av: '🌻'}, {name: 'Rune', av: '⚓'},
    {name: 'Kerstin', av: '💐'}, {name: 'Bosse', av: '🎷'}, {name: 'Inga', av: '🦋'}, {name: 'Tage', av: '🎣'}
  ];

  // Inställda värden (tools/tune.mjs): vad en rad i genomsnitt ger om den sparas (evf), hur många tärningar
  // man brukar få på ettor–sexor (kd[tal][antal]) och hur fort radernas värde sjunker mot slutet (gamma).
  A.TUNE = {
    evf: {c1: 2.4, c2: 5.74, c3: 9.07, c4: 12.46, c5: 16, c6: 19.24, par: 11, tpar: 19.72, tre: 16.29, fyr: 12.55, ls: 3.61, ss: 8.63, kak: 21.5, ch: 23.29, y: 20.09},
    kd: {1: [.0568, .1703, .2712, .3242, .1737, .0037], 2: [.009, .0703, .2313, .4275, .2567, .0053], 3: [.0018, .0423, .1855, .4853, .2725, .0127],
      4: [.007, .0357, .123, .5172, .3035, .0135], 5: [.0063, .0295, .107, .487, .356, .0143], 6: [.01, .046, .115, .404, .4065, .0185]},
    gamma: 1.2
  };

  /* ---------- Kombinationerna ---------- */
  const POW = [1, 6, 36, 216, 1296, 7776];
  const FACT = [1, 1, 2, 6, 24, 120];
  const keyOf = c => c[1] + 6 * c[2] + 36 * c[3] + 216 * c[4] + 1296 * c[5] + 7776 * c[6];
  const digit = (key, f) => Math.floor(key / POW[f - 1]) % 6;
  // MS[m] = alla utfall med m tärningar: {key, cnt, p}
  const MS = [];
  for (let m = 0; m <= N; m++) {
    const list = [];
    const rec = (face, left, cnt) => {
      if (face === 6) {
        const c = cnt.slice(); c[6] = left;
        let den = 1; for (let f = 1; f <= 6; f++) den *= FACT[c[f]];
        list.push({key: keyOf(c), cnt: c, p: FACT[m] / den / Math.pow(6, m)});
        return;
      }
      for (let x = 0; x <= left; x++) { cnt[face] = x; rec(face + 1, left - x, cnt); }
      cnt[face] = 0;
    };
    rec(1, m, [0, 0, 0, 0, 0, 0, 0]);
    MS.push(list);
  }
  const FULL = MS[N];
  const NF = FULL.length;   // 252
  const fullIdx = new Int16Array(46656).fill(-1);
  FULL.forEach((f, i) => { fullIdx[f.key] = i; });
  const FULL_DICE = FULL.map(f => { const d = []; for (let v = 1; v <= 6; v++) for (let j = 0; j < f.cnt[v]; j++) d.push(v); return d; });
  const sizeOf = key => { let s = 0; for (let f = 1; f <= 6; f++) s += digit(key, f); return s; };
  // alla delmängder att spara (utom alla fem, som är samma sak som att skriva in nu)
  const SUBS = FULL.map(f => {
    const out = [];
    const rec = (face, key) => { if (face > 6) { out.push(key); return; } for (let x = 0; x <= f.cnt[face]; x++) rec(face + 1, key + x * POW[face - 1]); };
    rec(1, 0);
    return out.filter(k => k !== f.key);
  });
  const SIZE = new Map();
  const size = key => { let s = SIZE.get(key); if (s === undefined) { s = sizeOf(key); SIZE.set(key, s); } return s; };
  const diceKey = dice => keyOf(Rules.counts(dice));
  A.fullIndex = dice => fullIdx[diceKey(dice)];

  // Poängtabeller för alla kombinationer (med och utan husregeln fem lika = kåk)
  const scoreTabs = {};
  const scoreTab = yk => {
    const k = yk ? 1 : 0;
    if (scoreTabs[k]) return scoreTabs[k];
    const t = {};
    Rules.IDS.forEach(id => { t[id] = Float64Array.from(FULL_DICE, d => Rules.score(id, d, {yk})); });
    return (scoreTabs[k] = t);
  };

  // Går igenom turen baklänges: V[r][i] = bästa väntade värde med kombination i och r slag kvar.
  // E[r](behåll) = väntat värde om man sparar 'behåll' och slår om resten.
  function solve(T, depth) {
    const V = [T], E = [null];
    for (let r = 1; r <= depth; r++) {
      const prev = V[r - 1], memo = new Map();
      const Er = key => {
        let e = memo.get(key);
        if (e !== undefined) return e;
        e = 0;
        for (const o of MS[N - size(key)]) e += o.p * prev[fullIdx[key + o.key]];
        memo.set(key, e);
        return e;
      };
      const Vr = new Float64Array(NF);
      for (let i = 0; i < NF; i++) { let best = T[i]; for (const k of SUBS[i]) { const e = Er(k); if (e > best) best = e; } Vr[i] = best; }
      V.push(Vr); E.push(Er);
    }
    return {V, E};
  }

  /* ---------- Bonusen ---------- */
  // Sannolikheten att nå bonusen: för varje kombination av lediga rader bland ettor–sexor och poäng som fattas.
  // Antalet tärningar man får på en rad följer fördelningen kd (från simuleringar).
  const BIN = (() => { const p = 1 - Math.pow(5 / 6, 3); return [0, 1, 2, 3, 4, 5].map(k => FACT[5] / FACT[k] / FACT[5 - k] * Math.pow(p, k) * Math.pow(1 - p, 5 - k)); })();
  let PB = null;
  function buildBonus() {
    const kd = A.TUNE.kd || {1: BIN, 2: BIN, 3: BIN, 4: BIN, 5: BIN, 6: BIN};
    PB = [];
    for (let mask = 0; mask < 64; mask++) {
      let dist = new Float64Array(106); dist[0] = 1;
      for (let n = 1; n <= 6; n++) {
        if (!(mask & (1 << (n - 1)))) continue;
        const nd = new Float64Array(106);
        for (let s = 0; s < 106; s++) { if (!dist[s]) continue; for (let k = 0; k <= 5; k++) { const t = s + k * n; if (t < 106) nd[t] += dist[s] * kd[n][k]; } }
        dist = nd;
      }
      const tail = new Float64Array(65);
      let acc = 0;
      for (let s = 105; s >= 0; s--) { acc += dist[s]; if (s <= 64) tail[s] = acc; }
      PB.push(tail);
    }
  }
  const pBonus = (mask, need) => need <= 0 ? 1 : need > 63 ? 0 : (PB || (buildBonus(), PB))[mask][need];
  A.rebuild = () => { PB = null; EVT = null; };

  /* ---------- Radernas värde ---------- */
  // Vad en rad ger om man satsar allt på den under en enda tur (för slutet av partiet)
  let EVT = null;
  function evTarget() {
    if (EVT) return EVT;
    EVT = {};
    const tab = scoreTab(false);
    Rules.IDS.forEach(id => { const {V} = solve(tab[id], 2); let e = 0; for (const o of MS[N]) e += o.p * V[2][fullIdx[o.key]]; EVT[id] = e; });
    return EVT;
  }
  const upBit = id => { const c = Rules.cat(id); return c && c.up ? 1 << (c.up - 1) : 0; };
  // Kostnaden för att använda en rad nu: vad den väntas ge senare (m = antal lediga rader)
  function cost(id, m) {
    const f = A.TUNE.evf[id], t = evTarget()[id];
    const g = Math.pow(clamp((m - 1) / 14, 0, 1), A.TUNE.gamma);
    return t + (f - t) * g;
  }

  // Terminalvärdena (skriva in nu) för alla kombinationer, och en funktion som ger radernas värden för en kombination
  function valuation(V, seat, P) {
    const sh = V.sheets[seat];
    const allowed = Rules.allowed(V, seat);
    const m = Rules.IDS.filter(id => sh[id] == null).length;
    const U = Rules.upperSum(sh);
    let mask = 0;
    Rules.UPPER.forEach(id => { if (sh[id] == null) mask |= upBit(id); });
    const bw = P.bonusW;
    const pNow = bw ? pBonus(mask, Rules.BONUS_AT - U) : 0;
    const tab = scoreTab(V.opts.yk);
    const cv = allowed.map(id => ({id, c: cost(id, m) * P.costW, bit: upBit(id), s: tab[id]}));
    const valOf = (c, i) => {
      const s = c.s[i];
      let v = s - c.c;
      if (c.bit && bw) v += bw * Rules.BONUS * (pBonus(mask & ~c.bit, Rules.BONUS_AT - U - s) - pNow);
      return v;
    };
    const T = new Float64Array(NF);
    for (let i = 0; i < NF; i++) { let best = -1e9; for (const c of cv) { const v = valOf(c, i); if (v > best) best = v; } T[i] = best; }
    return {T, cv, valOf};
  }

  const PARAMS = {
    svar: {depth: 2, bonusW: 1, costW: 1, noise: 0, keepNoise: 0},
    medel: {depth: 1, bonusW: .35, costW: .8, noise: 4, keepNoise: .3},
    latt: {depth: 0, bonusW: 0, costW: .55, noise: 3.5, keepNoise: 0}
  };
  const gauss = rng => { let u = 0, v = 0; while (u === 0) u = rng(); v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const holdFor = (dice, keepKey) => {
    const need = [0, 0, 0, 0, 0, 0, 0];
    for (let f = 1; f <= 6; f++) need[f] = digit(keepKey, f);
    return dice.map(d => { if (need[d] > 0) { need[d]--; return true; } return false; });
  };

  // Datorns (eller tipsets) beslut: {t: 'roll', hold} eller {t: 'score', cat}
  A.decide = (V, seat, level = 'medel', rng = Math.random) => {
    const P = PARAMS[level] || PARAMS.medel;
    if (V.phase !== 'play' || V.turn !== seat) return null;
    if (V.rolls === 0) return {t: 'roll', hold: [false, false, false, false, false]};
    if (level === 'latt') return easy(V, seat, rng);
    const {T, cv, valOf} = valuation(V, seat, P);
    const i = fullIdx[diceKey(V.dice)];
    const left = Rules.ROLLS - V.rolls;
    if (left > 0) {
      const depth = Math.min(left, P.depth);
      const {E} = solve(T, depth);
      // med två slag kvar men bara ett slags förutseende (medel): räkna som om det vore sista slaget
      const Er = E[depth];
      const opts = SUBS[i].map(k => ({k, e: Er(k)})).sort((a, b) => b.e - a.e);
      let best = opts[0];
      if (P.keepNoise && opts.length > 1 && rng() < P.keepNoise && opts[1].e > T[i]) best = opts[1];
      if (best && best.e > T[i] + 1e-9) return {t: 'roll', hold: holdFor(V.dice, best.k)};
    }
    let bestC = null, bv = -1e9;
    for (const c of cv) { const v = valOf(c, i) + (P.noise ? gauss(rng) * P.noise : 0); if (v > bv) { bv = v; bestC = c; } }
    return {t: 'score', cat: bestC.id};
  };
  A.act = A.decide;

  // Lätt: sparar det den har flest av (eller en stege på gång) och skriver där det ger mest just nu
  function easy(V, seat, rng) {
    const sh = V.sheets[seat], dice = V.dice, c = Rules.counts(dice);
    const allowed = Rules.allowed(V, seat);
    const left = Rules.ROLLS - V.rolls;
    const pts = id => Rules.score(id, dice, V.opts);
    // ettor–sexor: tre eller fler av talet är bra för bonusen, färre är dåligt
    const upNudge = id => { const u = Rules.cat(id).up; return u ? (c[u] >= 3 ? 5 : c[u] <= 1 ? -4 : -1) : 0; };
    const bestNow = allowed.map(id => ({id, v: pts(id) - A.TUNE.evf[id] * PARAMS.latt.costW + upNudge(id) + gauss(rng) * PARAMS.latt.noise}));
    // bra nog att skriva in direkt?
    const great = allowed.some(id => (id === 'y' && pts(id)) || ((id === 'ls' || id === 'ss') && pts(id)) || (id === 'kak' && pts(id) >= 20));
    if (left > 0 && !great) {
      const want = allowed.filter(id => sh[id] == null);
      const straightOpen = want.includes('ls') || want.includes('ss');
      const distinct = [1, 2, 3, 4, 5, 6].filter(v => c[v] > 0);
      let hold;
      // stege på gång: minst fyra olika i följd
      const runs = [[1, 2, 3, 4, 5], [2, 3, 4, 5, 6]].map(r => r.filter(v => c[v] > 0));
      const run = runs.sort((a, b) => b.length - a.length)[0];
      if (straightOpen && run.length >= 4 && rng() < .85) {
        const used = new Set();
        hold = dice.map(d => { if (run.includes(d) && !used.has(d)) { used.add(d); return true; } return false; });
      } else {
        let best = 6, bc = 0;
        for (let v = 6; v >= 1; v--) if (c[v] > bc) { bc = c[v]; best = v; }
        if (bc === 1 && distinct.length === 5) hold = dice.map(d => d >= 5 && d === Math.max(...dice));
        else hold = dice.map(d => d === best);
      }
      if (hold.some(x => !x)) return {t: 'roll', hold};
    }
    bestNow.sort((a, b) => b.v - a.v);
    return {t: 'score', cat: bestNow[0].id};
  }

  /* ---------- Tips till spelaren ---------- */
  const WORD = {1: ['etta', 'ettor'], 2: ['tvåa', 'tvåor'], 3: ['trea', 'treor'], 4: ['fyra', 'fyror'], 5: ['femma', 'femmor'], 6: ['sexa', 'sexor']};
  const NUM = ['', 'en', 'två', 'tre', 'fyra', 'fem'];
  A.diceWords = vals => {
    const c = Rules.counts(vals);
    const parts = [];
    for (let v = 6; v >= 1; v--) if (c[v]) parts.push(c[v] === 1 ? 'en ' + WORD[v][0] : NUM[c[v]] + ' ' + WORD[v][1]);
    if (!parts.length) return '';
    const distinct = [1, 2, 3, 4, 5, 6].filter(v => c[v]);
    if (distinct.length >= 3 && distinct.every(v => c[v] === 1) && distinct[distinct.length - 1] - distinct[0] === distinct.length - 1) return distinct.join('-');
    return parts.length > 1 ? parts.slice(0, -1).join(', ') + ' och ' + parts[parts.length - 1] : parts[0];
  };
  // Tips: {t, hold|cat, text}
  A.hint = (V, seat) => {
    const d = A.decide(V, seat, 'svar');
    if (!d) return null;
    if (V.rolls === 0) return Object.assign(d, {text: 'Slå tärningarna!'});
    if (d.t === 'roll') {
      const kept = V.dice.filter((_, i) => d.hold[i]);
      return Object.assign(d, {text: kept.length ? `Spara ${A.diceWords(kept)} och slå igen.` : 'Slå om alla tärningarna.'});
    }
    const pts = Rules.score(d.cat, V.dice, V.opts);
    return Object.assign(d, {pts, text: pts ? `Skriv ${pts} på ${Rules.catName(d.cat)}.` : `Stryk ${Rules.catName(d.cat)}. Det kostar minst där.`});
  };

  // För tester och inställning
  A._internals = {MS, FULL, FULL_DICE, SUBS, solve, pBonus, evTarget, cost, valuation, fullIdx, diceKey};
  return A;
})();

/* ---- 05-tables.js ---- */
/* ================= Bordsplaceringen vid Spelstunden ================= */
// Klockan 14.00 delas alla som anmält sig in i bord om två till fyra. Reglerna, i den här ordningen:
//  1. Den som annars skulle bli ensam med sitt spel får sällskap först, av någon som valt "Vad som helst".
//  2. Övriga som valt "Vad som helst" hamnar där borden blir jämnast (helst fyra vid bordet, aldrig någon ensam).
//  3. Varje spel delas i så få bord som möjligt, med jämn storlek: 8 blir 4 + 4, 7 blir 4 + 3, 5 blir 3 + 2.
//  4. Den som bett att få sitta med en vän hamnar vid samma bord (vängrupperna placeras först).
//  5. Ett bord med en ny deltagare, eller med någon som ändå blev ensam, får en värd.
const Tables = (() => {
  const X = {};
  // Bordens storlek för n spelare med högst max vid varje bord
  X.sizes = (n, max = 4) => {
    if (n <= 0) return [];
    const k = Math.ceil(n / max), base = Math.floor(n / k), extra = n % k;
    return Array.from({ length: k }, (_, i) => base + (i < extra ? 1 : 0));
  };
  // Hur dåligt det blir: ensam vid bordet är värst, fyra är bäst
  const COST = { 1: 100, 2: 3, 3: 1, 4: 0 };
  X.penalty = (n, max = 4) => X.sizes(n, max).reduce((a, s) => a + (COST[s] != null ? COST[s] : 0), 0);

  // signups: [{id, game, friend, isNew}] i den ordning de anmält sig.
  // opts: {max: {spel: antal}, hosts: [id], names: [bordsnamn]}. Ger {tables: [{id, name, game, seats, host}], moved}.
  X.assign = (signups, opts = {}) => {
    const max = g => (opts.max && opts.max[g]) || 4;
    const names = opts.names || ['Bord'];
    const byGame = {}, anyPool = [], moved = [];
    signups.forEach(s => { if (s.game === 'any') anyPool.push(s); else (byGame[s.game] = byGame[s.game] || []).push(s); });
    // 1. ingen ska bli ensam
    for (const g of Object.keys(byGame)) {
      if (byGame[g].length === 1 && anyPool.length) { const s = anyPool.shift(); byGame[g].push(s); moved.push({ id: s.id, to: g }); }
    }
    // 2. resten dit det gör mest nytta
    while (anyPool.length) {
      const s = anyPool.shift();
      let best = null, gain = -Infinity;
      for (const g of Object.keys(byGame)) {
        const n = byGame[g].length, d = X.penalty(n, max(g)) - X.penalty(n + 1, max(g));
        if (d > gain) { gain = d; best = g; }
      }
      if (!best) { best = s.fallback || 'yatzy'; byGame[best] = []; }
      byGame[best].push(s); moved.push({ id: s.id, to: best });
    }
    // 3 och 4. bord per spel, vängrupper först
    const tables = [];
    for (const g of Object.keys(byGame)) {
      const list = byGame[g], sizes = X.sizes(list.length, max(g));
      const parent = {};
      list.forEach(s => { parent[s.id] = s.id; });
      const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
      list.forEach(s => { if (s.friend && parent[s.friend] !== undefined) parent[find(s.id)] = find(s.friend); });
      const groups = {};
      list.forEach(s => { const r = find(s.id); (groups[r] = groups[r] || []).push(s.id); });
      const gs = Object.values(groups).sort((a, b) => b.length - a.length);
      const seats = sizes.map(() => []);
      const freeAt = i => sizes[i] - seats[i].length;
      for (const grp of gs) {
        let idx = -1;
        seats.forEach((_, i) => { if (freeAt(i) >= grp.length && (idx < 0 || freeAt(i) > freeAt(idx))) idx = i; });
        if (idx >= 0) seats[idx].push(...grp);
        else for (const id of grp) {   // gruppen är större än något bord: dela den
          let j = -1;
          seats.forEach((_, i) => { if (freeAt(i) > 0 && (j < 0 || freeAt(i) > freeAt(j))) j = i; });
          seats[j].push(id);
        }
      }
      seats.forEach(members => tables.push({ id: 'b' + (tables.length + 1), name: names[tables.length % names.length], game: g, seats: members, host: null }));
    }
    // 5. värdar
    const hosts = (opts.hosts || []).slice();
    const isNew = id => (signups.find(s => s.id === id) || {}).isNew;
    for (const t of tables) if (hosts.length && (t.seats.length === 1 || t.seats.some(isNew))) t.host = hosts.shift();
    return { tables, moved };
  };
  return X;
})();

/* ---- 06-bingo.js ---- */
/* ================= Bingo: brickor, rop och kontroll ================= */
// Vanlig 75-bingo: brickan har fem kolumner B (1–15), I (16–30), N (31–45), G (46–60), O (61–75) och en fri ruta i mitten.
// En rad (vågrätt, lodrätt eller diagonalt) ger bingo. Brickan sparas radvis som 25 tal, där 0 är den fria rutan.
const Bingo = (() => {
  const B = {};
  B.letter = n => 'BINGO'[Math.floor((n - 1) / 15)];
  B.card = rnd => {
    const cols = [0, 1, 2, 3, 4].map(c => shuffle(Array.from({ length: 15 }, (_, i) => c * 15 + i + 1), rnd).slice(0, 5).sort((a, b) => a - b));
    const cells = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) cells.push(r === 2 && c === 2 ? 0 : cols[c][r]);
    return cells;
  };
  B.LINES = (() => {
    const L = [];
    for (let r = 0; r < 5; r++) L.push([0, 1, 2, 3, 4].map(c => r * 5 + c));
    for (let c = 0; c < 5; c++) L.push([0, 1, 2, 3, 4].map(r => r * 5 + c));
    L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
    return L;
  })();
  // Raden som är klar (index på brickan), eller null. has(n): är talet markerat/ropat.
  B.line = (cells, has) => B.LINES.find(line => line.every(i => cells[i] === 0 || has(cells[i]))) || null;
  // Efter hur många rop brickan får bingo (med ropen i ordning), eller Infinity
  B.winsAt = (cells, order) => {
    const got = new Set();
    for (let k = 0; k < order.length; k++) { got.add(order[k]); if (B.line(cells, n => got.has(n))) return k + 1; }
    return Infinity;
  };

  // En omgång för demon. target: den som ska få bingo först, vid ungefär rop nummer at.
  // Den mittersta raden används (fyra tal och den fria rutan). Ingen annan bricka får bingo före target + 4 rop.
  B.round = ({ seed, target, others, at = 13 }) => {
    const rnd = seeded(seed);
    const cards = {};
    cards[target] = B.card(rnd);
    const mine = cards[target], row = [10, 11, 13, 14].map(i => mine[i]);
    const onCard = new Set(mine.filter(Boolean));
    const rest = shuffle(Array.from({ length: 75 }, (_, i) => i + 1).filter(n => !row.includes(n)), rnd);
    // några av de första ropen ska finnas på brickan (någon annanstans), så att det finns något att markera
    const early = [], filler = [];
    for (const n of rest) (onCard.has(n) && early.length < 4 ? early : filler).push(n);
    // rop 1..at-4: två av radens tal, de tidiga och fyllnad; sedan det tredje bland två till; radens sista tal som rop nummer at
    let fi = 0;
    const first = shuffle([row[0], row[1], ...early, ...filler.slice(fi, fi += Math.max(0, at - 6 - early.length))], rnd);
    const second = shuffle([row[2], ...filler.slice(fi, fi += 2)], rnd);
    const order = [...first, ...second, row[3], ...filler.slice(fi)];
    for (const id of others) {
      let c = null;
      for (let tries = 0; tries < 300; tries++) { c = B.card(rnd); if (B.winsAt(c, order) > at + 4) break; }
      cards[id] = c;
    }
    return { order, cards };
  };
  return B;
})();

/* ---- 07-sim.js ---- */
/* ================= Simuleringen: en dag i Träffpunkt Hemma ================= */
// Klockan (App.s.t) går i vanlig takt och presentatören hoppar till olika tider. Allt som händer vid en viss tid
// (Spelstunden, bingon, morgonhälsningen) är tidshändelser. Hoppar klockan framåt sker händelserna däremellan
// "i det tysta" (utan ljud och rutor, om de inte är färska). Hoppar den bakåt börjar dagen om och spolas fram.
// Det som händer i rummen (samtalen, tärningarna, bingoropen) går i verklig tid, så att det hinner synas och höras.
const Clock = {
  now() { const c = App.s.clock; return c.base + (performance.now() - c.real) / 1000 * c.speed; }
};

const Sim = (() => {
  const X = {};
  const rnd = seeded(2026);
  const H = h => Math.round(h * 3600);   // 13.5 -> 13.30

  /* ---------- Vem som är inloggad och var ---------- */
  // Fasta tider för dem som syns i demon, slumpade (men likadana varje gång) för resten
  const FIXED = {
    karin: [[8.5, 12], [13.3, 17.5]], bengt: [[8.6, 11.6], [13.4, 16.2]], sonja: [[8.9, 12.4], [13.45, 16.5]],
    gosta: [[8.65, 12.2], [14.7, 16.3]], margareta: [[9.4, 11.2], [13.4, 16]], barbro: [[9.1, 11.8], [13.45, 16]],
    solveig: [[9.9, 11.5], [13.5, 15.2]], gunvor: [[9.2, 10.4], [13.5, 16.4]], stig: [[8.8, 9.8], [14.7, 16]],
    lena: [[8.8, 16.6]], kjell: [[13.45, 15.5], [18.8, 20.2]], bo: [[8.3, 9.2], [15.8, 17.2]]
  };
  const SIGNED = new Set(SIGNUP_PLAN.map(s => s.id));
  const LIVE_HOME = ['gunvor', 'gosta', 'stig', 'margareta', 'barbro', 'sonja', 'bengt', 'karin', 'rune', 'elsa', 'kerstin'];
  const WIN = {};
  for (const p of [...PEOPLE, ...Object.values(STAFF)]) {
    if (p.me) continue;
    if (FIXED[p.id]) { WIN[p.id] = FIXED[p.id].map(w => w.map(H)); continue; }
    const w = [];
    if (p.staff) { WIN[p.id] = w; continue; }
    if (rnd() < .65) { const a = 8.5 + rnd() * 1.5; w.push([a, a + .8 + rnd() * 1.8]); }
    if (SIGNED.has(p.id) || LIVE_HOME.includes(p.id) || rnd() < .6) w.push([13.35 + rnd() * .3, 15.2 + rnd() * 1.2]);
    if (rnd() < .3) { const a = 18.7 + rnd() * .5; w.push([a, a + .8 + rnd()]); }
    WIN[p.id] = w.map(x => x.map(H));
  }
  const onlineAt = (id, t) => (WIN[id] || []).some(([a, b]) => t >= a && t < b);
  // I Fikarummet under förmiddagsfikan (utöver Lena, som är värd)
  const FIKA_AM = { karin: [9.55, 10.9], bengt: [9.65, 10.75], sonja: [9.75, 11], margareta: [9.5, 10.4], gunvor: [9.3, 10.2], solveig: [10.1, 10.8], stig: [9.1, 9.7] };
  const FIKA_PM = { rolf: [16, 16.8], gosta: [16.05, 16.25], kerstin: [16.1, 16.9], lennart: [16.2, 17], karin: [16.3, 17] };
  const LAMPS = { karin: [[9.2, 11.4]], gosta: [[10, 12.1]], barbro: [[9.5, 10.6]], stig: [[8.9, 9.7]], margareta: [[16.1, 17]], elsa: [[19, 20]] };
  const inWin = (w, t) => w && t >= H(w[0]) && t < H(w[1]);

  // Sätter allas status efter klockan (körs varje sekund)
  function presence(s, t) {
    const sp = s.spel, tableOf = {};
    if (sp.phase === 'playing') sp.tables.forEach(tb => tb.seats.concat(tb.host ? [tb.host] : []).forEach(id => { tableOf[id] = tb.id; }));
    for (const id of Object.keys(s.people)) {
      if (id === 'ingrid' || FAMILY[id]) continue;
      const q = s.people[id];
      if (id === 'mats') { q.online = s.live.on; q.where = s.live.on ? 'venue' : null; continue; }
      if (id === 'eva') { q.online = t >= T(10, 25) && t < T(10, 55); q.where = q.online ? 'venue' : null; continue; }
      if (id === 'support') { q.online = true; continue; }
      q.online = onlineAt(id, t) || !!tableOf[id];
      let where = null;
      if (q.online) {
        if (tableOf[id]) where = 'spel';
        else if (s.live.on && s.live.home.includes(id)) where = 'live';
        else if (fikaOpen(t) && fikaItem(t).host === id) where = 'fika';
        else if (inWin(FIKA_AM[id], t) || inWin(FIKA_PM[id], t)) where = 'fika';
      }
      q.where = where;
      q.lamp = q.online && (LAMPS[id] || []).some(w => inWin(w, t)) && where !== 'spel';
    }
  }

  /* ---------- Tidshändelser ---------- */
  // fresh: händelsen inträffade nyss (inom två minuter), så att ljud och rutor passar
  const EVENTS = [
    { id: 'morgon', at: T(9), run(s, fresh) { if (fresh && !s.me.mood) queue(s, { kind: 'morning' }); } },
    { id: 'gympa', at: T(10, 30), run(s, fresh) { if (fresh) toast(s, { icon: 'tv', text: 'Sittgympan sänds nu från Träffpunkt Trelleborg.', go: () => Act.go('live', { sub: 'gympa' }) }); } },
    { id: 'halsning', at: T(12, 30), run(s, fresh) { if (!s.photos.length) X.receivePhoto(s, 'fotboll', fresh); } },
    { id: 'anmalan', at: T(13, 30), run(s, fresh) { s.spel.phase = 'signup'; s.spel.openedReal = performance.now(); if (fresh && !s.spel.signups.ingrid) queue(s, { kind: 'signup' }); } },
    { id: 'spelstart', at: T(14), run(s, fresh) { X.startTables(s, fresh); } },
    { id: 'bingo5', at: T(14, 55), run(s, fresh) { if (fresh) toast(s, { icon: 'tv', text: 'Bingon börjar om fem minuter.' }); } },
    { id: 'spelslut', at: T(15), run(s) { X.endTables(s); } },
    { id: 'bingo', at: T(15), run(s, fresh) { X.startLive(s, fresh); } },
    { id: 'bingoslut', at: T(16), run(s) { X.endLive(s); } }
  ];

  function queue(s, m) {
    if (s.queue.some(q => q.kind === m.kind && ((q.kind !== 'photo' && q.kind !== 'notice') || q.id === m.id))) return;
    if (m.kind === 'call') s.queue.unshift(m); else s.queue.push(m);
    s.senior.idle = false;   // plattan vaknar när något händer
    // plattan säger bara till när den syns i presentationen (eller när demon körs på en riktig platta)
    const heard = s.started && tabletVisible(s);
    const sound = { morning: 'notify', signup: 'notify', tablestart: 'notify', live: 'notify', photo: 'notify', call: 'ring', invite: 'soft', notice: 'notify' }[m.kind];
    if (sound && heard) Sound.play(sound);
    const line = m.kind === 'notice' ? 'notice_' + ((s.notices.find(n => n.id === m.id) || {}).nid || '')
      : { morning: 'app_morgon', signup: 'app_anmalan', tablestart: 'app_start', live: 'app_bingo', photo: 'app_halsning' }[m.kind];
    if (line && heard) setTimeout(() => Voice.say('app', line), 350);
    Bus.emit('modal', m);
  }
  function toast(s, x) {
    const id = uid('t');
    s.senior.toasts = s.senior.toasts.concat([Object.assign({ id }, x)]).slice(-3);
    if (s.started) Sound.play('soft');
    setTimeout(() => mut(s2 => { s2.senior.toasts = s2.senior.toasts.filter(q => q.id !== id); }), x.ms || 6500);
  }
  X.queue = queue;
  X.toast = toast;
  const log = (s, text, icon = 'dot') => { s.spel.log.unshift({ t: s.t, text, icon }); s.spel.log = s.spel.log.slice(0, 40); };
  X.log = log;

  /* ---------- Klockan ---------- */
  // Anropas fyra gånger i sekunden
  X.tick = () => {
    const s = App.s;
    if (!s) return;
    const t = Clock.now();
    const prevMin = Math.floor(s.t / 60);
    const prev = s.t;
    s.t = t;
    let changed = Math.floor(t / 60) !== prevMin;
    for (const e of EVENTS) if (!s.events[e.id] && e.at <= t && e.at > prev - 1) { s.events[e.id] = true; e.run(s, t - e.at < 120); changed = true; }
    changed = realtime(s) || changed;
    if (changed) { presence(s, t); App.emit(); }
  };
  // Hoppa till en tid. Bakåt: dagen börjar om (vyn, visningen och inställningarna behålls) och spolas fram.
  X.jump = target => {
    let s = App.s;
    Voice.stopAll();
    if (target < s.t - 1) {
      const keep = { started: s.started, view: s.view, device: s.device, settings: s.settings, tour: s.tour };
      App.s = s = freshState(keep);
    }
    const from = s.t;
    s.clock = { base: target, real: performance.now(), speed: s.clock.speed || 1 };
    s.t = target;
    for (const e of EVENTS) if (!s.events[e.id] && e.at <= target && e.at > from - 1) { s.events[e.id] = true; e.run(s, target - e.at < 120); }
    if (s.room && s.room.kind === 'fika' && !fikaOpen(target)) s.room = null;
    // rutor som inte längre stämmer med tiden tas bort
    s.queue = s.queue.filter(q => q.kind === 'photo' || (q.kind === 'morning' && target < T(10, 30) && !s.me.mood) || (q.kind === 'signup' && s.spel.phase === 'signup' && !s.spel.signups.ingrid)
      || (q.kind === 'tablestart' && s.spel.phase === 'playing') || (q.kind === 'live' && s.live.on));
    s.calls.incoming = null;
    presence(s, target);
    App.emit();
  };

  /* ---------- Det som går i verklig tid ---------- */
  let nextChat = performance.now() + 45000, nextSign = 0;
  function realtime(s) {
    const now = performance.now();
    let changed = false;
    // nya meddelanden i Dagens prat då och då
    if (s.started && now > nextChat && s.chatLive < CHAT_LIVE.length && s.t > T(9) && s.t < T(20)) {
      const m = CHAT_LIVE[s.chatLive++];
      s.chat.push({ id: uid('c'), by: m.by, t: s.t, text: m.text, react: {} });
      changed = true;
      nextChat = now + 55000 + Math.random() * 30000;
    }
    // anmälningarna till Spelstunden kommer en i taget (Karin först)
    if (s.spel.phase === 'signup' && s.spel.planned < SIGNUP_PLAN.length && now > nextSign) {
      const p = SIGNUP_PLAN[s.spel.planned++];
      s.spel.signups[p.id] = { game: p.game, friend: p.friend || null, at: s.t };
      log(s, `${fullName(p.id)} anmälde sig till ${game(p.game).name}`, 'dice');
      if (p.id === 'karin' && !s.spel.signups.ingrid) toast(s, { who: 'karin', text: 'Karin har anmält sig till Yatzy och vill gärna spela med dig.' });
      nextSign = now + (s.spel.planned < 4 ? 1600 : 2400) + Math.random() * 1400;
      changed = true;
    }
    // födelsedagshälsningarna till Margareta blir fler under dagen
    const bc = BIRTHDAY.count + Math.max(0, Math.min(24, Math.floor((s.t - T(9)) / 600))) + (s.birthday.sent ? 1 : 0);
    if (bc !== s.birthday.count) { s.birthday.count = bc; changed = true; }
    return changed;
  }

  /* ---------- Spelstunden ---------- */
  X.startTables = (s, fresh) => {
    const sp = s.spel;
    while (sp.planned < SIGNUP_PLAN.length) { const p = SIGNUP_PLAN[sp.planned++]; sp.signups[p.id] = { game: p.game, friend: p.friend || null, at: T(13, 59) }; }
    const list = Object.entries(sp.signups).sort((a, b) => a[1].at - b[1].at || (a[0] === 'karin' ? -1 : 0))
      .map(([id, x]) => ({ id, game: x.game, friend: x.friend, isNew: !!person(id).isNew }));
    const { tables, moved } = Tables.assign(list, { hosts: ['lena'], names: TABLE_NAMES });
    sp.tables = tables;
    sp.moved = moved;
    sp.phase = 'playing';
    log(s, `Klockan 14.00: ${list.length} personer delades in i ${tables.length} bord`, 'table');
    const mine = tables.find(tb => tb.seats.includes('ingrid'));
    sp.mine = mine ? mine.id : null;
    if (mine) {
      if (mine.game === 'yatzy') X.newYatzy(s, mine);
      if (fresh) queue(s, { kind: 'tablestart', table: mine.id });
    }
  };
  X.endTables = s => {
    s.spel.phase = 'done';
    if (s.room && s.room.kind === 'table') { Voice.stop('table'); s.room = null; }
  };
  X.newYatzy = (s, tb) => {
    const seats = tb.seats.slice().sort((a, b) => (a === 'ingrid' ? -1 : b === 'ingrid' ? 1 : 0));
    s.yatzy = { table: tb.id, seats, S: Rules.create({ seats: seats.map(id => ({ name: firstName(id), kind: id === 'ingrid' ? 'human' : 'cpu', level: 'medel' })), first: 0 }),
      rolling: false, note: '', last: null, spoke: {}, greeted: false, over: false, pratted: [] };
  };

  /* ---------- Bingon ---------- */
  X.startLive = (s, fresh) => {
    const L = s.live;
    L.on = true; L.round = 0;
    L.home = LIVE_HOME.slice();
    L.greetings = [
      { by: 'gunvor', text: 'Hej allihop! Kaffet är klart här hemma.', t: T(15, 0, 20) },
      { by: 'stig', text: 'Hälsningar från Stig! Jag ser jättebra med den stora texten.', t: T(15, 1) }
    ];
    X.newRound(s);
    log(s, 'Bingon sänds från Träffpunkt Trelleborg', 'tv');
    if (fresh) queue(s, { kind: 'live' });
  };
  X.newRound = s => {
    const L = s.live;
    L.round++;
    const others = L.home.filter(id => id !== 'ingrid');
    const target = L.round === 1 ? 'ingrid' : 'gunvor';
    const r = Bingo.round({ seed: 40 + L.round, target, others: target === 'ingrid' ? others : ['ingrid', ...others.filter(id => id !== 'gunvor')], at: L.round === 1 ? 13 : 9 });
    L.order = r.order; L.cards = r.cards; L.called = []; L.marked = []; L.winners = []; L.claim = null; L.target = target;
    L.nextCall = 0; L.status = L.round === 1 ? 'intro' : 'ny';
  };
  X.endLive = s => { s.live.on = false; s.live.status = 'slut'; Voice.stop('live'); };
  // Tittar någon? (Ingrid i sändningen eller tv:n i salen i presentationen)
  X.watching = s => (s.senior.route === 'live' && s.senior.sub === 'watch') || /tv/.test(s.view) || (s.view === 'personal' && s.staff.route === 'sandning');

  /* ---------- Bildhälsningar ---------- */
  X.receivePhoto = (s, photo, fresh = true, voice = true) => {
    const ph = PHOTOS.find(p => p.id === photo) || PHOTOS[0];
    const item = { id: uid('p'), photo: ph.id, from: 'anna', text: ph.text, voice: voice ? 'anna_' + ph.id : null, t: s.t, seen: false, heart: false };
    s.photos.unshift(item);
    if (fresh) queue(s, { kind: 'photo', id: item.id });
  };

  /* ---------- Rummet: Fikarummet ---------- */
  X.fikaScript = () => ['lena_fika1', 'karin_fika1', 'bengt_fika1', 'sonja_fika1', 'lena_fika2', 'karin_fika2',
    { id: 'bengt_fika2', pause: 1 }, 'sonja_fika2', { id: 'lena_fika3', pause: 6 }, { id: 'karin_fika3', pause: 2 }];
  return X;
})();

/* ---- 08-act.js ---- */
/* ================= Det man kan göra: plattan, mobilen, personalen och presentationen ================= */
// Alla knappar anropar Act. Det som tar tid (samtal, tärningar, bingorop) körs i verklig tid; efter varje paus
// kontrolleras att dagen inte har börjat om (App.s byts ut när presentatören hoppar bakåt i tiden).
const Act = (() => {
  const A = {};
  const rnd = seeded(77);
  const same = s0 => App.s === s0;
  const later = (ms, fn) => { const s0 = App.s; setTimeout(() => { if (same(s0)) mut(fn); }, ms); };
  const caption = (s, who, text) => {
    if (!s.room) return;
    s.room.captions = s.room.captions.concat([{ id: uid('k'), who, text }]).slice(-3);
  };
  const closeModal = (s, kind) => { s.queue = s.queue.filter(q => kind ? q.kind !== kind : q !== s.queue[0]); };
  A.closeModal = kind => mut(s => closeModal(s, kind));

  /* ---------- Navigering på plattan ---------- */
  A.go = (route, extra = {}) => mut(s => {
    Object.assign(s.senior, { route, sub: null, thread: null, cat: null, game: null }, extra);
    s.senior.idle = false;
    if (route === 'idag') s.senior.scroll = 0;
  });
  A.idle = on => mut(s => { s.senior.idle = on; });
  A.set = (key, val) => mut(s => { s.settings[key] = val; });

  /* ---------- Lampan ---------- */
  A.toggleLamp = () => mut(s => {
    s.me.lamp = !s.me.lamp;
    Sound.play(s.me.lamp ? 'lamp' : 'soft');
    Sim.log(s, s.me.lamp ? 'Ingrid Jönsson tände sin lampa' : 'Ingrid Jönsson släckte sin lampa', 'lamp');
    if (!s.me.lamp) return;
    if (!s.me.lampVoiced) { s.me.lampVoiced = true; Voice.say('app', 'app_lampa'); }
    // Karin ser lampan och ringer (en gång)
    if (!s.me.karinCalled && isOnline('karin') && P('karin').where !== 'spel') {
      s.me.karinCalled = true;
      later(7500, s2 => { if (s2.me.lamp && !s2.room) incoming(s2, 'karin'); });
    }
  });

  /* ---------- Samtal ---------- */
  const CALL_LINES = {
    karin: ['karin_ring1', { id: 'karin_ring2', pause: 5 }, { id: 'karin_ring3', pause: 4 }],
    lena: ['lena_ring1', { id: 'lena_ring2', pause: 5 }, { id: 'lena_ring3', pause: 4 }],
    anna: ['anna_ring1', { id: 'anna_ring2', pause: 5 }, { id: 'anna_ring3', pause: 4 }],

  };
  function incoming(s, from) {

  }
  A.incoming = from => mut(s => incoming(s, from));
  A.answerCall = () => mut(s => {

  A.declineCall = () => mut(s => { closeModal(s, 'call'); s.calls.incoming = null; Sound.play('leave'); });
  async function runCall(from) {

      onLineEnd: () => { if (same(s0)) mut(s => { if (s.room) s.room.speaking = null; }); }
    });
    if (!ok || !same(s0)) return;
    await sleep(2500);
    if (!same(s0)) return;
    mut(s => {
      if (!s.room || s.room.kind !== 'call') return;

      s.senior.sub = null;
      Sound.play('leave');
