        s.me.plans = (s.me.plans || []).concat([{ id: 'sondag', text: 'Söndag: Anna och Elsa hälsar på. Yatzy med Elsa!' }]);
        Sim.toast(s, { who: 'anna', text: 'Samtalet med Anna är slut. Söndagen står nu under Mina planer.' });
      } else if (from === 'support') {
        Sim.toast(s, { icon: 'check', text: 'Samtalet med supporten är slut.' });
      } else if (from === 'karin') {
        s.me.plans = (s.me.plans || []).concat([{ id: 'onsdag', text: 'Onsdag kl. 10.00: Träffpunkt Anderslöv med Karin. Hennes son skjutsar.' }]);
        Sim.toast(s, { who: 'karin', text: 'Samtalet med Karin är slut. Onsdagen står nu under Mina planer.' });
      } else {
        s.me.lenaNote = true;
        Sim.toast(s, { who: 'lena', text: 'Lena har anmält ditt intresse till Spelstunden. Karin blir glad!' });
        s.omtanke = s.omtanke.map(o => o.id === 'ingrid' ? Object.assign({}, o, { done: true }) : o);
      }
    });
  }
  // Ringa själv. Karin och Lena svarar med röst, de andra är tysta i demon.
  // Supporten svarar med röst. Vännerna svarar tyst i demon (Karin, Lena och Anna ringer själva upp med röst).
  A.call = who => mut(s => {
    const voiced = who === 'support';
    enter(s, { kind: 'call', id: 'call', with: who, outgoing: true, silent: !voiced });
    s.senior.route = 'prata'; s.senior.talk = 'ring'; s.senior.sub = 'room';
    Sound.play('ring');

  A.toggleMute = () => mut(s => { s.me.muted = !s.me.muted; Sound.play('soft'); });
  A.toggleCaptions = () => mut(s => { s.settings.captions = !s.settings.captions; });
  A.tableLine = (who, text, ms = 2800) => mut(s => {

  // Småprat utan inspelad röst (texten visas) när manuset är slut
  const AMBIENT = {

  A.birthdayGreet = text => mut(s => {

      inv.status = 'yes';
      const what = { traff: 'Vi ses på Träffpunkt Anderslöv på onsdag kl. 10!', promenad: 'Gärna en promenad! Torsdag förmiddag passar bra.', fika: 'Tack, vad roligt! Vi ses på kaféet.' }[kind];
      s2.me.plans = (s2.me.plans || []).concat([{ id: uid('pl'), text: `${firstName(to)}: ${what}` }]);
      Sim.toast(s2, { who: to, text: `${firstName(to)} tackade ja. ${what}` });
    });
  });
  A.flower = to => mut(s => {
    s.me.sentFlowers = Object.assign({}, s.me.sentFlowers, { [to]: true });
    Sound.play('flower');
  });

  /* ---------- Spelstunden ---------- */
  // quiet: den guidade visningen anmäler Ingrid i förväg (utan ljud och utan att byta sida)
  A.signup = (g, friend, { quiet = false } = {}) => mut(s => {
    s.spel.signups.ingrid = { game: g, friend: friend || null, at: s.t };
    Sim.log(s, `Ingrid Jönsson anmälde sig till ${game(g).name}${friend ? ' (gärna med ' + firstName(friend) + ')' : ''}`, 'dice');
    closeModal(s, 'signup');
    if (quiet) return;
    Voice.stop('app');
    Voice.say('app', 'app_anmald');
    Sound.play('pop');
    if (s.senior.route !== 'spela') s.senior.route = 'spela';
    s.senior.sub = 'anmald';
  });
  A.unsign = () => mut(s => { delete s.spel.signups.ingrid; Sound.play('soft'); });
  A.enterTable = () => mut(s => {
    const tb = s.spel.tables.find(x => x.id === s.spel.mine);
    closeModal(s, 'tablestart');
    if (!tb || s.spel.phase !== 'playing') return;
    enter(s, { kind: 'table', id: tb.id });
    s.senior.route = 'spela'; s.senior.sub = 'bord'; s.senior.game = null;
    Sound.play('soft');
    const y = s.yatzy;
    if (y && !y.greeted) {
      y.greeted = true;
      y.nextAt = performance.now() + 9000;
      const s0 = App.s;
      const lines = ['bengt', 'sonja', 'karin'].filter(id => tb.seats.includes(id)).map(id => id + '_y_hej');
      Voice.script('table', lines, { gap: .4, onLine: (id, x) => { if (same(s0)) mut(s2 => { if (s2.room && s2.room.kind === 'table') { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }); }, onLineEnd: () => { if (same(s0)) mut(s2 => { if (s2.room) s2.room.speaking = null; }); } });
    }
  });
  // Bordsprat: en replik i taget, och bara om ingen annan redan pratar
  function sayAtTable(s, id) {
    if (!s.room || s.room.kind !== 'table' || !Voice.has(id) && !Voice.text(id)) return;
    if (s.room.speaking) return;
    const s0 = App.s;
    Voice.say('table', id, { onStart: x => { if (same(s0)) mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }); }, onEnd: () => { if (same(s0)) mut(s2 => { if (s2.room) s2.room.speaking = null; }); } });
  }
  const VOICED = ['karin', 'bengt', 'sonja'];

  /* ---------- Yatzy vid bordet ---------- */
  A.yRoll = () => mut(s => {
    const y = s.yatzy;
    if (!y || y.over || y.rolling || y.S.turn !== 0 || y.S.rolls >= Rules.ROLLS) return;
    if (Rules.check(y.S, 0, { t: 'roll', hold: y.hold }) !== '') return;
    y.S = Rules.apply(y.S, 0, { t: 'roll', hold: y.hold || [] }, Math.random).S;
    y.hold = y.S.held.slice();
    y.rolling = true; y.pickCat = null;
    Sound.play('dice');
    later(750, s2 => { if (s2.yatzy) s2.yatzy.rolling = false; });
  });
  A.yHold = i => mut(s => {
    const y = s.yatzy;
    if (!y || y.S.turn !== 0 || y.S.rolls < 1 || y.S.rolls >= Rules.ROLLS || y.rolling) return;
    y.hold = (y.hold || [false, false, false, false, false]).map((h, k) => k === i ? !h : h);
    Sound.play('soft');
  });
  A.yPick = cat => mut(s => { const y = s.yatzy; if (y && y.S.turn === 0 && y.S.rolls > 0) y.pickCat = y.pickCat === cat ? null : cat; });
  A.yScore = cat => mut(s => {
    const y = s.yatzy;
    if (!y || y.S.turn !== 0 || Rules.check(y.S, 0, { t: 'score', cat }) !== '') return;
    const r = Rules.apply(y.S, 0, { t: 'score', cat });
    const pts = r.ev.find(e => e.t === 'score').pts;
    y.S = r.S; y.hold = [false, false, false, false, false]; y.pickCat = null;
    y.last = { id: 'ingrid', cat, pts };
    y.nextAt = performance.now() + 1400;
    Sound.play('pop');
    if (pts >= 20 || cat === 'y' && pts) {
      const who = VOICED.filter(v => y.seats.includes(v));
      if (who.length && Math.random() < .75) setTimeout(() => { if (App.s.yatzy === y) mut(s2 => sayAtTable(s2, pick(who) + '_y_berom')); }, 900);
    }
    afterScore(s, y, r);
  });
  function afterScore(s, y, r) {
    if (y.S.phase === 'over') {
      y.over = true;
      const tot = y.S.sheets.map(Rules.total), best = Math.max(...tot);
      y.result = y.seats.map((id, i) => ({ id, total: tot[i], win: tot[i] === best })).sort((a, b) => b.total - a.total);
      Sim.log(s, `Yatzy vid bordet ${(s.spel.tables.find(t => t.id === y.table) || {}).name}: ${fullName(y.result[0].id)} vann med ${y.result[0].total}`, 'dice');
      const s0 = App.s, lines = VOICED.filter(v => y.seats.includes(v)).map(v => v + '_y_slut');
      setTimeout(() => {
        if (!same(s0)) return;
        Voice.script('table', lines, { gap: .5, onLine: (id, x) => mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }), onLineEnd: () => mut(s2 => { if (s2.room) s2.room.speaking = null; }) });
        mut(s2 => { s2.me.flowers = (s2.me.flowers || []).concat(VOICED.filter(v => y.seats.includes(v)).map(v => ({ from: v, text: 'Tack för spelet!' }))); });
        Sound.play('flower');
      }, 1500);
    }
  }
  // Datorspelarna vid Ingrids bord (körs några gånger i sekunden)
  function yatzyStep() {
    if (FOLLOWER) return;
    const s = App.s, y = s && s.yatzy;
    if (!y || y.over || y.rolling || y.fast || !s.room || s.room.kind !== 'table') return;
    const seat = y.S.turn;
    if (seat === 0 || performance.now() < (y.nextAt || 0)) return;
    const id = y.seats[seat];
    const d = AI.decide(y.S, seat, 'medel', rnd);
    if (!d) return;
    mut(s2 => {
      if (d.t === 'roll') {
        y.S = Rules.apply(y.S, seat, d, rnd).S;
        y.hold = y.S.held.slice();
        y.rolling = true;
        y.nextAt = performance.now() + (y.fast ? 250 : 1700);
        Sound.play('dice');
        setTimeout(() => { if (App.s.yatzy === y) mut(() => { y.rolling = false; }); }, y.fast ? 120 : 800);
      } else {
        const r = Rules.apply(y.S, seat, d);
        const pts = r.ev.find(e => e.t === 'score').pts;
        y.S = r.S; y.hold = [false, false, false, false, false];
        y.last = { id, cat: d.cat, pts };
        y.nextAt = performance.now() + (y.fast ? 250 : 1900);
        if (VOICED.includes(id) && !y.fast) {
          const kind = d.cat === 'y' && pts ? 'yatzy' : (pts >= 20 && ['kak', 'ls', 'ss', 'fyr', 'tre'].includes(d.cat)) ? 'bra' : pts === 0 ? 'stryk' : null;
          const chance = { yatzy: 1, bra: .7, stryk: .45 }[kind] || 0;
          if (kind && Math.random() < chance) sayAtTable(s2, `${id}_y_${kind}`);
          else if (!kind && y.S.round >= 3 && Math.random() < .3) {
            const who = VOICED.filter(v => y.seats.includes(v) && !y.pratted.includes(v));
            if (who.length) { const w = pick(who); y.pratted.push(w); sayAtTable(s2, w + '_y_prat'); }
          }
        }
        afterScore(s2, y, r);
      }
    });
  }
  setInterval(yatzyStep, 200);
  // Presentatören kan spola fram partiet (alla spelar snabbt, Ingrid med datorns hjälp)
  A.yFast = () => {
    const y = App.s.yatzy;
    if (!y || y.over) return;
    y.fast = true;
    const s0 = App.s;
    const step = () => {
      const yy = App.s.yatzy;
      if (!same(s0) || !yy || yy.over) return;
      mut(s => {
        yy.rolling = false;
        for (let k = 0; k < 6 && !yy.over; k++) {
          const seat = yy.S.turn, d = AI.decide(yy.S, seat, 'medel', rnd);
          if (!d) break;
          if (d.t === 'roll') { yy.S = Rules.apply(yy.S, seat, d, rnd).S; yy.hold = yy.S.held.slice(); }
          else {
            const r = Rules.apply(yy.S, seat, d);
            yy.S = r.S; yy.hold = [false, false, false, false, false];
            yy.last = { id: yy.seats[seat], cat: d.cat, pts: r.ev.find(e => e.t === 'score').pts };
            afterScore(s, yy, r);
          }
        }
      });
      setTimeout(step, 50);
    };
    step();
  };

  /* ---------- Bingon ---------- */
  A.liveWatch = on => mut(s => {
    s.senior.idle = false;
    s.senior.route = 'live';
    s.senior.sub = on ? 'watch' : null;
    if (on) Sim.log(s, 'Ingrid Jönsson är med på bingon hemifrån', 'tv');
    closeModal(s, 'live');
    if (!on) Voice.stop('live');
  });
  A.mark = n => mut(s => {
    const L = s.live;
    if (!L.called.includes(n)) { L.note = `${Bingo.letter(n)} ${n} har inte ropats än.`; L.noteAt = performance.now(); return; }
    L.marked = L.marked.includes(n) ? L.marked.filter(x => x !== n) : L.marked.concat([n]);
    Sound.play('soft');
  });
  A.claim = () => mut(s => {
    const L = s.live, card = L.cards.ingrid;
    if (!card || L.claim) return;
    const line = Bingo.line(card, n => L.marked.includes(n) && L.called.includes(n));
    if (!line) { L.note = 'Inte riktigt än. Det behövs fem i rad, vågrätt, lodrätt eller snett.'; L.noteAt = performance.now(); Sound.play('soft'); return; }
    L.claim = { by: 'ingrid', line, at: performance.now() };
    Sim.log(s, 'Ingrid Jönsson ropade BINGO hemifrån', 'star');
  });
  A.liveGreet = i => mut(s => {
    const text = QUICK_LIVE[i];
    s.live.greetings = s.live.greetings.concat([{ by: 'ingrid', text, t: s.t, i }]);
    s.live.readQueue = (s.live.readQueue || []).concat(['mats_hej_' + i]);
    s.me.sentLive = s.me.sentLive.concat([i]);
    Sound.play('pop');
  });
  A.wave = () => mut(s => { s.live.waves = Object.assign({}, s.live.waves, { ingrid: performance.now() }); Sound.play('soft'); });
  A.setAuto = on => mut(s => { s.settings.autoMark = on; if (on) { const L = s.live; L.marked = L.called.filter(n => (L.cards.ingrid || []).includes(n)); } });

  // Bingovärden: presentation, rop var sjunde sekund, kontroll av bingo och ny omgång
  let liveBusy = false;
  async function liveSay(id, space = 'live') {
    liveBusy = true;
    const s0 = App.s;
    await Voice.say(space, id);
    liveBusy = false;
  }
  async function liveStep() {
    if (FOLLOWER) return;
    const s = App.s, L = s && s.live;
    if (!L || !L.on || liveBusy || !Sim.watching(s)) return;
    const now = performance.now();
    if (L.status === 'intro') { mut(() => { L.status = 'calling'; L.nextCall = now + 900; }); await liveSay('mats_intro'); await sleep(400); await liveSay('mats_forsta'); return; }
    if (L.status === 'ny') { mut(() => { L.status = 'calling'; L.nextCall = now + 800; }); await liveSay('mats_ny_runda'); return; }
    if (L.readQueue && L.readQueue.length && !L.claim) { const id = L.readQueue[0]; mut(() => { L.readQueue = L.readQueue.slice(1); }); await liveSay(id); return; }
    if (L.claim && L.status === 'calling') {
      mut(() => { L.status = 'check'; });
      await liveSay('mats_kolla');
      await sleep(1600);
      if (App.s.live !== L) return;
      const who = L.claim.by;
      mut(s2 => { L.winners = L.winners.concat([who]); L.status = 'won'; L.wonAt = performance.now(); Sim.log(s2, `BINGO för ${fullName(who)} (${person(who).ort}, hemifrån)`, 'star'); if (who === 'ingrid') s2.me.bingoWins = (s2.me.bingoWins || 0) + 1; });
      Sound.play('bingo');
      await liveSay(who === 'ingrid' ? 'mats_bingo_ingrid' : 'mats_bingo_gunvor');
      await sleep(7000);
      if (App.s.live === L && L.on) mut(s2 => Sim.newRound(s2));
      return;
    }
    if (L.status !== 'calling' || now < (L.nextCall || 0) || L.called.length >= L.order.length) return;
    const n = L.order[L.called.length];
    mut(s2 => {
      L.called = L.called.concat([n]);
      L.current = n;
      L.nextCall = now + 7200;
      if (s2.settings.autoMark && (L.cards.ingrid || []).includes(n)) L.marked = L.marked.concat([n]);
      // den som ska vinna omgången (inte Ingrid) ropar bingo ett rop efter att raden blev klar
      if (L.target !== 'ingrid' && !L.claim) {
        const card = L.cards[L.target];
        const had = Bingo.line(card, x => L.called.slice(0, -1).includes(x));
        if (had) L.claim = { by: L.target, at: now };
      }
      // tips till Ingrid om hon har en hel rad men inte har ropat
      const mine = L.cards.ingrid;
      if (mine && !L.claim) { const ln = Bingo.line(mine, x => L.called.includes(x)); L.hint = ln ? (L.hint || 0) + 1 : 0; }
      // någon hemma vinkar ibland
      if (Math.random() < .35) { const w = pick(L.home.filter(id => id !== 'ingrid')); L.waves = Object.assign({}, L.waves, { [w]: now }); }
    });
    Sound.play('ball');
    await liveSay('nr_' + n);
  }
  setInterval(() => { liveStep().catch(e => { liveBusy = false; console.error(e); }); }, 300);
  A.liveSkip = () => mut(s => { const L = s.live; if (L.status === 'calling') L.nextCall = 0; });

  /* ---------- Familjen ---------- */
  A.familyPhoto = id => mut(s => { s.family.photo = id; });
  // Barnbarnet bjuder in till ett parti Yatzy i kväll: mormor ser det på plattan, under Dina planer
  A.familyGame = () => mut(s => {
    s.family.game = { t: s.t, seen: false };
    Sound.play('soft');
    later(3500, s2 => {
      s2.me.plans = (s2.me.plans || []).concat([{ id: uid('pl'), text: 'Anna: Ska vi spela Yatzy i kväll kl. 19.00? Jag ringer från mobilen.' }]);
      Sim.toast(s2, { who: 'anna', text: 'Anna vill spela Yatzy med dig i kväll kl. 19.00. Det står under Dina planer.' });
      if (s2.family.game) s2.family.game.seen = true;
    });
  });
  A.familySend = () => mut(s => {
    const id = s.family.photo;
    Sim.receivePhoto(s, id, true, true);
    s.family.sent = id;
    s.family.sentAt = s.t;
    Sim.log(s, 'Anna Jönsson skickade en bildhälsning till Ingrid', 'image');
  });
  A.photoSeen = id => mut(s => { const p = s.photos.find(x => x.id === id); if (p) p.seen = true; closeModal(s, 'photo'); });
  A.photoHeart = id => mut(s => { const p = s.photos.find(x => x.id === id); if (p) { p.heart = true; p.seen = true; } Sound.play('flower'); });
  A.playPhotoVoice = id => { const p = App.s.photos.find(x => x.id === id); if (p && p.voice) { Voice.stop('photo'); Voice.say('photo', p.voice); } };

  /* ---------- Meddelanden från personalen till alla plattor ---------- */
  A.sendNotice = nid => mut(s => {
    const n = NOTICES.find(x => x.id === nid);
    if (!n) return;
    const item = { id: uid('n'), nid, title: n.title, text: n.text, icon: n.icon, t: s.t, readBy: [] };
    s.notices = [item].concat(s.notices);
    Sim.log(s, `Meddelande till alla plattor: ${n.title}`, 'bell');
    Sim.queue(s, { kind: 'notice', id: item.id });
    // de andra deltagarna läser det efter hand (personalen ser hur många)
    const s0 = App.s, who = shuffle(PEOPLE.filter(p => !p.me).map(p => p.id), seeded(s.notices.length + 11));
    let k = 0;
    const iv = setInterval(() => {
      if (!same(s0) || k >= who.length - 4) { clearInterval(iv); return; }
      mut(() => { item.readBy = item.readBy.concat([who[k++]]); });
    }, 1100);
  });
  A.readNotice = id => mut(s => {
    const n = s.notices.find(x => x.id === id);
    if (n && !n.readBy.includes('ingrid')) n.readBy = n.readBy.concat(['ingrid']);
    closeModal(s, 'notice');
    Voice.stop('app');
  });
  A.openNotice = id => mut(s => { Sim.queue(s, { kind: 'notice', id }); });

  /* ---------- Månadens frågor (svaren visas bara sammanräknade för personalen) ---------- */
  A.surveyAnswer = (k, n) => mut(s => { const a = (s.me.survey || []).slice(); a[k] = n; s.me.survey = a; Sound.play('soft'); });
  A.surveyDone = () => mut(s => {
    if (s.me.surveyDone) return;
    s.me.surveyDone = true;
    Sim.log(s, 'En deltagare svarade på månadens frågor (svaren visas bara sammanräknade)', 'chat');
  });
  A.showWelcome = () => mut(s => { s.senior.idle = false; s.queue = []; s.senior.sheet = { kind: 'welcome', step: 0 }; });

  /* ---------- Vinka i Fikarummet (för den som inte vill prata) ---------- */
  A.waveFika = () => mut(s => {
    if (!s.room || s.room.kind !== 'fika') return;
    s.room.wave = performance.now();
    Sound.play('soft');
    setTimeout(() => App.emit(), 4100);
    // Lena svarar när samtalet i rummet har tystnat
    if (!s.room.waved && s.me.fikaDone) {
      s.room.waved = true;
      const s0 = App.s;
      setTimeout(() => {
        if (!same(s0) || !App.s.room || App.s.room.kind !== 'fika' || App.s.room.speaking) return;
        Voice.say('fika', 'lena_vinka', { onStart: x => mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }), onEnd: () => mut(s2 => { if (s2.room) s2.room.speaking = null; }) });
      }, 1200);
    }
  });

  /* ---------- Personalen ---------- */
  A.staffGo = r => mut(s => { s.staff.route = r; });
  A.staffDone = id => mut(s => { s.omtanke = s.omtanke.map(o => o.id === id ? Object.assign({}, o, { done: true }) : o); Sound.play('soft'); });
  A.staffCall = id => mut(s => {
    if (id === 'ingrid' && !s.room) incoming(s, 'lena');
    s.omtanke = s.omtanke.map(o => o.id === id ? Object.assign({}, o, { calling: true }) : o);
  });

  /* ---------- Presentationen ---------- */
  A.view = v => mut(s => { s.view = v; });
  A.jump = t => Sim.jump(t);
  A.restart = () => {
    const s = App.s;
    Voice.stopAll();
    App.s = freshState({ started: s.started, view: s.view, device: s.device, settings: s.settings, tour: { on: false, step: 0 } });
    App.emit();
  };
  return A;
})();

// Diagram: staplar (exempeldata i personalvyn och förslaget)
function Bars({ data, max, label, unit = '', hi = -1, h = 150 }) {
  const m = max || Math.max(...data.map(d => d.v)) * 1.12;
  const w = 100 / data.length;
  return html`<figure class="bars" aria-label=${label}>
    <svg viewBox=${`0 0 100 ${h / 3}`} preserveAspectRatio="none" class="bars-svg">
      ${[.25, .5, .75].map(g => html`<line x1="0" x2="100" y1=${(1 - g) * h / 3} y2=${(1 - g) * h / 3} class="bars-grid" />`)}
      ${data.map((d, i) => html`<rect x=${i * w + w * .18} width=${w * .64} y=${(1 - d.v / m) * h / 3} height=${d.v / m * h / 3} rx=".6" class=${cx('bars-bar', i === hi && 'hi')} />`)}
    </svg>
    <div class="bars-x">${data.map((d, i) => html`<span class=${i === hi ? 'hi' : ''}><b>${d.v}${unit}</b>${d.x}</span>`)}</div>
  </figure>`;
}

// Nedräkning i verklig tid (för rutor som går vidare av sig själva)
function useCountdown(sec, onDone, deps = []) {
  const [left, setLeft] = useState(sec);
  useEffect(() => {
    setLeft(sec);
    const t0 = performance.now();
    const iv = setInterval(() => {
      const l = Math.max(0, sec - Math.floor((performance.now() - t0) / 1000));
      setLeft(l);
      if (l <= 0) { clearInterval(iv); onDone && onDone(); }
    }, 250);
    return () => clearInterval(iv);
  }, deps);
  return left;
}

// Diktering: riktig taligenkänning där webbläsaren har den (inte i artefakten), annars visar demon hur det blir
const Dictate = {
  start(onText, onEnd, example) {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
    if (R && !framed) {
      try {
        const r = new R();
        r.lang = 'sv-SE'; r.interimResults = true; r.maxAlternatives = 1;
        let got = false;
        r.onresult = e => { got = true; onText(Array.from(e.results).map(x => x[0].transcript).join(' ')); };
        r.onerror = () => { if (!got) Dictate.fake(onText, onEnd, example); };
        r.onend = () => { if (got) onEnd(); };
        r.start();
        return () => { try { r.stop(); } catch (e) { /* redan stoppad */ } };
      } catch (e) { /* ingen mikrofon här */ }
    }
    return Dictate.fake(onText, onEnd, example);
  },
  // Visar orden komma ett i taget, som när man talar in
  fake(onText, onEnd, example) {
    const words = example.split(' ');
    let i = 0, stop = false;
    const step = () => { if (stop) return; i++; onText(words.slice(0, i).join(' ')); if (i < words.length) setTimeout(step, 230); else onEnd(); };
    setTimeout(step, 900);
    return () => { stop = true; };
  }
};
// Skriv eller tala in: textruta, en stor mikrofonknapp och Skicka
function Composer({ id, placeholder, example, sendLabel = 'Skicka', onSend, rows = 3 }) {
  const [text, setText] = useState('');
  const [rec, setRec] = useState(false);
  const stopRef = useRef(null);
  useEffect(() => () => stopRef.current && stopRef.current(), []);
  const talk = () => {
    if (rec) { stopRef.current && stopRef.current(); setRec(false); return; }
    setRec(true);
    stopRef.current = Dictate.start(t => setText(t), () => setRec(false), example);
  };
  const send = () => { if (!text.trim()) return; onSend(text); setText(''); };
  return html`<div class="composer">
    <textarea id=${id} rows=${rows} placeholder=${placeholder} value=${text} onInput=${e => setText(e.currentTarget.value)} aria-label=${placeholder}></textarea>
    <div class="row">
      <${Btn} kind=${rec ? 'danger' : 'secondary'} icon="mic" onClick=${talk} cls=${rec ? 'recording' : ''}>${rec ? 'Jag lyssnar… tryck för att sluta' : 'Tala in'}</${Btn}>
      <${Btn} kind="primary" icon="send" onClick=${send} disabled=${!text.trim()}>${sendLabel}</${Btn}>
    </div>
  </div>`;
}

function minutesLeft(t, at) {
  const m = Math.max(0, Math.ceil((at - t) / 60));
  if (m < 60) return minutesWord(m);
  const h = Math.floor(m / 60), r = m % 60;
  return `${h} tim${r ? ' ' + r + ' min' : ''}`;
}

// Veckans frågesport
function QuizView() {
  const [i, setI] = useState(-1);          // -1 = välkommen, QUIZ.length = klart
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const say = id => { Voice.stop('quiz'); Voice.say('quiz', id); };
  useEffect(() => { say(i < 0 ? 'quiz_intro' : i >= QUIZ.length ? 'quiz_slut' : 'quiz_q' + i); }, [i]);
  useEffect(() => () => Voice.stop('quiz'), []);
  const answer = k => {
    if (chosen != null) return;
    setChosen(k);
    const right = k === QUIZ[i].a;
    if (right) setScore(x => x + 1);
    Sound.play(right ? 'flower' : 'soft');
    setTimeout(() => say('quiz_f' + i), 700);
  };
  const next = () => { setChosen(null); setI(i + 1); };
  const back = html`<div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => { Voice.stop('quiz'); Act.go('spela'); }}>Tillbaka till Spela</${Btn}></div>`;
  if (i < 0) return html`<div class="pg quiz">${back}
    <section class="card quiz-card"><span class="quiz-ic"><${Icon} n="help" size=${56} /></span>
      <h1>Veckans frågesport</h1><p class="lead">Trelleborg förr och nu. Sex frågor, och du tar den tid du behöver. Lena läser upp frågorna.</p>
      <${Btn} kind="primary" big icon="play" onClick=${() => setI(0)}>Första frågan</${Btn}></section></div>`;
  if (i >= QUIZ.length) return html`<div class="pg quiz">${back}
    <section class="card quiz-card"><span class="quiz-ic done-ic"><${Icon} n="star" size=${56} /></span>
      <h1>Du fick ${score} av ${QUIZ.length} rätt!</h1><p class="lead">Bra kämpat. Nästa vecka kommer nya frågor, och på tisdag kl. 14.00 kör Lena frågesporten live i Fikarummet.</p>
      <div class="row center"><${Btn} kind="primary" big icon="restart" onClick=${() => { setScore(0); setI(0); }}>Spela igen</${Btn}><${Btn} big icon="left" onClick=${() => Act.go('spela')}>Till Spela</${Btn}></div></section></div>`;
  const Q = QUIZ[i];
  return html`<div class="pg quiz">${back}
    <p class="quiz-count">Fråga ${i + 1} av ${QUIZ.length} · ${score} rätt</p>
    <h1 class="quiz-q">${Q.q}</h1>
    <div class="quiz-opts">${Q.opts.map((o, k) => html`<button type="button" key=${k} class=${cx('quiz-opt', chosen != null && k === Q.a && 'right', chosen === k && k !== Q.a && 'wrong')} onClick=${() => answer(k)} disabled=${chosen != null}>
      ${chosen != null && k === Q.a && html`<${Icon} n="check" size=${30} sw=${3} />`}${o}</button>`)}</div>
    ${chosen != null && html`<div class="quiz-fact">
      <p><strong>${chosen === Q.a ? 'Rätt!' : `Rätt svar: ${Q.opts[Q.a]}.`}</strong> ${Q.fact}</p>
      <div class="row"><${Btn} kind="primary" big icon="arrow" onClick=${next}>${i + 1 < QUIZ.length ? 'Nästa fråga' : 'Se resultatet'}</${Btn}>
        <${Btn} big icon="speaker" onClick=${() => say('quiz_f' + i)}>Läs upp igen</${Btn}></div></div>`}
    ${chosen == null && html`<div class="row"><${Btn} icon="speaker" onClick=${() => say('quiz_q' + i)}>Läs upp frågan igen</${Btn}></div>`}
  </div>`;
}

/* ---------- Vid bordet ---------- */
function TableRoom() {

  const tb = s.spel.tables.find(x => x.id === s.room.id);

  const y = s.yatzy && s.yatzy.table === tb.id ? s.yatzy : null;

  return html`<div class="room table-room">
    <header class="room-h"><div><h1>Bordet ${tb.name}</h1><p>${game(tb.game).name} · Spelstunden kl. 14.00–15.00${tb.host ? ' · värd ' + fullName(tb.host) : ''}</p></div><${MicPill} /><span class="room-clock">kl. ${clockStr(s.t)}</span></header>
    <div class="seats">${seats.map((id, i) => {
      const turn = y && !y.over && y.S.turn === i;

      return html`<div class=${cx('seat', turn && 'turn', id === 'ingrid' && 'me')} key=${id}>
        <${Avatar} id=${id} size=${48} speaking=${s.room.speaking === id} muted=${id === 'ingrid' && s.me.muted} />

const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function Die({ v, held, rolling, onClick, disabled, i }) {
  const [face, setFace] = useState(v);
  useEffect(() => {
    if (!rolling || held) { setFace(v); return; }
    const iv = setInterval(() => setFace(1 + Math.floor(Math.random() * 6)), 85);
    return () => clearInterval(iv);
  }, [rolling, v, held]);
  const f = rolling && !held ? face : v;
  return html`<button type="button" class=${cx('die', held && 'held', rolling && !held && 'rolling', !f && 'blank')} onClick=${onClick} disabled=${disabled} aria-label=${f ? `Tärning ${i + 1}: ${f}${held ? ', sparad' : ''}` : 'Tärning'} aria-pressed=${!!held}>
    <span class="pips">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => html`<i class=${f && PIPS[f].includes(k) ? 'on' : ''}></i>`)}</span>
    ${held && html`<em>Sparad</em>`}
  </button>`;
}

function Yatzy({ y }) {
  const s = App.s;
  const S = y.S, mine = S.turn === 0 && !y.over;
  const pot = mine ? Rules.potentials(S) : {};
  const hold = y.hold || [false, false, false, false, false];
  const [hint, setHint] = useState(null);
  useEffect(() => setHint(null), [S.k]);
  let status;
  if (y.over) {
    const w = y.result.filter(r => r.win), names = w.map(r => r.id === 'ingrid' ? 'du' : firstName(r.id));
    status = `Partiet är slut! ${cap(listSv(names))} vann med ${w[0].total} poäng.`;
  } else if (mine) status = S.rolls === 0 ? 'Din tur! Tryck på Slå.' : S.rolls < 3 ? 'Tryck på tärningarna du vill spara. Slå igen, eller välj en rad.' : 'Välj en rad i ditt protokoll.';
  else status = `${firstName(y.seats[S.turn])} ${y.rolling ? 'slår…' : 'funderar…'}`;
  const last = y.last && y.last.id !== 'ingrid' ? `${firstName(y.last.id)} skrev ${y.last.pts} på ${Rules.catName(y.last.cat)}.` : '';
  const pick = y.pickCat;
  return html`<div class="yz">
    <div class="yz-play">
      <p class="yz-status" aria-live="polite">${status}</p>
      ${last && !mine && html`<p class="yz-last">${last}</p>`}
      <div class="dice-row">${S.dice.map((v, i) => html`<${Die} key=${i} i=${i} v=${v} held=${S.rolls > 0 && hold[i]} rolling=${y.rolling} disabled=${!mine || S.rolls === 0 || S.rolls >= 3} onClick=${() => Act.yHold(i)} />`)}</div>
      ${hint && html`<p class="yz-hint"><${Icon} n="bulb" size=${22} />${hint}</p>`}
      <div class="yz-actions">
        ${y.over ? html`<${Btn} kind="lamp" big icon="flower" onClick=${() => { y.seats.forEach(id => id !== 'ingrid' && Act.flower(id)); }}>${s.me.sentFlowers && y.seats.some(id => s.me.sentFlowers[id]) ? 'Blommor skickade' : 'Tacka för spelet'}</${Btn}>`
          : pick ? html`<${Btn} kind="primary" big icon="pencil" onClick=${() => Act.yScore(pick)}>Skriv ${pot[pick] || 0} på ${Rules.catName(pick)}</${Btn}><${Btn} onClick=${() => Act.yPick(null)}>Ångra</${Btn}>`
          : html`<${Btn} kind="primary" big icon="dice" disabled=${!mine || S.rolls >= 3 || y.rolling} onClick=${Act.yRoll}>${S.rolls === 0 ? 'Slå' : `Slå igen (${3 - S.rolls} kvar)`}</${Btn}>
            <${Btn} icon="bulb" disabled=${!mine} onClick=${() => { const h = AI.hint(S, 0); setHint(h ? h.text : null); }}>Tips</${Btn}>`}
      </div>
    </div>
    <${MySheet} y=${y} pot=${pot} mine=${mine} pick=${pick} />
  </div>`;
}

// Ingrids protokoll: bara hennes egna rader, stora och i två kolumner (de andras poäng syns i namnrutorna ovanför)
function MySheet({ y, pot, mine, pick }) {
  const sh = y.S.sheets[0];
  const row = c => {
    const v = sh[c.id], canPick = mine && v == null && pot[c.id] != null;
    return html`<li class=${cx('ms-row', pick === c.id && 'on', y.last && y.last.id === 'ingrid' && y.last.cat === c.id && 'fresh')} key=${c.id}>
      <span class="ms-name">${c.name}</span>
      ${canPick ? html`<button type="button" class=${cx('pot', pot[c.id] === 0 && 'zero', pick === c.id && 'on')} onClick=${() => Act.yPick(c.id)} aria-label=${`${c.name}: ${pot[c.id]} poäng`}>${pot[c.id]}</button>`
        : html`<span class="ms-val">${v == null ? '' : v === 0 ? '–' : v}</span>`}
    </li>`;
  };
  const bonus = Rules.bonus(sh);
  return html`<div class="mysheet" role="group" aria-label="Ditt protokoll">
    <h3>Ditt protokoll<b>${Rules.total(sh)} poäng</b></h3>
    <div class="ms-cols">
      <ol>${Rules.CATS.slice(0, 6).map(row)}
        <li class="ms-row ms-sum"><span class="ms-name">Bonus</span><span class="ms-val">${bonus ? bonus : Rules.bonusLost(sh) ? '–' : `${Rules.bonusNeed(sh)} kvar`}</span></li></ol>
      <ol>${Rules.CATS.slice(6).map(row)}</ol>
    </div>
  </div>`;
}

/* ---------- Gemensamt för rummen: textningen och knapparna ---------- */
function Captions() {
  const s = useApp();
  if (!s.settings.captions || !s.room) return html`<div class="captions off"></div>`;
  const c = s.room.captions.slice(-2);
  return html`<div class="captions" aria-live="polite">
    ${c.length ? c.map((x, i) => html`<p key=${x.id} class=${i === c.length - 1 ? 'cur' : 'old'}><${Avatar} id=${x.who} size=${34} /><strong>${firstName(x.who)}:</strong> ${x.text}</p>`)
      : html`<p class="old"><${Icon} n="captions" size=${24} />Det som sägs visas här som text.</p>`}
  </div>`;
}
// Påminnelse i rummets rubrik de första sekunderna: mikrofonen är på
function MicPill() {
  const s = useApp();
  const hint = performance.now() - (s.senior.micHint || 0) < 9000 && !s.me.muted;
  useEffect(() => { if (!hint) return; const t = setTimeout(() => App.emit(), 9200); return () => clearTimeout(t); }, [s.senior.micHint]);
  return hint ? html`<p class="mic-pill" role="status"><${Icon} n="mic" size=${22} />Mikrofonen är på. De andra hör dig.</p>` : null;
}
function RoomControls({ kind }) {
  const s = useApp();
  return html`<div class="controls">
    <${Btn} kind=${s.me.muted ? 'danger' : 'ok'} big icon=${s.me.muted ? 'micOff' : 'mic'} onClick=${Act.toggleMute} cls="ctl-mic">${s.me.muted ? 'Sätt på mikrofonen' : 'Stäng av mikrofonen'}</${Btn}>
    <${Btn} big icon="captions" onClick=${Act.toggleCaptions} cls=${s.settings.captions ? 'on' : ''}>${s.settings.captions ? 'Dölj textningen' : 'Visa textningen'}</${Btn}>
    ${kind === 'fika' && html`<${Btn} kind="lamp" big icon="hand" onClick=${Act.waveFika}>Vinka</${Btn}>`}

      : html`<${Btn} kind="danger" big icon="door" onClick=${Act.leaveRoom}>${kind === 'table' ? 'Lämna bordet' : 'Lämna Fikarummet'}</${Btn}>`}
  </div>`;
}

const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
// Antal dagar mellan två datum (text), oberoende av sommartid
const daysBetween = (a, b) => Math.round((Date.UTC(...b.split('-').map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split('-').map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);

function dayLabel(s, { rel = true, weekday = true } = {}) {
  const d = parseDay(s), diff = daysBetween(s, dayStr());
  if (rel && diff === 0) return 'i dag';

}

// Pilarna: R = ordet börjar i rutan till höger och går åt höger, D = ordet börjar under och går nedåt,
// RD = börjar till höger men går nedåt, DR = börjar under men går åt höger.
const ARROWS = { R: { dx: 1, dy: 0, dir: 'A' }, D: { dx: 0, dy: 1, dir: 'D' }, RD: { dx: 1, dy: 0, dir: 'D' }, DR: { dx: 0, dy: 1, dir: 'A' } };

class Puzzle {
  constructor(data) {
    Object.assign(this, { id: data.id, size: data.size, w: data.w, h: data.h, data });
    const { w, h } = this, g = [...data.grid];
    this.cells = g.map((c, i) => ({ i, x: i % w, y: Math.floor(i / w), clue: c === '#', answer: c === '#' ? null : c, words: { A: -1, D: -1 }, parts: [], marks: [] }));
    this.words = [];
    for (const [cell, arrow, text, answer] of data.clues) {
      const a = ARROWS[arrow], src = this.cells[cell];
      let x = src.x + a.dx, y = src.y + a.dy;
      const cells = [];
      while (x < w && y < h && !this.cells[y * w + x].clue) { cells.push(y * w + x); if (a.dir === 'A') x++; else y++; }
      const word = { i: this.words.length, dir: a.dir, arrow, clueCell: cell, text, cells, len: cells.length, answer: cells.map(c => this.cells[c].answer).join('') };
      if (answer && answer !== word.answer) console.warn('Kryss', this.id, 'svaret stämmer inte:', answer, word.answer);
      this.words.push(word);
      cells.forEach(c => { this.cells[c].words[a.dir] = word.i; });
      src.parts.push(word.i);
      // pilen ritas i ordets första bokstavsruta, på den kant som ligger mot ledtrådsrutan
      this.cells[cells[0]].marks.push({ arrow, word: word.i });
    }
    // Två ledtrådar i samma ruta: den vars ord börjar till höger står överst, den vars ord börjar nedanför underst.
    // Pekar båda åt samma håll: den raka pilen först åt höger (R före RD), den böjda först nedåt (DR före D).
    const ORDER = { R: 0, RD: 1, DR: 2, D: 3 };
    for (const c of this.cells) if (c.parts.length > 1) c.parts.sort((a, b) => ORDER[this.words[a].arrow] - ORDER[this.words[b].arrow]);
    for (const c of this.cells) if (c.marks.length) c.marks.forEach(m => { const src = this.cells[this.words[m.word].clueCell]; m.part = src.parts.length > 1 ? (src.parts[0] === m.word ? 'top' : 'bottom') : 'full'; });
    this.letterCells = this.cells.filter(c => !c.clue).map(c => c.i);
    // ordning för "nästa ord": uppifrån och ned, vänster till höger efter första bokstaven, vågrätt före lodrätt
    this.order = this.words.map(x => x.i).sort((a, b) => { const A = this.words[a], B = this.words[b]; return A.cells[0] - B.cells[0] || (A.dir < B.dir ? -1 : 1); });
  }
  wordAt(cell, dir) { const c = this.cells[cell]; return c && !c.clue ? c.words[dir] : -1; }
  // Ett av rutans ord: i den riktning man vill om det finns, annars det andra
  pickDir(cell, want) { const c = this.cells[cell]; if (c.words[want] >= 0) return want; return want === 'A' ? 'D' : 'A'; }
  nextWord(wi, step = 1) { const k = this.order.indexOf(wi); return this.order[(k + step + this.order.length) % this.order.length]; }
  get title() { return this.data.title || (this.size === 'S' ? 'Stora krysset' : 'Lilla krysset'); }
  get theme() { return this.data.theme || null; }
}

/* ---- 02-progress.js ---- */
/* ================= Hur långt man har kommit i ett kryss ================= */
// Bokstäverna man har skrivit, vilka man har fått hjälp med och tiden. Sparas i webbläsaren per kryss
// (kk.p.<id>), så att man kan sluta och fortsätta senare. När man löser tillsammans har varje ruta en
// tidsstämpel, så att alla hamnar på samma bokstäver även om två skriver samtidigt.
class Progress {
  constructor(puzzle, { persist = true, key = null } = {}) {
    this.p = puzzle;
    this.key = key || 'p.' + puzzle.id;
    this.persist = persist;
    const n = puzzle.w * puzzle.h;
    this.letters = Array(n).fill('');
    this.by = Array(n).fill('');       // vem som skrev bokstaven (namn), när man löser tillsammans
    this.ts = Array(n).fill(0);        // tidsstämpel för rutan (när man löser tillsammans)
    this.shown = new Set();            // rutor man har fått hjälp med
    this.secs = 0; this.hints = 0; this.checks = 0; this.done = false; this.doneAt = null; this.started = null;
    if (persist) this.load();
  }
  // Kryssets fingeravtryck: sparat läge från en annan version av samma kryss (samma id, andra ord) används inte
  get sig() {
    if (!this._sig) { let x = 5381; for (const ch of this.p.data.grid) x = ((x * 33) ^ ch.charCodeAt(0)) >>> 0; this._sig = x.toString(36); }
    return this._sig;
  }
  load() {
    const s = Store.get(this.key, null);
    if (!s || !s.l) return;
    if (s.g && s.g !== this.sig) return;
    if (!s.g && s.l.length !== this.letters.length) return;
    [...s.l].forEach((c, i) => { if (i < this.letters.length && c !== '.' && !this.p.cells[i].clue) this.letters[i] = c; });
    (s.s || []).forEach(i => this.shown.add(i));
    Object.assign(this, { secs: s.t || 0, hints: s.h || 0, checks: s.c || 0, done: !!s.d, doneAt: s.da || null, started: s.st || null });
  }
  save(now = false) {
    if (!this.persist) return;
    clearTimeout(this._t);
    const go = () => Store.set(this.key, { g: this.sig, l: this.letters.map(c => c || '.').join(''), s: [...this.shown], t: Math.round(this.secs), h: this.hints, c: this.checks, d: this.done, da: this.doneAt, st: this.started });
    if (now) go(); else this._t = setTimeout(go, 150);
  }
  get(i) { return this.letters[i]; }
  // Skriv en bokstav (eller '' för att sudda). Ger true om något ändrades.
  set(i, ch, { by = '', ts = 0, shown = false } = {}) {
    if (this.p.cells[i].clue) return false;
    if (this.shown.has(i) && !shown) return false;           // en visad bokstav är facit och ändras inte
    if (this.letters[i] === ch && !shown) return false;
    this.letters[i] = ch; this.by[i] = ch ? by : ''; if (ts) this.ts[i] = ts;
    if (shown) this.shown.add(i);
    if (!this.started) this.started = dayStr();
    this.save();
    return true;
  }
  wrong(i) { const c = this.letters[i]; return !!c && c !== this.p.cells[i].answer; }
  get filled() { return this.p.letterCells.filter(i => this.letters[i]).length; }
  get correct() { return this.p.letterCells.filter(i => this.letters[i] === this.p.cells[i].answer).length; }
  get total() { return this.p.letterCells.length; }
  isFull() { return this.filled === this.total; }
  isSolved() { return this.p.letterCells.every(i => this.letters[i] === this.p.cells[i].answer); }
  wordFull(wi) { return this.p.words[wi].cells.every(i => this.letters[i]); }
  wordRight(wi) { return this.p.words[wi].cells.every(i => this.letters[i] === this.p.cells[i].answer); }
  wrongCells() { return this.p.letterCells.filter(i => this.wrong(i)); }
  // Status för listor och startsidan
  status() {
    if (this.done) return { key: 'done', text: 'Löst', pct: 100 };
    const f = this.filled;
    if (!f) return { key: 'new', text: 'Inte påbörjat', pct: 0 };
    const pct = Math.round(f / this.total * 100);
    return { key: 'going', text: `Påbörjat, ${pct} %`, pct };
  }
  reset() {
    this.letters.fill(''); this.by.fill(''); this.ts.fill(0); this.shown.clear();
    Object.assign(this, { secs: 0, hints: 0, checks: 0, done: false, doneAt: null, started: null });
    this.save(true);
  }
  // Hela läget (för den som kommer in i ett rum där andra redan har börjat)
  snapshot() { return { l: this.letters.map(c => c || '.').join(''), t: this.ts.slice(), b: this.by.slice(), s: [...this.shown] }; }
  merge(s) {
    let changed = false;
    [...s.l].forEach((c, i) => {
      const ch = c === '.' ? '' : c, t = s.t[i] || 0;
      if (t > this.ts[i] || (t === this.ts[i] && ch && !this.letters[i])) {
        if (this.letters[i] !== ch) changed = true;
        this.letters[i] = ch; this.ts[i] = t; this.by[i] = s.b ? s.b[i] || '' : '';
      }
    });
    (s.s || []).forEach(i => { if (!this.shown.has(i)) { this.shown.add(i); changed = true; } });
    if (changed) this.save();
    return changed;
  }
}
// Status för ett kryss utan att öppna det
function progressOf(puzzle) { return new Progress(puzzle).status(); }

/* ---- 03-sound.js ---- */
/* ================= Ljud: mjuka signaler och uppläsning ================= */
// Signalerna byggs med Web Audio (inga ljudfiler): ett mjukt klick för en bokstav, en liten ton när ett ord är klart
// och en slinga när krysset är löst. Inget ska låta hårt eller skrämmande.
const Sound = (() => {
  const S = {};
  let ctx = null, master = null;
  S.unlock = () => {
    try {
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .45; master.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  };
  const tone = (f, at, dur, { type = 'sine', vol = .3, attack = .01, release = .22, glide = 0 } = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, at);
    if (glide) o.frequency.exponentialRampToValueAtTime(f * glide, at + dur);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + attack); g.gain.exponentialRampToValueAtTime(.0001, at + dur + release);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + dur + release + .05);
  };
  const FX = {
    key(t) { tone(1320, t, .025, { vol: .05, release: .05, type: 'triangle' }); },
    erase(t) { tone(660, t, .03, { vol: .05, release: .06, type: 'triangle' }); },
    word(t) { tone(659.3, t, .1, { vol: .1 }); tone(880, t + .09, .16, { vol: .09 }); },
    wrong(t) { tone(330, t, .12, { vol: .07, glide: .9 }); },
    hint(t) { tone(987.8, t, .08, { vol: .08 }); tone(1318.5, t + .07, .12, { vol: .07 }); },
    solved(t) { [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * .12, .28, { vol: .13, type: 'triangle' })); },
    join(t) { tone(587.3, t, .12, { vol: .08 }); tone(784, t + .1, .18, { vol: .08 }); },
    pop(t) { tone(523.3, t, .06, { vol: .08, glide: 1.5 }); }
  };
  S.play = name => {
    if (!Settings.get('sound') || !ctx || !FX[name]) return;
    try { FX[name](ctx.currentTime + .01); } catch (e) { /* ljudet går inte just nu */ }
  };
  return S;
})();

// Uppläsningen: inspelade klipp (ElevenLabs, samma röst som plattan i Träffpunkt Hemma).
// VOICE_INFO från bygget: {lines: {id: {file, text, dur}}, packs: {kryssId: {file, clips: {ordIndex: [start, längd]}}}}.
// Ledtrådarna för ett kryss ligger i ett paket (en mp3 per kryss) som laddas när man öppnar krysset.
const Voice = (() => {
  const V = {};
  const info = VOICE_INFO || { lines: {}, packs: {} };
  let cur = null, packAudio = null, packId = null, stopTimer = null;
  V.hasLine = id => !!(info.lines && info.lines[id]);
  V.hasPack = pid => !!(info.packs && info.packs[pid]);
  V.stop = () => {
    clearTimeout(stopTimer);
    if (cur) { try { cur.pause(); } catch (e) { /* redan stoppat */ } cur = null; }
    if (packAudio) try { packAudio.pause(); } catch (e) { /* redan stoppat */ }
  };
  V.say = id => {
    V.stop();
    const L = info.lines && info.lines[id];
    if (!L || !Settings.get('sound')) return false;
    try { cur = new Audio(L.file); cur.volume = .95; const p = cur.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { return false; }
    return true;
  };
  V.preparePack = pid => {
    if (!V.hasPack(pid) || packId === pid) return;
    packId = pid;
    try { packAudio = new Audio(info.packs[pid].file); packAudio.preload = 'auto'; } catch (e) { packAudio = null; }
  };
  // Läs upp ledtråden till ett ord i krysset (om det finns en inspelning)
  V.clue = (pid, wi) => {
    const P = info.packs && info.packs[pid];
    if (!P || !P.clips[wi] || !Settings.get('sound')) return false;
    V.stop();
    V.preparePack(pid);
    if (!packAudio) return false;
    const [start, len] = P.clips[wi];
    try {
      packAudio.currentTime = start;
      const p = packAudio.play(); if (p && p.catch) p.catch(() => {});
      stopTimer = setTimeout(() => { try { packAudio.pause(); } catch (e) { /* stoppat */ } }, len * 1000 + 60);
    } catch (e) { return false; }
    return true;
  };
  return V;
})();

/* ---- 04-settings.js ---- */
/* ================= Inställningar ================= */
// Sparas i webbläsaren. Standard: stort och tydligt, fel visas direkt, ljudet på.
const Settings = (() => {
  const DEF = {
    fs: 'normal',        // textstorlek: normal, stor, xstor
    dark: 'auto',        // mörk skärm: auto (som telefonen eller datorn), on eller off
    keys: 'abc',         // tangentbordet: abc (i bokstavsordning) eller qwerty (som på en dator)
    autoCheck: true,     // visa fel bokstäver direkt
    autoRead: false,     // läs upp ledtråden när man väljer ett ord
    sound: true,         // ljud och röst
    skipFilled: true,    // hoppa över ifyllda rutor när man skriver
    name: ''             // förnamnet som syns för de andra när man löser tillsammans
  };
  let cur = Object.assign({}, DEF, Store.get('settings', {}));
  if (cur.dark === true) cur.dark = 'on'; else if (cur.dark === false) cur.dark = 'auto';
  return {
    get: k => cur[k],
    all: () => Object.assign({}, cur),
    set(k, v) { cur[k] = v; Store.set('settings', cur); Bus.emit('settings', k, v); },
    DEF
  };
})();

/* ---- 05-fit.js ---- */
/* ================= Ledtrådstexten i de små rutorna ================= */
// Varje ledtråd ska få så stor text som möjligt i sin ruta (eller halva ruta). Texten bryts mellan orden. Ett ord
// avstavas bara när det behövs (hellre lite mindre text än ett avstavat ord), högst en gång per ord, med minst tre
// bokstäver på varje sida, och där det ser svenskt ut: före en konsonantgrupp som kan inleda ett ord (hamn-stad,
// Söder-slätt, land-skapet), annars före en ensam konsonant mellan vokaler (vi-ken). Luckan __ följer med ordet före.
const Fit = (() => {
  const F = {};
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const cache = new Map();
  const VOW = /[aeiouyåäöé]/i;
  // konsonantgrupper som kan börja ett svenskt ord (längsta först)
  const ONSETS = ['skr', 'spr', 'str', 'spl', 'skv', 'sch', 'sk', 'sl', 'sm', 'sn', 'sp', 'st', 'sv', 'sj', 'tr', 'tv', 'tj', 'pr', 'pl', 'kr', 'kl', 'kn', 'kv', 'kj',
    'gr', 'gl', 'gn', 'gj', 'br', 'bl', 'bj', 'dr', 'dv', 'dj', 'fr', 'fl', 'fj', 'hj', 'lj', 'mj', 'nj', 'pj', 'vr'];
  const DIGRAPHS = ['ck', 'ng', 'sj', 'tj', 'dj', 'gj', 'hj', 'lj', 'kj', 'ch', 'sh', 'ph', 'th', 'qu'];
  let family = 'Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif';
  F.setFamily = f => { family = f; cache.clear(); };
  const width = (s, px, wt) => { ctx.font = `${wt} ${px}px ${family}`; return ctx.measureText(s).width; };

  // Möjliga avstavningar i ett ord, bäst först: [{k, score}] där k betyder ord.slice(0, k) + '-' och ord.slice(k)
  function breaks(w, minSide = 3) {
    const lw = w.toLowerCase(), out = [];
    for (let k = minSide; k <= w.length - minSide; k++) {
      const a = lw[k - 1], b = lw[k];
      if (VOW.test(b)) continue;                                  // aldrig före en vokal
      if (DIGRAPHS.includes(a + b)) continue;                     // aldrig mitt i ck, ng, sj, tj …
      if (VOW.test(a)) {                                          // vokal + konsonant(er) + vokal: före den första konsonanten
        const rest = lw.slice(k);
        const onset = rest.match(/^[^aeiouyåäöé]+/)[0];
        if (onset.length > 1 && DIGRAPHS.includes(onset.slice(0, 2)) && onset.length > 2) continue;
        if (onset.length === 1 || ONSETS.includes(onset)) out.push({ k, score: onset.length > 1 ? 3 : 2 });
        continue;
      }
      // mitt i en konsonantgrupp: bara om det som blir kvar kan börja ett ord (hamn-stad, inte hamns-tad)
      const rest = lw.slice(k), onset = rest.match(/^[^aeiouyåäöé]+/)[0];
      if (ONSETS.includes(onset) || onset.length === 1) out.push({ k, score: onset.length > 1 ? 4 : 3 });
    }
    return out.sort((x, y) => y.score - x.score || Math.abs(w.length / 2 - x.k) - Math.abs(w.length / 2 - y.k));
  }
  // Radbryt texten till högst maxLines rader som var och en ryms i boxW. Ger raderna eller null.
  // hyph: 0 = aldrig avstava, 1 = högst en gång per ord med minst tre bokstäver per del, 2 = nödläge (två bokstäver)
  function wrap(text, px, wt, boxW, maxLines, hyph) {
    const words = text.replace(/ __/g, ' __').replace(/__ /g, '__ ').split(/ +/).filter(Boolean);
    const lines = [];
    let line = '';
    const fits = s => width(s, px, wt) <= boxW;
    for (const w of words) {
      const tryLine = line ? line + ' ' + w : w;
      if (fits(tryLine)) { line = tryLine; continue; }
      if (line && fits(w)) { lines.push(line); line = w; continue; }
      if (!hyph) return null;
      // ordet får inte plats på en rad: avstava en gång (två delar)
      if (line) { lines.push(line); line = ''; }
      const cand = breaks(w, hyph === 2 ? 2 : 3).filter(b => fits(w.slice(0, b.k) + '-') && fits(w.slice(b.k)));
      if (!cand.length) return null;
      lines.push(w.slice(0, cand[0].k) + '-');
      line = w.slice(cand[0].k);
      if (lines.length > maxLines) return null;
    }
    if (line) lines.push(line);
    return lines.length <= maxLines ? lines : null;
  }
  const tryAll = (text, boxW, boxH, px, wt, lh, hyph) => wrap(text, px, wt, boxW, Math.max(1, Math.floor(boxH / (px * lh))), hyph);
  // Största text som får plats: {px, lines}. Utan avstavning om texten då blir minst 85 % så stor.
  F.layout = (text, boxW, boxH, { max = 20, min = 6, weight = 600, lineHeight = 1.08 } = {}) => {
    const key = [text, Math.round(boxW), Math.round(boxH), max, min, weight, family].join('|');
    if (cache.has(key)) return cache.get(key);
    let plain = null, hyph = null;
    for (let px = max; px >= min && !plain; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 0); if (l) plain = { px, lines: l }; }
    for (let px = max; px >= min && !hyph; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 1); if (l) hyph = { px, lines: l }; }
    let best = plain && (!hyph || plain.px >= hyph.px * .85) ? plain : hyph;
    // nödläge: kortare delar, och till sist mindre text
    for (let px = min; !best && px >= 5; px -= .5) { const l = tryAll(text, boxW, boxH, px, weight, lineHeight, 2); if (l) best = { px, lines: l }; }
    if (!best) best = { px: 5, lines: text.split(/ +/) };
    cache.set(key, best);
    return best;
  };
  F.breaks = breaks;
  return F;
})();

/* ---- 06-grid.js ---- */
/* ================= Rutnätet ================= */
// Ritar krysset: bokstavsrutor med stora bokstäver och ledtrådsrutor med text och pilar, som i tidningen.
// Används av spelet, tv-läget och utskriften (olika storlek, samma utseende).
// Ordet man skriver i får en tydlig ram (inte bara en färg), och den gula rutan visar med en pil åt vilket håll
// bokstäverna hamnar. Pilen till det valda ordet blir blå, så att man ser vilken av två ledtrådar i en ruta som gäller.
class GridView {
  constructor(puzzle, { onCell = null, mode = 'play' } = {}) {
    this.p = puzzle; this.mode = mode; this.onCell = onCell;
    this.cs = 60; this.fs = 1;
    this.el = h('div.kx-grid', { class: 'kx-' + mode, role: 'grid', 'aria-label': puzzle.title, style: { '--w': puzzle.w, '--h': puzzle.h } });
    this.arrowEls = {};
    this.cellEls = puzzle.cells.map(c => {
      if (c.clue) {
        const parts = c.parts.map(wi => h('div.kx-qp', { 'data-w': wi }));
        return h('div.kx-q', { 'data-i': c.i, class: c.parts.length > 1 ? 'two' : c.parts.length ? '' : 'empty', style: { gridColumn: c.x + 1, gridRow: c.y + 1 } }, parts);
      }
      const e = h('div.kx-c', { 'data-i': c.i, role: 'gridcell', style: { gridColumn: c.x + 1, gridRow: c.y + 1 } }, h('span.kx-l'), h('span.kx-cd', { 'aria-hidden': 'true' }));
      if (c.marks.length) e.append(this.arrowSvg(c));
      return e;
    });
    this.frame = h('div.kx-frame', { 'aria-hidden': 'true', hidden: true });
    this.el.append(...this.cellEls, this.frame);
    if (onCell) this.el.addEventListener('pointerdown', e => {
      const t = e.target.closest('[data-i]');
      if (!t || !this.el.contains(t)) return;
      e.preventDefault();
      const part = e.target.closest('.kx-qp');
      onCell(+t.dataset.i, part ? +part.dataset.w : null, e);
    });
  }
  // Pilarna ritas i ordets första ruta, vid kanten mot ledtråden (0–100 i rutans koordinater). Varje ords pil är en
  // egen grupp, så att pilen till det valda ordet kan markeras.
  arrowSvg(c) {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'kx-ar'); s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('aria-hidden', 'true');
    const hasDR = c.marks.some(m => m.arrow === 'DR');
    for (const m of c.marks) {
      const y0 = m.part === 'top' ? 24 : m.part === 'bottom' ? 72 : 50;
      let d = '', tri = '';
      if (m.arrow === 'R') { d = `M0 ${y0}H12`; tri = `M12 ${y0 - 9}L25 ${y0}L12 ${y0 + 9}Z`; }
      else if (m.arrow === 'RD') { d = `M0 ${y0}H16V${y0 + 8}`; tri = `M7 ${y0 + 8}L16 ${y0 + 21}L25 ${y0 + 8}Z`; }
      else if (m.arrow === 'D') { const x0 = hasDR ? 66 : 50; d = `M${x0} 0V12`; tri = `M${x0 - 9} 12L${x0} 25L${x0 + 9} 12Z`; }
      else if (m.arrow === 'DR') { const x0 = 22; d = `M${x0} 0V16H${x0 + 8}`; tri = `M${x0 + 8} 7L${x0 + 21} 16L${x0 + 8} 25Z`; }
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'kx-arw'); g.dataset.w = m.word;
      const pl = document.createElementNS(NS, 'path'); pl.setAttribute('d', d); pl.setAttribute('class', 'kx-ar-l');
      const pt = document.createElementNS(NS, 'path'); pt.setAttribute('d', tri); pt.setAttribute('class', 'kx-ar-t');
      g.append(pl, pt);
      s.append(g);
      (this.arrowEls[m.word] = this.arrowEls[m.word] || []).push(g);
    }
    return s;
  }
  // Rutornas storlek i pixlar; ledtrådstexten läggs om efter storleken (och textstorleken, fs)
  setSize(cs, fs = 1) {
    this.cs = cs; this.fs = fs;
    this.el.style.setProperty('--cs', cs + 'px');
    this.fitClues();
  }
  fitClues() {
    const cs = this.cs, pad = Math.max(1.5, cs * .045), fs = this.fs;
    const max = this.mode === 'print' ? cs * .26 : Math.min(cs * .27 * fs, (this.mode === 'tv' ? 34 : 26) * fs);
    for (const c of this.p.cells) {
      if (!c.clue || !c.parts.length) continue;
      const two = c.parts.length > 1;
      // två ledtrådar: den längre får mer av rutans höjd
      const lens = c.parts.map(wi => this.p.words[wi].text.length);
      const shares = two ? lens.map(l => clamp(l / (lens[0] + lens[1]), .38, .62)) : [1];
      c.parts.forEach((wi, k) => {
        const el = this.cellEls[c.i].children[k];
        const boxH = cs * shares[k] - pad * 2 - (two ? 1 : 0), boxW = cs - pad * 2;
        const L = Fit.layout(this.p.words[wi].text, boxW, boxH, { max, min: Math.min(7, max), weight: 600 });
        el.style.fontSize = L.px + 'px';
        el.style.flex = two ? `${shares[k]} 1 0` : '';
        el.replaceChildren(...L.lines.map(t => h('span', t)));
      });
    }
  }
  // Visa läget: bokstäverna, markeringen och de andras markörer (när man löser tillsammans)
  update(prog, { cur = -1, word = -1, dir = null, showWrong = false, peers = [], flash = null } = {}) {
    const P = this.p, wcells = word >= 0 ? new Set(P.words[word].cells) : null;
    for (const c of P.cells) {
      const e = this.cellEls[c.i];
      if (c.clue) {
        for (const pe of e.children) pe.classList.toggle('on', +pe.dataset.w === word);
        continue;
      }
      const ch = prog ? prog.get(c.i) : '';
      const l = e.firstChild;
      if (l.textContent !== ch) l.textContent = ch;
      e.classList.toggle('cur', c.i === cur);
      if (c.i === cur && dir) e.dataset.dir = dir; else if (e.dataset.dir) delete e.dataset.dir;
      e.classList.toggle('word', !!wcells && wcells.has(c.i) && c.i !== cur);
      e.classList.toggle('wrong', !!(showWrong && prog && prog.wrong(c.i)));
      e.classList.toggle('shown', !!(prog && prog.shown.has(c.i)));
      e.classList.toggle('flash', !!(flash && flash.has(c.i)));
      const peer = peers.find(x => x.cell === c.i);
      e.classList.toggle('peer', !!peer);
      if (peer) { e.style.setProperty('--peer', peer.color); e.dataset.peer = peer.name; } else if (e.dataset.peer) { delete e.dataset.peer; }
    }
    // pilarna: den till det valda ordet blir blå
    for (const [wi, gs] of Object.entries(this.arrowEls)) gs.forEach(g => g.classList.toggle('on', +wi === word));
    // ramen runt hela ordet
    if (word >= 0 && this.mode !== 'print') {
      const w = P.words[word], a = P.cells[w.cells[0]], b = P.cells[w.cells[w.len - 1]];
      this.frame.hidden = false;
      this.frame.style.gridColumn = `${a.x + 1} / ${b.x + 2}`;
      this.frame.style.gridRow = `${a.y + 1} / ${b.y + 2}`;
    } else this.frame.hidden = true;
  }
}

/* ---- 07-keys.js ---- */
/* ================= Tangentbordet på skärmen ================= */
// Stora knappar, inget som rättar eller gissar. Två lägen: bokstäverna i ordning (lättast för den som inte skriver
// på dator) och som på en dator. Plattans eget tangentbord används inte: det täcker halva skärmen och rättar ord.
const KEY_ROWS = {
  abc6: ['ABCDEF', 'GHIJKL', 'MNOPQR', 'STUVWX', 'YZÅÄÖ⌫'],
  abc10: ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZÅÄÖ⌫'],
  qwerty: ['QWERTYUIOPÅ', 'ASDFGHJKLÖÄ', 'ZXCVBNM⌫']
};
function Keyboard({ onKey, onBack }) {
  const el = h('div.kx-keys', { role: 'group', 'aria-label': 'Tangentbord' });
  let layout = null;
  let last = { k: null, t: 0 };
  const press = (k, e) => {
    e.preventDefault();
    Sound.unlock();
    // samma tangent inom 150 ms räknas som ett darrigt dubbeltryck (dubbelbokstäver skriver man långsammare)
    const now = performance.now();
    if (k === last.k && now - last.t < 150) return;
    last = { k, t: now };
    if (k === '⌫') onBack(); else onKey(k);
    const b = e.currentTarget;
    b.classList.add('down');
    setTimeout(() => b.classList.remove('down'), 140);
  };
  const render = kind => {
    if (kind === layout) return;
    layout = kind;
    el.className = 'kx-keys kx-keys-' + kind;
    el.replaceChildren(...KEY_ROWS[kind].map(row => h('div.kx-krow', [...row].map(k => {
      const b = h('button.kx-key', { type: 'button', 'data-k': k, 'aria-label': k === '⌫' ? 'Sudda' : k, class: k === '⌫' ? 'kx-key-back' : '' });
      if (k === '⌫') { b.append(icon('erase', 30, 2)); b.append(h('span', 'Sudda')); } else b.textContent = k;
      b.addEventListener('pointerdown', e => press(k, e));
      return b;
    }))));
  };
  return { el, render };
}

/* ---- 08-board.js ---- */
/* ================= Spelplanen: krysset, den stora ledtråden, tangentbordet och hjälpen ================= */
// Board(root, puzzle, opts) bygger allt i root och sköter markeringen och skrivandet.
// opts: progress, readOnly (tv:n), peers (de andra när man löser tillsammans), onEvent(ev) (put, sel, solved),
//       onSolved(), embed (inbyggd i Träffpunkt Hemma).
// Tryck på en ledtråd: markera ordet. Tryck på en ruta: markera den och det ord som passar bäst (ordet man redan
// skriver i, annars ordet som börjar där, annars det som inte är fyllt). Tryck igen på samma ruta: byt håll (ett
// darrigt dubbeltryck inom en halv sekund räknas inte). Skriv med knapparna; när ordet är fullt stannar markören,
// och fler bokstäver skriver inte över den sista (man får i stället veta att ordet är klart).
class Board {
  constructor(root, puzzle, opts = {}) {
    this.root = root; this.p = puzzle; this.opts = opts;
    this.prog = opts.progress || new Progress(puzzle);
    this.readOnly = !!opts.readOnly;
    this.peers = opts.peers || [];
    this.checked = new Set();      // rutor som visas som fel efter "Rätta" (tills de ändras)
    this.flash = null;
    this.dir = 'A';
    this.cur = -1;
    this.grid = new GridView(puzzle, { onCell: this.readOnly ? null : (i, wi) => this.tap(i, wi), mode: this.readOnly ? 'tv' : 'play' });
    this.build();
    // börja i första ordet som inte är klart
    const first = puzzle.order.find(wi => !this.prog.wordFull(wi));
    this.selectWord(first != null ? first : puzzle.order[0], { silent: true });
    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(root);
    if (this.clueBar) { this.ro2 = new ResizeObserver(() => { const hgt = this.clueBar.offsetHeight; if (hgt !== this._cbh) { this._cbh = hgt; this.layout(true); } }); this.ro2.observe(this.clueBar); }
    this.offSettings = Bus.on('settings', k => { if (k === 'keys' || k === 'fs') this.layout(true); this.refresh(); });
    this.onHide = () => this.prog.save(true);
    window.addEventListener('pagehide', this.onHide);
    document.addEventListener('visibilitychange', this.onHide);
    this.onKeyDown = e => this.physicalKey(e);
    if (!this.readOnly) window.addEventListener('keydown', this.onKeyDown);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (this.root.isConnected) { Fit.setFamily(getComputedStyle(this.grid.el).fontFamily); this.layout(true); } });
    this.lastAct = Date.now();
    this.tick = setInterval(() => { if (!document.hidden && !this.prog.done && !this.readOnly && Date.now() - this.lastAct < 120000) { this.prog.secs += 1; if (this.prog.secs % 10 === 0) this.prog.save(); } }, 1000);
    Voice.preparePack(puzzle.id);
    this.layout(true);
  }
  build() {
    const P = this.p;
    this.gridBox = h('div.kx-gridbox', this.grid.el);
    this.el = h('div.kx-board', { class: this.readOnly ? 'kx-ro' : '' }, this.gridBox);
    if (!this.readOnly) {
      this.cbDir = h('span.kx-cb-dir');
      this.cbLen = h('span.kx-cb-len');
      this.cbText = h('p.kx-cb-text', { 'aria-live': 'polite' });
      this.cbPattern = h('div.kx-cb-pat', { 'aria-hidden': 'true' });
      this.readBtn = btn('Läs upp', { icon: 'speaker', small: true, cls: 'kx-read', onClick: () => this.readClue(true) });
      if (!Voice.hasPack(P.id)) this.readBtn.hidden = true;
      const prev = btn('Förra', { icon: 'left', cls: 'kx-nav', title: 'Förra ledtråden', onClick: () => this.nextWord(-1) });
      this.nextBtn = btn('Nästa', { icon: 'right', cls: 'kx-nav', title: 'Nästa ledtråd', onClick: () => this.nextWord(1) });
      this.cbMsg = h('div.kx-cb-msg', { hidden: true, role: 'status' });
      this.clueBar = h('section.kx-cluebar', { 'aria-label': 'Ledtråden' },
        h('div.kx-cb-top', this.cbDir, this.cbLen, this.readBtn),
        h('div.kx-cb-mid', prev, this.cbText, this.nextBtn),
        this.cbPattern, this.cbMsg);
      this.keys = Keyboard({ onKey: k => this.input(k), onBack: () => this.erase() });
      this.swapBtn = btn('Skriv åt andra hållet', { icon: 'swap', small: true, onClick: () => this.toggleDir() });
      this.tools = h('div.kx-tools',
        btn('Visa en bokstav', { icon: 'bulb', small: true, onClick: () => this.reveal('cell') }),
        btn('Visa ordet', { icon: 'eye', small: true, onClick: () => this.reveal('word') }),
        btn('Visa fel', { icon: 'check', small: true, onClick: () => this.check() }),
        this.swapBtn);
      this.side = h('div.kx-side', this.clueBar, this.keys.el, this.tools);
      this.el.append(this.side);
    }
    this.root.replaceChildren(this.el);
  }
  // Storlekar: bred skärm (platta på tvären, dator) har krysset till vänster och resten till höger,
  // smal skärm (mobil, platta på högkant) har krysset överst och tangentbordet under.
  layout(force = false) {
    const W = this.root.clientWidth, H = this.root.clientHeight;
    if (!W || !H) return;
    if (!force && W === this._w && H === this._h) return;
    this._w = W; this._h = H;
    const P = this.p;
    // rutans storlek som får plats i en yta (med 1 px mellan rutorna och 3 px ram runt krysset)
    const fit = (aw, ah) => Math.floor(Math.min((aw - 6 - (P.w - 1)) / P.w, (ah - 6 - (P.h - 1)) / P.h));
    let cs;
    if (this.readOnly) {
      cs = fit(W - 8, H - 8);
    } else {
      const wide = W >= 760 && W / H >= 1.12;
      const fs = parseFloat(getComputedStyle(this.root).getPropertyValue('--fs')) || 1;
      this.fs = fs;
      this.el.classList.toggle('wide', wide);
      this.el.classList.toggle('tall', !wide);
      // låg skärm: först krymper tangenterna, sedan göms mönsterraden, och bara på riktigt låga skärmar hamnar
      // hjälpknapparna på en rad
      this.el.classList.toggle('short', wide ? H < 600 : H < 700);
      this.el.classList.toggle('nopat', wide ? H < 660 : H < 780);
      const kind = Settings.get('keys') === 'qwerty' ? 'qwerty' : wide ? 'abc6' : 'abc10';
      this.keys.render(kind);
      const rows = KEY_ROWS[kind].length;
      if (wide) {
        const side = clamp(W * (.36 - (fs - 1) * .2), 330, 520);
        this.side.style.width = side + 'px';
        // tangenterna får det som blir kvar när ledtråden och hjälpknapparna har fått sitt
        const fixed = this.clueBar.offsetHeight + this.tools.offsetHeight + 20 + 24;
        this.el.style.setProperty('--kh', clamp((H - fixed) / rows - 6, 44, 76) + 'px');
        cs = fit(W - side - 40, H - 24);
      } else {
        this.side.style.width = '';
        const keyH = clamp(Math.min(W / (kind === 'qwerty' ? 11.5 : 10.5), H * .07), 42, 64);
        this.el.style.setProperty('--kh', keyH + 'px');
        const sideH = this.clueBar.offsetHeight + this.tools.offsetHeight + rows * (keyH + 6) + 16 + 16;
        cs = fit(W - 16, H - sideH - 8);
      }
    }
    cs = clamp(cs, 24, this.readOnly ? 160 : 120);
    this.grid.setSize(cs, this.fs || 1);
    this.refresh();
  }
  get word() { return this.p.wordAt(this.cur, this.dir); }
  select(cell, dir = this.dir, { silent = false } = {}) {
    if (cell < 0 || this.p.cells[cell].clue) return;
    const d = this.p.pickDir(cell, dir);
    const before = this.word;
    this.cur = cell; this.dir = d;
    this.refresh();
    if (!silent && this.word !== before) this.readClue(false);
    if (this.opts.onEvent) this.opts.onEvent({ type: 'sel', cell, dir: d });
