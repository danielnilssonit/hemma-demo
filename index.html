    Sound.play('pop');
    if (s.senior.route !== 'spela') s.senior.route = 'spela';
    s.senior.sub = 'anmald';
  });
  A.unsign = () => mut(s => { delete s.spel.signups.ingrid; Sound.play('soft'); });
  A.enterTable = () => mut(s => {
    const tb = s.spel.tables.find(x => x.id === s.spel.mine);
    closeModal(s, 'tablestart');
    if (!tb || s.spel.phase !== 'playing') return;
    enter(s, { kind: 'table', id: tb.id });
    s.senior.route = 'spela'; s.senior.sub = 'bord';
    Sound.play('soft');
    const y = s.yatzy;
    if (y && !y.greeted) {
      y.greeted = true;
      y.nextAt = performance.now() + 9000;
      const s0 = App.s;
      const lines = ['bengt', 'sonja', 'karin'].filter(id => tb.seats.includes(id)).map(id => id + '_y_hej');
      Voice.script('table', lines, { gap: .4, onLine: (id, x) => { if (same(s0)) mut(s2 => { if (s2.room && s2.room.kind === 'table') { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }); }, onLineEnd: () => { if (same(s0)) mut(s2 => { if (s2.room) s2.room.speaking = null; }); } });
    }
  });
  // Bordsprat: en replik i taget, och bara om ingen annan redan pratar
  function sayAtTable(s, id) {
    if (!s.room || s.room.kind !== 'table' || !Voice.has(id) && !Voice.text(id)) return;
    if (s.room.speaking) return;
    const s0 = App.s;
    Voice.say('table', id, { onStart: x => { if (same(s0)) mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }); }, onEnd: () => { if (same(s0)) mut(s2 => { if (s2.room) s2.room.speaking = null; }); } });
  }
  const VOICED = ['karin', 'bengt', 'sonja'];

  /* ---------- Yatzy vid bordet ---------- */
  A.yRoll = () => mut(s => {
    const y = s.yatzy;
    if (!y || y.over || y.rolling || y.S.turn !== 0 || y.S.rolls >= Rules.ROLLS) return;
    if (Rules.check(y.S, 0, { t: 'roll', hold: y.hold }) !== '') return;
    y.S = Rules.apply(y.S, 0, { t: 'roll', hold: y.hold || [] }, Math.random).S;
    y.hold = y.S.held.slice();
    y.rolling = true; y.pickCat = null;
    Sound.play('dice');
    later(750, s2 => { if (s2.yatzy) s2.yatzy.rolling = false; });
  });
  A.yHold = i => mut(s => {
    const y = s.yatzy;
    if (!y || y.S.turn !== 0 || y.S.rolls < 1 || y.S.rolls >= Rules.ROLLS || y.rolling) return;
    y.hold = (y.hold || [false, false, false, false, false]).map((h, k) => k === i ? !h : h);
    Sound.play('soft');
  });
  A.yPick = cat => mut(s => { const y = s.yatzy; if (y && y.S.turn === 0 && y.S.rolls > 0) y.pickCat = y.pickCat === cat ? null : cat; });
  A.yScore = cat => mut(s => {
    const y = s.yatzy;
    if (!y || y.S.turn !== 0 || Rules.check(y.S, 0, { t: 'score', cat }) !== '') return;
    const r = Rules.apply(y.S, 0, { t: 'score', cat });
    const pts = r.ev.find(e => e.t === 'score').pts;
    y.S = r.S; y.hold = [false, false, false, false, false]; y.pickCat = null;
    y.last = { id: 'ingrid', cat, pts };
    y.nextAt = performance.now() + 1400;
    Sound.play('pop');
    if (pts >= 20 || cat === 'y' && pts) {
      const who = VOICED.filter(v => y.seats.includes(v));
      if (who.length && Math.random() < .75) setTimeout(() => { if (App.s.yatzy === y) mut(s2 => sayAtTable(s2, pick(who) + '_y_berom')); }, 900);
    }
    afterScore(s, y, r);
  });
  function afterScore(s, y, r) {
    if (y.S.phase === 'over') {
      y.over = true;
      const tot = y.S.sheets.map(Rules.total), best = Math.max(...tot);
      y.result = y.seats.map((id, i) => ({ id, total: tot[i], win: tot[i] === best })).sort((a, b) => b.total - a.total);
      Sim.log(s, `Yatzy vid bordet ${(s.spel.tables.find(t => t.id === y.table) || {}).name}: ${fullName(y.result[0].id)} vann med ${y.result[0].total}`, 'dice');
      const s0 = App.s, lines = VOICED.filter(v => y.seats.includes(v)).map(v => v + '_y_slut');
      setTimeout(() => {
        if (!same(s0)) return;
        Voice.script('table', lines, { gap: .5, onLine: (id, x) => mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }), onLineEnd: () => mut(s2 => { if (s2.room) s2.room.speaking = null; }) });
        mut(s2 => { s2.me.flowers = (s2.me.flowers || []).concat(VOICED.filter(v => y.seats.includes(v)).map(v => ({ from: v, text: 'Tack för spelet!' }))); });
        Sound.play('flower');
      }, 1500);
    }
  }
  // Datorspelarna vid Ingrids bord (körs några gånger i sekunden)
  function yatzyStep() {
    if (FOLLOWER) return;
    const s = App.s, y = s && s.yatzy;
    if (!y || y.over || y.rolling || y.fast || !s.room || s.room.kind !== 'table') return;
    const seat = y.S.turn;
    if (seat === 0 || performance.now() < (y.nextAt || 0)) return;
    const id = y.seats[seat];
    const d = AI.decide(y.S, seat, 'medel', rnd);
    if (!d) return;
    mut(s2 => {
      if (d.t === 'roll') {
        y.S = Rules.apply(y.S, seat, d, rnd).S;
        y.hold = y.S.held.slice();
        y.rolling = true;
        y.nextAt = performance.now() + (y.fast ? 250 : 1700);
        Sound.play('dice');
        setTimeout(() => { if (App.s.yatzy === y) mut(() => { y.rolling = false; }); }, y.fast ? 120 : 800);
      } else {
        const r = Rules.apply(y.S, seat, d);
        const pts = r.ev.find(e => e.t === 'score').pts;
        y.S = r.S; y.hold = [false, false, false, false, false];
        y.last = { id, cat: d.cat, pts };
        y.nextAt = performance.now() + (y.fast ? 250 : 1900);
        if (VOICED.includes(id) && !y.fast) {
          const kind = d.cat === 'y' && pts ? 'yatzy' : (pts >= 20 && ['kak', 'ls', 'ss', 'fyr', 'tre'].includes(d.cat)) ? 'bra' : pts === 0 ? 'stryk' : null;
          const chance = { yatzy: 1, bra: .7, stryk: .45 }[kind] || 0;
          if (kind && Math.random() < chance) sayAtTable(s2, `${id}_y_${kind}`);
          else if (!kind && y.S.round >= 3 && Math.random() < .3) {
            const who = VOICED.filter(v => y.seats.includes(v) && !y.pratted.includes(v));
            if (who.length) { const w = pick(who); y.pratted.push(w); sayAtTable(s2, w + '_y_prat'); }
          }
        }
        afterScore(s2, y, r);
      }
    });
  }
  setInterval(yatzyStep, 200);
  // Presentatören kan spola fram partiet (alla spelar snabbt, Ingrid med datorns hjälp)
  A.yFast = () => {
    const y = App.s.yatzy;
    if (!y || y.over) return;
    y.fast = true;
    const s0 = App.s;
    const step = () => {
      const yy = App.s.yatzy;
      if (!same(s0) || !yy || yy.over) return;
      mut(s => {
        yy.rolling = false;
        for (let k = 0; k < 6 && !yy.over; k++) {
          const seat = yy.S.turn, d = AI.decide(yy.S, seat, 'medel', rnd);
          if (!d) break;
          if (d.t === 'roll') { yy.S = Rules.apply(yy.S, seat, d, rnd).S; yy.hold = yy.S.held.slice(); }
          else {
            const r = Rules.apply(yy.S, seat, d);
            yy.S = r.S; yy.hold = [false, false, false, false, false];
            yy.last = { id: yy.seats[seat], cat: d.cat, pts: r.ev.find(e => e.t === 'score').pts };
            afterScore(s, yy, r);
          }
        }
      });
      setTimeout(step, 50);
    };
    step();
  };

  /* ---------- Bingon ---------- */
  A.liveWatch = on => mut(s => {
    s.senior.idle = false;
    s.senior.route = 'live';
    s.senior.sub = on ? 'watch' : null;
    if (on) Sim.log(s, 'Ingrid Jönsson är med på bingon hemifrån', 'tv');
    closeModal(s, 'live');
    if (!on) Voice.stop('live');
  });
  A.mark = n => mut(s => {
    const L = s.live;
    if (!L.called.includes(n)) { L.note = `${Bingo.letter(n)} ${n} har inte ropats än.`; L.noteAt = performance.now(); return; }
    L.marked = L.marked.includes(n) ? L.marked.filter(x => x !== n) : L.marked.concat([n]);
    Sound.play('soft');
  });
  A.claim = () => mut(s => {
    const L = s.live, card = L.cards.ingrid;
    if (!card || L.claim) return;
    const line = Bingo.line(card, n => L.marked.includes(n) && L.called.includes(n));
    if (!line) { L.note = 'Inte riktigt än. Det behövs fem i rad, vågrätt, lodrätt eller snett.'; L.noteAt = performance.now(); Sound.play('soft'); return; }
    L.claim = { by: 'ingrid', line, at: performance.now() };
    Sim.log(s, 'Ingrid Jönsson ropade BINGO hemifrån', 'star');
  });
  A.liveGreet = i => mut(s => {
    const text = QUICK_LIVE[i];
    s.live.greetings = s.live.greetings.concat([{ by: 'ingrid', text, t: s.t, i }]);
    s.live.readQueue = (s.live.readQueue || []).concat(['mats_hej_' + i]);
    s.me.sentLive = s.me.sentLive.concat([i]);
    Sound.play('pop');
  });
  A.wave = () => mut(s => { s.live.waves = Object.assign({}, s.live.waves, { ingrid: performance.now() }); Sound.play('soft'); });
  A.setAuto = on => mut(s => { s.settings.autoMark = on; if (on) { const L = s.live; L.marked = L.called.filter(n => (L.cards.ingrid || []).includes(n)); } });

  // Bingovärden: presentation, rop var sjunde sekund, kontroll av bingo och ny omgång
  let liveBusy = false;
  async function liveSay(id, space = 'live') {
    liveBusy = true;
    const s0 = App.s;
    await Voice.say(space, id);
    liveBusy = false;
  }
  async function liveStep() {
    if (FOLLOWER) return;
    const s = App.s, L = s && s.live;
    if (!L || !L.on || liveBusy || !Sim.watching(s)) return;
    const now = performance.now();
    if (L.status === 'intro') { mut(() => { L.status = 'calling'; L.nextCall = now + 900; }); await liveSay('mats_intro'); await sleep(400); await liveSay('mats_forsta'); return; }
    if (L.status === 'ny') { mut(() => { L.status = 'calling'; L.nextCall = now + 800; }); await liveSay('mats_ny_runda'); return; }
    if (L.readQueue && L.readQueue.length && !L.claim) { const id = L.readQueue[0]; mut(() => { L.readQueue = L.readQueue.slice(1); }); await liveSay(id); return; }
    if (L.claim && L.status === 'calling') {
      mut(() => { L.status = 'check'; });
      await liveSay('mats_kolla');
      await sleep(1600);
      if (App.s.live !== L) return;
      const who = L.claim.by;
      mut(s2 => { L.winners = L.winners.concat([who]); L.status = 'won'; L.wonAt = performance.now(); Sim.log(s2, `BINGO för ${fullName(who)} (${person(who).ort}, hemifrån)`, 'star'); if (who === 'ingrid') s2.me.bingoWins = (s2.me.bingoWins || 0) + 1; });
      Sound.play('bingo');
      await liveSay(who === 'ingrid' ? 'mats_bingo_ingrid' : 'mats_bingo_gunvor');
      await sleep(7000);
      if (App.s.live === L && L.on) mut(s2 => Sim.newRound(s2));
      return;
    }
    if (L.status !== 'calling' || now < (L.nextCall || 0) || L.called.length >= L.order.length) return;
    const n = L.order[L.called.length];
    mut(s2 => {
      L.called = L.called.concat([n]);
      L.current = n;
      L.nextCall = now + 7200;
      if (s2.settings.autoMark && (L.cards.ingrid || []).includes(n)) L.marked = L.marked.concat([n]);
      // den som ska vinna omgången (inte Ingrid) ropar bingo ett rop efter att raden blev klar
      if (L.target !== 'ingrid' && !L.claim) {
        const card = L.cards[L.target];
        const had = Bingo.line(card, x => L.called.slice(0, -1).includes(x));
        if (had) L.claim = { by: L.target, at: now };
      }
      // tips till Ingrid om hon har en hel rad men inte har ropat
      const mine = L.cards.ingrid;
      if (mine && !L.claim) { const ln = Bingo.line(mine, x => L.called.includes(x)); L.hint = ln ? (L.hint || 0) + 1 : 0; }
      // någon hemma vinkar ibland
      if (Math.random() < .35) { const w = pick(L.home.filter(id => id !== 'ingrid')); L.waves = Object.assign({}, L.waves, { [w]: now }); }
    });
    Sound.play('ball');
    await liveSay('nr_' + n);
  }
  setInterval(() => { liveStep().catch(e => { liveBusy = false; console.error(e); }); }, 300);
  A.liveSkip = () => mut(s => { const L = s.live; if (L.status === 'calling') L.nextCall = 0; });

  /* ---------- Familjen ---------- */
  A.familyPhoto = id => mut(s => { s.family.photo = id; });
  A.familySend = () => mut(s => {
    const id = s.family.photo;
    Sim.receivePhoto(s, id, true, true);
    s.family.sent = id;
    s.family.sentAt = s.t;
    Sim.log(s, 'Anna Jönsson skickade en bildhälsning till Ingrid', 'image');
  });
  A.photoSeen = id => mut(s => { const p = s.photos.find(x => x.id === id); if (p) p.seen = true; closeModal(s, 'photo'); });
  A.photoHeart = id => mut(s => { const p = s.photos.find(x => x.id === id); if (p) { p.heart = true; p.seen = true; } Sound.play('flower'); });
  A.playPhotoVoice = id => { const p = App.s.photos.find(x => x.id === id); if (p && p.voice) { Voice.stop('photo'); Voice.say('photo', p.voice); } };

  /* ---------- Meddelanden från personalen till alla plattor ---------- */
  A.sendNotice = nid => mut(s => {
    const n = NOTICES.find(x => x.id === nid);
    if (!n) return;
    const item = { id: uid('n'), nid, title: n.title, text: n.text, icon: n.icon, t: s.t, readBy: [] };
    s.notices = [item].concat(s.notices);
    Sim.log(s, `Meddelande till alla plattor: ${n.title}`, 'bell');
    Sim.queue(s, { kind: 'notice', id: item.id });
    // de andra deltagarna läser det efter hand (personalen ser hur många)
    const s0 = App.s, who = shuffle(PEOPLE.filter(p => !p.me).map(p => p.id), seeded(s.notices.length + 11));
    let k = 0;
    const iv = setInterval(() => {
      if (!same(s0) || k >= who.length - 4) { clearInterval(iv); return; }
      mut(() => { item.readBy = item.readBy.concat([who[k++]]); });
    }, 1100);
  });
  A.readNotice = id => mut(s => {
    const n = s.notices.find(x => x.id === id);
    if (n && !n.readBy.includes('ingrid')) n.readBy = n.readBy.concat(['ingrid']);
    closeModal(s, 'notice');
    Voice.stop('app');
  });
  A.openNotice = id => mut(s => { Sim.queue(s, { kind: 'notice', id }); });

  /* ---------- Månadens frågor (svaren visas bara sammanräknade för personalen) ---------- */
  A.surveyAnswer = (k, n) => mut(s => { const a = (s.me.survey || []).slice(); a[k] = n; s.me.survey = a; Sound.play('soft'); });
  A.surveyDone = () => mut(s => {
    if (s.me.surveyDone) return;
    s.me.surveyDone = true;
    Sim.log(s, 'En deltagare svarade på månadens frågor (svaren visas bara sammanräknade)', 'chat');
  });
  A.showWelcome = () => mut(s => { s.senior.idle = false; s.queue = []; s.senior.sheet = { kind: 'welcome', step: 0 }; });

  /* ---------- Vinka i Fikarummet (för den som inte vill prata) ---------- */
  A.waveFika = () => mut(s => {
    if (!s.room || s.room.kind !== 'fika') return;
    s.room.wave = performance.now();
    Sound.play('soft');
    setTimeout(() => App.emit(), 4100);
    // Lena svarar när samtalet i rummet har tystnat
    if (!s.room.waved && s.me.fikaDone) {
      s.room.waved = true;
      const s0 = App.s;
      setTimeout(() => {
        if (!same(s0) || !App.s.room || App.s.room.kind !== 'fika' || App.s.room.speaking) return;
        Voice.say('fika', 'lena_vinka', { onStart: x => mut(s2 => { if (s2.room) { s2.room.speaking = x.who; caption(s2, x.who, x.text); } }), onEnd: () => mut(s2 => { if (s2.room) s2.room.speaking = null; }) });
      }, 1200);
    }
  });

  /* ---------- Personalen ---------- */
  A.staffGo = r => mut(s => { s.staff.route = r; });
  A.staffDone = id => mut(s => { s.omtanke = s.omtanke.map(o => o.id === id ? Object.assign({}, o, { done: true }) : o); Sound.play('soft'); });
  A.staffCall = id => mut(s => {
    if (id === 'ingrid' && !s.room) incoming(s, 'lena');
    s.omtanke = s.omtanke.map(o => o.id === id ? Object.assign({}, o, { calling: true }) : o);
  });

  /* ---------- Presentationen ---------- */
  A.view = v => mut(s => { s.view = v; });
  A.jump = t => Sim.jump(t);
  A.restart = () => {
    const s = App.s;
    Voice.stopAll();
    App.s = freshState({ started: s.started, view: s.view, device: s.device, settings: s.settings, tour: { on: false, step: 0 } });
    App.emit();
  };
  return A;
})();

// Diagram: staplar (exempeldata i personalvyn och förslaget)
function Bars({ data, max, label, unit = '', hi = -1, h = 150 }) {
  const m = max || Math.max(...data.map(d => d.v)) * 1.12;
  const w = 100 / data.length;
  return html`<figure class="bars" aria-label=${label}>
    <svg viewBox=${`0 0 100 ${h / 3}`} preserveAspectRatio="none" class="bars-svg">
      ${[.25, .5, .75].map(g => html`<line x1="0" x2="100" y1=${(1 - g) * h / 3} y2=${(1 - g) * h / 3} class="bars-grid" />`)}
      ${data.map((d, i) => html`<rect x=${i * w + w * .18} width=${w * .64} y=${(1 - d.v / m) * h / 3} height=${d.v / m * h / 3} rx=".6" class=${cx('bars-bar', i === hi && 'hi')} />`)}
    </svg>
    <div class="bars-x">${data.map((d, i) => html`<span class=${i === hi ? 'hi' : ''}><b>${d.v}${unit}</b>${d.x}</span>`)}</div>
  </figure>`;
}

// Nedräkning i verklig tid (för rutor som går vidare av sig själva)
function useCountdown(sec, onDone, deps = []) {
  const [left, setLeft] = useState(sec);
  useEffect(() => {
    setLeft(sec);
    const t0 = performance.now();
    const iv = setInterval(() => {
      const l = Math.max(0, sec - Math.floor((performance.now() - t0) / 1000));
      setLeft(l);
      if (l <= 0) { clearInterval(iv); onDone && onDone(); }
    }, 250);
    return () => clearInterval(iv);
  }, deps);
  return left;
}

function nowInfo(s) {
  const t = s.t, sp = s.spel, mine = sp.tables.find(x => x.id === sp.mine);
  if (s.room) return { icon: { fika: 'cup', call: 'phone', table: 'dice' }[s.room.kind] || 'cup', title: s.room.kind === 'fika' ? 'Du är i Fikarummet' : s.room.kind === 'call' ? `Du pratar med ${firstName(s.room.with)}` : 'Du sitter vid ditt bord', text: 'Tryck för att komma tillbaka.', btn: 'Tillbaka', go: () => s.room.kind === 'table' ? Act.go('spela', { sub: 'bord' }) : Act.go('prata', { sub: 'room' }) };
  if (sp.phase === 'playing' && mine) return { icon: 'dice', tone: 'hot', title: 'Spelstunden pågår', text: `Du spelar ${game(mine.game).name} vid bordet ${mine.name} med ${listSv(mine.seats.filter(x => x !== 'ingrid').map(firstName))}.`, btn: 'Gå till bordet', go: Act.enterTable };
  if (s.live.on) return { icon: 'tv', tone: 'hot', title: 'Bingo live från träffpunkten', text: `${s.live.home.length} är med hemifrån och salen på Träffpunkt Trelleborg är full.`, btn: 'Var med på bingon', go: () => Act.liveWatch(true) };
  if (sp.phase === 'signup') {
    const n = Object.keys(sp.signups).length;
    if (sp.signups.ingrid) return { icon: 'dice', title: `Du är anmäld till ${game(sp.signups.ingrid.game).name}`, text: `Borden delas in kl. 14.00. ${n} har anmält sig hittills.`, btn: 'Visa anmälan', go: () => Act.go('spela', { sub: 'anmald' }) };

  }
  if (t >= T(10, 30) && t < T(10, 50)) return { icon: 'tv', title: 'Sittgympa sänds nu', text: 'Eva, fysioterapeut, leder rörelser för knän och höfter. Du sitter på en stol.', btn: 'Titta och gör med', go: () => Act.go('live', { sub: 'gympa' }) };
  if (fikaOpen(t)) {

  }
  const nx = nextItem(t);
  if (nx) return { icon: 'clock', title: `Härnäst: ${nx.title}`, text: `Kl. ${clockStr(nx.t)}. ${nx.text}`, btn: 'Se hela programmet', go: () => Act.go('live') };
  return { icon: 'sun', title: 'Dagen är slut', text: 'I morgon börjar det igen med förmiddagsfika kl. 09.00.', btn: 'Se veckans program', go: () => Act.go('live') };

// Diktering: riktig taligenkänning där webbläsaren har den (inte i artefakten), annars visar demon hur det blir
const Dictate = {
  start(onText, onEnd, example) {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
    if (R && !framed) {
      try {
        const r = new R();
        r.lang = 'sv-SE'; r.interimResults = true; r.maxAlternatives = 1;
        let got = false;
        r.onresult = e => { got = true; onText(Array.from(e.results).map(x => x[0].transcript).join(' ')); };
        r.onerror = () => { if (!got) Dictate.fake(onText, onEnd, example); };
        r.onend = () => { if (got) onEnd(); };
        r.start();
        return () => { try { r.stop(); } catch (e) { /* redan stoppad */ } };
      } catch (e) { /* ingen mikrofon här */ }
    }
    return Dictate.fake(onText, onEnd, example);
  },
  // Visar orden komma ett i taget, som när man talar in
  fake(onText, onEnd, example) {
    const words = example.split(' ');
    let i = 0, stop = false;
    const step = () => { if (stop) return; i++; onText(words.slice(0, i).join(' ')); if (i < words.length) setTimeout(step, 230); else onEnd(); };
    setTimeout(step, 900);
    return () => { stop = true; };
  }
};
// Skriv eller tala in: textruta, en stor mikrofonknapp och Skicka
function Composer({ id, placeholder, example, sendLabel = 'Skicka', onSend, rows = 3 }) {
  const [text, setText] = useState('');
  const [rec, setRec] = useState(false);
  const stopRef = useRef(null);
  useEffect(() => () => stopRef.current && stopRef.current(), []);
  const talk = () => {
    if (rec) { stopRef.current && stopRef.current(); setRec(false); return; }
    setRec(true);
    stopRef.current = Dictate.start(t => setText(t), () => setRec(false), example);
  };
  const send = () => { if (!text.trim()) return; onSend(text); setText(''); };
  return html`<div class="composer">
    <textarea id=${id} rows=${rows} placeholder=${placeholder} value=${text} onInput=${e => setText(e.currentTarget.value)} aria-label=${placeholder}></textarea>
    <div class="row">
      <${Btn} kind=${rec ? 'danger' : 'secondary'} icon="mic" onClick=${talk} cls=${rec ? 'recording' : ''}>${rec ? 'Jag lyssnar… tryck för att sluta' : 'Tala in'}</${Btn}>
      <${Btn} kind="primary" icon="send" onClick=${send} disabled=${!text.trim()}>${sendLabel}</${Btn}>
    </div>
  </div>`;
}

function minutesLeft(t, at) {
  const m = Math.max(0, Math.ceil((at - t) / 60));
  if (m < 60) return minutesWord(m);
  const h = Math.floor(m / 60), r = m % 60;
  return `${h} tim${r ? ' ' + r + ' min' : ''}`;
}

// Veckans frågesport
function QuizView() {
  const [i, setI] = useState(-1);          // -1 = välkommen, QUIZ.length = klart
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const say = id => { Voice.stop('quiz'); Voice.say('quiz', id); };
  useEffect(() => { say(i < 0 ? 'quiz_intro' : i >= QUIZ.length ? 'quiz_slut' : 'quiz_q' + i); }, [i]);
  useEffect(() => () => Voice.stop('quiz'), []);
  const answer = k => {
    if (chosen != null) return;
    setChosen(k);
    const right = k === QUIZ[i].a;
    if (right) setScore(x => x + 1);
    Sound.play(right ? 'flower' : 'soft');
    setTimeout(() => say('quiz_f' + i), 700);
  };
  const next = () => { setChosen(null); setI(i + 1); };
  const back = html`<div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => { Voice.stop('quiz'); Act.go('spela'); }}>Tillbaka till Spela</${Btn}></div>`;
  if (i < 0) return html`<div class="pg quiz">${back}
    <section class="card quiz-card"><span class="quiz-ic"><${Icon} n="help" size=${56} /></span>
      <h1>Veckans frågesport</h1><p class="lead">Trelleborg förr och nu. Sex frågor, och du tar den tid du behöver. Lena läser upp frågorna.</p>
      <${Btn} kind="primary" big icon="play" onClick=${() => setI(0)}>Första frågan</${Btn}></section></div>`;
  if (i >= QUIZ.length) return html`<div class="pg quiz">${back}
    <section class="card quiz-card"><span class="quiz-ic done-ic"><${Icon} n="star" size=${56} /></span>
      <h1>Du fick ${score} av ${QUIZ.length} rätt!</h1><p class="lead">Bra kämpat. Nästa vecka kommer nya frågor, och på tisdag kl. 14.00 kör Lena frågesporten live i Fikarummet.</p>
      <div class="row center"><${Btn} kind="primary" big icon="restart" onClick=${() => { setScore(0); setI(0); }}>Spela igen</${Btn}><${Btn} big icon="left" onClick=${() => Act.go('spela')}>Till Spela</${Btn}></div></section></div>`;
  const Q = QUIZ[i];
  return html`<div class="pg quiz">${back}
    <p class="quiz-count">Fråga ${i + 1} av ${QUIZ.length} · ${score} rätt</p>
    <h1 class="quiz-q">${Q.q}</h1>
    <div class="quiz-opts">${Q.opts.map((o, k) => html`<button type="button" key=${k} class=${cx('quiz-opt', chosen != null && k === Q.a && 'right', chosen === k && k !== Q.a && 'wrong')} onClick=${() => answer(k)} disabled=${chosen != null}>
      ${chosen != null && k === Q.a && html`<${Icon} n="check" size=${30} sw=${3} />`}${o}</button>`)}</div>
    ${chosen != null && html`<div class="quiz-fact">
      <p><strong>${chosen === Q.a ? 'Rätt!' : `Rätt svar: ${Q.opts[Q.a]}.`}</strong> ${Q.fact}</p>
      <div class="row"><${Btn} kind="primary" big icon="arrow" onClick=${next}>${i + 1 < QUIZ.length ? 'Nästa fråga' : 'Se resultatet'}</${Btn}>
        <${Btn} big icon="speaker" onClick=${() => say('quiz_f' + i)}>Läs upp igen</${Btn}></div></div>`}
    ${chosen == null && html`<div class="row"><${Btn} icon="speaker" onClick=${() => say('quiz_q' + i)}>Läs upp frågan igen</${Btn}></div>`}
  </div>`;
}

const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function Die({ v, held, rolling, onClick, disabled, i }) {
  const [face, setFace] = useState(v);
  useEffect(() => {
    if (!rolling || held) { setFace(v); return; }
    const iv = setInterval(() => setFace(1 + Math.floor(Math.random() * 6)), 85);
    return () => clearInterval(iv);
  }, [rolling, v, held]);
  const f = rolling && !held ? face : v;
  return html`<button type="button" class=${cx('die', held && 'held', rolling && !held && 'rolling', !f && 'blank')} onClick=${onClick} disabled=${disabled} aria-label=${f ? `Tärning ${i + 1}: ${f}${held ? ', sparad' : ''}` : 'Tärning'} aria-pressed=${!!held}>
    <span class="pips">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => html`<i class=${f && PIPS[f].includes(k) ? 'on' : ''}></i>`)}</span>
    ${held && html`<em>Sparad</em>`}
  </button>`;
}

function Yatzy({ y }) {
  const s = App.s;
  const S = y.S, mine = S.turn === 0 && !y.over;
  const pot = mine ? Rules.potentials(S) : {};
  const hold = y.hold || [false, false, false, false, false];
  const [hint, setHint] = useState(null);
  useEffect(() => setHint(null), [S.k]);
  let status;
  if (y.over) {
    const w = y.result.filter(r => r.win), names = w.map(r => r.id === 'ingrid' ? 'du' : firstName(r.id));
    status = `Partiet är slut! ${cap(listSv(names))} vann med ${w[0].total} poäng.`;
  } else if (mine) status = S.rolls === 0 ? 'Din tur! Tryck på Slå.' : S.rolls < 3 ? 'Tryck på tärningarna du vill spara. Slå igen, eller välj en rad.' : 'Välj en rad i ditt protokoll.';
  else status = `${firstName(y.seats[S.turn])} ${y.rolling ? 'slår…' : 'funderar…'}`;
  const last = y.last && y.last.id !== 'ingrid' ? `${firstName(y.last.id)} skrev ${y.last.pts} på ${Rules.catName(y.last.cat)}.` : '';
  const pick = y.pickCat;
  return html`<div class="yz">
    <div class="yz-play">
      <p class="yz-status" aria-live="polite">${status}</p>
      ${last && !mine && html`<p class="yz-last">${last}</p>`}
      <div class="dice-row">${S.dice.map((v, i) => html`<${Die} key=${i} i=${i} v=${v} held=${S.rolls > 0 && hold[i]} rolling=${y.rolling} disabled=${!mine || S.rolls === 0 || S.rolls >= 3} onClick=${() => Act.yHold(i)} />`)}</div>
      ${hint && html`<p class="yz-hint"><${Icon} n="bulb" size=${22} />${hint}</p>`}
      <div class="yz-actions">
        ${y.over ? html`<${Btn} kind="lamp" big icon="flower" onClick=${() => { y.seats.forEach(id => id !== 'ingrid' && Act.flower(id)); }}>${s.me.sentFlowers && y.seats.some(id => s.me.sentFlowers[id]) ? 'Blommor skickade' : 'Tacka för spelet'}</${Btn}>`
          : pick ? html`<${Btn} kind="primary" big icon="pencil" onClick=${() => Act.yScore(pick)}>Skriv ${pot[pick] || 0} på ${Rules.catName(pick)}</${Btn}><${Btn} onClick=${() => Act.yPick(null)}>Ångra</${Btn}>`
          : html`<${Btn} kind="primary" big icon="dice" disabled=${!mine || S.rolls >= 3 || y.rolling} onClick=${Act.yRoll}>${S.rolls === 0 ? 'Slå' : `Slå igen (${3 - S.rolls} kvar)`}</${Btn}>
            <${Btn} icon="bulb" disabled=${!mine} onClick=${() => { const h = AI.hint(S, 0); setHint(h ? h.text : null); }}>Tips</${Btn}>`}
      </div>
    </div>
    <${MySheet} y=${y} pot=${pot} mine=${mine} pick=${pick} />
  </div>`;
}

// Ingrids protokoll: bara hennes egna rader, stora och i två kolumner (de andras poäng syns i namnrutorna ovanför)
function MySheet({ y, pot, mine, pick }) {
  const sh = y.S.sheets[0];
  const row = c => {
    const v = sh[c.id], canPick = mine && v == null && pot[c.id] != null;

      <span class="ms-name">${c.name}</span>
      ${canPick ? html`<button type="button" class=${cx('pot', pot[c.id] === 0 && 'zero', pick === c.id && 'on')} onClick=${() => Act.yPick(c.id)} aria-label=${`${c.name}: ${pot[c.id]} poäng`}>${pot[c.id]}</button>`
        : html`<span class="ms-val">${v == null ? '' : v === 0 ? '–' : v}</span>`}
    </li>`;
  };
  const bonus = Rules.bonus(sh);
  return html`<div class="mysheet" role="group" aria-label="Ditt protokoll">

      <ol>${Rules.CATS.slice(6).map(row)}</ol>
    </div>
  </div>`;
}

// Påminnelse i rummets rubrik de första sekunderna: mikrofonen är på
function MicPill() {
  const s = useApp();

// Sortering: den tråd där det senast hände något först (dagar sedan, sedan klockslag)
const lastActivity = th => { const p = th.posts[th.posts.length - 1]; return p.days * 86400 - p.t; };

function ThreadView({ id }) {
  const s = useApp();
  const th = s.forum.find(x => x.id === id);
  const [reading, setReading] = useState(null);
  const read = async (i) => {
    const key = `post_${th.id}_${i}`;

    setReading(i);
    await Voice.say('read', key);

  useEffect(() => { if (App.s.settings.readAloud && Voice.has(`post_${id}_0`)) read(0); return () => Voice.stop('read'); }, [id]);
  return html`<div class="pg thread">
    <div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => { Voice.stop('read'); mut(x => { x.senior.thread = null; }); }}>Tillbaka till Anslagstavlan</${Btn}></div>

      ${th.posts.map((p, i) => html`<li class=${cx('post', p.staff && 'staff', p.mine && 'mine', reading === i && 'reading')} key=${i}>
        <${Avatar} id=${p.by} size=${58} />

          <p class="post-t">${p.text}</p>
          <div class="row">
            ${Voice.has(`post_${th.id}_${i}`) && html`<${Btn} small icon=${reading === i ? 'pause' : 'speaker'} onClick=${() => reading === i ? (Voice.stop('read'), setReading(null)) : read(i)}>${reading === i ? 'Sluta läsa' : 'Läs upp'}</${Btn}>`}
            <button type="button" class=${cx('react', p.liked && 'on')} onClick=${() => Act.like(th.id, i)} aria-pressed=${!!p.liked}><${Icon} n="heart" size=${20} />Gilla<b>${p.likes || ''}</b></button>

  </div>`;

// Veckoprogrammet där dagens dag är samma som demodagens program
function weekView() {

}

function LivePage() {
  const s = useApp();
  const sub = s.senior.sub;
  if (sub === 'watch') return html`<${LiveWatch} />`;

  if (sub && sub.startsWith('rec:')) return html`<${RecView} id=${sub.slice(4)} />`;

function LiveWatch() {
  const s = useApp();
  const L = s.live;
  const note = L.note && performance.now() - (L.noteAt || 0) < 5000 ? L.note : null;
  useEffect(() => { if (!note) return; const t = setTimeout(() => App.emit(), 5100); return () => clearTimeout(t); }, [L.noteAt]);
  if (!L.on) return html`<div class="pg"><div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => Act.liveWatch(false)}>Tillbaka</${Btn}></div>
    <section class="card"><h2>Sändningen är slut</h2><p>Tack för att du var med! Nästa bingo är på söndag kl. 15.00.</p></section></div>`;
  const card = L.cards.ingrid || [];
  const won = L.status === 'won' && L.winners.length ? L.winners[L.winners.length - 1] : null;
  const wonLine = won === 'ingrid' && L.claim ? L.claim.line : null;
  const hasLine = !!Bingo.line(card, n => L.marked.includes(n) && L.called.includes(n));
  const last = L.called.slice(-5).reverse();
  return html`<div class="live-watch">
    <header class="room-h"><div><h1>Bingo från träffpunkten</h1><p>${VENUES.centrum.name} · runda ${L.round} · ${L.home.length} hemma, 23 i salen</p></div>
      <${Btn} kind="danger" icon="door" onClick=${() => Act.liveWatch(false)}>Lämna sändningen</${Btn}></header>
    <div class="lw">
      <div class="lw-left">
        <div class="video"><${LiveScene} kind="bingo" number=${L.current} home=${L.home.length} /><span class="live-badge">Live</span>
          ${L.status === 'intro' && html`<span class="video-sub">Mats hälsar välkommen</span>`}</div>
        <div class="lw-greet">
          <p><strong>Hälsa till salen.</strong> Mats läser upp din hälsning, och den syns på tv:n.</p>
          <div class="greet-btns">${QUICK_LIVE.map((g, i) => html`<button type="button" class=${cx('chip', s.me.sentLive.includes(i) && 'on')} onClick=${() => Act.liveGreet(i)} disabled=${s.me.sentLive.includes(i)}>${g}</button>`)}
            <${Btn} kind="lamp" icon="hand" onClick=${Act.wave}>Vinka</${Btn}></div>
        </div>
        <${Toggle} id="automark" on=${s.settings.autoMark} onChange=${Act.setAuto} label="Hjälp mig markera" text="Plattan markerar numren åt dig." />
      </div>
      <aside class="lw-right">
        <div class="bingo-now">
          <span class="ball big">${L.current ? html`<small>${Bingo.letter(L.current)}</small>${L.current}` : '–'}</span>
          <div><p class="muted">Senaste numren</p><div class="balls">${last.slice(1).map(n => html`<span class="ball">${Bingo.letter(n)}${n}</span>`)}</div></div>
        </div>
        <div class="bcard" role="grid" aria-label="Din bingobricka">
          ${['B', 'I', 'N', 'G', 'O'].map(l => html`<span class="bc-h">${l}</span>`)}
          ${card.map((n, i) => {
            const marked = n === 0 || L.marked.includes(n);
            const called = n && L.called.includes(n);
            return html`<button type="button" key=${i} class=${cx('bc', n === 0 && 'free', marked && 'marked', called && !marked && 'called', wonLine && wonLine.includes(i) && 'line')}
              onClick=${() => n && Act.mark(n)} disabled=${n === 0} aria-label=${n === 0 ? 'Fri ruta' : `${Bingo.letter(n)} ${n}${marked ? ', markerad' : ''}`}>
              ${n === 0 ? html`<${Icon} n="star" size=${26} />` : n}</button>`;
          })}
        </div>
        <p class="bc-status" aria-live="polite">${L.status === 'check' ? (L.claim && L.claim.by === 'ingrid' ? 'Mats kontrollerar din bricka…' : `${firstName(L.claim.by)} ropade bingo! Mats kontrollerar…`)
          : note || (hasLine || L.hint >= 2 ? 'Du har fem i rad! Tryck på BINGO.' : L.called.length ? 'Tryck på ett nummer när det ropas.' : 'Snart börjar det.')}</p>
        <${Btn} kind="lamp" big icon="star" cls=${cx('bingo-btn', (hasLine || L.hint >= 2) && 'pulse')} onClick=${Act.claim} disabled=${L.status !== 'calling'}>BINGO!</${Btn}>
      </aside>
    </div>
    ${won && html`<div class=${cx('bingo-win', won === 'ingrid' && 'me')}><${Icon} n="star" size=${80} sw=${1.6} />
      <h2>${won === 'ingrid' ? 'BINGO! Grattis, Ingrid!' : `${fullName(won)} fick bingo!`}</h2>
      <p>${won === 'ingrid' ? 'Hela salen på träffpunkten applåderar.' : `${person(won).ort}, med hemifrån. Snart börjar en ny runda.`}</p></div>`}
  </div>`;
}

function GympaView() {
  const [i, setI] = useState(0);
  // Eva leder rörelserna en i taget, med en paus att göra dem på
  useEffect(() => {
    let alive = true;
    (async () => {
      for (let k = 0; alive; k = (k + 1) % GYMPA.length) {
        setI(k);
        await Voice.say('gympa', 'gympa_' + k);
        if (alive) await sleep(3500);
      }
    })();
    return () => { alive = false; Voice.stop('gympa'); };
  }, []);
  return html`<div class="pg gympa">
    <div class="back-row"><${Btn} kind="ghost" icon="left" onClick=${() => Act.go('live')}>Tillbaka till Sändningar</${Btn}></div>
    <div class="video wide"><${LiveScene} kind="gympa" /><span class="live-badge">Live</span></div>
    <p class="gympa-cap"><${Avatar} id="eva" size=${44} /><strong>Eva:</strong> ${GYMPA[i]}</p>
    <p class="note">Sittgympan leds av en fysioterapeut på Träffpunkt Trelleborg. Den som är där sitter i salen, den som är hemma gör samma rörelser vid köksbordet.</p>
  </div>`;
}

function RecView({ id }) {

const HIDDEN_ORT = ['stig', 'ulla', 'svenerik'];   // har valt att inte visa sin ort

function NearTab() {
  const s = useApp();
  const [ort, setOrt] = useState(null);
  const shown = PEOPLE.filter(p => !p.me && !HIDDEN_ORT.includes(p.id));
  const list = shown.map(p => ({ id: p.id, km: distanceKm('ingrid', p.id) })).filter(x => !ort || person(x.id).ort === ort).sort((a, b) => a.km - b.km);
  const byOrt = {};
  shown.forEach(p => { byOrt[p.ort] = (byOrt[p.ort] || 0) + 1; });

    </div>

      ${newbie && !ort && html`<section class="card newbie"><${Avatar} id=${newbie.id} size=${64} /><div><p class="eyebrow">Ny i ${newbie.ort}</p><h3>${fullName(newbie.id)} är ny här</h3><p class="muted">Hon bor ${kmStr(distanceKm('ingrid', newbie.id))} från dig. Säg hej, så känner hon någon när hon kommer till träffpunkten.</p></div>

// Den schematiska kartan: kusten, havet och orterna (storleken på pricken = antal deltagare där)
// Var ortens namn står i förhållande till pricken (så att namnen inte krockar)
const LABEL_AT = { 'Trelleborg': 'left', 'Gislöv': 'right', 'Smygehamn': 'left', 'Beddingestrand': 'above', 'Klagstorp': 'above', 'Skåre': 'below', 'Skegrie': 'above', 'Västra Alstad': 'above', 'Anderslöv': 'above' };
const COAST = 'M0,222 C25,248 45,272 66,281 C120,290 175,293 229,294 C265,296 290,300 318,306 C370,320 420,345 454,363 C480,356 505,336 536,321 C570,305 605,285 632,268 L632,400 L0,400 Z';
function KommunMap({ counts, active, onPick }) {
  const me = PLACES['Anderslöv'];
  const [mx, my] = mapXY(me.lat, me.lon);
  return html`<svg class="kmap" viewBox="0 0 632 400" role="img" aria-label="Schematisk karta över Trelleborgs kommun med orterna där deltagarna bor">
    <rect width="632" height="400" class="km-land" />
    <path d=${COAST} class="km-sea" />
    <text x="470" y="392" class="km-sea-t">Östersjön</text>
    <circle cx=${mx} cy=${my} r="60" class="km-glow" />

// Välkomstguiden: ett steg i taget
function WelcomeSheet({ sh }) {
  const i = sh.step || 0, st = WELCOME[i], last = i === WELCOME.length - 1;
  const go = k => mut(s => { s.senior.sheet = { kind: 'welcome', step: k }; });
  useEffect(() => { Voice.stop('app'); Voice.say('app', 'welcome_' + st.id); }, [i]);
  useEffect(() => () => Voice.stop('app'), []);
  return html`<div class="modal welcome" role="dialog" aria-modal="true" aria-label=${st.title}>
    <span class="welcome-ic"><${Icon} n=${st.icon} size=${64} sw=${1.8} /></span>
    <h2>${st.title}</h2>
    <p class="welcome-text">${st.text}</p>
    <div class="welcome-dots" aria-label=${`Steg ${i + 1} av ${WELCOME.length}`}>${WELCOME.map((w, k) => html`<i class=${k === i ? 'on' : k < i ? 'done' : ''}></i>`)}</div>
    <div class="row center">
      ${i > 0 && html`<${Btn} big icon="left" onClick=${() => go(i - 1)}>Tillbaka</${Btn}>`}
      <${Btn} kind="primary" big icon=${last ? 'check' : 'arrow'} onClick=${() => last ? closeSheet() : go(i + 1)}>${last ? 'Börja använda plattan' : 'Nästa'}</${Btn}>
    </div>
    ${!last && html`<${Btn} kind="ghost" onClick=${closeSheet}>Hoppa över guiden</${Btn}>`}
  </div>`;
}

// Månadens frågor om hur man har det (tre frågor, en i taget)
function SurveySheet({ sh }) {
  const s = useApp();
  const i = sh.step || 0, q = SURVEY.questions;
  const go = k => { if (k > q.length) Act.surveyDone(); mut(x => { x.senior.sheet = { kind: 'survey', step: k }; }); };
  useEffect(() => { Voice.stop('app'); Voice.say('app', i === 0 ? 'survey_intro' : i > q.length ? 'survey_tack' : 'survey_q' + (i - 1)); }, [i]);
  useEffect(() => () => Voice.stop('app'), []);
  if (i === 0) return html`<${Sheet} title="Tre korta frågor" icon="chat">
    <p class="lead">${SURVEY.intro}</p>
    <p class="muted">Det tar ungefär en minut. Du kan hoppa över frågorna.</p>
    <div class="row"><${Btn} kind="primary" big icon="arrow" onClick=${() => go(1)}>Börja</${Btn}><${Btn} big onClick=${closeSheet}>Inte nu</${Btn}></div>
  </${Sheet}>`;
  if (i > q.length) return html`<${Sheet} title="Tack!" icon="heart">
    <p class="lead">${SURVEY.thanks}</p>
    <div class="row"><${Btn} kind="primary" big icon="check" onClick=${closeSheet}>Stäng</${Btn}></div>
  </${Sheet}>`;
  const k = i - 1, chosen = (s.me.survey || [])[k];
  return html`<${Sheet} title=${`Fråga ${i} av ${q.length}`} icon="chat">
    <p class="survey-q">${q[k]}</p>
    <div class="survey-opts">${SURVEY.answers.map((a, n) => html`<button type="button" class=${cx('choice', 'survey-opt', chosen === n && 'on')} onClick=${() => { Act.surveyAnswer(k, n); go(i + 1); }}>${a}</button>`)}</div>
    <div class="row">${i > 1 && html`<${Btn} icon="left" onClick=${() => go(i - 1)}>Förra frågan</${Btn}>`}<${Btn} kind="ghost" onClick=${() => go(i + 1)}>Hoppa över</${Btn}></div>
  </${Sheet}>`;
}

const Tour = {
  go(i) {
    const st = TOUR[i];
    if (!st) return;
    if (st.ensure) st.ensure();
    if (st.t != null && Math.abs(App.s.t - st.t) > 1) Act.jump(st.t);
    mut(s => {
      s.tour = { on: true, step: i };
      s.senior.idle = false;   // plattan vaknar (steget kan somna den igen)
      // på en riktig platta syns en skärm i taget: plattan i stället för delade vyer (bilden från Anna kommer av sig själv)
      s.view = s.device ? ({ 'platta-tv': 'platta', 'platta-anhorig': 'platta', 'personal-platta': 'platta' }[st.view] || st.view) : st.view;
      if (s.device && st.id === 'meddelande') { const s0 = App.s; setTimeout(() => { if (App.s === s0 && !App.s.notices.length) Act.sendNotice('storm'); }, 4000); }
      if (s.device && st.view === 'platta-anhorig') { const s0 = App.s; setTimeout(() => { if (App.s === s0 && !App.s.photos.length) mut(x => Sim.receivePhoto(x, 'fotboll', true, true)); }, 5000); }
      if (st.setup) st.setup(s);
    });
  },
  next() { Tour.go(Math.min(TOUR.length - 1, App.s.tour.step + 1)); },
  prev() { Tour.go(Math.max(0, App.s.tour.step - 1)); },
  stop() { mut(s => { s.tour.on = false; }); }
};

// Räknaren: vad kostar det med olika antal deltagare och avtalstid?
function Calc() {
  const [n, setN] = useState(25);
  const [own, setOwn] = useState(0);
  const [kits, setKits] = useState(2);
  const [months, setMonths] = useState(6);
  const month = n * OFFER.all + own * OFFER.own;
  const total = month * months + kits * OFFER.kit;
  const perDay = (n + own) ? month / (n + own) / 30.4 : 0;
  const under = total <= OFFER.limit;
  return html`<div class="calc">
    <h3>Räkna själv</h3>
    <div class="calc-grid">
      <div class="calc-in">
        <label for="calc-n"><span>Deltagare med platta från oss</span><b>${n}</b></label>
        <input id="calc-n" type="range" min="0" max="300" step="5" value=${n} onInput=${e => setN(+e.currentTarget.value)} />
        <label for="calc-own"><span>Deltagare med egen platta</span><b>${own}</b></label>
        <input id="calc-own" type="range" min="0" max="300" step="5" value=${own} onInput=${e => setOwn(+e.currentTarget.value)} />
        <label for="calc-kits"><span>Träffpunkter med sändningsutrustning</span><b>${kits}</b></label>
        <input id="calc-kits" type="range" min="0" max="4" step="1" value=${kits} onInput=${e => setKits(+e.currentTarget.value)} />
        <div class="calc-months" role="radiogroup" aria-label="Avtalstid">${[6, 12, 24, 36].map(m => html`<button type="button" role="radio" aria-checked=${months === m} class=${months === m ? 'on' : ''} onClick=${() => setMonths(m)}>${m} mån</button>`)}</div>
      </div>
      <div class="calc-out">
        <div><small>Per månad</small><strong>${fmtKr(month)}</strong></div>
        <div><small>Hela avtalstiden, med startpaket</small><strong>${fmtKr(total)}</strong></div>
        <div><small>Per deltagare och dag</small><strong>${fmtKr(perDay)}</strong></div>
        <p class=${cx('calc-lou', under ? 'ok' : 'warn')}><${Icon} n=${under ? 'check' : 'report'} size=${20} />${under ? `Ryms under direktupphandlingsgränsen (${fmtKr(OFFER.limit)}).` : `Över direktupphandlingsgränsen (${fmtKr(OFFER.limit)}): kräver en vanlig upphandling.`}</p>
      </div>
    </div>
  </div>`;
}

function Stage() {
  const s = useApp();
  const ref = useRef(null);
  const [box, setBox] = useState({ w: 1200, h: 700 });
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => setBox({ w: el.clientWidth, h: el.clientHeight });
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const view = VIEWS.find(v => v.id === s.view) || VIEWS[0];
  const devs = view.devices;
  const shares = SHARES[view.id] || devs.map(() => 1 / devs.length);
  const gap = 28, W = Math.max(200, box.w - 40 - gap * (devs.length - 1)), H = Math.max(200, box.h - 64);
  return html`<div class="stage" ref=${ref}>

/* ---------- På en riktig platta: helskärm och en demoknapp ---------- */
// Tv:n är ritad för 1920 × 1080. På en annan skärm (projektor, andra fönster) skalas hela bilden så att den får plats.
function FitBox({ w, h, children }) {
  const [box, setBox] = useState({ sc: 1, x: 0, y: 0 });
  useLayoutEffect(() => {
    const fit = () => { const sc = Math.min(innerWidth / w, innerHeight / h); setBox({ sc, x: (innerWidth - w * sc) / 2, y: (innerHeight - h * sc) / 2 }); };
    fit();
    addEventListener('resize', fit);
    return () => removeEventListener('resize', fit);
  }, []);
  return html`<div class="fitbox"><div class="fitbox-in" style=${{ width: w + 'px', height: h + 'px', transform: `translate(${box.x}px, ${box.y}px) scale(${box.sc})` }}>${children}</div></div>`;
}

/* ---- 24b-sync.js ---- */
/* ================= Andra skärmen: tv:n i salen i ett eget fönster ================= */
// På en dator med projektor eller tv som andra skärm: öppna demon en gång till med #skarm i adressen (knappen med
// tv:n i presentationens verktygsrad). Det fönstret visar tv:n i salen och följer demon i det första fönstret via
// BroadcastChannel (samma webbläsare på samma dator). Det andra fönstret spelar inget ljud och gör inga drag själv:
// allt räknas i det första fönstret, som skickar över hela läget några gånger i sekunden så länge någon lyssnar.
const FOLLOWER = (location.hash || '') === '#skarm';
const Sync = (() => {
  const X = {};
  let ch = null, lastSeen = -1e9, timer = null, got = false;
  const listening = () => performance.now() - lastSeen < 6000;
  const post = () => {
    timer = null;
    if (!ch || !listening()) return;
    try { ch.postMessage({ t: 'state', now: performance.now(), s: JSON.stringify(App.s, (k, v) => typeof v === 'function' ? undefined : v) }); }
    catch (e) { /* kanalen är stängd */ }
  };
  X.init = () => {
    if (typeof BroadcastChannel === 'undefined') return;
    try { ch = new BroadcastChannel('traffpunkt-hemma'); } catch (e) { return; }
    if (FOLLOWER) {
      PREFS.sound = false;   // ljudet kommer från det första fönstret (sparas inte)
      // tiderna i läget (vinkningar, bingovinster) räknas med det första fönstrets klocka
      const base = performance.now.bind(performance);
      let offset = 0;
      performance.now = () => base() + offset;
      ch.onmessage = e => {
        const m = e.data;
        if (!m || m.t !== 'state') return;
        offset = m.now - base();
        const s = JSON.parse(m.s);
        Object.assign(s, { device: true, view: 'tv', started: true, tour: { on: false, step: 0 } });
        App.s = s;
        got = true;
        App.emit();
      };
      const hello = () => { try { ch.postMessage({ t: 'hello' }); } catch (e) { /* stängt */ } };
      hello();
      setInterval(hello, 2000);
    } else {
      ch.onmessage = e => {
        if (!e.data || e.data.t !== 'hello') return;
        const fresh = !listening();
        lastSeen = performance.now();
        if (fresh) post();
      };
      App.on(() => { if (!timer && listening()) timer = setTimeout(post, 180); });
    }
  };
  X.connected = () => got;
  return X;
})();

/* ---- 25-main.js ---- */
/* ================= Start ================= */
// #platta, #tv, #anhorig, #personal och #om i adressen öppnar en vy direkt (i helskärm, för en riktig skärm).
// På en pekskärm (surfplatta eller mobil) visas Ingrids platta i helskärm, annars presentationen med ramar.
const Main = {
  boot() {
    const hash = (location.hash || '').replace('#', '');
    const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    Sync.init();
    mut(s => {
      if (FOLLOWER) { s.device = true; s.view = 'tv'; s.started = true; }
      else if (['platta', 'tv', 'anhorig', 'personal'].includes(hash)) { s.device = true; s.view = hash; }
      else if (hash === 'om') s.view = 'om';
      else if (hash === 'ensida') { s.view = 'ensida'; s.device = true; s.started = true; }
      else if (coarse) { s.device = true; s.view = 'platta'; }
      if (hash === 'visning') s.view = 'platta';
    });
    render(html`<${Root} />`, document.getElementById('app'));
    // Före start står klockan still (dagklockan visar 08.58)
    setInterval(() => {
      if (FOLLOWER) return;   // det andra fönstret räknar inget själv
      const s = App.s;
      if (!s.started) { s.clock.real = performance.now(); return; }
      Sim.tick();
    }, 250);
    document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stopAll(); });
  }
};

if (/[?&]debug\b/.test(location.search)) window.TH = { App, Act, Sim, Tour, mut };
Main.boot();
})();
