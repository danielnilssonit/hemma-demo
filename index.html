<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#f7f7f5}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Träffpunkt Hemma</title>
<meta name="description" content="Demo och förslag: en digital träffpunkt för äldre i Trelleborgs kommun.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Bitter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap&text=0123456789">
<style>
/* ================= Färger, typsnitt och grund ================= */
/* Presentationen är medvetet mörk ("kvällsblå", som när ljuset dämpas i ett mötesrum) i båda teman, så att
   skärmarna lyser. Plattan har sin egen ljusa palett, som en riktig platta. Förslaget följer läsarens tema. */
:root {
  /* Lexend är bara laddad med siffrorna 0–9 (tydlig nolla), resten av texten kommer från Atkinson Hyperlegible */
  --f-ui: Lexend, "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --f-display: Bitter, "Roboto Slab", Georgia, "Times New Roman", serif;

  /* presentationen */
  --sh-bg: #0D1829;
  --sh-bg2: #132238;
  --sh-bg3: #1A2D48;
  --sh-line: #253A58;
  --sh-ink: #E9EEF4;
  --sh-ink2: #A3B3C6;
  --lamp: #F2A516;
  --lamp-hi: #FFD27A;
  --lamp-ink: #2E2100;

  /* plattan (Ingrids skärm) */
  --paper: #F1F4EF;
  --card: #FFFFFF;
  --ink: #15233A;
  --ink2: #475569;
  --line: #D3DBE2;
  --line2: #E6EBEF;
  --primary: #1D5E86;
  --primary-hi: #174E70;
  --primary-soft: #E2EEF6;
  --ok: #2B7A4B;
  --ok-soft: #E2F2E8;
  --danger: #B13A2E;
  --danger-soft: #FBE7E4;
  --lamp-soft: #FFF3D6;
  --hot: #FFF7E3;

  /* förslaget (följer temat) */
  --doc-bg: #FBFBF8;
  --doc-ink: #17212F;
  --doc-ink2: #4E5B6B;
  --doc-line: #DDE3E8;
  --doc-soft: #EEF3F6;
  --doc-accent: #1D5E86;
  --doc-hi: #B77A00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --doc-bg: #121C2A;
    --doc-ink: #E8EDF3;
    --doc-ink2: #A9B6C6;
    --doc-line: #2A3B52;
    --doc-soft: #182638;
    --doc-accent: #7DB9DD;
    --doc-hi: #FFC247;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --doc-bg: #121C2A;
  --doc-ink: #E8EDF3;
  --doc-ink2: #A9B6C6;
  --doc-line: #2A3B52;
  --doc-soft: #182638;
  --doc-accent: #7DB9DD;
  --doc-hi: #FFC247;
}

html, body { height: 100%; }
body { margin: 0; background: var(--sh-bg); color: var(--sh-ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.ic { flex: none; display: block; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img { max-width: 100%; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ================= Presentationen ================= */
.shell { height: 100%; display: flex; flex-direction: column; background: var(--sh-bg); color: var(--sh-ink); position: relative; }
.sbar { flex: none; display: flex; align-items: center; gap: 14px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--sh-bg2); border-bottom: 1px solid var(--sh-line); flex-wrap: wrap; }
.sbar-brand { display: flex; align-items: center; gap: 10px; }
.sbar-brand strong { display: block; font-family: var(--f-display); font-size: 17px; letter-spacing: .01em; }
.sbar-brand small { display: block; font-size: 12px; color: var(--sh-ink2); }
.sbar-views { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 360px; min-width: 0; scrollbar-width: none; }
.sbar-views::-webkit-scrollbar { display: none; }
.sv { display: inline-flex; gap: 7px; align-items: center; padding: 8px 13px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--sh-ink2); font-size: 14px; font-weight: 700; white-space: nowrap; }
.sv:hover:not(.on) { background: var(--sh-bg3); color: var(--sh-ink); }
.sv.on { background: var(--sh-ink); color: var(--sh-bg); }
.sbar-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sbar-clock { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; color: var(--lamp-hi); font-variant-numeric: tabular-nums; }
.sbar-jumps { display: inline-flex; background: var(--sh-bg); border: 1px solid var(--sh-line); border-radius: 999px; padding: 2px; }
.sbar-jumps button { background: none; border: 0; color: var(--sh-ink2); font-size: 13px; font-weight: 700; padding: 5px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.sbar-jumps button:hover, .sbar-jumps button.on { background: var(--sh-bg3); color: var(--sh-ink); }
.sbar-ic { background: none; border: 1px solid var(--sh-line); color: var(--sh-ink); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; flex: none; }
.sbar-ic:hover { background: var(--sh-bg3); }
a.sbar-ic { text-decoration: none; }
a.g-act { text-decoration: none; }
/* Andra skärmen: väntar på demon i det första fönstret */
.skarm-wait { position: fixed; inset: 0; z-index: 50; background: rgba(12, 22, 38, .94); color: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.skarm-wait h1 { font-family: var(--f-display); font-size: 44px; }
.skarm-wait p { font-size: 22px; max-width: 34ch; line-height: 1.45; }
.skarm-wait .muted { color: #AFC0D3; font-size: 18px; }
.sbar-guide { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--sh-line); background: none; color: var(--sh-ink); font-weight: 700; font-size: 14px; }
.sbar-guide.on { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }

.shell-body { flex: 1; min-height: 0; display: flex; position: relative; }
.stage { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 20px 30px; overflow: hidden;
  background: radial-gradient(ellipse 70% 60% at 50% 42%, #1C3150 0%, var(--sh-bg) 72%); }
.stage-row { display: flex; align-items: center; justify-content: center; gap: 28px; }
.stage-note { position: absolute; bottom: 8px; left: 16px; right: 16px; text-align: center; font-size: 12px; color: var(--sh-ink2); }
.dev { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.dev-hold { position: relative; flex: none; }
.dev-body { position: absolute; top: 0; left: 0; transform-origin: 0 0; box-sizing: border-box; display: flex; flex-direction: column; }
.dev-screen { position: relative; overflow: hidden; background: var(--paper); container-type: size; flex: none; }
.dev-tablet .dev-body { background: linear-gradient(145deg, #1A2230, #07090E); border-radius: 36px; box-shadow: 0 0 0 2px #2B3547, 0 34px 90px rgba(0, 0, 0, .55), 0 0 160px rgba(242, 165, 22, .07); }
.dev-tablet .dev-screen { border-radius: 14px; }
.dev-tv .dev-body { background: #06080C; border-radius: 12px; box-shadow: 0 0 0 2px #232B38, 0 34px 90px rgba(0, 0, 0, .55); }
.dev-tv .dev-screen { border-radius: 4px; background: #0F1B2D; }
.dev-phone .dev-body { background: linear-gradient(145deg, #1A2230, #07090E); border-radius: 54px; box-shadow: 0 0 0 2px #2B3547, 0 30px 80px rgba(0, 0, 0, .55); }
.dev-phone .dev-screen { border-radius: 42px; background: #F6F7F4; }
.dev-browser .dev-body { background: #DCE2E9; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
.dev-browser .dev-screen { background: #F4F6F9; }
.dev-bar { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #D3DAE3; flex: none; }
.dev-bar i { width: 11px; height: 11px; border-radius: 50%; background: #E5675B; }
.dev-bar i:nth-child(2) { background: #E8B44A; }
.dev-bar i:nth-child(3) { background: #5DB764; }
.dev-bar span { margin-left: 12px; background: #F4F6F9; color: #5A6778; border-radius: 6px; padding: 3px 12px; font-size: 13px; }
.dev figcaption { font-size: 13px; color: var(--sh-ink2); text-align: center; }

.doc-stage { flex: 1; min-width: 0; overflow-y: auto; background: var(--doc-bg); color: var(--doc-ink); }

/* Guiden */
.guide { flex: none; width: 340px; background: var(--sh-bg2); border-left: 1px solid var(--sh-line); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 16px; box-sizing: border-box; }
.g-h { display: flex; justify-content: space-between; align-items: center; }
.g-h h2 { font-family: var(--f-display); font-size: 20px; }
.g-step { background: var(--sh-bg3); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.g-count { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--lamp-hi); }
.g-step h3 { font-size: 21px; font-family: var(--f-display); }
.g-step p { font-size: 15px; line-height: 1.55; }
.g-small { font-size: 13px !important; color: var(--sh-ink2); }
.g-keys { margin-top: auto; padding-top: 4px; }
.g-act { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--lamp); background: transparent; color: var(--lamp-hi); font-weight: 700; font-size: 14px; }
.g-nav { display: flex; gap: 8px; margin-top: 4px; }
.g-btn { flex: 1; display: inline-flex; gap: 6px; align-items: center; justify-content: center; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--sh-line); background: transparent; color: var(--sh-ink); font-weight: 800; font-size: 14px; }
.g-btn:disabled { opacity: .4; }
.g-next { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); }
.g-list { display: flex; flex-direction: column; gap: 2px; }
.g-list button { display: flex; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; background: none; border: 0; color: var(--sh-ink2); font-size: 14px; }
.g-list button b { width: 42px; flex: none; font-variant-numeric: tabular-nums; font-weight: 700; }
.g-list button:hover { background: var(--sh-bg3); color: var(--sh-ink); }
.g-list button.on { background: var(--sh-bg3); color: var(--sh-ink); box-shadow: inset 3px 0 0 var(--lamp); }
.g-list button.done { color: var(--sh-ink); }
.g-small-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--sh-line); color: var(--sh-ink2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }

/* Startrutan */
.start-scrim { position: absolute; inset: 0; background: rgba(8, 14, 24, .7); display: grid; place-items: center; padding: 16px; z-index: 60; }
.start-card { max-width: 560px; width: 100%; box-sizing: border-box; background: var(--sh-bg2); border: 1px solid var(--sh-line); border-radius: 26px; padding: 34px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 40px 100px rgba(0, 0, 0, .5); }
.start-card h1 { font-family: var(--f-display); font-size: 42px; letter-spacing: -.01em; }
.start-lead { font-size: 18px; line-height: 1.55; }
.start-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.start-go { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 16px; border: 0; background: var(--lamp); color: var(--lamp-ink); font-weight: 800; font-size: 19px; box-shadow: 0 0 40px rgba(242, 165, 22, .35); }
.start-free { min-height: 52px; border-radius: 16px; border: 1px solid var(--sh-line); background: transparent; color: var(--sh-ink); font-weight: 700; font-size: 17px; }
.start-note { font-size: 13px; color: var(--sh-ink2); display: inline-flex; gap: 6px; align-items: center; margin-top: -6px; }

/* På en riktig platta */
.device { position: fixed; inset: 0; background: var(--paper); }
.device-screen { position: absolute; inset: 0; container-type: size; overflow: hidden; }
.dv-om .device-screen { container-type: normal; overflow-y: auto; }
.dv-om .doc-stage { min-height: 100%; }
.dv-tv .device-screen { background: #060A12; }
.fitbox { position: absolute; inset: 0; overflow: hidden; }
.fitbox-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.demo-fab { position: fixed; left: 14px; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; gap: 6px; align-items: center; padding: 8px 12px; border-radius: 999px; border: 0; background: rgba(13, 24, 41, .78); color: #fff; font-weight: 700; font-size: 14px; }
.demo-panel { position: fixed; left: 14px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 20px)); max-height: 78vh; overflow-y: auto; box-sizing: border-box; background: var(--sh-bg2); color: var(--sh-ink); border: 1px solid var(--sh-line); border-radius: 18px; padding: 14px; z-index: 45; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
.demo-panel header { display: flex; justify-content: space-between; align-items: center; }
.dp-sec { display: flex; flex-direction: column; gap: 8px; }
.dp-sec small { color: var(--sh-ink2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.dp-title { font-weight: 800; }
.dp-text { font-size: 14px; line-height: 1.5; color: var(--sh-ink2); }
.dp-row { display: flex; gap: 6px; }
.dp-row.wrap { flex-wrap: wrap; }
.dp-row button { flex: 1; min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--sh-line); background: transparent; color: var(--sh-ink); font-weight: 700; font-size: 14px; }
.dp-row.wrap button { flex: 0 0 auto; }
.dp-row button.on { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.dp-row button:disabled { opacity: .4; }

@media (max-width: 1720px) {
  .sbar-views { order: 3; flex-basis: 100%; }
}
@media (max-width: 1150px) {
  .with-guide .guide { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -20px 0 60px rgba(0, 0, 0, .45); }
}
@media (max-width: 760px) {
  .demo-fab { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; left: auto; right: 8px; opacity: .75; }
  .demo-panel { top: calc(52px + env(safe-area-inset-top, 0px)); bottom: auto; left: auto; right: 8px; }
}
@media (max-width: 720px) {
  .sbar { gap: 8px; padding-inline: 16px; }
  .sbar-brand small { display: none; }
  .sbar-jumps { order: 3; }
  .sv span { display: none; }
  .guide { width: 100%; }
  .stage { padding-inline: 16px; }
}

/* ================= Plattan: grund och byggstenar ================= */
/* Plattans egen palett (ljus som standard, mörk om Ingrid väljer det). Allt skalas med --fs (textstorleken). */
.senior { --fs: 1; --rail: #15233A; --primary-ink: #FFFFFF; --ok-ink: #FFFFFF;
  position: absolute; inset: 0; display: grid; grid-template-columns: 172px 1fr; background: var(--paper); color: var(--ink);
  font-family: var(--f-ui); font-size: calc(20px * var(--fs)); line-height: 1.4; overflow: hidden; }
.fs-normal { --fs: .9; }
.fs-xstor { --fs: 1.14; }
.sn-dark { --paper: #101926; --card: #182334; --ink: #EDF2F7; --ink2: #A9B6C6; --line: #2B3A4F; --line2: #223044; --primary: #6DB3DE; --primary-hi: #8AC4E8;
  --primary-soft: #1B3044; --primary-ink: #0B1622; --ok-ink: #0B1622; --ok: #53B57E; --ok-soft: #173025; --danger: #E5776B; --danger-soft: #3A1F1B; --lamp-soft: #3A2E12; --hot: #2A2413; --rail: #070D16; }

/* Menyn till vänster */
.rail { background: var(--rail); color: #fff; display: flex; flex-direction: column; padding: 12px 10px; gap: 8px; min-height: 0; }
.rail-brand { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.12; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, .14); }
.rail-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
.rail-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 82px; border-radius: 16px; border: 0; background: transparent; color: #D5DFEA;
  font-size: calc(17px * var(--fs)); font-weight: 700; text-align: center; line-height: 1.1; padding: 6px 4px; }
.rail-btn:hover:not(.on) { background: rgba(255, 255, 255, .08); }
.rail-btn.on { background: #FFFFFF; color: #15233A; }
.rail-badge { position: absolute; top: 6px; right: 8px; background: var(--lamp); color: var(--lamp-ink); font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 999px; font-weight: 800; }
.rail-help { background: rgba(255, 255, 255, .1); }

/* Raden överst */
.sn-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 84px; box-sizing: border-box; border-bottom: 1px solid var(--line); background: var(--card); }
.tb-date { margin-right: auto; display: flex; flex-direction: column; align-items: flex-start; background: none; border: 0; text-align: left; padding: 4px 8px; border-radius: 12px; }
.tb-date strong { font-size: calc(22px * var(--fs)); }
.tb-date span { font-size: calc(19px * var(--fs)); color: var(--ink2); font-variant-numeric: tabular-nums; }
.tb-weather { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: calc(18px * var(--fs)); }
.tb-lamp, .tb-me { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 5px 14px 5px 6px; min-height: 62px; text-align: left; }
.tb-lamp strong, .tb-me strong { display: block; font-size: calc(18px * var(--fs)); }
.tb-lamp small, .tb-me small { display: block; font-size: calc(16px * var(--fs)); color: var(--ink2); }
.lamp-glow { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--line2); color: var(--ink2); transition: all .3s; }
.tb-lamp.on { border-color: var(--lamp); background: var(--lamp-soft); }
.tb-lamp.on .lamp-glow { background: var(--lamp); color: var(--lamp-ink); box-shadow: 0 0 0 6px rgba(242, 165, 22, .22), 0 0 26px rgba(242, 165, 22, .65); }
.tb-me.on { border-color: var(--primary); }

.sn-page { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.sn-full { overflow: hidden; }
.pg { padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.pg-head h1 { font-family: var(--f-display); font-size: calc(34px * var(--fs)); font-weight: 700; letter-spacing: -.01em; }
.lead { font-size: calc(21px * var(--fs)); color: var(--ink2); margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.card-h { display: flex; align-items: center; gap: 10px; font-size: calc(23px * var(--fs)); }
.sec-h { font-size: calc(24px * var(--fs)); margin-top: 4px; }
.muted { color: var(--ink2); }
.small { font-size: calc(17px * var(--fs)); }
.center { text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.center { justify-content: center; }
.note { display: flex; gap: 10px; align-items: flex-start; color: var(--ink2); font-size: calc(18px * var(--fs)); }
.note .ic { margin-top: 2px; }
.done { display: inline-flex; gap: 6px; align-items: center; color: var(--ok); font-weight: 700; }
.done.wait { color: var(--ink2); }
.empty { color: var(--ink2); font-style: italic; }
.eyebrow { font-size: calc(16px * var(--fs)); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-block; font-style: normal; font-size: calc(14px * var(--fs)); padding: 2px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 800; margin-left: 8px; vertical-align: middle; }
.pill-now { background: var(--lamp); color: var(--lamp-ink); }

/* Knappar */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--primary); background: var(--card); color: var(--primary);
  font-weight: 700; font-size: calc(20px * var(--fs)); text-decoration: none; line-height: 1.15; text-align: center; transition: transform .1s, background .15s, box-shadow .15s; box-sizing: border-box; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .42; }
.btn-secondary:hover:not(:disabled) { background: var(--primary-soft); }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hi); border-color: var(--primary-hi); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-lamp { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-big { min-height: 68px; padding: 0 26px; font-size: calc(22px * var(--fs)); border-radius: 16px; }
.btn-small { min-height: 46px; padding: 0 14px; font-size: calc(17px * var(--fs)); border-radius: 12px; gap: 8px; }
.btn.on { background: var(--primary-soft); }
.btn.recording { animation: rec 1.2s infinite; }
@keyframes rec { 50% { box-shadow: 0 0 0 8px rgba(177, 58, 46, .2); } }

/* Namnbrickor */
.av { position: relative; flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: var(--av); color: #fff; font-weight: 800; letter-spacing: .02em; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); font-family: var(--f-ui); line-height: 1; }
.av-talk { box-shadow: 0 0 0 4px var(--card), 0 0 0 8px var(--ok); animation: talk 1s ease-in-out infinite; }
@keyframes talk { 50% { box-shadow: 0 0 0 4px var(--card), 0 0 0 13px rgba(43, 122, 75, .45); } }
.av-lamp { position: absolute; right: -5px; top: -5px; background: var(--lamp); color: var(--lamp-ink); border-radius: 50%; padding: 3px; display: grid; box-shadow: 0 0 0 2px var(--card), 0 0 12px rgba(242, 165, 22, .8); }
.av-mute { position: absolute; right: -5px; bottom: -5px; background: var(--danger); color: #fff; border-radius: 50%; padding: 3px; display: grid; box-shadow: 0 0 0 2px var(--card); }
.av-dot { position: absolute; right: 0; bottom: 0; width: 26%; height: 26%; border-radius: 50%; background: #9AA6B2; box-shadow: 0 0 0 2px var(--card); }
.av-dot.on { background: #34A853; }
.who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.who strong { font-size: calc(20px * var(--fs)); }
.who small { font-size: calc(17px * var(--fs)); color: var(--ink2); }
.who-big strong { font-size: calc(24px * var(--fs)); }

/* Flikar */
.tabs { display: flex; gap: 8px; background: var(--line2); padding: 6px; border-radius: 18px; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border: 0; border-radius: 14px; background: transparent; font-weight: 700; font-size: calc(20px * var(--fs)); color: var(--ink2); }
.tab.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(21, 35, 58, .14); }
.badge { font-style: normal; background: var(--lamp); color: var(--lamp-ink); border-radius: 999px; padding: 0 9px; font-size: calc(15px * var(--fs)); font-weight: 800; }

/* Av och på */
.tgl { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line2); cursor: pointer; }
.tgl-text { flex: 1; display: flex; flex-direction: column; }
.tgl-text small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.tgl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tgl-sw { width: 66px; height: 38px; border-radius: 999px; background: #AEB9C4; position: relative; flex: none; transition: background .2s; }
.tgl-sw span { position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.tgl input:checked + .tgl-sw { background: var(--ok); }
.tgl input:checked + .tgl-sw span { transform: translateX(28px); }
.tgl input:focus-visible + .tgl-sw { outline: 3px solid var(--lamp); outline-offset: 2px; }
.tgl-state { width: 32px; font-weight: 800; }

/* Rutor överst */
.scrim { position: absolute; inset: 0; background: rgba(13, 24, 41, .56); display: grid; place-items: center; z-index: 20; padding: 24px; }
.modal { background: var(--card); color: var(--ink); border-radius: 26px; padding: 24px 30px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: pop .25s ease-out; }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.modal-h { display: flex; align-items: center; gap: 12px; }
.modal-h h2 { flex: 1; font-size: calc(28px * var(--fs)); font-family: var(--f-display); }
.modal-tall { width: min(840px, 100%); }
.modal footer { display: flex; gap: 12px; flex-wrap: wrap; }

.toasts { position: absolute; top: 96px; right: 20px; z-index: 15; display: flex; flex-direction: column; gap: 10px; width: 460px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--line); border-left: 7px solid var(--lamp); border-radius: 16px; padding: 12px 14px;
  box-shadow: 0 14px 34px rgba(21, 35, 58, .2); animation: slide .3s ease-out; }
.toast p { flex: 1; font-size: calc(18px * var(--fs)); }
.toast-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--lamp-soft); display: grid; place-items: center; color: var(--ink); flex: none; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

.callbar { flex: none; display: flex; align-items: center; gap: 12px; background: var(--ok); color: var(--ok-ink); padding: 8px 20px; font-weight: 700; font-size: calc(18px * var(--fs)); }
.callbar > span:nth-child(2) { flex: 1; }
.cb-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ok-ink); animation: blink 1.4s infinite; flex: none; }
.callbar .btn { min-height: 44px; }
.callbar .btn-ok { background: var(--ok-ink); color: var(--ok); border-color: var(--ok-ink); }
.callbar .btn-danger { background: transparent; color: var(--ok-ink); border-color: var(--ok-ink); }
@keyframes blink { 50% { opacity: .25; } }

/* Dagklockan */
/* Meddelande från personalen */
.notice-m { width: min(820px, 100%); border-top: 10px solid var(--lamp); }
.notice-head { display: flex; align-items: center; gap: 16px; }
.notice-head h2 { font-family: var(--f-display); font-size: calc(32px * var(--fs)); }
.notice-ic { width: 76px; height: 76px; border-radius: 22px; background: var(--lamp-soft); color: var(--ink); display: grid; place-items: center; flex: none; }
.notice-ic.small { width: 52px; height: 52px; border-radius: 16px; }
.notice-text { font-size: calc(24px * var(--fs)); line-height: 1.45; }
/* Välkomstguiden och månadens frågor */
.welcome { text-align: center; align-items: center; width: min(760px, 100%); padding: 34px 36px; }
.welcome h2 { font-family: var(--f-display); font-size: calc(36px * var(--fs)); }
.welcome-ic { width: 120px; height: 120px; border-radius: 32px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.welcome-text { font-size: calc(24px * var(--fs)); line-height: 1.45; max-width: 30ch; }
.welcome-dots { display: flex; gap: 10px; }
.welcome-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.welcome-dots i.done { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--primary); }
.welcome-dots i.on { background: var(--primary); }
.survey-q { font-family: var(--f-display); font-size: calc(30px * var(--fs)); line-height: 1.25; }
.survey-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.survey-opt { justify-content: center; text-align: center; min-height: 86px; font-size: calc(22px * var(--fs)); }
.survey-opt.on { border-color: var(--primary); background: var(--primary-soft); }
.mo-112 { font-size: calc(17px * var(--fs)); color: var(--ink2); border-top: 1px solid var(--line2); padding-top: 10px; }
.dayclock { position: absolute; inset: 0; z-index: 30; background: radial-gradient(ellipse at 50% 30%, #1B2F4B, #0D1727 75%); color: #F5F1E6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; text-align: center; padding: 20px; }
.dc-day { font-family: var(--f-display); font-size: calc(112px * var(--fs)); font-weight: 700; line-height: 1; }
.dc-part { font-size: calc(46px * var(--fs)); color: var(--lamp-hi); }
.dc-time { font-size: calc(88px * var(--fs)); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.dc-date { font-size: calc(28px * var(--fs)); color: #B8C4D2; }
.dc-row { display: flex; gap: 40px; margin-top: 22px; font-size: calc(26px * var(--fs)); flex-wrap: wrap; justify-content: center; }
.dc-row span { display: flex; align-items: center; gap: 12px; }
.dc-lamps { margin-top: 16px; display: flex; gap: 12px; align-items: center; font-size: calc(24px * var(--fs)); color: var(--lamp-hi); background: rgba(242, 165, 22, .12); padding: 10px 22px; border-radius: 999px; }
.dc-hint { position: absolute; bottom: 24px; font-size: calc(19px * var(--fs)); color: #8FA0B4; }

/* Morgonhälsningen och samtal */
.morning, .call-in, .tstart, .live-m { text-align: center; align-items: center; }
.live-m { width: min(820px, 100%); }
.live-m .video { width: 100%; }
.mo-sun { color: var(--lamp); }
.morning h2, .call-in h2 { font-family: var(--f-display); font-size: calc(34px * var(--fs)); }
.faces-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
.face { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 20px; border: 3px solid var(--line); background: var(--card); font-weight: 800; font-size: calc(20px * var(--fs)); }
.face-bra { color: #2B7A4B; }
.face-okej { color: #1D5E86; }
.face-sadan { color: #8A6100; }
.face-dalig { color: #8A4F7D; }
.face:hover { border-color: currentColor; background: var(--paper); }
.ring-av { border-radius: 50%; animation: ringing 1.3s infinite; }
@keyframes ringing { 0%, 100% { box-shadow: 0 0 0 0 rgba(43, 122, 75, .55); } 60% { box-shadow: 0 0 0 26px rgba(43, 122, 75, 0); } }

/* Bildhälsningen */
.photo-m { width: min(1120px, 100%); flex-direction: row; gap: 26px; align-items: center; }
.photo-frame { flex: 1.35; background: #FFFFFF; padding: 12px 12px 40px; border-radius: 6px; box-shadow: 0 12px 30px rgba(0, 0, 0, .22); transform: rotate(-1.5deg); }
.photo-svg { width: 100%; aspect-ratio: 4 / 3; display: block; }
.photo-side { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.photo-side h2 { font-family: var(--f-display); font-size: calc(28px * var(--fs)); }
.photo-text { font-size: calc(22px * var(--fs)); line-height: 1.45; }

/* Skriv eller tala in */
.composer { display: flex; flex-direction: column; gap: 10px; }
.composer textarea { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: calc(21px * var(--fs)); background: var(--card); color: var(--ink); resize: none; line-height: 1.4; }
.composer textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-size: calc(20px * var(--fs)); font-weight: 700; min-height: 64px; }
.choice:hover { border-color: var(--primary); background: var(--primary-soft); }
.choice span { display: flex; flex-direction: column; }
.choice small { font-weight: 400; color: var(--ink2); font-size: calc(17px * var(--fs)); }
.plist { display: flex; flex-direction: column; }
.plist li { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line2); }
.plist li:first-child { border-top: 0; }
.plist.big li { padding: 12px 0; }

/* ================= Plattan: sidorna ================= */

/* I dag */
.home-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.home-a, .home-b { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.now { gap: 10px; padding: 22px 24px; border-width: 2px; }
.now-hot { background: var(--hot); border-color: var(--lamp); }
.now-label { display: inline-flex; align-items: center; gap: 8px; font-size: calc(16px * var(--fs)); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.now h2, .spelstund h2 { font-size: calc(30px * var(--fs)); font-family: var(--f-display); }
.now p, .spelstund p { font-size: calc(21px * var(--fs)); }
.now-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
.faces { display: flex; }
.faces .av { margin-left: -10px; box-shadow: 0 0 0 3px var(--card); }
.faces .av:first-child { margin-left: 0; }
.prog-list li button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 8px; border: 0; background: none; text-align: left; border-top: 1px solid var(--line2); min-height: 52px; }
.prog-list li:first-child button { border-top: 0; }
.pi-time { width: 64px; flex: none; font-weight: 800; font-variant-numeric: tabular-nums; }
.pi-title { flex: 1; }
.pi-past { color: var(--ink2); }
.pi-past .ic { color: var(--ok); }
.pi-now button { background: var(--lamp-soft); border-radius: 12px; }
.lamps .lamp-ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--lamp); color: var(--lamp-ink); flex: none; }
.lamps .btn-lamp { align-self: flex-start; }
.q-text { font-size: calc(24px * var(--fs)); font-weight: 700; font-family: var(--f-display); }
.q-ans { font-size: calc(18px * var(--fs)); color: var(--ink2); }
.notice-card { flex-direction: row; align-items: center; gap: 14px; border: 2px solid var(--lamp); background: var(--hot); }
.notice-card > div { flex: 1; min-width: 0; }
.notice-card h2 { font-size: calc(21px * var(--fs)); }
.survey-card { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
.survey-card > div { min-width: 0; }
.survey-card > .btn { grid-column: 1 / -1; justify-self: start; }
.survey-card h2 { font-size: calc(20px * var(--fs)); }
.survey-ic { width: 52px; height: 52px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.bday { flex-direction: row; align-items: center; gap: 14px; background: #FFF3EC; border-color: #F0C6B1; }
.sn-dark .bday { background: #2C211B; border-color: #5A3B2B; }
.bday-ic { width: 56px; height: 56px; border-radius: 50%; background: #F7D9C8; display: grid; place-items: center; color: #9A5130; flex: none; }
.bday > div { flex: 1; }
.bday h2 { font-size: calc(21px * var(--fs)); }
.plans ul { display: flex; flex-direction: column; gap: 8px; }
.plans li { display: flex; gap: 10px; align-items: flex-start; font-size: calc(19px * var(--fs)); }
.plans li .ic { color: var(--ok); margin-top: 2px; }
.answers { display: flex; flex-direction: column; gap: 14px; }
.answers li { display: flex; gap: 14px; }
.answers p { margin-top: 2px; font-size: calc(20px * var(--fs)); }
.hearts { display: inline-flex; gap: 6px; align-items: center; color: #B13A5A; margin-top: 4px; }

/* Spela */
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.game { display: grid; grid-template-columns: 96px 1fr; grid-template-areas: "ic txt" "btn btn"; gap: 12px 16px; align-items: center; }
.game-ic, .game-bingo-ic { grid-area: ic; width: 96px; height: 96px; border-radius: 22px; }
.game > div:nth-child(2) { grid-area: txt; }
.game h3 { font-size: calc(24px * var(--fs)); }
.game p { color: var(--ink2); font-size: calc(18px * var(--fs)); }
.game-btns { grid-area: btn; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.game-btns small { font-size: calc(16px * var(--fs)); }
.game-bingo-ic { background: #A4455A; color: #fff; display: grid; place-items: center; }
.game-quiz-ic { grid-area: ic; width: 96px; height: 96px; border-radius: 22px; background: #2F6F8F; color: #fff; display: grid; place-items: center; }
/* Frågesporten */
.quiz-card { align-items: center; text-align: center; gap: 14px; padding: 30px; }
.quiz-card h1 { font-family: var(--f-display); font-size: calc(36px * var(--fs)); }
.quiz-ic { width: 104px; height: 104px; border-radius: 28px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.quiz-ic.done-ic { background: var(--lamp-soft); color: var(--lamp); }
.quiz-count { font-weight: 800; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; font-size: calc(16px * var(--fs)); }
.quiz-q { font-family: var(--f-display); font-size: calc(34px * var(--fs)); line-height: 1.2; }
.quiz-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.quiz-opt { min-height: 110px; border-radius: 20px; border: 3px solid var(--line); background: var(--card); font-size: calc(24px * var(--fs)); font-weight: 800; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 14px; text-align: center; }
.quiz-opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.quiz-opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.quiz-opt:disabled:not(.right):not(.wrong) { opacity: .55; }
.quiz-fact { background: var(--card); border: 2px solid var(--line); border-left: 8px solid var(--lamp); border-radius: 18px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.quiz-fact p { font-size: calc(22px * var(--fs)); line-height: 1.45; }

.game-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.signup { width: min(1000px, 100%); }
.gp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 20px; border: 3px solid var(--line); background: var(--card); text-align: center; }
.gp img { width: 64px; height: 64px; border-radius: 16px; }
.gp strong { font-size: calc(20px * var(--fs)); }
.gp small { color: var(--ink2); font-size: calc(16px * var(--fs)); }
.gp.on { border-color: var(--primary); background: var(--primary-soft); }
.gp-any { width: 64px; height: 64px; border-radius: 16px; background: var(--lamp-soft); display: grid; place-items: center; }
.gp-check { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }
.friend-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: calc(18px * var(--fs)); min-height: 52px; }
.chip.on { border-color: var(--primary); background: var(--primary-soft); }
.chip:disabled { opacity: .6; }
.chip small { font-weight: 400; color: var(--ink2); }
.av-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px; }
.av-list li { display: flex; align-items: center; gap: 12px; }
.tstart-seats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
.tstart-seats span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tstart-seats b { font-size: calc(21px * var(--fs)); }
.tstart-seats small { color: var(--ink2); font-size: calc(16px * var(--fs)); }
.mic-note { display: flex; gap: 10px; align-items: center; background: var(--ok-soft); padding: 10px 16px; border-radius: 14px; font-size: calc(18px * var(--fs)); text-align: left; }

/* Rummen (fika, samtal, bordet) */
.room { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.room-h { display: flex; align-items: center; gap: 16px; padding: 8px 22px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
.room-h > div { flex: 1; min-width: 0; }
.room-h h1 { font-size: calc(25px * var(--fs)); font-family: var(--f-display); line-height: 1.2; }
.room-h p { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.room-clock { font-weight: 800; font-size: calc(22px * var(--fs)); font-variant-numeric: tabular-nums; }
.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; padding: 16px 22px; align-content: center; overflow-y: auto; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: border-color .2s, background .2s; }
.tile strong { font-size: calc(20px * var(--fs)); }
.tile small { color: var(--ink2); font-size: calc(16px * var(--fs)); }
.tile.talking { border-color: var(--ok); background: var(--ok-soft); }
.tile-me { border-style: dashed; position: relative; }
.tile-wave { position: absolute; top: 8px; right: 10px; color: var(--lamp); animation: wave .6s ease-in-out infinite alternate; transform-origin: 70% 90%; }
.call-tiles { flex: 1; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 20px; }
.tile-big { padding: 30px 60px; }
.tile-big strong { font-size: calc(26px * var(--fs)); }
.captions { flex: none; min-height: 78px; padding: 8px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; background: #0F1B2D; color: #fff; box-sizing: border-box; }
.captions p { display: flex; align-items: center; gap: 10px; font-size: calc(22px * var(--fs)); line-height: 1.3; }
.captions p .av { box-shadow: none; }
.captions p.old { opacity: .55; font-size: calc(18px * var(--fs)); }
.captions.off { min-height: 0; padding: 0; }
.controls { flex: none; display: flex; gap: 12px; padding: 10px 22px; background: var(--card); border-top: 1px solid var(--line); justify-content: center; }
.controls .btn { flex: 1; max-width: 340px; }
.room-h .mic-pill { display: flex; gap: 8px; align-items: center; background: var(--ok); color: var(--ok-ink); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: calc(18px * var(--fs)); animation: pop .3s ease-out; }

/* Yatzy vid bordet: grön filt med träkant, som i Yatzyklubben */
.seats { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 8px 22px; }
.seat { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 7px 12px 7px 8px; min-width: 0; }
.seat.turn { border-color: var(--lamp); background: var(--hot); }
.seat-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.seat-txt strong { font-size: calc(17px * var(--fs)); line-height: 1.15; }
.seat-txt small { color: var(--ink2); font-size: calc(15px * var(--fs)); }
.seat-pts { font-weight: 800; font-size: calc(24px * var(--fs)); text-align: right; line-height: 1; font-variant-numeric: tabular-nums; flex: none; }
.seat-pts small { display: block; font-size: calc(13px * var(--fs)); font-weight: 400; color: var(--ink2); }
.yz { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 450px; gap: 14px; padding: 0 22px 10px; }
.yz-play { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #3A7D5C, #2A6247 80%); border-radius: 24px; color: #fff; padding: 16px;
  box-shadow: inset 0 0 0 7px #6B4A2B, inset 0 0 0 9px #8A6440; min-height: 0; }
.yz-status { font-size: calc(24px * var(--fs)); font-weight: 800; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.yz-last { font-size: calc(18px * var(--fs)); opacity: .9; }
.dice-row { display: flex; gap: 14px; margin-bottom: 18px; }
.die { position: relative; width: 94px; height: 94px; border-radius: 18px; background: #FBFAF6; border: 0; box-shadow: 0 6px 0 #C9C3B5, 0 10px 18px rgba(0, 0, 0, .35); padding: 12px; transition: transform .15s, box-shadow .15s; box-sizing: border-box; }
.die .pips { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.die .pips i { display: block; margin: auto; width: 16px; height: 16px; border-radius: 50%; }
.die .pips i.on { background: #1C1C1C; }
.die.held { transform: translateY(-10px); box-shadow: 0 0 0 5px var(--lamp), 0 14px 22px rgba(0, 0, 0, .35); }
.die em { position: absolute; bottom: -32px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: calc(15px * var(--fs)); font-weight: 800; color: var(--lamp-hi); white-space: nowrap; }
.die.rolling { animation: shake .16s linear infinite; }
@keyframes shake { 25% { transform: rotate(-9deg) translateY(-4px); } 75% { transform: rotate(9deg) translateY(2px); } }
.yz-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.yz-actions .btn-secondary { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .55); }
.yz-hint { background: rgba(0, 0, 0, .28); padding: 8px 14px; border-radius: 12px; display: flex; gap: 8px; align-items: center; font-size: calc(18px * var(--fs)); }
.mysheet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; }
.mysheet h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: calc(19px * var(--fs)); padding: 2px 4px 6px; border-bottom: 2px solid var(--line2); }
.mysheet h3 b { font-variant-numeric: tabular-nums; }
.ms-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ms-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 42px; padding: 0 4px 0 6px; border-bottom: 1px solid var(--line2); font-size: calc(18px * var(--fs)); }
.ms-name { font-weight: 600; }
.ms-val { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.ms-row.fresh { background: var(--lamp-soft); border-radius: 8px; }
.ms-sum { background: var(--line2); border-radius: 8px; }
.ms-row .pot { width: 60px; min-height: 36px; border-radius: 10px; font-size: calc(18px * var(--fs)); }
.pot { border: 2px dashed var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 800; padding: 0; }
.pot.zero { color: var(--ink2); border-color: var(--line); background: transparent; }
.pot.on { background: var(--primary); color: var(--primary-ink); border-style: solid; }
.other-game { flex: 1; margin: 12px 22px; flex-direction: row; align-items: center; gap: 24px; }
.other-game > div { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* Prata */
.fika-card { flex-direction: row; gap: 24px; align-items: flex-start; }
.fika-art { width: 116px; height: 116px; border-radius: 28px; background: var(--lamp-soft); color: #9A5130; display: grid; place-items: center; flex: none; }
.fika-card > div:nth-child(2) { flex: 1; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.fika-card h2 { font-family: var(--f-display); font-size: calc(28px * var(--fs)); }
.faces-list { display: flex; flex-wrap: wrap; gap: 14px; }
.faces-list li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: calc(17px * var(--fs)); text-align: center; }
.faces-list small { display: block; font-weight: 400; color: var(--ink2); }
.info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.info-row p { display: flex; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: calc(18px * var(--fs)); }
.info-row span { display: flex; flex-direction: column; }
.ring-tab { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.ring-tab .plist li .btn { min-height: 50px; padding: 0 14px; }
.chat-tab { display: flex; flex-direction: column; gap: 12px; }
.chat-list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.chat-day { text-align: center; color: var(--ink2); font-size: calc(16px * var(--fs)); }
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.mine { justify-content: flex-end; }
.msg-b { background: var(--paper); border-radius: 18px; padding: 10px 14px; max-width: 80%; }
.msg.mine .msg-b { background: var(--primary-soft); }
.msg-who { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.msg-who small { color: var(--ink2); font-size: calc(15px * var(--fs)); }
.msg-t { font-size: calc(21px * var(--fs)); margin-top: 2px; }
.msg-r { display: flex; gap: 8px; margin-top: 6px; }
.react { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: calc(16px * var(--fs)); min-height: 42px; font-weight: 700; color: var(--ink2); }
.react.on { border-color: #B13A5A; color: #B13A5A; background: #FCEBF0; }
.react b { color: var(--ink); }

/* Anslagstavlan */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cat { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 1px; text-align: left; padding: 12px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); align-items: center; }
.cat .ic { grid-row: 1 / 4; color: var(--primary); }
.cat strong { font-size: calc(20px * var(--fs)); }
.cat small { color: var(--ink2); font-size: calc(16px * var(--fs)); }
.cat em { font-style: normal; font-size: calc(15px * var(--fs)); color: var(--primary); font-weight: 700; }
.cat.on { border-color: var(--primary); background: var(--primary-soft); }
.threads li button { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; }
.threads li button:hover { border-color: var(--primary); }
.th-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.th-main strong { font-size: calc(21px * var(--fs)); }
.th-main small, .th-meta small { color: var(--ink2); font-size: calc(16px * var(--fs)); }
.th-meta { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.th-meta b { font-size: calc(17px * var(--fs)); }
.back-row { margin-bottom: -8px; }
.posts { display: flex; flex-direction: column; gap: 12px; }
.post { display: flex; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.post.staff { border-color: #9CC3DD; background: #F4F9FC; }
.sn-dark .post.staff { background: #16283A; border-color: #2E5877; }
.post.mine { border-color: var(--lamp); }
.post.reading { box-shadow: 0 0 0 3px var(--ok); }
.post-b { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.post-who { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.post-who .pill { margin-left: 0; }
.post-who small { color: var(--ink2); font-size: calc(15px * var(--fs)); }
.post-t { font-size: calc(21px * var(--fs)); line-height: 1.45; }

/* Sändningar */
.live-now { flex-direction: row; gap: 20px; align-items: center; position: relative; }
.ln-art { position: relative; width: 340px; flex: none; border-radius: 14px; overflow: hidden; }
.scene { display: block; width: 100%; height: auto; }
.live-now > div:last-child { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.live-now h2 { font-family: var(--f-display); font-size: calc(26px * var(--fs)); }
.live-badge { position: absolute; top: 12px; left: 12px; background: #D22F27; color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; z-index: 1; font-family: var(--f-ui); }
.live-badge::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 6px; animation: blink 1.4s infinite; vertical-align: 1px; }
.live-next { flex-direction: row; gap: 16px; align-items: center; }
.live-next h2 { font-size: calc(23px * var(--fs)); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.wk-day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-size: calc(15px * var(--fs)); min-width: 0; }
.wk-day strong { display: block; margin-bottom: 6px; font-size: calc(17px * var(--fs)); }
.wk-day li { margin-bottom: 6px; line-height: 1.25; }
.wk-day li b { display: block; font-variant-numeric: tabular-nums; color: var(--primary); }
.wk-day.today { border: 2px solid var(--lamp); background: var(--hot); }
.recs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rec { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
.rec:hover { border-color: var(--primary); }
.rec-art { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; display: block; }
.thumb-svg { width: 100%; height: 100%; display: block; }
.rec-play { position: absolute; inset: 0; display: grid; place-items: center; }
.rec-play .ic { background: rgba(21, 35, 58, .75); color: #fff; border-radius: 50%; padding: 12px; box-sizing: content-box; }
.rec strong { font-size: calc(19px * var(--fs)); }
.rec small { color: var(--ink2); font-size: calc(15px * var(--fs)); }
.video { position: relative; border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 8px 22px rgba(0, 0, 0, .16); flex: none; }
.video .scene, .video .thumb-svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.video.wide { max-width: 900px; width: 100%; align-self: center; }
.video-sub { position: absolute; bottom: 12px; left: 12px; background: rgba(0, 0, 0, .62); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 18px; }
.gympa-cap { display: flex; align-items: center; gap: 12px; font-size: calc(26px * var(--fs)); max-width: 900px; align-self: center; width: 100%; }
.player { display: flex; align-items: center; gap: 14px; max-width: 900px; width: 100%; align-self: center; }
.rec-prog { flex: 1; height: 12px; background: var(--line2); border-radius: 999px; overflow: hidden; }
.rec-prog i { display: block; height: 100%; background: var(--primary); }

/* Bingon hemifrån */
.live-watch { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.lw { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 390px; gap: 16px; padding: 12px 22px; }
.lw-left { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.lw-greet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lw-greet p { font-size: calc(18px * var(--fs)); }
.greet-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.greet-btns .btn { min-height: 52px; }
.lw-right { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.bingo-now { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px; }
.ball { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 3px solid #A4455A; font-weight: 800; font-size: 14px; color: #15233A; flex: none; }
.ball.big { width: 76px; height: 76px; font-size: 28px; border-width: 5px; background: radial-gradient(circle at 35% 30%, #fff, #F3EDE3); line-height: 1; display: flex; flex-direction: column; justify-content: center; }
.ball.big small { font-size: 14px; }
.balls { display: flex; gap: 6px; }
.bcard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #A4455A; padding: 10px; border-radius: 18px; }
.bc-h { text-align: center; color: #fff; font-weight: 800; font-size: 24px; font-family: var(--f-display); line-height: 1.2; }
.bc { aspect-ratio: 1; border: 0; border-radius: 12px; background: #FFFDF8; font-size: 25px; font-weight: 800; color: #15233A; display: grid; place-items: center; font-variant-numeric: tabular-nums; position: relative; padding: 0; }
.bc.called { box-shadow: inset 0 0 0 3px var(--lamp); animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 6px var(--lamp); } }
.bc.marked { background: #FFD27A; }
.bc.marked::after { content: ''; position: absolute; inset: 13%; border-radius: 50%; border: 5px solid rgba(164, 69, 90, .8); }
.bc.free { background: #F7E7C9; color: #A4455A; }
.bc.free::after { display: none; }
.bc.line { background: #2B7A4B; color: #fff; }
.bc.line::after { border-color: rgba(255, 255, 255, .9); }
.bc-status { min-height: 48px; font-size: calc(18px * var(--fs)); font-weight: 700; text-align: center; display: grid; place-items: center; }
.bingo-btn { width: 100%; font-size: 30px !important; letter-spacing: .04em; }
.bingo-btn.pulse { animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(242, 165, 22, .3); } }
.lw-left .tgl { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; }
.bingo-win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(15, 27, 45, .84); color: #fff; z-index: 5; text-align: center; animation: pop .3s ease-out; }
.bingo-win h2 { font-family: var(--f-display); font-size: 64px; }
.bingo-win p { font-size: 26px; max-width: 700px; }
.bingo-win .ic { color: var(--lamp-hi); }
.bingo-win.me .ic { animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Grannar */
.near { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; align-items: start; }
.near-map { padding: 10px; }
.kmap { width: 100%; height: auto; display: block; border-radius: 14px; }
.km-land { fill: #E6EEDD; }
.km-sea { fill: #BCD7E6; }
.km-sea-t { fill: #4A7894; font-size: 22px; font-style: italic; }
.km-glow { fill: rgba(242, 165, 22, .2); }
.km-place { cursor: pointer; }
.km-dot { fill: var(--primary); stroke: #fff; stroke-width: 3; }
.km-n { fill: #fff; font-weight: 800; font-size: 19px; text-anchor: middle; pointer-events: none; }
.km-name { fill: #15233A; font-size: 21px; font-weight: 700; paint-order: stroke; stroke: #E6EEDD; stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.km-place.home .km-dot { fill: var(--lamp); }
.km-place.home .km-n { fill: var(--lamp-ink); }
.km-place.on .km-dot { stroke: #15233A; stroke-width: 4; }
.map-note { display: flex; gap: 8px; align-items: center; font-size: calc(16px * var(--fs)); color: var(--ink2); padding: 8px 6px 2px; }
.near-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.newbie { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; background: var(--lamp-soft); border-color: #EBC77A; }
.newbie > .btn, .newbie > .done { grid-column: 1 / -1; justify-self: start; }
.newbie h3 { font-size: calc(21px * var(--fs)); }
.near-ul .btn { min-height: 50px; padding: 0 14px; font-size: calc(18px * var(--fs)); }
.friend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.friend { align-items: center; text-align: center; }
.friend h3 { font-size: calc(20px * var(--fs)); }
.friend .btn { min-height: 50px; padding: 0 12px; font-size: calc(17px * var(--fs)); }
.flowers { display: flex; flex-direction: column; gap: 10px; }
.flowers li { display: flex; gap: 12px; align-items: center; }
.flowers small { display: block; color: var(--ink2); font-size: calc(15px * var(--fs)); }
.fl-ic { width: 46px; height: 46px; border-radius: 50%; background: #FCE3EA; color: #B13A5A; display: grid; place-items: center; flex: none; }
.invite-who { display: flex; gap: 14px; align-items: center; }

/* Hjälp och Mitt konto */
.help-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.help-tile { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 22px 16px; border-radius: 22px; border: 2px solid var(--line); background: var(--card); }
.help-tile strong { font-size: calc(23px * var(--fs)); }
.help-tile small { color: var(--ink2); font-size: calc(17px * var(--fs)); }
.help-tile .ic { color: var(--primary); }
.help-tile:first-child { border-color: var(--ok); background: var(--ok-soft); }
.help-tile:first-child .ic { color: var(--ok); }
.aa { font-family: var(--f-display); font-size: 44px; font-weight: 700; color: var(--primary); line-height: 48px; }
.help-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.guide-card { flex-direction: row; gap: 14px; align-items: flex-start; }
.guide-card .ic { color: var(--primary); }
.guide-card h3 { font-size: calc(21px * var(--fs)); }
.profile { flex-direction: row; gap: 18px; align-items: center; }
.profile h2 { font-size: calc(28px * var(--fs)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--f-display); }
.lock { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-ui); font-size: calc(15px * var(--fs)); background: var(--ok-soft); color: var(--ok); padding: 3px 10px; border-radius: 999px; }
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.seg { display: flex; background: var(--line2); padding: 5px; border-radius: 14px; gap: 5px; }

/* Smal skärm (plattan i en mobil): menyn längst ned och en kolumn */

  .yz, .lw { grid-template-columns: 1fr; overflow-y: auto; }
  .seats { grid-template-columns: repeat(2, 1fr); }

  .game-pick, .faces-pick { grid-template-columns: repeat(2, 1fr); }

  .dc-day { font-size: 64px; } .dc-time { font-size: 56px; } .dc-part { font-size: 30px; }
  .scrim { padding: 10px; }
  .modal { padding: 18px; }
}

/* ================= Tv:n i salen ================= */
.tv { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 20%, #1A2F4C, #0C1626 75%); color: #F3F0E8; font-family: var(--f-ui); display: flex; flex-direction: column; padding: 36px 48px; box-sizing: border-box; gap: 26px; overflow: hidden; }

.tv-row span.on { background: #F3F0E8; color: #15233A; }

.tv-home { background: rgba(255, 255, 255, .06); border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.tv-home h2 { font-size: 32px; display: flex; gap: 12px; align-items: center; }

.tv-win small { font-size: 40px; color: #AFC0D3; }

.fam-note { display: flex; gap: 8px; color: #5B6878; font-size: 13px; }

/* Personalen: meddelanden till alla plattor */
.st-templates { display: flex; flex-wrap: wrap; gap: 6px; }
.st-tpl { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--st-line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--st-ink); }
.st-tpl.sel { border-color: #1D5E86; background: #E2EEF6; color: #1D5E86; }
.st-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--st-ink2); }
.st-field textarea, .st-field select { border: 1px solid var(--st-line); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--st-ink); background: #F7F9FB; resize: none; font-weight: 400; }
.st-sent { display: flex; flex-direction: column; gap: 8px; }
.st-sent li { display: flex; gap: 10px; align-items: baseline; }
.st-sent b { width: 42px; flex: none; font-variant-numeric: tabular-nums; }
.st-sent span { display: flex; flex-direction: column; }
.st-sent small { color: var(--st-ink2); }

/* ================= Förslaget (följer läsarens tema) ================= */
.doc { max-width: 980px; margin: 0 auto; padding: 44px 32px 80px; color: var(--doc-ink); font-size: 17px; line-height: 1.6; display: flex; flex-direction: column; gap: 46px; }
.doc a { color: var(--doc-accent); }
.doc-hero { display: flex; flex-direction: column; gap: 12px; padding-bottom: 34px; border-bottom: 1px solid var(--doc-line); position: relative; }
.doc-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--doc-hi); }
.doc-hero h1 { font-family: var(--f-display); font-size: 58px; line-height: 1.02; letter-spacing: -.02em; display: flex; align-items: center; gap: 16px; }
.doc-lead { font-size: 22px; line-height: 1.5; max-width: 42ch; }
.doc-by { color: var(--doc-ink2); }
.doc-print { position: absolute; top: 0; right: 0; display: flex; gap: 8px; }
.doc-print button, .doc-print a { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--doc-line); background: transparent; color: var(--doc-ink); padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 15px; text-decoration: none; }
.doc-sec { display: flex; flex-direction: column; gap: 16px; }
.doc-sec h2 { font-family: var(--f-display); font-size: 30px; line-height: 1.2; letter-spacing: -.01em; }
.doc-sec h3 { font-size: 18px; }
.doc-sec > p { max-width: 68ch; }
.doc-sec.two { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.doc-sec.two > div { display: flex; flex-direction: column; gap: 14px; }
.doc-sum { display: flex; flex-direction: column; gap: 12px; }
.doc-sum li { padding-left: 22px; position: relative; font-size: 18px; max-width: 70ch; }
.doc-sum li::before { content: ''; position: absolute; left: 0; top: .6em; width: 10px; height: 10px; border-radius: 3px; background: var(--doc-hi); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stats div { background: var(--doc-soft); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.stats strong { font-family: var(--f-display); font-size: 40px; line-height: 1.05; color: var(--doc-accent); font-variant-numeric: tabular-nums; }
.stats p { font-size: 16px; line-height: 1.4; }
.stats small { color: var(--doc-ink2); font-size: 13px; line-height: 1.35; margin-top: auto; }
.princ { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.princ div { border: 1px solid var(--doc-line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.princ .ic { color: var(--doc-hi); }
.princ p { font-size: 15px; line-height: 1.5; color: var(--doc-ink2); }
.dayline { display: flex; flex-direction: column; border-left: 3px solid var(--doc-line); margin-left: 8px; }
.dayline li { display: flex; gap: 18px; padding: 8px 0 8px 20px; position: relative; }
.dayline li::before { content: ''; position: absolute; left: -9px; top: 15px; width: 15px; height: 15px; border-radius: 50%; background: var(--doc-bg); border: 3px solid var(--doc-hi); }
.dayline b { width: 52px; flex: none; font-variant-numeric: tabular-nums; }
.doc-note { color: var(--doc-ink2); font-size: 15px; }
.doc-list { display: flex; flex-direction: column; gap: 10px; }
.doc-list li { padding-left: 18px; position: relative; }
.doc-list li::before { content: ''; position: absolute; left: 0; top: .65em; width: 7px; height: 7px; border-radius: 50%; background: var(--doc-accent); }
.feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; }
.feat div { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--doc-line); }
.feat .ic { color: var(--doc-accent); margin-top: 3px; }
.feat span { display: flex; flex-direction: column; font-size: 15px; line-height: 1.45; color: var(--doc-ink2); }
.feat strong { color: var(--doc-ink); font-size: 16px; }
.prices { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 14px; }
.price { border: 1px solid var(--doc-line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.price.main { border: 2px solid var(--doc-hi); background: var(--doc-soft); }
.price h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: var(--doc-ink2); }
.price strong { font-family: var(--f-display); font-size: 38px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.price small { color: var(--doc-ink2); }
.price p { font-size: 15px; line-height: 1.5; margin-top: 8px; }
.parts { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
.part { display: grid; grid-template-columns: 290px 1fr 80px; gap: 12px; align-items: center; font-size: 15px; }
.part i { display: block; height: 12px; border-radius: 999px; background: var(--doc-accent); opacity: .75; }
.part b { text-align: right; font-variant-numeric: tabular-nums; }
.calc { border: 1px solid var(--doc-line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: var(--doc-soft); }
.calc h3 { font-family: var(--f-display); font-size: 22px; }
.calc-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; }
.calc-in { display: flex; flex-direction: column; gap: 6px; }
.calc-in label { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; }
.calc-in label b { font-variant-numeric: tabular-nums; color: var(--doc-accent); }
.calc-in input[type=range] { width: 100%; accent-color: var(--doc-accent); margin-bottom: 10px; }
.calc-months { display: flex; gap: 6px; }
.calc-months button { flex: 1; border: 1px solid var(--doc-line); background: var(--doc-bg); color: var(--doc-ink); border-radius: 10px; padding: 9px 4px; font-weight: 700; }
.calc-months button.on { background: var(--doc-accent); border-color: var(--doc-accent); color: var(--doc-bg); }
.calc-out { display: flex; flex-direction: column; gap: 10px; }
.calc-out div { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--doc-line); padding-bottom: 8px; }
.calc-out small { color: var(--doc-ink2); font-size: 14px; }
.calc-out strong { font-size: 26px; font-variant-numeric: tabular-nums; }
.calc-lou { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 15px; }
.calc-lou.ok { color: #2E8B57; }
.calc-lou.warn { color: var(--doc-hi); }
.calc-cmp { font-size: 15px; color: var(--doc-ink2); }
.pilot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; margin: 0; }
.pilot div { border-top: 1px solid var(--doc-line); padding-top: 10px; }
.pilot dt { font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--doc-hi); }
.pilot dd { margin: 4px 0 0; }
.timeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.timeline li { border-top: 4px solid var(--doc-accent); padding-top: 10px; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; }
.timeline b { font-size: 14px; color: var(--doc-accent); }
.doc-steps { list-style: decimal; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.doc-small { font-size: 15px; color: var(--doc-ink2); }
.doc-small h2 { font-size: 22px; color: var(--doc-ink); }
.doc-copy { margin-top: 12px; font-size: 13px; color: var(--doc-ink2); }
.one-f small { display: block; font-weight: 400; font-size: 8.5pt; color: var(--doc-ink2); margin-top: 1.5mm; }
.sources { list-style: decimal; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

@media screen and (max-width: 820px) {
  .doc { padding: 28px 16px 60px; gap: 34px; }
  .doc-hero h1 { font-size: 40px; }
  .doc-print { position: static; align-self: flex-start; }
  .stats, .princ, .feat, .prices, .doc-sec.two, .calc-grid, .pilot, .timeline { grid-template-columns: 1fr; }
  .part { grid-template-columns: 1fr 70px; }
  .part i { grid-column: 1 / -1; grid-row: 2; }
}
@media print {
  body, .shell, .doc-stage { background: #fff !important; color: #000 !important; }
  .sbar, .guide, .stage-note, .demo-fab, .doc-print, .start-scrim { display: none !important; }
  .shell-body, .doc-stage { overflow: visible !important; display: block !important; }
  .doc { --doc-ink: #000; --doc-ink2: #333; --doc-soft: #F2F4F6; --doc-line: #CCC; --doc-bg: #fff; padding: 0; max-width: none; font-size: 12.5px; gap: 26px; }
  .doc-hero h1 { font-size: 38px; }
  .doc-lead { font-size: 16px; max-width: none; }
  .doc-sec h2 { font-size: 21px; }
  .doc-sum li { font-size: 13px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stats strong { font-size: 26px; }
  .stats p { font-size: 12px; }
  .princ, .feat { grid-template-columns: repeat(3, 1fr); }
  .princ p, .feat span, .price p, .timeline li { font-size: 11.5px; }
  .prices { grid-template-columns: 1.2fr 1fr 1fr; }
  .price strong { font-size: 24px; }
  .doc-sec.two, .pilot { grid-template-columns: 1fr 1fr; }
  .timeline { grid-template-columns: repeat(5, 1fr); }
  .part { grid-template-columns: 240px 1fr 70px; }
  .calc-in, .calc h3 { display: none; }
  .calc-grid { grid-template-columns: 1fr; }
  .stats div, .princ div, .price, .calc, .dayline li, .pilot div, .feat div { break-inside: avoid; }
  .doc-sec > h2 { break-after: avoid; }
}

/* Det som redan finns */
.built { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.built a { display: flex; gap: 12px; align-items: center; border: 1px solid var(--doc-line); border-radius: 14px; padding: 10px 12px; text-decoration: none; color: var(--doc-ink); }
.built a:hover { border-color: var(--doc-accent); }
.built img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
.built span { display: flex; flex-direction: column; }
.built small { color: var(--doc-ink2); font-size: 14px; line-height: 1.4; }
@media screen and (max-width: 820px) { .built { grid-template-columns: 1fr; } }
@media print { .built img { width: 36px; height: 36px; } .built small { font-size: 11px; } .built a { break-inside: avoid; } }
/* Vanliga frågor, risker och andra kommuner */
.faq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; margin: 0; }
.faq div { border-top: 1px solid var(--doc-line); padding-top: 10px; }
.faq dt { font-weight: 800; }
.faq dd { margin: 4px 0 0; color: var(--doc-ink2); font-size: 16px; }
.risks { width: 100%; border-collapse: collapse; font-size: 16px; }
.risks th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--doc-ink2); padding: 6px 10px; border-bottom: 2px solid var(--doc-line); }
.risks td { padding: 10px; border-bottom: 1px solid var(--doc-line); vertical-align: top; }
.risks td:first-child { font-weight: 700; width: 34%; }
.others { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.others div { background: var(--doc-soft); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.others h3 { font-size: 17px; }
.others p { font-size: 15px; line-height: 1.5; color: var(--doc-ink2); }
@media screen and (max-width: 820px) { .faq, .others { grid-template-columns: 1fr; } .risks td:first-child { width: auto; } }
@media print { .faq { grid-template-columns: 1fr 1fr; } .others { grid-template-columns: repeat(3, 1fr); } .faq dd, .risks, .others p { font-size: 11.5px; } .faq div, .risks tr, .others div { break-inside: avoid; } }

/* ================= Förslaget på en sida ================= */
.one-stage { position: absolute; inset: 0; overflow-y: auto; background: #E9ECEF; padding: 24px 16px; box-sizing: border-box; }
.one { --doc-ink: #17212F; --doc-ink2: #4E5B6B; --doc-line: #DDE3E8; --doc-soft: #EEF3F6; --doc-accent: #1D5E86; --doc-hi: #B77A00;
  width: 210mm; max-width: 100%; min-height: 297mm; margin: 0 auto; box-sizing: border-box; padding: 12mm 13mm 9mm; background: #fff; color: var(--doc-ink);
  font-family: var(--f-ui); font-size: 10.4pt; line-height: 1.4; display: flex; flex-direction: column; gap: 5mm; box-shadow: 0 10px 40px rgba(0, 0, 0, .15); }
.one h1 { font-family: var(--f-display); font-size: 24pt; display: flex; align-items: center; gap: 10px; line-height: 1.05; }
.one h2 { font-family: var(--f-display); font-size: 12.5pt; margin-bottom: 1.5mm; color: var(--doc-accent); }
.one-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid var(--doc-line); padding-bottom: 4mm; }
.one-lead { font-size: 12pt; margin-top: 1.5mm; }
.one-by { text-align: right; color: var(--doc-ink2); font-size: 9.5pt; }
.one-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
.one-stats div { background: var(--doc-soft); border-radius: 10px; padding: 3mm 4mm; display: flex; flex-direction: column; gap: 1mm; }
.one-stats strong { font-family: var(--f-display); font-size: 18pt; color: var(--doc-accent); line-height: 1.1; }
.one-stats span { font-size: 9pt; color: var(--doc-ink2); line-height: 1.35; }
.one-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; }
.one ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1.2mm; }
.one ul li { padding-left: 12px; position: relative; }
.one ul li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--doc-accent); }
.one p + p { margin-top: 1.5mm; }
.one section > p + ul { margin-top: 1.5mm; }
.one-day { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1.2mm; }
.one-day li { display: flex; gap: 8px; font-size: 9.6pt; }
.one-day b { width: 40px; flex: none; font-variant-numeric: tabular-nums; }
.one-price strong { font-family: var(--f-display); font-size: 17pt; color: var(--doc-hi); }
.one-trust { font-size: 9.2pt; color: var(--doc-ink2); border-top: 1px solid var(--doc-line); padding-top: 2mm; }
.one-f { margin-top: auto; border-top: 2px solid var(--doc-line); padding-top: 3mm; font-weight: 700; }
@media print {
  @page { size: A4; margin: 0; }
  .one-stage { position: static; padding: 0; background: #fff; overflow: visible; }
  .one { box-shadow: none; width: 210mm; min-height: 0; height: 296mm; }
  .demo-fab { display: none !important; }
}
@media screen and (max-width: 820px) { .one { padding: 20px 16px; min-height: 0; } .one-cols, .one-stats { grid-template-columns: 1fr; } .one-h { flex-direction: column; align-items: flex-start; } .one-by { text-align: left; } }
</style>
