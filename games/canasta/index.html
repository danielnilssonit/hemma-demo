    if (!P.wantSlot() || !sel.size) return false;
    return !tryStage(stage.concat([{ids: [...sel]}]), true).err;
  };
  P.meldHot = r => {
    if (!P.wantSlot() || !sel.size) return false;
    const ids = [...sel];
    const g = ids.every(Cards.wild) ? {ids, r} : {ids};
    if (!ids.every(Cards.wild) && Cards.rank(ids.find(id => !Cards.wild(id))) !== r) return false;
    return !tryStage(stage.concat([g]), true).err;
  };
  // Prövar förberedda mälningar mot reglerna (utan att slänga): {err, pts, melds}
  function tryStage(groups, quiet) {
    try {
      const r = Rules.groups(hand(), V.melds[team()], groups, {black3ok: true});
      return {err: '', pts: r.pts, melds: r.melds, rest: r.rest};
    } catch (e) { if (!(e instanceof Rules.RuleError)) console.error(e); return {err: e.message}; }
  }

  /* ---------- Tryck ---------- */
  P.onTap = t => {
    if (!V || !active) return;
    Sound.unlock();
    if (note) { note = ''; }
    switch (t.kind) {
      case 'hand': return tapCard(t.id);
      case 'stock': return tapStock();
      case 'pile': return tapPile();
      case 'meld': return tapMeld(t.team, t.r);
      case 'meldarea': if (t.team === team() && sel.size && P.wantSlot()) return addNew(); return;
      case 'newmeld': return addNew();
      case 'seat': return Bus.emit('seat-info', t.seat);
      case 'history': return Table.showHistory();
      case 'red3': return UI.toast('Röda treor är bonuskort: 100 poäng var (800 för alla fyra), minus om laget inte har lagt ut.', {ms: 3600});
    }
  };
  function tapCard(id) {
    const now = performance.now();
    const dbl = Settings.dbl !== false && lastTap.id === id && now - lastTap.t < 330;
    lastTap = {id, t: now};
    if (dbl) {
      // dubbeltryck: alla naturliga kort av samma valör (eller alla vilda)
      const same = restHand().filter(x => Cards.wild(id) ? Cards.wild(x) : !Cards.wild(x) && Cards.rank(x) === Cards.rank(id));
      const all = same.every(x => sel.has(x));
      same.forEach(x => all ? sel.delete(x) : sel.add(x));
      if (!all) sel.add(id);
    } else if (sel.has(id)) sel.delete(id); else sel.add(id);
    Sound.play('tick');
    Table.setSel([...sel]);
    Table.refresh(120);
    P.renderBar();
  }
  function tapStock() {
    if (!myTurn()) return notYet();
    if (V.phase !== 'draw') return UI.toast('Du har redan dragit. Lägg ut eller släng ett kort.');
    doDraw();
  }
  function tapPile() {
    if (!myTurn()) return notYet();
    if (V.phase === 'draw') return doTake();
    if (V.phase === 'play') {
      if (sel.size === 1) return doDiscard([...sel][0]);
      return UI.toast(sel.size ? 'Välj bara ett kort att slänga.' : 'Välj det kort du vill slänga och tryck på högen.');
    }
  }
  function tapMeld(tm, r) {
    if (tm !== team() || !P.wantSlot() || !sel.size) {
      const m = (V.melds[tm] || []).find(x => x.r === r);
      if (m) meldInfo(tm, m);
      return;
    }
    const ids = [...sel];
    const nat = ids.filter(id => !Cards.wild(id));
    if (nat.some(id => Cards.rank(id) !== r)) { Table.shake(ids); return UI.toast(`Hit kan bara ${Cards.rankName(r, 2)} och vilda kort läggas.`); }
    addGroup(nat.length ? {ids} : {ids, r});
  }
  function addNew() {
    if (!P.wantSlot()) return;
    if (!sel.size) return UI.toast('Välj korten till den nya mälningen först.');
    addGroup({ids: [...sel]});
  }
  function addGroup(g) {
    const next = stage.concat([g]);
    const r = tryStage(next);
    if (r.err) { Table.shake(g.ids); Sound.play('nope'); return UI.toast(r.err); }
    stage = next;
    sel.clear();
    Sound.play('place');
    Table.setSel([]);
    Table.setStage(stage);
    P.renderBar();
  }
  function notYet() {
    if (V.phase === 'ask' && V.ask && V.ask.seat === me) return UI.toast('Väntar på svar från din partner.');
    if (V.phase === 'end' || V.phase === 'over') return;
    UI.toast('Det är inte din tur än.');
  }
  function meldInfo(tm, m) {
    const inf = Rules.info(m.c);
    const left = Math.max(0, 7 - m.c.length);
    const who = tm === team() ? 'Er' : 'Deras';
    let t = `${who} mälning: ${Cards.num(m.c.length)} ${Cards.rankName(m.r, 2)}` + (inf.wild ? `, varav ${inf.wild === 1 ? 'ett vilt' : Cards.num(inf.wild) + ' vilda'}` : '') + '. ';
    t += inf.canasta ? (inf.natural ? 'Ren canasta (500).' : 'Blandad canasta (300).') : `${left === 1 ? 'Ett kort' : Cards.num(left, true) + ' kort'} till för canasta.`;
    UI.toast(t, {ms: 3200});
  }

  /* ---------- Dragen ---------- */
  function go(a, {quiet = false} = {}) {
    if (busy) return false;
    const err = Rules.check(V, me, a);
    if (err) { Sound.play('nope'); UI.toast(err, {ms: 3600}); return false; }
    busy = true;
    const res = send(a);
    if (res) { busy = false; UI.toast(res); return false; }
    P.renderBar();
    return true;
  }
  function doDraw() {
    if (Rules.mustTake(V, me)) return UI.toast('Talongen är slut och översta kortet passar er mälning, så du måste ta högen.', {ms: 3600});
    if (Rules.stockCount(V) === 0) {
      return UI.confirm('Talongen är slut. Om du inte tar högen tar given slut. Avsluta given?', {yes: 'Avsluta given', no: 'Avbryt'}).then(ok => { if (ok) go({t: 'draw'}); });
    }
    go({t: 'draw'});
  }
  function doTake() {
    const ps = Rules.pileState(V, me);
    if (!ps.can) { Sound.play('nope'); return UI.toast(ps.why, {ms: 3200}); }
    const picked = [...sel];
    const way = Plan.takeWith(V, me, picked);
    if (!way) {
      Sound.play('nope');
      return UI.toast(takeWhyNot(ps), {ms: 4200});
    }
    // enkelt sätt (eller kort som spelaren själv har valt): ta direkt. Annars visa förslaget först
    // (och alltid med "Visa alltid förslaget", eftersom det inte går att ångra att man tar högen).
    const simple = !Settings.takeAsk && !way.melds.length && (picked.length || way.ids.length <= 2);
    if (simple) { sel.clear(); Table.setSel([]); return go(way); }
    confirmTake(way);
  }
  function takeWhyNot(ps) {
    const r = ps.r, mine = hand().filter(id => !Cards.wild(id) && Cards.rank(id) === r).length;
    const opened = Rules.opened(V, team());
    if (!opened) {
      if (mine < 2) return `Högen är frusen tills ${V.opts.players === 4 ? 'ni' : 'du'} har lagt ut. Du behöver två naturliga ${Cards.rankName(r, 2)} på handen.`;
      return `Du har två ${Cards.rankName(r, 2)}, men första utlägget måste vara värt ${Rules.minFor(V, team())} poäng. Översta kortet och korten från handen räcker inte.`;
    }
    if (ps.frozen) return `Högen är frusen. Du behöver två naturliga ${Cards.rankName(r, 2)} på handen för att ta den.`;
    return `Du behöver två ${Cards.rankName(r, 2)}, eller en ${Cards.rankName(r)} och ett vilt kort, för att ta högen.`;
  }
  function confirmTake(way) {
    const top = Rules.top(V);
    const box = h('div', {class: 'takeplan'});
    const cards = ids => h('span', {class: 'tp-cards'}, ...ids.map(id => miniCard(id)));
    const topCard = h('span', {class: 'tp-top'}, miniCard(top), h('small', {}, 'överst'));
    box.append(h('p', {class: 'tp-h'}, 'Du lägger ut:'));
    const first = h('div', {class: 'tp-row'}, h('span', {class: 'tp-cards'}, topCard, ...way.ids.map(id => miniCard(id))));
    box.append(first);
    if (way.ids.length) box.append(h('p', {class: 'tp-note'}, `Översta kortet i högen och ${Cards.num(way.ids.length, true)} kort från handen.`));
    way.melds.forEach(g => box.append(h('div', {class: 'tp-row'}, h('span', {class: 'tp-l'}, 'Från handen:'), cards(g.ids))));
    const pts = Cards.value(top) + Cards.sum(way.ids) + way.melds.reduce((s, g) => s + Cards.sum(g.ids), 0);
    if (!Rules.opened(V, team())) box.append(h('p', {class: 'tp-sum'}, `${V.opts.players === 4 ? 'Ert' : 'Ditt'} första utlägg: ${pts} poäng (minst ${Rules.minFor(V, team())}).`));
    const rest = V.pile.length - 1;
    box.append(h('p', {class: 'tp-sum'}, rest ? `Sedan tar du resten av högen (${Cards.num(rest, true)} kort).` : 'Högen har inga fler kort.'));
    UI.sheet({title: 'Ta högen', cls: 'small', clear: true, body: box, buttons: [{label: 'Avbryt', cls: 'ghost'}, {label: 'Ta högen', cls: 'gold', icon: 'hand', onClick: () => { sel.clear(); Table.setSel([]); go(way); }}]});
  }
  function miniCard(id) {
    const el = h('span', {class: 'mcard'});
    el.innerHTML = typeof Art !== 'undefined' && Art.face ? Art.face(id) : Cards.label(id);
    return el;
  }
  P.miniCard = miniCard;
  function doDiscard(id) {
    const a = {t: 'play', melds: stage.map(g => Object.assign({}, g)), d: id};
    const err = Rules.check(V, me, a);
    if (err) { Sound.play('nope'); Table.shake(id); return UI.toast(err, {ms: 3800}); }
    const left = restHand().length - 1;
    const out = left === 0;
    const warn = !out && Settings.hints && discardWarning(id);
    const fire = () => { sel.clear(); Table.setSel([]); go(a); };
    if (out && Settings.confirmOut) return UI.confirm('Gå ut nu? Given tar slut och poängen räknas.', {yes: 'Gå ut', title: 'Gå ut', clear: true}).then(ok => ok && fire());
    if (warn) return UI.confirm(warn, {yes: 'Släng ändå', no: 'Välj ett annat', title: 'Är du säker?', clear: true}).then(ok => ok && fire());
    // går slänget inte att ångra (online, eller ångra är avstängt): fråga först om man vill det
    const s = Game.session();
    const undoable = s && !(s.online && s.online()) && Settings.undo !== false;
    if (!out && !undoable && Settings.confirmDiscard) return UI.confirm(`Släng ${Cards.cardName(id)}${id < 104 ? ' ' + Cards.SUITS[Cards.suit(id)] : ''}?`, {yes: 'Släng', no: 'Vänta', title: 'Släng kortet', clear: true}).then(ok => ok && fire());
    fire();
  }
  // Varning om slänget ger nästa spelare högen (bara som hjälp)
  function discardWarning(id) {
    if (Cards.wild(id)) return V.pile.length >= 3 ? `Ett vilt kort fryser högen (${Cards.num(V.pile.length + 1, true)} kort): då kan den bara tas med två naturliga kort.` : '';
    if (Cards.black3(id)) return '';
    const next = (me + 1) % V.opts.players, nt = V.team[next];
    const r = Cards.rank(id);
    const frozen = V.frozen || V.opts.frozen || !Rules.opened(V, nt);
    if (!frozen && V.melds[nt].some(m => m.r === r) && V.pile.length >= 3) return `${V.seats[next].name} har en mälning med ${Cards.rankName(r, 2)} och kan ta högen (${Cards.num(V.pile.length + 1, true)} kort) med det här kortet.`;
    return '';
  }
  function doOut() {
    // lägger det bästa sättet att gå ut som förberedda mälningar och frågar
    const plan = Plan.out(V, me);
    if (!plan) return UI.toast(Rules.canastas(V, team()) >= V.opts.need ? 'Du kan inte lägga ut alla kort just nu.' : Rules.needMsg(V));
    stage = plan.melds.map(g => Object.assign({}, g));
    sel.clear();
    Table.setSel([]);
    Table.setStage(stage);
    P.renderBar();
    const a = {t: 'play', melds: stage, d: plan.d};
    const text = plan.d == null ? 'Alla dina kort läggs ut.' : `Allt läggs ut och du slänger ${Cards.cardName(plan.d)}.`;
    UI.confirm(text + ' Given tar slut och poängen räknas.', {title: 'Gå ut', yes: 'Gå ut', no: 'Ångra', clear: true}).then(ok => {
      if (ok) go(a); else { stage = []; Table.setStage(stage); P.renderBar(); }
    });
  }
  function doUndo() {
    if (!stage.length) return;
    stage.pop();
    Sound.play('undo');
    Table.setStage(stage);
    P.renderBar();
  }
  function doAsk() { go({t: 'ask'}); }
  P.answer = yes => { if (V && V.phase === 'ask' && V.ask && V.ask.to === me) go({t: 'answer', yes}); };
  function doHint() {
    const a = AI.suggest(V, me);
    if (!a) return;
    Sound.play('hint');
    const L = ids => ids.map(Cards.label).join(' ');
    let t = '';
    if (a.t === 'draw') t = Rules.stockCount(V) ? 'Tips: dra ett kort från talongen.' : 'Tips: avsluta given.';
    else if (a.t === 'take') t = `Tips: ta högen${a.ids.length ? ' med ' + L(a.ids) : ''}${a.melds.length ? ' och lägg ut ' + a.melds.map(g => L(g.ids)).join(', ') : ''}.`;
    else if (a.t === 'ask') t = 'Tips: fråga din partner om du får gå ut.';
    else if (a.t === 'play') {
      const out = restHand().length === a.melds.reduce((n, g) => n + g.ids.length, 0) + (a.d != null ? 1 : 0);
      t = 'Tips: ' + (a.melds.length ? 'lägg ut ' + a.melds.map(g => L(g.ids)).join(', ') + (a.d != null ? ' och ' : '') : '') + (a.d != null ? 'släng ' + Cards.label(a.d) : '') + (out && Plan.out(V, me) ? ' (då går du ut)' : '') + '.';
      if (stage.length) t += ' (Ångra dina förberedda mälningar först.)';
      // markera korten
      if (!stage.length) { sel = new Set(a.melds.length ? a.melds[0].ids : a.d != null ? [a.d] : []); Table.setSel([...sel]); P.renderBar(); }
    }
    UI.toast(t, {ms: 5200, kind: 'hint'});
  }

  /* ---------- Knappraden ---------- */
  P.renderBar = () => {
    if (!barEl || !V) return;
    coach();
    barEl.textContent = '';
    const status = h('div', {class: 'status'});
    const btns = h('div', {class: 'btns'});
    // liggande telefon: vad som just hände står överst i kolumnen (bredvid talongen finns ingen plats)
    const geo = Table.geo(), last = Table.lastMove();
    if (geo && geo.side && last && V.phase !== 'end' && V.phase !== 'over') barEl.append(h('div', {class: 'lastline', title: 'Visa de senaste dragen', onclick: () => { Sound.play('click'); Table.showHistory(); }}, last));
    barEl.append(status, btns);
    const B = (label, icon, fn, cls = '', dis = false) => { const b = UI.btn(label, fn, {icon, cls: 'bbtn ' + cls, disabled: dis}); btns.append(b); return b; };
    const say = (a, b = '') => { status.append(h('b', {}, a)); if (note) status.append(h('span', {class: 'note'}, note)); else if (b) status.append(h('span', {}, b)); };
    // ångra slänget (mot datorn): knappen har en list som krymper tills tiden är ute
    clearTimeout(undoT);
    const undoBtn = () => {
      const s = Game.session();
      if (!(s && s.canUndo && s.canUndo())) return;
      const b = B('Ångra slänget', 'undo', () => { Sound.play('undo'); s.undo(); }, 'ghost undo');
      const u = s.undoLeft ? s.undoLeft() : null;
      if (u && u.total) {
        b.append(h('i', {class: 'timer', style: {'--from': (u.left / u.total).toFixed(3), animationDuration: Math.round(u.left) + 'ms'}}));
        undoT = setTimeout(() => P.renderBar(), u.left + 80);
      }
    };
    if (!active) { say('Du tittar på'); return; }
    if (V.phase === 'end' || V.phase === 'over') {
      say(V.phase === 'over' ? 'Partiet är slut' : 'Given är slut');
      // om poängrutan har stängts (t.ex. med Esc) finns vägen vidare här
      if (!Game.endOpen()) {
        B('Poängen', 'chart', () => Game.showScores(), 'ghost');
        const s = Game.session();
        if (V.phase === 'end' && s && s.canNext && s.canNext()) B('Nästa giv', 'play', () => s.next(), 'gold');
      }
      return;
    }
    if (V.phase === 'ask') {
      if (V.ask.seat === me) say('Väntar på svar …', `${V.seats[V.ask.to].name} funderar`);
      else if (V.ask.to === me) { say(`${V.seats[V.ask.seat].name} frågar`, 'Får jag gå ut?'); B('Ja', 'check', () => P.answer(true), 'gold'); B('Nej', 'close', () => P.answer(false)); }
      else { say(`${V.seats[V.ask.seat].name} frågar sin partner`, 'om att gå ut'); undoBtn(); }
      return;
    }
    if (V.turn !== me) {
      const who = V.seats[V.turn];
      say(`${genitive(who.name)} tur`, V.phase === 'draw' ? 'drar …' : 'spelar …');
      undoBtn();
      if (sel.size) B('Avmarkera', 'close', () => { sel.clear(); Table.setSel([]); P.renderBar(); }, 'ghost');
      return;
    }
    if (busy) { say('…'); return; }
    if (V.phase === 'draw') {
      const way = Plan.takeWith(V, me, [...sel]);
      const must = Rules.mustTake(V, me);
      if (Rules.stockCount(V) === 0) say('Talongen är slut', must ? 'Du måste ta högen' : 'Ta högen eller avsluta given');
      else say('Din tur', way ? 'Dra ett kort eller ta högen' : 'Dra ett kort');
      if (!must) B(Rules.stockCount(V) ? 'Dra' : 'Avsluta', 'cards', doDraw, way ? '' : 'gold');
      B('Ta högen', 'hand', doTake, way ? 'gold' + (Settings.hints ? ' glow' : '') : 'ghost', !Rules.pileState(V, me).can);
      if (Settings.hints) Table.highlight('pile', !!way); else Table.highlight('pile', false);
      Table.highlight('stock', !must && Rules.stockCount(V) > 0);
      return;
    }
    Table.highlight('pile', false); Table.highlight('stock', false);
    // spela: lägg ut och släng
    const opened = Rules.opened(V, team());
    const st = stage.length ? tryStage(stage) : {pts: 0};
    const rest = restHand();
    const asked = V.ask && V.ask.seat === me ? V.ask.ans : null;
    if (!opened && stage.length) {
      const min = Rules.minFor(V, team());
      say(`Utlägg ${st.pts} / ${min}`, st.pts >= min ? 'Räcker! Släng ett kort för att lägga ut' : `${min - st.pts} poäng till`);
    } else if (asked === true) say('Partnern sa ja', 'Nu måste du gå ut');
    else if (asked === false) say('Partnern sa nej', 'Du får inte gå ut nu');
    else if (sel.size === 1) { if (fitsMeld()) say('Ett kort valt', 'Lägg det på en mälning eller släng det'); else say('Släng kortet', 'Tryck på högen eller Släng'); }
    else if (sel.size > 1) say(`${cap(Cards.num(sel.size))} kort valda`, P.slotHot() || fitsMeld() ? 'Tryck på en mälning eller +' : 'De passar inte ihop');
    else say('Lägg ut och släng', rest.length ? 'Välj kort på handen' : 'Gå ut');
    if (stage.length) B('Ångra', 'undo', doUndo, 'ghost');
    if (!rest.length) B('Gå ut', 'door', () => {
      const a = {t: 'play', melds: stage.map(g => Object.assign({}, g)), d: null};
      if (!Settings.confirmOut) return go(a);
      UI.confirm('Gå ut nu? Given tar slut och poängen räknas.', {title: 'Gå ut', yes: 'Gå ut', clear: true}).then(ok => ok && go(a));
    }, 'gold');
    const canOut = asked !== false && Plan.out(V, me);
    // "Alla sjuor": välj resten av korten av samma valör (i stället för att behöva dubbeltrycka)
    const same = sameRank();
    if (same) B(`Alla ${Cards.rankName(same.r, 2)} (${same.n})`, 'cards', () => { same.ids.forEach(id => sel.add(id)); Sound.play('tick'); Table.setSel([...sel]); P.renderBar(); }, 'ghost');
    if (sel.size >= 2 && P.slotHot()) B('Lägg ut', 'plus', addNew, 'gold');
    if (sel.size === 1) B('Släng', 'discard', () => doDiscard([...sel][0]), 'gold');
    if (canOut && rest.length && !stage.length && sel.size === 0) {
      if (V.opts.ask && asked == null && !Rules.check(V, me, {t: 'ask'})) B('Får jag gå ut?', 'help', doAsk, 'ghost');
      B('Gå ut', 'door', doOut, asked === true ? 'gold glow' : '');
    }
    if (Settings.hints && !sel.size && !stage.length) B('Tips', 'bulb', doHint, 'ghost');
  };
  // Är alla valda kort naturliga av samma valör, och finns det fler av den på handen? → {r, n, ids}
  function sameRank() {
    if (!sel.size || !V || V.phase !== 'play') return null;
    const ids = [...sel];
    if (ids.some(Cards.wild)) return null;
    const r = Cards.rank(ids[0]);
    if (ids.some(id => Cards.rank(id) !== r)) return null;
    const all = restHand().filter(id => !Cards.wild(id) && Cards.rank(id) === r);
    const more = all.filter(id => !sel.has(id));
    return more.length ? {r, n: all.length, ids: more} : null;
  }
  return P;
})();

/* ---- 08b-coach.js ---- */
/* ================= Coachen: korta förklaringar första gången ================= */
// Canasta med kort på en skärm fungerar lite annorlunda än med riktiga kort. Första gångerna visas en liten
// pratbubbla som förklarar vad man trycker på. Varje förklaring visas en gång (sparas på enheten) och bara
// när "Hjälp och tips" är på. Bubblan är liten och blockerar inte spelet.
const Coach = (() => {
  const C = {};
  const seen = Object.assign({}, Store.get('coach', {}));
  let bubble = null, bubbleKey = '';
  const TIPS = {
    draw: {anchor: 'stock', text: 'Din tur! Tryck på talongen för att dra ett kort. Vill du ta högen trycker du på den i stället.'},
    select: {anchor: 'hand', text: 'Tryck på korten du vill lägga ut, så lyfts de upp. Tryck sedan på + för en ny mälning, eller på en av era mälningar.'},
    staged: {anchor: 'bar', text: 'Korten med guldkant är förberedda. Du kan ångra tills du slänger. När du slänger ett kort läggs allt ut.'},
    discard: {anchor: 'pile', text: 'Tryck på högen för att slänga det valda kortet. Då går turen vidare.'},
    frozen: {anchor: 'pile', text: 'Högen är frusen. Då kan den bara tas med två naturliga kort av samma valör som det översta kortet.'},
    open: {anchor: 'hand', text: 'Det första utlägget i given måste vara värt minimipoängen (siffran vid ditt namn högst upp). Tryck på Tips om du vill ha ett förslag.'},
    out: {anchor: 'bar', text: 'Nu kan du gå ut! Tryck på Gå ut, så lägger spelet ut allt på bästa sätt och frågar först.'}
  };
  // Visa en förklaring om den inte har visats förut
  C.off = false;   // (för automatiska tester)
  C.tip = key => {
    if (C.off || !Settings.hints || seen[key] || !TIPS[key] || bubble) return;
    const t = TIPS[key];
    seen[key] = true;
    Store.set('coach', seen);
    show(key, t);
  };
  C.done = key => { if (bubble && bubbleKey === key) hide(); };
  C.reset = () => { Object.keys(seen).forEach(k => delete seen[k]); Store.set('coach', seen); };
  function show(key, t) {
    const root = $('scrTable');
    if (!root || root.hidden) return;
    bubble = h('div', {class: 'coach', role: 'status'}, h('p', {}, t.text), h('button', {type: 'button', class: 'btn small gold', onclick: () => { Sound.play('click'); hide(); }}, 'Jag förstår'));
    bubbleKey = key;
    root.append(bubble);
    place(t.anchor);
    requestAnimationFrame(() => bubble && bubble.classList.add('on'));
  }
  // Bubblan placeras vid det den handlar om, men aldrig över handen (eller de lyfta korten) och knapparna
  function place(anchor) {
    if (!bubble) return;
    const G = Table.geo();
    if (!G) return;
    const w = Math.min(340, G.W - 24);
    bubble.style.width = w + 'px';
    const bh = bubble.offsetHeight || 120;
    const bottom = G.side ? G.hand.y - G.ch * .18 : Math.min(G.bar.y, G.hand.y - G.ch * .18);
    let x = G.W / 2, y;
    if (anchor === 'stock' || anchor === 'pile') {
      const p = anchor === 'stock' ? Table.stockPos() : Table.pilePos();
      x = p.x; y = p.y + G.ph / 2 + 12;
      if (!G.portrait) { x = p.x + G.pw / 2 + w / 2 + 14; y = p.y - bh / 2; }
    } else y = bottom - bh - 10;
    const maxX = G.side ? G.bar.x - w / 2 - 8 : G.W - w / 2 - 12;
    x = clamp(x, w / 2 + 12, Math.max(w / 2 + 12, maxX));
    y = clamp(y, G.hudH + 10, Math.max(G.hudH + 10, bottom - bh - 8));
    Object.assign(bubble.style, {left: x + 'px', top: y + 'px'});
  }
  function hide() {
    const b = bubble;
    bubble = null; bubbleKey = '';
    if (!b) return;
    b.classList.remove('on');
    setTimeout(() => b.remove(), 250);
  }
  C.hide = hide;
  // Kallas efter varje nytt läge och varje val: vilken förklaring passar just nu?
  // fits: de valda korten passar på en av lagets mälningar
  C.check = (V, sel = 0, staged = 0, fits = false) => {
    if (!V || V.me < 0 || !Settings.hints) return;
    const me = V.me, mine = V.turn === me;
    if (bubble) {
      // stäng förklaringen när det den handlar om är gjort
      if (bubbleKey === 'draw' && (!mine || V.phase !== 'draw')) hide();
      else if (bubbleKey === 'select' && (sel || staged || !mine)) hide();
      else if (bubbleKey === 'discard' && (!mine || V.phase !== 'play' || sel !== 1)) hide();
      else if (bubbleKey === 'open' && (!mine || staged || V.phase !== 'play')) hide();
      else if (bubbleKey === 'out' && (!mine || V.phase !== 'play')) hide();
      else if (bubbleKey === 'staged' && !staged) hide();
      else if (bubbleKey === 'frozen' && !mine) hide();
      else return;
    }
    if (!mine) return;
    if (V.phase === 'draw') {
      if ((V.frozen || !Rules.opened(V, V.team[me])) && V.pile.length >= 3 && seen.draw) C.tip('frozen');
      C.tip('draw');
    } else if (V.phase === 'play') {
      if (Plan.out(V, me) && !staged) return C.tip('out');
      if (staged && !seen.staged) return C.tip('staged');
      // släng-tipset först när man har lärt sig att välja kort, och inte när kortet man valde ska läggas ut
      if (sel === 1 && seen.select && (staged || !fits)) return C.tip('discard');
      if (!Rules.opened(V, V.team[me]) && !staged && Plan.opening(Rules.handOf(V, me), Rules.minFor(V, V.team[me]))) return C.tip('open');
      if (!sel && !staged) C.tip('select');
    }
  };
  Bus.on('table-layout', () => { if (bubble) { const k = bubbleKey; place(TIPS[k] && TIPS[k].anchor); } });
  return C;
})();

/* ---- 11-net.js ---- */
/* ================= Sessioner: mot datorn, värd och gäst ================= */
// Alla sessioner har samma gränssnitt mot spelet: view() ger det spelaren får se, send(a) gör ett drag och
// 'update' (view, händelser, plats) kommer efter varje drag. Datorspelarna körs av den som har hela läget
// (mot datorn: den här enheten, online: värden). Lobbyn och borden över nätet finns längre ner.
const GAME_VER = typeof BUILD_VER !== 'undefined' ? BUILD_VER : 'dev';
const Net = (() => {
  const N = {};
  const plain = (s, n = 16) => String(s || '').replace(/[<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);
  N.plain = plain;

  class Emitter {
    constructor() { this.ls = {}; }
    on(ev, fn) { (this.ls[ev] = this.ls[ev] || []).push(fn); return this; }
    emit(ev, ...a) { (this.ls[ev] || []).forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
    off() { this.ls = {}; }
  }
  N.Emitter = Emitter;

  // Datorn gör sitt drag när det är dess tur (efter en betänketid och när bordet har visat förra draget)
  function cpuDriver(sess) {
    clearTimeout(sess.cpuT);
    const S = sess.S;
    if (!S || sess.closed) return;
    const actor = S.phase === 'ask' ? S.ask.to : (S.phase === 'draw' || S.phase === 'play') ? S.turn : -1;
    if (actor < 0 || !sess.isCpu(actor)) return;
    const base = S.phase === 'draw' ? 700 : S.phase === 'ask' ? 1300 : 1000;
    // efter att människan har slängt väntar datorn en kort stund, så att slänget hinner synas
    const hold = sess.holdUntil ? Math.max(0, sess.holdUntil - Date.now()) : 0;
    sess.cpuT = setTimeout(async () => {
      sess.cpuT = 0;
      if (sess.idle) await sess.idle();
      if (sess.closed || sess.S !== S) return;
      const seat = actor;
      const level = sess.cpuLevel(seat);
      let a = AI.act(Rules.view(S, seat), seat, level);
      try { sess.apply(seat, a); }
      catch (e) {
        console.error('Datorns drag gick inte', e, a);
        // nödutgång: dra eller släng första tillåtna kortet
        const V = Rules.view(S, seat);
        a = S.phase === 'draw' ? {t: 'draw'} : {t: 'play', melds: [], d: Rules.handOf(V, seat).find(id => !Rules.check(V, seat, {t: 'play', melds: [], d: id}))};
        try { sess.apply(seat, a); } catch (e2) { console.error(e2); }
      }
    }, hold + base * Time.pace() * (0.75 + Math.random() * .6));
  }
  N.cpuDriver = cpuDriver;

  /* ---------- Mot datorn (allt på den här enheten) ---------- */
  class LocalSession extends Emitter {
    constructor({players, seats, opts, restore, saveKey = 'solo'}) {
      super();
      this.role = 'local';
      this.saveKey = saveKey;     // null: sparas inte (partiet vid ett bord på Spelstunden)
      this.me = 0;
      if (restore) this.S = restore;
      else {
        this.S = Rules.create({players, seats, opts, id: randId(8), rng: cryptoRandom});
        Rules.start(this.S, cryptoRandom);
      }
      this.save();
    }
    online() { return false; }
    watching() { return false; }
    isCpu(seat) { return this.S.seats[seat].kind === 'cpu'; }
    cpuLevel(seat) { return this.S.seats[seat].level || 'medel'; }
    view() { return Rules.view(this.S, this.me); }
    apply(seat, a) {
      const r = Rules.apply(this.S, seat, a, cryptoRandom);
      const actor = S0 => S0.phase === 'ask' ? S0.ask.to : S0.turn;
      const was = actor(this.S);
      this.S = r.S;
      if (actor(this.S) !== was || this.S.phase === 'draw') this.turnAt = Date.now();
      this.save();
      this.emit('update', this.view(), r.ev, seat);
      cpuDriver(this);
    }
    // Ett slängt kort går att ångra en stund (8 s i "Lugnt och tydligt", annars 5 s), så länge nästa spelare är en
    // dator som inte har slängt än. Datorn väntar bara en kort stund och spelar sedan på: ångrar man tas det datorn
    // hann göra också tillbaka.
    send(a) {
      const before = this.S;
      try {
        const undoable = a.t === 'play' && Settings.undo !== false;
        if (undoable) this.holdUntil = Date.now() + 1200 * Time.pace();
        this.apply(this.me, a);
        if (undoable && this.S.phase === 'draw' && this.isCpu(this.S.turn)) {
          const ms = (Settings.calm ? 8000 : 5000) * Math.max(1, Time.scale);
          this.undoState = {S: before, turn: this.S.turn, round: this.S.round, until: Date.now() + ms, ms};
        } else { this.undoState = null; this.holdUntil = 0; }
        return '';
      } catch (e) { this.holdUntil = 0; if (e instanceof Rules.RuleError) return e.message; throw e; }
    }
    canUndo() {
      const u = this.undoState, S = this.S;
      return !!(u && Date.now() < u.until && S.round === u.round && S.turn === u.turn && (S.phase === 'draw' || S.phase === 'play' || S.phase === 'ask'));
    }
    undoLeft() { const u = this.undoState; return u ? {left: Math.max(0, u.until - Date.now()), total: u.ms} : null; }
    undo() {
      if (!this.canUndo()) return false;
      clearTimeout(this.cpuT); this.cpuT = 0;
      this.S = this.undoState.S;
      this.undoState = null; this.holdUntil = 0;
      this.turnAt = Date.now();
      this.save();
      this.emit('update', this.view(), [{t: 'undo'}], this.me);
      return true;
    }
    kick() { cpuDriver(this); }
    canNext() { return true; }
    next() { if (this.S.phase === 'end') { try { this.apply(-1, {t: 'next'}); } catch (e) { console.error(e); } } }
    rematch() {
      const S = this.S;
      this.S = Rules.create({players: S.opts.players, seats: S.seats, opts: S.opts, id: randId(8), rng: cryptoRandom});
      Rules.start(this.S, cryptoRandom);
      this.save();
      this.emit('update', this.view(), this.S.last.ev, -1);
      cpuDriver(this);
    }
    save() {
      if (!this.saveKey) return;
      if (this.S.phase === 'over') Store.del(this.saveKey);
      else Store.set(this.saveKey, {S: this.S, t: Date.now()});
    }
    leave() { this.closed = true; clearTimeout(this.cpuT); }
  }
  N.LocalSession = LocalSession;
  N.savedSolo = () => { const s = Store.get('solo', null); return s && s.S && s.S.phase !== 'over' && Date.now() - s.t < 30 * 24 * 3600e3 ? s : null; };

  /* =================== Över nätet =================== */
  // Spelarna hittar varandra via öppna MQTT-servrar (se 09-mqtt.js). Den som skapar bordet är värd: värden har hela
  // läget (talongen och allas kort), gör blandningen, kontrollerar dragen och låter datorn spela på datorplatserna.
  // Efter varje drag skickar värden det alla får se och varje spelares egen hand krypterad med spelarens nyckel.
  const PRE = 'canastaklubben/v1/', T_LOBBY = PRE + 'lobby';
  // ämnet för ett bord är en kontrollsumma av koden, så att koderna inte syns för den som lyssnar på servrarna
  const tRoom = code => PRE + 'r/' + N.devHash('bord:' + code, 99);
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  N.topic = code => tRoom(N.cleanCode(code));   // (för tester)
  N.newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => ALPHA[b % ALPHA.length]).join('');
  N.cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  // Enhetens id skickas bara krypterat till värden. Ut till alla går en kontrollsumma (cyrb53) som den egna
  // telefonen känner igen sig själv på.
  N.devHash = (str, seed = 7) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  };
  const myHash = () => N.devHash(Profile.dev);
  const hostHash = () => N.devHash(Profile.dev, 11);
  const cleanAv = a => UI.cleanAv(a);
  N.ruleText = (players, r = {}) => {
    const parts = [players === 4 ? 'Två mot två' : players === 3 ? 'Tre, alla mot alla' : 'Två spelare'];
    parts.push(r.target ? 'till ' + fmt(r.target) : 'en giv');
    if (r.need) parts.push(r.need === 1 ? 'en canasta för att gå ut' : 'två canastor för att gå ut');
    if (r.frozen) parts.push('högen alltid frusen');
    if (players === 4 && r.ask === false) parts.push('utan partnerfråga');
    return parts.join(' · ');
  };

  /* ---------- Lobbyn ---------- */
  const members = new Map();
  let inLobby = false, hiTimer = 0, sweepTimer = 0, unsubLobby = null, status = {st: 'menu', tb: null};
  const lobbyListeners = new Set();
  N.onLobby = fn => { lobbyListeners.add(fn); return () => lobbyListeners.delete(fn); };
  let lobbyT = 0;
  const lobbyChanged = () => { clearTimeout(lobbyT); lobbyT = setTimeout(() => lobbyListeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 120); };
  const me = () => ({name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), st: status.st, tb: status.tb, ver: GAME_VER});
  function hi() { if (inLobby && Settings.visible !== false) Mqtt.pub(T_LOBBY, Object.assign({t: 'hi'}, me())); }
  function onLobby(msg) {
    if (msg.t === 'hi') {
      const known = members.has(msg.f);
      const tb = msg.tb && typeof msg.tb === 'object' ? {code: N.cleanCode(msg.tb.code), n: +msg.tb.n || 1, max: clamp(+msg.tb.max || 2, 2, 4), st: msg.tb.st === 'play' ? 'play' : 'wait', pub: !!msg.tb.pub, rules: plain(msg.tb.rules, 80)} : null;
      members.set(msg.f, {cid: msg.f, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), st: String(msg.st || 'menu').slice(0, 10), tb, ver: String(msg.ver || ''), seen: Date.now()});
      if (!known) Bus.emit('lobby-join', members.get(msg.f));
      lobbyChanged();
    } else if (msg.t === 'who') { if (inLobby) setTimeout(hi, 200 + Math.random() * 900); }
    else if (msg.t === 'bye') { if (members.delete(msg.f)) lobbyChanged(); }
    else if (msg.t === 'inv' && msg.to === Mqtt.cid) Bus.emit('invite', {from: plain(msg.name) || 'Någon', av: cleanAv(msg.av), code: N.cleanCode(msg.code), cid: msg.f});
  }
  N.lobbyOn = async () => {
    if (inLobby) return true;
    Mqtt.setWill(T_LOBBY, {t: 'bye'});
    const ok = await Mqtt.ready(9000);
    if (!ok) return false;
    if (inLobby) return true;
    inLobby = true;
    unsubLobby = Mqtt.sub(T_LOBBY, onLobby);
    setTimeout(() => { Mqtt.pub(T_LOBBY, {t: 'who'}); hi(); }, 600);
    clearInterval(hiTimer); hiTimer = setInterval(hi, 20000);
    clearInterval(sweepTimer);
    sweepTimer = setInterval(() => { const now = Date.now(); let ch = false; members.forEach((m, k) => { if (now - m.seen > 50000) { members.delete(k); ch = true; } }); if (ch) lobbyChanged(); }, 5000);
    lobbyChanged();
    return true;
  };
  N.lobbyOff = () => {
    if (!inLobby) return;
    Mqtt.pub(T_LOBBY, {t: 'bye'});
    inLobby = false; clearInterval(hiTimer); clearInterval(sweepTimer); clearTimeout(lobbyT);
    if (unsubLobby) unsubLobby();
    members.clear(); lobbyChanged();
  };
  N.inLobby = () => inLobby;
  N.hi = hi;
  N.status = (st, tb = null) => { status = {st, tb}; hi(); };
  N.members = () => [...members.values()].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
  N.tables = () => N.members().filter(m => m.tb && m.tb.pub && m.tb.code).map(m => Object.assign({host: m.name, av: m.av, cid: m.cid, ver: m.ver}, m.tb));
  N.invite = (cid, code) => Mqtt.pub(T_LOBBY, {t: 'inv', to: cid, code, name: plain(Profile.name), av: cleanAv(Profile.avatar)});
  N.quickTable = () => N.tables().filter(t => t.st === 'wait' && t.n < t.max && t.ver === GAME_VER).sort((a, b) => b.n - a.n)[0] || null;

  /* ---------- Värden ---------- */
  // borta efter 20 s utan livstecken. Datorn spelar åt den som är borta först när det har varit dennes tur i 45 s
  // (en telefon i fickan eller en stund i ett annat program ska inte kosta turen direkt).
  const OFFLINE_MS = 20000, AUTOPLAY_MS = 45000;
  class HostSession extends Emitter {
    constructor(o) {
      super();
      this.role = 'host';
      const saved = o.restore || null;
      this.code = saved ? saved.code : (o.code || N.newCode());
      this.topic = tRoom(this.code);
      this.opts = saved ? saved.opts : {players: o.players, rules: o.rules || {}, pub: !!o.pub};
      if (saved) this.seats = saved.seats.map(s => Object.assign({}, s, {cid: s.host ? Mqtt.cid : s.cid, online: !!s.host || s.kind !== 'human'}));
      else {
        this.seats = Array.from({length: this.opts.players}, () => ({kind: 'open'}));
        this.seats[0] = {kind: 'human', host: true, name: plain(Profile.name) || 'Värd', av: cleanAv(Profile.avatar), dev: Profile.dev, cid: Mqtt.cid, online: true};
      }
      this.state = saved ? saved.state : 'lobby';
      this.S = saved ? saved.S : null;
      this.v = saved ? saved.v + 50 : 1;
      this.keys = new Map();
      this.seen = new Map();
      this.watchers = new Map();
      this.chain = Promise.resolve();
      this.sendQ = Promise.resolve();
      this.turnAt = Date.now();
      this.ready = this.init();
    }
    async init() {
      this.kp = await Crypt.pair();
      this.signer = await Crypt.signer();
      this.fp = this.signer ? await Crypt.fingerprint(this.signer.pub) : '';
      if (this.closed) return;
      this.unsub = Mqtt.sub(this.topic, msg => { this.chain = this.chain.then(() => this.onMsg(msg)).catch(e => console.error(e)); });
      this.hb = setInterval(() => this.tick(), 2000);
      this.announce();
      if (this.S) { this.broadcast(); cpuDriver(this); }
    }
    online() { return true; }
    watching() { return false; }
    mySeat() { return this.seats.findIndex(s => s.host); }
    // datorn spelar på datorplatserna och åt spelare som har varit borta en stund
    isCpu(seat) {
      const s = this.seats[seat];
      if (!s) return false;
      if (s.kind === 'cpu') return true;
      if (s.kind !== 'human' || s.host || s.online) return false;
      if (s.left) return true;
      return Date.now() - Math.max(s.offSince || 0, this.turnAt || 0) > AUTOPLAY_MS;
    }
    cpuLevel(seat) { return this.seats[seat].level || 'medel'; }
    view() { return this.S ? Rules.view(this.S, this.mySeat()) : null; }
    info() { return {code: this.code, players: this.opts.players, rules: this.opts.rules, pub: this.opts.pub, host: this.seats[this.mySeat()] ? this.seats[this.mySeat()].name : ''}; }
    publicSeats() { return this.seats.map(s => ({kind: s.kind, name: s.name || '', av: s.av || '', level: s.level || null, online: s.kind !== 'human' || !!s.online, host: !!s.host, dh: s.dev ? N.devHash(s.dev) : null, plain: !!s.plain})); }
    roomMsg() { return {t: 'room', hd: hostHash(), v: ++this.v, ver: GAME_VER, info: this.info(), seats: this.publicSeats(), state: this.state, hk: this.kp ? this.kp.pub : null, w: this.watchers.size}; }
    // Alla meddelanden från värden går signerade och i ordning: {t: 'h', m: '<json>', s: signatur, k: värdens nyckel}
    enqueue(fn) { this.sendQ = this.sendQ.then(fn).catch(e => console.error(e)); return this.sendQ; }
    async signAndPub(inner) {
      const m = JSON.stringify(inner);
      if (!this.signer) { Mqtt.pub(this.topic, inner); return; }
      const s = await Crypt.sign(this.signer, m);
      Mqtt.pub(this.topic, {t: 'h', m, s, k: this.signer.pub});
    }
    hsend(obj) {
      if (this.closed && obj.t !== 'closed') return Promise.resolve();
      const inner = Object.assign({code: this.code, hd: hostHash()}, obj);
      return this.enqueue(() => this.signAndPub(inner));
    }
    link() { return this.code + (this.fp ? '-' + this.fp : ''); }
    // sparas i webbläsaren efter varje förändring: laddar värden om sidan (eller stänger den) går bordet att fortsätta
    save() {
      if (this.closed) return;
      Store.set('host', {code: this.code, opts: this.opts, seats: this.seats.map(s => { const o = Object.assign({}, s); delete o.cid; return o; }), state: this.state, S: this.S, v: this.v, t: Date.now()});
    }
    announce() {
      if (this.closed || !this.kp) return;
      this.hsend(this.roomMsg());
      this.save();
      const n = this.seats.filter(s => s.kind === 'human').length;
      N.status('host', {code: this.code, n, max: this.seats.filter(s => s.kind !== 'cpu').length, st: this.state === 'lobby' ? 'wait' : 'play', pub: this.opts.pub, rules: N.ruleText(this.opts.players, this.opts.rules)});
      this.emit('seats');
    }
    tick() {
      const now = Date.now();
      let ch = false;
      this.seats.forEach((s, i) => {
        if (s.kind !== 'human' || s.host) return;
        const on = now - (this.seen.get(s.cid) || 0) < OFFLINE_MS;
        if (on !== !!s.online) {
          s.online = on; ch = true;
          if (!on) s.offSince = now;
          this.emit('info', on ? `${s.name} är tillbaka.` : `${s.name} har tappat anslutningen. Datorn spelar åt ${s.name} om en stund.`);
        }
      });
      this.watchers.forEach((w, cid) => { if (now - w.seen > 20000) { this.watchers.delete(cid); ch = true; } });
      if (ch || now - (this.lastAnn || 0) > 4000) { this.lastAnn = now; this.announce(); }
      // någon som är borta och har turen: låt datorn ta över efter en stund
      if (this.S && (this.S.phase === 'draw' || this.S.phase === 'play' || this.S.phase === 'ask')) {
        const actor = this.S.phase === 'ask' ? this.S.ask.to : this.S.turn;
        if (this.isCpu(actor) && !this.cpuT) cpuDriver(this);
      }
    }
    seatOf(cid) { return this.seats.findIndex(s => s.kind === 'human' && s.cid === cid); }
    async onMsg(msg) {
      if (this.closed) return;
      if (msg.t !== 'leave') this.seen.set(msg.f, Date.now());
      const si = this.seatOf(msg.f);
      switch (msg.t) {
        case 'hello':
          if (Date.now() - (this.lastHello || 0) > 500) { this.lastHello = Date.now(); this.hsend(this.roomMsg()); }
          break;
        case 'join': return this.onJoin(msg);
        case 'hb': { const w = this.watchers.get(msg.f); if (w) w.seen = Date.now(); if (si >= 0 && !this.seats[si].online) this.tick(); break; }
        case 'act': if (si >= 0) return this.onAct(si, msg); break;
        case 'leave': {
          if (si < 0) { this.watchers.delete(msg.f); break; }
          // bara den som har platsens nyckel kan lämna den (annars kunde vem som helst skicka "leave" i någons namn)
          let ok = false;
          try { ok = !!(await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':ctl:' + si)); } catch (e) { ok = false; }
          if (!ok) break;
          const s = this.seats[si];
          if (this.state === 'lobby') { this.seats[si] = {kind: 'open'}; this.keys.delete(si); Sound.play('leave'); this.emit('info', `${s.name} gick.`); }
          else { s.online = false; s.left = true; s.offSince = Date.now(); this.seen.delete(msg.f); this.emit('info', `${s.name} lämnade bordet. Datorn tar över.`); cpuDriver(this); }
          this.announce();
          break;
        }
        case 'sit': {
          // en gäst väljer en ledig plats i väntrummet (krypterat med platsens nyckel)
          if (si < 0 || this.state !== 'lobby') break;
          let body = null;
          try { body = await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':ctl:' + si); } catch (e) { body = null; }
          const to = body && Number.isInteger(body.seat) ? body.seat : -1;
          if (this.seats[to] && this.seats[to].kind === 'open') this.swapSeats(si, to);
          break;
        }
        case 'resync': if (Date.now() - (this.lastResync || 0) > 800) { this.lastResync = Date.now(); if (this.S) this.broadcast(); else this.hsend(this.roomMsg()); } break;
        case 'emo':
          if ((si >= 0 || this.watchers.has(msg.f)) && Date.now() - (this.emoAt || 0) > 700) { this.emoAt = Date.now(); this.emit('emo', si, plain(msg.e, 40)); }
          break;
      }
    }
    async onJoin(msg) {
      if (String(msg.ver) !== GAME_VER) { this.hsend({t: 'nope', to: msg.f, why: 'ver'}); return; }
      let key = null, dev;
      try {
        key = await Crypt.shared(this.kp, msg.pk);
        const d = await Crypt.open(key, msg.sd, this.code + ':join');
        dev = plain(d && d.dev, 32);
      } catch (e) { return; }
      if (!dev) return;
      const name = plain(msg.name) || 'Spelare', av = cleanAv(msg.av);
      let i = this.seats.findIndex(s => s.kind === 'human' && s.dev === dev);
      if (i >= 0) {
        const s = this.seats[i];
        if (s.host) return;
        Object.assign(s, {cid: msg.f, online: true, plain: !key});
        if (this.state === 'lobby') Object.assign(s, {name, av});
        delete s.offSince; delete s.left;
        this.keys.set(i, key);
      } else if (this.state === 'lobby' && (i = this.seats.findIndex(s => s.kind === 'open')) >= 0) {
        this.seats[i] = {kind: 'human', name, av, dev, cid: msg.f, online: true, plain: !key};
        this.keys.set(i, key);
        Sound.play('join');
        this.emit('info', `${name} satte sig vid bordet.`);
      } else {
        this.watchers.set(msg.f, {name, seen: Date.now()});
        this.hsend({t: 'watch', to: msg.f});
      }
      this.announce();
      if (this.S) this.broadcast();
    }
    async onAct(si, msg) {
      let body;
      try { body = await Crypt.open(this.keys.get(si) || null, msg.box, this.code + ':act'); } catch (e) { return; }
      if (!body || !body.a || !this.S) return;
      // gammalt eller redan gjort (samma drag kom via flera servrar eller skickades om)
      if (body.k !== this.S.k) { if (body.k < this.S.k && Date.now() - (this.lastFix || 0) > 400) { this.lastFix = Date.now(); this.broadcast(); } return; }
      const actor = this.S.phase === 'ask' ? this.S.ask.to : this.S.turn;
      if (si !== actor) return;
      try { this.apply(si, body.a); }
      catch (e) {
        if (!(e instanceof Rules.RuleError)) { console.error(e); return; }
        this.hsend({t: 'err', to: msg.f, msg: e.message, k: this.S.k});
      }
    }
    apply(seat, a) {
      const r = Rules.apply(this.S, seat, a, cryptoRandom);
      const actor = S0 => S0.phase === 'ask' ? S0.ask.to : S0.turn;
      const was = actor(this.S);
      this.S = r.S;
      if (actor(this.S) !== was || this.S.phase === 'draw') this.turnAt = Date.now();
      if (this.S.phase === 'over') this.state = 'over';
      else if (this.state !== 'game') this.state = 'game';
      this.broadcast();
      this.save();
      const V = this.view();
      this.emit('update', V, V.last ? V.last.ev : [], seat);
      cpuDriver(this);
    }
    send(a) {
      try { this.apply(this.mySeat(), a); return ''; }
      catch (e) { if (e instanceof Rules.RuleError) return e.message; throw e; }
    }
    // det alla får se och varje spelares hand (krypterad). Varje läge skickas, i ordning.
    broadcast() {
      if (!this.S || this.closed) return;
      const S = this.S;
      const seats = this.seats.map((s, i) => s.kind === 'human' && !s.host && this.keys.has(i) ? {i, key: this.keys.get(i)} : null).filter(Boolean);
      this.enqueue(async () => {
        const pub = Rules.view(S, -1);
        const priv = {};
        for (const {i, key} of seats) {
          const V = Rules.view(S, i);
          priv[i] = await Crypt.seal(key, {hand: V.cards[i], ev: V.last ? V.last.ev : []}, this.code + ':st:' + i);
        }
        if (this.closed) return;
        await this.signAndPub({code: this.code, hd: hostHash(), t: 'st', v: ++this.v, k: S.k, pub, priv});
      });
    }
    // väntrummet: platser, datorer och inställningar
    setSeat(i, kind, level = 'medel') {
      if (this.state !== 'lobby' || !this.seats[i] || this.seats[i].host) return;
      const cur = this.seats[i];
      if (cur.kind === 'human') this.hsend({t: 'kick', to: cur.cid});
      if (kind === 'cpu') {
        const used = new Set(this.seats.map(s => s.name));
        const pickN = AI.NAMES.find(n => !used.has(n.name)) || AI.NAMES[0];
        this.seats[i] = {kind: 'cpu', level, name: pickN.name, av: pickN.av};
      } else this.seats[i] = {kind: 'open'};
      this.keys.delete(i);
      this.announce();
    }
    setLevel(i, level) { const s = this.seats[i]; if (s && s.kind === 'cpu' && AI.LEVELS[level]) { s.level = level; this.announce(); } }
    swapSeats(i, j) {
      if (this.state !== 'lobby' || i === j || !this.seats[i] || !this.seats[j]) return;
      [this.seats[i], this.seats[j]] = [this.seats[j], this.seats[i]];
      const ki = this.keys.get(i), kj = this.keys.get(j);
      this.keys.delete(i); this.keys.delete(j);
      if (kj !== undefined) this.keys.set(i, kj);
      if (ki !== undefined) this.keys.set(j, ki);
      this.announce();
    }
    setOpts(o) {
      if (this.state !== 'lobby') return;
      if (o.players && o.players !== this.opts.players && [2, 3, 4].includes(o.players)) {
        const n = o.players;
        // behåll människorna, fyll på med lediga platser
        const humans = this.seats.filter(s => s.kind === 'human'), cpus = this.seats.filter(s => s.kind === 'cpu');
        if (humans.length > n) return this.emit('error', 'Det sitter för många vid bordet för det.');
        const next = humans.concat(cpus).slice(0, n);
        while (next.length < n) next.push({kind: 'open'});
        this.keys = new Map(next.map((s, i) => [i, s.kind === 'human' && !s.host ? this.keys.get(this.seats.indexOf(s)) : undefined]).filter(([, k]) => k !== undefined));
        this.seats = next;
        this.opts.players = n;
      }
      if (o.rules) this.opts.rules = Object.assign({}, this.opts.rules, o.rules);
      if (typeof o.pub === 'boolean') this.opts.pub = o.pub;
      this.announce();
    }
    canStart() { return this.state === 'lobby' && this.seats.every(s => s.kind === 'human' || s.kind === 'cpu'); }
    start() {
      if (!this.canStart()) return false;
      const seats = this.seats.map(s => ({name: s.name, kind: s.kind === 'cpu' ? 'cpu' : 'human', level: s.level, av: s.av}));
      this.S = Rules.create({players: this.opts.players, seats, opts: this.opts.rules, id: randId(8), rng: cryptoRandom});
      Rules.start(this.S, cryptoRandom);
      this.state = 'game';
      this.announce();
      this.broadcast();
      this.save();
      this.emit('started');
      cpuDriver(this);
      return true;
    }
    canNext() { return true; }
    next() { if (this.S && this.S.phase === 'end') { try { this.apply(-1, {t: 'next'}); } catch (e) { console.error(e); } } }
    rematch() {
      // de som har lämnat får datorn på sin plats
      this.seats.forEach(s => { if (s.kind === 'human' && !s.host && !s.online) Object.assign(s, {kind: 'cpu', level: 'medel'}); });
      this.state = 'lobby';
      this.start();
      const V = this.view();
      this.emit('update', V, V.last ? V.last.ev : [], -1);
    }
    toLobby() { this.state = 'lobby'; this.S = null; this.announce(); this.hsend({t: 'lobby'}); }
    sendEmote(e) { this.hsend({t: 'emo', e, s: this.mySeat()}); this.emit('emo', this.mySeat(), e); }
    kick() { cpuDriver(this); }
    leave() {
      if (this.closed) return;
      this.closed = true;
      Store.del('host');
      this.hsend({t: 'closed'});
      clearInterval(this.hb); clearTimeout(this.cpuT);
      if (this.unsub) this.unsub();
      N.status('menu');
      this.off();
    }
  }

  /* ---------- En gäst vid någon annans bord ---------- */
  class ClientSession extends Emitter {
    constructor(code, fp = '') {
      super();
      this.role = 'client';
      this.code = N.cleanCode(code);
      this.fp = String(fp || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 16);
      this.sigPub = null; this.sigKey = null;
      this.topic = tRoom(this.code);
      this.V = null; this.seats = []; this.state = 'lobby'; this.info = null; this.v = 0;
      this.hostPub = null; this.hostDev = null; this.key = null; this.lastHost = Date.now(); this.hostLost = false; this.pending = null;
      this.chain = Promise.resolve();
      this.unsub = Mqtt.sub(this.topic, msg => { this.chain = this.chain.then(() => this.unwrap(msg)).catch(e => console.error(e)); });
    }
    // Meddelanden från värden är signerade: kontrollera och packa upp. Allt annat (gästernas hb/emo) släpps igenom
    // bara om det inte låtsas vara från värden.
    async unwrap(msg) {
      if (msg.t === 'h') {
        if (typeof msg.m !== 'string' || typeof msg.s !== 'string' || typeof msg.k !== 'string' || msg.m.length > 400000) return;
        if (!this.sigPub) {
          // första gången: en länk med fingeravtryck bestämmer vilken nyckel som gäller, annars den första som hörs
          if (this.fp && Crypt.ok && (await Crypt.fingerprint(msg.k)) !== this.fp) return;
          try { this.sigKey = await Crypt.verifier(msg.k); } catch (e) { return; }
          if (!(await Crypt.verify(this.sigKey, msg.m, msg.s))) { this.sigKey = null; return; }
          this.sigPub = msg.k;
        } else if (msg.k !== this.sigPub || !(await Crypt.verify(this.sigKey, msg.m, msg.s))) return;
        let inner;
        try { inner = JSON.parse(msg.m); } catch (e) { return; }
        if (!inner || inner.code !== this.code) return;
        inner.f = msg.f;
        inner.signed = true;
        return this.onMsg(inner);
      }
      // osignerat: värdens egna meddelanden godtas bara där webbläsaren saknar WebCrypto (t.ex. http på hemnätet)
      if (['room', 'st', 'closed', 'kick', 'nope', 'err', 'watch', 'lobby', 'emo'].includes(msg.t) && Crypt.ok && msg.t !== 'emo') return;
      return this.onMsg(msg);
    }
    online() { return true; }
    async join(timeout = 12000) {
      this.kp = await Crypt.pair();
      await new Promise((res, rej) => {
        const hello = () => Mqtt.pub(this.topic, {t: 'hello'});
        hello();
        this.helloT = setInterval(() => { if (!this.hostPub) hello(); else if (!this.joined) this.sendJoin(); }, 2200);
        const t = setTimeout(() => done(new Error('Hittade inget bord med koden ' + this.code + '.')), timeout);
        const done = err => { clearInterval(this.helloT); clearTimeout(t); this.joinWait = null; err ? rej(err) : res(); };
        this.joinWait = done;
      });
      Store.set('room', {code: this.code, fp: this.fp, t: Date.now()});
      this.hb = setInterval(() => {
        Mqtt.pub(this.topic, {t: 'hb'});
        const lost = Date.now() - this.lastHost > 15000;
        if (lost !== this.hostLost) { this.hostLost = lost; this.emit(lost ? 'hostlost' : 'hostback'); }
        // ett drag som värden inte har bekräftat: skicka igen
        if (this.pending && Date.now() - this.pending.at > 2500) {
          if (++this.pending.n > 6) { this.pending = null; Mqtt.pub(this.topic, {t: 'resync'}); }
          else { this.pending.at = Date.now(); Mqtt.pub(this.topic, this.pending.msg); }
        }
      }, 3000);
      return this;
    }
    async sendJoin() {
      if (this.joining) return;
      this.joining = true;
      try {
        this.key = await Crypt.shared(this.kp, this.hostPub);
        const sd = await Crypt.seal(this.key, {dev: Profile.dev}, this.code + ':join');
        Mqtt.pub(this.topic, {t: 'join', ver: GAME_VER, pk: this.kp.pub, name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), sd});
      } finally { this.joining = false; }
    }
    mySeat() { const hh = myHash(); return this.seats.findIndex(s => s.kind === 'human' && s.dh === hh); }
    watching() { return this.mySeat() < 0; }
    view() { return this.V; }
    async onMsg(msg) {
      if (this.closed) return;
      const toMe = msg.to === Mqtt.cid;
      // värden känns igen på sin enhet (inte anslutningen), så att den kan ladda om sidan och fortsätta
      if (['room', 'st', 'closed', 'kick', 'nope', 'err', 'watch', 'lobby'].includes(msg.t)) {
        if (!this.hostDev && msg.t === 'room') this.hostDev = msg.hd;
        if (!msg.hd || msg.hd !== this.hostDev) { if (msg.t === 'nope' && toMe && this.joinWait) { /* innan värden är känd */ } else return; }
        this.lastHost = Date.now();
        if (this.hostLost) { this.hostLost = false; this.emit('hostback'); }
      }
      switch (msg.t) {
        case 'nope':
          if (toMe && this.joinWait) { const e = new Error(msg.why === 'ver' ? 'Bordet kör en annan version av spelet. Ladda om sidan och försök igen.' : 'Kunde inte gå med.'); e.ver = msg.why === 'ver'; this.joinWait(e); }
          return;
        case 'kick': if (toMe) this.emit('kicked'); return;
        case 'closed': this.closed = true; this.emit('closed'); return;
        case 'err': if (toMe) { this.pending = null; this.emit('error', plain(msg.msg, 200)); if (this.V) this.emit('update', this.V, [], -1); } return;
        case 'watch': if (toMe && this.joinWait) this.joinWait(null); return;
        case 'lobby': this.state = 'lobby'; this.V = null; this.emit('lobby'); return;
        case 'emo': this.emit('emo', typeof msg.s === 'number' ? msg.s : -1, plain(msg.e, 40)); return;
        case 'room': {
          if (typeof msg.v !== 'number' || msg.v <= (this.roomV || 0)) return;
          this.roomV = msg.v;
          this.info = msg.info; this.watchers = msg.w || 0;
          this.seats = Array.isArray(msg.seats) ? msg.seats : [];
          const prevState = this.state;
          this.state = msg.state;
          if (msg.hk && msg.hk !== this.hostPub) { this.hostPub = msg.hk; this.joined = false; this.sendJoin(); }
          if (this.mySeat() >= 0) { this.joined = true; if (this.joinWait) this.joinWait(null); }
          else if (this.state !== 'lobby' && this.joinWait && this.hostPub) { /* bordet är fullt: vi väntar på watch */ }
          this.emit('seats');
          if (prevState === 'lobby' && this.state === 'game') this.emit('started');
          if (this.state !== 'lobby' && !this.V) Mqtt.pub(this.topic, {t: 'resync'});
          return;
        }
        case 'st': {
          if (typeof msg.v !== 'number' || msg.v <= this.v) return;
          const V = msg.pub;
          if (!validView(V)) return;
          this.v = msg.v;
          const seat = this.mySeat();
          let ev = V.last ? V.last.ev : [];
          if (seat >= 0 && msg.priv && msg.priv[seat]) {
            try {
              const p = await Crypt.open(this.key, msg.priv[seat], this.code + ':st:' + seat);
              V.cards[seat] = p.hand; ev = p.ev || ev;
              V.me = seat;
            } catch (e) { V.me = -1; this.sendJoin(); }
          } else V.me = -1;
          if (V.last) V.last.ev = ev;
          const prev = this.V;
          this.V = V;
          if (this.pending && V.k >= this.pending.k) this.pending = null;
          if (this.state === 'lobby') this.state = V.phase === 'over' ? 'over' : 'game';
          // nästa drag: animera. Samma läge igen: bara om något har ändrats (t.ex. vi fick vår hand)
          if (prev && prev.k === V.k && prev.me === V.me && prev.id === V.id) return;
          const step = prev && prev.id === V.id && V.k === prev.k + 1;
          const fresh = !prev || prev.id !== V.id || (V.last && V.last.t === 'deal' && V.round !== prev.round);
          this.emit('update', V, step || fresh ? ev : [], V.last ? V.last.seat : -1);
          return;
        }
      }
    }
    send(a) {
      const V = this.V, seat = this.mySeat();
      if (!V || seat < 0) return 'Du sitter inte vid bordet.';
      const err = Rules.check(V, seat, a);
      if (err) return err;
      const k = V.k;
      Crypt.seal(this.key, {a, k}, this.code + ':act').then(box => {
        const msg = {t: 'act', box};
        Mqtt.pub(this.topic, msg);
        this.pending = {k: k + 1, msg, at: Date.now(), n: 0};
      }).catch(e => { console.error(e); this.emit('error', 'Draget kunde inte skickas.'); });
      return '';
    }
    canNext() { return false; }
    sit(seat) { const si = this.mySeat(); Crypt.seal(this.key, {seat}, this.code + ':ctl:' + si).then(box => Mqtt.pub(this.topic, {t: 'sit', box})).catch(() => {}); }
    sendEmote(e) { Mqtt.pub(this.topic, {t: 'emo', e, s: this.mySeat()}); this.emit('emo', this.mySeat(), e); }
    resync() { Mqtt.pub(this.topic, {t: 'resync'}); }
    leave() {
      if (this.left) return;
      this.left = true; this.closed = true;
      Store.del('room');
      const si = this.mySeat(), topic = this.topic;
      if (si >= 0) Crypt.seal(this.key, {leave: true}, this.code + ':ctl:' + si).then(box => Mqtt.pub(topic, {t: 'leave', box})).catch(() => {});
      else Mqtt.pub(topic, {t: 'leave'});
      clearInterval(this.hb); clearInterval(this.helloT);
      if (this.unsub) this.unsub();
      N.status('menu');
      this.off();
    }
  }
  N.HostSession = HostSession;
  N.ClientSession = ClientSession;
  N.host = o => new HostSession(o);
  N.join = async (code, fp = '') => { const s = new ClientSession(code, fp); try { await s.join(); } catch (e) { s.leave(); throw e; } return s; };
  // En giltig vy från värden (grundformen, så att ett trasigt meddelande inte kan ställa till bordet)
  function validView(V) {
    return !!(V && typeof V === 'object' && typeof V.k === 'number' && V.opts && [2, 3, 4].includes(V.opts.players) && Array.isArray(V.pile) && Array.isArray(V.melds) && Array.isArray(V.cards)
      && Array.isArray(V.teams) && Array.isArray(V.seats) && Array.isArray(V.red3) && Array.isArray(V.team) && V.seats.length === V.opts.players && V.cards.length === V.opts.players);
  }
  // Ett pågående bord att fortsätta (värd: inom ett dygn, gäst: inom två timmar)
  N.saved = () => {
    const h = Store.get('host', null), r = Store.get('room', null);
    if (h && h.S && h.state !== 'over' && Date.now() - h.t < 24 * 3600e3) return {host: h};
    if (r && Date.now() - r.t < 12 * 3600e3) return {room: r.code, fp: r.fp || ''};
    return null;
  };
  return N;
})();

/* ---- 12-game.js ---- */
/* ================= Spelet: kopplar ihop sessionen, bordet och spelaren ================= */
// En session (mot datorn, värd eller gäst online) ger nya lägen med händelser. De spelas upp i tur och ordning
// (animationerna får ta sin tid) och efter varje läge uppdateras knapparna. När en giv är slut visas poängen.
const Game = (() => {
  const G = {};
  let session = null, queue = [], running = false, idleWait = [], V = null, lastTurnKey = '', endShown = 0, askSheet = null;
  // ökar när ett parti startar eller avslutas: animationer som pågår för ett gammalt parti får inte röra det nya
  let gen = 0, endSheet = null, statsDone = '';

  G.session = () => session;
  G.view = () => V;
  G.active = () => !!session;

  // Startar ett parti med en session (LocalSession, HostSession eller ClientSession)
  G.start = (s, o = {}) => {
    if (session === s) return;
    G.stop(true);
    gen++;
    session = s;
    queue = []; running = false; lastTurnKey = ''; endShown = 0;
    Menu.show('table');
    Table.clear();
    Play.reset();
    s.idle = G.idle;
    const g0 = gen;
    s.on('update', (view, ev, seat) => { if (g0 !== gen) return; queue.push({view, ev: ev || [], seat}); pump(); });
    s.on('error', msg => UI.toast(msg, {ms: 3600}));
    s.on('info', msg => UI.toast(msg, {ms: 3000}));
    const v0 = s.view();
    if (v0) {
      V = v0;
      Table.set(v0);
      Play.update(v0, {watch: s.watching && s.watching()});
      // ett nytt parti börjar med utdelningen, ett återupptaget visas direkt
      if (o.fresh && v0.last && v0.last.t === 'deal') { queue.push({view: v0, ev: v0.last.ev, seat: -1}); pump(); }
      else afterUpdate(v0, [], -1);
    }
    Sound.music('spel');
    Main.keepAwake(true);
    s.kick && s.kick();
  };
  G.stop = (quiet) => {
    gen++;
    if (session) { try { session.leave(); } catch (e) { console.error(e); } }
    session = null; V = null; queue = [];
    if (askSheet) { askSheet.close(); askSheet = null; }
    Main.keepAwake(false);
    if (!quiet) { Table.clear(); }
  };
  // Väntar tills allt som har hänt har visats (datorn väntar på detta innan den gör nästa drag)
  G.idle = () => running || queue.length ? new Promise(r => idleWait.push(r)) : Promise.resolve();

  async function pump() {
    if (running) return;
    running = true;
    const my = gen;
    try {
      while (queue.length && my === gen) {
        const {view, ev, seat} = queue.shift();
        // ligger vi efter (många lägen i kön): hoppa direkt till det senaste
        if (queue.length > 3) { V = view; Table.set(view, {ms: 150}); Play.update(view, {watch: session && session.watching && session.watching()}); continue; }
        V = view;
        await Table.apply(view, ev);
        if (my !== gen) break;
        Play.update(view, {watch: session && session.watching && session.watching()});
        afterUpdate(view, ev, seat);
      }
    } catch (e) { console.error(e); }
    running = false;
    // ett nytt parti hann starta medan vi väntade: ta hand om dess kö
    if (my !== gen && queue.length) { pump(); return; }
    const w = idleWait; idleWait = [];
    w.forEach(r => r());
  }

  function afterUpdate(view, ev, seat) {
    const me = view.me;
    // min tur börjar
    const key = view.round + ':' + view.k + ':' + view.turn;
    if (me >= 0 && view.turn === me && view.phase === 'draw' && lastTurnKey !== view.round + ':' + view.turn + ':' + turnCount(view)) {
      lastTurnKey = view.round + ':' + view.turn + ':' + turnCount(view);
      Sound.play('turn');
      vibrate(25);
      if (view.opts.players > 2 || (view.last && view.last.seat !== me)) Table.banner('Din tur', '', 900, {low: true});
    }
    for (const e of ev) {
      if (e.t === 'ask' && e.to === me) askPartner(view);
      if (e.t === 'ask' && e.to !== me) { Sound.play('ask'); Table.banner(e.seat === me ? `Du frågar ${view.seats[e.to].name}` : `${view.seats[e.seat].name} frågar ${view.seats[e.to].name}`, 'Får jag gå ut?', 1600); }
      if (e.t === 'answer') { Sound.play('ask'); Table.banner(e.yes ? 'Ja, gå ut!' : 'Nej, vänta lite', `${view.seats[e.seat].name} svarade`, 1600); if (askSheet) { askSheet.close(); askSheet = null; } }
      if (e.t === 'end') setTimeout(() => showEnd(view), 700 * Time.speed());
      if (e.t === 'deal') { Stats.rounds++; saveStats(); if (endSheet) endSheet.close(); }
      Hemma.onEvent(view, e, seat);
    }
    // återupptagen giv som redan var slut
    if ((view.phase === 'end' || view.phase === 'over') && !ev.length && endShown !== view.id + ':' + view.round) showEnd(view);
    if (view.phase === 'ask' && view.ask && view.ask.to === me && !askSheet && !ev.some(e => e.t === 'ask')) askPartner(view);
  }
  const turnCount = v => (v.log || []).length;

  // Min partner frågar om den får gå ut
  function askPartner(view) {
    Sound.play('ask');
    vibrate([30, 60, 30]);
    const who = view.seats[view.ask.seat].name;
    const hand = Rules.handOf(view, view.me);
    const body = h('div', {}, h('p', {class: 'lead'}, `${who} vill gå ut. Säger du ja måste ${who} gå ut nu. Säger du nej får ${who} inte gå ut i det här draget.`),
      h('p', {class: 'muted'}, `Går ${who} ut räknas korten på din hand som minus: ${Cards.sum(hand)} poäng (${Cards.num(hand.length, true)} kort).`));
    askSheet = UI.sheet({title: `${who}: Får jag gå ut?`, cls: 'small', clear: true, body, dismiss: false, onClose: () => { askSheet = null; },
      buttons: [{label: 'Nej', cls: 'ghost', onClick: () => Play.answer(false)}, {label: 'Ja', cls: 'gold', onClick: () => Play.answer(true)}]});
  }

  /* ---------- Poängen efter en giv ---------- */
  // Poängrutan igen (om den har stängts), från knappraden
  G.showScores = () => { if (V && V.res && !endSheet) { endShown = ''; showEnd(V); } };
  G.endOpen = () => !!endSheet;
  function showEnd(view) {
    const endKey = view.id + ':' + view.round;
    if (!view.res || endShown === endKey) return;
    endShown = endKey;
    const res = view.res, me = view.me, myTeam = me >= 0 ? view.team[me] : 0;
    const over = view.phase === 'over';
    const again = statsDone === endKey;     // visas igen: räkna inte statistiken och spela inte ljuden en gång till
    statsDone = endKey;
    // statistik
    if (me >= 0 && !again) {
      const mine = res.teams[myTeam];
      Stats.natural += mine.natural; Stats.mixed += mine.mixed; Stats.red3 += mine.nRed;
      if (res.out === me) { Stats.out++; if (res.concealed) Stats.concealed++; }
      if (Stats.bestRound == null || mine.total > Stats.bestRound) Stats.bestRound = mine.total;
      if (over) {
        Stats.games++;
        const won = view.winner === myTeam;
        if (won) Stats.wins++;
        if (session && session.online && session.online()) { Stats.online++; if (won) Stats.onlineWins++; }
        if (Stats.bestGame == null || view.teams[myTeam].score > Stats.bestGame) Stats.bestGame = view.teams[myTeam].score;
      }
      saveStats();
    }
    if (!again) Sound.play(over ? 'win' : 'out');
    const why = res.why === 'out' ? (res.out === me ? (res.concealed ? 'Du gick ut dolt!' : 'Du gick ut!') : `${view.seats[res.out].name} gick ut${res.concealed ? ' dolt' : ''}`) : res.why === 'red3' ? 'Sista kortet var en röd trea' : 'Talongen tog slut';
    const cols = view.teams.map((t, ti) => ti).sort((a, b) => (a === myTeam ? -1 : b === myTeam ? 1 : a - b));
    const name = ti => view.opts.players === 4 ? (ti === myTeam && me >= 0 ? 'Ni' : 'De') : (view.teams[ti].seats[0] === me ? 'Du' : view.seats[view.teams[ti].seats[0]].name);
    const tbl = h('table', {class: 'scoretable'});
    const head = h('tr', {}, h('th', {}), ...cols.map(ti => h('th', {style: {'--tc': UI.teamColor(ti, me >= 0 ? myTeam : -1, view.teams.length)}}, name(ti))));
    tbl.append(head);
    const row = (label, fn, cls = '') => tbl.append(h('tr', {class: cls}, h('td', {}, label), ...cols.map(ti => { const v = fn(res.teams[ti]); return h('td', {class: typeof v === 'number' && v < 0 ? 'neg' : ''}, typeof v === 'number' ? (v ? (v > 0 ? '+' : '') + fmt(v) : '–') : v); })));
    row('Canastor', t => t.natural || t.mixed ? h('span', {}, (t.natural ? t.natural + ' ren' + (t.natural > 1 ? 'a' : '') : '') + (t.natural && t.mixed ? ', ' : '') + (t.mixed ? t.mixed + ' blandad' + (t.mixed > 1 ? 'e' : '') : ''), h('b', {}, ' +' + fmt(t.canasta))) : '–');
    row('Röda treor', t => t.red);
    row('Utgång', t => t.out);
    row('Kort på bordet', t => t.table);
    row('Kort på handen', t => -t.hand);
    row('Given', t => t.total, 'sum');
    row('Totalt', t => h('b', {}, fmt(t.after)), 'total');
    // korten som blev kvar på händerna
    const hands = h('div', {class: 'lefthands'});
    view.seats.forEach((s, i) => {
      const ids = res.hands[i] || [];
      if (!ids.length) return;
      hands.append(h('div', {class: 'lh'}, h('span', {class: 'lh-n'}, (i === me ? 'Du' : s.name) + ` (−${Cards.sum(ids)})`), h('span', {class: 'lh-c'}, ...Cards.sort(ids).map(id => Play.miniCard(id)))));
    });
    const body = h('div', {class: 'endbody'}, h('p', {class: 'why'}, why), tbl, hands.childNodes.length ? h('div', {}, h('h3', {}, 'Kvar på händerna'), hands) : null);
    let title = `Giv ${res.round}`;
    if (over) {
      const won = me >= 0 && view.winner === myTeam;
      title = me < 0 ? `${name(view.winner)} vann!` : won ? (view.opts.players === 4 ? 'Ni vann!' : 'Du vann!') : `${name(view.winner)} vann`;
      body.prepend(h('div', {class: 'trophy' + (won ? ' won' : ''), html: UI.icon('trophy')}));
      if (won && !again) Main.confetti();
    }
    const buttons = [];
    const canNext = session && session.canNext && session.canNext();
    if (over) {
      const online = session && session.online && session.online();
      if (Hemma.atTable()) buttons.push({label: 'Stäng', cls: 'ghost'});
      else buttons.push({label: session && session.role === 'host' ? 'Stäng bordet' : 'Till menyn', cls: 'ghost', onClick: () => { G.stop(); Menu.show('title'); }});
      if (session && session.rematch && session.canNext()) buttons.push({label: 'Spela igen', cls: 'gold', onClick: () => session.rematch()});
      else if (online) buttons.push({label: 'Stäng', cls: 'ghost'});
    } else if (canNext) buttons.push({label: 'Nästa giv', cls: 'gold', onClick: () => session.next()});
    else buttons.push({label: 'Stäng', cls: 'ghost'});
    endSheet = UI.sheet({title, cls: 'endsheet' + (over ? ' over' : ''), body, buttons, dismiss: !canNext || over, onClose: () => { endSheet = null; Play.renderBar(); }});
    Play.renderBar();
    // online: väntar på värden
    if (!over && !canNext) UI.toast('Värden startar nästa giv.', {ms: 3000});
  }

  /* ---------- Pausmenyn ---------- */
  G.menu = () => {
    const s = session;
    const body = h('div', {class: 'pausemenu'});
    const item = (icon, label, fn, cls = '') => body.append(UI.btn(label, () => { sheet.close(); fn(); }, {icon, cls: 'wide ' + cls}));
    item('play', 'Fortsätt', () => {});
    item('clock', 'Senaste dragen', () => Table.showHistory());
    item('chart', 'Poängen hittills', () => Menu.history(V));
    item('hand', 'Hur man trycker', () => Menu.rules(0));
    item('help', 'Så spelar man', () => Menu.rules(1));
    item('gear', 'Inställningar', () => Menu.settings());
    const online = s && s.online && s.online(), host = s && s.role === 'host';
    // vid ett bord på Spelstunden: lämna bordet i plattan (rösterna och de andra finns där)
    if (Hemma.atTable()) item('door', 'Lämna bordet', async () => { if (await UI.confirm('Lämna bordet? De andra spelar vidare.', {yes: 'Lämna', danger: true})) Hemma.send({t: 'leave'}); }, 'danger');
    else item('door', host ? 'Stäng bordet' : online ? 'Lämna bordet' : 'Avsluta partiet', async () => {
      const ok = await UI.confirm(host ? 'Stänga bordet? Partiet tar slut för alla vid bordet.' : online ? 'Lämna bordet? Datorn tar över din plats.' : 'Avsluta partiet? Du kan fortsätta det senare från menyn.', {yes: host ? 'Stäng bordet' : online ? 'Lämna' : 'Avsluta', danger: true});
      if (ok) { G.stop(); Menu.show('title'); }
    }, 'danger');
    const sheet = UI.sheet({title: 'Meny', cls: 'small', body});
  };
  return G;
})();

/* ---- 13-menu.js ---- */
/* ================= Menyerna: startskärmen, nytt parti, inställningar, statistik och regler ================= */
const Menu = (() => {
  const M = {};
  let screen = 'title';

  M.show = name => {
    screen = name;
    $('scrMenu').hidden = name === 'table';
    $('scrTable').hidden = name !== 'table';
    document.body.dataset.screen = name;
    $('scrMenu').scrollTop = 0;
    if (name !== 'table') document.body.style.removeProperty('--toast-bottom');
    // i menyerna och reglerna går det att nypa för att förstora, vid bordet inte (där skulle det störa korten)
    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover' + (name === 'table' ? ', maximum-scale=1, user-scalable=no' : ''));
    if (name === 'title') { title(); Sound.music('meny'); if (typeof Net !== 'undefined' && Net.status) Net.status('menu'); }
  };
  M.screen = () => screen;

  /* ---------- Små kontroller ---------- */
  // Segmenterad väljare: seg([[värde, 'Text'], …], värde, onChange)
  M.seg = (opts, value, onChange, cls = '') => {
    const box = h('div', {class: 'seg ' + cls, role: 'radiogroup'});
    const set = v => { value = v; [...box.children].forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); };
    opts.forEach(([v, label, sub]) => {
      const b = h('button', {type: 'button', class: 'segb', role: 'radio', dataset: {v: String(v)}}, h('span', {}, label), sub ? h('small', {}, sub) : null);
      b.onclick = () => { Sound.play('click'); set(v); onChange(v); };
      box.append(b);
    });
    set(value);
    return box;
  };
  M.toggle = (label, value, onChange, sub = '') => {
    const input = h('input', {type: 'checkbox', role: 'switch'});
    input.checked = !!value;
    input.onchange = () => { Sound.play('click'); onChange(input.checked); };
    return h('label', {class: 'toggle'}, h('span', {class: 'tl'}, h('b', {}, label), sub ? h('small', {}, sub) : null), input, h('span', {class: 'sw'}));
  };
  M.range = (label, value, onChange) => {
    const input = h('input', {type: 'range', min: 0, max: 1, step: .05});
    input.value = value;
    const fill = () => input.style.setProperty('--v', (input.value * 100) + '%');
    input.oninput = () => { fill(); onChange(+input.value); };
    fill();
    return h('label', {class: 'range'}, h('span', {class: 'tl'}, h('b', {}, label)), input);
  };
  M.field = (label, node) => h('div', {class: 'field'}, h('div', {class: 'flabel'}, label), node);

  /* ---------- Startskärmen ---------- */
  function title() {
    const root = $('scrMenu');
    root.textContent = '';
    const fan = h('div', {class: 'titlefan', 'aria-hidden': 'true'});
    // en solfjäder av kort bakom loggan: en ren canasta i kungar och en joker
    const ids = [104, 12, 25, 38, 51, 64, 77, 1];
    ids.forEach((id, i) => {
      const c = h('div', {class: 'tcard', style: {'--i': i - (ids.length - 1) / 2}});
      c.innerHTML = typeof Art !== 'undefined' && Art.face ? Art.face(id) : '';
      fan.append(c);
    });
    // Träffpunkt Hemmas märke ovanför namnet (i stället för Canastaklubbens logga)
    const logo = h('div', {class: 'logo th-logo'}, h('span', {class: 'th-brand', html: Hemma.mark(34) + '<span>Träffpunkt Hemma</span>'}), h('span', {class: 'l1'}, 'Canasta'));
    const saved = Net.savedSolo();
    const btns = h('div', {class: 'titlebtns'});
    if (saved) btns.append(UI.btn('Fortsätt partiet', () => resumeSolo(saved), {cls: 'gold big', icon: 'play'}));
    btns.append(UI.btn('Spela mot datorn', () => M.solo(), {cls: (saved ? '' : 'gold ') + 'big', icon: 'robot'}));
    btns.append(UI.btn('Så spelar man', () => M.rules(), {cls: 'big ghost', icon: 'help'}));
    const small = h('div', {class: 'titlesmall'},
      UI.btn('Inställningar', () => M.settings(), {icon: 'gear', cls: 'ghost'}),
      UI.btn('Statistik', () => M.stats(), {icon: 'chart', cls: 'ghost'}));
    root.append(h('div', {class: 'titlewrap'}, fan, logo, h('p', {class: 'tagline'}, 'Kortspelet för två, tre eller fyra. Fyra spelar två mot två.'), btns, small, Hemma.nextBox()));
  }
  function resumeSolo(saved) {
    try {
      const s = new Net.LocalSession({restore: saved.S});
      Game.start(s, {fresh: false});
    } catch (e) { console.error(e); Store.del('solo'); UI.toast('Partiet gick inte att återuppta.'); title(); }
  }

  /* ---------- Nytt parti mot datorn ---------- */
  const soloOpts = Object.assign({players: 4, level: 'medel', target: 5000, need: 0, ask: true, frozen: false}, Store.get('soloOpts', {}));
  M.solo = () => {
    const o = soloOpts;
    const body = h('div', {class: 'setup'});
    const houseBox = h('div', {class: 'house'});
    const renderHouse = () => {
      houseBox.textContent = '';
      const defNeed = Rules.VARIANTS[o.players].need;
      if (o.need === defNeed) o.need = 0;
      houseBox.append(M.field('Canastor för att gå ut', M.seg([[0, `Vanligt (${defNeed === 1 ? 'en' : 'två'})`], defNeed === 1 ? [2, 'Två'] : [1, 'En']], o.need, v => { o.need = v; })));
      if (o.players === 4) houseBox.append(M.toggle('Fråga partnern', o.ask, v => { o.ask = v; }, '”Får jag gå ut?” – partnern svarar ja eller nej'));
      houseBox.append(M.toggle('Högen alltid frusen', o.frozen, v => { o.frozen = v; }, 'Högen tas bara med två naturliga kort'));
    };
    body.append(
      M.field('Spelare', M.seg([[2, 'Två', 'du mot en'], [3, 'Tre', 'alla mot alla'], [4, 'Fyra', 'två mot två']], o.players, v => { o.players = v; renderHouse(); })),
      M.field('Datorns nivå', M.seg([['latt', 'Lätt'], ['medel', 'Medel'], ['svar', 'Svår']], o.level, v => { o.level = v; })),
      M.field('Spela till', M.seg(M.TARGETS, o.target, v => { o.target = v; })),
      Hemma.cfg ? null : nameRow()
    );
