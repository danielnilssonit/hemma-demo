    const more = h('details', {class: 'more'}, h('summary', {}, 'Husregler'), houseBox);
    body.append(more);
    renderHouse();
    UI.sheet({title: 'Nytt parti', cls: 'setupsheet', body, buttons: [{label: 'Börja spela', cls: 'gold', icon: 'play', onClick: () => startSolo()}]});
  };
  function nameRow() {
    const inp = h('input', {type: 'text', maxlength: 14, placeholder: 'Ditt namn', value: Profile.name || '', autocomplete: 'nickname'});
    inp.oninput = () => { Profile.name = Net.plain(inp.value, 14); saveProfile(); };
    const av = h('button', {type: 'button', class: 'avpick', 'aria-label': 'Välj figur'}, Profile.avatar || '🙂');
    av.onclick = () => M.pickAvatar(a => { av.textContent = a; });
    return M.field('Ditt namn', h('div', {class: 'namerow'}, av, inp));
  }
  // partiets längd (samma val mot datorn och online)
  M.TARGETS = [[5000, '5 000', 'poäng'], [3000, '3 000', 'poäng'], [1500, '1 500', 'poäng'], [0, 'En giv', 'snabbt']];
  M.nameRow = nameRow;
  M.pickAvatar = cb => {
    const grid = h('div', {class: 'avgrid'});
    const sheet = UI.sheet({title: 'Välj figur', cls: 'small', body: grid});
    UI.AVATARS.forEach(a => grid.append(h('button', {type: 'button', class: 'avopt' + (a === Profile.avatar ? ' on' : ''), onclick: () => { Profile.avatar = a; saveProfile(); cb(a); sheet.close(); }}, a)));
  };
  async function startSolo() {
    const o = soloOpts;
    Store.set('soloOpts', o);
    // ett sparat parti försvinner om ett nytt startas: fråga först
    const saved = Net.savedSolo();
    if (saved) {
      const S = saved.S, me = 0, mt = S.team[me];
      const score = S.teams.map((t, ti) => (S.opts.players === 4 ? (ti === mt ? 'Ni ' : 'De ') : (S.teams[ti].seats[0] === me ? 'Du ' : S.seats[S.teams[ti].seats[0]].name + ' ')) + fmt(t.score)).join(' · ');
      let choice = null;
      await new Promise(res => UI.sheet({title: 'Du har ett parti som inte är klart', cls: 'small', onClose: res,
        body: h('p', {class: 'lead'}, `Giv ${S.round} · ${score}. Vill du börja ett nytt parti? Det gamla försvinner då.`),
        buttons: [{label: 'Fortsätt det gamla', cls: 'gold', onClick: () => { choice = 'old'; }}, {label: 'Börja nytt', cls: 'danger', onClick: () => { choice = 'new'; }}]}));
      if (choice === 'old') { UI.closeAll(); return resumeSolo(saved); }
      if (choice !== 'new') return;
      UI.closeAll();
    }
    const n = o.players;
    const names = shuffle(AI.NAMES.slice());
    const seats = [Hemma.cfg ? {name: Hemma.cfg.me.name, kind: 'human', av: Hemma.cfg.me.av} : {name: Net.plain(Profile.name) || 'Du', kind: 'human', av: Profile.avatar || '🙂'}];
    for (let i = 1; i < n; i++) seats.push({name: names[i].name, av: names[i].av, kind: 'cpu', level: o.level});
    const opts = {target: o.target, ask: o.ask, frozen: o.frozen};
    if (o.need) opts.need = o.need;
    Store.del('solo');
    Game.start(new Net.LocalSession({players: n, seats, opts}), {fresh: true});
  }

  /* ---------- Första gången ---------- */
  // En enkel fråga första gången spelet startas: lugnt och tydligt, eller som vanligt
  M.intro = () => {
    Store.set('intro', true);
    let sheet = null;
    const opt = (title, sub, on) => h('button', {type: 'button', class: 'introopt' + (on ? ' calm' : ''), onclick: () => {
      Sound.unlock(); Sound.play('click');
      if (on) Main.setCalm(true);
      sheet.close();
      if (on) UI.toast('Lugnt och tydligt är påslaget. Det går att ändra under Inställningar.');
    }}, h('b', {}, title), h('span', {}, sub));
    const body = h('div', {class: 'intro'},
      h('p', {class: 'lead'}, 'Hur vill du ha det?'),
      opt('Lugnt och tydligt', 'Större kort, lugnare tempo och en fråga innan det som inte går att ångra', true),
      opt('Som vanligt', 'Vanligt tempo. Allt går att ändra under Inställningar', false));
    sheet = UI.sheet({title: 'Välkommen till Canasta', cls: 'small introsheet', body, dismiss: false});
  };

  /* ---------- Inställningar ---------- */
  M.settings = () => {
    const body = h('div', {class: 'settings'});
    const set = (k, v) => { Settings[k] = v; saveSettings(); };
    const add = (...xs) => body.append(...xs.filter(Boolean));
    const fill = () => {
    body.textContent = '';
    add(
      M.toggle('Lugnt och tydligt', Settings.calm, v => { Main.setCalm(v); fill(); }, 'Lugnare tempo, större kort och text, längre tid att ångra och en fråga innan det som inte går att ångra'),
      h('h3', {}, 'Ljud'),
      M.range('Ljudeffekter', Settings.sfx, v => { set('sfx', v); Sound.setVolumes(); }),
      Sound.hasMusic() ? M.range('Musik', Settings.music, v => { set('music', v); Sound.setVolumes(); Sound.music(Menu.screen() === 'table' ? 'spel' : 'meny'); }) : null,
      M.toggle('Vibration', Settings.haptics, v => set('haptics', v)),
      h('h3', {}, 'Spelet'),
      M.field('Tempo', M.seg([['lugn', 'Lugnt'], ['normal', 'Normalt'], ['snabb', 'Snabbt']], Settings.speed, v => set('speed', v))),
      M.toggle('Hjälp och tips', Settings.hints, v => { set('hints', v); Play.renderBar(); Table.refresh(); }, 'Visar vad som går att göra och varnar för slängar som ger bort högen'),
      M.toggle('Bekräfta innan jag går ut', Settings.confirmOut, v => set('confirmOut', v)),
      M.toggle('Ångra slänget', Settings.undo !== false, v => set('undo', v), 'Mot datorn: en knapp för att ta tillbaka det senaste slänget en stund efteråt'),
      M.toggle('Visa alltid förslaget innan jag tar högen', !!Settings.takeAsk, v => set('takeAsk', v), 'Att ta högen går inte att ångra'),
      M.toggle('Fråga innan jag slänger', !!Settings.confirmDiscard, v => set('confirmDiscard', v), 'När slänget inte går att ångra (över nätet)'),
      M.toggle('Dubbeltryck väljer alla av samma valör', Settings.dbl !== false, v => set('dbl', v), 'Knappen "Alla sjuor" (eller vilken valör det är) gör samma sak'),
      UI.btn('Visa förklaringarna igen', () => { Coach.reset(); UI.toast('Förklaringarna visas igen i nästa parti.'); }, {cls: 'ghost small', icon: 'bulb'}),
      h('h3', {}, 'Utseende'),
      M.toggle('Lugna animationer', !!Settings.calmFx, v => { set('calmFx', v); Main.applyLook(); }, 'Inga pulserande sken och ingen konfetti'),
      M.toggle('Stjärna på vilda kort', Settings.wildMark, v => { set('wildMark', v); Main.installArt(); }, 'Tvåor och jokrar får en guldstjärna'),
      M.toggle('Fyrfärgslek', Settings.fourColor, v => { set('fourColor', v); Main.installArt(); }, 'Ruter blå och klöver grön'),
      M.field('Storlek på kort och text', M.seg([['normal', 'Normal'], ['stor', 'Stor'], ['xstor', 'Extra stor']], Settings.size, v => { set('size', v); Main.applyLook(); Table.refresh(); })),
      M.field('Bordet', M.seg([['bla', 'Kvällsblått'], ['gron', 'Grönt'], ['rod', 'Vinrött'], ['svart', 'Svart']], Settings.felt, v => { set('felt', v); document.body.dataset.felt = v; }))
    );
    };
    fill();
    UI.sheet({title: 'Inställningar', body, cls: 'settingssheet'});
  };

  /* ---------- Statistik ---------- */
  M.stats = () => {
    const s = Stats;
    const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
    const rows = [
      ['Partier', s.games], ['Vunna', `${s.wins} (${pct(s.wins, s.games)})`], ['Online', `${s.online} (${s.onlineWins} vunna)`],
      ['Givar', s.rounds], ['Rena canastor', s.natural], ['Blandade canastor', s.mixed], ['Röda treor', s.red3],
      ['Gått ut', s.out], ['Dolda utgångar', s.concealed], ['Bästa giv', s.bestRound == null ? '–' : fmt(s.bestRound)], ['Bästa parti', s.bestGame == null ? '–' : fmt(s.bestGame)]
    ];
    const tbl = h('table', {class: 'stattable'}, ...rows.map(([a, b]) => h('tr', {}, h('td', {}, a), h('td', {}, String(b)))));
    UI.sheet({title: 'Statistik', cls: 'small', body: tbl, buttons: [{label: 'Nollställ', cls: 'ghost', close: false, onClick: async sh => {
      if (await UI.confirm('Nollställa all statistik på den här enheten?', {yes: 'Nollställ', danger: true})) { Object.keys(Stats).forEach(k => { Stats[k] = typeof Stats[k] === 'number' ? 0 : null; }); saveStats(); sh.close(); M.stats(); }
    }}]});
  };

  /* ---------- Poängen hittills ---------- */
  M.history = V => {
    if (!V) return;
    const cols = V.teams.map((_, i) => i);
    const me = V.me, myTeam = me >= 0 ? V.team[me] : -1;
    const name = ti => V.opts.players === 4 ? (ti === myTeam ? 'Ni' : 'De') : (V.teams[ti].seats[0] === me ? 'Du' : V.seats[V.teams[ti].seats[0]].name);
    const tbl = h('table', {class: 'scoretable hist'}, h('tr', {}, h('th', {}, 'Giv'), ...cols.map(ti => h('th', {style: {'--tc': UI.teamColor(ti, myTeam, V.teams.length)}}, name(ti)))));
    V.hist.forEach(hh => tbl.append(h('tr', {}, h('td', {}, String(hh.round)), ...cols.map(ti => h('td', {class: hh.totals[ti] < 0 ? 'neg' : ''}, (hh.totals[ti] > 0 ? '+' : '') + fmt(hh.totals[ti]))))));
    tbl.append(h('tr', {class: 'total'}, h('td', {}, 'Totalt'), ...cols.map(ti => h('td', {}, h('b', {}, fmt(V.teams[ti].score))))));
    const note = h('p', {class: 'muted'}, V.opts.target ? `Först till ${fmt(V.opts.target)} vinner. Minimipoäng för första utlägget: ` + cols.map(ti => `${name(ti)} ${Rules.minFor(V, ti)}`).join(', ') + '.' : 'En giv.');
    UI.sheet({title: 'Poängen hittills', cls: 'small', body: h('div', {}, V.hist.length ? tbl : h('p', {}, 'Ingen giv är klar än.'), note)});
  };

  /* ---------- Regler ---------- */
  M.rules = (section) => Help.show(section);

  return M;
})();

/* ---- 14-help.js ---- */
/* ================= Så spelar man: reglerna och hur spelet används ================= */
const Help = (() => {
  const H = {};
  const c = (...ids) => `<span class="rcards">${ids.map(id => `<span class="mcard">${typeof Art !== 'undefined' && Art.face ? Art.face(id) : Cards.label(id)}</span>`).join('')}</span>`;
  // kort: valör 1–13, färg 0 ♠ 1 ♥ 2 ♦ 3 ♣ (lek 0)
  const k = (r, s = 0, d = 0) => d * 52 + s * 13 + r - 1;
  const SECTIONS = [
    ['Hur man trycker', () => `
      <ul><li><b>Dra:</b> tryck på talongen (eller på knappen Dra).</li>
      <li><b>Ta högen:</b> tryck på högen (eller Ta högen). Har du valt kort används de, annars föreslår spelet hur. I läget Lugnt och tydligt visas förslaget alltid först.</li>
      <li><b>Välja kort:</b> tryck på korten på handen, så lyfts de upp. Tryck igen för att lägga tillbaka. Knappen <b>Alla sjuor</b> (eller vilken valör det är) väljer resten av korten av samma valör.</li>
      <li><b>Lägga ut:</b> välj korten och tryck på en av lagets mälningar, eller på + för en ny mälning. Mälningar som korten passar på lyser. Det du lägger ut syns med guldkant och kan ångras tills du slänger.</li>
      <li><b>Släng:</b> välj ett kort och tryck på högen (eller Släng). Då skickas hela draget.</li>
      <li><b>Ångra slänget:</b> mot datorn kan du ta tillbaka slänget en stund efteråt. Listen på knappen visar hur länge.</li>
      <li><b>Gå ut:</b> knappen dyker upp när det går. Spelet lägger ut allt på bästa sätt och frågar först.</li>
      <li><b>Vad hände?</b> Tryck på raden om det senaste draget (eller Meny → Senaste dragen) för att se de senaste dragen.</li>
      <li><b>Tips:</b> föreslår vad datorn (svår) skulle göra.</li>
      <li><b>Lugnt och tydligt:</b> under Inställningar finns ett läge med lugnare tempo, större kort och fler frågor innan något händer som inte går att ångra.</li></ul>`],
    ['Spelet på en minut', () => `
      <p>Canasta spelas med två kortlekar och fyra jokrar. Man samlar kort av samma valör i <b>mälningar</b> på bordet.
      En mälning med sju eller fler kort är en <b>canasta</b>, och det är den som ger de stora poängen. Partiet är slut när
      något lag har nått ${fmt(5000)} poäng (eller målet ni har valt), och det lag som då har flest poäng vinner. Är ni fyra
      spelar ni två mot två, och lagkamraterna lägger ut på samma mälningar.</p>
      <ol><li><b>Dra</b> ett kort från talongen, eller <b>ta hela högen</b> om du kan använda översta kortet.</li>
      <li><b>Lägg ut</b> kort om du vill, i nya mälningar eller på lagets mälningar.</li>
      <li><b>Släng</b> ett kort på högen. Då är det nästa spelares tur.</li></ol>
      <p>Med två eller tre spelare drar man två kort från talongen men slänger bara ett.</p>`],
    ['Korten', () => `
      <p><b>Vilda kort:</b> tvåor och jokrar kan ersätta vilket kort som helst i en mälning (utom svarta treor). ${c(1, 104)}</p>
      <p><b>Röda treor</b> är bonuskort. De läggs fram direkt (spelet gör det åt dig) och du får ett nytt kort. ${c(k(3, 1), k(3, 2))}</p>
      <p><b>Svarta treor</b> är stoppkort: den som slänger en svart trea hindrar nästa spelare från att ta högen. De kan bara läggas ut när man går ut, tre eller fyra åt gången och utan vilda kort. ${c(k(3, 0), k(3, 3))}</p>
      <table class="ptable"><tr><td>Joker</td><td>50</td></tr><tr><td>Ess, tvåa</td><td>20</td></tr><tr><td>Kung–åtta</td><td>10</td></tr><tr><td>Sjua–fyra, svart trea</td><td>5</td></tr><tr><td>Röd trea</td><td>100 (bonus)</td></tr></table>`],
    ['Mälningar och canastor', () => `
      <p>En mälning är minst <b>tre kort av samma valör</b>, med minst <b>två naturliga</b> kort och högst <b>tre vilda</b>. ${c(k(13, 0), k(13, 1), 1)}</p>
      <p>Laget har bara en mälning per valör: lägger du fler kungar hamnar de i samma mälning. Du kan alltid lägga till naturliga kort och vilda kort (så länge det är högst tre vilda).</p>
      <p>Sju kort eller fler är en <b>canasta</b>. <b>Ren canasta</b> (inga vilda kort) ger 500 poäng, <b>blandad</b> ger 300. På bordet läggs canastan ihop i en hög med ett rött kort överst om den är ren och ett svart om den är blandad.</p>`],
    ['Första utlägget', () => `
      <p>Lagets första utlägg i varje giv måste vara värt minst ett visst antal poäng (bara kortens värde räknas, inte bonusar):</p>
      <table class="ptable"><tr><td>Lagets poäng under 0</td><td>15</td></tr><tr><td>0 – ${fmt(1495)}</td><td>50</td></tr><tr><td>${fmt(1500)} – ${fmt(2995)}</td><td>90</td></tr><tr><td>${fmt(3000)} och mer</td><td>120</td></tr></table>
      <p>Du får använda flera mälningar i samma drag för att nå minimipoängen. Efter det kan laget lägga ut fritt resten av given. Poängen du behöver syns vid lagets namn högst upp.</p>`],
    ['Högen', () => `
      <p>I stället för att dra kan du ta <b>hela högen</b>. Då måste du genast lägga ut översta kortet: tillsammans med <b>två naturliga kort</b> av samma valör från handen, med <b>ett naturligt och ett vilt</b>, eller till en mälning som laget redan har.</p>
      <p><b>Frusen hög:</b> högen är frusen för alla när den innehåller ett vilt kort eller en röd trea (kortet ligger på tvären), antingen för att någon har slängt ett vilt kort eller för att ett sådant kort vändes upp i given. Den är också frusen för ett lag som ännu inte har lagt ut. En frusen hög tas bara med <b>två naturliga kort</b> av samma valör som översta kortet.</p>
      <p>Högen går inte att ta när översta kortet är vilt eller en svart trea. Tar laget högen för sitt första utlägg räknas bara översta kortet och korten från handen till minimipoängen. En röd trea i högen läggs fram hos laget, men du får inget nytt kort för den.</p>
      <p>Tryck på högen när det är din tur, så föreslår spelet hur du kan ta den (eller förklarar varför det inte går).</p>`],
    ['Gå ut', () => `
      <p>Du går ut genom att lägga ut alla kort, eller alla utom ett som du slänger. Det går bara när laget har minst en canasta (två med två eller tre spelare, om inget annat är valt under Husregler). Laget får 100 poäng för utgången.</p>
      <p><b>Dold utgång:</b> lägger du ut hela handen i ett enda drag, med en egen canasta, utan att ha lagt ut något tidigare i given och utan att lägga kort på din partners mälningar, blir det 200 poäng. Då behövs ingen minimipoäng, utom om du tar högen innan laget har lagt ut.</p>
      <p><b>Får jag gå ut?</b> Med fyra spelare kan du fråga din partner först (om inte frågan är avstängd under Husregler). Frågan ställs efter att du har dragit eller tagit högen, innan du lägger ut något mer. Svarar partnern ja måste du gå ut, svarar partnern nej får du inte gå ut i det draget.</p>
      <p>Utan tillräckligt med canastor måste du alltid ha minst ett kort kvar efter att du har slängt.</p>`],
    ['När talongen tar slut', () => `
      <p>När talongen är slut fortsätter given så länge spelarna tar högen. Passar översta kortet en av lagets mälningar och högen inte är frusen <b>måste</b> du ta den. Annars tar given slut när någon inte kan eller vill ta högen.</p>
      <p>Är det sista kortet i talongen en röd trea tar given slut direkt.</p>`],
    ['Poängen', () => `
      <p>När given är slut får varje lag:</p>
      <ul><li>500 för varje ren canasta och 300 för varje blandad</li><li>100 för varje röd trea (800 för alla fyra), <b>minus</b> lika mycket om laget inte har lagt ut något</li><li>100 för att gå ut (200 för dold utgång)</li><li>värdet av alla kort laget har lagt ut</li><li><b>minus</b> värdet av korten som är kvar på händerna</li></ul>
      <p>Partiet är slut när något lag har nått målet efter en giv. Det lag som har flest poäng vinner. Står det lika i toppen spelas en giv till.</p>`],
    ['Två eller tre spelare', () => `
      <p><b>Två spelare:</b> 15 kort var. Man drar två kort från talongen och slänger ett. Det krävs två canastor för att gå ut.</p>
      <p><b>Tre spelare:</b> 13 kort var, alla mot alla. Man drar två kort och slänger ett, och det krävs två canastor för att gå ut.</p>
      <p><b>Fyra spelare:</b> 11 kort var, två mot två (partnern sitter mitt emot). Man drar ett kort och det räcker med en canasta för att gå ut.</p>`],
    ['Husregler', () => `

      <li>Den som får länken trycker på den, skriver sitt namn och hamnar vid bordet. Det går också att skriva bordets fyra bokstäver under <b>Spela online</b>.</li>
      <li>Lediga platser kan fyllas med datorer. Värden trycker på <b>Starta partiet</b>.</li></ol>
      <p>På en iPad eller telefon kan du lägga spelet på hemskärmen (i Safari: Dela → Lägg till på hemskärmen), så får det en egen ikon.</p>
      <p>Alla spelar i sin egen telefon, platta eller dator och ser bara sina egna kort. Tappar någon anslutningen spelar datorn åt den personen efter en stund, och när den kommer tillbaka (öppna länken igen) fortsätter den där den var.</p>`],
    ['Om spelet', () => `
      <p>Canastaklubben följer de klassiska canastareglerna. Kortbilderna är ritade för spelet, ljudeffekterna skapas i webbläsaren och musiken är gjord med Suno.</p>
      <p>Mot datorn fungerar spelet även utan internet. Över nätet hittar spelarna varandra via öppna servrar, och varje spelares kort skickas krypterade.</p>`],
    ['Tips för att vinna', () => `
      <ul><li>Högen är det mest värdefulla i spelet. Spara par på handen så att du kan ta en frusen hög.</li>
      <li>Släng inte kort som motståndarna har mälningar av när högen inte är frusen, då tar de den.</li>
      <li>Svarta treor är de säkraste korten att slänga. Kort som nästa spelare nyss har slängt är också ganska säkra.</li>
      <li>Är högen stor och farlig kan du frysa den med ett vilt kort.</li>
      <li>Gå ut när ni leder, eller när motståndarna sitter med många kort på handen.</li></ul>`]
  ];
  H.show = (open = 0) => {
    const body = h('div', {class: 'rules'});
    SECTIONS.forEach(([title, html], i) => {
      const d = h('details', {class: 'rule', open: i === open || null}, h('summary', {}, title), h('div', {class: 'rbody', html: html()}));

    UI.sheet({title: 'Så spelar man', cls: 'rulesheet', body});

/* ---- 14b-hemma.js ---- */
/* ================= Träffpunkt Hemma: spelet inne i plattan ================= */
// Träffpunkt Hemmas egen Canasta (en kopia av Canastaklubben, se games/README.md). Öppnas den i plattans ram
// säger den till plattan att den är redo (postMessage) och får inställningarna därifrån: själv eller vid ett bord på
// Spelstunden, namnet, namnen vid bordet, textstorleken, om ljudet ska höras och en rad om nästa Spelstund. Den
// berättar tillbaka när någon lägger en canasta, går ut eller vinner, så att bordet kan prata om det.
// Öppnas sidan direkt, utan plattan, är den ett vanligt spel mot datorn.
//   spelet → plattan: {thGame: 'canasta', t: 'ready' | 'leave' | 'spelstund' | 'event', …}
//   plattan → spelet: {thHemma: 1, t: 'init', mode: 'solo' | 'table', me: {name, av}, size, calm, sound, music,
//                      table: {name, seats: [{name, av}], level, target}, next: {title, text, label}}
//                     {thHemma: 1, t: 'sound', on}
const Hemma = (() => {
  const H = {cfg: null};
  let framed = false;
  try { framed = window.parent !== window; } catch (e) { framed = true; }
  H.framed = framed;
  H.send = msg => {
    if (!framed) return;
    try { parent.postMessage(Object.assign({thGame: 'canasta'}, msg), '*'); } catch (e) { /* plattan lyssnar inte */ }
  };
  const fromHemma = e => framed && e.source === parent && e.data && typeof e.data === 'object' && e.data.thHemma;

  // Väntar på plattans inställningar (högst ett par sekunder; utan svar blir det ett vanligt spel)
  H.init = () => new Promise(resolve => {
    if (!framed) { resolve(null); return; }
    let done = false;
    const finish = cfg => {
      if (done) return;
      done = true;
      removeEventListener('message', onMsg);
      if (cfg) apply(cfg);
      resolve(H.cfg);
    };
    const onMsg = e => { if (fromHemma(e) && e.data.t === 'init') finish(e.data); };
    addEventListener('message', onMsg);
    H.send({t: 'ready'});
    setTimeout(() => finish(null), 2500);
  });
  // Ljudet av eller på från plattan medan spelet är öppet
  addEventListener('message', e => {
    if (!fromHemma(e) || !H.cfg || e.data.t !== 'sound') return;
    H.cfg.sound = !!e.data.on;
    Sound.music(Menu.screen() === 'table' ? 'spel' : 'meny');
  });

  function apply(cfg) {
    H.cfg = Object.assign({mode: 'solo', me: {name: 'Du', av: '🙂'}, sound: true, music: true, calm: true}, cfg);
    // första gången: plattans läge (lugnt och tydligt) i stället för frågan
    if (!Store.get('intro', false)) { Store.set('intro', true); if (H.cfg.calm) setCalm(true); }
    if (['normal', 'stor', 'xstor'].includes(H.cfg.size) && Settings.size !== H.cfg.size) { Settings.size = H.cfg.size; saveSettings(); }
    // plattans ljud gäller: av i demon betyder tyst, och vid bordet spelas ingen musik (då hörs rösterna)
    const play = Sound.play, music = Sound.music;
    Sound.play = (...a) => { if (H.cfg.sound !== false) play(...a); };
    Sound.music = name => music(H.cfg.sound === false || H.cfg.music === false ? null : name);
    document.documentElement.classList.add('in-hemma');
  }

  H.atTable = () => !!(H.cfg && H.cfg.mode === 'table');
  // Bordet på Spelstunden: plattan har redan satt ihop det. Den första platsen är den som spelar på plattan;
  // med fyra spelar plats 1 och 3 ihop (plattan sätter vännen där). I demon spelar datorn de andras kort.
  H.startTable = cfg => {
    const t = cfg.table || {};
    const people = (t.seats || []).slice(0, 4);
    const n = clamp(people.length, 2, 4);
    while (people.length < n) people.push({name: AI.NAMES[people.length].name, av: AI.NAMES[people.length].av});
    const seats = people.map((p, i) => i === 0 ? {name: p.name, kind: 'human', av: p.av} : {name: p.name, av: p.av, kind: 'cpu', level: t.level || 'medel'});
    const opts = {target: t.target != null ? t.target : 1500, ask: true, frozen: false};
    Game.start(new Net.LocalSession({players: n, seats, opts, saveKey: null}), {fresh: true});
  };

  // Det som händer vid bordet, så att de andra kan säga något om det (plattan visar det i textningen)
  H.onEvent = (view, e, seat) => {
    if (!H.cfg) return;
    const name = i => (view.seats[i] || {}).name || '';
    const me = view.me;
    if (e.t === 'canasta') H.send({t: 'event', kind: 'canasta', who: name(seat), mine: seat === me, natural: !!e.natural});
    else if (e.t === 'end') {
      const over = !!e.over, won = over && me >= 0 && view.winner === view.team[me];
      H.send({t: 'event', kind: over ? 'over' : 'hand', out: e.out != null && e.out >= 0 ? name(e.out) : '', outMine: e.out === me, won,
        winners: over && view.teams[view.winner] ? view.teams[view.winner].seats.map(name) : []});
    }
  };

  // Rutan om nästa Spelstund på startskärmen (bara i plattan)
  H.nextBox = () => {
    const n = H.cfg && H.cfg.next;
    if (!n) return null;
    return h('div', {class: 'th-next'},
      h('span', {class: 'th-next-ic', html: UI.icon('users')}),
      h('p', {}, h('b', {}, n.title || 'Spelstunden'), h('br'), n.text || ''),
      n.label ? UI.btn(n.label, () => H.send({t: 'spelstund'}), {cls: 'gold', icon: 'users'}) : null);
  };

  // Träffpunkt Hemmas märke: huset med lampan i fönstret
  H.mark = (size = 34) => `<svg viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true"><path d="M6 22 24 7l18 15v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V22Z" fill="#2E5883"/><path d="M3 23.5 24 6l21 17.5" fill="none" stroke="#F2A516" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="29" r="11" fill="#FFD27A" opacity=".28"/><rect x="17.5" y="22.5" width="13" height="13" rx="1.5" fill="#FFD27A"/><path d="M24 22.5v13M17.5 29h13" stroke="#2E5883" stroke-width="1.6"/></svg>`;

  // Figuren i ringen: initialer (som i plattan) eller en figur
  H.av = v => h('span', {class: 'av' + (/^[A-ZÅÄÖ]{1,2}$/.test(v || '') ? ' ini' : '')}, v);
  // Presentationsklickern (PageDown och PageUp) styr den guidade visningen i plattan även när spelet har fokus
  addEventListener('keydown', e => { if (framed && (e.key === 'PageDown' || e.key === 'PageUp')) { e.preventDefault(); H.send({t: 'key', key: e.key}); } });
  return H;
})();

/* ---- 15-main.js ---- */
/* ================= Start ================= */
const Main = (() => {
  const A = {};
  const setLoad = (p, text) => { const b = $('loadBar'); if (b) b.style.width = Math.round(p * 100) + '%'; if (text && $('loadText')) $('loadText').textContent = text; };
  // Inget spel över nätet i Träffpunkt Hemmas version: med andra spelar man på Spelstunden i plattan
  A.onlineOk = () => false;

  // Bordets färg, storleken och lugna animationer (klasser på body som stilarna utgår från)
  A.applyLook = () => {
    document.body.dataset.felt = Settings.felt || 'gron';
    document.body.dataset.size = Settings.size || 'normal';
    document.body.classList.toggle('calm', !!Settings.calmFx || reduceMotion);
    document.body.classList.toggle('calmui', !!Settings.calm);
  };
  // "Lugnt och tydligt" av eller på: inställningarna, kortbilderna, synligheten i lobbyn och bordet
  A.setCalm = on => {
    setCalm(on);
    A.applyLook();
    A.installArt();
    if (typeof Lobby !== 'undefined' && Lobby.visibility) Lobby.visibility();
    if (Game.active()) { Table.refresh(); Play.renderBar(); }
  };
  A.installArt = () => {
    if (typeof Art !== 'undefined' && Art.install) Art.install({fourColor: !!Settings.fourColor, wildMark: Settings.wildMark !== false});
    if (Game.active()) Table.refresh(0);
  };

  // Skärmen släcks inte under ett parti
  let wake = null, wakeWant = false;
  A.keepAwake = on => {
    wakeWant = !!on;
    if (!on) { if (wake) { wake.release().catch(() => {}); wake = null; } return; }
    if (wake || !navigator.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(l => { wake = l; l.addEventListener('release', () => { if (wake === l) wake = null; }); if (!wakeWant) A.keepAwake(false); }).catch(() => {});
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wakeWant) A.keepAwake(true); });

  // Konfetti när man vinner
  A.confetti = () => {
    if (reduceMotion || Settings.calmFx) return;
    const box = h('div', {class: 'confetti'});
    const colors = ['#d6b25e', '#f1d99a', '#c0162c', '#fbf7ee', '#1d3461', '#7fb6e0'];
    for (let i = 0; i < 90; i++) {
      box.append(h('i', {style: {left: Math.random() * 100 + '%', background: colors[i % colors.length], '--dx': (Math.random() * 160 - 80) + 'px', '--r': (Math.random() * 720 - 360) + 'deg', animationDelay: (Math.random() * .9) + 's', animationDuration: (2.2 + Math.random() * 1.6) + 's', width: (6 + Math.random() * 6) + 'px', height: (8 + Math.random() * 8) + 'px'}}));
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 5200);
  };

  A.boot = async () => {
    setLoad(.2, 'Blandar korten …');
    A.applyLook();
    document.body.classList.toggle('touch', isTouch);
    await sleep(30);
    try { A.installArt(); } catch (e) { console.error(e); }
    setLoad(.6, 'Dukar bordet …');
    Table.init({onTap: t => Play.onTap(t), hud: {menu: () => Game.menu(), extra: () => typeof Lobby !== 'undefined' && Lobby.hudExtra ? Lobby.hudExtra() : []}});
    Play.init({send: a => { const s = Game.session(); return s ? s.send(a) : 'Inget parti.'; }});
    const unlock = () => Sound.unlock();
    ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlock, {passive: true}));
    // typsnitten ska vara laddade innan bordet mäts upp
    try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, sleep(1500)]); } catch (e) { /* strunt samma */ }
    // i plattan: vänta på inställningarna därifrån (själv eller vid ett bord, namnen, storleken, ljudet)
    const cfg = await Hemma.init();
    setLoad(1, 'Välkommen!');
    if (cfg && cfg.mode === 'table') Hemma.startTable(cfg); else Menu.show('title');
    $('loading').classList.add('done');
    setTimeout(() => { const l = $('loading'); if (l) l.remove(); }, 700);
    // första gången utanför plattan: lugnt och tydligt eller som vanligt? (i plattan bestämmer plattans inställningar)
    if (!cfg && !Store.get('intro', false) && !Net.savedSolo()) setTimeout(() => { if (Menu.screen() === 'title' && !UI.topSheet()) Menu.intro(); }, 500);
  };
  return A;
})();

if (/[?&]debug\b/.test(location.search)) window.CK = {Game: typeof Game !== 'undefined' ? Game : null, Net: typeof Net !== 'undefined' ? Net : null, Rules: typeof Rules !== 'undefined' ? Rules : null, Plan: typeof Plan !== 'undefined' ? Plan : null, Cards: typeof Cards !== 'undefined' ? Cards : null, AI: typeof AI !== 'undefined' ? AI : null, Table: typeof Table !== 'undefined' ? Table : null, Play: typeof Play !== 'undefined' ? Play : null, Coach: typeof Coach !== 'undefined' ? Coach : null, Menu: typeof Menu !== 'undefined' ? Menu : null, Help: typeof Help !== 'undefined' ? Help : null, UI: typeof UI !== 'undefined' ? UI : null, Sound: typeof Sound !== 'undefined' ? Sound : null, Time: typeof Time !== 'undefined' ? Time : null, Settings: typeof Settings !== 'undefined' ? Settings : null, Profile: typeof Profile !== 'undefined' ? Profile : null, Stats: typeof Stats !== 'undefined' ? Stats : null, Store: typeof Store !== 'undefined' ? Store : null, Bus: typeof Bus !== 'undefined' ? Bus : null, Art: typeof Art !== 'undefined' ? Art : null, Main: typeof Main !== 'undefined' ? Main : null, Hemma: typeof Hemma !== 'undefined' ? Hemma : null};

Main.boot();
})();
