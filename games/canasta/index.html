    o += `<path d="M${x - rx + .5},${y + 1}${beard}C${x + rx - 4},${y + 12} ${x + 9},${y + 15} ${x},${y + 15}C${x - 9},${y + 15} ${x - rx + 4},${y + 12} ${x - rx + .5},${y + 1}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 10},${y + 19}C${x - 10},${y + 29} ${x - 6},${y + 37} ${x - 1.5},${y + 43}M${x + 10},${y + 19}C${x + 10},${y + 29} ${x + 6},${y + 37} ${x + 1.5},${y + 43}M${x - 4},${y + 21}C${x - 4},${y + 30} ${x - 2},${y + 36} ${x},${y + 40}M${x + 4},${y + 21}C${x + 4},${y + 30} ${x + 2},${y + 36} ${x},${y + 40}" fill="none" stroke="${INK}" stroke-width="1" opacity=".45"/>`;
    o += `<path d="M${x},${y + 10}C${x - 3},${y + 8} ${x - 10},${y + 8} ${x - 15},${y + 14}C${x - 9},${y + 13} ${x - 4},${y + 14} ${x},${y + 13}C${x + 4},${y + 14} ${x + 9},${y + 13} ${x + 15},${y + 14}C${x + 10},${y + 8} ${x + 3},${y + 8} ${x},${y + 10}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 4},${y + 16}Q${x},${y + 19} ${x + 4},${y + 16}Z" fill="${RED}"/>`;
    const yb = y - ry + 7;
    o += `<path d="M${x - 19},${yb - 12}C${x - 20},${yb - 30} ${x - 8},${yb - 34} ${x},${yb - 34}C${x + 8},${yb - 34} ${x + 20},${yb - 30} ${x + 19},${yb - 12}Z" fill="${P.a}" ${OL}/>`;
    o += `<path d="M${x - 22},${yb - 9}L${x - 21},${yb - 29}L${x - 9},${yb - 14}L${x},${yb - 34}L${x + 9},${yb - 14}L${x + 21},${yb - 29}L${x + 22},${yb - 9}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x - 22},${yb}L${x - 23},${yb - 10}H${x + 23}L${x + 22},${yb}Z" fill="${GOLD}" ${OL}/>`;
    for (const [px, py] of [[x - 21, yb - 30], [x, yb - 35], [x + 21, yb - 30]]) o += `<circle cx="${px}" cy="${py}" r="3.3" fill="${IVORY}" ${OL}/>`;
    o += `<path d="M${x},${yb - 9}l3.5,4.5l-3.5,4.5l-3.5,-4.5z" fill="${P.gem}"/><circle cx="${x - 13}" cy="${yb - 5}" r="2.2" fill="${P.gem}"/><circle cx="${x + 13}" cy="${yb - 5}" r="2.2" fill="${P.gem}"/>`;
    return o;
  }

  // Dam: tiara, vågat page-hår, puffärmar, snörliv och pärlhalsband
  function queen(P) {
    const x = FX, y = FY + 1, rx = 17, ry = 21.5, hair = P.hair[1];
    let o = `<path d="${BODY.q}" fill="${P.a}" ${OL}/>`;
    const slv = `<path d="M73,118C64,126 60,138 60,151V172C72,170 80,160 84,148C88,136 86,126 80,120Z" fill="${P.b}" ${OL}/><path d="M66,128C70,139 70,154 65,168M76,123C80,134 80,149 75,163" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`;
    o += slv + `<g transform="${MIRROR}">${slv}</g>`;
    o += `<path d="M111,127L105,182H145L139,127Z" fill="${GOLD}" ${OL}/><path d="M113,133L137,140L112,148L138,156L111,164L139,172L110,180" fill="none" stroke="${P.a}" stroke-width="2.2"/>`;
    o += `<path d="M105,102L108.5,130H141.5L145,102" fill="none" stroke="${INK}" stroke-width="7.5"/><path d="M105,102L108.5,130H141.5L145,102" fill="none" stroke="${GOLD}" stroke-width="5"/>`;
    o += `<path d="M108,102L111,127H139L142,102Z" fill="${SKIN}"/>`;
    o += `<path d="M${x - rx - 9},${y + 20}C${x - rx - 13},${y} ${x - rx - 10},${y - ry - 8} ${x},${y - ry - 9}C${x + rx + 10},${y - ry - 8} ${x + rx + 13},${y} ${x + rx + 9},${y + 20}C${x + rx + 5},${y + 25} ${x + rx - 1},${y + 23} ${x + rx - 2},${y + 17}L${x - rx + 2},${y + 17}C${x - rx + 1},${y + 23} ${x - rx - 5},${y + 25} ${x - rx - 9},${y + 20}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 7},${y + 16}V${y + 30}H${x + 7}V${y + 16}Z" fill="${SKIN}" ${OL}/>`;
    let pearls = '';
    for (let i = 0; i <= 7; i++) { const t = i / 7; pearls += `<circle cx="${n(113 + 24 * t)}" cy="${n(y + 29 + 6 * Math.sin(Math.PI * t))}" r="2.3" fill="${IVORY}" stroke="${INK}" stroke-width="1"/>`; }
    o += pearls + `<path d="M${x},${y + 36}l3,4l-3,5l-3,-5z" fill="${P.gem}" ${OL}/>`;
    o += face(x, y, rx, ry, 'q');
    o += `<path d="M${x - rx - 1},${y - 5}C${x - rx - 2},${y - ry - 1} ${x - 6},${y - ry - 3} ${x + 3},${y - ry - 2}C${x + 12},${y - ry - 1} ${x + rx + 2},${y - ry + 5} ${x + rx + 1},${y - 5}C${x + rx - 4},${y - 12} ${x + 8},${y - 14} ${x + 4},${y - 17}C${x - 1},${y - 11} ${x - 9},${y - 14} ${x - rx - 1},${y - 5}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - rx - 5},${y - 4}C${x - rx - 1},${y + 1} ${x - rx - 6},${y + 7} ${x - rx - 2},${y + 13}M${x + rx + 5},${y - 4}C${x + rx + 1},${y + 1} ${x + rx + 6},${y + 7} ${x + rx + 2},${y + 13}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".55"/>`;
    for (const ex of [x - rx - 1.5, x + rx + 1.5]) o += `<circle cx="${ex}" cy="${y + 5}" r="2" fill="${GOLD}" ${OL}/><path d="M${ex},${y + 8}l2.6,4.5l-2.6,4.5l-2.6,-4.5z" fill="${P.gem}" ${OL}/>`;
    const yb = y - ry + 1;
    o += `<path d="M${x - 14},${yb - 7}L${x - 11},${yb - 18}L${x - 5},${yb - 12}L${x},${yb - 27}L${x + 5},${yb - 12}L${x + 11},${yb - 18}L${x + 14},${yb - 7}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x - 18},${yb}C${x - 10},${yb - 6} ${x + 10},${yb - 6} ${x + 18},${yb}L${x + 17},${yb - 6}C${x + 9},${yb - 12} ${x - 9},${yb - 12} ${x - 17},${yb - 6}Z" fill="${GOLD}" ${OL}/>`;
    o += `<circle cx="${x}" cy="${yb - 14}" r="3.4" fill="${P.gem}" ${OL}/>`;
    for (const [px, py] of [[x - 11, yb - 19.5], [x + 11, yb - 19.5], [x, yb - 28.5]]) o += `<circle cx="${px}" cy="${py}" r="2.2" fill="${IVORY}" ${OL}/>`;
    return o;
  }

  // Knekt: basker med plym, pagefrisyr, pipkrage, randig jacka och cape över ena axeln
  function jack(P) {
    const x = FX, y = FY + 2, rx = 17.5, ry = 21.5, hair = P.hair[0];
    let o = `<path d="${BODY.j}" fill="${P.a}" ${OL}/>`;
    o += `<g clip-path="url(#ck-clip-j)">${band('M90,96V182', 5) + band('M106,96V182', 5) + band('M144,96V182', 5) + band('M160,96V182', 5)}</g>`;
    o += `<path d="M71,118C62,126 58,138 58,151V182H80C80,162 86,142 98,126C102,118 104,110 107,104C95,106 82,111 71,118Z" fill="${P.b}" ${OL}/>`;
    o += band('M80,182C80,162 86,142 98,126C102,118 104,110 107,104', 4);
    o += `<path d="M${x - rx - 6},${y + 14}C${x - rx - 9},${y - 4} ${x - rx - 7},${y - ry - 5} ${x},${y - ry - 6}C${x + rx + 7},${y - ry - 5} ${x + rx + 9},${y - 4} ${x + rx + 6},${y + 14}C${x + rx + 3},${y + 18} ${x + rx - 1},${y + 17} ${x + rx - 1},${y + 12}L${x - rx + 1},${y + 12}C${x - rx + 1},${y + 17} ${x - rx - 3},${y + 18} ${x - rx - 6},${y + 14}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - rx - 3},${y + 2}C${x - rx - 5},${y + 7} ${x - rx - 4},${y + 11} ${x - rx - 1},${y + 14}M${x + rx + 3},${y + 2}C${x + rx + 5},${y + 7} ${x + rx + 4},${y + 11} ${x + rx + 1},${y + 14}" fill="none" stroke="${INK}" stroke-width="1" opacity=".5"/>`;
    o += `<path d="M${x - 7},${y + 16}V${y + 30}H${x + 7}V${y + 16}Z" fill="${SKIN}" ${OL}/>`;
    // pipkrage: platt veckad krage runt halsen, huvudet vilar på den
    let z = '', pl = '';
    for (let i = 0; i <= 56; i++) { const t = i / 56 * 2 * Math.PI, w = 1 + .07 * Math.cos(14 * t); z += (i ? 'L' : 'M') + P2(x + 31 * w * Math.cos(t), y + 32 + 9.5 * w * Math.sin(t)); }
    for (let i = 0; i < 14; i++) { const t = (i + .5) / 14 * 2 * Math.PI; pl += `M${P2(x + 15 * Math.cos(t), y + 32 + 4.2 * Math.sin(t))}L${P2(x + 29 * Math.cos(t), y + 32 + 8.8 * Math.sin(t))}`; }
    o += `<path d="${z}Z" fill="${ERM}" ${OL}/><path d="${pl}" stroke="${INK}" stroke-width=".9" opacity=".55"/>`;
    o += face(x, y, rx, ry, 'j');
    o += `<path d="M${x - rx},${y - 6}C${x - rx},${y - ry - 2} ${x + rx},${y - ry - 2} ${x + rx},${y - 6}L${x + rx - 3},${y - 9}Q${x + 8},${y - 6} ${x + 4},${y - 10}Q${x},${y - 6} ${x - 5},${y - 10}Q${x - 9},${y - 6} ${x - rx + 2},${y - 9}Z" fill="${hair}" ${OL}/>`;
    const yb = y - ry + 4;
    // plym: böjd fjäder med mittnerv och några fjäderstrålar
    let barbs = '';
    for (let i = 0; i < 4; i++) { const t = .3 + i * .17, bx = x + 9 + 25 * t, by = yb - 14 - 22 * t * t; barbs += `M${n(bx)},${n(by)}l${n(-4 + t * 2)},${n(-5 + t)}`; }
    o += `<path d="M${x + 6},${yb - 12}C${x + 20},${yb - 13} ${x + 32},${yb - 22} ${x + 36},${yb - 38}C${x + 28},${yb - 32} ${x + 20},${yb - 29} ${x + 13},${yb - 26}C${x + 8},${yb - 23} ${x + 4},${yb - 18} ${x + 6},${yb - 12}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x + 8},${yb - 14}C${x + 20},${yb - 18} ${x + 30},${yb - 26} ${x + 35},${yb - 36}${barbs}" fill="none" stroke="${INK}" stroke-width="1"/>`;
    o += `<path d="M${x - 23},${yb}C${x - 29},${yb - 12} ${x - 15},${yb - 26} ${x + 6},${yb - 26}C${x + 27},${yb - 26} ${x + 35},${yb - 13} ${x + 25},${yb - 2}Z" fill="${P.b}" ${OL}/>`;
    o += `<path d="M${x - 23},${yb + 1}L${x - 22},${yb - 6}H${x + 24}L${x + 25},${yb + 1}Z" fill="${GOLD}" ${OL}/><circle cx="${x + 15}" cy="${yb - 3}" r="2.6" fill="${P.gem}"/>`;
    return o;
  }

  // Det figuren håller i: handen sitter vid (HX, HY), underarmen kommer nerifrån höger
  function item(k, P) {
    const x = HX, y = HY;
    const shaft = (top, c) => `<path d="M${x - 2.6},${y + 12}V${top}H${x + 2.6}V${y + 12}Z" fill="${c}" ${OL}/>`;
    switch (k) {
      case 'sword': return `<path d="M${x - 4},${y - 13}V36L${x},23L${x + 4},36V${y - 13}Z" fill="${STEEL}" ${OL}/><path d="M${x},36V${y - 16}" stroke="${STEEL_D}" stroke-width="1.2"/>`
        + `<path d="M${x - 17},${y - 17}H${x + 17}L${x + 20},${y - 13}L${x + 17},${y - 9}H${x - 17}L${x - 20},${y - 13}Z" fill="${GOLD}" ${OL}/><circle cx="${x}" cy="${y - 13}" r="2.4" fill="${P.gem}"/>` + fist(x, y);
      case 'sceptre': return shaft(56, GOLD) + `<path d="M${x - 5.5},72H${x + 5.5}V77H${x - 5.5}ZM${x - 5.5},104H${x + 5.5}V109H${x - 5.5}Z" fill="${GOLD}" ${OL}/>`
        + `<circle cx="${x}" cy="47" r="10" fill="${GOLD}" ${OL}/><circle cx="${x}" cy="47" r="3.6" fill="${P.gem}"/>` + pipU(SK[P.s], x, 30, 17) + fist(x, y);
      case 'axe': return shaft(34, WOOD) + `<path d="M${x + 3},38C${x + 20},30 ${x + 34},40 ${x + 36},55C${x + 34},70 ${x + 20},80 ${x + 3},72Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x + 26},43C${x + 32},48 ${x + 33},62 ${x + 27},67" fill="none" stroke="${STEEL_D}" stroke-width="1.4"/><path d="M${x - 3},46L${x - 17},53L${x - 3},60Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x - 5.5},40H${x + 5.5}V72H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x - 2.6},34L${x},26L${x + 2.6},34Z" fill="${STEEL}" ${OL}/>` + fist(x, y);
      case 'orb': return `<circle cx="${x}" cy="${y - 23}" r="14" fill="${GOLD}" ${OL}/><path d="M${x - 14},${y - 23}H${x + 14}M${x},${y - 37}V${y - 9}" stroke="${INK}" stroke-width="1.3"/><circle cx="${x}" cy="${y - 23}" r="3.2" fill="${P.gem}"/>`
        + `<path d="M${x},${y - 38}V${y - 52}M${x - 5.5},${y - 46.5}H${x + 5.5}" stroke="${INK}" stroke-width="5.4" stroke-linecap="round"/><path d="M${x},${y - 38}V${y - 52}M${x - 5.5},${y - 46.5}H${x + 5.5}" stroke="${GOLD}" stroke-width="3" stroke-linecap="round"/>` + fist(x, y);
      case 'fan': {
        const cx = x - 4, cy = y - 2, R = 46, a0 = -170, a1 = -62, k2 = 9;
        let d = '', o = '';
        for (let i = 0; i < k2; i++) {
          const a = (a0 + (a1 - a0) * i / k2) * Math.PI / 180, b = (a0 + (a1 - a0) * (i + 1) / k2) * Math.PI / 180;
          const w = `M${cx},${cy}L${P2(cx + R * Math.cos(a), cy + R * Math.sin(a))}A${R},${R} 0 0 1 ${P2(cx + R * Math.cos(b), cy + R * Math.sin(b))}Z`;
          if (i % 2) d += w; else o += `<path d="${w}" fill="${P.a}" ${OL}/>`;
        }
        return `<path d="${d}" fill="${GOLD}" ${OL}/>` + o + fist(x, y);
      }
      case 'rose': return `<path d="M${x - 1},${y - 8}C${x + 2},${y - 30} ${x + 8},${y - 54} ${x + 8},${y - 72}" fill="none" stroke="${LEAF}" stroke-width="3.2"/>`
        + `<path d="M${x + 5},${y - 40}C${x + 16},${y - 50} ${x + 26},${y - 48} ${x + 30},${y - 44}C${x + 22},${y - 36} ${x + 12},${y - 36} ${x + 5},${y - 40}Z" fill="${LEAF}" ${OL}/><path d="M${x + 2},${y - 26}C${x - 8},${y - 34} ${x - 18},${y - 32} ${x - 22},${y - 28}C${x - 14},${y - 21} ${x - 5},${y - 21} ${x + 2},${y - 26}Z" fill="${LEAF}" ${OL}/>`
        + `<circle cx="${x + 8}" cy="${y - 82}" r="13" fill="${RED}" ${OL}/><path d="M${x + 8},${y - 82}m-5,1a5,5 0 1,1 5,5a8,8 0 0,1 -8,-8a11,11 0 0,1 11,-9" fill="none" stroke="#7d0a18" stroke-width="1.6"/>` + fist(x, y);
      case 'tulip': return `<path d="M${x - 1},${y - 8}C${x + 1},${y - 30} ${x + 5},${y - 52} ${x + 6},${y - 66}" fill="none" stroke="${LEAF}" stroke-width="3.2"/>`
        + `<path d="M${x + 2},${y - 14}C${x + 14},${y - 26} ${x + 20},${y - 40} ${x + 26},${y - 52}C${x + 28},${y - 36} ${x + 22},${y - 22} ${x + 2},${y - 14}Z" fill="${LEAF}" ${OL}/>`
        + `<path d="M${x - 5},${y - 70}C${x - 7},${y - 82} ${x - 2},${y - 92} ${x + 4},${y - 98}C${x + 6},${y - 92} ${x + 8},${y - 92} ${x + 10},${y - 98}C${x + 15},${y - 92} ${x + 19},${y - 82} ${x + 17},${y - 70}C${x + 13},${y - 62} ${x - 1},${y - 62} ${x - 5},${y - 70}Z" fill="${RED}" ${OL}/>`
        + `<path d="M${x + 6},${y - 90}C${x + 2},${y - 82} ${x + 2},${y - 72} ${x + 6},${y - 64}" fill="none" stroke="#7d0a18" stroke-width="1.4"/>` + fist(x, y);
      case 'laurel': {
        let o = `<path d="M${x},${y - 8}C${x + 2},${y - 50} ${x + 8},${y - 86} ${x + 14},${y - 114}" fill="none" stroke="${GOLD_D}" stroke-width="2.5"/>`;
        for (let i = 0; i < 7; i++) {
          const t = .1 + i * .13, px = x + 14 * t * t + 2 * t, py = y - 8 - 106 * t, side = i % 2 ? 1 : -1;
          o += `<path d="M0,0C4,-7 12,-9 17,-7C13,-2 6,1 0,0Z" transform="translate(${n(px)} ${n(py)}) rotate(${side > 0 ? -35 : -145}) scale(1 ${side})" fill="${GOLD}" ${OL}/>`;
        }
        return o + `<path d="M${x + 14},${y - 112}C${x + 10},${y - 118} ${x + 12},${y - 124} ${x + 16},${y - 128}C${x + 20},${y - 122} ${x + 19},${y - 116} ${x + 14},${y - 112}Z" fill="${GOLD}" ${OL}/>` + fist(x, y);
      }
      case 'halberd': return shaft(32, WOOD) + `<path d="M${x},17L${x + 5.5},32H${x - 5.5}Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x + 3},38C${x + 16},33 ${x + 28},39 ${x + 32},52C${x + 28},64 ${x + 16},70 ${x + 3},65Z" fill="${STEEL}" ${OL}/><path d="M${x - 3},44L${x - 16},37L${x - 11},48L${x - 3},52Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x - 5.5},32H${x + 5.5}V38H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x},68L${x - 5},82H${x + 5}Z" fill="${P.gem}" ${OL}/>` + fist(x, y);
      case 'spear': return shaft(46, WOOD) + `<path d="M${x},17C${x + 7},28 ${x + 8},37 ${x},49C${x - 8},37 ${x - 7},28 ${x},17Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x},23V46" stroke="${STEEL_D}" stroke-width="1.2"/><path d="M${x - 5.5},48H${x + 5.5}V54H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x - 2},54L${x - 8},72H${x + 4}Z" fill="${P.gem}" ${OL}/>` + fist(x, y);
    }
    return '';
  }

  function courtHalf(s, r, P) {
    const k = r - 11;
    let o = rays(FX, FY, 24, 260, .15);
    o += [jack, queen, king][k](P);
    // underarm och manschett, sedan föremålet och handen
    o += `<path d="M${HX - 9},${HY + 7}C${HX - 8},${HY + 18} ${HX - 4},${HY + 27} ${HX + 1},${HY + 37}H${HX + 25}C${HX + 21},${HY + 24} ${HX + 16},${HY + 14} ${HX + 9},${HY + 7}Z" fill="${k === 0 ? P.a : P.b}" ${OL}/>`;
    o += `<path d="M${HX - 10},${HY + 5}H${HX + 10}V${HY + 12}H${HX - 10}Z" fill="${GOLD}" ${OL}/>`;
    o += item(P.items[k], P);
    o += pipU(SK[s], 82, 36, 28);
    return `<g id="ck-ch-${SK[s]}${r}" clip-path="url(#ck-clip-half)">${o}</g>`;
  }

  function courtFace(s, r) {
    return `<path d="${frame(0)}" fill="#f6eedd"/><use href="#ck-ch-${SK[s]}${r}"/>${turn(`<use href="#ck-ch-${SK[s]}${r}"/>`)}`
      + `<path d="M14,175H236" stroke="${GOLD}" stroke-width="3"/><path d="M14,172.6H236M14,177.4H236" stroke="${INK}" stroke-width=".9"/>`
      + `<path d="${frame(0)}" fill="none" stroke="${GOLD}" stroke-width="3.2"/><path d="${frame(-2.2)}" fill="none" stroke="${INK}" stroke-width="1"/><path d="M68.5,18.5H231.5V221.5M181.5,331.5H18.5V128.5" fill="none" stroke="${INK}" stroke-width=".8"/>`;
  }

  /* ---------- Jokrar ---------- */
  // En gycklare som tittar upp ur en flätad korg (canasta betyder korg på spanska)
  const bell = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="${GOLD}" ${OL}/><path d="M${x - 3.5},${y + 1.5}H${x + 3.5}" stroke="${INK}" stroke-width="1.3"/>`;
  // Narrmössan med tre flikar; (x, y) är ansiktets mitt
  function jesterCap(x, y, c, c2) {
    const yb = y - 14;
    let o = `<path d="M${x - 16},${yb - 4}C${x - 30},${yb - 12} ${x - 46},${yb - 14} ${x - 54},${yb + 10}C${x - 50},${yb - 18} ${x - 34},${yb - 34} ${x - 4},${yb - 26}Z" fill="${c}" ${OL}/>`;
    o += `<path d="M${x + 16},${yb - 4}C${x + 30},${yb - 12} ${x + 46},${yb - 14} ${x + 54},${yb + 10}C${x + 50},${yb - 18} ${x + 34},${yb - 34} ${x + 4},${yb - 26}Z" fill="${c2}" ${OL}/>`;
    o += `<path d="M${x - 14},${yb - 6}C${x - 18},${yb - 36} ${x - 8},${yb - 62} ${x + 16},${yb - 70}C${x + 4},${yb - 52} ${x + 8},${yb - 28} ${x + 14},${yb - 6}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x - 21},${yb + 4}L${x - 19},${yb - 7}H${x + 19}L${x + 21},${yb + 4}Z" fill="${c}" ${OL}/>`;
    for (let i = 0; i < 4; i++) o += `<path d="M${x - 12 + i * 8},${yb - 4.5}l2.4,3l-2.4,3l-2.4,-3z" fill="${GOLD}"/>`;
    return o + bell(x - 55, yb + 15) + bell(x + 55, yb + 15) + bell(x + 17, yb - 74);
  }
  const JBODY = 'M66,268V222C66,202 84,190 104,186L125,182L146,186C166,190 184,202 184,222V268Z';
  function jokerArt(red) {
    const c = red ? RED : INK, c2 = red ? NAVY : RED, x = 125, y = 138;
    const arch = 'M60,334V98A65,65 0 0 1 190,98V334Z';
    let o = `<path d="${arch}" fill="#f6eedd"/><g clip-path="url(#ck-clip-arch)">${rays(x, y, 28, 300, .18)}`;
    // kropp i harlekinrutor och ärmar ned mot korgkanten
    let hq = '';
    for (let i = 0; i < 8; i++) for (let j = 0; j < 5; j++) { const cx = 62 + i * 18, cy = 182 + j * 24; hq += `M${cx},${cy - 12}L${cx + 9},${cy}L${cx},${cy + 12}L${cx - 9},${cy}Z`; }

  }
  // JOKER uppifrån och ned i hörnet, med stjärnan under
  function jokerIndex(wild) {

  /* ---------- Kompakta framsidor (mycket små kort) ---------- */
  const MH = 156;
  // små tecken för klädda kort, i ordningen knekt (basker med fjäder), dam (tiara), kung (krona)

  ];
  function miniFace(s, r, P) {
    let o = glyphL(RK[r], 16, 14, MH) + pipU(SK[s], 68, 238, 104);
    if (r > 10) o += `<path d="M198,112H234V334H198Z" fill="${P.a}" stroke="${INK}" stroke-width="1.5"/><path d="M205,112V334M227,112V334" stroke="${GOLD}" stroke-width="3.5"/>` + `<g transform="translate(216 80) scale(1.22) translate(-216 -80)">${MINI_ICON[r - 11]}</g>`;

    o += `<g transform="translate(125 177) scale(1.32) translate(-24 -25)"><path d="M6 22 24 7l18 15v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V22Z" fill="#2e5883"/>`
      + `<path d="M3 23.5 24 6l21 17.5" fill="none" stroke="#f2a516" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="29" r="11" fill="#ffd27a" opacity=".3"/>`
      + `<rect x="17.5" y="22.5" width="13" height="13" rx="1.5" fill="#ffd27a"/><path d="M24 22.5v13M17.5 29h13" stroke="#2e5883" stroke-width="1.6"/></g>`;

  const faceId = (s, r) => `ck-f-${SK[s]}${r}`, miniId = (s, r) => `ck-m-${SK[s]}${r}`;

      + `<clipPath id="ck-clip-half"><path d="M64,14H236V175H14V124H64Z"/></clipPath>`
      + `<clipPath id="ck-clip-j"><path d="${BODY.j}"/></clipPath>`
      + `<clipPath id="ck-clip-arch"><path d="M60,334V98A65,65 0 0 1 190,98V334Z"/></clipPath>`

  A.markup = ({fourColor = opts.fourColor, wildMark = opts.wildMark} = {}) => {

})();

/* ---- 05-audio.js ---- */
/* ================= Ljud: kortljud, klockspel och musik ================= */
// Alla effekter skapas i webbläsaren (WebAudio): kort som glider och smäller mot filten, blandning, klockspel för
// canastor och röda treor och en liten fanfar när någon går ut. Musiken är mp3-filer i game/music/ om de finns.
const Sound = (() => {
  const A = {};
  let ctx = null, master, sfxBus, musicBus, noiseBuf, verbIn;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* stöds inte */ }

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 3; comp.attack.value = .003; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); musicBus = ctx.createGain();
    sfxBus.connect(master); musicBus.connect(master);
    // lite rumsklang (ett salongsrum)
    const len = ctx.sampleRate * 1.1, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .16;
    verbIn = ctx.createGain(); verbIn.connect(conv); conv.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    A.setVolumes();
    return ctx;
  }
  A.setVolumes = () => {
    if (!ctx) return;
    sfxBus.gain.value = Settings.sfx;
    musicBus.gain.value = Settings.music * .75;
    if (Settings.music <= 0) Tracks.stop(); else Tracks.kick();
  };
  // iPhone och iPad släpper bara fram ljud som startas av ett tryck. Anropas vid varje tryck.
  A.unlock = () => { try { ensure(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); Tracks.prime(); Tracks.kick(); } catch (e) { /* ljud är valfritt */ } };

  /* ---------- Byggstenar ---------- */
  // Brus genom ett filter med en kort kurva: kortens prassel och smällar
  function noise(t, {dur = .08, f = 3000, q = 1, type = 'bandpass', gain = .5, f2 = null, attack = .002, pan = 0, verb = .3} = {}) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = .8 + Math.random() * .4;
    const flt = ctx.createBiquadFilter(); flt.type = type; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    src.connect(flt); flt.connect(g);
    node.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; node.connect(s); s.connect(verbIn); }
    src.start(t, Math.random() * .5, dur + .05);
  }
  function tone(t, {f = 880, dur = .4, type = 'sine', gain = .2, attack = .005, f2 = null, verb = .5, detune = 0} = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; g.connect(s); s.connect(verbIn); }

  }
  // Klocka: grundton och övertoner som klingar av
  function bell(t, f, gain = .16, dur = 1.2) {
    tone(t, {f, dur, gain, attack: .003});
    tone(t, {f: f * 2.76, dur: dur * .5, gain: gain * .35, attack: .002});
    tone(t, {f: f * 5.4, dur: dur * .25, gain: gain * .12, attack: .002});
  }
  const snap = (t, g = .5, pan = 0) => { noise(t, {dur: .05, f: 2400 + Math.random() * 900, q: .8, gain: g, pan}); noise(t, {dur: .07, f: 220, type: 'lowpass', gain: g * .5, verb: .1}); };
  const slide = (t, g = .25, dur = .12) => noise(t, {dur, f: 5200, f2: 1800, q: .6, gain: g, attack: .02});

  const SFX = {
    click: t => tone(t, {f: 1400, dur: .05, type: 'triangle', gain: .06, verb: 0}),
    tick: t => noise(t, {dur: .03, f: 4200, q: 2, gain: .18, verb: 0}),
    draw: t => { slide(t, .22); snap(t + .1, .28); },
    place: t => snap(t, .42),
    meld: t => { for (let i = 0; i < 3; i++) snap(t + i * .06, .36 - i * .06, (i - 1) * .2); },
    discard: t => { slide(t, .18, .09); snap(t + .08, .5); },
    take: t => { noise(t, {dur: .32, f: 3800, f2: 900, q: .5, gain: .3, attack: .04}); for (let i = 0; i < 5; i++) snap(t + .12 + i * .045, .22, (Math.random() - .5) * .6); },
    shuffle: t => { for (let i = 0; i < 26; i++) snap(t + i * .026 + Math.random() * .01, .12 + Math.random() * .1, i < 13 ? -.3 : .3); for (let i = 0; i < 6; i++) snap(t + .8 + i * .05, .2); },
    red3: t => { bell(t, 1318.5, .13); bell(t + .12, 1760, .11); },
    canasta: t => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(t + i * .09, f, .12, 1.3)); },
    canastaNat: t => { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => bell(t + i * .08, f, .12, 1.6)); for (let i = 0; i < 8; i++) tone(t + .45 + i * .05, {f: 2400 + Math.random() * 1800, dur: .3, gain: .03}); },
    freeze: t => { [1567.98, 2093, 2637].forEach((f, i) => tone(t + i * .07, {f, dur: .9, type: 'triangle', gain: .05, detune: 6})); noise(t, {dur: .5, f: 7000, q: 3, gain: .06, attack: .1}); },
    nope: t => { tone(t, {f: 180, f2: 120, dur: .18, type: 'triangle', gain: .12, verb: 0}); },
    undo: t => noise(t, {dur: .14, f: 1600, f2: 5200, q: .6, gain: .16, attack: .03}),
    hint: t => { bell(t, 987.77, .07, .7); bell(t + .1, 1318.5, .06, .7); },
    turn: t => { bell(t, 783.99, .08, .8); bell(t + .14, 1174.66, .08, 1); },
    ask: t => { bell(t, 880, .07, .6); bell(t + .12, 1108.73, .07, .8); },
    out: t => { [392, 523.25, 659.25, 783.99].forEach((f, i) => { tone(t + i * .1, {f, dur: .5, type: 'sawtooth', gain: .035}); tone(t + i * .1, {f: f * 2, dur: .5, gain: .03}); }); },
    win: t => {
      const seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
      seq.forEach((f, i) => { tone(t + i * .13, {f, dur: .45, type: 'sawtooth', gain: .04}); tone(t + i * .13, {f: f / 2, dur: .5, type: 'triangle', gain: .05}); });
      for (let i = 0; i < 12; i++) bell(t + 1 + i * .06, 1500 + Math.random() * 2000, .03, .6);
    },
    count: t => tone(t, {f: 1800 + Math.random() * 400, dur: .05, type: 'triangle', gain: .05, verb: 0}),
    join: t => { bell(t, 659.25, .07, .6); bell(t + .1, 987.77, .07, .7); },
    leave: t => { bell(t, 987.77, .06, .6); bell(t + .1, 659.25, .06, .7); },
    emote: t => tone(t, {f: 1200, f2: 1600, dur: .12, gain: .05})
  };
  // Spelar en effekt (delay i ms)
  A.play = (name, delay = 0) => {
    if (!Settings.sfx) return;
    try {
      if (!ensure() || ctx.state !== 'running') return;
      const f = SFX[name];
      if (f) f(ctx.currentTime + .01 + delay / 1000);
    } catch (e) { /* ljud är valfritt */ }
  };

  /* ---------- Musik: två spelare som tonar över i varandra ---------- */
  // Låtarna (game/music/meny.mp3 och spel.mp3) spelas genom Web Audio, så att volymen och övertoningarna fungerar även
  // på iPhone och iPad (där ett ljudelements volym inte går att ändra). Nära slutet börjar låten om i den andra
  // spelaren och tonar över, så att loopen inte hörs.
  const Tracks = (() => {
    const T = {};
    const files = typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : [];
    const variants = key => files.filter(f => f.replace(/\.(mp3|m4a)$/i, '').replace(/-\d+$/, '') === key);
    let cur = null, wantKey = null, deck = [], active = -1, fadeT = 0;
    T.has = key => variants(key).length > 0;
    T.playing = () => !!cur;
    const urls = {};
    async function urlFor(f) {
      if (urls[f]) return urls[f];
      const src = 'music/' + f;
      try { const r = await fetch(src); if (!r.ok) throw 0; urls[f] = URL.createObjectURL(await r.blob()); }
      catch (e) { urls[f] = src; }
      return urls[f];
    }
    function makeDeck() {
      const a = new Audio(); a.preload = 'auto'; a.crossOrigin = 'anonymous';
      const d = {a, gain: null, key: null};
      try { ensure(); const srcNode = ctx.createMediaElementSource(a); d.gain = ctx.createGain(); d.gain.gain.value = 0; srcNode.connect(d.gain); d.gain.connect(musicBus); }
      catch (e) { d.gain = null; }
      a.addEventListener('timeupdate', () => { if (deck[active] === d && a.duration && a.duration - a.currentTime < 4) next(d.key); });
      a.addEventListener('error', () => { if (deck[active] === d) cur = null; });
      return d;
    }
    const level = (d, v, sec) => {
      if (d.gain && ctx) { d.gain.gain.cancelScheduledValues(ctx.currentTime); d.gain.gain.setTargetAtTime(v, ctx.currentTime, Math.max(.05, sec / 3)); }
      else { const from = d.a.volume, t0 = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000)); d.a.volume = clamp(from + (v * Settings.music * .75 - from) * k, 0, 1); if (k < 1) requestAnimationFrame(st); }; st(); }
    };
    let busy = false;
    async function next(key) {
      if (busy) return;
      const list = variants(key);
      if (!list.length) return;
      busy = true;
      try {
        const f = list[Math.floor(Math.random() * list.length)], url = await urlFor(f);
        if (wantKey !== key) return;
        if (!deck.length) deck = [makeDeck(), makeDeck()];
        const inc = (active + 1) % 2, out = deck[active];
        const d = deck[inc];
        d.key = key; d.a.src = url; d.a.currentTime = 0;
        try { await d.a.play(); } catch (e) { return; }
        active = inc;
        level(d, 1, 2.5);
        if (out) { level(out, 0, 2.5); clearTimeout(fadeT); fadeT = setTimeout(() => { if (deck[active] !== out) out.a.pause(); }, 3000); }
        cur = key;
      } finally { busy = false; }
    }
    T.want = key => {
      if (key === wantKey && cur === key) return;
      wantKey = key;
      if (!key || !T.has(key) || Settings.music <= 0) { T.stop(); return; }
      next(key);
    };
    T.stop = () => { if (!cur) return; cur = null; const d = deck[active]; if (d) { level(d, 0, 1.4); setTimeout(() => { if (!cur) d.a.pause(); }, 1700); } };
    // Ett kort tyst ljud i båda spelarna vid första trycket (iPhone kräver att varje spelare startas av ett tryck en gång)
    let primed = false, priming = false, silent = null;
    function silentUrl() {
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, str) => [...str].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
      return URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    }
    T.prime = () => {
      if (primed || priming || !files.length) return;
      if (!deck.length) deck = [makeDeck(), makeDeck()];
      silent = silent || silentUrl();
      priming = true;
      const list = deck.filter((d, k) => !(k === active && cur));
      Promise.all(list.map(d => { d.a.src = silent; return d.a.play().then(() => { if (d.a.src === silent) d.a.pause(); }); }))
        .then(() => { primed = true; priming = false; T.kick(); }, () => { priming = false; });
    };
    // Starta om musiken om den borde spela men har stannat (till exempel när sidan har legat i bakgrunden)
    T.kick = () => {
      const d = deck[active];
      if (cur && d && d.a.paused && d.a.src !== silent) d.a.play().catch(() => {});
      else if (wantKey && !cur && Settings.music > 0) next(wantKey);
    };
    // pausa när sidan inte syns (appen i bakgrunden) och fortsätt när den kommer tillbaka
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => {
      const d = deck[active];
      if (!d) return;
      if (document.hidden) d.a.pause(); else if (cur) d.a.play().catch(() => {});
    });
    return T;
  })();
  A.music = name => { try { Tracks.want(name); } catch (e) { /* ljud är valfritt */ } };
  A.stopMusic = () => Tracks.stop();
  A.hasMusic = () => (typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : []).length > 0;
  return A;
})();

      close(val) {

        closed = true;
        const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
        if (o.onClose) try { o.onClose(val); } catch (e) { console.error(e); }
        wrap.classList.remove('on');
        setTimeout(() => wrap.remove(), 260);

    };

  U.AVATARS = ['🦊', '🐻', '🐼', '🦁', '🐯', '🐸', '🐵', '🐧', '🦉', '🐙', '🦄', '🐺', '🐰', '🦝', '🐨', '🐮', '🎩', '👑', '🌟', '🍀', '🌹', '🎲', '🃏', '🍸'];

  // Lagfärgerna. Mitt eget lag är alltid guld, de andra blå och rosa i bordsordning (mine = mitt lag, -1 = åskådare).
  U.TEAM_COLORS = ['#e6b94f', '#7fb6e0', '#e58fa6'];
  U.teamColor = (ti, mine = -1, n = 2) => U.TEAM_COLORS[mine >= 0 ? (ti - mine + n) % n : ti] || U.TEAM_COLORS[0];
  return U;
})();

/* ---- 07-table.js ---- */
/* ================= Bordet: var korten ligger och hur de rör sig ================= */
// Varje kort vi känner till (id) har ett eget element som flyttas med transform. Bordet räknar ut var alla kort
// ska ligga för det läge som visas (layout) och låter dem glida dit. Nya kort dyker upp där de kommer ifrån
// (talongen, högen eller en annan spelares plats) och kort som försvinner till någon annans hand flyger dit.
// Andras händer och talongen visas som baksidor utan id (vi vet ju inte vilka kort det är).
const Table = (() => {
  const T = {};
  let root, cardsEl, zonesEl, seatsEl, hudEl;
  let V = null, me = 0, spectator = false;
  let stage = [], sel = new Set(), fresh = new Set(), hints = {};
  const els = new Map();
  let G = null, lastMove = '', history = [];
  let onTap = () => {};
  let hudHandlers = {};
  const MOVE = 420;
  const LIFT = .15;          // hur mycket ett valt kort lyfts (del av korthöjden)

  /* ---------- Hjälpare ---------- */
  const players = () => V ? V.opts.players : 4;
  const myTeam = () => V ? V.team[me] : 0;
  // platsens position runt bordet sett från mig: 0 = jag (nere), sedan medsols
  const posOf = seat => (seat - me + players()) % players();
  const seatAt = pos => (me + pos) % players();
  T.me = () => me;
  T.view = () => V;
  T.geo = () => G;

  function safe() {
    const p = $('safeProbe');
    if (!p) return {t: 0, r: 0, b: 0, l: 0};
    const cs = getComputedStyle(p);
    return {t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0};
  }

  /* ---------- Geometri ---------- */
  // Räknar ut ytorna: HUD, platser, mälningar (per lag), talong och hög, knappraden och handen.
  // Tre lägen: stående (telefon, platta på högkant), liggande telefon (låg skärm: knapparna i en kolumn till höger)
  // och stor liggande skärm (platta, dator, TV: knapparna i en rad ovanför handen).
  function geometry() {
    const W = root.clientWidth || innerWidth, H = root.clientHeight || innerHeight;
    const sa = safe();
    const portrait = H >= W * 1.05;
    const side = !portrait && H < 600;
    const n = players();
    const g = {W, H, portrait, side, sa, n};
    // skala för text och knappar på stora skärmar
    const big = sizeFactor();
    g.ui = (portrait ? clamp(Math.min(W / 640, H / 1000), 1, 1.35) : clamp(Math.min(W / 1180, H / 760), 1, 1.6)) * (1 + (big - 1) * .8);
    g.cw = (portrait ? clamp(Math.min(W / 6.3, H / 10.8), 46, 118) : clamp(Math.min(W / 10.5, H / 5.6), 44, 126)) * big;
    // liggande: handen får högst en fjärdedel av höjden, resten går till bordet
    g.liftRoom = side ? 0 : LIFT - .09;
    if (!portrait) g.cw = Math.min(g.cw, Math.max(44, (H * .245 - 6) / 1.4 / (1.16 + g.liftRoom)));
    g.ch = g.cw * 1.4;
    g.hudH = (portrait ? 50 : 46) * g.ui;
    const top = sa.t + g.hudH;
    // handen: en eller två rader
    const hand = handList();
    const handW = W - sa.l - sa.r - 16;
    g.rows = handRows(hand.length, handW, g.cw);
    // (valda kort lyfts: ovanför handen finns plats för det, så att de inte hamnar i knappraden)
    g.handH = spectator ? 0 : g.ch * (g.rows === 1 ? 1.16 + g.liftRoom : 1.7 + g.liftRoom + .09) + 6;
    g.hand = {x: sa.l + 8, y: H - sa.b - g.handH - 4, w: handW, h: g.handH};
    // hur mycket plats vill lagen ha? (fler mälningar = högre yta)
    const mine = myTeam();
    const items = t => (V.melds[t] || []).length + ((V.red3[t] || []).length ? 1 : 0);
    const others = V.teams.map((_, i) => i).filter(i => i !== mine);
    const needThem = Math.max(2, ...others.map(items)), needUs = Math.max(2, items(mine) + stage.length + 1);
    const share = clamp(needThem / (needThem + needUs), .32, .6);
    if (portrait) {
      g.seatH = n > 1 ? 50 * g.ui : 0;
      g.seatRow = {x: sa.l + 6, y: top + 2, w: W - sa.l - sa.r - 12, h: g.seatH};
      g.barH = spectator ? 0 : 54 * g.ui;
      g.bar = {x: sa.l + 6, y: g.hand.y - g.barH, w: W - sa.l - sa.r - 12, h: g.barH};
      const midTop = g.seatRow.y + g.seatH + 4, midBot = g.bar.y - 2;
      g.pw = clamp(g.cw * .92, 42, 100);
      g.ph = g.pw * 1.4;
      const centerH = g.ph + 18;
      const rest = Math.max(80, midBot - midTop - centerH);
      const theirH = rest * share;
      g.center = {x: sa.l + 8, y: midTop + theirH, w: W - sa.l - sa.r - 16, h: centerH};
      g.melds = teamAreas({x: sa.l + 6, y: midTop, w: W - sa.l - sa.r - 12, h: theirH}, {x: sa.l + 6, y: g.center.y + centerH, w: W - sa.l - sa.r - 12, h: midBot - g.center.y - centerH}, g.ui);
    } else if (side) {
      g.seatH = 0;
      g.barW = spectator ? 0 : clamp(W * .15, 118, 190);
      const midTop = top + 4, midBot = g.hand.y - 4;
      g.bar = {x: W - sa.r - g.barW - 6, y: midTop, w: g.barW, h: midBot - midTop};
      g.pw = clamp(Math.min(g.cw * .95, (midBot - midTop) / 1.4 / 2.35), 34, 100);
      g.ph = g.pw * 1.4;
      const pileW = g.pw * 2.35 + 16;
      g.center = {x: sa.l + 8, y: midTop, w: pileW, h: midBot - midTop};
      const mx = g.center.x + pileW + 6, mw = g.bar.x - mx - 6;
      const hh = midBot - midTop, th = hh * share;
      g.melds = teamAreas({x: mx, y: midTop, w: mw, h: th - 3}, {x: mx, y: midTop + th + 3, w: mw, h: hh - th - 3}, g.ui);
    } else {
      g.seatH = 0;
      g.barH = spectator ? 0 : 56 * g.ui;
      g.bar = {x: sa.l + 12, y: g.hand.y - g.barH, w: W - sa.l - sa.r - 24, h: g.barH};
      const midTop = top + 8, midBot = g.bar.y - 4;
      g.pw = Math.min(clamp(g.cw * .95, 44, 118), (midBot - midTop) / 1.4 / 2.35);
      g.ph = g.pw * 1.4;
      const pileW = g.pw * 1.6 + 24;
      const hh = midBot - midTop;
      g.center = {x: sa.l + 12, y: midTop, w: pileW, h: hh};
      const mx = g.center.x + pileW + 12, mw = W - sa.r - 12 - mx - pileW * .35;
      const th = hh * share;
      g.melds = teamAreas({x: mx, y: midTop, w: mw, h: th - 5}, {x: mx, y: midTop + th + 5, w: mw, h: hh - th - 5}, g.ui);
    }
    // platserna: badges för motståndarna och partnern
    g.seats = [];
    for (let s = 0; s < n; s++) g.seats[s] = seatRect(g, posOf(s));
    // kortstorleken, textstorleken och knappradens plats
    root.style.setProperty('--cw', g.cw.toFixed(1) + 'px');
    root.style.setProperty('--ch', g.ch.toFixed(1) + 'px');
    root.style.fontSize = (14 * g.ui).toFixed(2) + 'px';
    root.classList.toggle('port', portrait);
    root.classList.toggle('land', !portrait);
    root.classList.toggle('side', side);
    const bar = $('bar');
    if (bar) Object.assign(bar.style, {left: g.bar.x + 'px', top: g.bar.y + 'px', width: g.bar.w + 'px', height: g.bar.h + 'px', display: spectator ? 'none' : ''});
    document.body.style.setProperty('--toast-bottom', (side ? H - g.hand.y + 8 : H - g.bar.y + 8) + 'px');
    return g;
  }
  // Mälningsytor: mitt lag nere, de andra uppe (tre spelare: två lag delar övre ytan)
  function teamAreas(upper, lower, ui = 1) {
    const out = [];
    const mine = myTeam();
    const others = V.teams.map((_, i) => i).filter(i => i !== mine);
    out[mine] = lower;
    if (others.length === 1) out[others[0]] = upper;
    else {
      // tre spelare: den till vänster (nästa) till vänster, den andra till höger
      const byPos = others.slice().sort((a, b) => posOf(V.teams[a].seats[0]) - posOf(V.teams[b].seats[0]));
      const w = (upper.w - 8) / 2, hh = Math.round(20 * ui);
      out[byPos[0]] = {x: upper.x, y: upper.y + hh, w, h: upper.h - hh, head: hh};
      out[byPos[1]] = {x: upper.x + w + 8, y: upper.y + hh, w, h: upper.h - hh, head: hh};
    }
    return out;
  }
  function seatRect(g, pos) {
    const n = g.n;
    if (pos === 0) return {x: g.sa.l + 8, y: g.hand.y - 32, w: 0, h: 30, mine: true};
    const order = n === 4 ? [1, 2, 3] : n === 3 ? [1, 2] : [1];
    const i = order.indexOf(pos), others = n - 1;
    if (g.portrait) {
      // en rad under HUD:en, i bordsordning från vänster
      const w = Math.min(190 * g.ui, (g.seatRow.w - (others - 1) * 6) / others);
      const x0 = g.seatRow.x + (g.seatRow.w - (others * w + (others - 1) * 6)) / 2;
      return {x: x0 + i * (w + 6), y: g.seatRow.y, w, h: g.seatH - 4};
    }
    // liggande: i HUD-raden, mellan poängen och givens nummer
    const sc = hudEl && hudEl.querySelector('.scores'), info = hudEl && hudEl.querySelector('.hudinfo');
    const left = sc && sc.getBoundingClientRect().width ? sc.getBoundingClientRect().right + 10 : g.W * .3;
    const right = info && info.getBoundingClientRect().width ? info.getBoundingClientRect().left - 10 : g.W - 150;
    const span = Math.max(120, right - left);
    const w = Math.min(170 * g.ui, (span - (others - 1) * 6) / others);
    const x0 = left + (span - (others * w + (others - 1) * 6)) / 2;
    return {x: x0 + i * (w + 6), y: g.sa.t + 4 * g.ui, w, h: g.hudH - 8 * g.ui, inHud: true};
  }
  function handRows(n, w, cw) {
    if (n <= 1) return 1;
    const step = (w - cw) / (n - 1);
    return step >= cw * .36 ? 1 : 2;
  }

  /* ---------- Vad som ska visas ---------- */
  const stagedIds = () => new Set(stage.flatMap(g => g.ids));
  function handList() {
    if (!V || spectator || !Array.isArray(V.cards[me])) return [];
    const st = stagedIds();
    return Cards.sort(V.cards[me].filter(id => !st.has(id)));
  }
  // Mälningarna som visas för ett lag (med mina förberedda mälningar inräknade)
  function teamMelds(team) {
    const base = V.melds[team] || [];
    if (team !== myTeam() || !stage.length || spectator) return {melds: base, staged: new Set()};
    try {
      const r = Rules.groups(V.cards[me], base, stage, {black3ok: true});
      return {melds: r.melds, staged: stagedIds()};
    } catch (e) { return {melds: base, staged: new Set()}; }
  }

  /* ---------- Placering av alla kort ---------- */
  // Ger Map(id → {x, y, r, s, z, up, zone, mini, cls}) med kortens mitt i pixlar
  function place() {
    const out = new Map();
    const g = G;
    // handen
    const hand = handList();
    if (hand.length) {
      const rows = g.rows;
      const perRow = rows === 1 ? hand.length : Math.ceil(hand.length / 2);
      const rowsList = rows === 1 ? [hand] : [hand.slice(0, perRow), hand.slice(perRow)];
      rowsList.forEach((row, ri) => {
        const n = row.length;
        // lite extra luft mellan valörerna om det finns plats
        const groups = row.reduce((a, id, i) => a + (i && gkey(id) !== gkey(row[i - 1]) ? 1 : 0), 0);
        let gap = g.cw * .12;
        let step = n > 1 ? (g.hand.w - g.cw - groups * gap) / (n - 1) : 0;
        if (step < g.cw * .38) { gap = 0; step = n > 1 ? (g.hand.w - g.cw) / (n - 1) : 0; }
        step = Math.min(step, g.cw * .78);
        const total = g.cw + (n - 1) * step + groups * gap;
        let x = g.hand.x + (g.hand.w - total) / 2 + g.cw / 2;
        const room = g.ch * (rows === 1 ? g.liftRoom : g.liftRoom + .09);
        const baseY = rows === 1 ? g.hand.y + room + g.ch * .58 + 5 : g.hand.y + room + g.ch * (ri === 0 ? .5 : 1.12);
        row.forEach((id, i) => {
          if (i && gkey(id) !== gkey(row[i - 1])) x += gap;
          const t = n > 1 ? i / (n - 1) - .5 : 0;
          const arc = rows === 1 && n <= 18 ? 1 : 0;
          const lift = sel.has(id) ? g.ch * LIFT : 0;
          out.set(id, {x, y: baseY - lift + arc * (t * t) * g.ch * .16, r: arc * t * 5, s: 1, z: 500 + ri * 60 + i, up: true, zone: 'hand', cls: (sel.has(id) ? ' sel' : '') + (fresh.has(id) ? ' fresh' : '')});
          x += step;
        });
      });
    }
    // talong och hög
    const pc = pilePos();
    const ps = g.pw / g.cw;
    const pile = V.pile;
    const shown = pile.slice(-5);
    // korset: det vilda kortet (eller röda trean) som frös högen ligger på tvären
    let cross = null;
    if (V.frozen) for (let i = pile.length - 1; i >= 0; i--) if (Cards.wild(pile[i]) || Cards.red3(pile[i])) { cross = pile[i]; break; }
    if (cross != null && cross !== pile[pile.length - 1]) out.set(cross, {x: pc.x, y: pc.y, r: 90, s: ps, z: 99, up: true, zone: 'pile'});
    shown.forEach((id, i) => {
      if (id === cross && i !== shown.length - 1) return;
      const k = shown.length - 1 - i;           // 0 = översta
      const jit = ((id * 37) % 11 - 5);
      out.set(id, {x: pc.x + (k ? jit * .9 : 0), y: pc.y + (k ? ((id * 13) % 7 - 3) : 0), r: k ? jit * 1.4 : 0, s: ps, z: 100 + i, up: true, zone: 'pile'});
    });
    // mälningar och röda treor
    placeTeams(out);
    return out;
  }
  const gkey = id => Cards.wild(id) ? 'w' : Cards.rank(id);
  function pilePos() {
    const c = G.center;
    if (G.portrait) return {x: c.x + c.w / 2 + G.pw * .8, y: c.y + c.h / 2};
    return {x: c.x + c.w / 2, y: c.y + c.h / 2 + G.ph * (G.side ? .56 : .62)};
  }
  function stockPos() {
    const c = G.center;
    if (G.portrait) return {x: c.x + c.w / 2 - G.pw * .8, y: c.y + c.h / 2};
    return {x: c.x + c.w / 2, y: c.y + c.h / 2 - G.ph * (G.side ? .56 : .62)};
  }
  T.stockPos = () => stockPos();
  T.pilePos = () => pilePos();
  // Mitten av en plats (dit korten flyger när någon annan tar dem)
  function seatPos(seat) {
    const r = G.seats[seat];
    if (!r) return {x: G.W / 2, y: 0};
    if (r.mine) return {x: G.W / 2, y: G.hand.y + G.handH / 2};
    return {x: r.x + r.w / 2, y: r.y + r.h / 2};
  }
  T.seatPos = seat => G ? seatPos(seat) : {x: 0, y: 0};

  // Lagets mälningar i sin yta: en kolumn per valör. Finns det plats ligger korten i en kaskad (som på ett riktigt
  // bord), annars i en tät hög med det översta kortet synligt och antalet på en bricka. Canastor läggs ihop.
  // Alla lag får samma kortstorlek (den som får plats i den trängsta ytan), så att bordet ser jämnt ut.
  let meldCols = [];     // för träffytor: {team, r, x, y, w, h}
  const DY = .27;
  function planTeam(team) {
    const area = G.melds[team];
    if (!area) return null;
    const {melds, staged} = teamMelds(team);
    const red = V.red3[team] || [];
    const slot = team === myTeam() && !spectator && Play.wantSlot();
    const items = melds.length + (red.length ? 1 : 0) + (slot ? 1 : 0);
    const maxN = Math.max(4, ...melds.filter(m => m.c.length < 7).map(m => m.c.length));
    const fit = rows => {
      const perRow = Math.ceil(Math.max(1, items) / rows), rowH = area.h / rows - (rows > 1 ? 4 : 0);
      return {rows, perRow, rowH, mw: Math.min(G.cw * .86, area.w / perRow / 1.12, (rowH - 6) / 1.4 / (1 + DY * (maxN - 1)))};
    };
    let L = fit(1);
    if (L.mw < 44 && items > 3) { const L2 = fit(2); if (L2.mw > L.mw) L = L2; }
    const compactFit = () => {
      const rows = items > 7 && area.h > 150 ? 2 : 1;
      const perRow = Math.ceil(Math.max(1, items) / rows), rowH = area.h / rows - (rows > 1 ? 4 : 0);
      return {rows, perRow, rowH, mw: Math.max(24, Math.min(G.cw * .8 * (sizeFactor() > 1 ? 1.1 : 1), area.w / perRow / 1.14, (rowH - 16) / 1.4))};
    };
    return {team, area, melds, staged, red, slot, items, L, compactFit};
  }
  function placeTeams(out) {
    const plans = V.teams.map((_, ti) => planTeam(ti)).filter(Boolean);
    // lag med plats för kaskad får samma kortstorlek, trånga ytor (t.ex. två motståndare bredvid varandra) täta högar
    const casc = plans.filter(p => p.L.mw >= 60), comp = plans.filter(p => p.L.mw < 60);
    comp.forEach(p => { p.L = p.compactFit(); });
    const mwC = casc.length ? Math.min(...casc.map(p => p.L.mw)) : 0;
    const mwK = comp.length ? Math.min(...comp.map(p => p.L.mw)) : 0;
    meldCols = [];
    casc.forEach(p => placeTeam(p, mwC, false, out));
    comp.forEach(p => placeTeam(p, mwK, true, out));
  }
  function placeTeam(P, mwc, compact, out) {
    const {team, area, melds, staged, red, slot, items, L} = P;
    const mh = mwc * 1.4, s = mwc / G.cw, mini = compact || mwc < 46;
    const colW = Math.min(mwc * 1.28, area.w / L.perRow);
    const colAt = i => {
      const row = Math.floor(i / L.perRow), col = i % L.perRow;
      const inRow = Math.min(L.perRow, items - row * L.perRow);
      const x0 = area.x + (area.w - inRow * colW) / 2;
      return {x: x0 + col * colW + colW / 2, y: area.y + 3 + row * (L.rowH + 4), h: L.rowH};
    };
    let idx = 0;
    const cols = [];
    if (red.length) {
      const c = colAt(idx++);
      red.forEach((id, i) => out.set(id, {x: c.x - (red.length - 1) * mwc * .12 + i * mwc * .24, y: c.y + mh / 2 + 2, r: -6 + i * 4, s, z: 180 + i, up: true, zone: 'red3', mini}));
      cols.push({team, r: 'red3', x: c.x - colW / 2, y: c.y, w: colW, h: c.h, n: red.length, mw: mwc, mh, compact});
    }
    for (const m of melds) {
      const c = colAt(idx++);
      const n = m.c.length, can = n >= 7, w = m.c.filter(Cards.wild).length;
      const natural = can && !w;
      if (can || compact) {
        // tät hög: översta kortet (ett naturligt, rött på en ren canasta och svart på en blandad) syns
        const topCard = pickTop(m.c, can ? natural : null);
        const others = m.c.filter(id => id !== topCard);
        others.forEach((id, i) => out.set(id, {x: c.x + Math.min(i, 5) * .8, y: c.y + mh / 2 + 2 + Math.min(i, 5) * .8, r: 0, s, z: 200 + i, up: true, zone: 'meld', team, mr: m.r, mini, cls: staged.has(id) ? ' staged' : ''}));
        out.set(topCard, {x: c.x - 1, y: c.y + mh / 2 + 1, r: 0, s, z: 230, up: true, zone: 'meld', team, mr: m.r, mini, cls: (can ? ' cantop ' + (natural ? 'nat' : 'mix') : '') + (staged.has(topCard) ? ' staged' : '')});
      } else {
        const dy = n > 1 ? clamp((c.h - mh - 6) / (n - 1), mh * .2, mh * .3) : 0;
        m.c.forEach((id, i) => out.set(id, {x: c.x, y: c.y + mh / 2 + 2 + i * dy, r: 0, s, z: 200 + i, up: true, zone: 'meld', team, mr: m.r, mini: false, cls: staged.has(id) ? ' staged' : ''}));
      }
      cols.push({team, r: m.r, x: c.x - colW / 2, y: c.y, w: colW, h: c.h, can, natural, n, wild: w, mw: mwc, mh, compact});
    }
    if (slot) {
      const c = colAt(idx++);
      cols.push({team, r: 'new', x: c.x - colW / 2, y: c.y, w: colW, h: c.h, slot: true, mw: mwc, mh});
    }
    meldCols = meldCols.concat(cols);
  }
  function pickTop(ids, natural) {
    const nat = ids.filter(id => !Cards.wild(id));
    const want = natural == null ? null : natural ? nat.find(Cards.red) : nat.find(id => !Cards.red(id));
    return want != null ? want : nat[nat.length - 1] ?? ids[ids.length - 1];
  }

  /* ---------- Kortelementen ---------- */
  function faceHTML(id, mini) {
    if (typeof Art !== 'undefined' && Art.face) return mini && Art.mini ? Art.mini(id) : Art.face(id);
    // reserv om kortbilderna saknas
    const red = Cards.red(id);
    return `<div class="fallback ${red ? 'red' : ''}"><b>${Cards.wild(id) && id >= 104 ? '★' : Cards.RANKS[Cards.rank(id)]}</b><i>${Cards.SUITS[Cards.suit(id)]}</i></div>`;
  }
  function backHTML(deck) {
    if (typeof Art !== 'undefined' && Art.back) return Art.back(deck);
    return `<div class="fallback back d${deck}"></div>`;
  }
  function makeCard(id) {
    const el = h('div', {class: 'card down', dataset: {id}});
    const inner = h('div', {class: 'cinner'});
    const face = h('div', {class: 'cface'}), back = h('div', {class: 'cback'});
    face.innerHTML = faceHTML(id, false);
    back.innerHTML = backHTML(Cards.deck(id));
    inner.append(face, back);
    el.append(inner);
    el._mini = false;
    el._face = face;
    cardsEl.append(el);
    els.set(id, el);
    return el;
  }
  // En baksida utan id (andras kort, dragna kort som flyger till någon annan)
  function makeBack(deck = 0) {
    const el = h('div', {class: 'card down anon'});
    const inner = h('div', {class: 'cinner'});
    inner.append(h('div', {class: 'cface'}), h('div', {class: 'cback', html: backHTML(deck)}));
    el.append(inner);
    cardsEl.append(el);
    return el;
  }
  const tf = (p, s) => `translate3d(${(p.x - G.cw / 2).toFixed(1)}px, ${(p.y - G.ch / 2).toFixed(1)}px, 0) rotate(${(p.r || 0).toFixed(2)}deg) scale(${(s ?? p.s ?? 1).toFixed(4)})`;
  function setPos(el, p, ms = MOVE, delay = 0) {
    el.style.transitionDuration = ms + 'ms';
    el.style.transitionDelay = delay + 'ms';
    el.style.transform = tf(p);
    el.style.zIndex = p.z || 1;
  }

  // Lägger ut alla kort där de ska vara (med animation). hints.from: Map(id → {x, y, s, down}),
  // hints.to: Map(id → {x, y}) för kort som försvinner, hints.delay: Map(id → ms)
  function settle(h0 = {}, ms = MOVE) {
    if (!V || !G) return;
    const from = h0.from || new Map(), to = h0.to || new Map(), delay = h0.delay || new Map();
    const target = place();
    const speed = Time.speed();
    const dur = Math.max(0, Math.round(ms * speed));
    // nya kort: börja där de kommer ifrån
    const created = [];
    for (const [id, p] of target) {
      let el = els.get(id);
      if (!el) {
        el = makeCard(id);
        const f = from.get(id) || (p.zone === 'hand' ? Object.assign(stockPos(), {s: G.pw / G.cw, down: true}) : Object.assign({}, p, {s: p.s * .6}));
        el.style.transitionDuration = '0ms';
        el.style.transform = tf(f, f.s ?? p.s);
        el.classList.toggle('down', !!f.down);
        el.style.opacity = f.fade ? '0' : '';
        created.push(el);
      }
    }
    if (created.length) void cardsEl.offsetWidth;   // låt webbläsaren rita startläget först
    for (const [id, p] of target) {
      const el = els.get(id);
      const d = Math.round((delay.get(id) || 0) * speed);
      setPos(el, p, dur, d);
      el.style.opacity = '';
      const wantDown = !p.up;
      if (el.classList.contains('down') !== wantDown) {
        if (d) setTimeout(() => el.classList.toggle('down', wantDown), d + dur * .25); else el.classList.toggle('down', wantDown);
      }
      if (p.mini !== el._mini) { el._mini = !!p.mini; el._face.innerHTML = faceHTML(id, !!p.mini); }
      el.className = el.className.replace(/ (sel|fresh|staged|cantop|nat|mix)\b/g, '');
      if (p.cls) el.className += p.cls;
      el.dataset.zone = p.zone;
      if (p.team != null) el.dataset.team = p.team; else delete el.dataset.team;
      if (p.mr != null) el.dataset.r = p.mr; else delete el.dataset.r;
    }
    // kort som inte ska synas längre
    for (const [id, el] of [...els]) {
      if (target.has(id)) continue;
      els.delete(id);
      const t = to.get(id);
      if (t && dur > 0) {
        el.classList.toggle('down', !!t.down);
        setPos(el, Object.assign({z: 950}, t, {s: t.s || .5}), dur, Math.round((delay.get(id) || 0) * speed));
        el.style.opacity = '0';
        el.style.transition += ', opacity ' + dur + 'ms';
        setTimeout(() => el.remove(), dur + (delay.get(id) || 0) * speed + 60);
      } else el.remove();
    }
    renderZones();
    renderSeats();
    renderHud();
  }

  // Kort som flyger utan id (någon annan drar, eller en utdelning)
  function flyBack(fromP, toP, {delay = 0, ms = 460, deck = 0, s0 = null, s1 = .5} = {}) {
    const el = makeBack(deck);
    el.style.transitionDuration = '0ms';
    el.style.transform = tf(fromP, s0 ?? G.pw / G.cw);
    el.style.zIndex = 960;
    void el.offsetWidth;
    const speed = Time.speed();
    setTimeout(() => {
      el.style.transitionDuration = Math.round(ms * speed) + 'ms';
      el.style.transform = tf(toP, s1);
      el.style.opacity = '0.2';
      el.style.transition += `, opacity ${Math.round(ms * speed)}ms ease-in`;
    }, Math.round(delay * speed) + 16);
    setTimeout(() => el.remove(), Math.round((delay + ms) * speed) + 120);
  }

  /* ---------- Ytor, platser och HUD ---------- */
  function renderZones() {
    zonesEl.textContent = '';
    const g = G;
    // talongen: en hög baksidor med antal
    const sp = stockPos(), n = V.stock;
    const stock = h('div', {class: 'stock' + (n ? '' : ' empty'), dataset: {tap: 'stock'}, style: {left: (sp.x - g.pw / 2) + 'px', top: (sp.y - g.ph / 2) + 'px', width: g.pw + 'px', height: g.ph + 'px'}});
    const layers = Math.min(5, Math.ceil(n / 12));
    for (let i = 0; i < layers; i++) stock.append(h('div', {class: 'slayer', style: {transform: `translate(${-i * 1.3}px, ${-i * 1.6}px)`}, html: backHTML(i % 2)}));
    stock.append(h('div', {class: 'count'}, n ? String(n) : '0'));
    if (!n) stock.append(h('div', {class: 'zlabel'}, 'Slut'));
    zonesEl.append(stock);
    // högen: ram, antal och status (frusen, stopp)
    const pp = pilePos();
    const pz = h('div', {class: 'pilezone' + (V.pile.length ? '' : ' empty'), dataset: {tap: 'pile'}, style: {left: (pp.x - g.pw / 2) + 'px', top: (pp.y - g.ph / 2) + 'px', width: g.pw + 'px', height: g.ph + 'px'}});
    if (V.pile.length > 1) pz.append(h('div', {class: 'count pc'}, String(V.pile.length)));
    zonesEl.append(pz);
    const top = Rules.top(V);
    const tags = [];
    if (V.frozen || V.opts.frozen) tags.push(h('span', {class: 'tag frozen', html: UI.icon('snow') + '<b>Frusen</b>'}));
    else if (!spectator && V.phase !== 'end' && V.phase !== 'over' && !Rules.opened(V, myTeam())) tags.push(h('span', {class: 'tag frozen soft', html: UI.icon('snow') + (V.opts.players === 4 ? '<b>Frusen för er</b>' : '<b>Frusen för dig</b>')}));
    if (top != null && Cards.black3(top)) tags.push(h('span', {class: 'tag stop', html: UI.icon('stop') + '<b>Stopp</b>'}));
    if (tags.length) {
      const tagBox = h('div', {class: 'piletags', style: G.portrait ? {left: (pp.x + g.pw / 2 + 8) + 'px', top: (pp.y - 22) + 'px'} : {left: (G.center.x + 4) + 'px', top: (pp.y + g.ph / 2 + 10) + 'px', width: (G.center.w - 8) + 'px', alignItems: 'center'}}, tags);
      zonesEl.append(tagBox);
    }
    // vad som just hände (en rad vid talongen och högen)
    // (liggande telefon: raden står överst i knappkolumnen i stället, se Play.renderBar)
    if (lastMove && V.phase !== 'end' && V.phase !== 'over' && !(G.side && !spectator)) {
      let st = null;
      if (G.portrait) st = {right: (g.W - (sp.x - g.pw / 2) + 10) + 'px', top: (sp.y - g.ph / 2) + 'px', maxWidth: Math.max(80, sp.x - g.pw / 2 - 18 - g.sa.l) + 'px', textAlign: 'right'};
      else {
        // stor liggande skärm: under högens märken om det får plats, annars ovanför talongen (aldrig in under handen)
        const lineH = 14 * g.ui * .86 * 1.3, c = G.center;
        const belowTop = pp.y + g.ph / 2 + (tags.length ? 38 : 10), below = c.y + c.h - belowTop;
        const aboveBot = sp.y - g.ph / 2 - 12, above = aboveBot - c.y;
        const base = {left: (c.x + 2) + 'px', width: (c.w - 4) + 'px', textAlign: 'center'};
        if (below >= lineH * 2 || (below >= lineH && above < lineH * 2)) st = {...base, top: belowTop + 'px', '--lines': Math.min(4, Math.floor(below / lineH))};
        else if (above >= lineH) st = {...base, bottom: (g.H - aboveBot) + 'px', '--lines': Math.min(4, Math.floor(above / lineH))};
      }
      if (st) zonesEl.append(h('div', {class: 'lastmove tap' + (st['--lines'] ? ' clamp' : ''), dataset: {tap: 'history'}, title: 'Visa de senaste dragen', style: st}, lastMove));
    }
    // mälningsytor: ram, lagets namn, poäng på bordet, och platsen för en ny mälning
    V.teams.forEach((t, ti) => {
      const a = g.melds[ti];
      if (!a) return;
      const mine = ti === myTeam() && !spectator;
      const col = tcol(ti), head = a.head || 0;
      const box = h('div', {class: 'meldarea' + (mine ? ' mine' : '') + (head ? ' headed' : ''), dataset: {tap: 'meldarea', team: ti}, style: {left: a.x + 'px', top: (a.y - head) + 'px', width: a.w + 'px', height: (a.h + head) + 'px', '--tc': col, '--head': head + 'px'}});
      if (head) {
        const s = V.teams[ti].seats[0], st = V.seats[s];
        box.append(h('div', {class: 'mhead'}, Hemma.av(st.av || '🙂'), h('span', {class: 'nm'}, st.name)));
      }
      const {melds} = teamMelds(ti);
      if (!melds.length && !(V.red3[ti] || []).length) box.append(h('div', {class: 'empty-note'}, mine ? (Rules.opened(V, ti) ? '' : `${V.opts.players === 4 ? 'Ert' : 'Ditt'} första utlägg: minst ${Rules.minFor(V, ti)} poäng`) : teamLabel(ti) + ' har inte lagt ut'));
      zonesEl.append(box);
    });
    meldCols.forEach(c => {
      if (c.slot) {
        const el = h('div', {class: 'newslot' + (Play.slotHot() ? ' hot' : ''), dataset: {tap: 'newmeld'}, style: {left: (c.x + (c.w - c.mw) / 2) + 'px', top: (c.y + 2) + 'px', width: c.mw + 'px', height: c.mh + 'px'}, html: UI.icon('plus')});
        zonesEl.append(el);
      } else if (c.r !== 'red3') {
        // träffyta för mälningen (lättare att träffa än korten)
        const el = h('div', {class: 'meldhit' + (c.team === myTeam() && Play.meldHot(c.r) ? ' hot' : ''), dataset: {tap: 'meld', team: c.team, r: c.r}, style: {left: c.x + 'px', top: c.y + 'px', width: c.w + 'px', height: c.h + 'px'}});
        if (c.can) el.append(h('div', {class: 'canribbon ' + (c.natural ? 'nat' : 'mix'), style: {top: (c.mh + 3) + 'px'}}, c.natural ? 'Ren' : 'Blandad'));
        if (c.can || c.compact) el.append(h('div', {class: 'mcount' + (c.can ? ' can' : ''), style: {left: (c.w / 2 + c.mw / 2 - 12) + 'px', top: (c.mh - 12) + 'px'}}, String(c.n), c.wild && !c.can ? h('i', {}, '★'.repeat(c.wild)) : null));
        zonesEl.append(el);
      }
    });
  }
  // lagets färg sett från mig: mitt lag är alltid guld
  const tcol = ti => UI.teamColor(ti, spectator ? -1 : myTeam(), V ? V.teams.length : 2);
  T.teamColor = ti => V ? tcol(ti) : UI.TEAM_COLORS[ti];
  const teamLabel = ti => {
    if (!V) return '';
    if (V.opts.players === 4) return ti === myTeam() && !spectator ? 'Ni' : V.teams[ti].seats.map(s => V.seats[s].name).join(' & ');
    return V.seats[V.teams[ti].seats[0]].name;
  };
  T.teamLabel = teamLabel;

  function renderSeats() {
    seatsEl.textContent = '';
    for (let s = 0; s < players(); s++) {
      const r = G.seats[s];
      if (!r || r.mine) continue;
      const st = V.seats[s];
      const turn = V.turn === s && (V.phase === 'draw' || V.phase === 'play' || V.phase === 'ask');
      const cnt = Rules.handCount(V, s);
      const ti = V.team[s];
      const partner = !spectator && V.opts.players === 4 && ti === myTeam();
      const cls = 'seat' + (r.mine ? ' mine' : '') + (turn ? ' turn' : '') + (r.inHud ? ' inhud' : '') + (st.off ? ' off' : '') + (partner ? ' partner' : '') + (V.phase === 'ask' && V.ask && V.ask.to === s ? ' asked' : '');
      const el = h('div', {class: cls, dataset: {tap: 'seat', seat: s}, style: {left: r.x + 'px', top: r.y + 'px', width: r.mine ? '' : r.w + 'px', height: r.h + 'px', '--tc': tcol(ti)}},
        Hemma.av(st.av || (st.kind === 'cpu' ? '🤖' : '🙂')),
        h('span', {class: 'sinfo'}, h('span', {class: 'nm'}, st.name), h('span', {class: 'cnt', title: 'Kort på handen'}, partner ? h('b', {class: 'ptag'}, 'partner') : null, cnt === 1 ? '1 kort' : cnt + ' kort', turn ? h('span', {class: 'think'}, h('i'), h('i'), h('i')) : null))
      );
      if (st.kind === 'cpu' && !r.mine) el.title = st.name + ' (datorn, ' + (AI.LEVELS[st.level] ? AI.LEVELS[st.level].label.toLowerCase() : 'medel') + ')';
      seatsEl.append(el);
    }
  }

  function renderHud() {
    hudEl.textContent = '';
    const menu = h('button', {class: 'hudbtn', 'aria-label': 'Meny', html: UI.icon('menu')});
    menu.onclick = () => { Sound.play('click'); hudHandlers.menu && hudHandlers.menu(); };
    const scores = h('div', {class: 'scores'});
    // mitt lag först
    const order = V.teams.map((_, i) => i).sort((a, b) => (a === myTeam() ? -1 : b === myTeam() ? 1 : a - b));
    order.forEach(ti => {
      const t = V.teams[ti];
      const opened = Rules.opened(V, ti);
      const chip = h('div', {class: 'score' + (ti === myTeam() && !spectator ? ' mine' : '') + (V.opts.players === 3 && G && !G.portrait ? ' slim' : ''), style: {'--tc': tcol(ti)}},
        h('span', {class: 'tn'}, V.opts.players === 4 ? (ti === myTeam() && !spectator ? 'Ni' : 'De') : (V.teams[ti].seats[0] === me && !spectator ? 'Du' : V.seats[V.teams[ti].seats[0]].name)),
        h('b', {}, fmt(t.score)),
        !opened && V.phase !== 'end' && V.phase !== 'over' ? h('span', {class: 'min', title: 'Minimipoäng för första utlägget'}, String(Rules.minFor(V, ti))) : (Rules.canastas(V, ti) ? h('span', {class: 'cans', title: 'Canastor'}, '★'.repeat(Math.min(4, Rules.canastas(V, ti)))) : null));
      scores.append(chip);
    });
    const info = h('div', {class: 'hudinfo'}, `Giv ${V.round}` + (V.opts.target ? ` · till ${fmt(V.opts.target)}` : ''));
    const right = h('div', {class: 'hudright'});
    if (hudHandlers.extra) right.append(...hudHandlers.extra());
    hudEl.append(menu, scores, info, right);
  }

  /* ---------- Träffar ---------- */
  function tapInfo(target) {
    const el = target.closest('[data-tap], .card');
    if (!el || !root.contains(el)) return null;
    if (el.classList.contains('card')) {
      const id = +el.dataset.id, zone = el.dataset.zone;
      if (zone === 'hand') return {kind: 'hand', id};
      if (zone === 'meld') return {kind: 'meld', team: +el.dataset.team, r: +el.dataset.r, id};
      if (zone === 'pile') return {kind: 'pile'};
      if (zone === 'red3') return {kind: 'red3'};
      return null;
    }
    const k = el.dataset.tap;
    if (k === 'meld') return {kind: 'meld', team: +el.dataset.team, r: +el.dataset.r};
    if (k === 'meldarea') return {kind: 'meldarea', team: +el.dataset.team};
    if (k === 'seat') return {kind: 'seat', seat: +el.dataset.seat};
    return {kind: k};
  }

  /* ---------- Utåt ---------- */
  T.init = o => {
    root = $('scrTable'); cardsEl = $('cards'); zonesEl = $('zones'); seatsEl = $('seats'); hudEl = $('hud');
    onTap = o.onTap || onTap;
    hudHandlers = o.hud || {};
    if (!$('safeProbe')) document.body.append(h('div', {id: 'safeProbe'}));
    root.addEventListener('click', e => {
      if (e.target.closest('#bar, #hud, button')) return;
      const t = tapInfo(e.target);
      if (t) onTap(t, e);
    });
    let rt = 0;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { try { if (V && !root.hidden) { G = geometry(); settle({}, 0); Bus.emit('table-layout'); } } catch (e) { console.error(e); } }, 80); };
    addEventListener('resize', onResize);
    addEventListener('orientationchange', onResize);
  };
  // Visar ett läge direkt (utan animationer för korten som redan finns)
  T.set = (view, o = {}) => {
    V = view;
    me = view.me >= 0 ? view.me : 0;
    spectator = view.me < 0;
    if (o.stage) stage = o.stage;
    root.classList.toggle('spectator', spectator);
    G = geometry();
    settle({}, o.ms ?? 0);
  };
  T.clear = () => { els.forEach(el => el.remove()); els.clear(); cardsEl.textContent = ''; zonesEl.textContent = ''; seatsEl.textContent = ''; V = null; stage = []; sel.clear(); fresh.clear(); lastMove = ''; history = []; };
  T.setStage = (groups, ms = 300) => { stage = groups || []; if (V) { G = geometry(); settle({}, ms); } };
  T.setSel = (ids, ms = 160) => { sel = new Set(ids); if (V) settle({}, ms); };
  T.refresh = (ms = 200) => { if (V) { G = geometry(); settle({}, ms); } };
  T.cardRect = id => { const el = els.get(id); return el ? el.getBoundingClientRect() : null; };
  T.meldCol = (team, r) => meldCols.find(c => c.team === team && c.r === r) || null;
  T.meldCols = () => meldCols.slice();

  // En mening om det senaste draget: "Doris tog högen (8 kort) och lade ut tre kungar"
  const nameOf = (view, seat) => seat === view.me ? 'Du' : (view.seats[seat] ? view.seats[seat].name : '');
  const cardTxt = id => Cards.cardName(id) + (id < 104 ? ' ' + Cards.SUITS[Cards.suit(id)] : '');
  const list = parts => parts.length <= 1 ? parts.join('') : parts.slice(0, -1).join(', ') + ' och ' + parts[parts.length - 1];
  function describe(view, ev) {
    const out = [];
    let who = null;
    for (const e of ev) {
      if (e.seat != null && e.seat >= 0 && who == null) who = e.seat;
      switch (e.t) {
        case 'draw': out.push(e.ids && e.seat === view.me ? 'drog ' + list(e.ids.map(cardTxt)) : e.n === 2 ? 'drog två kort' : 'drog ett kort'); break;
        case 'take': out.push(`tog högen (${e.n + 1} kort)`); break;
        case 'meld': out.push('lade ut ' + list(e.groups.map(g => {
          const nat = g.ids.filter(id => !Cards.wild(id)).length, w = g.ids.length - nat, r = g.r;
          if (!nat) return `${w === 1 ? 'ett vilt kort' : Cards.num(w) + ' vilda kort'} till ${Cards.rankName(r, 2)}`;
          return `${Cards.num(g.ids.length, r === 1)} ${Cards.rankName(r, g.ids.length)}`;
        }))); break;
        case 'discard': out.push('slängde ' + cardTxt(e.id)); break;
        case 'red3': if (!e.deal) out.push('fick en röd trea'); break;
        case 'ask': out.push('frågade om att gå ut'); break;
        case 'answer': out.push(e.yes ? 'svarade ja' : 'svarade nej'); break;
      }
    }
    if (!out.length || who == null) return null;
    return {seat: who, text: nameOf(view, who) + ' ' + list(out)};
  }
  T.lastMove = () => lastMove;
  T.history = () => history.slice();
  // De senaste dragen i given (tryck på raden om senaste draget, eller Meny → Senaste dragen)
  T.showHistory = () => {
    const box = h('div', {class: 'movelist'});
    if (!history.length) box.append(h('p', {class: 'muted'}, 'Inget har hänt i den här given än.'));
    history.slice(-12).reverse().forEach((m, i) => box.append(h('div', {class: 'mv' + (i ? '' : ' last')}, Hemma.av(m.av), h('span', {class: 'tx'}, m.text))));
    UI.sheet({title: 'Senaste dragen', cls: 'small', body: box});
  };

  // Ett nytt läge med händelser: korten flyger dit de ska och effekterna spelas. Löftet är klart när det syns.
  T.apply = async (view, ev = []) => {
    const avOf = s => (view.seats[s] && view.seats[s].av) || '🙂';
    if (ev.some(e => e.t === 'deal')) { lastMove = ''; history = []; }
    else if (ev.some(e => e.t === 'undo')) {
      // det som hände efter mitt släng (och själva slänget) försvinner ur listan
      while (history.length) { const m = history.pop(); if (m.seat === view.me) break; }
      lastMove = 'Du ångrade slänget';
      history.push({seat: view.me, av: avOf(view.me), text: lastMove});
    } else {
      const d = describe(view, ev);
      if (d) { lastMove = d.text; history.push({seat: d.seat, av: avOf(d.seat), text: d.text}); if (history.length > 40) history.shift(); }
    }
    const prev = V;
    V = view;
    me = view.me >= 0 ? view.me : 0;
    spectator = view.me < 0;
    G = geometry();
    const from = new Map(), to = new Map(), delay = new Map();
    const fx = [];
    let longest = MOVE;
    const mySeat = spectator ? -99 : me;
    for (const e of ev) {
      switch (e.t) {
        case 'deal': {
          // utdelningen: baksidor till alla platser, mina kort vänds upp på handen
          stage = []; sel.clear(); fresh.clear();
          els.forEach(el => el.remove()); els.clear();
          const center = {x: G.W / 2, y: G.center.y + G.center.h / 2};
          const n = players();
          const handIds = Array.isArray(view.cards[me]) ? Cards.sort(view.cards[me]) : [];
          let k = 0;
          for (let i = 0; i < view.opts.deal; i++) for (let j = 1; j <= n; j++) {
            const s = (view.dealer + j) % n;
            if (s === mySeat) { const id = handIds[i]; if (id != null) { from.set(id, Object.assign({}, center, {s: .5, down: true})); delay.set(id, k * 34); } }
            else flyBack(center, seatPos(s), {delay: k * 34, ms: 380, deck: k % 2});
            k++;
          }
          longest = Math.max(longest, k * 34 + 500);
          fx.push(() => Sound.play('shuffle'));
          break;
        }
        case 'up': (e.ids || []).forEach((id, i) => { from.set(id, Object.assign(stockPos(), {s: G.pw / G.cw, down: true})); delay.set(id, (prev ? 0 : 900) + i * 200); }); break;
        case 'draw':
          if (e.seat === mySeat && e.ids) e.ids.forEach((id, i) => { from.set(id, Object.assign(stockPos(), {s: G.pw / G.cw, down: true})); delay.set(id, i * 140); fresh.add(id); });
          else for (let i = 0; i < (e.n || 1); i++) flyBack(stockPos(), seatPos(e.seat), {delay: i * 140, deck: i % 2});
          fx.push(() => Sound.play('draw'));
          break;
        case 'red3': {
          const src = e.seat === mySeat ? (e.deal ? {x: G.W / 2, y: G.hand.y + G.handH / 2} : stockPos()) : (e.pile ? pilePos() : seatPos(e.seat));
          from.set(e.id, Object.assign(src, {s: .6, down: e.seat !== mySeat && !e.pile}));
          delay.set(e.id, 260);
          if (e.rep != null && e.seat === mySeat) { from.set(e.rep, Object.assign(stockPos(), {s: G.pw / G.cw, down: true})); delay.set(e.rep, 520); fresh.add(e.rep); }
          fx.push(() => { Sound.play('red3'); T.pop(e.id, 'Röd trea +100'); });
          break;
        }
        case 'take': {
          if (e.seat !== mySeat) {
            // högens kort (utom det översta) försvinner in i den andras hand
            (prev ? prev.pile : []).slice(0, -1).forEach((id, i) => { to.set(id, Object.assign(seatPos(e.seat), {s: .45, down: true})); delay.set(id, 120 + i * 18); });
            e.ids.forEach(id => from.set(id, Object.assign(seatPos(e.seat), {s: .45, down: true})));
            (e.melds || []).flat().forEach(id => from.set(id, Object.assign(seatPos(e.seat), {s: .45, down: true})));
          } else {
            (e.gain || []).forEach((id, i) => { from.set(id, Object.assign(pilePos(), {s: G.pw / G.cw})); delay.set(id, 200 + i * 25); fresh.add(id); });
          }
          fx.push(() => { Sound.play('take'); T.banner(e.seat === mySeat ? `Du tog högen` : `${view.seats[e.seat].name} tog högen`, e.n + 1 >= 6 ? `${e.n + 1} kort` : ''); });
          longest = Math.max(longest, 700 + (e.n || 0) * 18);
          break;
        }
        case 'meld':
          if (e.seat !== mySeat) e.groups.forEach(g => g.ids.forEach((id, i) => { from.set(id, Object.assign(seatPos(e.seat), {s: .45, down: true})); delay.set(id, i * 60); }));
          fx.push(() => Sound.play('meld'));
          break;
        case 'discard':
          if (e.seat !== mySeat) from.set(e.id, Object.assign(seatPos(e.seat), {s: .45, down: true}));
          delay.set(e.id, ev.some(x => x.t === 'meld') ? 380 : 0);
          fx.push(() => { Sound.play(e.freeze ? 'freeze' : 'discard', ev.some(x => x.t === 'meld') ? 380 : 0); if (e.freeze) T.banner('Högen är frusen', view.seats[e.seat].name + ' slängde ett vilt kort'); });
          break;
        case 'canasta':
          fx.push(() => setTimeout(() => T.canastaFx(e.team, e.r, e.natural), 420 * Time.speed()));
          break;
      }
    }
    if (ev.some(e => e.t === 'play' || e.t === 'discard')) { /* hinted above */ }
    // mina egna kort som redan finns: glid (de har inga hints)
    settle({from, to, delay}, MOVE);
    fx.forEach(f => { try { f(); } catch (err) { console.error(err); } });
    if (fresh.size) setTimeout(() => { fresh.clear(); if (V) settle({}, 300); }, 1900 * Time.pace());
    await wait(longest + 80);
  };

  /* ---------- Effekter ---------- */
  let bannerT = 0;
  // (low: nere vid knapparna i stället för mitt på bordet, för "Din tur")
  T.banner = (text, sub = '', ms = 1500, {low = false} = {}) => {
    const b = $('banner');
    b.innerHTML = '';
    b.classList.toggle('low', !!low);
    b.append(h('div', {class: 'bn-main'}, text));
    if (sub) b.append(h('div', {class: 'bn-sub'}, sub));
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(bannerT);
    bannerT = setTimeout(() => b.classList.remove('on'), ms * Math.max(.6, Time.pace()));
  };
  // Ett litet meddelande som stiger upp från ett kort
  T.pop = (id, text) => {
    const el = els.get(id); if (!el) return;
    const r = el.getBoundingClientRect();
    const p = h('div', {class: 'pop', style: {left: (r.left + r.width / 2) + 'px', top: r.top + 'px'}}, text);
    document.body.append(p);
    setTimeout(() => p.remove(), 1600);
  };
  T.canastaFx = (team, r, natural) => {
    const c = T.meldCol(team, r);
    Sound.play(natural ? 'canastaNat' : 'canasta');
    vibrate([20, 40, 30]);
    T.banner('Canasta!', (natural ? 'Ren canasta · 500' : 'Blandad canasta · 300') + ' · ' + Cards.rankName(r, 2));
    if (!c) return;
    const box = h('div', {class: 'shine ' + (natural ? 'nat' : 'mix'), style: {left: (c.x + c.w / 2) + 'px', top: (c.y + (c.mh || 60) / 2) + 'px'}});
    for (let i = 0; i < 14; i++) box.append(h('i', {style: {'--a': (i * 360 / 14) + 'deg', '--d': (30 + (i % 3) * 16) + 'px'}}));
    zonesEl.append(box);
    setTimeout(() => box.remove(), 1400);
  };
  // Skakar ett kort (fel drag)
  T.shake = ids => { (Array.isArray(ids) ? ids : [ids]).forEach(id => { const el = els.get(id); if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }); };
  T.highlight = (kind, on) => root.classList.toggle('hl-' + kind, !!on);
  return T;
})();

/* ---- 08-play.js ---- */
/* ================= Spelaren: välja kort, lägga ut, ta högen och slänga ================= */
// Allt spelaren gör i sitt drag förbereds först här (mälningarna kan ångras) och skickas till reglerna när
// spelaren slänger ett kort eller går ut. Dra och ta högen skickas direkt.
//   Tryck på kort på handen: välj. Knappen "Alla sjuor" (eller dubbeltryck, om det är påslaget): alla av samma valör.
//   Tryck på en mälning eller på +: lägg de valda korten där. Tryck på högen: ta den (i början av draget)
//   eller släng det valda kortet (i slutet). Tryck på talongen: dra.
const Play = (() => {
  const P = {};
  let V = null, me = 0, send = () => '', active = false;
  let sel = new Set(), stage = [], busy = false, lastTap = {id: null, t: 0}, note = '', undoT = 0;
  Bus.on('toast', (text, kind) => { if (V && active && kind !== 'hint' && Menu.screen() === 'table') { note = text; P.renderBar(); } });
  Bus.on('table-layout', () => { if (V) P.renderBar(); });
  let barEl = null;
  const hand = () => V && Array.isArray(V.cards[me]) ? V.cards[me] : [];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const myTurn = () => active && V && V.turn === me && (V.phase === 'draw' || V.phase === 'play');
  const phase = () => V ? V.phase : '';
  const team = () => V.team[me];
  const stagedIds = () => new Set(stage.flatMap(g => g.ids));
  const restHand = () => { const st = stagedIds(); return hand().filter(id => !st.has(id)); };

  P.init = o => { send = o.send; barEl = $('bar'); };
  P.reset = () => { sel.clear(); stage = []; busy = false; Table.setSel([]); };
  // Nytt läge från spelet (efter varje drag)
  P.update = (view, o = {}) => {
    if (!V || view.k !== V.k) note = '';
    V = view;
    me = view.me;
    active = me >= 0 && !o.watch;
    busy = false;
    // förberedda mälningar gäller bara i mitt eget spel-drag
    if (!(V.turn === me && (V.phase === 'play' || V.phase === 'ask'))) stage = [];
    const h = new Set(hand());
    sel = new Set([...sel].filter(id => h.has(id) && !stagedIds().has(id)));
    Table.setStage(stage, 0);
    Table.setSel([...sel], 0);
    P.renderBar();
  };
  P.stage = () => stage.slice();
  // passar de valda korten på någon av lagets mälningar?
  const fitsMeld = () => !!V && V.phase === 'play' && sel.size > 0 && [...new Set((V.melds[team()] || []).map(m => m.r))].some(r => P.meldHot(r));
  const coach = () => { if (V && active && typeof Coach !== 'undefined') Coach.check(V, sel.size, stage.length, fitsMeld()); };

  /* ---------- Vad bordet ska visa ---------- */
  P.wantSlot = () => myTurn() && V.phase === 'play';
  P.slotHot = () => {
