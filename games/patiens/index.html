    const oldName = Game.NAMES[saved.g];
    if (g && g === saved.g && !saved.daily) newLabel = 'en ny giv';
    let choice = null;
    await new Promise(res => UI.sheet({title: 'Du har en patiens som inte är klar', cls: 'small', onClose: res,
      body: h('div', {}, h('p', {class: 'lead'}, `Du har en påbörjad patiens: ${oldName}${saved.daily ? ` (${dailyLabel(saved.daily)})` : ''}, ${saved.log.length} drag.`),
        h('p', {class: 'muted'}, `Vill du fortsätta med den, eller börja ${newLabel}? Den påbörjade given sparas inte om du börjar ${newLabel}.`)),
      buttons: [{label: 'Fortsätt ' + oldName, cls: 'gold', icon: 'play', onClick: () => { choice = 'old'; }}, {label: 'Börja ' + newLabel, cls: 'ghost', onClick: () => { choice = 'new'; }}]}));
    if (choice === 'old') { Game.resume(saved); return false; }
    // (väljer man bort en giv som tävlingen lade åt sidan försvinner den nu)
    if (choice === 'new') Game.dropPaused(saved.id);
    return choice === 'new';
  };
  async function startGame(g, o) {
    if (!(await M.confirmReplace(Game.NAMES[g], g))) return;
    Game.start(g, o || M.optsFor(g));
  }
  M.startGame = startGame;

  /* ---------- Startskärmen ---------- */
  // små bilder av varje patiens, gjorda av riktiga kort
  function miniScene(g) {
    const box = h('div', {class: 'mscene ms-' + g, 'aria-hidden': 'true'});
    const card = (id, x, y, down, r = 0) => { const c = h('div', {class: 'mc' + (down ? ' down' : ''), style: {left: x + '%', top: y + '%', transform: `rotate(${r}deg)`}}); c.innerHTML = down ? Art.back() : Art.face(id); box.append(c); };
    const C = (s, r) => Cards.make(s, r);
    if (g === 'klondike') { card(0, 4, 8, true); card(C(1, 13), 30, 8); card(C(0, 12), 30, 30); card(C(1, 11), 30, 52); card(C(3, 1), 60, 8); card(C(2, 7), 60, 36, false); }
    else if (g === 'spider') { [13, 12, 11, 10, 9].forEach((r, i) => card(C(0, r), 12 + i * 3, 4 + i * 16)); card(0, 55, 10, true); card(C(1, 5), 55, 34); }
    else if (g === 'freecell') { card(C(2, 1), 4, 6); card(C(3, 9), 36, 6); card(C(0, 10), 68, 6); card(C(1, 6), 20, 44); card(C(3, 5), 52, 44); }
    else if (g === 'pyramid') { card(C(1, 6), 36, 2); card(C(0, 7), 20, 26); card(C(2, 12), 52, 26); card(C(3, 1), 4, 50); card(C(1, 9), 36, 50); card(C(0, 4), 68, 50); }
    else if (g === 'tripeaks') { card(0, 6, 4, true); card(0, 56, 4, true); card(C(1, 8), 30, 36); card(C(3, 9), 58, 36); card(C(2, 7), 2, 36); }
    else if (g === 'aces') { card(C(0, 1), 2, 8); card(C(1, 1), 26, 8); card(C(2, 1), 50, 8); card(C(3, 9), 74, 8, false, 6); card(C(3, 1), 74, 40); }
    return box;
  }
  function tile(g, big) {
    const t = h('div', {class: 'gtile' + (big ? ' big' : '')});
    const main = h('button', {type: 'button', class: 'gmain', 'aria-label': `Spela ${Game.NAMES[g]}`},
      miniScene(g),
      h('span', {class: 'gtext'}, h('b', {}, g === 'spider' ? 'Spindel\u00ADharpan' : Game.NAMES[g]), h('span', {class: 'gdesc'}, M.DESC[g]), h('span', {class: 'gopt'}, summary(g))));
    main.onclick = () => { Sound.unlock(); Sound.play('click'); startGame(g); };
    const opt = h('button', {type: 'button', class: 'gset', 'aria-label': `Ändra hur ${Game.NAMES[g]} spelas`, html: UI.icon('gear') + '<span>Ändra</span>'});
    opt.onclick = () => { Sound.unlock(); Sound.play('click'); M.gameOpts(g, false); };
    t.append(main, opt);
    return t;
  }
  function title() {
    const root = $('scrMenu');
    root.textContent = '';
    // Träffpunkt Hemmas märke ovanför namnet (i stället för Patiensklubbens logga)
    const logo = h('div', {class: 'logo th-logo'}, h('span', {class: 'th-brand', html: Hemma.mark(34) + '<span>Träffpunkt Hemma</span>'}), h('span', {class: 'l1'}, 'Patiens'));
    const hero = h('div', {class: 'hero', 'aria-hidden': 'true'});
    if (typeof HERO_IMG !== 'undefined' && HERO_IMG) hero.style.backgroundImage = `url(${HERO_IMG})`;
    else hero.append(titleFan());
    const top = h('div', {class: 'titletop'}, hero, logo);
    const col = h('div', {class: 'titlecol'});
    const saved = Game.saved();
    if (saved && saved.log.length) col.append(UI.btn(`Fortsätt: ${Game.NAMES[saved.g]}`, () => Game.resume(saved), {cls: 'gold big', icon: 'play', sub: `${saved.log.length} drag${saved.t && Settings.clock ? ' · ' + fmtTime(saved.t) : ''}`}));
    // givar som tävlingen lade åt sidan
    for (const p of Game.paused().filter(p => !saved || p.id !== saved.id).reverse()) col.append(UI.btn(`Fortsätt: ${Game.NAMES[p.g]}`, () => Game.resume(p), {cls: 'big', icon: 'play', sub: `lagd åt sidan · ${p.log.length} drag`}));
    col.append(tile('klondike', true));
    // dagens patiens
    const d = today(), done = Stats.daily[d];
    const daily = h('button', {type: 'button', class: 'daily' + (done ? ' done' : '')}, UI.iconEl('calendar'),
      h('span', {class: 'dtext'}, h('b', {}, 'Dagens patiens'), h('span', {}, done ? (Settings.clock ? `Klar i dag på ${fmtTime(done.t)}! Samma giv för alla i dag.` : 'Klar i dag! Samma giv för alla i dag.') : 'Samma giv för alla i dag – Harpan, dra 1.')),
      done ? UI.iconEl('check', 'dcheck') : UI.iconEl('next'));
    daily.onclick = () => { Sound.unlock(); Sound.play('click'); M.daily(); };
    col.append(daily);
    col.append(h('h3', {class: 'more'}, 'Fler patienser'));
    const grid = h('div', {class: 'gtiles'});
    ['spider', 'freecell', 'pyramid', 'tripeaks', 'aces'].forEach(g => grid.append(tile(g)));
    col.append(grid);
    if (typeof Lobby !== 'undefined' && Main.onlineOk()) {
      const inRoom = typeof Race !== 'undefined' && Race.active();
      const race = UI.btn(inRoom ? `Tillbaka till rummet ${Race.code()}` : 'Tävla med familjen', () => Lobby.open(), {cls: 'big ghost', icon: 'users', sub: 'Samma giv samtidigt, var och en i sin egen telefon eller dator'});
      col.append(race);
    }
    const small = h('div', {class: 'titlesmall'},
      UI.btn('Så spelar man', () => Help.show(), {icon: 'help', cls: 'ghost'}),
      UI.btn('Inställningar', () => M.settings(), {icon: 'gear', cls: 'ghost'}),
      UI.btn('Statistik', () => M.stats(), {icon: 'chart', cls: 'ghost'}));
    col.append(small);
    const next = Hemma.nextBox();
    if (next) col.append(next);
    root.append(h('div', {class: 'titlewrap'}, top, col));
  }
  function titleFan() {
    const fan = h('div', {class: 'titlefan'});
    const ids = [Cards.make(1, 1), Cards.make(0, 13), Cards.make(2, 12), Cards.make(3, 11), Cards.make(1, 10)];
    ids.forEach((id, i) => { const c = h('div', {class: 'tcard', style: {'--i': i - (ids.length - 1) / 2}}); c.innerHTML = Art.face(id); fan.append(c); });
    return fan;
  }
  M.refreshTitle = () => { if (screen === 'title') title(); };

  /* ---------- Dagens patiens ---------- */
  M.daily = () => {
    const d = today();
    const o = {draw: 1, passes: 0};
    const seed = Deals.daily('klondike', o, d);
    const saved = Game.saved();
    if (saved && saved.daily === d) return Game.resume(saved);
    if (Stats.daily[d]) {
      UI.sheet({title: 'Dagens patiens', cls: 'small', body: h('p', {class: 'lead'}, Settings.clock ? `Du har redan klarat dagens patiens på ${fmtTime(Stats.daily[d].t)} (${Stats.daily[d].m} drag). Vill du spela den igen?` : `Du har redan klarat dagens patiens (${Stats.daily[d].m} drag). Vill du spela den igen?`),
        buttons: [{label: 'Stäng', cls: 'ghost'}, {label: 'Spela igen', cls: 'gold', onClick: async () => { if (await M.confirmReplace('dagens patiens')) Game.start('klondike', o, {seed, daily: d}); }}]});
      return;
    }
    (async () => { if (await M.confirmReplace('dagens patiens')) Game.start('klondike', o, {seed, daily: d}); })();
  };
  M.shareDaily = async (d, t, m) => {
    const text = `Jag klarade dagens patiens (${d}) på ${fmtTime(t)} med ${m} drag i Träffpunkt Hemma!`;
    try {
      if (navigator.share) { await navigator.share({text}); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); UI.toast('Texten är kopierad. Klistra in den i ett meddelande.'); }
    catch (e) { UI.sheet({title: 'Berätta', cls: 'small', body: h('p', {class: 'lead selectable'}, text)}); }
  };

  /* ---------- Första gången ---------- */
  M.intro = () => {
    Store.set('intro', true);
    let sheet = null;
    const opt = (ttl, sub, on) => h('button', {type: 'button', class: 'introopt' + (on ? ' calm' : ''), onclick: () => {
      Sound.unlock(); Sound.play('click');
      Main.setCalm(on);
      sheet.close();
      if (on) UI.toast('Lugnt och tydligt är påslaget. Det går att ändra under Inställningar.');
    }}, h('b', {}, ttl), h('span', {}, sub));
    const body = h('div', {class: 'intro'},
      h('p', {class: 'lead'}, 'Hur vill du ha det?'),
      opt('Lugnt och tydligt', 'Större text, lugnare tempo, ingen klocka och lätta givar att börja med.', true),
      opt('Som vanligt', 'Vanligt tempo. Allt går att ändra under Inställningar.', false));
    sheet = UI.sheet({title: 'Välkommen till Patiens', cls: 'small introsheet', body, dismiss: false});
  };

  /* ---------- Inställningar ---------- */
  // Det som oftast ändras står först. Resten ligger under "Fler inställningar" (sparas öppet eller stängt).
  M.settings = () => {
    const body = h('div', {class: 'settings'});
    const set = (k, v) => { Settings[k] = v; saveSettings(); };
    const redraw = () => { if (Game.active()) { Table.refresh(); HudBar.render(); } };
    let moreOpen = Store.get('moreSettings', false);
    const fill = () => {
      body.textContent = '';
      const more = h('details', {class: 'more', open: moreOpen, ontoggle: e => { moreOpen = e.target.open; Store.set('moreSettings', moreOpen); }}, h('summary', {}, 'Fler inställningar'),
        h('div', {class: 'house'}, ...[
          M.field('När jag trycker på ett kort', M.seg([['move', 'Flyttas det direkt', 'dit det passar bäst'], ['select', 'Väljs det', 'sedan trycker jag dit det ska']], Settings.tap, v => set('tap', v))),
          M.field('Kort läggs upp på ess-högarna av sig själva', M.seg([['off', 'Nej'], ['safe', 'När de inte behövs'], ['all', 'Alltid']], Settings.auto, v => set('auto', v)), '”När de inte behövs” lägger bara upp kort som inte kan behövas i kolumnerna längre.'),
          M.field('Tempo', M.seg([['lugn', 'Lugnt'], ['normal', 'Normalt'], ['snabb', 'Snabbt']], Settings.speed, v => set('speed', v))),
          M.toggle('Visa tiden', Settings.clock, v => { set('clock', v); redraw(); }),
          M.toggle('Visa antal drag', Settings.moves, v => { set('moves', v); redraw(); }),
          M.toggle('Hjälp och förklaringar', Settings.hints, v => set('hints', v), 'Korta förklaringar första gångerna, och besked när det tar stopp'),
          M.toggle('Fråga innan en påbörjad giv överges', Settings.confirmNew, v => set('confirmNew', v)),
          navigator.vibrate ? M.toggle('Vibration', Settings.haptics, v => set('haptics', v), 'En liten skakning när ett drag inte går') : null,
          M.toggle('Fyrfärgslek', Settings.fourColor, v => { set('fourColor', v); Main.installArt(); }, 'Ruter blir blå och klöver gröna (ruter räknas fortfarande som röd och klöver som svart)'),
          M.field('Bordet', M.seg([['bla', 'Kvällsblått'], ['gron', 'Grönt'], ['rod', 'Vinrött'], ['svart', 'Mörkt']], Settings.felt, v => { set('felt', v); Main.applyLook(); })),
          M.field('Kortens baksida', M.seg([['bla', 'Kvällsblå'], ['rod', 'Vinröd']], Settings.back, v => { set('back', v); Main.installArt(); })),
          M.field('Talongen i Harpan och Spindelharpan', M.seg([[false, 'Till vänster', 'som i Windows'], [true, 'Till höger', 'bra för höger hand']], !!Settings.left, v => { set('left', v); redraw(); })),
          M.toggle('Lugna animationer', Settings.calmFx, v => { set('calmFx', v); Main.applyLook(); }, 'Inga studsande kort och ingen konfetti när patiensen går ut'),
          UI.btn('Visa förklaringarna igen', () => { Coach.reset(); UI.toast('Förklaringarna visas igen.'); }, {cls: 'ghost small', icon: 'bulb'})
        ].filter(Boolean)));
      body.append(...[
        M.toggle('Lugnt och tydligt', Settings.calm, v => { Main.setCalm(v); fill(); }, 'Lugnare tempo, större text, ingen klocka, lätta givar och en fråga innan en påbörjad giv överges'),
        M.field('Storlek på text och knappar', M.seg([['normal', 'Normal'], ['stor', 'Stor'], ['xstor', 'Extra stor']], Settings.size, v => { set('size', v); Main.applyLook(); redraw(); })),
        M.field('Bokstäverna på korten', M.seg([['sv', 'Kn D K E', 'svenska'], ['int', 'J Q K A', 'engelska']], Settings.letters, v => { set('letters', v); Main.installArt(); })),
        M.field('Givar', M.dealSeg(v => set('deals', v)), 'Lätta givar vinns med vanliga, självklara drag (i Harpan). Går att vinna: datorn har räknat ut att det går. Helt slumpade: ibland går det inte, som med riktiga kort.'),
        h('h3', {}, 'Ljud'),
        M.range('Ljudeffekter', Settings.sfx, v => { set('sfx', v); Sound.setVolumes(); }),
        Sound.hasMusic() ? M.range('Musik', Settings.music, v => { set('music', v); Sound.setVolumes(); Sound.music(); }) : null,
        Voice.available() ? M.toggle('Uppläsning', Settings.voice, v => { set('voice', v); if (v) Voice.preload(); }, 'Tipsen och berömmet läses upp') : null,
        more,
        h('p', {class: 'muted small2 center'}, `Patiens i Träffpunkt Hemma · version ${BUILD_VER}`)
      ].filter(Boolean));
    };
    fill();
    UI.sheet({title: 'Inställningar', body, cls: 'settingssheet', onClose: () => { if (screen === 'title') title(); }});
  };

  /* ---------- Statistik ---------- */
  const STAT_KEYS = [['klondike1', 'Harpan, dra 1'], ['klondike3', 'Harpan, dra 3'], ['spider1', 'Spindelharpan, en färg'], ['spider2', 'Spindelharpan, två färger'], ['spider4', 'Spindelharpan, fyra färger'], ['freecell', 'FreeCell'], ['pyramid', 'Pyramiden'], ['tripeaks', 'Tre toppar'], ['aces', 'Idioten']];
  M.stats = (focus = null) => {
    const body = h('div', {class: 'statsbody'});
    const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
    let any = false;
    for (const [k, name] of STAT_KEYS) {
      const s = Stats.games[k];
      if (!s || !s.played) continue;
      any = true;
      const rows = [['Spelade', s.played], ['Vunna', `${s.won} (${pct(s.won, s.played)})`], ['Vinster i rad', `${s.streak} (bäst ${s.bestStreak})`], ['Bästa tid', s.bestTime == null ? '–' : fmtTime(s.bestTime)], ['Minst antal drag', s.fewest == null ? '–' : s.fewest]];
      body.append(h('details', {class: 'statgame', open: focus ? k === focus : true}, h('summary', {}, name), h('table', {class: 'stattable'}, ...rows.map(([a, b]) => h('tr', {}, h('td', {}, a), h('td', {}, String(b)))))));
    }
    const days = Object.keys(Stats.daily || {}).sort();
    if (days.length) {
      let streak = 0;
      const d = new Date();
      if (!Stats.daily[today(d)]) d.setDate(d.getDate() - 1);
      while (Stats.daily[today(d)] && streak < 3650) { streak++; d.setDate(d.getDate() - 1); }
      body.append(h('details', {class: 'statgame', open: true}, h('summary', {}, 'Dagens patiens'), h('table', {class: 'stattable'}, h('tr', {}, h('td', {}, 'Klarade dagar'), h('td', {}, String(days.length))), h('tr', {}, h('td', {}, 'Dagar i rad'), h('td', {}, String(streak))))));
    }
    if (!any && !days.length) body.append(h('p', {class: 'lead'}, 'Här syns hur det går när du har spelat några patienser.'));
    UI.sheet({title: 'Statistik', cls: 'small', body, buttons: any ? [{label: 'Nollställ', cls: 'ghost', close: false, onClick: async sh => {
      if (await UI.confirm('Nollställa all statistik på den här enheten?', {yes: 'Nollställ', danger: true})) { Stats.games = {}; Stats.daily = {}; saveStats(); sh.close(); M.stats(); }
    }}] : []});
  };
  return M;
})();

/* ---- 14b-hemma.js ---- */
/* ================= Träffpunkt Hemma: spelet inne i plattan ================= */
// Träffpunkt Hemmas egen Patiens (en kopia av Patiensklubben, se games/README.md). Öppnas den i plattans ram
// säger den till plattan att den är redo (postMessage) och får inställningarna därifrån: själv eller vid ett bord på
// Spelstunden, textstorleken, om ljudet och rösten ska höras och en rad om nästa Spelstund. Vid bordet spelar alla
// samma giv och tävlar om att bli klar först: spelet berättar hur långt man har kommit, och plattan visar de andras.
// Öppnas sidan direkt, utan plattan, är den en vanlig patiens.
//   spelet → plattan: {thGame: 'patiens', t: 'ready' | 'leave' | 'spelstund' | 'event', …}
//                     event: {kind: 'progress', done (0–100)} och {kind: 'over', won}
//   plattan → spelet: {thHemma: 1, t: 'init', mode: 'solo' | 'table', me: {name, av}, size, calm, sound, music, voice,
//                      table: {name, seats: [{name, av}], game}, next: {title, text, label}}
//                     {thHemma: 1, t: 'sound', on}
const Hemma = (() => {
  const H = {cfg: null};
  let framed = false;
  try { framed = window.parent !== window; } catch (e) { framed = true; }
  H.framed = framed;
  H.send = msg => {
    if (!framed) return;
    try { parent.postMessage(Object.assign({thGame: 'patiens'}, msg), '*'); } catch (e) { /* plattan lyssnar inte */ }
  };
  const fromHemma = e => framed && e.source === parent && e.data && typeof e.data === 'object' && e.data.thHemma;

  // Väntar på plattans inställningar (högst ett par sekunder; utan svar blir det en vanlig patiens)
  H.init = () => new Promise(resolve => {
    if (!framed) { resolve(null); return; }
    let done = false;
    const finish = cfg => {
      if (done) return;
      done = true;
      removeEventListener('message', onMsg);
      if (cfg) apply(cfg);
      resolve(H.cfg);
    };
    const onMsg = e => { if (fromHemma(e) && e.data.t === 'init') finish(e.data); };
    addEventListener('message', onMsg);
    H.send({t: 'ready'});
    setTimeout(() => finish(null), 2500);
  });
  addEventListener('message', e => {
    if (!fromHemma(e) || !H.cfg || e.data.t !== 'sound') return;
    H.cfg.sound = !!e.data.on;
    if (!e.data.on) Voice.stop();
    Sound.music();
  });

  function apply(cfg) {
    H.cfg = Object.assign({mode: 'solo', me: {name: 'Du', av: ''}, sound: true, music: true, voice: true, calm: true}, cfg);
    // första gången: plattans läge (lugnt och tydligt) i stället för frågan
    if (!Store.get('intro', false)) { Store.set('intro', true); if (H.cfg.calm) setCalm(true); }
    if (['normal', 'stor', 'xstor'].includes(H.cfg.size) && Settings.size !== H.cfg.size) { Settings.size = H.cfg.size; saveSettings(); }
    Main.applyLook();
    // plattans ljud gäller: av i demon betyder tyst, och vid bordet spelas ingen musik (då hörs rösterna)
    const play = Sound.play, music = Sound.music;
    const quiet = () => H.cfg.sound === false;
    Sound.play = (...a) => { if (!quiet()) return play(...a); };
    Sound.music = () => { if (quiet() || H.cfg.music === false) Sound.stopMusic(); else music(); };
    for (const k of ['say', 'play', 'win', 'line']) {
      const f = Voice[k];
      Voice[k] = (...a) => quiet() || H.cfg.voice === false ? false : f(...a);
    }
    document.documentElement.classList.add('in-hemma');
  }

  H.atTable = () => !!(H.cfg && H.cfg.mode === 'table');
  // Bordet på Spelstunden: alla spelar samma giv av Harpan (dra ett) och tävlar om att bli klar först
  H.startTable = cfg => {
    const g = (cfg.table && cfg.table.game) || 'klondike';
    const o = g === 'klondike' ? {draw: 1} : {};
    Game.start(g, o, {seed: Deals.pick(g, Engine.opts(g, o), 'win')});
  };
  // Hur långt jag har kommit (i procent), högst en gång i sekunden och bara när det ändras
  let lastPct = -1, lastAt = 0;
  H.progress = (S, cur) => {
    if (!H.atTable() || !cur) return;
    const pct = Math.round(Engine.GAMES[cur.g].done(S) * 100);
    if (pct === lastPct || (Date.now() - lastAt < 1000 && pct < 100)) return;
    lastPct = pct; lastAt = Date.now();
    H.send({t: 'event', kind: 'progress', done: pct});
  };
  Bus.on('won', () => { if (H.atTable()) H.send({t: 'event', kind: 'over', won: true, winners: [H.cfg.me.name]}); });

  // Rutan om nästa Spelstund på startskärmen (bara i plattan)
  H.nextBox = () => {
    const n = H.cfg && H.cfg.next;
    if (!n) return null;
    return h('div', {class: 'th-next'},
      h('span', {class: 'th-next-ic', html: UI.icon('users')}),
      h('p', {}, h('b', {}, n.title || 'Spelstunden'), h('br'), n.text || ''),
      n.label ? UI.btn(n.label, () => H.send({t: 'spelstund'}), {cls: 'gold', icon: 'users'}) : null);
  };

  // Träffpunkt Hemmas märke: huset med lampan i fönstret
  H.mark = (size = 34) => `<svg viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true"><path d="M6 22 24 7l18 15v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V22Z" fill="#2E5883"/><path d="M3 23.5 24 6l21 17.5" fill="none" stroke="#F2A516" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="29" r="11" fill="#FFD27A" opacity=".28"/><rect x="17.5" y="22.5" width="13" height="13" rx="1.5" fill="#FFD27A"/><path d="M24 22.5v13M17.5 29h13" stroke="#2E5883" stroke-width="1.6"/></svg>`;
  return H;
})();

/* ---- 15-main.js ---- */
/* ================= Start ================= */
const Main = (() => {
  const A = {};
  const setLoad = (p, text) => { const b = $('loadBar'); if (b) b.style.width = Math.round(p * 100) + '%'; if (text && $('loadText')) $('loadText').textContent = text; };
  // Spel över nätet fungerar inte inuti claude.ai (där stoppas anslutningarna)
  // (Träffpunkt Hemmas version: inget spel över nätet, med andra spelar man på Spelstunden i plattan)
  A.onlineOk = () => false;

  // Bordets färg, storleken och lugna animationer (klasser på body som stilarna utgår från)
  A.applyLook = () => {
    document.body.dataset.felt = Settings.felt || 'gron';
    document.body.dataset.size = Settings.size || 'normal';
    document.body.classList.toggle('calm', !!Settings.calmFx || reduceMotion);
    document.body.classList.toggle('calmui', !!Settings.calm);
  };
  // "Lugnt och tydligt" av eller på
  A.setCalm = on => {
    setCalm(on);
    A.applyLook();
    if (Game.active()) { Table.refresh(); HudBar.render(); }
  };
  A.installArt = () => {
    if (typeof Art !== 'undefined' && Art.install) Art.install({fourColor: !!Settings.fourColor, letters: Settings.letters, back: Settings.back});
    // korten som redan finns får de nya bilderna
    document.querySelectorAll('#cards .card').forEach(el => {
      const id = +el.dataset.id, G = Table.geo();
      el.querySelector('.cface').innerHTML = G && G.small ? Art.mini(id) : Art.face(id);
      el.querySelector('.cback').innerHTML = Art.back();
    });
    // (tomma platser med bokstäver, t.ex. E eller A på ess-högarna)
    if (Game.active()) Table.refresh();
    if (Menu.screen() === 'title') Menu.refreshTitle();
  };

  // Skärmen släcks inte medan man spelar
  let wake = null, wakeWant = false;
  A.keepAwake = on => {
    wakeWant = !!on;
    if (!on) { if (wake) { wake.release().catch(() => {}); wake = null; } return; }
    if (wake || !navigator.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(l => { wake = l; l.addEventListener('release', () => { if (wake === l) wake = null; }); if (!wakeWant) A.keepAwake(false); }).catch(() => {});
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wakeWant) A.keepAwake(true); });

  // Konfetti när man vinner
  A.confetti = () => {
    if (reduceMotion || Settings.calmFx) return;
    const box = h('div', {class: 'confetti'});
    const colors = ['#d6b25e', '#f1d99a', '#c0162c', '#fbf7ee', '#1d3461', '#7fb6e0'];
    for (let i = 0; i < 80; i++) {
      box.append(h('i', {style: {left: Math.random() * 100 + '%', background: colors[i % colors.length], '--dx': (Math.random() * 160 - 80) + 'px', '--r': (Math.random() * 720 - 360) + 'deg', animationDelay: (Math.random() * .9) + 's', animationDuration: (2.2 + Math.random() * 1.6) + 's', width: (6 + Math.random() * 6) + 'px', height: (8 + Math.random() * 8) + 'px'}}));
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 5200);
  };

  A.boot = async () => {
    setLoad(.2, 'Blandar korten …');
    A.applyLook();
    document.body.classList.toggle('touch', isTouch);
    await sleep(30);
    try { A.installArt(); } catch (e) { console.error(e); }
    setLoad(.6, 'Dukar bordet …');
    Table.init({tap: (id, pile, idx) => Play.tap(id, pile, idx), drop: (f, n, to) => Play.drop(f, n, to), stock: () => Play.stock(), pile: i => Play.pile(i), pick: d => Play.pick(d), bad: (f, n, to) => Play.bad(f, n, to)});
    const unlock = () => Sound.unlock();
    ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlock, {passive: true}));
    try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, sleep(1500)]); } catch (e) { /* strunt samma */ }
    // i plattan: vänta på inställningarna därifrån (själv eller vid ett bord, namnen, storleken, ljudet)
    const cfg = await Hemma.init();
    setLoad(1, 'Välkommen!');
    // en länk till en viss giv: #giv=klondike1-12345
    const m = /giv=([a-z]+)(\d?)-(\d+)/.exec(location.hash);
    // (startskärmen ritas redan när korten får sina bilder: har en giv hunnit börja under tiden står den kvar)
    if (cfg && cfg.mode === 'table') Hemma.startTable(cfg);
    else if (Menu.screen() === 'title' && !Game.active()) Menu.show('title');
    $('loading').classList.add('done');
    setTimeout(() => { const l = $('loading'); if (l) l.remove(); }, 700);
    Voice.preload();
    if (m && Engine.GAMES[m[1]]) {
      const g = m[1], o = g === 'klondike' ? {draw: +m[2] === 3 ? 3 : 1} : g === 'spider' ? {suits: +m[2] || 1} : {};
      history.replaceState(null, '', location.pathname + location.search);
      (async () => { if (await Menu.confirmReplace(`giv nummer ${fmt(+m[3])}`)) Game.start(g, o, {seed: +m[3]}); })();
    } else if (!cfg && !Store.get('intro', false) && !Game.saved()) setTimeout(() => { if (Menu.screen() === 'title' && !UI.topSheet()) Menu.intro(); }, 500);
  };
  return A;
})();

Main.boot();
