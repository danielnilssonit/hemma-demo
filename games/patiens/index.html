    return o;
  }
  const ermine = (x, y) => `<path d="M${x},${y - 3}c-1.6,2.4 -2.4,4.6 -1,7.5c.6,-1.4 1.4,-1.4 2,0c1.4,-2.9 .6,-5.1 -1,-7.5z" fill="${INK}"/>`;
  const fist = (x, y) => `<path d="M${x - 8.5},${y - 5}C${x - 8.5},${y - 10.5} ${x + 8.5},${y - 10.5} ${x + 8.5},${y - 5}V${y + 4}C${x + 8.5},${y + 9} ${x - 8.5},${y + 9} ${x - 8.5},${y + 4}Z" fill="${SKIN}" ${OL}/><path d="M${x - 8.5},${y - 1}H${x + 4}M${x - 8.5},${y + 3}H${x + 4}" fill="none" stroke="${INK}" stroke-width=".9"/>`;

  // Kung: krona med sammetsmössa, långt hår och skägg, hermelinkrage och ordenskedja
  function king(P) {
    const x = FX, y = FY, rx = 18, ry = 22, hair = P.hair[2];
    let o = `<path d="${BODY.k}" fill="${P.b}" ${OL}/>`;
    const robe = 'M106,106L97,182H153L144,106Z';
    o += `<path d="${robe}" fill="${P.a}"/><path d="${robe}" fill="url(#pk-broc)" ${OL}/>` + gband('M106,106L97,182') + gband('M144,106L153,182');
    o += `<path d="M104,98C90,102 79,107 72,116C66,122 62,129 61,137C70,137 78,133 86,127C95,120 104,116 114,114H136C146,116 155,120 164,127C172,133 180,137 189,137C188,129 184,122 178,116C171,107 160,102 146,98Z" fill="${ERM}" ${OL}/>`;
    for (const [ex, ey] of [[66, 130], [78, 122], [91, 115], [104, 110], [146, 110], [159, 115], [172, 122], [184, 130]]) o += ermine(ex, ey);
    o += `<path d="M80,128Q125,176 170,128" fill="none" stroke="${INK}" stroke-width="5.2"/><path d="M80,128Q125,176 170,128" fill="none" stroke="${GOLD}" stroke-width="3" stroke-dasharray="4.5 1.5"/>`;
    o += `<circle cx="125" cy="153" r="9.5" fill="${GOLD}" ${OL}/>` + pipU(SK[P.s], 125, 153, 11);
    o += `<path d="M${x - rx - 1},${y - 14}C${x - rx - 9},${y + 2} ${x - rx - 10},${y + 20} ${x - rx - 4},${y + 33}H${x + rx + 4}C${x + rx + 10},${y + 20} ${x + rx + 9},${y + 2} ${x + rx + 1},${y - 14}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - rx - 4},${y - 2}C${x - rx - 7},${y + 10} ${x - rx - 6},${y + 20} ${x - rx - 2},${y + 30}M${x + rx + 4},${y - 2}C${x + rx + 7},${y + 10} ${x + rx + 6},${y + 20} ${x + rx + 2},${y + 30}" fill="none" stroke="${INK}" stroke-width="1" opacity=".45"/>`;
    o += face(x, y, rx, ry, 'k');
    // skägget: spetsigt (spader), kluvet (hjärter), rakt avskuret (ruter) eller runt (klöver)
    const beard = [
      `C${x - rx - 1},${y + 22} ${x - 12},${y + 42} ${x},${y + 50}C${x + 12},${y + 42} ${x + rx + 1},${y + 22} ${x + rx - .5},${y + 1}`,
      `C${x - rx - 1},${y + 20} ${x - 14},${y + 38} ${x - 8},${y + 50}C${x - 5},${y + 46} ${x - 2},${y + 42} ${x},${y + 40}C${x + 2},${y + 42} ${x + 5},${y + 46} ${x + 8},${y + 50}C${x + 14},${y + 38} ${x + rx + 1},${y + 20} ${x + rx - .5},${y + 1}`,
      `C${x - rx - 1},${y + 18} ${x - rx + 1},${y + 36} ${x - 13},${y + 45}H${x + 13}C${x + rx - 1},${y + 36} ${x + rx + 1},${y + 18} ${x + rx - .5},${y + 1}`,
      `C${x - rx - 2},${y + 24} ${x - 12},${y + 45} ${x},${y + 45}C${x + 12},${y + 45} ${x + rx + 2},${y + 24} ${x + rx - .5},${y + 1}`
    ][P.s];
    o += `<path d="M${x - rx + .5},${y + 1}${beard}C${x + rx - 4},${y + 12} ${x + 9},${y + 15} ${x},${y + 15}C${x - 9},${y + 15} ${x - rx + 4},${y + 12} ${x - rx + .5},${y + 1}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 10},${y + 19}C${x - 10},${y + 29} ${x - 6},${y + 37} ${x - 1.5},${y + 43}M${x + 10},${y + 19}C${x + 10},${y + 29} ${x + 6},${y + 37} ${x + 1.5},${y + 43}M${x - 4},${y + 21}C${x - 4},${y + 30} ${x - 2},${y + 36} ${x},${y + 40}M${x + 4},${y + 21}C${x + 4},${y + 30} ${x + 2},${y + 36} ${x},${y + 40}" fill="none" stroke="${INK}" stroke-width="1" opacity=".45"/>`;
    o += `<path d="M${x},${y + 10}C${x - 3},${y + 8} ${x - 10},${y + 8} ${x - 15},${y + 14}C${x - 9},${y + 13} ${x - 4},${y + 14} ${x},${y + 13}C${x + 4},${y + 14} ${x + 9},${y + 13} ${x + 15},${y + 14}C${x + 10},${y + 8} ${x + 3},${y + 8} ${x},${y + 10}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 4},${y + 16}Q${x},${y + 19} ${x + 4},${y + 16}Z" fill="${RED}"/>`;
    const yb = y - ry + 7;
    o += `<path d="M${x - 19},${yb - 12}C${x - 20},${yb - 30} ${x - 8},${yb - 34} ${x},${yb - 34}C${x + 8},${yb - 34} ${x + 20},${yb - 30} ${x + 19},${yb - 12}Z" fill="${P.a}" ${OL}/>`;
    o += `<path d="M${x - 22},${yb - 9}L${x - 21},${yb - 29}L${x - 9},${yb - 14}L${x},${yb - 34}L${x + 9},${yb - 14}L${x + 21},${yb - 29}L${x + 22},${yb - 9}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x - 22},${yb}L${x - 23},${yb - 10}H${x + 23}L${x + 22},${yb}Z" fill="${GOLD}" ${OL}/>`;
    for (const [px, py] of [[x - 21, yb - 30], [x, yb - 35], [x + 21, yb - 30]]) o += `<circle cx="${px}" cy="${py}" r="3.3" fill="${IVORY}" ${OL}/>`;
    o += `<path d="M${x},${yb - 9}l3.5,4.5l-3.5,4.5l-3.5,-4.5z" fill="${P.gem}"/><circle cx="${x - 13}" cy="${yb - 5}" r="2.2" fill="${P.gem}"/><circle cx="${x + 13}" cy="${yb - 5}" r="2.2" fill="${P.gem}"/>`;
    return o;
  }

  // Dam: tiara, vågat page-hår, puffärmar, snörliv och pärlhalsband
  function queen(P) {
    const x = FX, y = FY + 1, rx = 17, ry = 21.5, hair = P.hair[1];
    let o = `<path d="${BODY.q}" fill="${P.a}" ${OL}/>`;
    const slv = `<path d="M73,118C64,126 60,138 60,151V172C72,170 80,160 84,148C88,136 86,126 80,120Z" fill="${P.b}" ${OL}/><path d="M66,128C70,139 70,154 65,168M76,123C80,134 80,149 75,163" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`;
    o += slv + `<g transform="${MIRROR}">${slv}</g>`;
    o += `<path d="M111,127L105,182H145L139,127Z" fill="${GOLD}" ${OL}/><path d="M113,133L137,140L112,148L138,156L111,164L139,172L110,180" fill="none" stroke="${P.a}" stroke-width="2.2"/>`;
    o += `<path d="M105,102L108.5,130H141.5L145,102" fill="none" stroke="${INK}" stroke-width="7.5"/><path d="M105,102L108.5,130H141.5L145,102" fill="none" stroke="${GOLD}" stroke-width="5"/>`;
    o += `<path d="M108,102L111,127H139L142,102Z" fill="${SKIN}"/>`;
    o += `<path d="M${x - rx - 9},${y + 20}C${x - rx - 13},${y} ${x - rx - 10},${y - ry - 8} ${x},${y - ry - 9}C${x + rx + 10},${y - ry - 8} ${x + rx + 13},${y} ${x + rx + 9},${y + 20}C${x + rx + 5},${y + 25} ${x + rx - 1},${y + 23} ${x + rx - 2},${y + 17}L${x - rx + 2},${y + 17}C${x - rx + 1},${y + 23} ${x - rx - 5},${y + 25} ${x - rx - 9},${y + 20}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - 7},${y + 16}V${y + 30}H${x + 7}V${y + 16}Z" fill="${SKIN}" ${OL}/>`;
    let pearls = '';
    for (let i = 0; i <= 7; i++) { const t = i / 7; pearls += `<circle cx="${n(113 + 24 * t)}" cy="${n(y + 29 + 6 * Math.sin(Math.PI * t))}" r="2.3" fill="${IVORY}" stroke="${INK}" stroke-width="1"/>`; }
    o += pearls + `<path d="M${x},${y + 36}l3,4l-3,5l-3,-5z" fill="${P.gem}" ${OL}/>`;
    o += face(x, y, rx, ry, 'q');
    o += `<path d="M${x - rx - 1},${y - 5}C${x - rx - 2},${y - ry - 1} ${x - 6},${y - ry - 3} ${x + 3},${y - ry - 2}C${x + 12},${y - ry - 1} ${x + rx + 2},${y - ry + 5} ${x + rx + 1},${y - 5}C${x + rx - 4},${y - 12} ${x + 8},${y - 14} ${x + 4},${y - 17}C${x - 1},${y - 11} ${x - 9},${y - 14} ${x - rx - 1},${y - 5}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - rx - 5},${y - 4}C${x - rx - 1},${y + 1} ${x - rx - 6},${y + 7} ${x - rx - 2},${y + 13}M${x + rx + 5},${y - 4}C${x + rx + 1},${y + 1} ${x + rx + 6},${y + 7} ${x + rx + 2},${y + 13}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".55"/>`;
    for (const ex of [x - rx - 1.5, x + rx + 1.5]) o += `<circle cx="${ex}" cy="${y + 5}" r="2" fill="${GOLD}" ${OL}/><path d="M${ex},${y + 8}l2.6,4.5l-2.6,4.5l-2.6,-4.5z" fill="${P.gem}" ${OL}/>`;
    const yb = y - ry + 1;
    o += `<path d="M${x - 14},${yb - 7}L${x - 11},${yb - 18}L${x - 5},${yb - 12}L${x},${yb - 27}L${x + 5},${yb - 12}L${x + 11},${yb - 18}L${x + 14},${yb - 7}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x - 18},${yb}C${x - 10},${yb - 6} ${x + 10},${yb - 6} ${x + 18},${yb}L${x + 17},${yb - 6}C${x + 9},${yb - 12} ${x - 9},${yb - 12} ${x - 17},${yb - 6}Z" fill="${GOLD}" ${OL}/>`;
    o += `<circle cx="${x}" cy="${yb - 14}" r="3.4" fill="${P.gem}" ${OL}/>`;
    for (const [px, py] of [[x - 11, yb - 19.5], [x + 11, yb - 19.5], [x, yb - 28.5]]) o += `<circle cx="${px}" cy="${py}" r="2.2" fill="${IVORY}" ${OL}/>`;
    return o;
  }

  // Knekt: basker med plym, pagefrisyr, pipkrage, randig jacka och cape över ena axeln
  function jack(P) {
    const x = FX, y = FY + 2, rx = 17.5, ry = 21.5, hair = P.hair[0];
    let o = `<path d="${BODY.j}" fill="${P.a}" ${OL}/>`;
    o += `<g clip-path="url(#pk-clip-j)">${gband('M90,96V182', 5) + gband('M106,96V182', 5) + gband('M144,96V182', 5) + gband('M160,96V182', 5)}</g>`;
    o += `<path d="M71,118C62,126 58,138 58,151V182H80C80,162 86,142 98,126C102,118 104,110 107,104C95,106 82,111 71,118Z" fill="${P.b}" ${OL}/>`;
    o += gband('M80,182C80,162 86,142 98,126C102,118 104,110 107,104', 4);
    o += `<path d="M${x - rx - 6},${y + 14}C${x - rx - 9},${y - 4} ${x - rx - 7},${y - ry - 5} ${x},${y - ry - 6}C${x + rx + 7},${y - ry - 5} ${x + rx + 9},${y - 4} ${x + rx + 6},${y + 14}C${x + rx + 3},${y + 18} ${x + rx - 1},${y + 17} ${x + rx - 1},${y + 12}L${x - rx + 1},${y + 12}C${x - rx + 1},${y + 17} ${x - rx - 3},${y + 18} ${x - rx - 6},${y + 14}Z" fill="${hair}" ${OL}/>`;
    o += `<path d="M${x - rx - 3},${y + 2}C${x - rx - 5},${y + 7} ${x - rx - 4},${y + 11} ${x - rx - 1},${y + 14}M${x + rx + 3},${y + 2}C${x + rx + 5},${y + 7} ${x + rx + 4},${y + 11} ${x + rx + 1},${y + 14}" fill="none" stroke="${INK}" stroke-width="1" opacity=".5"/>`;
    o += `<path d="M${x - 7},${y + 16}V${y + 30}H${x + 7}V${y + 16}Z" fill="${SKIN}" ${OL}/>`;
    // pipkrage: platt veckad krage runt halsen, huvudet vilar på den
    let z = '', pl = '';
    for (let i = 0; i <= 56; i++) { const t = i / 56 * 2 * Math.PI, w = 1 + .07 * Math.cos(14 * t); z += (i ? 'L' : 'M') + P2(x + 31 * w * Math.cos(t), y + 32 + 9.5 * w * Math.sin(t)); }
    for (let i = 0; i < 14; i++) { const t = (i + .5) / 14 * 2 * Math.PI; pl += `M${P2(x + 15 * Math.cos(t), y + 32 + 4.2 * Math.sin(t))}L${P2(x + 29 * Math.cos(t), y + 32 + 8.8 * Math.sin(t))}`; }
    o += `<path d="${z}Z" fill="${ERM}" ${OL}/><path d="${pl}" stroke="${INK}" stroke-width=".9" opacity=".55"/>`;
    o += face(x, y, rx, ry, 'j');
    o += `<path d="M${x - rx},${y - 6}C${x - rx},${y - ry - 2} ${x + rx},${y - ry - 2} ${x + rx},${y - 6}L${x + rx - 3},${y - 9}Q${x + 8},${y - 6} ${x + 4},${y - 10}Q${x},${y - 6} ${x - 5},${y - 10}Q${x - 9},${y - 6} ${x - rx + 2},${y - 9}Z" fill="${hair}" ${OL}/>`;
    const yb = y - ry + 4;
    // plym: böjd fjäder med mittnerv och några fjäderstrålar
    let barbs = '';
    for (let i = 0; i < 4; i++) { const t = .3 + i * .17, bx = x + 9 + 25 * t, by = yb - 14 - 22 * t * t; barbs += `M${n(bx)},${n(by)}l${n(-4 + t * 2)},${n(-5 + t)}`; }
    o += `<path d="M${x + 6},${yb - 12}C${x + 20},${yb - 13} ${x + 32},${yb - 22} ${x + 36},${yb - 38}C${x + 28},${yb - 32} ${x + 20},${yb - 29} ${x + 13},${yb - 26}C${x + 8},${yb - 23} ${x + 4},${yb - 18} ${x + 6},${yb - 12}Z" fill="${GOLD}" ${OL}/>`;
    o += `<path d="M${x + 8},${yb - 14}C${x + 20},${yb - 18} ${x + 30},${yb - 26} ${x + 35},${yb - 36}${barbs}" fill="none" stroke="${INK}" stroke-width="1"/>`;
    o += `<path d="M${x - 23},${yb}C${x - 29},${yb - 12} ${x - 15},${yb - 26} ${x + 6},${yb - 26}C${x + 27},${yb - 26} ${x + 35},${yb - 13} ${x + 25},${yb - 2}Z" fill="${P.b}" ${OL}/>`;
    o += `<path d="M${x - 23},${yb + 1}L${x - 22},${yb - 6}H${x + 24}L${x + 25},${yb + 1}Z" fill="${GOLD}" ${OL}/><circle cx="${x + 15}" cy="${yb - 3}" r="2.6" fill="${P.gem}"/>`;
    return o;
  }

  // Det figuren håller i: handen sitter vid (HX, HY), underarmen kommer nerifrån höger
  function item(k, P) {
    const x = HX, y = HY;
    const shaft = (top, c) => `<path d="M${x - 2.6},${y + 12}V${top}H${x + 2.6}V${y + 12}Z" fill="${c}" ${OL}/>`;
    switch (k) {
      case 'sword': return `<path d="M${x - 4},${y - 13}V36L${x},23L${x + 4},36V${y - 13}Z" fill="${STEEL}" ${OL}/><path d="M${x},36V${y - 16}" stroke="${STEEL_D}" stroke-width="1.2"/>`
        + `<path d="M${x - 17},${y - 17}H${x + 17}L${x + 20},${y - 13}L${x + 17},${y - 9}H${x - 17}L${x - 20},${y - 13}Z" fill="${GOLD}" ${OL}/><circle cx="${x}" cy="${y - 13}" r="2.4" fill="${P.gem}"/>` + fist(x, y);
      case 'sceptre': return shaft(56, GOLD) + `<path d="M${x - 5.5},72H${x + 5.5}V77H${x - 5.5}ZM${x - 5.5},104H${x + 5.5}V109H${x - 5.5}Z" fill="${GOLD}" ${OL}/>`
        + `<circle cx="${x}" cy="47" r="10" fill="${GOLD}" ${OL}/><circle cx="${x}" cy="47" r="3.6" fill="${P.gem}"/>` + pipU(SK[P.s], x, 30, 17) + fist(x, y);
      case 'axe': return shaft(34, WOOD) + `<path d="M${x + 3},38C${x + 20},30 ${x + 34},40 ${x + 36},55C${x + 34},70 ${x + 20},80 ${x + 3},72Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x + 26},43C${x + 32},48 ${x + 33},62 ${x + 27},67" fill="none" stroke="${STEEL_D}" stroke-width="1.4"/><path d="M${x - 3},46L${x - 17},53L${x - 3},60Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x - 5.5},40H${x + 5.5}V72H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x - 2.6},34L${x},26L${x + 2.6},34Z" fill="${STEEL}" ${OL}/>` + fist(x, y);
      case 'orb': return `<circle cx="${x}" cy="${y - 23}" r="14" fill="${GOLD}" ${OL}/><path d="M${x - 14},${y - 23}H${x + 14}M${x},${y - 37}V${y - 9}" stroke="${INK}" stroke-width="1.3"/><circle cx="${x}" cy="${y - 23}" r="3.2" fill="${P.gem}"/>`
        + `<path d="M${x},${y - 38}V${y - 52}M${x - 5.5},${y - 46.5}H${x + 5.5}" stroke="${INK}" stroke-width="5.4" stroke-linecap="round"/><path d="M${x},${y - 38}V${y - 52}M${x - 5.5},${y - 46.5}H${x + 5.5}" stroke="${GOLD}" stroke-width="3" stroke-linecap="round"/>` + fist(x, y);
      case 'fan': {
        const cx = x - 4, cy = y - 2, R = 46, a0 = -170, a1 = -62, k2 = 9;
        let d = '', o = '';
        for (let i = 0; i < k2; i++) {
          const a = (a0 + (a1 - a0) * i / k2) * Math.PI / 180, b = (a0 + (a1 - a0) * (i + 1) / k2) * Math.PI / 180;
          const w = `M${cx},${cy}L${P2(cx + R * Math.cos(a), cy + R * Math.sin(a))}A${R},${R} 0 0 1 ${P2(cx + R * Math.cos(b), cy + R * Math.sin(b))}Z`;
          if (i % 2) d += w; else o += `<path d="${w}" fill="${P.a}" ${OL}/>`;
        }
        return `<path d="${d}" fill="${GOLD}" ${OL}/>` + o + fist(x, y);
      }
      case 'rose': return `<path d="M${x - 1},${y - 8}C${x + 2},${y - 30} ${x + 8},${y - 54} ${x + 8},${y - 72}" fill="none" stroke="${LEAF}" stroke-width="3.2"/>`
        + `<path d="M${x + 5},${y - 40}C${x + 16},${y - 50} ${x + 26},${y - 48} ${x + 30},${y - 44}C${x + 22},${y - 36} ${x + 12},${y - 36} ${x + 5},${y - 40}Z" fill="${LEAF}" ${OL}/><path d="M${x + 2},${y - 26}C${x - 8},${y - 34} ${x - 18},${y - 32} ${x - 22},${y - 28}C${x - 14},${y - 21} ${x - 5},${y - 21} ${x + 2},${y - 26}Z" fill="${LEAF}" ${OL}/>`
        + `<circle cx="${x + 8}" cy="${y - 82}" r="13" fill="${RED}" ${OL}/><path d="M${x + 8},${y - 82}m-5,1a5,5 0 1,1 5,5a8,8 0 0,1 -8,-8a11,11 0 0,1 11,-9" fill="none" stroke="#7d0a18" stroke-width="1.6"/>` + fist(x, y);
      case 'tulip': return `<path d="M${x - 1},${y - 8}C${x + 1},${y - 30} ${x + 5},${y - 52} ${x + 6},${y - 66}" fill="none" stroke="${LEAF}" stroke-width="3.2"/>`
        + `<path d="M${x + 2},${y - 14}C${x + 14},${y - 26} ${x + 20},${y - 40} ${x + 26},${y - 52}C${x + 28},${y - 36} ${x + 22},${y - 22} ${x + 2},${y - 14}Z" fill="${LEAF}" ${OL}/>`
        + `<path d="M${x - 5},${y - 70}C${x - 7},${y - 82} ${x - 2},${y - 92} ${x + 4},${y - 98}C${x + 6},${y - 92} ${x + 8},${y - 92} ${x + 10},${y - 98}C${x + 15},${y - 92} ${x + 19},${y - 82} ${x + 17},${y - 70}C${x + 13},${y - 62} ${x - 1},${y - 62} ${x - 5},${y - 70}Z" fill="${RED}" ${OL}/>`
        + `<path d="M${x + 6},${y - 90}C${x + 2},${y - 82} ${x + 2},${y - 72} ${x + 6},${y - 64}" fill="none" stroke="#7d0a18" stroke-width="1.4"/>` + fist(x, y);
      case 'laurel': {
        let o = `<path d="M${x},${y - 8}C${x + 2},${y - 50} ${x + 8},${y - 86} ${x + 14},${y - 114}" fill="none" stroke="${GOLD_D}" stroke-width="2.5"/>`;
        for (let i = 0; i < 7; i++) {
          const t = .1 + i * .13, px = x + 14 * t * t + 2 * t, py = y - 8 - 106 * t, side = i % 2 ? 1 : -1;
          o += `<path d="M0,0C4,-7 12,-9 17,-7C13,-2 6,1 0,0Z" transform="translate(${n(px)} ${n(py)}) rotate(${side > 0 ? -35 : -145}) scale(1 ${side})" fill="${GOLD}" ${OL}/>`;
        }
        return o + `<path d="M${x + 14},${y - 112}C${x + 10},${y - 118} ${x + 12},${y - 124} ${x + 16},${y - 128}C${x + 20},${y - 122} ${x + 19},${y - 116} ${x + 14},${y - 112}Z" fill="${GOLD}" ${OL}/>` + fist(x, y);
      }
      case 'halberd': return shaft(32, WOOD) + `<path d="M${x},17L${x + 5.5},32H${x - 5.5}Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x + 3},38C${x + 16},33 ${x + 28},39 ${x + 32},52C${x + 28},64 ${x + 16},70 ${x + 3},65Z" fill="${STEEL}" ${OL}/><path d="M${x - 3},44L${x - 16},37L${x - 11},48L${x - 3},52Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x - 5.5},32H${x + 5.5}V38H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x},68L${x - 5},82H${x + 5}Z" fill="${P.gem}" ${OL}/>` + fist(x, y);
      case 'spear': return shaft(46, WOOD) + `<path d="M${x},17C${x + 7},28 ${x + 8},37 ${x},49C${x - 8},37 ${x - 7},28 ${x},17Z" fill="${STEEL}" ${OL}/>`
        + `<path d="M${x},23V46" stroke="${STEEL_D}" stroke-width="1.2"/><path d="M${x - 5.5},48H${x + 5.5}V54H${x - 5.5}Z" fill="${GOLD}" ${OL}/><path d="M${x - 2},54L${x - 8},72H${x + 4}Z" fill="${P.gem}" ${OL}/>` + fist(x, y);
    }
    return '';
  }

  function courtHalf(s, r, P) {
    const k = r - 11;
    let o = rays(FX, FY, 24, 260, .15);
    o += [jack, queen, king][k](P);
    // underarm och manschett, sedan föremålet och handen
    o += `<path d="M${HX - 9},${HY + 7}C${HX - 8},${HY + 18} ${HX - 4},${HY + 27} ${HX + 1},${HY + 37}H${HX + 25}C${HX + 21},${HY + 24} ${HX + 16},${HY + 14} ${HX + 9},${HY + 7}Z" fill="${k === 0 ? P.a : P.b}" ${OL}/>`;
    o += `<path d="M${HX - 10},${HY + 5}H${HX + 10}V${HY + 12}H${HX - 10}Z" fill="${GOLD}" ${OL}/>`;
    o += item(P.items[k], P);
    o += pipU(SK[s], 82, 36, 28);
    return `<g id="pk-ch-${SK[s]}${r}" clip-path="url(#pk-clip-half)">${o}</g>`;
  }

  function courtFace(s, r) {
    return `<path d="${frame(0)}" fill="#f6eedd"/><use href="#pk-ch-${SK[s]}${r}"/>${turn(`<use href="#pk-ch-${SK[s]}${r}"/>`)}`
      + `<path d="M14,175H236" stroke="${GOLD}" stroke-width="3"/><path d="M14,172.6H236M14,177.4H236" stroke="${INK}" stroke-width=".9"/>`
      + `<path d="${frame(0)}" fill="none" stroke="${GOLD}" stroke-width="3.2"/><path d="${frame(-2.2)}" fill="none" stroke="${INK}" stroke-width="1"/><path d="M68.5,18.5H231.5V221.5M181.5,331.5H18.5V128.5" fill="none" stroke="${INK}" stroke-width=".8"/>`;
  }

  /* ---------- Tydliga framsidor för mycket små kort ---------- */
  // Valören stor överst till vänster, färgtecknet stort under. Klädda kort får en krona eller basker i hörnet.
  const MH = 104;
  const MINI_ICON = [
    `<path d="M200,86C200,70 214,60 226,62C238,64 240,78 232,86Z" fill="${GOLD}" ${OL}/><path d="M199,87H233" stroke="${INK}" stroke-width="4"/><path d="M212,64C216,50 226,42 238,42C230,48 224,56 222,64Z" fill="${IVORY}" ${OL}/>`,
    `<path d="M198,92L200,74L208,82L216,58L224,82L232,74L234,92Z" fill="${GOLD}" ${OL}/><circle cx="216" cy="84" r="3.4" fill="${RED}"/>`,
    `<path d="M200,98L198,72L207,83L216,60L225,83L234,72L232,98Z" fill="${GOLD}" ${OL}/><circle cx="198" cy="70" r="3.2" fill="${IVORY}" ${OL}/><circle cx="216" cy="58" r="3.2" fill="${IVORY}" ${OL}/><circle cx="234" cy="70" r="3.2" fill="${IVORY}" ${OL}/>`
  ];
  function miniFace(s, r) {
    // valören stor till vänster och färgtecknet stort till höger, båda i översta tredjedelen (syns i en kolumn)
    const wr = rankW(r, MH), hh = wr > 150 ? MH * 150 / wr : MH;
    let o = rankAt(r, 12, 12, hh) + pipU(SK[s], 250 - 12 - 44, 12 + MH / 2, 88);
    o += pipU(SK[s], 125, 250, 150);
    if (r > 10) o += `<g transform="translate(125 250) scale(1.25) translate(-216 -80)">${MINI_ICON[r - 11]}</g>`;
    return o;
  }

  /* ---------- Baksidor ---------- */
  // Träffpunkt Hemmas lek: vinröd (0) och kvällsblå (1) med lampsken, och huset med den tända lampan i mitten
  function backArt(deck) {
    const GOLD = '#e9a21e';
    const c = deck ? '#1d3a5f' : '#7a2433', cd = deck ? '#132a45' : '#5a1826';
    let o = `<rect x="11" y="11" width="228" height="328" rx="8" fill="${c}"/><rect x="11" y="11" width="228" height="328" rx="8" fill="url(#pk-weave)"/>`;
    o += `<rect x="11" y="11" width="228" height="328" rx="8" fill="url(#pk-vign)"/>`;
    o += `<rect x="17" y="17" width="216" height="316" rx="4" fill="none" stroke="${GOLD}" stroke-width="1.8"/><rect x="21.5" y="21.5" width="207" height="307" rx="2" fill="none" stroke="${GOLD}" stroke-width=".8" opacity=".8"/>`;
    // solfjädrar i hörnen
    let fan = `<path d="M24,0A24,24 0 0 1 0,24M15,0A15,15 0 0 1 0,15`;
    for (let i = 1; i < 6; i++) { const a = i * Math.PI / 12; fan += `M${P2(15 * Math.cos(a), 15 * Math.sin(a))}L${P2(24 * Math.cos(a), 24 * Math.sin(a))}`; }
    fan += `" fill="none" stroke="${GOLD}" stroke-width="1.2"/><circle r="4" fill="${GOLD}"/>`;
    for (const t of ['21.5 21.5', '228.5 21.5) scale(-1 1', '21.5 328.5) scale(1 -1', '228.5 328.5) scale(-1 -1']) o += `<g transform="translate(${t})">${fan}</g>`;
    // medaljong: åttahörning med Träffpunkt Hemmas hus
    const oct = (w, h, k) => `M${125 - w + k},${175 - h}H${125 + w - k}L${125 + w},${175 - h + k}V${175 + h - k}L${125 + w - k},${175 + h}H${125 - w + k}L${125 - w},${175 + h - k}V${175 - h + k}Z`;
    let ray = '';
    for (let i = 0; i < 24; i++) { const a = i / 24 * 2 * Math.PI; ray += `M${P2(125 + 58 * Math.cos(a), 175 + 70 * Math.sin(a))}L${P2(125 + 76 * Math.cos(a), 175 + 92 * Math.sin(a))}`; }
    o += `<path d="${ray}" stroke="${GOLD}" stroke-width="1.6" opacity=".8"/>`;
    o += `<path d="${oct(40, 52, 16)}" fill="${cd}" stroke="${GOLD}" stroke-width="2.4"/><path d="${oct(34.5, 46.5, 13.5)}" fill="none" stroke="${GOLD}" stroke-width=".9"/>`;
    o += `<g transform="translate(125 177) scale(1.32) translate(-24 -25)"><path d="M6 22 24 7l18 15v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V22Z" fill="#2e5883"/>`
      + `<path d="M3 23.5 24 6l21 17.5" fill="none" stroke="#f2a516" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="29" r="11" fill="#ffd27a" opacity=".3"/>`
      + `<rect x="17.5" y="22.5" width="13" height="13" rx="1.5" fill="#ffd27a"/><path d="M24 22.5v13M17.5 29h13" stroke="#2e5883" stroke-width="1.6"/></g>`;
    return o;
  }

  /* ---------- Hela spriten ---------- */
  const faceId = (s, r) => `pk-f-${SK[s]}${r}`, miniId = (s, r) => `pk-m-${SK[s]}${r}`;
  // Kroppen (bilden under bandet): sifferkortens tecken och essen skalas in under bandet, de klädda korten likaså
  const PIP_S = .88, PIP_T = `translate(${n(125 * (1 - PIP_S))} ${n(101 - 46 * PIP_S)}) scale(${PIP_S})`;
  const COURT_S = .72, COURT_T = `translate(${n(125 * (1 - COURT_S))} ${n(101 - 14 * COURT_S)}) scale(${COURT_S})`;
  function build() {
    const four = opts.fourColor, PAL = courtPal(four);
    let defs = `<linearGradient id="pk-stock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f5eedf"/></linearGradient>`
      + `<linearGradient id="pk-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a0"/><stop offset=".55" stop-color="${GOLD}"/><stop offset="1" stop-color="#a98331"/></linearGradient>`
      + `<radialGradient id="pk-vign" cx=".5" cy=".5" r=".7"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>`
      + `<pattern id="pk-weave" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45 125 175)"><g fill="#fff" fill-opacity=".07" stroke="${GOLD}" stroke-opacity=".55" stroke-width=".8">`
      + `<rect x=".8" y=".8" width="10.4" height="4.6" rx="2"/><rect x=".8" y="6.6" width="10.4" height="4.6" rx="2"/><rect x="12.8" y=".8" width="4.6" height="10.4" rx="2"/><rect x="18.6" y=".8" width="4.6" height="10.4" rx="2"/>`
      + `<rect x=".8" y="12.8" width="4.6" height="10.4" rx="2"/><rect x="6.6" y="12.8" width="4.6" height="10.4" rx="2"/><rect x="12.8" y="12.8" width="10.4" height="4.6" rx="2"/><rect x="12.8" y="18.6" width="10.4" height="4.6" rx="2"/></g></pattern>`
      + `<pattern id="pk-broc" patternUnits="userSpaceOnUse" width="12" height="12"><path d="M6,2.6L8.2,6L6,9.4L3.8,6Z" fill="${GOLD}"/><path d="M0,0m-1.3,0a1.3,1.3 0 1,0 2.6,0a1.3,1.3 0 1,0 -2.6,0M12,0m-1.3,0a1.3,1.3 0 1,0 2.6,0a1.3,1.3 0 1,0 -2.6,0M0,12m-1.3,0a1.3,1.3 0 1,0 2.6,0a1.3,1.3 0 1,0 -2.6,0M12,12m-1.3,0a1.3,1.3 0 1,0 2.6,0a1.3,1.3 0 1,0 -2.6,0" fill="${GOLD}"/></pattern>`
      + `<clipPath id="pk-clip-half"><path d="M64,14H236V175H14V124H64Z"/></clipPath>`
      + `<clipPath id="pk-clip-j"><path d="${BODY.j}"/></clipPath>`
      + `<rect id="pk-base" x="1" y="1" width="248" height="348" rx="14" fill="url(#pk-stock)" stroke="#cfc3aa" stroke-width="2"/>`;
    defs += SK.map((k, i) => `<symbol id="pk-pip-${k}" viewBox="0 0 100 100"><path d="${PIPS[i]}" fill="currentColor"/></symbol>`).join('');
    defs += Object.keys(GL).map(k => `<symbol id="pk-g-${k}" viewBox="0 0 ${GL[k][0]} 100" style="overflow:hidden">${GL[k][1]}</symbol>`).join('');
    for (let s = 0; s < 4; s++) for (let r = 11; r <= 13; r++) defs += courtHalf(s, r, Object.assign({s}, PAL[s]));
    let syms = '';
    for (let s = 0; s < 4; s++) {
      for (let r = 1; r <= 13; r++) {
        const body = r === 1 ? `<g transform="${PIP_T}">${ace(s)}</g>` : r <= 10 ? `<g transform="${PIP_T}">${pips(s, r)}</g>` : `<g transform="${COURT_T}">${courtFace(s, r)}</g>`;
        syms += `<symbol id="${faceId(s, r)}" viewBox="0 0 250 350"><use href="#pk-base"/><g color="${col[s]}">${body}${band(s, r)}</g></symbol>`;
        syms += `<symbol id="${miniId(s, r)}" viewBox="0 0 250 350"><use href="#pk-base"/><g color="${col[s]}">${miniFace(s, r)}</g></symbol>`;
      }
    }
    for (const deck of [0, 1]) syms += `<symbol id="pk-b-${deck}" viewBox="0 0 250 350"><use href="#pk-base"/>${backArt(deck)}</symbol>`;
    return `<svg id="cardSprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs>${defs}</defs>${syms}</svg>`;
  }

  /* ---------- Det som resten av spelet använder ---------- */
  const cache = {};
  const keyOf = o => (o.fourColor ? 'f' : '') + (o.letters === 'int' ? 'i' : 's');
  // Spritens SVG-kod som text (utan att röra sidan), t.ex. för tester och ikoner
  A.markup = ({fourColor = opts.fourColor, letters = opts.letters} = {}) => {
    const saved = opts, o = {fourColor: !!fourColor, letters: letters === 'int' ? 'int' : 'sv', back: saved.back}, key = keyOf(o);
    if (!cache[key]) { opts = o; setColors(o.fourColor); cache[key] = build(); opts = saved; setColors(saved.fourColor); }
    return cache[key];

    const o = {fourColor: !!fourColor, letters: letters === 'int' ? 'int' : 'sv', back: back === 'bla' ? 'bla' : 'rod'}, key = keyOf(o), m = A.markup(o);
    opts = o; setColors(o.fourColor);
    if (typeof document === 'undefined' || !document.body) return null;
    const old = document.getElementById('cardSprite');
    if (old && old.getAttribute('data-key') === key) return old;

    tmp.innerHTML = m;
    const svg = tmp.firstElementChild;
    svg.setAttribute('data-key', key);

  };
  const suitOf = id => ((id % 52) / 13) | 0, rankOf = id => id % 13 + 1;
  A.faceRef = id => faceId(suitOf(id), rankOf(id));
  A.miniRef = id => miniId(suitOf(id), rankOf(id));
  A.backRef = (b = opts.back) => 'pk-b-' + (b === 'bla' ? 1 : 0);
  const wrap = ref => `<svg class="cardsvg" viewBox="0 0 250 350" preserveAspectRatio="none"><use href="#${ref}"></use></svg>`;
  A.face = id => wrap(A.faceRef(id));
  A.mini = id => wrap(A.miniRef(id));
  A.back = b => wrap(A.backRef(b));
  // Litet fristående färgtecken för texter ("Kung ♥"). color ersätter färgen om den anges.
  A.pip = (suit, size = 16, color) => `<svg class="pipsvg" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false" style="vertical-align:-.125em"><path d="${PIPS[suit] || PIPS[0]}" fill="${color || A.colors[suit] || INK}"/></svg>`;
  A.backColor = () => opts.back;
  return A;
})();

/* ---- 05-audio.js ---- */
/* ================= Ljud: kortljud, klockspel och musik ================= */
// Alla effekter skapas i webbläsaren (WebAudio): kort som vänds och smäller mot filten, blandning, ett litet
// klockspel när kort läggs upp (tonen stiger med valören) och en fanfar när patiensen går ut.
// Musiken är mp3-filer i game/music/ om de finns (samma låt i menyn och vid bordet).
const Sound = (() => {
  const A = {};
  let ctx = null, master, sfxBus, musicBus, voiceBus, noiseBuf, verbIn;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* stöds inte */ }

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 3; comp.attack.value = .003; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); musicBus = ctx.createGain(); voiceBus = ctx.createGain();
    sfxBus.connect(master); musicBus.connect(master); voiceBus.connect(master);
    // lite rumsklang (ett vardagsrum)
    const len = ctx.sampleRate * 1.1, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .14;
    verbIn = ctx.createGain(); verbIn.connect(conv); conv.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    A.setVolumes();
    return ctx;
  }
  A.ctx = () => ensure();
  A.voiceBus = () => { ensure(); return voiceBus; };
  A.setVolumes = () => {
    if (!ctx) return;
    sfxBus.gain.value = Settings.sfx;
    musicBus.gain.value = Settings.music * .7;
    voiceBus.gain.value = 1;
    if (Settings.music <= 0) Tracks.stop(); else Tracks.kick();
  };
  // iPhone och iPad släpper bara fram ljud som startas av ett tryck. Anropas vid varje tryck.
  A.unlock = () => { try { ensure(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); Tracks.prime(); Tracks.kick(); } catch (e) { /* ljud är valfritt */ } };

  /* ---------- Byggstenar ---------- */
  // Brus genom ett filter med en kort kurva: kortens prassel och smällar
  function noise(t, {dur = .08, f = 3000, q = 1, type = 'bandpass', gain = .5, f2 = null, attack = .002, pan = 0, verb = .3} = {}) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = .8 + Math.random() * .4;
    const flt = ctx.createBiquadFilter(); flt.type = type; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    src.connect(flt); flt.connect(g);
    node.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; node.connect(s); s.connect(verbIn); }
    src.start(t, Math.random() * .5, dur + .05);
  }
  function tone(t, {f = 880, dur = .4, type = 'sine', gain = .2, attack = .005, f2 = null, verb = .5, detune = 0} = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; g.connect(s); s.connect(verbIn); }
    o.start(t); o.stop(t + dur + .05);
  }
  // Klocka: grundton och övertoner som klingar av
  function bell(t, f, gain = .16, dur = 1.2) {
    tone(t, {f, dur, gain, attack: .003});
    tone(t, {f: f * 2.76, dur: dur * .5, gain: gain * .35, attack: .002});
    tone(t, {f: f * 5.4, dur: dur * .25, gain: gain * .12, attack: .002});
  }
  const snap = (t, g = .5, pan = 0) => { noise(t, {dur: .05, f: 2400 + Math.random() * 900, q: .8, gain: g, pan}); noise(t, {dur: .07, f: 220, type: 'lowpass', gain: g * .5, verb: .1}); };
  const slide = (t, g = .25, dur = .12) => noise(t, {dur, f: 5200, f2: 1800, q: .6, gain: g, attack: .02});
  // en pentatonisk skala för korten som läggs upp: ess låg, kung hög
  const PENTA = [0, 2, 4, 7, 9];
  const upFreq = r => 440 * Math.pow(2, (PENTA[(r - 1) % 5] + 12 * Math.floor((r - 1) / 5)) / 12);

  const SFX = {
    click: t => tone(t, {f: 1400, dur: .05, type: 'triangle', gain: .06, verb: 0}),
    tick: t => noise(t, {dur: .03, f: 4200, q: 2, gain: .18, verb: 0}),
    pick: t => noise(t, {dur: .06, f: 3600, f2: 5200, q: .7, gain: .12, attack: .01, verb: 0}),
    flip: t => { noise(t, {dur: .05, f: 5200, q: .7, gain: .22}); snap(t + .04, .28); },
    place: t => snap(t, .42),
    draw: t => { slide(t, .2); snap(t + .09, .3); },
    draw3: t => { slide(t, .2); for (let i = 0; i < 3; i++) snap(t + .08 + i * .045, .26 - i * .04, (i - 1) * .2); },
    recycle: t => { noise(t, {dur: .36, f: 1600, f2: 5200, q: .5, gain: .22, attack: .05}); snap(t + .34, .34); },
    up: (t, r = 1) => { snap(t, .36); bell(t + .02, upFreq(r) * 2, .05, .8); },
    deal: t => { for (let i = 0; i < 10; i++) snap(t + i * .05, .16 + Math.random() * .08, (Math.random() - .5) * .6); },
    shuffle: t => { for (let i = 0; i < 26; i++) snap(t + i * .026 + Math.random() * .01, .12 + Math.random() * .1, i < 13 ? -.3 : .3); for (let i = 0; i < 6; i++) snap(t + .8 + i * .05, .2); },
    pair: t => { snap(t, .34, -.2); snap(t + .07, .34, .2); bell(t + .1, 1318.5, .05, .7); },
    suit: t => { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => bell(t + i * .08, f, .09, 1.4)); },
    streak: (t, k = 1) => { bell(t, 523.25 * Math.pow(2, Math.min(k, 12) / 12), .06, .7); },
    nope: t => { tone(t, {f: 200, f2: 150, dur: .16, type: 'triangle', gain: .09, verb: 0}); },
    undo: t => noise(t, {dur: .14, f: 1600, f2: 5200, q: .6, gain: .16, attack: .03}),
    hint: t => { bell(t, 987.77, .07, .7); bell(t + .1, 1318.5, .06, .7); },
    finish: t => { for (let i = 0; i < 8; i++) snap(t + i * .07, .22 + (i % 2) * .06, (i % 3 - 1) * .3); },
    win: t => {
      const seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
      seq.forEach((f, i) => { tone(t + i * .13, {f, dur: .45, type: 'triangle', gain: .06}); tone(t + i * .13, {f: f / 2, dur: .5, type: 'sine', gain: .05}); });
      for (let i = 0; i < 12; i++) bell(t + 1 + i * .06, 1500 + Math.random() * 2000, .03, .6);
    },
    bounce: t => snap(t, .12 + Math.random() * .08, (Math.random() - .5) * .8),
    join: t => { bell(t, 659.25, .07, .6); bell(t + .1, 987.77, .07, .7); },
    leave: t => { bell(t, 987.77, .06, .6); bell(t + .1, 659.25, .06, .7); }
  };
  // Spelar en effekt (delay i ms, arg till effekten, t.ex. valören)
  A.play = (name, delay = 0, arg) => {
    if (!Settings.sfx) return;
    try {
      if (!ensure() || ctx.state !== 'running') return;
      const f = SFX[name];
      if (f) f(ctx.currentTime + .01 + delay / 1000, arg);
    } catch (e) { /* ljud är valfritt */ }
  };

  /* ---------- Musik: två spelare som tonar över i varandra ---------- */
  // Låtarna spelas genom Web Audio, så att volymen och övertoningarna fungerar även på iPhone och iPad (där ett
  // ljudelements volym inte går att ändra). Nära slutet börjar låten om i den andra spelaren och tonar över.
  const Tracks = (() => {
    const T = {};
    const files = typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : [];
    const variants = key => files.filter(f => f.replace(/\.(mp3|m4a)$/i, '').replace(/-\d+$/, '') === key);
    let cur = null, wantKey = null, deck = [], active = -1, fadeT = 0;
    T.has = key => variants(key).length > 0;
    T.playing = () => !!cur;
    const urls = {};
    async function urlFor(f) {
      if (urls[f]) return urls[f];
      const src = (typeof ASSET_BASE !== 'undefined' ? ASSET_BASE : '') + 'music/' + f;
      // i artefakten spelas filen direkt (där kan blob-adresser för ljud vara spärrade)
      if (typeof ARTIFACT !== 'undefined' && ARTIFACT) return (urls[f] = src);
      try { const r = await fetch(src); if (!r.ok) throw 0; urls[f] = URL.createObjectURL(await r.blob()); }
      catch (e) { urls[f] = src; }
      return urls[f];
    }
    function makeDeck() {
      const a = new Audio(); a.preload = 'auto'; a.crossOrigin = 'anonymous';
      const d = {a, gain: null, key: null};
      try { ensure(); const srcNode = ctx.createMediaElementSource(a); d.gain = ctx.createGain(); d.gain.gain.value = 0; srcNode.connect(d.gain); d.gain.connect(musicBus); }
      catch (e) { d.gain = null; }
      a.addEventListener('timeupdate', () => { if (deck[active] === d && a.duration && a.duration - a.currentTime < 4) next(d.key); });
      a.addEventListener('error', () => { if (deck[active] === d) cur = null; });
      return d;
    }
    const level = (d, v, sec) => {
      if (d.gain && ctx) { d.gain.gain.cancelScheduledValues(ctx.currentTime); d.gain.gain.setTargetAtTime(v, ctx.currentTime, Math.max(.05, sec / 3)); }
      else { const from = d.a.volume, t0 = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000)); d.a.volume = clamp(from + (v * Settings.music * .7 - from) * k, 0, 1); if (k < 1) requestAnimationFrame(st); }; st(); }
    };
    let busy = false;
    async function next(key) {
      if (busy) return;
      const list = variants(key);
      if (!list.length) return;
      busy = true;
      try {
        const f = list[Math.floor(Math.random() * list.length)], url = await urlFor(f);
        if (wantKey !== key) return;
        if (!deck.length) deck = [makeDeck(), makeDeck()];
        const inc = (active + 1) % 2, out = deck[active];
        const d = deck[inc];
        d.key = key; d.a.src = url; d.a.currentTime = 0;
        try { await d.a.play(); } catch (e) { return; }
        active = inc;
        level(d, 1, 2.5);
        if (out) { level(out, 0, 2.5); clearTimeout(fadeT); fadeT = setTimeout(() => { if (deck[active] !== out) out.a.pause(); }, 3000); }
        cur = key;
      } finally { busy = false; }
    }
    T.want = key => {
      if (key === wantKey && cur === key) return;
      wantKey = key;
      if (!key || !T.has(key) || Settings.music <= 0) { T.stop(); return; }
      next(key);
    };
    T.stop = () => { if (!cur) return; cur = null; const d = deck[active]; if (d) { level(d, 0, 1.4); setTimeout(() => { if (!cur) d.a.pause(); }, 1700); } };
    // Ett kort tyst ljud i båda spelarna vid första trycket (iPhone kräver att varje spelare startas av ett tryck en gång)
    let primed = false, priming = false, silent = null;
    function silentUrl() {
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, str) => [...str].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
      return URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    }
    T.prime = () => {
      if (primed || priming || !files.length) return;
      if (!deck.length) deck = [makeDeck(), makeDeck()];
      silent = silent || silentUrl();
      priming = true;
      const list = deck.filter((d, k) => !(k === active && cur));
      Promise.all(list.map(d => { d.a.src = silent; return d.a.play().then(() => { if (d.a.src === silent) d.a.pause(); }); }))
        .then(() => { primed = true; priming = false; T.kick(); }, () => { priming = false; });
    };
    // Starta om musiken om den borde spela men har stannat (till exempel när sidan har legat i bakgrunden)
    T.kick = () => {
      const d = deck[active];
      if (cur && d && d.a.paused && d.a.src !== silent) d.a.play().catch(() => {});
      else if (wantKey && !cur && Settings.music > 0) next(wantKey);
    };
    // pausa när sidan inte syns (appen i bakgrunden) och fortsätt när den kommer tillbaka
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => {
      const d = deck[active];
      if (!d) return;
      if (document.hidden) d.a.pause(); else if (cur) d.a.play().catch(() => {});
    });
    return T;
  })();
  // Samma låt överallt (menyn och bordet): 'spel', annars 'meny' om den finns
  A.music = () => { try { Tracks.want(Tracks.has('spel') ? 'spel' : 'meny'); } catch (e) { /* ljud är valfritt */ } };
  A.stopMusic = () => Tracks.stop();
  A.hasMusic = () => (typeof MUSIC_FILES !== 'undefined' ? MUSIC_FILES : []).length > 0;
  return A;
})();

/* ---- 05b-voice.js ---- */
/* ================= Rösten: tipsen och berömmet läses upp ================= */
// Inspelade repliker (game/voice/, gjorda med ElevenLabs, rösten Sanna) sätts ihop till meningar:
// "Flytta hjärter sju," + "till spader åtta." Varje kort finns inläst i flera former (efter "Flytta", efter "till",
// "Lägg upp … på ess-högen", "… ligger överst" och för pyramiden). Finns inte alla delar för en text sägs ingenting.
// Replikerna hämtas första gången rösten behövs (en fil, voice/voice-data.json). Av under Inställningar.
const Voice = (() => {
  const V = {};
  const MAN = typeof VOICE_MANIFEST !== 'undefined' ? VOICE_MANIFEST : null;
  const KEYS = new Set(MAN && MAN.keys ? MAN.keys : []);
  let data = null, loading = null, playing = [], token = 0;
  const bufs = new Map();
  V.available = () => KEYS.size > 0;

  async function load() {
    if (data) return data;
    if (loading) return loading;
    loading = (async () => {
      const src = (typeof ASSET_BASE !== 'undefined' ? ASSET_BASE : '') + 'voice/' + MAN.file;
      const r = await fetch(src);
      if (!r.ok) throw new Error('rösten saknas');
      data = (await r.json()).clips || {};
      return data;
    })().catch(e => { console.warn('Rösten kunde inte laddas', e); loading = null; return null; });
    return loading;
  }
  V.preload = () => { if (V.available() && Settings.voice) setTimeout(() => load(), 2500); };

  // en replik som ljud, med tystnaden i början och slutet bortklippt
  async function buffer(key) {
    if (bufs.has(key)) return bufs.get(key);
    const d = await load();
    const ctx = Sound.ctx();
    if (!d || !d[key] || !ctx) return null;
    const bin = atob(d[key]), ab = new ArrayBuffer(bin.length), u8 = new Uint8Array(ab);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const buf = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
    const ch = buf.getChannelData(0), thr = .012;
    let a = 0, b = ch.length - 1;
    while (a < b && Math.abs(ch[a]) < thr) a++;
    while (b > a && Math.abs(ch[b]) < thr) b--;
    const pad = buf.sampleRate * .03;
    const v = {buf, start: Math.max(0, a - pad) / buf.sampleRate, dur: Math.min(buf.length, b + pad * 2) / buf.sampleRate - Math.max(0, a - pad) / buf.sampleRate};
    bufs.set(key, v);
    return v;
  }

  const slug = s => s.toLowerCase().replace(/[åä]/g, 'a').replace(/ö/g, 'o').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const NAME = '((?:spader|hjärter|ruter|klöver) (?:ess|två|tre|fyra|fem|sex|sju|åtta|nio|tio|knekt|dam|kung))';
  const PATTERNS = [
    [new RegExp(`^Flytta ${NAME}( och korten på den)?( från slänghögen| tillbaka från ess-högen| från cellen)? till (den tomma kolumnen|den tomma högen|en fri cell|slänghögen|${NAME})\\.$`, 'i'), m => {
      const out = ['fl_' + slug(m[1])];
      if (m[2]) out.push('och_korten_pa_den');
      if (m[3]) out.push({' från slänghögen': 'fran_slanghogen', ' tillbaka från ess-högen': 'tillbaka_fran_esshogen', ' från cellen': 'fran_cellen'}[m[3]]);
      out.push(m[5] ? 'ti_' + slug(m[5]) : {'den tomma kolumnen': 'till_den_tomma_kolumnen', 'den tomma högen': 'till_den_tomma_hogen', 'en fri cell': 'till_en_fri_cell', 'slänghögen': 'till_slanghogen'}[m[4]]);
      return out;
    }],
    [new RegExp(`^Lägg upp ${NAME} på ess-högen\\.$`, 'i'), m => ['up_' + slug(m[1])]],
    [new RegExp(`^Para ihop ${NAME} med ${NAME}\\.$`, 'i'), m => ['pa_' + slug(m[1]), 'me_' + slug(m[2])]],
    [new RegExp(`^Plocka bort ${NAME}\\.$`, 'i'), m => ['pb_' + slug(m[1])]],
    [new RegExp(`^Släng ${NAME}\\.$`, 'i'), m => ['sl_' + slug(m[1])]],
    [new RegExp(`^Vänd upp kort från talongen tills ${NAME} ligger överst\\.$`, 'i'), m => ['vand_upp_tills', 'lo_' + slug(m[1])]],
    [new RegExp(`^Vänd talongen och vänd sedan upp kort tills ${NAME} ligger överst\\.$`, 'i'), m => ['vand_talongen_och_sedan', 'lo_' + slug(m[1])]]
  ];
  const FIXED = {
    'Vänd upp ett kort från talongen.': 'vand_upp_ett_kort',
    'Vänd upp kort från talongen.': 'vand_upp_kort',
    'Vänd talongen och gå igenom den igen.': 'vand_talongen',
    'Dela ut en ny rad från talongen.': 'dela_ut_en_ny_rad',
    'Dela ut fyra nya kort.': 'dela_ut_fyra',
    'Nu går det att vinna igen.': 'kan_vinna_igen',
    'Härifrån går patiensen tyvärr inte att vinna.': 'gar_inte_att_vinna',
    'Nu tar det stopp.': 'nu_tar_det_stopp',
    'Välkommen till Patiensklubben!': 'valkommen'
  };
  // Texten som repliker (null om texten inte går att säga)
  V.plan = text => {
    if (FIXED[text]) return [FIXED[text]];
    for (const [re, fn] of PATTERNS) { const m = re.exec(text); if (m) return fn(m); }
    return null;
  };
  V.canSay = text => { const k = V.plan(text); return !!(k && k.every(x => KEYS.has(x))); };

  // Säg en text (om alla delar finns). Det som sades innan avbryts.
  V.say = text => {
    if (!Settings.voice || !V.available() || Time.scale === 0) return false;
    const keys = V.plan(text);
    if (!keys || !keys.every(k => KEYS.has(k))) return false;
    V.play(keys);
    return true;
  };
  V.play = async keys => {
    const my = ++token;
    V.stop();
    const parts = await Promise.all(keys.map(buffer)).catch(() => null);
    if (!parts || parts.some(p => !p) || my !== token) return false;
    const ctx = Sound.ctx();
    if (!ctx) return false;
    let t = ctx.currentTime + .04;
    for (const p of parts) {
      const src = ctx.createBufferSource();
      src.buffer = p.buf;
      src.connect(Sound.voiceBus());
      src.start(t, p.start, p.dur);
      playing.push(src);
      t += p.dur + .05;
    }
    return true;
  };
  V.stop = () => { playing.forEach(s => { try { s.stop(); } catch (e) { /* redan klar */ } }); playing = []; };
  // Beröm när patiensen går ut: en av flera repliker
  V.win = () => {
    if (!V.available() || !Settings.voice) return;
    const keys = [...KEYS].filter(k => /^vinst_\d+$/.test(k));
    if (keys.length) V.play([pick(keys)]);
  };
  V.line = key => { if (V.available() && Settings.voice && KEYS.has(key)) V.play([key]); };
  return V;
})();

  U.sheet = (o = {}) => {
    const root = $('sheets');

    U.clearToasts();
    const back = h('div', {class: 'sheet-back'});
    const card = h('div', {class: 'sheet ' + (o.cls || ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': o.title || ''});
    if (o.title) {
      const head = h('div', {class: 'sheet-head'}, h('h2', {}, o.title));
      if (o.dismiss !== false) {
        const x = h('button', {class: 'sheet-x', type: 'button', 'aria-label': 'Stäng', html: U.icon('close')});
        x.onclick = () => { Sound.play('click'); api.close(); };
        head.append(x);
      }
      card.append(head);
    }
    const body = h('div', {class: 'sheet-body'});
    if (o.body) body.append(o.body);
    card.append(body);
    if (o.buttons && o.buttons.length) {
      const foot = h('div', {class: 'sheet-foot'});
      o.buttons.forEach(b => foot.append(U.btn(b.label, () => { if (b.onClick) b.onClick(api); if (b.close !== false) api.close(b.value); }, {cls: b.cls || '', icon: b.icon})));
      card.append(foot);
    }
    const wrap = h('div', {class: 'sheet-wrap' + (o.clear ? ' clear' : '')}, back, card);
    root.append(wrap);
    requestAnimationFrame(() => wrap.classList.add('on'));
    let closed = false;
    const api = {
      el: card, body,
      close(val) {
        if (closed) return;
        closed = true;
        const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
        if (o.onClose) try { o.onClose(val); } catch (e) { console.error(e); }
        wrap.classList.remove('on');
        setTimeout(() => wrap.remove(), 260);
        lastClose = performance.now();
        Bus.emit('sheets', stack.length);
      },
      get open() { return !closed; },
      dismissable: o.dismiss !== false
    };
    // (ett dubbeltryck som öppnade rutan ska inte stänga den direkt igen)
    const openedAt = performance.now();
    if (o.dismiss !== false) back.onclick = () => { if (performance.now() - openedAt > 350) api.close(); };
    stack.push(api);
    Bus.emit('sheets', stack.length);
    return api;
  };
  U.closeAll = () => stack.slice().forEach(s => s.close());
  U.topSheet = () => stack[stack.length - 1] || null;
  U.sheetOpen = () => stack.length > 0;
  document.addEventListener('keydown', e => {
    // Esc stänger bara dialoger som går att stänga
    if (e.key === 'Escape' && stack.length) { const s = stack[stack.length - 1]; if (s && s.dismissable) s.close(); e.preventDefault(); }
  });
  // Fråga med två svar. Ger ett löfte med true/false.
  U.confirm = (text, {title = '', yes = 'Ja', no = 'Avbryt', danger = false, clear = false} = {}) => new Promise(res => {
    let answer = false;
    U.sheet({title, cls: 'small', clear, body: h('p', {class: 'lead'}, text), onClose: () => res(answer),
      buttons: [{label: no, cls: 'ghost'}, {label: yes, cls: danger ? 'danger' : 'gold', onClick: () => { answer = true; }}]});
  });

  /* ---------- Notiser ---------- */
  // Hur länge en notis syns beror på längden (ungefär två ord i sekunden räcker för alla). Tryck för att stänga.
  U.toast = (text, {ms = 0, kind = ''} = {}) => {
    // (medan en ruta är öppen tar notisen emot tryck och stängs, så att ingen dold knapp trycks av misstag)
    const t = h('div', {class: 'toast ' + kind + (stack.length ? ' modal' : ''), role: 'status'}, text);
    $('toasts').append(t);
    // högst två notiser samtidigt
    const all = $('toasts').children;
    while (all.length > 2) all[0].remove();
    requestAnimationFrame(() => t.classList.add('on'));
    const slow = Settings.speed === 'lugn' ? 1.5 : 1;
    const dur = Math.max(ms, 3500, 1500 + String(text).length * 70) * slow;
    let timer = 0, hovered = false;
    const close = () => { clearTimeout(timer); t.classList.remove('on'); setTimeout(() => t.remove(), 300); };
    const arm = () => { clearTimeout(timer); timer = setTimeout(() => { if (!hovered) close(); }, dur); };
    t.addEventListener('pointerdown', close);
    t.addEventListener('pointerenter', () => { hovered = true; });
    t.addEventListener('pointerleave', () => { hovered = false; arm(); });
    arm();
    Bus.emit('toast', text, kind);
    return t;
  };
  U.clearToasts = () => { [...$('toasts').children].forEach(t => t.remove()); U.toastsTop(null); };

  /* ---------- Figurer ---------- */
  U.AVATARS = ['🦊', '🐻', '🐼', '🦁', '🐯', '🐸', '🐵', '🐧', '🦉', '🐙', '🦄', '🐺', '🐰', '🦝', '🐨', '🐮', '🎩', '👑', '🌟', '🍀', '🌹', '🌷', '☕', '🧶'];
  U.cleanAv = a => U.AVATARS.includes(a) ? a : '🙂';
  U.COLORS = ['#e6b94f', '#7fb6e0', '#e58fa6', '#8ed1a6', '#c9a0ea', '#f2a15f'];
  return U;
})();

/* ---- 07-table.js ---- */
/* ================= Bordet: var korten ligger och hur de rör sig ================= */
// Varje kort har ett eget element som flyttas med transform. Bordet räknar ut var alla kort ska ligga för läget
// (layout) och låter dem glida dit. Tomma platser (ess-högar, tomma kolumner, talongen) ritas som ramar.
// Korten kan dras med fingret eller musen, och man kan trycka på dem. Vad som händer bestämmer Play.
const Table = (() => {
  const T = {};
  let root, cardsEl, zonesEl, fxEl;
  let S = null, P = null, G = null;
  const els = new Map();         // kort-id → element
  const where = new Map();       // kort-id → {pile, idx, x, y, up, z}
  let handlers = {tap: () => {}, drop: () => false, stock: () => {}, pile: () => {}, pick: () => {}};
  let marks = {sel: new Set(), hint: new Set(), targets: new Set(), hintTo: -1};
  const MOVE = 300;
  let topExtra = 0;          // plats överst för tävlingsraden
  T.setTopExtra = px => { if (topExtra === px) return; topExtra = px; if (S) T.set(S, {ms: 0}); };

  T.geo = () => G;
  T.state = () => S;
  T.where = id => where.get(id);
  T.el = id => els.get(id);

  function safe() {
    const p = $('safeProbe');
    if (!p) return {t: 0, r: 0, b: 0, l: 0};
    const cs = getComputedStyle(p);
    return {t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0};
  }

  /* ---------- Geometri ---------- */
  // Skärmen delas i: överst raden med meny och tid (hud), längst ned knapparna (bar) och bordet däremellan.
  // På en låg liggande skärm (telefon på sidan) står knapparna i en kolumn till höger i stället.
  function frame() {
    const W = root.clientWidth || innerWidth, H = root.clientHeight || innerHeight;
    const sa = safe();
    const portrait = H >= W * 1.05;
    const side = !portrait && H < 600;
    const big = sizeFactor();
    const ui = (portrait ? clamp(Math.min(W / 600, H / 950), 1, 1.35) : clamp(Math.min(W / 1000, H / 700), 1, 1.45)) * (1 + (big - 1) * .9);
    const g = {W, H, sa, portrait, side, ui};
    g.hudH = Math.round((side ? 42 : 50) * ui);
    g.barW = side ? Math.round(clamp(W * .13, 104, 150) * Math.min(ui, 1.2)) : 0;
    g.barH = side ? 0 : Math.round((portrait ? 76 : 70) * ui);
    const m = side ? 6 : Math.round(8 * ui);
    g.x0 = sa.l + m;
    g.y0 = sa.t + g.hudH + (side ? 4 : 8) + topExtra;
    g.x1 = W - sa.r - m - g.barW;
    g.y1 = H - sa.b - g.barH - (side ? 4 : 6);
    g.w = g.x1 - g.x0; g.h = g.y1 - g.y0;
    return g;
  }

  // Kolumnernas läge: n kolumner med mellanrum, centrerade. Ger {cw, gap, left}
  function columns(g, n, maxCw, hNeed) {
    const gapK = .12;
    let cw = g.w / (n + (n - 1) * gapK);
    if (hNeed) cw = Math.min(cw, g.h / (hNeed * 1.4));
    cw = Math.min(cw, maxCw);
    cw = Math.floor(cw);
    const gap = Math.max(3, Math.floor(cw * gapK));
    const total = n * cw + (n - 1) * gap;
    return {cw, gap, left: Math.round(g.x0 + (g.w - total) / 2)};
  }

  // Varje patiens: var högarna ligger. Ger g.piles[i] = {x, y, fan, maxH} (x, y = övre vänstra hörnet)
  //   fan: 'down' (kolumn), 'waste' (vända kort, de översta syns), 'stack' (hög), 'slot' (en plats)
  const LAYOUT = {
    klondike(g, S) {
      const c = columns(g, 7, 150 * g.ui, 4.2);
      // bred och låg yta (telefon på sidan): talongen i en kolumn till vänster och ess-högarna till höger, så att
      // kolumnerna får hela höjden och korten blir större
      if (g.w / g.h > 1.6) {
        const gapK = .12, extraK = .45;
        let cw = Math.floor(Math.min(g.w / (9 + 8 * gapK + 2 * extraK), g.h / (2.6 * 1.4), 150 * g.ui));
        if (cw > c.cw * 1.15) {
          const gap = Math.max(3, Math.floor(cw * gapK)), extra = Math.round(cw * extraK), ch = Math.round(cw * 1.4);
          Object.assign(g, {cw, ch, gap, wide: true});
          const total = 9 * cw + 8 * gap + 2 * extra, left = Math.round(g.x0 + (g.w - total) / 2), top = g.y0;
          const L = Settings.left;
          const xA = left, xB = left + total - cw, xT = i => left + cw + gap + extra + i * (cw + gap);
          const sx = L ? xB : xA, fx = L ? xA : xB;
          g.piles = [];
          g.piles[0] = {x: sx, y: top, fan: 'stack'};
          g.piles[1] = {x: sx, y: top + ch + gap * 2, fan: 'waste', vert: true};
          const fstep = Math.min(ch + gap, (g.h - ch) / 3);
          for (let i = 0; i < 4; i++) g.piles[2 + i] = {x: fx, y: Math.round(top + i * fstep), fan: 'stack', zo: i * 60, zh: i < 3 && fstep < ch ? Math.max(20, fstep - 4) : null};
          for (let i = 0; i < 7; i++) g.piles[6 + i] = {x: xT(L ? 6 - i : i), y: top, fan: 'down', maxH: g.y1 - top};
          return;
        }
      }
      Object.assign(g, c, {ch: Math.round(c.cw * 1.4)});
      const colX = i => c.left + (Settings.left ? 6 - i : i) * (c.cw + c.gap);
      const top = g.y0;
      g.piles = [];
      g.piles[0] = {x: colX(0), y: top, fan: 'stack'};
      g.piles[1] = {x: colX(1), y: top, fan: 'waste', dir: Settings.left ? -1 : 1};
      for (let i = 0; i < 4; i++) g.piles[2 + i] = {x: colX(3 + i), y: top, fan: 'stack'};
      const ty = top + g.ch + Math.max(8, Math.round(g.ch * .16));
      for (let i = 0; i < 7; i++) g.piles[6 + i] = {x: colX(i), y: ty, fan: 'down', maxH: g.y1 - ty};
    },
    spider(g, S) {
      const c = columns(g, 10, 132 * g.ui, 4.6);
      Object.assign(g, c, {ch: Math.round(c.cw * 1.4)});
      const colX = i => c.left + (Settings.left ? 9 - i : i) * (c.cw + c.gap);
      const top = g.y0;
      g.piles = [];
      g.piles[0] = {x: colX(0), y: top, fan: 'stock10'};
      for (let i = 0; i < 8; i++) g.piles[1 + i] = {x: colX(2 + i), y: top, fan: 'stack'};
      const ty = top + g.ch + Math.max(8, Math.round(g.ch * .14));
      for (let i = 0; i < 10; i++) g.piles[9 + i] = {x: colX(i), y: ty, fan: 'down', maxH: g.y1 - ty};
    },
    freecell(g, S) {
      const c = columns(g, 8, 140 * g.ui, 4.4);
      Object.assign(g, c, {ch: Math.round(c.cw * 1.4)});
      const colX = i => c.left + i * (c.cw + c.gap);
      const top = g.y0;
      g.piles = [];
      for (let i = 0; i < 4; i++) g.piles[i] = {x: colX(i), y: top, fan: 'slot'};
      for (let i = 0; i < 4; i++) g.piles[4 + i] = {x: colX(4 + i), y: top, fan: 'stack'};
      const ty = top + g.ch + Math.max(8, Math.round(g.ch * .16));
      for (let i = 0; i < 8; i++) g.piles[8 + i] = {x: colX(i), y: ty, fan: 'down', maxH: g.y1 - ty};
    },
    pyramid(g, S) {
      // bred skärm: talongen till vänster och de bortplockade till höger, annars under pyramiden
      const wide = g.w / g.h > 1.25;
      const PY = Engine.GAMES.pyramid;
      let cw;
      if (wide) cw = Math.min(g.w / (7 + 6 * .12 + 2.9), g.h / (4 * 1.4 + .15));
      else cw = Math.min(g.w / (7 + 6 * .12), g.h / ((4 + 1.3) * 1.4));
      cw = Math.floor(Math.min(cw, 150 * g.ui));
      const gap = Math.max(3, Math.floor(cw * .12)), ch = Math.round(cw * 1.4);
      Object.assign(g, {cw, ch, gap});
      const step = cw + gap, rowStep = Math.round(ch * .5);
      const pyrH = ch + 6 * rowStep;
      const cx = g.x0 + g.w / 2;
      const top = wide ? g.y0 + Math.max(0, (g.h - pyrH) / 2) : g.y0 + Math.max(0, (g.h - pyrH - ch * 1.25 - 20) / 2);
      g.piles = [];
      for (let k = 0; k < 28; k++) g.piles[3 + k] = {x: Math.round(cx + PY.X[k] * step / 2 - cw / 2), y: Math.round(top + PY.ROW[k] * rowStep), fan: 'slot'};
      if (wide) {
        const lx = Math.round(cx - 3.5 * step - gap - cw * 1.35), rx = Math.round(cx + 3.5 * step + gap + cw * .35);
        g.piles[0] = {x: lx, y: Math.round(top), fan: 'stack'};
        g.piles[1] = {x: lx, y: Math.round(top + ch + gap * 2), fan: 'stack'};
        g.piles[2] = {x: rx, y: Math.round(top), fan: 'stack'};
      } else {
        const by = Math.round(top + pyrH + ch * .25);
        g.piles[0] = {x: Math.round(cx - 3.5 * step), y: by, fan: 'stack'};
        g.piles[1] = {x: Math.round(cx - 3.5 * step + step), y: by, fan: 'stack'};
        g.piles[2] = {x: Math.round(cx + 3.5 * step - cw), y: by, fan: 'stack'};
      }
    },
    // Idioten: talongen till vänster, de fyra högarna i mitten och de slängda korten till höger (stående skärm:
    // talongen och de slängda överst, högarna under). Stora kort: det är få kort på bordet.
    aces(g, S) {
      const wide = g.w / g.h > 1.15;
      g.piles = [];
      if (wide) {
        const gapK = .14, extraK = .5;
        const cw = Math.floor(Math.min(g.w / (6 + 5 * gapK + 2 * extraK), g.h / (3.3 * 1.4), 160 * g.ui));
        const gap = Math.max(4, Math.floor(cw * gapK)), extra = Math.round(cw * extraK), ch = Math.round(cw * 1.4);
        Object.assign(g, {cw, ch, gap});
        const total = 6 * cw + 5 * gap + 2 * extra, left = Math.round(g.x0 + (g.w - total) / 2), top = g.y0;
        g.piles[0] = {x: left, y: top, fan: 'stack'};
        g.piles[1] = {x: left + total - cw, y: top, fan: 'stack'};
        for (let i = 0; i < 4; i++) g.piles[2 + i] = {x: left + cw + gap + extra + i * (cw + gap), y: top, fan: 'down', maxH: g.y1 - top};
        return;
      }
      const c = columns(g, 4, 150 * g.ui, 4.6);
      Object.assign(g, c, {ch: Math.round(c.cw * 1.4)});
      const colX = i => c.left + i * (c.cw + c.gap);
      const top = g.y0;
      g.piles[0] = {x: colX(0), y: top, fan: 'stack'};
      g.piles[1] = {x: colX(3), y: top, fan: 'stack'};
      const ty = top + g.ch + Math.max(10, Math.round(g.ch * .22));
      for (let i = 0; i < 4; i++) g.piles[2 + i] = {x: colX(i), y: ty, fan: 'down', maxH: g.y1 - ty};
    },
    tripeaks(g, S) {
      const TP = Engine.GAMES.tripeaks;
      let cw = Math.min(g.w / (10 + 9 * .1), g.h / ((2.5 + 1.35) * 1.4));
      cw = Math.floor(Math.min(cw, 140 * g.ui));
      const gap = Math.max(2, Math.floor(cw * .1)), ch = Math.round(cw * 1.4);
      Object.assign(g, {cw, ch, gap});
      const step = cw + gap, rowStep = Math.round(ch * .5);
      const peaksH = ch + 3 * rowStep;
      const total = peaksH + ch * 1.3;
      const top = g.y0 + Math.max(0, (g.h - total) / 3);
      const left = g.x0 + (g.w - (10 * cw + 9 * gap)) / 2;
      g.piles = [];
      for (let k = 0; k < 28; k++) g.piles[2 + k] = {x: Math.round(left + TP.X[k] * step / 2), y: Math.round(top + TP.ROW[k] * rowStep), fan: 'slot'};
      const by = Math.round(top + peaksH + ch * .3);
      const cx = g.x0 + g.w / 2;
      // stående skärm med plats kvar under topparna: talongen och slänghögen blir större (lättare att läsa av)
      const sc = g.portrait ? clamp((g.y1 - by - 8) / ch, 1, 1.7) : 1;
      g.piles[0] = {x: Math.round(cx - cw * sc - step * .5), y: by, fan: 'stack', s: sc};
      g.piles[1] = {x: Math.round(cx + step * .5), y: by, fan: 'stack', s: sc};
    }
  };

  function geometry() {
    const g = frame();
    LAYOUT[S.g](g, S);
    g.small = g.cw < 50;
    // kolumnernas avstånd: dolda kort tätt, öppna så att valören och färgen syns
    g.fd = Math.max(4, Math.round(g.ch * .12));
    g.fu = Math.max(12, Math.round(g.ch * (g.small ? .33 : .27)));
    return g;
  }

  /* ---------- Var varje kort ska ligga ---------- */
  function layoutCards() {
    const out = new Map();
    P = Engine.piles(S);
    let z = 10;
    // små kort: ett gemensamt, större avstånd mellan öppna kort om alla kolumner får plats med det
    let baseFu = G.fu;
    if (G.cw < 64) {
      let fit = Math.max(G.ch * .42, Math.min(G.ch * .6, 28));
      P.forEach((pd, i) => {
        const gp = G.piles[i];
        if (!gp || gp.fan !== 'down') return;
        const down = S.d[i], up = S.p[i].length - down;
        if (up > 1) fit = Math.min(fit, (gp.maxH - G.ch - down * G.fd) / (up - 1));
      });
      baseFu = Math.max(G.fu, Math.floor(fit));
    }
    P.forEach((pd, i) => {
      const a = S.p[i], gp = G.piles[i];
      if (!gp) return;
      const n = a.length;
      if (gp.fan === 'down') {
        // kolumn: räkna ut avstånden så att kolumnen får plats
        // De fem översta öppna korten behåller ett avstånd som är lätt att trycka på. Räcker inte platsen packas de
        // djupare korten tätare (bandet med valör och färg syns ändå), och i sista hand allt: kolumnen ska alltid få
        // plats ovanför knapparna.
        const down = S.d[i], up = n - down, room = gp.maxH;
        const topN = Math.min(Math.max(0, up - 1), 5), deepN = Math.max(0, up - 1 - topN);
        let fd = G.fd, fu = baseFu, fuDeep = baseFu;
        const need = () => down * fd + deepN * fuDeep + topN * fu + G.ch;
        if (need() > room) fd = Math.max(3, Math.min(fd, (room - G.ch - deepN * fuDeep - topN * fu) / Math.max(1, down)));
        // först samma avstånd för alla öppna kort (hela valören syns på varje kort) om det inte blir för tätt
        const uni = up > 1 ? (room - G.ch - down * fd) / (up - 1) : 0;
        if (need() > room && uni >= G.ch * .2) fu = fuDeep = uni;
        if (need() > room && deepN) fuDeep = Math.max(Math.max(6, G.ch * .07), (room - G.ch - down * fd - topN * fu) / deepN);
        if (need() > room && topN) fu = Math.max(G.ch * .16, (room - G.ch - down * fd - deepN * fuDeep) / topN);
        if (need() > room && deepN) fuDeep = Math.max(2, (room - G.ch - down * fd - topN * fu) / deepN);
        if (need() > room && topN) fu = Math.max(2, (room - G.ch - down * fd - deepN * fuDeep) / topN);
        gp.fd = fd; gp.fu = fu;
        let y = gp.y;
        for (let k = 0; k < n; k++) {
          const isUp = k >= down;
          out.set(a[k], {pile: i, idx: k, x: gp.x, y, up: isUp, z: 100 + k});
          y += !isUp ? fd : k - down < deepN ? fuDeep : fu;
        }
        gp.bottom = n ? y - (n - 1 >= down ? fu : fd) + G.ch : gp.y + G.ch;
      } else if (gp.fan === 'waste') {
        // de vända korten: med dra 3 syns de tre översta bredvid varandra
        const show = S.g === 'klondike' && S.o.draw === 3 ? 3 : 1;
        const off = gp.vert ? Math.round(G.ch * .25) : Math.round(G.cw * .3) * (gp.dir || 1);
        const vis = Math.min(show, n);
        for (let k = 0; k < n; k++) {
          const fromTop = n - 1 - k;
          const slot = fromTop < vis ? vis - 1 - fromTop : 0;
          out.set(a[k], {pile: i, idx: k, x: gp.x + (gp.vert ? 0 : slot * off), y: gp.y + (gp.vert ? slot * off : 0), up: true, z: 20 + k});
        }
      } else if (gp.fan === 'stock10') {
        // Spindelharpans talong: en liten hög per utdelning som är kvar
        const deals = Math.ceil(n / 10);
        for (let k = 0; k < n; k++) {
          const dl = Math.floor(k / 10);
          out.set(a[k], {pile: i, idx: k, x: gp.x + Math.min(dl, 4) * Math.round(G.cw * .12), y: gp.y, up: false, z: 20 + k});
        }
        gp.deals = deals;
      } else {
        // hög: korten rakt på varandra, med en antydan till tjocklek
        // (Pyramidens bortplockade kort ligger med baksidan upp, så att de inte ser spelbara ut)
        const upAll = pd.k !== 'stock' && !((S.g === 'pyramid' || S.g === 'aces') && pd.k === 'found');
        for (let k = 0; k < n; k++) {
          const lift = Math.min(3, Math.floor(k / 8));
          const isUp = pd.k === 'slot' ? !S.d[i] : upAll;
          out.set(a[k], {pile: i, idx: k, x: gp.x - lift, y: gp.y - lift, up: isUp, s: gp.s || 1, z: (pd.k === 'slot' ? 100 + (pd.row || 0) * 10 : 20 + (gp.zo || 0)) + k});
        }
      }
    });
    return out;
  }

  /* ---------- Korten som element ---------- */
  function faceHTML(id) { return G && G.small ? Art.mini(id) : Art.face(id); }
  function makeCard(id) {
    const el = h('div', {class: 'card', dataset: {id: String(id)}});
    const inner = h('div', {class: 'cinner'});
    const face = h('div', {class: 'cface', html: faceHTML(id)});
    const back = h('div', {class: 'cback', html: Art.back()});
    inner.append(face, back);
    el.append(inner);
    el._small = G && G.small;
    cardsEl.append(el);
    return el;
  }
  const tf = (x, y, s = 1) => `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)` + (s !== 1 ? ` scale(${s})` : '');
  function setPos(el, p, ms, delay = 0) {
    el.style.transitionDuration = ms + 'ms';
    el.style.transitionDelay = delay + 'ms';
    el.style.transformOrigin = p.s && p.s !== 1 ? '0 0' : '';
    el.style.transform = tf(p.x, p.y, p.s || 1);
  }

  /* ---------- Rita läget ---------- */
  // o.ms: hur länge korten glider (0 = direkt), o.deal: utdelning (korten flyger från talongen ett i taget)
  T.set = (state, o = {}) => {
    const first = !S || S.g !== state.g || S.seed !== state.seed || (o.fresh === true);
    // (ett kort som blev kvar i en dragning som aldrig avslutades lägger sig på sin plats)
    if (!drag) for (const el of els.values()) el.classList.remove('dragging');
    S = state;
    G = geometry();
    document.body.style.setProperty('--cw', G.cw + 'px');
    document.body.style.setProperty('--ch', G.ch + 'px');
    root.dataset.game = S.g;
    // korten som inte hör till den här given tas bort, nya skapas
    const all = new Set(S.p.flat());
    for (const [id, el] of els) if (!all.has(id)) { el.remove(); els.delete(id); where.delete(id); }
    for (const id of all) if (!els.has(id)) els.set(id, makeCard(id));
    // små kort får den tydliga framsidan
    for (const [id, el] of els) if (el._small !== G.small) { el.querySelector('.cface').innerHTML = faceHTML(id); el._small = G.small; }
    const next = layoutCards();
    const ms = o.ms != null ? o.ms : MOVE * Time.speed();
    const deal = o.deal && Time.scale > 0;
    let order = 0;
    // utdelning: allt börjar i talongen (eller mitt på bordet)
    const stockPos = G.piles[0] ? {x: G.piles[0].x, y: G.piles[0].y} : {x: G.x0 + G.w / 2, y: G.y0};
    const dealIds = deal ? [...next.keys()].filter(id => { const p = next.get(id); return E_kind(p.pile) !== 'stock'; }) : [];
    const dealOrder = new Map(dealIds.sort((a, b) => next.get(a).idx - next.get(b).idx || next.get(a).pile - next.get(b).pile).map((id, k) => [id, k]));
    if (first) { root.classList.add('instant'); requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('instant'))); }
    for (const [id, p] of next) {
      const el = els.get(id), old = where.get(id);
      if (!(deal && dealOrder.has(id))) el.classList.toggle('down', !p.up);
      if (deal && dealOrder.has(id)) {
        el.style.transitionDuration = '0ms';
        el.style.transform = tf(stockPos.x, stockPos.y);
        el.classList.add('down');
        el.style.zIndex = 3000 + dealOrder.get(id);
        const k = dealOrder.get(id), d = k * 32 * Time.speed();
        void el.offsetWidth;
        setPos(el, p, 260 * Time.speed(), d);
        setTimeout(() => { el.classList.toggle('down', !p.up); el.style.zIndex = p.z; }, d + 200 * Time.speed());
        continue;
      }
      const moved = !old || old.x !== p.x || old.y !== p.y || (old.s || 1) !== (p.s || 1);
      if (first || !old) { setPos(el, p, 0); el.style.zIndex = p.z; }
      else if (moved) {
        const dist = old ? Math.hypot(old.x - p.x, old.y - p.y) : 0;
        const dur = ms ? Math.round(clamp(ms * (.6 + dist / 900), ms * .6, ms * 1.6)) : 0;
        // kort som byter hög flyger över de andra
        if (old && old.pile !== p.pile && dur) {
          el.style.zIndex = 4000 + order++;
          setTimeout(() => { if (where.get(id) === p) el.style.zIndex = p.z; }, dur + 30);
        } else el.style.zIndex = p.z;
        setPos(el, p, dur);
      } else el.style.zIndex = p.z;
    }
    for (const [id, p] of next) where.set(id, p);
    renderZones();
    applyMarks();
    Bus.emit('table-layout', G);
    if (deal) return (dealIds.length * 32 + 300) * Time.speed();
    return ms;
  };
  const E_kind = i => P[i] ? P[i].k : '';
  // Rita om med samma läge (t.ex. när fönstret ändrar storlek)
  T.refresh = (ms = 0) => { if (S) T.set(S, {ms}); };
  T.clear = () => { for (const el of els.values()) el.remove(); els.clear(); where.clear(); S = null; zonesEl.textContent = ''; };

  /* ---------- Tomma platser och etiketter ---------- */
  function renderZones() {
    zonesEl.textContent = '';
    P.forEach((pd, i) => {
      const gp = G.piles[i];
      if (!gp) return;
      if (pd.k === 'slot') return;
      const sc = gp.s || 1;
      const z = h('div', {class: 'zone z-' + pd.k, dataset: {pile: String(i)}, style: {left: gp.x + 'px', top: gp.y + 'px', width: G.cw * sc + 'px', height: (gp.zh || G.ch) * sc + 'px'}});
      let label = '';
      if (pd.k === 'found') label = S.g === 'pyramid' || S.g === 'spider' || S.g === 'aces' ? '' : Cards.letter(1, Settings.letters);
      if (pd.k === 'tab' && S.g === 'klondike') label = Cards.letter(13, Settings.letters);
      if (pd.k === 'stock') {
        const tap = S.p[0].length ? null : Engine.stockTap(S);
        z.classList.add('stockzone');
        // tom talong: en pil runt om den kan vändas, ett streck om varven är slut (och inget om korten bara är slut)
        const waste = E_kind(1) === 'waste' ? S.p[1].length : 0;
        if (!S.p[0].length) z.innerHTML = tap && tap.ops ? UI.icon('restart', 'zico') : waste && S.g !== 'tripeaks' ? UI.icon('stop', 'zico dim') : '';
        if (S.p[0].length && (S.g === 'klondike' || S.g === 'spider' || S.g === 'pyramid' || S.g === 'tripeaks')) {
          const cnt = S.g === 'spider' ? Math.ceil(S.p[0].length / 10) : S.p[0].length;
          z.append(h('span', {class: 'count'}, String(cnt)));
        }
      }
      if (pd.k === 'waste' && S.g !== 'klondike') label = '';
      if (label) z.append(h('span', {class: 'zlabel'}, label));
      if (pd.k === 'cell') z.append(h('span', {class: 'zlabel small'}, 'Fri cell'));
      zonesEl.append(z);
      // Pyramidens bortplockade kort: etiketten står under högen hela tiden (högerjusterad, högen ligger till höger)
      if (pd.k === 'found' && (S.g === 'pyramid' || S.g === 'aces')) zonesEl.append(h('div', {class: 'passes', style: {right: (G.W - gp.x - G.cw) + 'px', top: (gp.y + G.ch + 4) + 'px', textAlign: 'right'}}, S.g === 'aces' ? 'Slängda' : 'Bortplockade'));
    });
    // Idioten: hur många utdelningar som är kvar
    if (S.g === 'aces' && G.piles[0]) {
      const n = Math.ceil(S.p[0].length / 4), gp = G.piles[0];
      zonesEl.append(h('div', {class: 'passes', style: {left: gp.x + 'px', top: (gp.y + G.ch + 4) + 'px', textAlign: 'left'}}, n === 0 ? 'Talongen är slut' : n === 1 ? 'Sista utdelningen' : `${n} utdelningar kvar`));
    }
    // antal varv kvar vid talongen
    const left = Engine.passesLeft(S);
    if (left != null && G.piles[0]) {
      const gp = G.piles[0];
      const wp = G.piles[1] && G.piles[1].vert ? G.piles[1] : null;
      const ly = wp ? wp.y + G.ch * (S.o.draw === 3 ? 1.5 : 1) + 4 : gp.y + G.ch + 4;
      zonesEl.append(h('div', {class: 'passes', style: {left: gp.x + 'px', top: ly + 'px', width: G.cw + 'px'}}, left === 0 ? 'sista varvet' : `${left} varv kvar`));
    }
  }

  /* ---------- Markeringar: valda kort, tips, möjliga platser ---------- */
  T.mark = (m = {}) => { marks = Object.assign({sel: new Set(), hint: new Set(), why: new Set(), targets: new Set(), hintTo: -1, bad: -1}, m); applyMarks(); };
  function applyMarks() {
    for (const [id, el] of els) {
      el.classList.toggle('sel', marks.sel.has(id));
      el.classList.toggle('hinted', marks.hint.has(id));
      el.classList.toggle('hintwhy', !!(marks.why && marks.why.has(id)));
    }
    // (möjliga platser när man drar lyser grönt, tipsets mål lyser guld)
    zonesEl.querySelectorAll('.zone').forEach(z => { z.classList.toggle('target', marks.targets.has(+z.dataset.pile)); z.classList.toggle('hintzone', marks.hintTo === +z.dataset.pile); });
    // målet för tipset: det översta kortet på högen lyser (eller den tomma platsen)
    for (const [id, el] of els) el.classList.remove('hintto', 'targettop');
    const lightTop = (i, cls) => { const a = S && S.p[i]; if (a && a.length) { const el = els.get(a[a.length - 1]); if (el) el.classList.add(cls); } };
    if (marks.hintTo >= 0) lightTop(marks.hintTo, 'hintto');
    marks.targets.forEach(i => lightTop(i, 'targettop'));
    fxEl.querySelectorAll('.hintarrow').forEach(a => a.remove());
    if (marks.hint.size && marks.hintTo >= 0 && !reduceMotion) drawArrow([...marks.hint][0], marks.hintTo);
  }
  // en tydlig båge från kortet till målet: bågen går ovanför korten och slutar mitt på målkortet (under indexet)
  function drawArrow(id, to) {
    const a = where.get(id), gp = G.piles[to];
    if (!a || !gp) return;
    const tgt = pileTopRect(to);
    const x1 = a.x + G.cw / 2, y1 = a.y + G.ch * .5, x2 = tgt.x + tgt.w / 2, y2 = tgt.y + Math.min(tgt.h * .6, G.ch * .6);
    if (Math.hypot(x2 - x1, y2 - y1) < G.cw * .8) return;
    const mx = (x1 + x2) / 2;
    let my = Math.min(y1, y2) - Math.max(G.ch * .5, Math.abs(x2 - x1) * .25);
    // över andra kolumner: bågens högsta punkt ligger i luckan ovanför kolumnerna, inte över korten i dem
    if (Math.abs(x2 - x1) > G.cw * 1.6) {
      const tops = G.piles.filter(p => p && p.fan === 'down').map(p => p.y);
      if (tops.length) my = Math.min(my, 2 * (Math.min(...tops) - Math.max(6, G.ch * .08)) - (y1 + y2) / 2);
    }
    const sw = Math.max(5, G.cw * .08);
    const path = `M${x1},${y1}Q${mx},${my} ${x2},${y2}`;
    const svg = `<svg class="hintarrow" width="${G.W}" height="${G.H}" viewBox="0 0 ${G.W} ${G.H}"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f1d99a" stroke="#3b2a07" stroke-width="1"/></marker></defs>`
      + `<path d="${path}" fill="none" stroke="rgba(20,12,0,.55)" stroke-width="${sw + 4}" stroke-linecap="round"/>`
      + `<path d="${path}" fill="none" stroke="#f1d99a" stroke-width="${sw}" stroke-linecap="round" marker-end="url(#ah)"/></svg>`;
    fxEl.insertAdjacentHTML('beforeend', svg);
  }
  // Rutan där nästa kort på högen hamnar (eller det översta kortet)
  function pileTopRect(i) {
    const gp = G.piles[i], a = S.p[i], sc = gp.s || 1;
    if (!a.length) return {x: gp.x, y: gp.y, w: G.cw * sc, h: G.ch * sc};
    const p = where.get(a[a.length - 1]);
    return {x: p.x, y: p.y, w: G.cw * sc, h: G.ch * sc};
  }
  T.pileTopRect = pileTopRect;

  // Skaka ett kort (draget gick inte)
  T.shake = ids => { ids.forEach(id => { const el = els.get(id); if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }); };
  // Ett kort som studsar lätt (t.ex. för att visa var man ska trycka)
  T.nudge = ids => { ids.forEach(id => { const el = els.get(id); if (!el) return; el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge'); setTimeout(() => el.classList.remove('nudge'), 900); }); };
  T.flashPile = i => { const z = zonesEl.querySelector(`.zone[data-pile="${i}"]`); if (z) { z.classList.remove('flash'); void z.offsetWidth; z.classList.add('flash'); } };

  /* ---------- Tryck och drag ---------- */
  // Vilken hög ligger under en punkt? (för tryck på tomma platser)
  function pileAt(x, y) {
    if (!G) return -1;
    let best = -1, bestD = Infinity;
    G.piles.forEach((gp, i) => {
      if (!gp) return;
      const r = {x: gp.x, y: gp.y, w: G.cw, h: gp.fan === 'down' ? Math.max(G.ch, (gp.bottom || gp.y + G.ch) - gp.y) : G.ch};
      const pad = G.cw * .12;
      if (x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad) {
        const d = Math.hypot(x - (r.x + r.w / 2), y - (r.y + Math.min(r.h, G.ch) / 2));
        if (d < bestD) { bestD = d; best = i; }
      }
    });
    return best;
  }
  T.pileAt = pileAt;

  let drag = null;
  // ett dubbeltryck (gammal datorvana) ska inte bli två drag: ett nytt tryck på samma ställe strax efter räknas inte
  let lastTap = {x: -999, y: -999, t: -1e9};
