joins};\r\n  }\r\n  H.measure = measure;\r\n  // Vilket slags framsteg (0 = inget): 4 dolt kort vänt, 3 upplagt, 2 samma färg i ordning, 1 nytt kort ur talongen\r\n  function gain(m0, m) {\r\n    if (m.hidden < m0.hidden) return 4;\r\n    if (m.found > m0.found) return 3;\r\n    if (m.joins > m0.joins && m.hidden <= m0.hidden) return 2;\r\n    if (m.unseen < m0.unseen) return 1;\r\n    return 0;\r\n  }\r\n  // Nyckel för läget. Med obegränsat antal varv spelar antalet vändningar ingen roll.\r\n  function keyOf(S) {\r\n    const unlimited = !('passes' in S.o) || !S.o.passes;\r\n    return S.p.map((a, i) => S.d[i] ? S.d[i] + ':' + a.join(',') : a.join(',')).join('|') + (unlimited ? '' : '#' + S.pass);\r\n  }\r\n  // Ett drag med allt som följer av sig självt (hela sviter i Spindelharpan, kort som läggs upp automatiskt)\r\n  function play(S, ops, auto) {\r\n    const T = Engine.clone(S);\r\n    Engine.step(T, ops);\r\n    for (let guard = 0; guard < 60; guard++) {\r\n      const more = Engine.after(T);\r\n      if (more.length) { more.forEach(op => Engine.apply(T, op)); continue; }\r\n      const a = auto && auto !== 'off' ? Engine.autoMove(T, auto) : null;\r\n      if (!a) break;\r\n      Engine.apply(T, a);\r\n    }\r\n    return T;\r\n  }\r\n  H.play = play;\r\n\r\n  // Dragen som sökningen provar. När man har gått igenom hela talongen en gång (och alltså har sett alla kort där)\r\n  // blir \"vänd upp tills kortet kommer fram och lägg det där\" ett enda drag i sökningen, i stället för många vändningar\r\n  // (annars blir sökningen både lång och djup). Innan dess är varje vändning ett framsteg i sig: man får se ett nytt kort.\r\n  function movesFor(S) {\r\n    const list = Engine.moves(S);\r\n    const g = S.g;\r\n    if ((g !== 'klondike' && g !== 'pyramid') || S.pass < 1) return list;\r\n    const Gm = Engine.GAMES[g];\r\n    const out = list.filter(ops => ops[0].t !== 'd' && ops[0].t !== 'r');\r\n    const T = Engine.clone(S), pre = [], seen = new Set([T.p[0].length + ':' + T.p[1].length]);\r\n    for (let guard = 0; guard < 80; guard++) {\r\n      if (T.p[0].length) { Gm.draw(T); pre.push({t: 'd'}); }\r\n      else if (Gm.canRecycle(T)) { Gm.recycle(T); pre.push({t: 'r'}); continue; }\r\n      else break;\r\n      const sig = T.p[0].length + ':' + T.p[1].length;\r\n      if (seen.has(sig)) break;\r\n      seen.add(sig);\r\n      const w = Engine.top(T, 1);\r\n      if (w == null) continue;\r\n      if (g === 'klondike') {\r\n        for (let j = 2; j < 6; j++) if (Gm.ok(T, 1, 1, j)) { out.push(pre.concat([{t: 'm', f: 1, n: 1, to: j}])); break; }\r\n        let empty = false;\r\n        for (let j = 6; j < 13; j++) {\r\n          if (!T.p[j].length) { if (empty) continue; empty = true; }\r\n          if (Gm.ok(T, 1, 1, j)) out.push(pre.concat([{t: 'm', f: 1, n: 1, to: j}]));\r\n        }\r\n      } else {\r\n        if (R_(w) === 13) out.push(pre.concat(Gm.pair(1)));\r\n        else for (let k = 0; k < 28; k++) if (Gm.free(T, k) && R_(Engine.top(T, 3 + k)) + R_(w) === 13) out.push(pre.concat(Gm.pair(1, 3 + k)));\r\n      }\r\n    }\r\n    return out;\r\n  }\r\n  H.movesFor = movesFor;\r\n\r\n  // Drag som aldrig hjälper (för att sökningen inte ska gå runt i cirklar i onödan)\r\n  function pointless(S, ops) {\r\n    if (ops.length !== 1 || ops[0].t !== 'm') return false;\r\n    const {f, n, to} = ops[0], P = Engine.piles(S);\r\n    // flytta tillbaka ett kort från ess-högen och sedan upp igen: tillåtet men sist i ordningen\r\n    if (P[f].k === 'tab' && P[to].k === 'tab' && n === S.p[f].length && !S.p[to].length) return true;   // hel kolumn till tom\r\n    return false;\r\n  }\r\n  // Ordningen dragen provas i: bra drag först (så att den kortaste vägen också blir den mest naturliga)\r\n  function order(S, list) {\r\n    const P = Engine.piles(S);\r\n    const score = ops => {\r\n      const op = ops[0];\r\n      if (op.t !== 'm') return op.t === 'd' || op.t === 'D' ? 5 : 6;\r\n      const kf = P[op.f].k, kt = P[op.to].k;\r\n      if (kt === 'found') return kf === 'waste' ? 1 : 0;\r\n      if (kf === 'tab' && S.d[op.f] && S.d[op.f] === S.p[op.f].length - op.n) return 0;   // vänder ett dolt kort\r\n      if (kf === 'waste' || kf === 'cell') return 2;\r\n      if (kf === 'found') return 7;\r\n      if (kt === 'cell') return 4;\r\n      return 3;\r\n    };\r\n    return list.map(ops => [score(ops), ops]).sort((a, b) => a[0] - b[0]).map(x => x[1]);\r\n  }\r\n\r\n  // Sök vägen till nästa framsteg. Ger {path, gain, depth} eller {stuck: true} eller {capped: true}.\r\n  //   limit: högst så många lägen, auto: inställningen för att lägga upp kort automatiskt\r\n  H.search = (S0, {limit = 6000, auto = 'safe', extra = 2, maxDepth = 14} = {}) => {\r\n    const m0 = measure(S0);\r\n    const seen = new Set([keyOf(S0)]);\r\n    let level = [{S: S0, path: []}], depth = 0, best = null, firstDepth = -1, count = 0, capped = false;\r\n    while (level.length && !capped) {\r\n      depth++;\r\n      if (firstDepth >= 0 && depth > firstDepth + extra) break;\r\n      if (depth > maxDepth) { capped = true; break; }\r\n      const next = [];\r\n      for (const node of level) {\r\n        const list = order(node.S, movesFor(node.S));\r\n        for (const ops of list) {\r\n          if (pointless(node.S, ops)) continue;\r\n          const T = play(node.S, ops, auto);\r\n          const k = keyOf(T);\r\n          if (seen.has(k)) continue;\r\n          seen.add(k);\r\n          if (++count > limit) { capped = true; break; }\r\n          const path = node.path.concat([ops]);\r\n          if (Engine.won(T)) { const cand = {path, gain: 9, depth, win: true}; if (!best || score(cand) > score(best)) best = cand; if (firstDepth < 0) firstDepth = depth; continue; }\r\n          const gn = gain(m0, measure(T));\r\n          if (gn) {\r\n            const cand = {path, gain: gn, depth};\r\n            if (!best || score(cand) > score(best)) best = cand;\r\n            if (firstDepth < 0) firstDepth = depth;\r\n            continue;\r\n          }\r\n          next.push({S: T, path});\r\n        }\r\n        if (capped) break;\r\n      }\r\n      level = next;\r\n    }\r\n    if (best) return best;\r\n    if (capped) return {capped: true};\r\n    return {stuck: true};\r\n  };\r\n  const score = c => c.gain * 10 - c.depth * 4;\r\n\r\n  // Ett enkelt tips utan sökning (när sökningen inte hinner klart): det bästa draget enligt enkla regler\r\n  H.simple = (S, auto = 'safe') => {\r\n    const list = order(S, Engine.moves(S)).filter(ops => !pointless(S, ops));\r\n    // undvik drag som bara flyttar ett kort fram och tillbaka mellan två kolumner\r\n    for (const ops of list) {\r\n      const op = ops[0];\r\n      if (op.t !== 'm') return ops;\r\n      const P = Engine.piles(S);\r\n      if (P[op.f].k === 'tab' && P[op.to].k === 'tab' && !(S.d[op.f] && S.d[op.f] === S.p[op.f].length - op.n) && op.n < S.p[op.f].length) continue;\r\n      if (P[op.f].k === 'found') continue;\r\n      return ops;\r\n    }\r\n    return list[0] || null;\r\n  };\r\n\r\n  // Tre toppar: bästa kedjan av öppna kort (utan att titta på dolda kort). Längre kedjor och fler kort som vänds upp\r\n  // är bättre. Ger stegen för första kortet, eller null.\r\n  function tripeaksHint(S) {\r\n    const T0 = Engine.GAMES.tripeaks;\r\n    let best = null;\r\n    const dfs = (T, first, len, revealed, depth) => {\r\n      const val = len * 10 + revealed * 6;\r\n      if (first && (!best || val > best.val)) best = {val, ops: first};\r\n      if (depth > 9) return;\r\n      for (let k = 0; k < 28; k++) {\r\n        if (!T0.free(T, k) || !T0.near(T, Engine.top(T, 2 + k))) continue;\r\n        const U = Engine.clone(T);\r\n        Engine.apply(U, {t: 'm', f: 2 + k, n: 1, to: 1});\r\n        // nyligen upplagda (vända) kort räknas som okända: kedjan fortsätter inte med dem\r\n        let rv = 0;\r\n        for (let j = 0; j < 28; j++) if (T.d[2 + j] && !U.d[2 + j] && U.p[2 + j].length) { rv++; U.d[2 + j] = 1; }\r\n        dfs(U, first || [{t: 'm', f: 2 + k, n: 1, to: 1}], len + 1, revealed + rv, depth + 1);\r\n      }\r\n    };\r\n    dfs(S, null, 0, 0, 0);\r\n    return best ? best.ops : null;\r\n  }\r\n\r\n  // Det som visas när man trycker på Tips: {ops, text, stuck, win}\r\n  H.get = (S, {auto = 'safe', limit = 6000} = {}) => {\r\n    if (Engine.won(S)) return {text: 'Patiensen är klar!'};\r\n    if (S.g === 'tripeaks') {\r\n      const ops = tripeaksHint(S);\r\n      if (ops) return {ops, text: H.describe(S, ops)};\r\n      if (S.p[0].length) return {ops: [{t: 'd'}], text: H.describe(S, [{t: 'd'}])};\r\n      return {stuck: true, text: 'Det finns inga fler drag.'};\r\n    }\r\n    if (S.g === 'freecell' && typeof Solver !== 'undefined') {\r\n      const sol = Solver.freecell(S, {limit: 60000});\r\n      if (sol && sol.length) return {ops: sol[0], text: H.describe(S, sol[0]), plan: sol};\r\n    }\r\n    const r = H.search(S, {limit, auto});\r\n    if (r.path) return {ops: r.path[0], text: H.describe(S, r.path[0]), plan: r.path, gain: r.gain};\r\n    if (r.stuck) return {stuck: true, text: 'Det finns inga drag som hjälper längre.'};\r\n    const ops = H.simple(S, auto);\r\n    return ops ? {ops, text: H.describe(S, ops)} : {stuck: true, text: 'Det finns inga fler drag.'};\r\n  };\r\n\r\n  // Har det tagit stopp? true = säkert stopp, false = det går att komma vidare, null = vet inte (för många lägen)\r\n  H.stuck = (S, {auto = 'safe', limit = 6000} = {}) => {\r\n    if (Engine.won(S)) return false;\r\n    const list = Engine.moves(S);\r\n    if (!list.length) return true;\r\n    if (S.g === 'freecell') return null;\r\n    // snabbt: finns det ett drag som direkt gör framsteg behövs ingen sökning\r\n    const m0 = measure(S);\r\n    for (const ops of list) if (gain(m0, measure(play(S, ops, auto)))) return false;\r\n    const r = H.search(S, {limit, auto, extra: 0});\r\n    return r.stuck ? true : r.path ? false : null;\r\n  };\r\n\r\n  /* ---------- Tips med lösaren ---------- */\r\n  // Lösaren (som känner till alla kort) letar upp en väg till vinst. Så länge man följer vägen används den; gör man\r\n  // något annat räknas en ny väg fram. Hittar lösaren ingen väg och hann söka klart går patiensen inte att vinna\r\n  // härifrån (då kan man ångra tills den går att vinna igen). Spindelharpan har ingen lösare: där används sökningen.\r\n  const LIMITS = {klondike: 40000, freecell: 30000, pyramid: 300000, tripeaks: 300000, spider: 15000, aces: 400000};\r\n  let plan = null;\r\n  // Lösarens väg som små steg: en vändning eller ett drag i taget (så att tipset hänger med när man vänder talongen)\r\n  function makePlan(S, limit) {\r\n    if (typeof Solver === 'undefined' || !LIMITS[S.g]) return null;\r\n    const lim = limit || LIMITS[S.g];\r\n    let steps = null, lost = false;\r\n    if (S.g === 'klondike') {\r\n      const r = Solver.klondike(S, {limit: lim});\r\n      if (r.solved) steps = Solver.klondikeOps(S, r.path).flatMap(st => st.map(op => [op]));\r\n      else lost = !r.capped;\r\n    } else if (S.g === 'freecell') {\r\n      const path = Solver.freecell(S, {limit: lim});\r\n      if (path) steps = path.flatMap(st => st.map(op => [op]));\r\n    } else if (S.g === 'pyramid') {\r\n      const r = Solver.pyramid(S, {limit: lim}), PY = Engine.GAMES.pyramid;\r\n      if (r.solved) steps = r.path.map(x => x[0] === 'k' ? PY.pair(3 + x[1]) : x[0] === 'pp' ? PY.pair(3 + x[1], 3 + x[2]) : x[0] === 'kw' ? PY.pair(1) : x[0] === 'pw' ? PY.pair(1, 3 + x[1]) : [{t: x[0]}]);\r\n      else lost = !r.capped;\r\n    } else if (S.g === 'spider') {\r\n      // ett steg = draget och det som följer av sig självt (en hel svit som läggs upp), precis som i spelet\r\n      const r = Solver.spider(S, {limit: lim});\r\n      if (r.solved) steps = r.path;\r\n      else lost = !r.capped;\r\n    } else if (S.g === 'aces') {\r\n      const r = Solver.aces(S, {limit: lim});\r\n      if (r.solved) steps = Solver.acesOps(r.path);\r\n      else lost = !r.capped;\r\n    } else if (S.g === 'tripeaks') {\r\n      const r = Solver.tripeaks(S, {limit: lim});\r\n      if (r.solved) steps = r.path.map(x => x === 'd' ? [{t: 'd'}] : [{t: 'm', f: 2 + x, n: 1, to: 1}]);\r\n      else lost = !r.capped;\r\n    }\r\n    if (!steps) return {lost};\r\n    const keys = new Map(), T = Engine.clone(S);\r\n    steps.forEach((ops, i) => { const k = Engine.key(T); if (!keys.has(k)) keys.set(k, i); Engine.step(T, ops); });\r\n    return {g: S.g, seed: S.seed, keys, steps};\r\n  }\r\n  H.forget = () => { plan = null; };\r\n  // Finns ett färdigt tips (lösarens väg) för läget? Då går tipset direkt.\r\n  H.ready = S => !!(plan && plan.g === S.g && plan.seed === S.seed && plan.keys.has(Engine.key(S)));\r\n  // Går patiensen att vinna härifrån? true, false eller null (vet inte). Använder och sparar lösarens väg.\r\n  H.winnable = (S, limit) => {\r\n    if (Engine.won(S)) return true;\r\n    const k = Engine.key(S);\r\n    if (plan && plan.g === S.g && plan.seed === S.seed && plan.keys.has(k)) return true;\r\n    const r = makePlan(S, limit);\r\n    if (r && r.steps) { plan = r; return true; }\r\n    return r && r.lost ? false : null;\r\n  };\r\n  // Det bästa tipset: lösarens nästa drag om det finns, annars sökningens\r\n  H.smart = (S, {auto = 'safe'} = {}) => {\r\n    if (Engine.won(S)) return {text: 'Patiensen är klar!'};\r\n    const k = Engine.key(S);\r\n    let lost = false;\r\n    if (!(plan && plan.g === S.g && plan.seed === S.seed && plan.keys.has(k))) {\r\n      plan = null;\r\n      const r = makePlan(S);\r\n      if (r && r.steps) plan = r; else if (r && r.lost) lost = true;\r\n    }\r\n    if (plan && plan.keys.has(k)) {\r\n      const i = plan.keys.get(k), ops = plan.steps[i];\r\n      // flera vändningar i rad följda av ett kort från de vända korten beskrivs tillsammans (men bara när man har\r\n      // gått igenom talongen en gång: tipset ska inte avslöja kort som man inte har sett)\r\n      let desc = ops;\r\n      if ((ops[0].t === 'd' || ops[0].t === 'r') && S.pass >= 1) {\r\n        const more = [];\r\n        for (let j = i; j < plan.steps.length && j < i + 40; j++) {\r\n          const o = plan.steps[j][0];\r\n          more.push(o);\r\n          if (o.t === 'm') break;\r\n        }\r\n        if (more[more.length - 1].t === 'm' && more[more.length - 1].f === 1) desc = more;\r\n      }\r\n      // (för flera vändningar: kortet som ska komma överst, så att tipset kan ligga kvar medan man vänder)\r\n      let until = null;\r\n      if (desc !== ops) { const T = Engine.clone(S); for (const o of desc) { if (o.t === 'm') break; Engine.apply(T, o); } until = Engine.top(T, 1); }\r\n      return {ops, text: H.describe(S, desc), solver: true, until};\r\n    }\r\n    const r = H.get(S, {auto});\r\n    if (lost) r.lost = true;\r\n    return r;\r\n  };\r\n\r\n  /* ---------- Tipset i ord ---------- */\r\n  const cn = id => Cards.name(id);\r\n  H.describe = (S, ops) => {\r\n    const op = ops[0], P = Engine.piles(S);\r\n    // flera vändningar och sedan ett kort från de vända korten\r\n    if ((op.t === 'd' || op.t === 'r') && ops.length > 1 && ops.some(o => o.t === 'm')) {\r\n      const T = Engine.clone(S);\r\n      for (const o of ops) { if (o.t === 'm') break; Engine.apply(T, o); }\r\n      const c = Engine.top(T, 1);\r\n      if (c != null) return (op.t === 'r' ? 'Vänd talongen och vänd sedan upp kort tills ' : 'Vänd upp kort från talongen tills ') + cn(c) + ' ligger överst.';\r\n    }\r\n    if (op.t === 'd') return S.g === 'klondike' && S.o.draw === 3 ? 'Vänd upp kort från talongen.' : 'Vänd upp ett kort från talongen.';\r\n    if (op.t === 'r') return 'Vänd talongen och gå igenom den igen.';\r\n    if (op.t === 'D') return S.g === 'aces' ? 'Dela ut fyra nya kort.' : 'Dela ut en ny rad från talongen.';\r\n    const a = S.p[op.f], c = a[a.length - op.n], kf = P[op.f].k, kt = P[op.to].k;\r\n    if (S.g === 'pyramid') {\r\n      if (ops.length === 1) return `Plocka bort ${cn(c)}.`;\r\n      const b = Engine.top(S, ops[1].f);\r\n      return `Para ihop ${cn(c)} med ${cn(b)}.`;\r\n    }\r\n    if (S.g === 'tripeaks') return `Flytta ${cn(c)} till slänghögen.`;\r\n    if (S.g === 'aces') return kt === 'found' ? `Släng ${cn(c)}.` : `Flytta ${cn(c)} till den tomma högen.`;\r\n    const what = op.n > 1 ? `${cn(c)} och korten på den` : cn(c);\r\n    if (kt === 'found') return `Lägg upp ${cn(c)} på ess-högen.`;\r\n    if (kt === 'cell') return `Flytta ${cn(c)} till en fri cell.`;\r\n    const t = Engine.top(S, op.to);\r\n    if (t == null) return `Flytta ${what} till den tomma kolumnen.`;\r\n    const from = kf === 'waste' ? ' från slänghögen' : kf === 'found' ? ' tillbaka från ess-högen' : kf === 'cell' ? ' från cellen' : '';\r\n    return `Flytta ${what}${from} till ${cn(t)}.`;\r\n  };\r\n  return H;\r\n})();\r\n\n/* ================= Lösaren: går given att vinna? ================= */\r\n// Lösaren känner till alla kort (även de dolda) och letar efter en väg till en vunnen patiens. Den används\r\n// när spelet byggs (tools/solve-deals.mjs) för att välja ut givar som går att vinna, och i spelet för tipsen i\r\n// FreeCell (där alla kort syns från början). Svaret är antingen en lista med drag (i motorns form), false (går\r\n// inte att vinna) eller null (hann inte klart inom gränsen).\r\nconst Solver = (() => {\r\n  const X = {};\r\n  const R_ = Cards.rank, S_ = Cards.suit, RED = Cards.red;\r\n\r\n  /* ---------- Harpan ---------- */\r\n  // Läget: kolumner (kort + antal dolda), höjden på ess-högarna per färg och talongen (talong + vända kort).\r\n  // Kort som säkert kan läggas upp läggs upp direkt. Talongens kort räknas fram: alla kort som kan hamna överst på\r\n  // de vända korten (genom att vända vidare) blir egna drag.\r\n  //   quick: räcker det att veta OM den går att vinna (då slutar sökningen när allt ligger öppet och resten är enkelt)\r\n  function kit(S0, quick) {\r\n    const draw = S0.o.draw, passes = S0.o.passes;\r\n    const start = {t: [], d: [], f: [0, 0, 0, 0], st: S0.p[0].slice(), w: S0.p[1].slice(), pass: S0.pass};\r\n    for (let i = 0; i < 7; i++) { start.t.push(S0.p[6 + i].slice()); start.d.push(S0.d[6 + i]); }\r\n    for (let i = 2; i < 6; i++) { const t = S0.p[i][S0.p[i].length - 1]; if (t != null) start.f[S_(t)] = R_(t); }\r\n    const clone = s => ({t: s.t.map(a => a.slice()), d: s.d.slice(), f: s.f.slice(), st: s.st.slice(), w: s.w.slice(), pass: s.pass});\r\n    const canF = (s, c) => s.f[S_(c)] === R_(c) - 1;\r\n    const safe = (s, c) => { const r = R_(c); if (!canF(s, c)) return false; if (r <= 2) return true; const o = RED(c) ? [0, 3] : [1, 2]; return s.f[o[0]] >= r - 1 && s.f[o[1]] >= r - 1; };\r\n    const fits = (c, t) => t == null ? R_(c) === 13 : R_(t) === R_(c) + 1 && RED(t) !== RED(c);\r\n    const flip = (s, i) => { if (s.t[i].length && s.d[i] === s.t[i].length) s.d[i]--; };\r\n    // lägg upp allt som är säkert\r\n    const autoUp = (s, path) => {\r\n      let moved = true;\r\n      while (moved) {\r\n        moved = false;\r\n        for (let i = 0; i < 7; i++) {\r\n          const a = s.t[i], c = a[a.length - 1];\r\n          if (c != null && s.d[i] < a.length && safe(s, c)) { a.pop(); s.f[S_(c)]++; flip(s, i); path && path.push({k: 'tf', i, c}); moved = true; }\r\n        }\r\n        const c = s.w[s.w.length - 1];\r\n        if (c != null && safe(s, c)) { s.w.pop(); s.f[S_(c)]++; path && path.push({k: 'wf', c}); moved = true; }\r\n      }\r\n    };\r\n    const key = s => {\r\n      const cols = [];\r\n      for (let i = 0; i < 7; i++) cols.push(s.d[i] + ':' + s.t[i].join('.'));\r\n      cols.sort();\r\n      return s.f.join('.') + '|' + cols.join('/') + '|' + s.st.join('.') + '|' + s.w.join('.') + (passes ? '|' + s.pass : '');\r\n    };\r\n    // alla sätt att få ett nytt kort överst på de vända korten: [{st, w, pass, draws}]\r\n    const talon = s => {\r\n      const out = [];\r\n      let st = s.st.slice(), w = s.w.slice(), pass = s.pass, draws = 0;\r\n      const seen = new Set();\r\n      const sig = () => st.length + ':' + w.length + ':' + (passes ? pass : 0);\r\n      seen.add(sig());\r\n      if (w.length) out.push({st: st.slice(), w: w.slice(), pass, draws: 0});\r\n      for (let guard = 0; guard < 200; guard++) {\r\n        if (st.length) { const n = Math.min(draw, st.length); for (let k = 0; k < n; k++) w.push(st.pop()); }\r\n        else if (w.length && (!passes || pass < passes - 1)) { st = w.reverse(); w = []; pass++; }\r\n        else break;\r\n        draws++;\r\n        const g = sig();\r\n        if (seen.has(g)) break;\r\n        seen.add(g);\r\n        if (w.length) out.push({st: st.slice(), w: w.slice(), pass, draws});\r\n      }\r\n      return out;\r\n    };\r\n    const hidden = s => s.d[0] + s.d[1] + s.d[2] + s.d[3] + s.d[4] + s.d[5] + s.d[6];\r\n    const fsum = s => s.f[0] + s.f[1] + s.f[2] + s.f[3];\r\n    const done = s => fsum(s) === 52 || (quick && !hidden(s) && ((!s.st.length && !s.w.length) || (draw === 1 && !passes)));\r\n    // alla drag från läget, de mest lovande först\r\n    const cands = s => {\r\n      const cand = [];\r\n      for (let i = 0; i < 7; i++) { const a = s.t[i], c = a[a.length - 1]; if (c != null && canF(s, c)) cand.push({p: s.d[i] === a.length - 1 && s.d[i] > 0 ? 0 : 3, k: 'tf', i, c}); }\r\n      for (let i = 0; i < 7; i++) {\r\n        const a = s.t[i], up = a.length - s.d[i];\r\n        if (!up) continue;\r\n        for (let n = up; n >= 1; n--) {\r\n          const c = a[a.length - n];\r\n          // bara hela den öppna delen, eller en del om kortet under kan läggas upp efteråt\r\n          if (n < up) { const under = a[a.length - n - 1]; if (!canF(s, under)) continue; }\r\n          if (n === a.length && R_(c) === 13) continue;   // kung som redan ligger underst\r\n          let emptyDone = false;\r\n          for (let j = 0; j < 7; j++) {\r\n            if (j === i) continue;\r\n            const t = s.t[j][s.t[j].length - 1];\r\n            if (t == null) { if (emptyDone || R_(c) !== 13) continue; emptyDone = true; }\r\n            else if (!fits(c, t)) continue;\r\n            const reveals = n === up && s.d[i] > 0;\r\n            cand.push({p: reveals ? 1 : n < up ? 2 : 4, k: 'tt', i, j, n, c, h: s.d[i]});\r\n          }\r\n        }\r\n      }\r\n      for (const T of talon(s)) {\r\n        const c = T.w[T.w.length - 1];\r\n        if (canF(s, c)) cand.push({p: 2, k: 'wf', T, c});\r\n        let emptyDone = false;\r\n        for (let j = 0; j < 7; j++) {\r\n          const t = s.t[j][s.t[j].length - 1];\r\n          if (t == null) { if (emptyDone || R_(c) !== 13) continue; emptyDone = true; }\r\n          else if (!fits(c, t)) continue;\r\n          cand.push({p: 3, k: 'wt', T, j, c});\r\n        }\r\n      }\r\n      cand.sort((a, b) => a.p - b.p || (b.h || 0) - (a.h || 0) || (a.T ? a.T.draws : 0) - (b.T ? b.T.draws : 0));\r\n      return cand;\r\n    };\r\n    const move = (s, m) => {\r\n      const t = clone(s), step = [m];\r\n      if (m.k === 'tf') { t.t[m.i].pop(); t.f[S_(m.c)]++; flip(t, m.i); }\r\n      else if (m.k === 'tt') { const mv = t.t[m.i].splice(t.t[m.i].length - m.n, m.n); t.t[m.j].push(...mv); flip(t, m.i); }\r\n      else { t.st = m.T.st.slice(); t.w = m.T.w.slice(); t.pass = m.T.pass; t.w.pop(); if (m.k === 'wf') t.f[S_(m.c)]++; else t.t[m.j].push(m.c); }\r\n      autoUp(t, step);\r\n      return {t, step};\r\n    };\r\n    return {start, clone, autoUp, key, hidden, fsum, done, cands, move};\r\n  }\r\n\r\n  // Djupet först, med de mest lovande dragen först\r\n  X.klondikeDfs = (S0, {limit = 150000, quick = false} = {}) => {\r\n    const K = kit(S0, quick);\r\n    const seen = new Set();\r\n    let nodes = 0, found = null;\r\n    const dfs = (s, path) => {\r\n      if (found || nodes > limit) return;\r\n      nodes++;\r\n      if (K.done(s)) { found = path.slice(); return; }\r\n      const k = K.key(s);\r\n      if (seen.has(k)) return;\r\n      seen.add(k);\r\n      for (const m of K.cands(s)) {\r\n        const {t, step} = K.move(s, m);\r\n        path.push(step);\r\n        dfs(t, path);\r\n        path.pop();\r\n        if (found || nodes > limit) return;\r\n      }\r\n    };\r\n    const s0 = K.clone(K.start), first = [];\r\n    K.autoUp(s0, first);\r\n    dfs(s0, first.length ? [first] : []);\r\n    if (found) return {solved: true, nodes, path: found};\r\n    return {solved: false, nodes, capped: nodes > limit};\r\n  };\r\n\r\n  // Bäst först: det läge som ser mest lovande ut (få dolda kort, många upplagda) provas först, oavsett var i\r\n  // sökträdet det ligger. Hittar lösningar som djupet-först fastnar på.\r\n  X.klondikeBest = (S0, {limit = 150000, quick = false, w = 1} = {}) => {\r\n    const K = kit(S0, quick);\r\n    const heap = [];\r\n    const push = x => { heap.push(x); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };\r\n    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };\r\n    const h = s => 6 * K.hidden(s) + (52 - K.fsum(s)) + .6 * (s.st.length + s.w.length);\r\n    const s0 = K.clone(K.start), first = [];\r\n    K.autoUp(s0, first);\r\n    const seen = new Set([K.key(s0)]);\r\n    let nodes = 0, seq = 0;\r\n    push({s: s0, f: h(s0), g: 0, parent: null, step: first.length ? first : null, n: seq++});\r\n    const pathOf = node => { const out = []; for (let x = node; x; x = x.parent) if (x.step) out.push(x.step); return out.reverse(); };\r\n    while (heap.length) {\r\n      const cur = pop();\r\n      if (K.done(cur.s)) return {solved: true, nodes, path: pathOf(cur)};\r\n      if (++nodes > limit) return {solved: false, nodes, capped: true};\r\n      for (const m of K.cands(cur.s)) {\r\n        const {t, step} = K.move(cur.s, m);\r\n        const k = K.key(t);\r\n        if (seen.has(k)) continue;\r\n        seen.add(k);\r\n        push({s: t, f: h(t) + w * (cur.g + 1) * .15, g: cur.g + 1, parent: cur, step, n: seq++});\r\n      }\r\n    }\r\n    return {solved: false, nodes, capped: false};\r\n  };\r\n\r\n  // Först bäst-först, sedan djupet-först med resten av gränsen\r\n  X.klondike = (S0, o = {}) => {\r\n    const limit = o.limit || 150000;\r\n    const a = X.klondikeBest(S0, Object.assign({}, o, {limit: Math.round(limit * .7)}));\r\n    if (a.solved || !a.capped) return a;\r\n    const b = X.klondikeDfs(S0, Object.assign({}, o, {limit: Math.round(limit * .3)}));\r\n    b.nodes += a.nodes;\r\n    return b;\r\n  };\r\n\r\n  // Lösarens drag som motorns drag (en lista med steg per drag), med början i läget S (ändras inte)\r\n  X.klondikeOps = (S0, path) => {\r\n    const S = Engine.clone(S0), out = [];\r\n    const talonTo = (draws, ops) => { for (let k = 0; k < draws; k++) { const op = S.p[0].length ? {t: 'd'} : {t: 'r'}; Engine.apply(S, op); ops.push(op); } };\r\n    for (const step of path) {\r\n      for (const m of step) {\r\n        const ops = [];\r\n        if (m.k === 'tf') ops.push({t: 'm', f: 6 + m.i, n: 1, to: Engine.foundFor(S, m.c)});\r\n        else if (m.k === 'tt') ops.push({t: 'm', f: 6 + m.i, n: m.n, to: 6 + m.j});\r\n        else {\r\n          if (m.T) talonTo(m.T.draws, ops);\r\n          const w = Engine.top(S, 1);\r\n          if (w !== m.c) throw new Error('Lösaren och motorn är oense om talongen');\r\n          ops.push(m.k === 'wf' ? {t: 'm', f: 1, n: 1, to: Engine.foundFor(S, m.c)} : {t: 'm', f: 1, n: 1, to: 6 + m.j});\r\n        }\r\n        const last = ops[ops.length - 1];\r\n        Engine.apply(S, last);\r\n        S.moves++;\r\n        out.push(ops);\r\n      }\r\n    }\r\n    return out;\r\n  };\r\n\r\n  // En \"vanlig\" spelare som inte tittar på dolda kort och inte ångrar: gör det som ser bäst ut just nu.\r\n  // Vinner den är given lätt. Ger true (vann) eller false.\r\n  X.klondikeGreedy = S0 => {\r\n    const S = Engine.clone(S0), K = Engine.GAMES.klondike;\r\n    let idle = 0;\r\n    for (let guard = 0; guard < 3000; guard++) {\r\n      for (let g = 0; g < 60; g++) { const a = Engine.autoMove(S, 'safe'); if (!a) break; Engine.apply(S, a); }\r\n      if (Engine.won(S)) return true;\r\n      let best = null, bestScore = -1;\r\n      const consider = (ops, sc) => { if (sc > bestScore) { best = ops; bestScore = sc; } };\r\n      for (const ops of K.moves(S)) {\r\n        const op = ops[0];\r\n        if (op.t !== 'm') continue;\r\n        const kf = Engine.kind(S, op.f), kt = Engine.kind(S, op.to);\r\n        const reveals = kf === 'tab' && S.d[op.f] > 0 && S.d[op.f] === S.p[op.f].length - op.n;\r\n        if (kt === 'found') { consider(ops, reveals ? 90 : kf === 'waste' ? 70 : 40); continue; }\r\n        if (kf === 'tab' && kt === 'tab') {\r\n          if (reveals) consider(ops, 80 + S.d[op.f]);\r\n          // en kung till en tom plats bara om den har dolda kort under sig (annars är det meningslöst)\r\n          continue;\r\n        }\r\n        if (kf === 'waste' && kt === 'tab') { consider(ops, S.p[op.to].length ? 60 : 30); continue; }\r\n      }\r\n      if (best) { Engine.step(S, best); idle = 0; continue; }\r\n      const tap = Engine.stockTap(S);\r\n      if (!tap.ops) return false;\r\n      Engine.step(S, tap.ops);\r\n      if (++idle > (S.p[0].length + S.p[1].length) / S.o.draw + 3) return false;\r\n    }\r\n    return false;\r\n  };\r\n\r\n  /* ---------- Pyramiden ---------- */\r\n  X.pyramid = (S0, {limit = 400000} = {}) => {\r\n    const P = Engine.GAMES.pyramid, passes = S0.o.passes;\r\n    const cards = [];\r\n    for (let k = 0; k < 28; k++) cards.push(S0.p[3 + k][0]);\r\n    let mask0 = 0;\r\n    for (let k = 0; k < 28; k++) if (!S0.p[3 + k].length) mask0 |= 1 << k;\r\n    const free = (mask, k) => !(mask & (1 << k)) && P.COV[k].every(j => mask & (1 << j));\r\n    // korten som täcker platsen k (direkt eller längre ned): de måste bort innan k blir fri, så de kan inte paras med k\r\n    const DESC = [];\r\n    for (let k = 27; k >= 0; k--) { let m = 0; for (const j of P.COV[k]) m |= (1 << j) | DESC[j]; DESC[k] = m; }\r\n    // ett kort utan någon möjlig partner kvar gör att pyramiden aldrig blir tom\r\n    const dead = (mask, st, w) => {\r\n      const talonRanks = new Array(14).fill(0);\r\n      for (const c of st) talonRanks[R_(c)]++;\r\n      for (const c of w) talonRanks[R_(c)]++;\r\n      for (let k = 0; k < 28; k++) {\r\n        if (mask & (1 << k)) continue;\r\n        const r = R_(cards[k]);\r\n        if (r === 13) continue;\r\n        const need = 13 - r;\r\n        if (talonRanks[need]) continue;\r\n        let ok = false;\r\n        for (let j = 0; j < 28 && !ok; j++) if (j !== k && !(mask & (1 << j)) && R_(cards[j]) === need && !(DESC[k] & (1 << j)) && !(DESC[j] & (1 << k))) ok = true;\r\n        if (!ok) return true;\r\n      }\r\n      return false;\r\n    };\r\n    const seen = new Set();\r\n    let nodes = 0, win = null;\r\n    const dfs = (mask, st, w, pass, path) => {\r\n      if (win || nodes > limit) return;\r\n      nodes++;\r\n      if (mask === 0xFFFFFFF) { win = path.slice(); return; }\r\n      const k = mask + '|' + st.length + '|' + w.join('.') + '|' + pass;\r\n      if (seen.has(k)) return;\r\n      seen.add(k);\r\n      if (dead(mask, st, w)) return;\r\n      const av = [];\r\n      for (let i = 0; i < 28; i++) if (free(mask, i)) av.push(i);\r\n      const wt = w[w.length - 1];\r\n      // kungar först, sedan par i pyramiden, sedan par med de vända korten\r\n      for (const i of av) if (R_(cards[i]) === 13) { path.push(['k', i]); dfs(mask | (1 << i), st, w, pass, path); path.pop(); if (win) return; }\r\n      for (let x = 0; x < av.length; x++) for (let y = x + 1; y < av.length; y++) {\r\n        const a = av[x], b = av[y];\r\n        if (R_(cards[a]) + R_(cards[b]) === 13) { path.push(['pp', a, b]); dfs(mask | (1 << a) | (1 << b), st, w, pass, path); path.pop(); if (win) return; }\r\n      }\r\n      if (wt != null) {\r\n        if (R_(wt) === 13) { path.push(['kw']); dfs(mask, st, w.slice(0, -1), pass, path); path.pop(); if (win) return; }\r\n        for (const i of av) if (R_(cards[i]) + R_(wt) === 13) { path.push(['pw', i]); dfs(mask | (1 << i), st, w.slice(0, -1), pass, path); path.pop(); if (win) return; }\r\n      }\r\n      if (st.length) { path.push(['d']); dfs(mask, st.slice(0, -1), w.concat([st[st.length - 1]]), pass, path); path.pop(); }\r\n      else if (w.length && (!passes || pass < passes - 1)) { path.push(['r']); dfs(mask, w.slice().reverse(), [], pass + 1, path); path.pop(); }\r\n    };\r\n    dfs(mask0, S0.p[0].slice(), S0.p[1].slice(), S0.pass, []);\r\n    if (win) return {solved: true, nodes, path: win};\r\n    return {solved: false, nodes, capped: nodes > limit};\r\n  };\r\n\r\n  /* ---------- Tre toppar ---------- */\r\n  X.tripeaks = (S0, {limit = 400000} = {}) => {\r\n    const T = Engine.GAMES.tripeaks, wrap = S0.o.wrap;\r\n    const cards = [];\r\n    for (let k = 0; k < 28; k++) cards.push(S0.p[2 + k][0]);\r\n    let mask0 = 0;\r\n    for (let k = 0; k < 28; k++) if (!S0.p[2 + k].length) mask0 |= 1 << k;\r\n    const free = (mask, k) => !(mask & (1 << k)) && T.COV[k].every(j => mask & (1 << j));\r\n    const near = (a, b) => { const d = Math.abs(R_(a) - R_(b)); return d === 1 || (wrap && d === 12); };\r\n    const st0 = S0.p[0].slice();\r\n    const seen = new Set();\r\n    let nodes = 0, win = null;\r\n    const dfs = (mask, si, wt, path) => {\r\n      if (win || nodes > limit) return;\r\n      nodes++;\r\n      if (mask === 0xFFFFFFF) { win = path.slice(); return; }\r\n      const k = mask + '|' + si + '|' + wt;\r\n      if (seen.has(k)) return;\r\n      seen.add(k);\r\n      for (let i = 0; i < 28; i++) {\r\n        if (!free(mask, i) || !near(cards[i], wt)) continue;\r\n        path.push(i); dfs(mask | (1 << i), si, cards[i], path); path.pop();\r\n        if (win || nodes > limit) return;\r\n      }\r\n      if (si > 0) { path.push('d'); dfs(mask, si - 1, st0[si - 1], path); path.pop(); }\r\n    };\r\n    dfs(mask0, st0.length, S0.p[1][S0.p[1].length - 1], []);\r\n    if (win) return {solved: true, nodes, path: win};\r\n    return {solved: false, nodes, capped: nodes > limit};\r\n  };\r\n\r\n  /* ---------- Idioten ---------- */\r\n  // Allt som kan slängas slängs direkt (det gör aldrig läget sämre). Valen som återstår: vilket kort som flyttas till\r\n  // en tom hög, och när nya kort delas ut. Djupet först, lägen som redan är provade hoppas över.\r\n  // Vägen: ['x', hög] (släng), ['m', från, till] (till en tom hög) och ['D'] (dela ut), högarna räknade 0–3.\r\n  X.aces = (S0, {limit = 200000} = {}) => {\r\n    const val = c => R_(c) === 1 ? 14 : R_(c);\r\n    const st = S0.p[0];\r\n    const seen = new Set();\r\n    let nodes = 0, win = null;\r\n    const dfs = (cols0, si, path) => {\r\n      if (win || nodes > limit) return;\r\n      nodes++;\r\n      const cols = cols0.map(a => a.slice());\r\n      const before = path.length;\r\n      for (let again = true; again;) {\r\n        again = false;\r\n        for (let i = 0; i < 4 && !again; i++) {\r\n          const a = cols[i];\r\n          if (!a.length) continue;\r\n          const c = a[a.length - 1];\r\n          for (let j = 0; j < 4; j++) {\r\n            if (j === i || !cols[j].length) continue;\r\n            const t = cols[j][cols[j].length - 1];\r\n            if (S_(t) === S_(c) && val(t) > val(c)) { a.pop(); path.push(['x', i]); again = true; break; }\r\n          }\r\n        }\r\n      }\r\n      const left = cols.reduce((n, a) => n + a.length, 0);\r\n      if (si === 0 && left === 4) { win = path.slice(); path.length = before; return; }\r\n      const key = cols.map(a => a.join(',')).join('|') + '#' + si;\r\n      if (seen.has(key)) { path.length = before; return; }\r\n      seen.add(key);\r\n      const empty = cols.findIndex(a => !a.length);\r\n      if (empty >= 0) {\r\n        for (let i = 0; i < 4; i++) {\r\n          if (cols[i].length < 2) continue;\r\n          const nc = cols.map(a => a.slice());\r\n          nc[empty].push(nc[i].pop());\r\n          path.push(['m', i, empty]);\r\n          dfs(nc, si, path);\r\n          path.pop();\r\n          if (win || nodes > limit) { path.length = before; return; }\r\n        }\r\n      }\r\n      if (si > 0) {\r\n        const nc = cols.map(a => a.slice());\r\n        let k = si;\r\n        for (let c = 0; c < 4 && k > 0; c++) nc[c].push(st[--k]);\r\n        path.push(['D']);\r\n        dfs(nc, k, path);\r\n        path.pop();\r\n      }\r\n      path.length = before;\r\n    };\r\n    dfs(S0.p.slice(2, 6), st.length, []);\r\n    if (win) return {solved: true, nodes, path: win};\r\n    return {solved: false, nodes, capped: nodes > limit};\r\n  };\r\n  // Vägen som motorns steg (ett drag per steg)\r\n  X.acesOps = path => path.map(x => x[0] === 'x' ? [{t: 'm', f: 2 + x[1], n: 1, to: 1}] : x[0] === 'm' ? [{t: 'm', f: 2 + x[1], n: 1, to: 2 + x[2]}] : [{t: 'D'}]);\r\n\r\n  /* ---------- Spindelharpan ---------- */\r\n  // Bäst först med motorns egna drag. Poängen: dolda kort, brott i ordningen bland de öppna korten, sviter som inte\r\n  // är klara och utdelningar kvar. Drag som bryter en redan hel följd i samma färg provas inte.\r\n  X.spider = (S0, {limit = 20000} = {}) => {\r\n    const SP = Engine.GAMES.spider;\r\n    const heur = S => {\r\n      let hidden = 0, breaks = 0, empty = 0, done = 0;\r\n      for (let i = 9; i < 19; i++) {\r\n        const a = S.p[i];\r\n        hidden += S.d[i];\r\n        if (!a.length) { empty++; continue; }\r\n        for (let k = S.d[i]; k < a.length - 1; k++) if (S_(a[k]) !== S_(a[k + 1]) || R_(a[k]) !== R_(a[k + 1]) + 1) breaks++;\r\n      }\r\n      for (let i = 1; i <= 8; i++) if (S.p[i].length) done++;\r\n      return hidden * 8 + breaks * 3 + (8 - done) * 13 + (S.p[0].length / 10) * 5 - empty * 2;\r\n    };\r\n    const keyOf = S => { const cols = []; for (let i = 9; i < 19; i++) cols.push(S.d[i] + ':' + S.p[i].join('.')); cols.sort(); return cols.join('/') + '|' + S.p[0].length; };\r\n    // flyttar som bryter en hel följd i samma färg (kortet under är ett högre i samma färg) ger inget\r\n    const breaksRun = (S, op) => {\r\n      if (op.t !== 'm') return false;\r\n      const a = S.p[op.f], k = a.length - op.n;\r\n      if (k <= S.d[op.f] || k === 0) return false;\r\n      const under = a[k - 1], c = a[k];\r\n      return S_(under) === S_(c) && R_(under) === R_(c) + 1;\r\n    };\r\n    const heap = [];\r\n    const push = x => { heap.push(x); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };\r\n    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };\r\n    const seen = new Set([keyOf(S0)]);\r\n    const pathOf = node => { const out = []; for (let x = node; x && x.all; x = x.parent) out.push(x.all); return out.reverse(); };\r\n    push({S: S0, parent: null, all: null, g: 0, f: heur(S0)});\r\n    let nodes = 0;\r\n    while (heap.length && nodes < limit) {\r\n      const cur = pop();\r\n      nodes++;\r\n      if (SP.won(cur.S)) return {solved: true, nodes, path: pathOf(cur)};\r\n      for (const ops of SP.moves(cur.S)) {\r\n        if (breaksRun(cur.S, ops[0])) continue;\r\n        const T = Engine.clone(cur.S), all = ops.slice();\r\n        Engine.step(T, ops);\r\n        for (let g = 0; g < 8; g++) { const more = Engine.after(T); if (!more.length) break; more.forEach(op => Engine.apply(T, op)); all.push(...more); }\r\n        const k = keyOf(T);\r\n        if (seen.has(k)) continue;\r\n        seen.add(k);\r\n        const node = {S: T, parent: cur, all, g: cur.g + 1};\r\n        if (SP.won(T)) return {solved: true, nodes, path: pathOf(node)};\r\n        node.f = heur(T) + node.g * .15;\r\n        push(node);\r\n      }\r\n    }\r\n    return {solved: false, nodes, capped: heap.length > 0};\r\n  };\r\n\r\n  /* ---------- FreeCell ---------- */\r\n  // Bäst först: läget med minst \"arbete kvar\" provas först. Ger en lista med drag i motorns form, eller null.\r\n  X.freecell = (S0, {limit = 60000, wg = .12} = {}) => {\r\n    const FC = Engine.GAMES.freecell;\r\n    // Hur mycket arbete som är kvar: kort som inte är upplagda, kort som ligger ovanpå nästa kort som ska upp,\r\n    // kort i fel ordning, upptagna celler och tomma kolumner (bra)\r\n    const heur = S => {\r\n      const hgt = [0, 0, 0, 0];\r\n      for (let i = 4; i < 8; i++) { const t = S.p[i][S.p[i].length - 1]; if (t != null) hgt[S_(t)] = R_(t); }\r\n      let h = (52 - hgt[0] - hgt[1] - hgt[2] - hgt[3]) * 4;\r\n      for (let i = 8; i < 16; i++) {\r\n        const a = S.p[i];\r\n        if (!a.length) { h -= 4; continue; }\r\n        // hur långt ned den ordnade följden når\r\n        let k = a.length - 1;\r\n        while (k > 0 && R_(a[k - 1]) === R_(a[k]) + 1 && RED(a[k - 1]) !== RED(a[k])) k--;\r\n        h += k * 1.5;\r\n        // nästa kort som ska upp: hur många ligger ovanpå\r\n        for (let j = 0; j < a.length; j++) { const c = a[j]; if (R_(c) === hgt[S_(c)] + 1) h += (a.length - 1 - j) * 2.5; }\r\n      }\r\n      for (let i = 0; i < 4; i++) if (S.p[i].length) h += 3;\r\n      return h;\r\n    };\r\n    const keyOf = S => { const cols = []; for (let i = 8; i < 16; i++) cols.push(S.p[i].join('.')); cols.sort(); const cells = [0, 1, 2, 3].map(i => S.p[i][0] ?? -1).sort((a, b) => a - b); return cols.join('/') + '|' + cells.join('.') + '|' + [4, 5, 6, 7].map(i => S.p[i].length).join('.'); };\r\n    const withAuto = (S, ops) => {\r\n      const T = Engine.clone(S);\r\n      const all = ops.slice();\r\n      Engine.step(T, ops);\r\n      for (let g = 0; g < 60; g++) { const a = Engine.autoMove(T, 'safe'); if (!a) break; Engine.apply(T, a); all.push(a); }\r\n      return {T, all};\r\n    };\r\n    // binär hög\r\n    const heap = [];\r\n    const push = x => { heap.push(x); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };\r\n    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };\r\n    const seen = new Set([keyOf(S0)]);\r\n    const pathOf = node => { const out = []; for (let x = node; x && x.all; x = x.parent) out.push(x.all); return out.reverse(); };\r\n    push({S: S0, parent: null, all: null, g: 0, f: heur(S0)});\r\n    let nodes = 0;\r\n    while (heap.length && nodes < limit) {\r\n      const cur = pop();\r\n      nodes++;\r\n      if (FC.won(cur.S)) return pathOf(cur);\r\n      for (const ops of FC.moves(cur.S)) {\r\n        // drag som bara flyttar ett kort mellan celler eller tillbaka dit det kom ifrån ger inget\r\n        const {T, all} = withAuto(cur.S, ops);\r\n        const k = keyOf(T);\r\n        if (seen.has(k)) continue;\r\n        seen.add(k);\r\n        const node = {S: T, parent: cur, all, g: cur.g + 1};\r\n        if (FC.won(T)) return pathOf(node);\r\n        node.f = heur(T) + node.g * wg;\r\n        push(node);\r\n      }\r\n    }\r\n    return null;\r\n  };\r\n  return X;\r\n})();\r\n\n/* ================= Tråden för tipsen ================= */\r\n// Körs i en egen tråd (Web Worker) med samma regler, tips och lösare som spelet (bygget lägger 00-core, 01-cards,\r\n// 02-engine, 03-hint och 03b-solver före den här filen). Spelet frågar härifrån, så att skärmen aldrig står still\r\n// medan lösaren tänker. Svaren sparas, så att samma fråga två gånger (t.ex. först i förväg, sedan på riktigt) går fort.\r\nconst answers = new Map();\r\nconst keyOf = (S, auto) => S.g + JSON.stringify(S.o) + S.seed + '/' + Engine.key(S) + '/' + auto;\r\nfunction smart(S, auto) {\r\n  const k = keyOf(S, auto);\r\n  if (answers.has(k)) return answers.get(k);\r\n  let r;\r\n  try { r = Hint.smart(S, {auto}); } catch (e) { r = Hint.get(S, {auto}); }\r\n  answers.set(k, r);\r\n  if (answers.size > 300) answers.delete(answers.keys().next().value);\r\n  return r;\r\n}\r\n// Ångra tills det går att vinna: hur många drag bakåt (högst max), eller -1 om ingen väg hittades\r\nfunction undoSearch(g, o, seed, log, max, limit) {\r\n  let n = 0;\r\n  for (let k = log.length - 1; k >= 0 && n < max; k--) {\r\n    n++;\r\n    const T = Engine.replay(g, o, seed, log.slice(0, k));\r\n    if (Hint.winnable(T, limit) === true) return n;\r\n  }\r\n  return -1;\r\n}\r\nself.onmessage = e => {\r\n  const m = e.data || {};\r\n  try {\r\n    let r = null;\r\n    if (m.type === 'smart') r = smart(m.S, m.auto);\r\n    else if (m.type === 'undo') r = undoSearch(m.g, m.o, m.seed, m.log, m.max, m.limit);\r\n    else if (m.type === 'stuck') r = Hint.stuck(m.S, {auto: m.auto});\r\n    else if (m.type === 'forget') { answers.clear(); Hint.forget(); }\r\n    else if (m.type === 'ping') r = 'pong';\r\n    self.postMessage({id: m.id, r});\r\n  } catch (err) { self.postMessage({id: m.id, error: String(err && err.message || err)}); }\r\n};\r\n\n})();\n";

// Skapar HTML-element: h('button', {class: 'btn', onclick: fn}, 'Text', h('span', ...))
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (v[p] == null) continue; if (p.startsWith('--')) e.style.setProperty(p, v[p]); else e.style[p] = v[p]; } }
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
