  // (bara tryck som räknas flyttar spärren: en jämn följd av tryck på talongen vänder ett kort per tryck)
  function firstTap(x, y, ms = 350) {
    const now = performance.now(), again = now - lastTap.t < ms && Math.hypot(x - lastTap.x, y - lastTap.y) < Math.max(28, G.cw * .45);
    if (!again) lastTap = {x, y, t: now};
    return !again;
  }
  // Talongen: ett dubbeltryck räknas som ett tryck, var på talongen man än trycker. I Idioten och Spindelharpan delas
  // kort ut på alla högar (svårt att ångra i tanken), så där är spärren längre.
  let lastStock = -1e9;
  function stockOnce() {
    const now = performance.now(), ms = S && (S.g === 'aces' || S.g === 'spider') ? 600 : 220;
    if (now - lastStock < ms) return false;
    lastStock = now;
    return true;
  }
  // en dragning som inte blev av: korten tillbaka på sina platser
  function dropDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.ids.forEach(id => { const el = els.get(id), p = where.get(id); if (!el) return; el.classList.remove('dragging'); if (p) { setPos(el, p, 200); el.style.zIndex = p.z; } });
  }
  function onDown(e) {
    if (e.button > 0 || !S) return;
    // under en dragning räknas inte andra fingrar (t.ex. en tumme som vilar på skärmen)
    if (drag && drag.moved && e.pointerId !== drag.pid) return;
    // ett nytt finger innan dragningen har börjat: den gamla (som aldrig blev något) släpps
    if (drag) dropDrag();
    if (UI.sheetOpen() || UI.justClosed()) return;
    const cardEl = e.target.closest('.card');
    const zoneEl = e.target.closest('.zone');
    Sound.unlock();
    const rect = root.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (cardEl) {
      const id = +cardEl.dataset.id, p = where.get(id);
      if (!p) return;
      if (E_kind(p.pile) === 'stock') { e.preventDefault(); if (stockOnce()) handlers.stock(); return; }
      const n = S.p[p.pile].length - p.idx;
      const can = Engine.canPick(S, p.pile, n);
      drag = {id, pile: p.pile, idx: p.idx, n, can, x0: x, y0: y, moved: false, pid: e.pointerId, ids: S.p[p.pile].slice(p.idx), t0: performance.now(), touch: e.pointerType !== 'mouse'};
      try { root.setPointerCapture(e.pointerId); } catch (err) { /* går inte */ }
      e.preventDefault();
      return;
    }
    const pi = zoneEl ? +zoneEl.dataset.pile : pileAt(x, y);
    if (pi >= 0 && E_kind(pi) === 'stock') { if (stockOnce()) handlers.stock(); return; }
    if (pi >= 0) handlers.pile(pi);
    else handlers.pile(-1);
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const rect = root.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const dx = x - drag.x0, dy = y - drag.y0;
    if (!drag.moved) {
      // på pekskärm krävs en längre rörelse innan det blir en dragning (fingrar darrar och rullar)
      const thr = drag.touch ? Math.max(14, G.cw * .2) : Math.max(8, G.cw * .12);
      if (Math.hypot(dx, dy) < thr) return;
      if (!drag.can) return;
      drag.moved = true;
      handlers.pick(drag);
      drag.ids.forEach((id, k) => { const el = els.get(id); el.classList.add('dragging'); el.style.transitionDuration = '0ms'; el.style.transitionDelay = '0ms'; el.style.zIndex = 6000 + k; });
      Sound.play('pick');
    }
    drag.dx = dx; drag.dy = dy;
    drag.maxD = Math.max(drag.maxD || 0, Math.hypot(dx, dy));
    drag.ids.forEach(id => { const p = where.get(id), el = els.get(id); el.style.transform = tf(p.x + dx, p.y + dy, 1.04); });
    // visa vart kortet kan hamna
    const to = dropTarget(drag);
    if (to !== drag.over) { drag.over = to; T.mark(Object.assign({}, marks, {targets: new Set(to >= 0 ? [to] : [])})); }
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag;
    drag = null;
    try { root.releasePointerCapture(e.pointerId); } catch (err) { /* släppt */ }
    if (!d.moved) {
      // ett tryck (ett långt tryck räknas också som tryck)
      if (firstTap(d.x0, d.y0)) handlers.tap(d.id, d.pile, d.idx);
      return;
    }
    const to = dropTarget(d, true);
    d.ids.forEach(id => els.get(id).classList.remove('dragging'));
    T.mark(Object.assign({}, marks, {targets: new Set()}));
    const ok = to >= 0 && handlers.drop(d.pile, d.n, to);
    if (!ok) {
      // tillbaka dit det låg
      d.ids.forEach(id => { const p = where.get(id), el = els.get(id); if (p) { setPos(el, p, 220 * Time.speed()); setTimeout(() => { if (where.get(id) === p) el.style.zIndex = p.z; }, 240 * Time.speed()); } });
      // en kort rörelse som inte blev något drag var egentligen ett tryck (ett darrigt finger)
      // (men inte en dragning som gick långt bort och tillbaka: då har man ångrat sig)
      if ((d.maxD || 0) < Math.max(24, G.cw * .4) && performance.now() - d.t0 < 3000) { if (firstTap(d.x0, d.y0)) handlers.tap(d.id, d.pile, d.idx); return; }
      if (d.bad >= 0) handlers.bad && handlers.bad(d.pile, d.n, d.bad);
    }
  }
  // Var hamnar kortet om det släpps nu? Den tillåtna hög som det dragna kortet täcker mest av.
  function dropTarget(d, final) {
    const p0 = where.get(d.ids[0]);
    const r = {x: p0.x + (d.dx || 0), y: p0.y + (d.dy || 0), w: G.cw, h: G.ch};
    let best = -1, bestA = 0, over = -1, overA = 0;
    G.piles.forEach((gp, i) => {
      if (!gp || i === d.pile) return;
      const t = pileTopRect(i);
      // lite generösare ytor (lättare att träffa)
      const pad = G.cw * .25;
      const tx = t.x - pad, ty = t.y - pad, tw = t.w + pad * 2, th = t.h + pad * 2 + (gp.fan === 'down' ? G.ch * .4 : 0);
      const ox = Math.max(0, Math.min(r.x + r.w, tx + tw) - Math.max(r.x, tx)), oy = Math.max(0, Math.min(r.y + r.h, ty + th) - Math.max(r.y, ty));
      const area = ox * oy;
      if (!area) return;
      // (för förklaringen räknas bara ytan över själva kortet/platsen, utan marginalen)
      const cx = Math.max(0, Math.min(r.x + r.w, t.x + t.w) - Math.max(r.x, t.x)), cy = Math.max(0, Math.min(r.y + r.h, t.y + t.h) - Math.max(r.y, t.y));
      if (cx * cy > overA) { overA = cx * cy; over = i; }
      if (Engine.ok(S, d.pile, d.n, i) && area > bestA) { bestA = area; best = i; }
    });
    if (final) d.bad = best < 0 && overA > r.w * r.h * .5 ? over : -1;
    return best;
  }

  /* ---------- Start ---------- */
  T.init = (o = {}) => {
    root = $('scrTable');
    cardsEl = $('cards'); zonesEl = $('zones'); fxEl = $('fx');
    handlers = Object.assign(handlers, o);
    root.addEventListener('pointerdown', onDown);
    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerup', onUp);
    root.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) dropDrag(); });
    root.addEventListener('contextmenu', e => e.preventDefault());
    let rt = 0;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { try { if (S && !root.hidden) T.set(S, {ms: 0}); } catch (e) { console.error(e); } }, 80); };
    addEventListener('resize', onResize);
    if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  };
  // Kortens rektanglar på skärmen (för vinstanimationen)
  T.cardRect = id => { const p = where.get(id); return p ? {x: p.x, y: p.y, w: G.cw, h: G.ch} : null; };
  return T;
})();

/* ---- 08-play.js ---- */
/* ================= Spelaren: tryck, drag, val och tips ================= */
// Ett tryck på ett kort flyttar det dit det passar bäst (eller väljer det, om man har valt "tryck två gånger" i
// inställningarna). Man kan också dra korten. Går det inte förklaras varför, kort och vänligt.
const Play = (() => {
  const P = {};
  let sel = null;          // valt kort: {pile, n}
  let hint = null;         // tipset som visas: {ops, text}
  let lastNope = 0, lastNopeText = '', thinking = false;

  const S_ = () => Game.state();
  P.selected = () => sel;
  P.reset = () => { sel = null; hint = null; Table.mark({}); };
  function clearSel() { sel = null; Table.mark({}); }
  function select(pile, n, targets) {
    const S = S_();
    sel = {pile, n};
    const ids = S.p[pile].slice(S.p[pile].length - n);
    Table.mark({sel: new Set(ids), targets: new Set(targets || Engine.targets(S, pile, n))});
    Sound.play('pick');
  }
  function nope(ids, text) {
    Sound.play('nope');
    vibrate(20);
    if (ids && ids.length) Table.shake(ids);
    // samma förklaring visas inte om och om igen i snabb följd
    if (text && (text !== lastNopeText || performance.now() - lastNope > 2500)) UI.toast(text, {kind: 'nope'});
    lastNope = performance.now(); lastNopeText = text || '';
  }
  const cn = id => Cards.name(id);

  // Den bästa platsen för de n översta korten i hög f (när man trycker på dem)
  function bestTarget(S, f, n) {
    const targets = Engine.targets(S, f, n);
    if (!targets.length) return -1;
    const kf = Engine.kind(S, f), card = S.p[f][S.p[f].length - n];
    const score = to => {
      const k = Engine.kind(S, to), top = Engine.top(S, to);
      if (k === 'found') return kf === 'found' ? -1 : 100;
      if (k === 'tab') {
        if (top == null) {
          // tomma kolumner är värdefulla: dit bara om inget annat går (i Harpan är det en kung)
          if (S.g === 'klondike') return kf === 'tab' && S.d[f] === 0 && n === S.p[f].length ? -1 : 40;
          return 8;
        }
        let sc = 60;
        if (S.g === 'spider' && Cards.suit(top) === Cards.suit(card)) sc += 20;
        return sc - to * .01;
      }
      if (k === 'cell') return 5;
      return 0;
    };
    let best = -1, bs = -Infinity;
    for (const to of targets) { const sc = score(to); if (sc > bs) { bs = sc; best = to; } }
    return bs < 0 ? -1 : best;
  }
  P.bestTarget = bestTarget;

  // Varför kan de här korten inte flyttas någonstans?
  function explainNoTarget(S, f, n) {
    const a = S.p[f], c = a[a.length - n], ids = a.slice(a.length - n);
    const r = Cards.rank(c);
    if (S.g === 'klondike') {
      if (r === 13 && Engine.targets(S, f, n).length) return nope(ids, `${Cards.Name(c)} ligger redan först i sin kolumn. Den behöver inte flyttas.`);
      if (r === 13) return nope(ids, `${Cards.Name(c)} kan bara flyttas till en tom kolumn, och det finns ingen just nu.`);
      return nope(ids, `${Cards.Name(c)} kan läggas på en ${Cards.red(c) ? 'svart' : 'röd'} ${Cards.rankNoun(r + 1)}, men ingen sådan ligger överst just nu.`);
    }
    if (S.g === 'spider') return nope(ids, r === 13 ? 'En kung kan bara flyttas till en tom kolumn.' : `${Cards.Name(c)} kan läggas på en ${Cards.rankNoun(r + 1)} (vilken färg som helst), men ingen sådan ligger överst just nu.`);
    if (S.g === 'aces') {
      if (r === 1) return nope(ids, 'Ess är högst och ska ligga kvar. Målet är att bara de fyra essen blir kvar.');
      const empty = [2, 3, 4, 5].some(i => !S.p[i].length);
      // (finns ingen tom hög och kort kvar i talongen: säg vad man kan göra i stället)
      return nope(ids, `${Cards.Name(c)} kan bara slängas när ett högre ${Cards.SUIT_NAMES[Cards.suit(c)]}kort ligger överst i en annan hög.` + (!empty && S.p[0].length ? ' Går inget annat: tryck på talongen, så delas fyra nya kort ut.' : ''));
    }
    if (S.g === 'freecell') {
      if (n > 1) return nope(ids, `Det finns ingen plats för ${cn(c)} och korten på den, eller för få fria celler för att flytta så många.`);
      return nope(ids, `Det finns ingen plats för ${cn(c)} just nu, och alla fria celler är upptagna.`);
    }
    return nope(ids, 'Det kortet kan inte flyttas just nu.');
  }

  /* ---------- Tryck ---------- */
  P.tap = (id, pile, idx) => {
    const S = S_();
    if (!S || Game.busy()) return;
    hideHint();
    const n = S.p[pile].length - idx;
    if (S.g === 'pyramid') return pyramidTap(S, pile);
    if (S.g === 'tripeaks') return tripeaksTap(S, pile);
    // något är valt och det här är en tillåten plats: flytta dit
    if (sel) {
      const s = sel;
      clearSel();
      if (s.pile === pile) { if (s.n === n) return; }
      else if (Engine.ok(S, s.pile, s.n, pile)) return move(S, s.pile, s.n, pile);
      else if (!Engine.canPick(S, pile, n)) return nope(S.p[s.pile].slice(S.p[s.pile].length - s.n), Engine.canMove(S, s.pile, s.n, pile));
    }
    // Harpan: ett tryck på ess-högen tar inte ned kortet (det görs genom att dra det, eller med "Väljs det")
    if (S.g === 'klondike' && Engine.kind(S, pile) === 'found' && Settings.tap !== 'select' && Engine.canPick(S, pile, n)) {
      Table.nudge([id]);
      return UI.toast('Kortet ligger på ess-högen. Vill du flytta ned det igen? Dra det dit du vill ha det.');
    }
    if (!Engine.canPick(S, pile, n)) {
      const k = Engine.kind(S, pile);
      if (S.g === 'aces') return nope([id], k === 'found' ? 'Slängda kort ligger kvar där. Släng fler kort från högarna.' : 'Bara det översta kortet i en hög kan slängas eller flyttas.');
      if (k === 'tab' && idx < S.d[pile]) return nope([id], 'Det kortet ligger med baksidan upp. Det vänds när korten ovanpå har flyttats.');
      if (k === 'found' && S.g === 'freecell') return nope([id], 'Kort som ligger på ess-högarna stannar där i FreeCell.');
      if (k === 'found' && S.g === 'spider') return nope([id], 'Den sviten är klar.');
      if (k === 'waste' || k === 'found') return nope([id], 'Bara det översta kortet kan flyttas.');
      if (S.g === 'spider') return nope([id], 'Bara kort i samma färg som ligger i ordning kan flyttas tillsammans.');
      return nope([id], 'Bara kort som ligger i ordning (omväxlande röd och svart) kan flyttas tillsammans.');
    }
    if (Settings.tap === 'select') return select(pile, n);
    const to = bestTarget(S, pile, n);
    if (to < 0) return explainNoTarget(S, pile, n);
    Game.move([{t: 'm', f: pile, n, to}]);
  };

  // Ett kort som flyttas ned från ess-högen men genast skulle läggas upp igen av sig självt: säg det i stället
  function bounces(S, f, n, to) {
    if (Engine.kind(S, f) !== 'found' || Settings.auto === 'off') return false;
    const card = S.p[f][S.p[f].length - n], T = Hint.play(S, [{t: 'm', f, n, to}], Settings.auto);
    const at = T.p.findIndex(a => a.includes(card));
    return at >= 0 && Engine.kind(T, at) === 'found';
  }
  function move(S, f, n, to) {
    if (bounces(S, f, n, to)) { nope([], 'Kortet behövs inte i kolumnerna, så det skulle bara läggas upp igen av sig självt.'); return false; }
    Game.move([{t: 'm', f, n, to}]);
    return true;
  }

  function pyramidTap(S, pile) {
    const PY = Engine.GAMES.pyramid;
    const c = Engine.top(S, pile);
    if (Engine.kind(S, pile) === 'found') return;
    if (!Engine.canPick(S, pile, 1)) { clearSel(); return nope([c], 'Det kortet är täckt av kort i raden under. Det blir fritt när de är borta.'); }
    if (Cards.rank(c) === 13) { clearSel(); return Game.move(PY.pair(pile)); }
    if (sel && sel.pile === pile) return clearSel();
    let switched = false;
    if (sel) {
      if (Engine.ok(S, sel.pile, 1, pile)) { const s = sel; clearSel(); return Game.move(PY.pair(s.pile, pile)); }
      // de blir inte 13: det nya kortet är det man vill prova, så det väljs i stället (och paras inte ihop direkt)
      clearSel();
      switched = true;
    }
    const partners = PY.avail(S).filter(i => i !== pile && Cards.rank(Engine.top(S, i)) + Cards.rank(c) === 13);
    if (!partners.length) {
      Table.shake([c]);
      return UI.toast(`Det finns inget fritt kort som blir 13 tillsammans med ${cn(c)} just nu. ${Cards.Name(c)} behöver ${Cards.aRank(13 - Cards.rank(c))}.`, {kind: 'nope'});
    }
    if (Settings.tap === 'move' && partners.length === 1 && !switched) return Game.move(PY.pair(pile, partners[0]));
    select(pile, 1, partners);
  }

  function tripeaksTap(S, pile) {
    const c = Engine.top(S, pile);
    if (Engine.kind(S, pile) !== 'slot') return;
    if (!Engine.canPick(S, pile, 1)) return nope([c], 'Det kortet är täckt. Det vänds upp när korten som ligger på det är borta.');
    if (Engine.ok(S, pile, 1, 1)) return Game.move([{t: 'm', f: pile, n: 1, to: 1}]);
    nope([c], Engine.canMove(S, pile, 1, 1));
  }

  /* ---------- Drag ---------- */
  P.drop = (f, n, to) => {
    const S = S_();
    if (!S || Game.busy()) return false;
    hideHint();
    clearSel();
    if (S.g === 'pyramid') {
      const PY = Engine.GAMES.pyramid;
      if (!Engine.ok(S, f, 1, to)) return false;
      Game.move(Engine.kind(S, to) === 'found' ? PY.pair(f) : PY.pair(f, to));
      return true;
    }
    if (!Engine.ok(S, f, n, to)) return false;
    return move(S, f, n, to);
  };
  // Draget gick inte: förklara varför (om kortet släpptes på en hög)
  P.bad = (f, n, to) => {
    const S = S_();
    if (!S) return;
    const c = S.p[f][S.p[f].length - n];
    if (S.g === 'klondike' && n === 1 && Cards.rank(c) === 1 && Engine.kind(S, to) === 'tab') return nope([], 'Ess läggs upp på ess-högarna. Tryck på esset så flyttas det dit.');
    const why = Engine.canMove(S, f, n, to);
    if (why !== true) nope([], why);
  };
  P.pick = () => { hideHint(); clearSel(); };

  // Tryck på talongen
  P.stock = () => {
    const S = S_();
    if (!S || Game.busy()) return;
    const keep = hint && hint.until != null ? hint : null;
    hideHint();
    clearSel();
    const r = Engine.stockTap(S);
    if (r.ops) { Game.move(r.ops); if (keep) followStock(keep); return; }
    nope([], r.why);
  };
  // Tipset "vänd upp kort tills X ligger överst": talongen fortsätter att lysa tills X ligger överst
  function followStock(h0) {
    const S = S_();
    if (!S) return;
    const c = h0.until, w = S.p[1];
    if (w.length && w[w.length - 1] === c) {
      if (h0.toast) h0.toast.remove();
      hint = {text: h0.text};
      Table.mark({hint: new Set([c])});
      Table.nudge([c]);
      return;
    }
    // kortet har lämnat talongen och de vända korten (t.ex. lagts upp av sig självt): tipset gäller inte längre
    if (!S.p[0].includes(c) && !w.includes(c)) { if (h0.toast) h0.toast.remove(); return; }
    hint = h0;
    Table.mark({hintTo: 0});
    if (!h0.toast || !h0.toast.isConnected) h0.toast = UI.toast(`Vänd upp fler kort tills ${cn(c)} ligger överst.`, {kind: 'hint'});
  }
  // Tryck på en tom plats eller bordet
  P.pile = i => {
    const S = S_();
    if (!S || Game.busy()) return;
    if (sel && i >= 0 && Engine.ok(S, sel.pile, sel.n, i)) { const s = sel; clearSel(); return move(S, s.pile, s.n, i); }
    if (sel && i >= 0) { const why = Engine.canMove(S, sel.pile, sel.n, i); clearSel(); if (why !== true) return nope([], why); }
    clearSel();
    hideHint();
  };

  /* ---------- Tips ---------- */
  function hideHint() { if (hint) { hint = null; Table.mark({}); UI.toastsTop(null); } }
  P.hideHint = hideHint;
  P.hint = async () => {
    const S = S_();
    if (!S || Game.busy() || thinking) return;
    clearSel();
    Game.noteHint();
    Sound.play('hint');
    // lösaren räknar i en egen tråd (HintWork): dröjer det visas att det tänks
    const bar = $('bar'); bar && bar.classList.add('thinking');
    let note = null;
    const noteTimer = setTimeout(() => { note = UI.toast('Letar efter ett bra drag …', {ms: 20000, kind: 'slow'}); }, 300);
    thinking = true;
    let r;
    try { r = await HintWork.smart(S, Settings.auto); }
    finally { thinking = false; clearTimeout(noteTimer); if (note) note.remove(); bar && bar.classList.remove('thinking'); }
    // (har något hänt under tiden gäller tipset inte längre)
    if (S_() !== S) return;
    if (!r.ops) {
      if (r.stuck || r.lost) return Game.stuckSheet(r.lost ? 'lost' : 'stuck');
      return UI.toast(r.text || 'Inget tips just nu.');
    }
    // går det inte att vinna längre: rutan med "Ångra tills det går att vinna" i stället för tipset
    if (r.lost && Game.noteLost()) return;
    showHint(S, r);
  };
  // Visar ett tips på bordet: kortet lyser och gungar, målet får en guldram och en pil, texten visas och läses upp
  function showHint(S, r) {
    hint = r;
    const op = r.ops[0];
    if (op.t === 'm') {
      const a = S.p[op.f], ids = a.slice(a.length - op.n);
      const hl = new Set(ids);
      let to = op.to;
      if (S.g === 'pyramid' && r.ops[1]) { hl.add(Engine.top(S, r.ops[1].f)); to = -1; }
      // Idioten: kortet som ska slängas lyser, och det högre kortet i samma färg (skälet) får en guldram, ingen pil
      if (S.g === 'aces' && op.to === 1) {
        const c = ids[0], A = Engine.GAMES.aces;
        const why = [2, 3, 4, 5].map(i => Engine.top(S, i)).find(t => t != null && t !== c && Cards.suit(t) === Cards.suit(c) && A.val(t) > A.val(c));
        Table.mark({hint: hl, why: new Set(why != null ? [why] : [])});
      } else Table.mark({hint: hl, hintTo: S.g === 'pyramid' && r.ops.length === 1 ? 2 : to});
      Table.nudge(ids);
    } else {
      // talongen
      const st = S.p[0];
      if (st.length) Table.nudge([st[st.length - 1]]);
      Table.flashPile(0);
      Table.mark({hintTo: 0});
    }
    // täcker notisen (nederst) tipsets kort visas den överst i stället
    placeToasts(r);
    hint.toast = UI.toast(r.text, {kind: 'hint'});
    Voice.say(r.text);
  }

  /* ---------- Visa hur man spelar ---------- */
  // Spelet gör några drag själv, långsamt: varje drag visas först som ett tips (och läses upp), sedan görs det.
  // Ett tryck var som helst tar över. Dragen är vanliga drag (de går att ångra) och räknas som tips.
  let demo = null;
  P.demoRunning = () => !!demo;
  P.stopDemo = () => { if (demo) demo.stop = true; };
  P.demo = async (n = 4) => {
    if (demo || !S_() || Engine.won(S_())) return 0;
    const run = demo = {stop: false};
    clearSel(); hideHint();
    const veil = h('div', {class: 'demoveil', role: 'button', 'aria-label': 'Ta över'}, h('div', {class: 'demobanner'}, UI.iconEl('play'), h('span', {}, 'Spelet visar hur man gör. Tryck för att ta över.')));
    veil.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); run.stop = true; });
    $('scrTable').append(veil);
    document.body.classList.add('demoing');
    // raden står över knapparna (de används inte under visningen), på en liggande telefon över raden överst,
    // så att den inte täcker några kort
    const G = Table.geo();
    if (G) {
      veil.classList.add(G.side ? 'side' : 'bottom');
      veil.style.setProperty('--demo-top', (G.sa.t + 3) + 'px');
      veil.style.setProperty('--demo-bottom', (G.sa.b + Math.max(6, (G.barH - 52 * G.ui) / 2)) + 'px');
      veil.style.setProperty('--demo-h', Math.max(40, G.hudH - 6) + 'px');
    }
    const wait = async ms => { const t0 = performance.now(); while (!run.stop && performance.now() - t0 < ms) await sleep(50); };
    let done = 0;
    try {
      for (let i = 0; i < n && !run.stop; i++) {
        for (let k = 0; k < 100 && Game.busy() && !run.stop; k++) await sleep(50);
        const S = S_();
        if (run.stop || !S || Engine.won(S) || UI.sheetOpen()) break;
        const r = await HintWork.smart(S, Settings.auto);
        if (run.stop || S_() !== S || !r.ops || r.lost) break;
        Game.noteHint();
        Sound.play('hint');
        showHint(S, r);
        // tid att titta (och lyssna) innan draget görs: längre i lugnt tempo
        await wait(2600 * Math.max(1, Time.speed()));
        if (run.stop || S_() !== S) break;
        hideHint();
        Game.move(r.ops);
        done++;
        await wait(700 * Math.max(1, Time.speed()));
      }
    } finally {
      demo = null;
      veil.remove();
      document.body.classList.remove('demoing');
      hideHint();
    }
    if (S_() && !Engine.won(S_()) && !UI.sheetOpen()) UI.toast(done ? 'Nu är det din tur!' : 'Du tar över.', {kind: 'hint'});
    return done;
  };
  function placeToasts(r) {
    const G = Table.geo(), S = S_();
    if (!G || !S || !r.ops) return UI.toastsTop(null);
    const op = r.ops[0], ids = [];
    if (op.t === 'm') { const a = S.p[op.f]; ids.push(...a.slice(a.length - op.n)); const t = Engine.top(S, op.to); if (t != null) ids.push(t); }
    const low = ids.reduce((m, id) => { const p = Table.where(id); return p ? Math.max(m, p.y + G.ch) : m; }, 0);
    // (notiserna står ungefär 90 px ovanför knapparna)
    UI.toastsTop(low > G.y1 - 90 * G.ui ? G.sa.t + G.hudH + 10 : null);
  }
  // Tangentbordet: mellanslag vänder talongen, Ctrl+Z ångrar, T/H ger tips
  document.addEventListener('keydown', e => {
    if (UI.sheetOpen() || !Game.active() || $('scrTable').hidden) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); Game.undo(); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); P.stock(); }
    else if (e.key.toLowerCase() === 't' || e.key.toLowerCase() === 'h') P.hint();
  });
  return P;
})();

/* ---- 08b-coach.js ---- */
/* ================= Coachen: korta förklaringar första gången ================= */
// Första gångerna visas en liten pratbubbla som förklarar hur man gör på skärmen. Varje förklaring visas en gång
// (sparas på enheten) och bara när "Hjälp och förklaringar" är på. Bubblan täcker inte korten man behöver.
const Coach = (() => {
  const C = {};
  const seen = Object.assign({}, Store.get('coach', {}));
  let bubble = null, bubbleKey = '';
  const TIPS = {
    start: {anchor: 'table', text: 'Tryck på ett kort så flyttas det dit det passar. Du kan också dra korten med fingret.'},
    startPyr: {anchor: 'table', text: 'Tryck på två kort som tillsammans blir 13 så plockas de bort. En kung plockas bort ensam.'},
    startTp: {anchor: 'table', text: 'Tryck på ett öppet kort som är ett högre eller ett lägre än kortet på slänghögen.'},
    startAces: {anchor: 'table', text: 'Tryck på ett kort för att slänga det. Det går när ett högre kort i samma färg ligger överst i en annan hög. Ess är högst.'},
    stock: {anchor: 'stock', text: 'Tryck på talongen (högen med baksidor) för att vända upp nya kort.'},
    // (i Idioten och Spindelharpan delas korten ut i stället: den texten ersätter den vanliga)
    stockAces: {anchor: 'stock', text: 'Tryck på talongen (högen med baksidor) när du vill ha fler kort. Då delas fyra nya kort ut, ett på varje hög.'},
    stockSpider: {anchor: 'stock', text: 'Tryck på talongen (högen med baksidor) för att dela ut en ny rad: ett kort på varje kolumn.'},
    undo: {anchor: 'bar', text: 'Ångra tar tillbaka det senaste draget. Du kan ångra hur många gånger du vill.'},
    idle: {anchor: 'bar', text: 'Vet du inte vad du ska göra? Tryck på Tips så visas ett bra drag.'},
    finish: {anchor: 'bar', text: 'Nu ligger alla kort öppna! Tryck på ”Lägg upp alla” så läggs resten upp.'},
    cell: {anchor: 'table', text: 'Kortet ligger nu i en fri cell. Där får bara ett kort ligga åt gången, så använd cellerna sparsamt.'},
    rotate: {anchor: 'table', text: 'Vrid gärna telefonen, så blir korten större.'}
  };
  C.off = false;   // (för automatiska tester)
  C.show = (key, extra = '') => {
    if (C.off || !Settings.hints || seen[key] || !TIPS[key] || bubble) return false;
    seen[key] = true;
    Store.set('coach', seen);
    // (extra: en annan förklaring som läggs till i samma bubbla)
    show(key, extra && TIPS[extra] ? Object.assign({}, TIPS[key], {text: TIPS[key].text + ' ' + TIPS[extra].text}) : TIPS[key]);
    return true;
  };
  C.reset = () => { Object.keys(seen).forEach(k => delete seen[k]); Store.set('coach', seen); };
  C.hide = () => hide();
  // Anropas vid olika tillfällen
  C.check = what => {
    const S = Game.state();
    if (!S) return;
    if (what === 'start') {
      // små kort på en stående telefon: tipsa om att vrida den (en gång)
      const G = Table.geo(), small = !!(G && G.portrait && G.cw < 46 && !seen.rotate);
      const k = S.g === 'pyramid' ? 'startPyr' : S.g === 'tripeaks' ? 'startTp' : S.g === 'aces' ? 'startAces' : 'start';
      if (C.show(k, small ? 'rotate' : '')) { if (small) { seen.rotate = true; Store.set('coach', seen); } }
      else if (small) C.show('rotate');
    }
    else if (what === 'undo') { if (bubbleKey === 'undo') hide(); }
    else if (what === 'idle') C.show('idle');
    else if (what === 'finish') { hide(); C.show('finish'); }
  };
  // Efter ett drag: stäng förklaringen om den är gjord, och visa nästa
  C.moved = (before, ops) => {
    if (bubble && ['start', 'startPyr', 'startTp', 'startAces'].includes(bubbleKey)) hide();
    if (bubble && bubbleKey.startsWith('stock') && ops.some(o => o.t === 'd' || o.t === 'D')) hide();
    if (bubble && (bubbleKey === 'idle' || bubbleKey === 'rotate' || bubbleKey === 'cell')) hide();
    const S = Game.state();
    if (!S) return;
    // FreeCell: första gången ett kort hamnar i en fri cell
    if (S.g === 'freecell' && ops.some(o => o.t === 'm' && Engine.kind(before, o.to) === 'cell') && C.show('cell')) return;
    const info = Game.info();
    // efter några drag: talongen och ångra
    if (info && info.log.length === 2 && S.p[0] && S.p[0].length && S.g !== 'freecell') C.show(S.g === 'aces' ? 'stockAces' : S.g === 'spider' ? 'stockSpider' : 'stock');
    else if (info && info.log.length === 6) C.show('undo');
  };
  function show(key, t) {
    const root = $('scrTable');
    if (!root || root.hidden) return;
    // de första förklaringarna vid en ny patiens erbjuder också en visning ("Visa mig")
    const canDemo = ['start', 'startPyr', 'startTp', 'startAces'].includes(key);
    bubble = h('div', {class: 'coach', role: 'status'}, h('p', {}, t.text), h('div', {class: 'coachbtns'},
      canDemo ? h('button', {type: 'button', class: 'btn small', onclick: () => { Sound.play('click'); hide(); Play.demo(4); }}, 'Visa mig') : null,
      h('button', {type: 'button', class: 'btn small gold', onclick: () => { Sound.play('click'); hide(); }}, 'Jag förstår')));
    bubbleKey = key;
    root.append(bubble);
    place(t.anchor);
    // det bubblan pratar om lyser (talongen)
    if (t.anchor === 'stock') glowStock(true);
    requestAnimationFrame(() => bubble && bubble.classList.add('on'));
  }
  function glowStock(on) {
    const S = Game.state();
    document.querySelectorAll('.card.coachglow').forEach(e => e.classList.remove('coachglow'));
    document.querySelectorAll('.zone.coachglow').forEach(e => e.classList.remove('coachglow'));
    if (!on || !S) return;
    const st = S.p[0];
    if (st && st.length) { const el = Table.el(st[st.length - 1]); if (el) el.classList.add('coachglow'); }
    else { const z = document.querySelector('.zone.stockzone'); if (z) z.classList.add('coachglow'); }
  }
  // Bubblan står längst ned, ovanför knapparna (där det är tomt i början), så att den inte täcker korten.
  // Det den handlar om lyser i stället (talongen).
  function place(anchor) {
    if (!bubble) return;
    const G = Table.geo(), S = Game.state();
    if (!G || !S) return;
    const w = Math.min((G.side ? 330 : 380) * Math.min(G.ui, 1.25), G.W - 24);
    bubble.style.width = w + 'px';
    const bh = bubble.offsetHeight || 120;
    // platser att välja mellan: längst ned, överst och i mitten, till vänster, i mitten och till höger
    // (också allra överst, över raden med menyn: den behövs inte medan man läser)
    const xs = [G.x0 + G.w / 2, G.x0 + w / 2 + 4, G.x1 - w / 2 - 4], ys = [G.y1 - bh - 8, G.y0 + 4, G.y0 + (G.h - bh) / 2, G.sa.t + 4];
    // det som inte bör täckas: öppna kort (och talongen med de vända korten, som är viktigast)
    const rects = [];
    S.p.forEach((a, i) => a.forEach(id => { const p = Table.where(id); if (p && p.up) rects.push([p.x, p.y, G.cw, G.ch, 1]); }));
    [0, 1].forEach(i => { const gp = G.piles[i]; if (gp) rects.push([gp.x, gp.y, G.cw, G.ch, 6]); });
    let best = null;
    for (const y of ys) for (const x of xs) {
      const L = x - w / 2, T = y;
      let cost = 0;
      for (const [rx, ry, rw, rh, wt] of rects) cost += wt * Math.max(0, Math.min(L + w, rx + rw) - Math.max(L, rx)) * Math.max(0, Math.min(T + bh, ry + rh) - Math.max(T, ry));
      if (!best || cost < best.cost - 1) best = {x, y, cost};
    }
    const x = clamp(best.x, w / 2 + 12, G.W - w / 2 - 12);
    const y = clamp(best.y, G.sa.t + 4, Math.max(G.sa.t + 4, G.H - bh - 8));
    Object.assign(bubble.style, {left: x + 'px', top: y + 'px'});
  }
  function hide() {
    const b = bubble;
    glowStock(false);
    bubble = null; bubbleKey = '';
    if (!b) return;
    b.classList.remove('on');
    setTimeout(() => b.remove(), 250);
  }
  Bus.on('table-layout', () => { if (bubble) { const k = bubbleKey; place(TIPS[k] && TIPS[k].anchor); } });
  return C;
})();

/* ---- 10-winfx.js ---- */
/* ================= Vinsten: korten studsar ut över bordet ================= */
// Som i den gamla datorpatiensen: korten hoppar ett i taget från ess-högarna, studsar mot bordskanten och lämnar
// spår efter sig. Tryck var som helst för att gå vidare. Med "Lugna animationer" (eller när datorn ber om mindre
// rörelse) blir det i stället ett lugnt sken.
const WinFx = (() => {
  const W = {};
  let img = null, imgKey = '';

  // En bild med alla 52 framsidor (13 kolumner, 4 rader) i den storlek korten har på bordet
  async function sheet(cw, ch) {
    const dpr = 1;
    const key = [cw, ch, dpr, Settings.letters, Settings.fourColor].join(':');
    if (img && imgKey === key) return img;
    const markup = Art.markup({fourColor: Settings.fourColor, letters: Settings.letters});
    const inner = markup.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
    let uses = '';
    for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) { const ref = Art.faceRef(s * 13 + r - 1); uses += `<use href="#${ref}" xlink:href="#${ref}" x="${(r - 1) * 250}" y="${s * 350}" width="250" height="350"/>`; }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${Math.round(13 * cw * dpr)}" height="${Math.round(4 * ch * dpr)}" viewBox="0 0 3250 1400">${inner}${uses}</svg>`;
    const im = new Image();
    await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); setTimeout(() => rej(new Error('tog för lång tid')), 6000); });
    const c = document.createElement('canvas');
    c.width = Math.round(13 * cw * dpr); c.height = Math.round(4 * ch * dpr);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    img = c; imgKey = key;
    return img;
  }

  // Vilka kort som hoppar och varifrån: de översta korten på ess-högarna (eller de bortplockade)
  function launchList(S) {
    const P = Engine.piles(S);
    const piles = [];
    P.forEach((p, i) => { if ((p.k === 'found' || (S.g === 'tripeaks' && p.k === 'waste')) && S.p[i].length) piles.push(i); });
    const out = [];
    const tops = piles.map(i => S.p[i].slice());
    let guard = 0;
    while (out.length < 52 && tops.some(a => a.length) && guard++ < 400) {
      tops.forEach((a, k) => { if (a.length && out.length < 52) out.push({id: a.pop(), pile: piles[k]}); });
    }
    return out;
  }

  W.run = S => new Promise(async resolve => {
    const G = Table.geo();
    if (!G || Settings.calmFx || reduceMotion || Time.scale === 0) { if (G) glow(); setTimeout(resolve, Time.scale === 0 ? 0 : 900); return; }
    let sprite;
    try { sprite = await sheet(G.cw, G.ch); } catch (e) { console.error(e); glow(); setTimeout(resolve, 900); return; }
    const dpr = Math.min(2, devicePixelRatio || 1);
    const cv = h('canvas', {class: 'winfx'});
    const note = h('div', {class: 'winnote'}, 'Tryck för att fortsätta');
    const wrap = h('div', {class: 'winwrap'}, cv, note);
    document.body.append(wrap);
    const Wd = innerWidth, Hd = innerHeight;
    cv.width = Math.round(Wd * dpr); cv.height = Math.round(Hd * dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    // lugnt läge: färre kort och en kortare stund
    const calm = !!Settings.calm;
    const list = calm ? launchList(S).slice(0, 12) : launchList(S);
    const rootRect = $('scrTable').getBoundingClientRect();
    let active = [], next = 0, lastLaunch = 0, done = false, lastBounce = 0, raf = 0;
    const sw = sprite.width / 13, sh = sprite.height / 4;
    const draw = c => {
      const s = Cards.suit(c.id), r = Cards.rank(c.id);
      ctx.drawImage(sprite, (r - 1) * sw, s * sh, sw, sh, c.x, c.y, G.cw, G.ch);
    };
    const finish = () => {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      wrap.classList.add('out');
      list.forEach(c => { const el = Table.el(c.id); if (el) el.style.visibility = ''; });
      setTimeout(() => wrap.remove(), 500);
      resolve();
    };
    wrap.addEventListener('pointerdown', finish);
    setTimeout(finish, calm ? 7000 : 16000);
    const step = t => {
      if (done) return;
      if (next < list.length && t - lastLaunch > (calm ? 320 : 170)) {
        const L = list[next++];
        const r = Table.cardRect(L.id);
        const el = Table.el(L.id);
        if (el) el.style.visibility = 'hidden';
        const dir = Math.random() < .5 ? -1 : 1;
        active.push({id: L.id, x: (r ? r.x : Wd / 2) + rootRect.left, y: (r ? r.y : 40) + rootRect.top, vx: dir * (2.2 + Math.random() * 5.5) * (Wd / 900 + .4), vy: -(Math.random() * 7 + 1)});
        lastLaunch = t;
      }
      const g = .45 * Math.max(.7, Hd / 900);
      active = active.filter(c => {
        c.vy += g; c.x += c.vx; c.y += c.vy;
        if (c.y + G.ch > Hd) {
          c.y = Hd - G.ch;
          c.vy = -c.vy * (.72 + Math.random() * .12);
          if (t - lastBounce > 90) { Sound.play('bounce'); lastBounce = t; }
        }
        draw(c);
        return c.x > -G.cw && c.x < Wd;
      });
      if (next >= list.length && !active.length) { setTimeout(finish, 600); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  });

  // Lugnt: ess-högarna lyser en stund
  function glow() {
    document.querySelectorAll('#zones .z-found').forEach(z => { z.classList.add('won'); setTimeout(() => z.classList.remove('won'), 2500); });
    const S = Game.state();
    if (!S) return;
    Engine.piles(S).forEach((p, i) => { if (p.k === 'found' && S.p[i].length) Table.nudge([S.p[i][S.p[i].length - 1]]); });
  }
  return W;
})();

/* ---- 11-hud.js ---- */
/* ================= Raden överst och knapparna ================= */
// Överst: menyknappen, patiensens namn och givens nummer, antal drag och tiden, och en tunn guldlinje som visar
// hur mycket som är klart. Längst ned (eller till höger på en liggande telefon): Ångra, Tips och Ny giv, och
// "Lägg upp alla" när resten kan läggas upp av sig själv. Knapparna har alltid text, inte bara bilder.
const HudBar = (() => {
  const H = {};
  let clockEl = null, movesEl = null;
  // ett dubbeltryck på en knapp räknas som ett tryck (knapparna ritas om efter varje drag, därför efter namn)
  let lastBtn = {label: '', t: -1e9};
  const once = (label, fn) => () => { const now = performance.now(); if (lastBtn.label === label && now - lastBtn.t < 350) return; lastBtn = {label, t: now}; fn(); };

  H.render = () => {
    const S = Game.state(), cur = Game.info(), G = Table.geo();
    const hud = $('hud'), bar = $('bar');
    if (!S || !cur || !G) return;
    // raden överst
    hud.textContent = '';
    const menu = h('button', {class: 'hudbtn', type: 'button', 'aria-label': 'Meny', html: UI.icon('menu') + '<span>Meny</span>'});
    menu.onclick = () => { Sound.unlock(); Sound.play('click'); Play.hideHint(); Game.menu(); };
    const variant = Game.variant(S.g, S.o);
    const easy = S.g === 'klondike' && Deals.easy && Deals.easy(S.g, S.o, S.seed);
    // (i lugnt läge står givens nummer i menyn i stället)
    const title = h('div', {class: 'hudtitle'}, h('b', {}, Game.NAMES[S.g]), h('span', {}, [cur.race ? 'tävling' : cur.daily ? dailyLabel(cur.daily) : '', variant, Settings.calm ? '' : (easy ? 'lätt giv ' : 'giv ') + fmt(S.seed)].filter(Boolean).join(' · ')));
    const stats = h('div', {class: 'hudstats'});
    movesEl = h('span', {class: 'hs', title: 'Antal drag'}, h('b', {}, String(S.moves)), ' drag');
    clockEl = h('span', {class: 'hs clock', title: 'Tid'}, UI.iconEl('clock'), h('b', {}, fmtTime(Game.elapsed())));
    if (Settings.moves) stats.append(movesEl);
    if (Settings.clock) stats.append(clockEl);
    const [done, total] = Engine.count(S);
    const prog = h('div', {class: 'hudprog', style: {'--p': (done / total * 100).toFixed(1) + '%'}, title: `${done} av ${total} kort klara`});
    hud.append(menu, title, stats, prog);
    // knapparna
    bar.textContent = '';
    bar.classList.toggle('side', G.side);
    const finish = Game.canFinish();
    const add = (label, icon, fn, o = {}) => { const b = UI.btn(label, once(label, fn), {icon, cls: 'bbtn ' + (o.cls || ''), disabled: o.disabled}); bar.append(b); return b; };
    if (finish) add('Lägg upp alla', 'finish', () => Game.finish(), {cls: 'gold glow'});
    add('Ångra', 'undo', () => { Play.hideHint(); Game.undo(); }, {disabled: !Game.canUndo()});
    add('Tips', 'bulb', () => Play.hint(), {cls: finish ? '' : 'tipbtn'});
    if (cur.race) add('Ställning', 'chart', () => Lobby.standings());
    // (på en smal telefon får fyra knappar inte plats: Ny giv finns ju också i menyn)
    else if (!finish || (!G.side && G.W >= 480)) add('Ny giv', 'newdeal', () => Game.newDeal());
    place();
  };
  // knapparnas plats enligt bordets geometri
  function place() {
    const G = Table.geo(), bar = $('bar');
    if (!G) return;
    if (G.side) Object.assign(bar.style, {left: (G.W - G.sa.r - G.barW) + 'px', top: (G.sa.t + G.hudH) + 'px', width: G.barW + 'px', height: (G.H - G.sa.t - G.sa.b - G.hudH) + 'px', bottom: ''});
    else Object.assign(bar.style, {left: G.sa.l + 'px', top: (G.H - G.sa.b - G.barH) + 'px', width: (G.W - G.sa.l - G.sa.r) + 'px', height: G.barH + 'px', bottom: ''});
    $('hud').style.height = (G.sa.t + G.hudH) + 'px';
    document.body.style.setProperty('--ui', G.ui.toFixed(3));
    document.body.style.setProperty('--toast-bottom', (G.side ? G.sa.b + 16 : G.sa.b + G.barH + 12) + 'px');
  }
  Bus.on('table-layout', () => { if (Game.active()) place(); });
  H.clock = () => { if (clockEl && Game.active()) { const b = clockEl.querySelector('b'); if (b) b.textContent = fmtTime(Game.elapsed()); } };
  return H;
})();

/* ---- 12-game.js ---- */
/* ================= Spelet: en giv från början till slut ================= */
// Håller reda på given som spelas: vilken patiens, givens nummer och alla drag (för att ångra och för att spara).
// Varje drag sparas direkt, så att patiensen finns kvar om man stänger sidan. Här finns också tiden, statistiken,
// vinsten och hjälpen när det tar stopp.
const Game = (() => {
  const G = {};
  let cur = null;          // {g, o, seed, log, t, won, daily, hints, undos, moved, id}
  let S = null;
  let busyUntil = 0, finishing = false, tick = 0, runFrom = 0, stuckKey = '', stuckTimer = 0, idleTimer = 0;
  let lostKnown = '';

  G.state = () => S;
  G.info = () => cur;
  G.active = () => !!cur;
  G.busy = () => finishing || performance.now() < busyUntil;

  // namnet på patiensen och varianten, t.ex. "Harpan" och "dra 3"
  G.NAMES = {klondike: 'Harpan', spider: 'Spindelharpan', freecell: 'FreeCell', pyramid: 'Pyramiden', tripeaks: 'Tre toppar', aces: 'Idioten'};
  G.variant = (g, o) => {
    if (g === 'klondike') return (o.draw === 3 ? 'dra 3' : 'dra 1') + (o.passes === 1 ? ', ett varv' : o.passes === 3 ? ', tre varv' : '');
    if (g === 'spider') return o.suits === 1 ? 'en färg' : o.suits === 2 ? 'två färger' : 'fyra färger';
    if (g === 'pyramid') return o.passes === 0 ? 'obegränsat med varv' : o.passes === 1 ? 'ett varv' : '';
    return '';
  };

  /* ---------- Tiden ---------- */
  const running = () => cur && cur.moved && !cur.won && !document.hidden && Menu.screen() === 'table' && !UI.sheetOpen();
  function clock() {
    if (!cur) return;
    const now = performance.now();
    if (runFrom) { cur.t += now - runFrom; runFrom = 0; }
    if (running()) runFrom = now;
  }
  G.elapsed = () => { if (!cur) return 0; clock(); return cur.t; };
  setInterval(() => { if (cur && Menu.screen() === 'table') { clock(); HudBar.clock(); } }, 1000);
  document.addEventListener('visibilitychange', () => { clock(); if (document.hidden) save(); });
  Bus.on('sheets', () => clock());

  /* ---------- Spara ---------- */
  function save() {
    if (!cur) return;
    clock();
    if (cur.won || !cur.moved) { if (cur.won) Store.del('game'); else Store.set('game', cur); return; }
    Store.set('game', cur);
  }
  const valid = s => !!(s && s.g && Engine.GAMES[s.g] && !s.won);
  // Vanliga givar som fick vänta medan man tävlade (de tre senaste). De tas bara bort när man själv väljer bort dem
  // eller fortsätter dem.
  const pausedList = () => { const p = Store.get('paused', null); return (Array.isArray(p) ? p : p ? [p] : []).filter(valid); };
  const setPaused = list => { if (list.length) Store.set('paused', list.slice(-3)); else Store.del('paused'); };
  G.paused = () => pausedList();
  G.dropPaused = id => setPaused(pausedList().filter(p => p.id !== id));
  G.saved = () => {
    const s = Store.get('game', null);
    if (valid(s)) return s;
    const p = pausedList();
    return p.length ? p[p.length - 1] : null;
  };
  G.save = save;

  /* ---------- Starta ---------- */
  // En ny giv. o: patiensens val. seed: givens nummer (annars väljs en), daily: dagens datum för dagens patiens.
  G.start = (g, o, {seed = null, daily = null, same = false, race = null} = {}) => {
    const oo = Engine.opts(g, o || {});
    if (seed == null) seed = Deals.pick(g, oo, ['easy', 'win', 'any'].includes(Settings.deals) ? Settings.deals : 'win');
    // en tävlingsgiv tar inte bort en påbörjad vanlig giv: den väntar tills man kommer tillbaka
    const was = Store.get('game', null);
    if (race && valid(was) && !was.race && was.log && was.log.length) setPaused([...pausedList().filter(p => p.id !== was.id), was]);
    endCurrent();
    cur = {g, o: oo, seed, log: [], t: 0, won: false, daily, hints: 0, undos: 0, moved: false, id: randId(8), same, race};
    S = Engine.create(g, oo, seed);
    Store.set('last', {g, o: oo});
    enter(true);
    save();
  };
  // Fortsätt en sparad giv
  G.resume = saved => {
    try {
      // en annan pågående giv med drag försvinner inte: den läggs åt sidan (och syns på startskärmen)
      const other = Store.get('game', null);
      if (valid(other) && other.id !== saved.id && other.log && other.log.length) setPaused([...pausedList().filter(p => p.id !== other.id && p.id !== saved.id), other]);
      endCurrent();
      cur = Object.assign({hints: 0, undos: 0, moved: true, id: randId(8)}, saved);
      G.dropPaused(cur.id);
      // en tävlingsgiv vars rum inte finns längre blir en vanlig patiens
      if (cur.race && !(typeof Race !== 'undefined' && Race.code() === cur.race.code)) delete cur.race;
      S = Engine.replay(cur.g, cur.o, cur.seed, cur.log);
      enter(false);
    } catch (e) { console.error(e); Store.del('game'); if (saved) G.dropPaused(saved.id); cur = null; S = null; UI.toast('Patiensen gick inte att fortsätta.'); Menu.show('title'); }
  };
  function enter(deal) {
    Menu.show('table');
    UI.clearToasts();
    // (en förklaring från förra patiensen hör inte hit)
    Coach.hide();
    Play.reset();
    Hint.forget();
    HintWork.forget();
    Table.clear();
    stuckKey = ''; lostKnown = ''; finishing = false;
    runFrom = 0;
    if (typeof Lobby !== 'undefined') { if (cur.race) Lobby.showStrip(); else Lobby.hideStrip(); }
    const ms = Table.set(S, {deal, fresh: true});
    if (deal) { Sound.play('shuffle'); setTimeout(() => Sound.play('deal'), 500 * Time.speed()); busyUntil = performance.now() + Math.min(ms, 2600); }
    HudBar.render();
    Sound.music();
    Main.keepAwake(true);
    clock();
    setTimeout(() => { if (cur) { Coach.check('start'); checkAfter(); } }, deal ? Math.min(ms, 2600) + 200 : 300);
    armIdle();
    HintWork.prefetch(S, Settings.auto);
  }
  // Den pågående given tas bort (statistiken är redan räknad när första draget gjordes)
  function endCurrent() {
    if (cur && cur.moved && !cur.won) { const st = statOf(Engine.statKey(cur.g, cur.o)); st.streak = 0; saveStats(); }
    cur = null; S = null;
    clearTimeout(stuckTimer); clearTimeout(idleTimer);
  }
  G.stop = () => { clock(); save(); cur = null; S = null; Coach.hide(); Main.keepAwake(false); clearTimeout(stuckTimer); clearTimeout(idleTimer); };

  /* ---------- Ett drag ---------- */
  // ops: stegen i draget. Efteråt: det som händer av sig självt (hela sviter, kort som läggs upp automatiskt).
  G.move = ops => {
    if (!cur || cur.won || G.busy()) return false;
    const T = Engine.clone(S), all = ops.slice();
    const before = S;
    Engine.step(T, ops);
    for (let guard = 0; guard < 80; guard++) {
      const more = Engine.after(T);
      if (more.length) { more.forEach(op => Engine.apply(T, op)); all.push(...more); continue; }
      const a = Engine.autoMove(T, Settings.auto);
      if (!a) break;
      Engine.apply(T, a);
      all.push(a);
    }
    cur.log.push(all.map(Engine.pack));
    if (!cur.moved) {
      cur.moved = true;
      const st = statOf(Engine.statKey(cur.g, cur.o));
      if (!cur.same) st.played++;
      saveStats();
    }
    S = T;
    sounds(before, all);
    Play.reset();
    Table.set(S);
    HudBar.render();
    clock();
    save();
    Coach.moved(before, all);
    if (cur.race && typeof Lobby !== 'undefined') { clock(); cur.stuck = false; Lobby.progress(S, cur); }
    Hemma.progress(S, cur);
    if (Engine.won(S)) { win(); return true; }
    checkAfter();
    armIdle();
    HintWork.prefetch(S, Settings.auto);
    return true;
  };

  // Ljuden för ett drag
  function sounds(before, ops) {
    const P = Engine.piles(before);
    let t = 0, ups = 0;
    const B = Engine.clone(before);
    let streak = 0;
    for (const op of ops) {
      if (op.t === 'd') Sound.play(before.g === 'klondike' && before.o.draw === 3 ? 'draw3' : 'draw', t);
      else if (op.t === 'r') Sound.play('recycle', t);
      else if (op.t === 'D') Sound.play('deal', t);
      else if (op.t === 'm') {
        const kt = P[op.to].k, card = B.p[op.f][B.p[op.f].length - op.n];
        const hidBefore = B.d[op.f];
        if (before.g === 'pyramid') { if (ops.length === 2 && op === ops[1]) Sound.play('pair', t); else if (ops.length === 1) Sound.play('up', t, 13); }
        else if (before.g === 'tripeaks') { streak = tpStreak(); Sound.play('streak', t, streak); }
        else if (kt === 'found') { Sound.play(op.n === 13 ? 'suit' : 'up', t + ups * 90, Cards.rank(card)); ups++; }
        else Sound.play('place', t);
        Engine.apply(B, op);
        if (P[op.f].k === 'tab' && B.d[op.f] < hidBefore) Sound.play('flip', t + 120);
        continue;
      }
      Engine.apply(B, op);
    }
  }
  // Tre toppar: hur många kort i rad har lagts på slänghögen utan att talongen vänts?
  function tpStreak() {
    let n = 1;
    for (let i = cur.log.length - 2; i >= 0; i--) { const st = cur.log[i]; if (typeof st[0] === 'string') break; n++; }
    return n;
  }
  G.streak = () => (cur && S && S.g === 'tripeaks') ? (() => { let n = 0; for (let i = cur.log.length - 1; i >= 0; i--) { if (typeof cur.log[i][0] === 'string') break; n++; } return n; })() : 0;

  /* ---------- Ångra ---------- */
  G.canUndo = () => !!(cur && cur.log.length && !cur.won);
  G.undo = () => {
    if (!G.canUndo() || G.busy()) { if (cur && !cur.log.length) UI.toast('Det finns inget att ångra.'); return false; }
    cur.log.pop();
    cur.undos++;
    UI.clearToasts();
    S = Engine.replay(cur.g, cur.o, cur.seed, cur.log);
    Play.reset();
    Table.set(S);
    Sound.play('undo');
    HudBar.render();
    save();
    stuckKey = '';
    if (cur.race && typeof Lobby !== 'undefined') { cur.stuck = false; Lobby.progress(S, cur); }
    Coach.check('undo');
    checkAfter();
    armIdle();
    HintWork.prefetch(S, Settings.auto);
    return true;
  };
  // Ångra tills patiensen går att vinna igen (lösaren räknar). Ger antalet drag som ångrades, eller -1.
  G.undoToWinnable = async () => {
    if (!cur || !cur.log.length) return -1;
    const note = UI.toast('Räknar …', {ms: 20000});
    const me = cur, log = cur.log.slice();
    // i tipsens tråd (skärmen står inte still), annars här i omgångar
    let n = await HintWork.undoSearch({g: cur.g, o: cur.o, seed: cur.seed, log});
    if (n == null) {
      await sleep(40);
      n = -1;
      for (let k = log.length - 1, m = 0; k >= 0 && m < 80; k--) {
        m++;
        const T = Engine.replay(me.g, me.o, me.seed, log.slice(0, k));
        if (Hint.winnable(T, 12000) === true) { n = m; break; }
        if (m % 3 === 0) await sleep(0);
      }
    }
    note.remove();
    // (en annan giv eller nya drag under tiden: gör ingenting, och säg ingenting)
    if (cur !== me || cur.log.length !== log.length) return -2;
    if (n < 0) return -1;
    cur.log = log.slice(0, log.length - n);
    cur.undos += n;
    S = Engine.replay(cur.g, cur.o, cur.seed, cur.log);
    Play.reset();
    Table.set(S);
    Sound.play('undo');
    HudBar.render();
    save();
    stuckKey = ''; lostKnown = '';
    if (cur.race && typeof Lobby !== 'undefined') { cur.stuck = false; Lobby.progress(S, cur, true); }
    return n;
  };
  // Börja om samma giv
  G.restart = () => {
    if (!cur) return;
    const {g, o, seed} = cur;
    cur.log = [];
    S = Engine.create(g, o, seed);
    cur.won = false;
    // samma giv igen räknas inte som en ny patiens i statistiken (om den redan har räknats)
    if (cur.moved) cur.same = true;
    cur.t = 0;
    enter(true);
    save();
  };

  /* ---------- Efter varje drag: klart för att lägga upp allt? Stopp? ---------- */
  function checkAfter() {
    clearTimeout(stuckTimer);
    if (!cur || cur.won) return;
    if (Engine.canFinish(S)) { HudBar.render(); Coach.check('finish'); return; }
    if (!Settings.hints) return;
    const key = Engine.key(S);
    stuckTimer = setTimeout(async () => {
      if (!cur || S == null || Engine.key(S) !== key || stuckKey === key || UI.sheetOpen()) return;
      const T = S;
      const st = await HintWork.stuck(T, Settings.auto);
      // (har något hänt under tiden gäller svaret inte längre)
      if (!cur || S !== T || stuckKey === key || UI.sheetOpen()) return;
      if (st === true) { stuckKey = key; G.stuckSheet('stuck'); }
    }, 700 * Time.pace());
  }
  // Om man inte har gjort något på en stund: påminn om tipsen (en gång)
  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (cur && !cur.won && Menu.screen() === 'table' && !UI.sheetOpen()) Coach.check('idle'); }, 40000);
  }
  G.noteHint = () => { if (cur) { cur.hints++; save(); } };
  // Tipset har märkt att given inte går att vinna härifrån: rutan med "Ångra tills det går att vinna" (en gång per läge).
  // Ger true om rutan visades.
  G.noteLost = () => {
    if (!cur || lostKnown === Engine.key(S) || UI.sheetOpen()) return false;
    lostKnown = Engine.key(S);
    G.stuckSheet('lost');
    return true;
  };

  // Det tar stopp: inga drag som hjälper längre (eller lösaren har visat att det inte går att vinna härifrån)
  G.stuckSheet = kind => {
    if (!cur) return;
    // (listorna med vinnbara givar gäller Harpan med obegränsat antal varv och Pyramiden med minst tre varv)
    const listOk = !(cur.g === 'klondike' && cur.o.passes) && !(cur.g === 'pyramid' && [1, 2].includes(cur.o.passes)) && !(cur.g === 'tripeaks' && cur.o.wrap === false);
    // listan säger: true (går att vinna), false (gick aldrig att vinna) eller null (vet inte)
    const listSays = listOk ? Deals.winnable(cur.g, cur.o, cur.seed) : null;
    const winnable = listSays === true;
    const canSolve = ['klondike', 'freecell', 'pyramid', 'tripeaks', 'aces'].includes(cur.g);
    const race = !!(cur.race && typeof Lobby !== 'undefined');
    const text = kind === 'lost'
      ? 'Datorn har räknat efter: härifrån går patiensen tyvärr inte att vinna, hur man än spelar.'
      : 'Det finns inga drag kvar som hjälper. Så här blir det ibland i patiens.';
    const more = race ? 'Du kan ångra några drag och prova en annan väg, eller ge upp den här given. Då räknas de kort du har klara.'
      : winnable ? 'Den här given går att vinna från början. Ångra några drag och prova en annan väg, eller ta en ny giv.' : 'Du kan ångra några drag och prova en annan väg, spela samma giv igen eller ta en ny giv.';
    const body = h('div', {class: 'stuckbody'}, h('p', {class: 'lead'}, text), h('p', {class: 'muted'}, more));
    const btns = h('div', {class: 'pausemenu'});
    // (bordet syns klart bakom rutan, så att man kan titta på korten själv)
    const sheet = UI.sheet({title: kind === 'lost' ? 'Det går inte längre' : 'Nu tar det stopp', cls: 'small', clear: true, body: h('div', {}, body, btns)});
    // i en tävling får de andra veta att det står still
    if (race && !cur.stuck) { cur.stuck = true; Lobby.progress(S, cur, true); }
    const item = (icon, label, fn, cls = '') => btns.append(UI.btn(label, () => { sheet.close(); fn(); }, {icon, cls: 'wide ' + cls}));
    if (canSolve && cur.log.length && listSays !== false) item('undo', 'Ångra tills det går att vinna', async () => {
      const n = await G.undoToWinnable();
      if (n === -2) return;
      if (n > 0) { UI.clearToasts(); UI.toast(n === 1 ? 'Ett drag ångrades. Nu går det att vinna igen! Tryck på Tips om du vill ha hjälp.' : `${n} drag ångrades. Nu går det att vinna igen! Tryck på Tips om du vill ha hjälp.`, {ms: 6000}); Voice.say('Nu går det att vinna igen.'); }
      else UI.toast('Det gick inte att hitta en väg. Prova samma giv igen eller en ny giv.');
    }, 'gold');
    if (cur.log.length) item('undo', 'Ångra ett drag', () => G.undo());
    if (race) { if (!cur.gaveUp) item('flag', 'Ge upp den här given', () => Lobby.giveUp(true)); }
    else {
      item('restart', 'Spela samma giv igen', () => G.restart());
      item('newdeal', 'Ny giv', () => G.newDeal(true));
    }
    Voice.say(kind === 'lost' ? 'Härifrån går patiensen tyvärr inte att vinna.' : 'Nu tar det stopp.');
  };

  /* ---------- Lägg upp alla ---------- */
  G.canFinish = () => !!(cur && !cur.won && S && Engine.canFinish(S));
  G.finish = async () => {
    if (!G.canFinish() || finishing) return;
    finishing = true;
    HudBar.render();
    Coach.hide();
    const gap = 110 * Time.speed();
    for (let guard = 0; guard < 120 && !Engine.won(S); guard++) {
      const a = Engine.autoMove(S, 'all');
      if (!a) {
        // Harpan: vänd talongen om det behövs
        const tap = Engine.stockTap(S);
        if (!tap.ops) break;
        applyQuiet(tap.ops);
      } else {
        const card = Engine.top(S, a.f);
        applyQuiet([a]);
        Sound.play('up', 0, Cards.rank(card));
      }
      Table.set(S, {ms: 240 * Time.speed()});
      HudBar.render();
      await sleep(gap);
      if (!cur) { finishing = false; return; }
    }
    finishing = false;
    save();
    if (Engine.won(S)) win(); else HudBar.render();
  };
  function applyQuiet(ops) {
    const T = Engine.clone(S);
    Engine.step(T, ops);
    cur.log.push(ops.map(Engine.pack));
    S = T;
  }

  /* ---------- Ny giv ---------- */
  G.newDeal = async (skipAsk = false) => {
    if (!cur) return;
    if (cur.race) return Lobby.standings();
    if (!skipAsk && cur.moved && !cur.won && Settings.confirmNew) {
      const ok = await UI.confirm('Vill du sluta med den här given och ta en ny? Den här given sparas inte.', {title: 'Ny giv', yes: 'Ny giv', no: 'Fortsätt spela'});
      if (!ok) return;
    }
    const {g, o, daily} = cur;
    if (daily) return G.start(g, o);
    G.start(g, o);
  };

  /* ---------- Vinst ---------- */
  async function win() {
    if (!cur || cur.won) return;
    clock();
    cur.won = true;
    const time = cur.t, moves = S.moves;
    // statistik
    const st = statOf(Engine.statKey(cur.g, cur.o));
    st.won++;
    st.streak++;
    st.bestStreak = Math.max(st.bestStreak, st.streak);
    const newTime = st.bestTime == null || time < st.bestTime, newMoves = st.fewest == null || moves < st.fewest;
    if (newTime) st.bestTime = time;
    if (newMoves) st.fewest = moves;
    st.time += time;
    if (cur.daily) Stats.daily[cur.daily] = {g: cur.g, t: time, m: moves};
    saveStats();
    Store.del('game');
    HudBar.render();
    Bus.emit('won', {time, moves});
    if (cur.race && typeof Lobby !== 'undefined') Lobby.progress(S, cur, true);
    Sound.play('win');
    Voice.win();
    await WinFx.run(S);
    if (!cur || !cur.won) return;
    const facts = h('div', {class: 'winfacts'},
      Settings.clock ? h('div', {}, h('b', {}, fmtTime(time)), h('span', {}, 'tid')) : null,
      h('div', {}, h('b', {}, String(moves)), h('span', {}, 'drag')),
      h('div', {}, h('b', {}, String(st.streak)), h('span', {}, st.streak === 1 ? 'vinst i rad' : 'vinster i rad')));
    const notes = [];
    if (st.won > 1 && newTime && Settings.clock) notes.push('Din snabbaste tid hittills!');
    if (st.won > 1 && newMoves && !(newTime && Settings.clock)) notes.push('Ditt minsta antal drag hittills!');
    if (cur.hints) notes.push(cur.hints === 1 ? 'Med ett tips.' : `Med ${cur.hints} tips.`);
    const body = h('div', {class: 'winbody'}, h('div', {class: 'trophy won', html: UI.icon('trophy')}), h('p', {class: 'why'}, cur.g === 'aces' ? 'Patiensen gick ut!' : G.NAMES[cur.g] + ' gick ut!'), facts,
      notes.length ? h('p', {class: 'muted center'}, notes.join(' ')) : null,
      h('p', {class: 'muted center small2'}, `Giv nummer ${fmt(cur.seed)}`));
    const buttons = Hemma.atTable() ? [{label: 'Stäng', cls: 'gold'}] : cur.race ? [{label: 'Ställningen', cls: 'gold', icon: 'chart', onClick: () => Lobby.standings()}] : [
      {label: 'Till menyn', cls: 'ghost', onClick: () => { G.stop(); Menu.show('title'); }},
      {label: 'Ny giv', cls: 'gold', icon: 'newdeal', onClick: () => G.start(cur.g, cur.o)}
    ];
    if (cur.daily) buttons.splice(1, 0, {label: 'Berätta', cls: '', icon: 'share', close: false, onClick: () => Menu.shareDaily(cur.daily, time, moves)});
    UI.sheet({title: 'Grattis!', cls: 'small winsheet', body, buttons, dismiss: false});
    if (!Settings.calmFx && !Settings.calm && !reduceMotion) Main.confetti();
  }
  G.win = win;

  /* ---------- Pausmenyn ---------- */
  G.menu = () => {
    const body = h('div', {class: 'pausemenu'});
    const sheet = UI.sheet({title: 'Meny', cls: 'small', body});
    const item = (icon, label, fn, cls = '') => body.append(UI.btn(label, () => { sheet.close(); fn(); }, {icon, cls: 'wide ' + cls}));
    item('play', 'Fortsätt spela', () => {});
    // vid ett bord på Spelstunden: samma giv som de andra, och Lämna bordet i stället för att byta patiens
    if (Hemma.atTable()) {
      item('help', 'Så spelar man ' + G.NAMES[cur.g], () => Help.show(cur.g));
      item('gear', 'Inställningar', () => Menu.settings());
      soundItem(item);
      item('door', 'Lämna bordet', async () => { if (await UI.confirm('Lämna bordet? De andra spelar vidare.', {yes: 'Lämna', danger: true})) Hemma.send({t: 'leave'}); }, 'danger');
      return;
    }
    if (cur && cur.race) {
      item('chart', 'Ställningen', () => Lobby.standings());
      if (!cur.won && !cur.gaveUp) item('flag', 'Ge upp den här given', () => Lobby.giveUp());
      item('users', 'Till rummet', () => Lobby.open());
      item('help', 'Så spelar man ' + G.NAMES[cur.g], () => Help.show(cur.g));
      item('gear', 'Inställningar', () => Menu.settings());
      soundItem(item);
      return;
    }
    if (cur && !cur.won) item('play', 'Visa hur man spelar', () => Play.demo(4));
    item('newdeal', 'Ny giv', () => G.newDeal());
    item('restart', 'Spela samma giv igen', async () => {
      if (cur && cur.moved && Settings.confirmNew && !(await UI.confirm('Börja om samma giv från början?', {yes: 'Börja om', no: 'Fortsätt spela'}))) return;
      G.restart();
    });
    item('cards', 'Byt patiens', () => { G.stop(); Menu.show('title'); });
    item('help', 'Så spelar man ' + (cur ? G.NAMES[cur.g] : ''), () => Help.show(cur ? cur.g : null));
    item('gear', 'Inställningar', () => Menu.settings());
    item('chart', 'Statistik', () => Menu.stats(cur ? Engine.statKey(cur.g, cur.o) : null));
    soundItem(item);
    if (cur) body.append(h('p', {class: 'muted center small2'}, `${G.NAMES[cur.g]}${G.variant(cur.g, cur.o) ? ', ' + G.variant(cur.g, cur.o) : ''} · giv nummer ${fmt(cur.seed)}`));
  };
  // Ljud av och på med ett tryck (volymerna kommer tillbaka när ljudet sätts på igen)
  G.muted = () => !Settings.sfx && !Settings.music && !Settings.voice;
  G.toggleSound = () => {
    if (G.muted()) {
      const u = Settings.unmute || {};
      Object.assign(Settings, {sfx: u.sfx || .8, music: u.music != null ? u.music : .35, voice: u.voice != null ? u.voice : true});
      delete Settings.unmute;
    } else {
      Settings.unmute = {sfx: Settings.sfx, music: Settings.music, voice: Settings.voice};
      Object.assign(Settings, {sfx: 0, music: 0, voice: false});
      Voice.stop && Voice.stop();
    }
    saveSettings();
    Sound.setVolumes();
    Sound.music();
    UI.toast(G.muted() ? 'Ljudet är avstängt.' : 'Ljudet är på.');
  };
  function soundItem(item) { item(G.muted() ? 'sound' : 'mute', G.muted() ? 'Sätt på ljudet' : 'Stäng av ljudet', () => G.toggleSound()); }
  return G;
})();

/* ---- 13-menu.js ---- */
/* ================= Menyerna: startskärmen, val, inställningar och statistik ================= */
const Menu = (() => {
  const M = {};
  let screen = 'title';

  // En ny version av spelet har tagit över (service workern): ladda om, men bara på startskärmen
  const newVersion = () => typeof window !== 'undefined' && window.__pkNewVersion && !Game.active();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && screen === 'title' && !UI.sheetOpen() && newVersion()) location.reload(); });
  M.show = name => {
    if (name === 'title' && newVersion()) { location.reload(); return; }
    screen = name;
    $('scrMenu').hidden = name === 'table';
    $('scrTable').hidden = name !== 'table';
    document.body.dataset.screen = name;
    $('scrMenu').scrollTop = 0;
    if (name !== 'table') document.body.style.removeProperty('--toast-bottom');
    // i menyerna går det att nypa för att förstora, vid bordet inte (där skulle det störa korten)
    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover' + (name === 'table' ? ', maximum-scale=1, user-scalable=no' : ''));
    if (name === 'title') { title(); Sound.music(); if (typeof Lobby !== 'undefined' && Lobby.onTitle) Lobby.onTitle(); }
    if (name !== 'table' && typeof Lobby !== 'undefined' && Lobby.hideStrip && !(Game.info() && Game.info().race)) Lobby.hideStrip();
  };
  M.screen = () => screen;

  /* ---------- Små kontroller ---------- */
  M.seg = (opts, value, onChange, cls = '') => {
    const box = h('div', {class: 'seg ' + cls, role: 'radiogroup'});
    const set = v => { value = v; [...box.children].forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); }); };
    opts.forEach(([v, label, sub]) => {
      const b = h('button', {type: 'button', class: 'segb', role: 'radio', dataset: {v: String(v)}}, h('span', {}, label), sub ? h('small', {}, sub) : null);
      b.onclick = () => { Sound.play('click'); set(v); onChange(v); };
      box.append(b);
    });
    set(value);
    return box;
  };
  M.toggle = (label, value, onChange, sub = '') => {
    const input = h('input', {type: 'checkbox', role: 'switch'});
    input.checked = !!value;
    input.onchange = () => { Sound.play('click'); onChange(input.checked); };
    return h('label', {class: 'toggle'}, h('span', {class: 'tl'}, h('b', {}, label), sub ? h('small', {}, sub) : null), input, h('span', {class: 'sw'}));
  };
  M.range = (label, value, onChange) => {
    const input = h('input', {type: 'range', min: 0, max: 1, step: .05, 'aria-label': label});
    input.value = value;
    const fill = () => input.style.setProperty('--v', (input.value * 100) + '%');
    input.oninput = () => { fill(); onChange(+input.value); };
    fill();
    return h('label', {class: 'range'}, h('span', {class: 'tl'}, h('b', {}, label)), input);
  };
  M.dealSeg = onChange => M.seg([['easy', 'Lätta'], ['win', 'Går att vinna'], ['any', 'Helt slumpade']], ['easy', 'win', 'any'].includes(Settings.deals) ? Settings.deals : 'win', onChange);
  M.field = (label, node, sub) => h('div', {class: 'field'}, h('div', {class: 'flabel'}, label), node, sub ? h('small', {class: 'fsub'}, sub) : null);

  /* ---------- Patiensernas val ---------- */
  const DEF = {klondike: {draw: 1, passes: 0}, spider: {suits: 1}, freecell: {}, pyramid: {passes: 3}, tripeaks: {wrap: true}, aces: {}};
  M.optsFor = g => Object.assign({}, DEF[g], Store.get('opts.' + g, {}));
  const saveOpts = (g, o) => Store.set('opts.' + g, o);
  M.DESC = {
    klondike: 'Den klassiska patiensen, även kallad Klondike.',
    spider: 'Bygg hela sviter från kung till ess. Två kortlekar.',
    freecell: 'Alla kort syns från början. Nästan alla givar går att vinna.',
    pyramid: 'Plocka bort kort två och två som blir 13 tillsammans.',
    tripeaks: 'Lägg kort som är ett högre eller ett lägre. Snabb och lätt.',
    aces: 'Släng kort tills bara de fyra essen är kvar. Enkla regler.'
  };
  const summary = g => {
    const o = M.optsFor(g);
    if (g === 'klondike') return (o.draw === 3 ? 'Dra 3 kort' : 'Dra 1 kort') + (o.passes ? ` · ${o.passes === 1 ? 'ett varv' : 'tre varv'}` : '') + (Settings.deals === 'easy' ? ' · lätta givar' : Settings.deals === 'any' ? ' · slumpade givar' : '');
    if (g === 'spider') return o.suits === 1 ? 'En färg (lättast)' : o.suits === 2 ? 'Två färger' : 'Fyra färger (svårast)';
    if (g === 'pyramid') return o.passes === 0 ? 'Obegränsat med varv' : o.passes === 1 ? 'Ett varv' : 'Tre varv';
    if (g === 'tripeaks') return o.wrap ? 'Ess och kung hänger ihop' : 'Ess och kung hänger inte ihop';
    if (g === 'aces') return Settings.deals === 'any' ? 'Helt slumpade givar' : 'Givar som går att vinna';
    return 'Givar som i Windows';
  };
  // Val för en patiens: {g, then} (then: 'start' startar direkt efteråt)
  M.gameOpts = (g, start = true) => {
    const o = M.optsFor(g);
    const body = h('div', {class: 'setup'});
    if (g === 'klondike') {
      body.append(M.field('Hur många kort vänds upp från talongen', M.seg([[1, 'Ett kort', 'lättare'], [3, 'Tre kort', 'klassiskt, svårare']], o.draw, v => { o.draw = v; })));
      body.append(M.field('Hur många gånger talongen kan gås igenom', M.seg([[0, 'Hur många som helst'], [3, 'Tre gånger'], [1, 'En gång']], o.passes, v => { o.passes = v; }), 'Med färre varv blir det svårare (då kan det hända att en giv inte går att vinna).'));
    } else if (g === 'spider') {
      body.append(M.field('Antal färger', M.seg([[1, 'En', 'lättast'], [2, 'Två', 'lagom'], [4, 'Fyra', 'svårast']], o.suits, v => { o.suits = v; })));
    } else if (g === 'pyramid') {
      body.append(M.field('Hur många gånger talongen kan gås igenom', M.seg([[3, 'Tre gånger'], [0, 'Hur många som helst'], [1, 'En gång']], o.passes, v => { o.passes = v; })));
    } else if (g === 'tripeaks') {
      body.append(M.toggle('Ess och kung hänger ihop', o.wrap, v => { o.wrap = v; }, 'Då kan en kung läggas på ett ess och tvärtom.'));
    } else if (g === 'freecell') {
      body.append(h('p', {class: 'muted'}, 'Givarna är numrerade som i Windows (1–32 000), och alla utom en går att vinna.'));
    } else if (g === 'aces') {
      body.append(h('p', {class: 'muted'}, 'Med helt slumpade kort går bara ungefär var fjärde giv att vinna, även med bästa tänkbara val. Välj givar som går att vinna, så finns det alltid en väg.'));
    }
    if (g === 'klondike') body.append(M.field('Givar', M.dealSeg(v => { Settings.deals = v; saveSettings(); }), 'Lätta: givar som vinns med vanliga, självklara drag. Går att vinna: datorn har räknat ut att det går. Helt slumpade: som med riktiga kort, ibland går det inte.'));
    else if (g === 'pyramid' || g === 'tripeaks' || g === 'aces' || (g === 'spider' && Deals.has('spider', o))) body.append(M.field('Givar', M.seg([['win', 'Går att vinna'], ['any', 'Helt slumpade']], Settings.deals === 'any' ? 'any' : 'win', v => { Settings.deals = v === 'win' && Settings.deals === 'easy' ? 'easy' : v; saveSettings(); }), 'Datorn har räknat ut att givarna går att vinna. Helt slumpade givar är som med riktiga kort: ibland går det inte.'));
    else if (g === 'spider') body.append(h('p', {class: 'muted'}, 'Givarna i Spindelharpan är slumpade. Med en färg går nästan alla att vinna, med fyra färger är det svårt.'));
    if (g === 'spider') body.append(h('p', {class: 'muted'}, 'Med fyra färger är även de givar som går att vinna mycket svåra.'));
    // en viss giv (t.ex. samma som någon annan)
    const num = h('input', {type: 'text', inputmode: 'numeric', maxlength: 7, placeholder: 'Nummer', class: 'numinput', 'aria-label': 'Givens nummer'});
    const playNum = UI.btn('Spela', async () => {
      const n = parseInt(num.value.replace(/\D/g, ''), 10);

      saveOpts(g, o); sheet.close();

    }, {cls: 'small'});
    body.append(M.field('Spela en viss giv', h('div', {class: 'numrow'}, num, playNum), 'Samma nummer ger samma giv, så du kan spela samma som någon annan.'));
    // (valen sparas också när rutan stängs med krysset)
    const sheet = UI.sheet({title: Game.NAMES[g], cls: 'setupsheet', body, onClose: () => { saveOpts(g, o); if (!start && screen === 'title') title(); }, buttons: [{label: start ? 'Börja spela' : 'Spara', cls: 'gold', icon: start ? 'play' : 'check', onClick: () => { saveOpts(g, o); if (start) startGame(g, o); else title(); }}]});
  };
  // Finns det en påbörjad giv som försvinner om en ny börjar? Samma fråga från alla vägar (patiensrutorna,
  // dagens patiens, en viss giv och länkar). Ger true om den nya får börja. Väljer man den gamla fortsätter den.
  M.confirmReplace = async (newLabel, g = null) => {
